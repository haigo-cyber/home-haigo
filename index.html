/* ============ ARBEITSBEREICH (ehemals Notizen-Reiter) ============ */
/* Dokumente aus Blöcken (Text, Überschrift, Gliederung, Tabelle), Fokus-Notiz in der Heute-Ansicht,
   Gantt-Ansicht direkt aus den Punkten (Start, Laufzeit, Deadline, Meta-Projekt).
   Speicherung: Tabellenblatt "Workspace" in der ToDo-Tabelle, JSON auf mehrere Zellen verteilt (Zellgrenze 50000 Zeichen). */
const WS_TAB = "Workspace";
const WS_CHUNK = 40000;
const WS_MAXROWS = 2000;

/* WS-PURE-START */
let _wsCnt = 0;
function wsId(){ return Date.now().toString(36) + (++_wsCnt).toString(36) + Math.random().toString(36).slice(2,5); }
function wsNewNode(text){ return {id:wsId(), text:text||"", done:false, collapsed:false, date:"", ld:"", dur:0, dl:"", meta:false, hid:false, tag:"", link:null, aopen:false, att:[], children:[]}; }
/* Anhang an einem Punkt: Text (auch als Notiz nutzbar) oder Tabelle; trägt wie ein Punkt Datum, Erledigt-Haken und Verknüpfung */
function wsNewAtt(type){
  const a = {id:wsId(), type:type, title:"", done:false, date:"", link:null};
  if(type==="table"){ a.cols = ["Spalte 1","Spalte 2"]; a.rows = [["",""],["",""]]; } else a.text = "";
  return a;
}
function wsIsAtt(x){ return !!x && !Array.isArray(x.children) && typeof x.done==="boolean" && (x.type==="text" || x.type==="table"); }   // Blöcke haben kein done
function wsTitleOf(x){
  if(!x) return "";
  if(!wsIsAtt(x)) return (x.text||"").trim();
  if((x.title||"").trim()) return x.title.trim();
  return x.type==="text" ? (x.text||"").trim().split("\n")[0].slice(0,80) : "";
}
function wsSetTitle(x, v){ if(wsIsAtt(x)) x.title = v; else x.text = v; }
function wsNormAtt(a){
  if(!a || typeof a!=="object" || (a.type!=="text" && a.type!=="table")) return null;
  const o = {id:a.id||wsId(), type:a.type, title:String(a.title||""), done:!!a.done, date:wsIsDate(a.date)?a.date:"", link:wsNormLink(a.link)};
  if(a.type==="text") o.text = String(a.text||"");
  else{
    o.cols = (Array.isArray(a.cols) && a.cols.length) ? a.cols.map(String) : ["Spalte 1"];
    o.rows = (Array.isArray(a.rows)?a.rows:[]).map(r=>{ const row=(Array.isArray(r)?r:[]).map(String); while(row.length<o.cols.length) row.push(""); return row.slice(0,o.cols.length); });
  }
  return o;
}
function wsAddDays(d, k){
  const t = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)+k);
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
/* Tag, an dem das verknüpfte ToDo / Tages-Ziel gilt: bei gesetzter Deadline deren Tag (ld), sonst der Start */
function wsLinkDay(x){ return x.ld || x.date || ""; }
function wsSetLinkDay(x, d){ if(x.ld || x.dl) x.ld = d; else x.date = d; }
/* gewünschter Tag der Verknüpfung: neu -> Deadline, sonst Start, sonst heute; bestehend -> folgt einer neuen/geänderten Deadline, ohne Deadline dem Start */
function wsPlanDay(n, date0, newDl, isLinked, today){
  if(!isLinked) return newDl || date0 || today;
  if(newDl) return newDl!==(n.dl||"") ? newDl : wsLinkDay(n);
  return date0;
}
/* Zeitraum eines Punktes: Start + Laufzeit (Kalendertage) ergibt das Ende; ohne Start rückwärts von der Deadline */
function wsSpan(n){
  const s = n.date||"", dl = n.dl||"", dur = n.dur>0 ? Math.floor(n.dur) : 0;
  if(s && dur) return {start:s, end:wsAddDays(s,dur-1), dl};
  if(s) return {start:s, end:(dl && dl>=s) ? dl : s, dl};
  if(dl && dur) return {start:wsAddDays(dl,-(dur-1)), end:dl, dl};
  if(dl) return {start:dl, end:dl, dl};
  return null;
}
function wsAllNodes(doc){
  const out = [];
  const walk = (items)=>items.forEach(n=>{ out.push(n); walk(n.children); });
  doc.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items); });
  return out;
}
/* Punkt oder Anhang anhand der ID */
function wsFindAny(doc, id){
  const r = wsFindNode(doc, id); if(r) return r.node;
  for(const n of wsAllNodes(doc)){ const a = n.att.find(x=>x.id===id); if(a) return a; }
  return null;
}
function wsAttOwner(doc, aid){ return wsAllNodes(doc).find(n=>n.att.some(a=>a.id===aid)) || null; }
function wsIsDate(s){ return typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
/* link: Verknüpfung mit einem ToDo (Sheet-Zeile) oder Tages-Ziel (Google Task); evId/calId: vom Punkt selbst angelegter Kalendertermin (nur Ziele) */
function wsNormLink(l){
  if(!l || typeof l!=="object") return null;
  if((l.kind!=="todo" && l.kind!=="goal") || !l.ref) return null;
  return {kind:l.kind, ref:String(l.ref), cal:!!l.cal, evId:String(l.evId||""), calId:String(l.calId||"")};
}
function wsShortDate(d){
  if(!wsIsDate(d)) return "";
  const dt = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
  return ["So","Mo","Di","Mi","Do","Fr","Sa"][dt.getDay()] + " " + d.slice(8,10) + "." + d.slice(5,7) + ".";
}
function wsCollectLinkedNodes(list, out){
  out = out || [];
  (list||[]).forEach(n=>{ if(n.link) out.push(n); (n.att||[]).forEach(a=>{ if(a.link) out.push(a); }); wsCollectLinkedNodes(n.children, out); });
  return out;
}
function wsDocLinkedNodes(doc){
  const out = [];
  doc.blocks.forEach(b=>{ if(b.type==="outline") wsCollectLinkedNodes(b.items, out); });
  return out;
}
function wsFindByLink(docs, kind, ref){
  for(const doc of docs){
    for(const n of wsDocLinkedNodes(doc)){
      if(n.link.kind===kind && n.link.ref===ref) return {doc, node:n};
    }
  }
  return null;
}
function wsNewDoc(title){
  const now = new Date().toISOString();
  return {id:wsId(), title:title||"Neues Dokument", pinned:false, tag:"", createdAt:now, updatedAt:now, blocks:[]};
}
function wsNewBlock(type){
  if(type==="text") return {id:wsId(), type:"text", text:""};
  if(type==="heading") return {id:wsId(), type:"heading", text:"", tag:""};
  if(type==="outline") return {id:wsId(), type:"outline", items:[wsNewNode("")]};
  if(type==="table") return {id:wsId(), type:"table", cols:["Spalte 1","Spalte 2","Spalte 3"], rows:[["","",""],["","",""]]};
  return null;
}
function wsNormNodes(a){
  return (Array.isArray(a)?a:[]).filter(n=>n && typeof n==="object").map(n=>({
    id:n.id||wsId(), text:String(n.text||""), done:!!n.done, collapsed:!!n.collapsed,
    date:wsIsDate(n.date)?n.date:"", ld:wsIsDate(n.ld)?n.ld:"", dur:(n.dur>0 && n.dur<=3660)?Math.floor(n.dur):0, dl:wsIsDate(n.dl)?n.dl:"", meta:!!n.meta, hid:!!n.hid, tag:wsNormTag(n.tag),
    link:wsNormLink(n.link), aopen:!!n.aopen, att:(Array.isArray(n.att)?n.att:[]).map(wsNormAtt).filter(Boolean), children:wsNormNodes(n.children)
  }));
}
function wsNormalizeDocs(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(d=>d && typeof d==="object").map(d=>{
    const doc = {id:d.id||wsId(), title:String(d.title||""), pinned:!!d.pinned, tag:wsNormTag(d.tag),
      createdAt:d.createdAt||new Date().toISOString(), updatedAt:d.updatedAt||d.createdAt||new Date().toISOString(), blocks:[]};
    (Array.isArray(d.blocks)?d.blocks:[]).forEach(b=>{
      if(!b || typeof b!=="object") return;
      const id = b.id||wsId();
      if(b.type==="text") doc.blocks.push({id, type:b.type, text:String(b.text||"")});
      else if(b.type==="heading") doc.blocks.push({id, type:b.type, text:String(b.text||""), tag:wsNormTag(b.tag)});
      else if(b.type==="outline") doc.blocks.push({id, type:"outline", items:wsNormNodes(b.items)});
      else if(b.type==="table"){
        const cols = (Array.isArray(b.cols) && b.cols.length) ? b.cols.map(String) : ["Spalte 1"];
        const rows = (Array.isArray(b.rows)?b.rows:[]).map(r=>{
          const row = (Array.isArray(r)?r:[]).map(String);
          while(row.length<cols.length) row.push("");
          return row.slice(0, cols.length);
        });
        doc.blocks.push({id, type:"table", cols, rows});
      }
    });
    return doc;
  });
}

/* ---- Speicherformat: JSON in Stücken zu je WS_CHUNK Zeichen ---- */
function wsSerialize(docs){ return JSON.stringify({v:1, savedAt:new Date().toISOString(), docs}); }
function wsParse(text){
  if(!text || !text.trim()) return [];
  const data = JSON.parse(text);               // Fehler absichtlich nicht abfangen: kaputte Daten dürfen nie als "leer" gelten
  if(Array.isArray(data)) return wsNormalizeDocs(data);
  if(data && Array.isArray(data.docs)) return wsNormalizeDocs(data.docs);
  throw new Error("Unbekanntes Format im Tabellenblatt Workspace");
}
function wsToChunks(json){
  const out = []; let i = 0;
  while(i < json.length){
    let end = Math.min(i + WS_CHUNK, json.length);
    if(end < json.length){
      // keine Aufteilung mitten in einem Surrogatpaar und nicht neben einem Leerzeichen (Zellen könnten Leerraum am Rand verlieren)
      const c = json.charCodeAt(end-1);
      if(c>=0xD800 && c<=0xDBFF) end--;
      while(end>i+1 && (json[end-1]===" " || json[end]===" ")) end--;
    }
    out.push(json.slice(i, end)); i = end;
  }
  if(!out.length) out.push("[]");
  return out;
}
function wsFromChunks(rows){ return (rows||[]).map(r=>(r && r[0]!==undefined) ? r[0] : "").join(""); }

/* ---- Abgleich mit dem Serverstand (server-first, nur lokal geänderte Dokumente gewinnen) ---- */
function wsMergeDocs(local, server, dirty, deleted){
  const sMap = new Map(server.map(d=>[d.id, d]));
  const out = []; const seen = new Set();
  local.forEach(d=>{
    if(dirty.has(d.id)){ out.push(d); seen.add(d.id); }
    else if(sMap.has(d.id)){ out.push(sMap.get(d.id)); seen.add(d.id); }
    // weder lokal geändert noch auf dem Server: anderswo gelöscht, also weglassen
  });
  server.forEach(d=>{ if(!seen.has(d.id) && !deleted.has(d.id)) out.push(d); });
  return out;
}
function wsFixPinned(docs){
  const pinned = docs.filter(d=>d.pinned);
  if(pinned.length>1){
    pinned.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    pinned.slice(1).forEach(d=>{ d.pinned = false; });
  }
  return docs;
}

/* ---- Gliederung ---- */
function wsFindIn(list, nid, block, parent){
  for(let i=0;i<list.length;i++){
    const n = list[i];
    if(n.id===nid) return {block, list, index:i, node:n, parent};
    const r = wsFindIn(n.children, nid, block, n);
    if(r) return r;
  }
  return null;
}
function wsFindNode(doc, nid){
  for(const b of doc.blocks){
    if(b.type!=="outline") continue;
    const r = wsFindIn(b.items, nid, b, null);
    if(r) return r;
  }
  return null;
}
function wsContains(node, nid){ return node.id===nid || node.children.some(c=>wsContains(c, nid)); }
/* pos: "before" | "after" | "into". Der Teilbaum (alle Unterpunkte) wandert immer mit. */
function wsMoveNode(doc, nid, targetId, pos){
  if(nid===targetId) return false;
  const src = wsFindNode(doc, nid); if(!src) return false;
  if(wsContains(src.node, targetId)) return false;       // nie in den eigenen Teilbaum
  if(!wsFindNode(doc, targetId)) return false;
  const [node] = src.list.splice(src.index, 1);
  const tgt = wsFindNode(doc, targetId);
  if(pos==="into"){ tgt.node.children.push(node); tgt.node.collapsed = false; }
  else tgt.list.splice(tgt.index + (pos==="after"?1:0), 0, node);
  return true;
}
function wsIndent(doc, nid){
  const src = wsFindNode(doc, nid); if(!src || src.index===0) return false;
  const prev = src.list[src.index-1];
  src.list.splice(src.index, 1);
  prev.children.push(src.node); prev.collapsed = false;
  return true;
}
function wsOutdent(doc, nid){
  const src = wsFindNode(doc, nid); if(!src || !src.parent) return false;
  const par = wsFindNode(doc, src.parent.id);
  src.list.splice(src.index, 1);
  par.list.splice(par.index+1, 0, src.node);
  return true;
}
function wsAddSibling(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return null;
  const n = wsNewNode("");
  src.list.splice(src.index+1, 0, n);
  return n;
}
function wsAddChild(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return null;
  const n = wsNewNode("");
  src.node.children.push(n); src.node.collapsed = false;
  return n;
}
function wsDeleteNode(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return false;
  src.list.splice(src.index, 1); return true;
}
function wsCount(node){
  let done = 0, total = 0;
  node.children.forEach(c=>{ total++; if(c.done) done++; const s = wsCount(c); total += s.total; done += s.done; });
  return {done, total};
}
function wsAllDone(n){ return n.done && n.children.every(wsAllDone); }
/* Nächste offene Schritte: Blätter bzw. Knoten, deren Unterpunkte alle erledigt sind, in Dokumentreihenfolge */
function wsNextOpen(doc, max){ return wsNextOpenItems(doc, max).map(n=>n.text.trim()); }
function wsNextOpenItems(doc, max, vis, sort){
  const out = [];
  const walk = (items)=>{
    for(const n of (sort ? sort(items) : items)){
      if(out.length>=max) return;
      if(n.done) continue;
      if(vis && !vis(n)) continue;
      const open = n.children.filter(c=>!wsAllDone(c));
      if(n.children.length && open.length) walk(n.children);
      else if((n.text||"").trim()) out.push(n);
    }
  };
  doc.blocks.filter(b=>b.type==="outline").forEach(b=>walk(b.items));
  return out;
}
function wsOpenCount(doc){
  let n = 0;
  const walk = (items)=>items.forEach(i=>{ if(!i.done && (i.text||"").trim()) n++; walk(i.children); });
  doc.blocks.filter(b=>b.type==="outline").forEach(b=>walk(b.items));
  return n;
}

/* ---- Gantt-Zeilen aus der Gliederung ---- */
function wsGanttRows(roots, sel, em, sort){
  const rows = [];
  const walk = (n, level)=>{
    if(wsAllDone(n)) return null;
    if(sel && !wsTagShownNode(n, sel, em)) return null;
    const own = wsSpan(n);
    const row = {id:n.id, title:(n.text||"").trim()||"(ohne Titel)", level, meta:!!n.meta, own, start:null, end:null, agg:false, dl:n.dl||"", late:false};
    rows.push(row);
    let lo = own ? own.start : null, hi = own ? own.end : null;
    (sort ? sort(n.children) : n.children).forEach(c=>{
      const r = walk(c, level+1);
      if(r && r.start){ if(!lo || r.start<lo) lo = r.start; if(!hi || r.end>hi) hi = r.end; }
    });
    if(lo){ row.start = lo; row.end = hi; row.agg = !own || lo!==own.start || hi!==own.end; }
    if(row.dl && row.end && row.end>row.dl) row.late = true;
    if(!row.start && !row.meta){ rows.splice(rows.indexOf(row), 1); return null; }
    return row;
  };
  (sort ? sort(roots) : roots).forEach(n=>walk(n, 0));
  return rows;
}
/* oberste Meta-Projekte (nicht verschachtelt gesammelt) aus allen Dokumenten */
function wsMetaRoots(docs){
  const out = [];
  const walk = (items)=>items.forEach(n=>{ if(n.meta) out.push(n); else walk(n.children); });
  docs.forEach(d=>d.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items); }));
  return out;
}

/* ---- Blöcke und Tabellen ---- */
function wsMoveBlock(doc, bid, targetBid, pos){
  if(bid===targetBid) return false;
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return false;
  if(doc.blocks.findIndex(b=>b.id===targetBid)<0) return false;
  const [b] = doc.blocks.splice(i, 1);
  const t = doc.blocks.findIndex(x=>x.id===targetBid);
  doc.blocks.splice(t + (pos==="after"?1:0), 0, b);
  return true;
}
function wsMoveRow(block, from, to, pos){
  if(from===to || from<0 || to<0 || from>=block.rows.length || to>=block.rows.length) return false;
  const [r] = block.rows.splice(from, 1);
  const t = from<to ? to-1 : to;
  block.rows.splice(t + (pos==="after"?1:0), 0, r);
  return true;
}
function wsAddCol(block){ block.cols.push("Spalte "+(block.cols.length+1)); block.rows.forEach(r=>r.push("")); }
function wsDelCol(block, ci){
  if(block.cols.length<=1 || ci<0 || ci>=block.cols.length) return false;
  block.cols.splice(ci, 1); block.rows.forEach(r=>r.splice(ci, 1)); return true;
}
function wsAddRow(block, after){
  const row = block.cols.map(()=> "");
  const idx = (after===undefined || after===null) ? block.rows.length : after+1;
  block.rows.splice(idx, 0, row); return idx;
}

/* ---- Ansicht: Ausblenden und Filtern (rein) ---- */
function wsFNorm(f){
  f = (f && typeof f==="object") ? f : {};
  return {lvl:(f.lvl>=1 && f.lvl<=3)?Math.floor(f.lvl):0, hideDone:!!f.hideDone, dated:!!f.dated,
    due:(f.due==="today"||f.due==="week")?f.due:"", meta:!!f.meta, noAtt:!!f.noAtt, q:String(f.q||"").trim().slice(0,80), showHid:!!f.showHid,
    manual:!!f.manual, notes:!!f.notes, noTab:!!f.noTab,
    tag:(f.tag==="!none") ? "!none" : wsTagKey(f.tag).slice(0,40)};
}
function wsHasCrit(f){ return !!(f.dated || f.due || f.meta || f.q || f.tag); }
function wsFActive(f){ return (f.lvl?1:0)+(f.hideDone?1:0)+(f.dated?1:0)+(f.due?1:0)+(f.meta?1:0)+(f.noAtt?1:0)+(f.q?1:0)+(f.showHid?1:0)+(f.manual?1:0)+(f.notes?1:0)+(f.noTab?1:0); }
function wsNodeDue(n){ return n.dl || n.ld || n.date || ""; }
function wsNodeMatch(n, f, today, eff){
  if(f.tag && !wsTagMatch(eff, f.tag)) return false;
  if(f.dated && !(n.date || n.ld || n.dl || n.dur)) return false;
  if(f.meta && !n.meta) return false;
  if(f.due){
    if(n.done) return false;
    const d = wsNodeDue(n); if(!d) return false;
    const lim = f.due==="today" ? today : wsAddDays(today, 7);
    if(d>lim) return false;
  }
  if(f.q){
    const q = f.q.toLowerCase();
    let hay = (n.text||"")+" "+(n.att||[]).map(a=>(a.title||"")+" "+(a.text||"")).join(" ");
    if(!hay.toLowerCase().includes(q)) return false;
  }
  return true;
}
function wsNodeShown(n, f, today, inh){
  if(n.hid && !f.showHid) return false;
  if(f.hideDone && wsAllDone(n)) return false;
  if(!wsHasCrit(f)) return true;
  const eff = n.tag || inh || "";
  if(!(n.text||"").trim() && !n.children.length && wsTagMatch(eff, f.tag)) return true;
  if(wsNodeMatch(n, f, today, eff)) return true;
  return n.children.some(c=>wsNodeShown(c, f, today, eff));
}
function wsSubCount(n){ return 1 + n.children.reduce((s,c)=>s+wsSubCount(c), 0); }
function wsHiddenCount(items, f, today, inh){
  let k = 0;
  for(const n of items){ const eff = n.tag || inh || ""; if(!wsNodeShown(n, f, today, inh)) k += wsSubCount(n); else k += wsHiddenCount(n.children, f, today, eff); }
  return k;
}

/* ---- Deadlines aus den Punkten des Arbeitsbereichs (rein) ---- */
function wsDayDiff(from, to){
  const p = s=>{ const a = s.split("-").map(Number); return Date.UTC(a[0], a[1]-1, a[2]); };
  return Math.round((p(to)-p(from))/86400000);
}
function wsDeadlineItems(docs, today){
  const out = [];
  docs.forEach(doc=>{
    wsAllNodes(doc).forEach(n=>{
      if(!n.dl || n.done) return;
      out.push({doc, node:n, dl:n.dl, days:wsDayDiff(today, n.dl)});
    });
  });
  out.sort((a,b)=> a.days-b.days || (a.node.text||"").localeCompare(b.node.text||""));
  return out;
}

/* ---- Tags (rein) ---- */
function wsNormTag(s){ return String(s||"").replace(/\s+/g," ").trim().slice(0,30); }
function wsTagKey(s){ return wsNormTag(s).toLowerCase(); }
function wsTagMatch(eff, sel){ if(!sel) return true; const k = wsTagKey(eff); return sel==="!none" ? k==="" : k===sel; }
/* Tag eines Blocks: Überschrift gilt für sich und alle folgenden Blöcke bis zur nächsten Überschrift; sonst der Tag des Dokuments */
function wsBlockTags(doc){
  const out = {}; let sec = "";
  doc.blocks.forEach(b=>{
    if(b.type==="heading"){ sec = b.tag||""; out[b.id] = sec || doc.tag || ""; }
    else out[b.id] = sec || doc.tag || "";
  });
  return out;
}
/* Wirksamer Tag jedes Punkts: eigener Tag, sonst der des übergeordneten Punkts, sonst der des Blocks */
function wsEffTags(docs){
  const map = new Map();
  docs.forEach(doc=>{
    const bt = wsBlockTags(doc);
    const walk = (items, inh)=>items.forEach(n=>{ const e = n.tag||inh||""; map.set(n.id, e); walk(n.children, e); });
    doc.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items, bt[b.id]); });
  });
  return map;
}
function wsTagShownNode(n, sel, em){ return wsTagMatch(em.get(n.id), sel) || n.children.some(c=>wsTagShownNode(c, sel, em)); }
function wsAllTags(docs){
  const seen = new Map();
  const add = t=>{ const k = wsTagKey(t); if(k && !seen.has(k)) seen.set(k, wsNormTag(t)); };
  const walk = items=>items.forEach(n=>{ add(n.tag); walk(n.children); });
  docs.forEach(d=>{ add(d.tag); d.blocks.forEach(b=>{ if(b.type==="heading") add(b.tag); if(b.type==="outline") walk(b.items); }); });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b, "de"));
}
function wsDocHasTag(doc, sel){
  const bt = wsBlockTags(doc), em = wsEffTags([doc]);
  return doc.blocks.some(b=> b.type==="outline" ? b.items.some(n=>wsTagShownNode(n, sel, em)) : wsTagMatch(bt[b.id], sel));
}

/* ---- Dringlichkeit: Sortierung (rein) ---- */
/* frühester offener Tag im Punkt samt Unterpunkten: Deadline, Termin, Ende der Laufzeit; leer = nichts Terminiertes */
function wsUrgKey(n){
  let best = "";
  const take = d=>{ if(d && (!best || d<best)) best = d; };
  const walk = x=>{
    if(!x.done){
      take(x.dl); take(wsLinkDay(x));
      const sp = wsSpan(x); if(sp) take(sp.end);
      (x.att||[]).forEach(a=>{ if(!a.done) take(a.date); });
    }
    x.children.forEach(walk);
  };
  walk(n);
  return best;
}
/* Dringendstes zuerst; ohne Termin danach, Erledigtes ganz am Ende; bei Gleichstand bleibt die Reihenfolge */
function wsUrgSort(items){
  const rank = n=>{ if(wsAllDone(n)) return 2; return wsUrgKey(n) ? 0 : 1; };
  return items.map((n,i)=>({n, i, r:rank(n), k:wsUrgKey(n)}))
    .sort((a,b)=> a.r-b.r || (a.r===0 ? (a.k<b.k?-1:a.k>b.k?1:0) : 0) || a.i-b.i)
    .map(x=>x.n);
}
function wsDocUrgKey(doc){
  let best = "";
  doc.blocks.forEach(b=>{ if(b.type==="outline") b.items.forEach(n=>{ const k = wsUrgKey(n); if(k && (!best || k<best)) best = k; }); });
  return best;
}

let wsFOpen = (()=>{ try{ return localStorage.getItem("wsFOpen")==="1"; }catch(e){ return false; } })();
const wsColl = new Map();   // nur für diese Sitzung: Auf-/Zuklappen, solange ein Filter aktiv ist
function wsFSave(){ try{ localStorage.setItem("wsFilter", JSON.stringify(wsF)); }catch(e){} wsColl.clear(); }
function wsVis(n, inh){ return wsNodeShown(n, wsF, todayKey(), inh); }
const wsOpenMap = new Map();   // nur für diese Sitzung: einzeln auf- oder zugeklappte Notizen, Tabellen und Gliederungen

function wsFirstLine(t){ const s = String(t||"").trim().split("\n")[0]; return s.length>90 ? s.slice(0,90)+"…" : s; }
function wsSorter(){ return wsF.manual ? null : wsUrgSort; }

function wsEffCollapsed(n, depth){

let wsTab = localStorage.getItem("wsTab") || "docs";                 // docs | gantt | notes
if(!["docs","gantt","notes"].includes(wsTab)) wsTab = "docs";

function wsBlock(doc, bid){ return doc.blocks.find(b=>b.id===bid) || null; }

/* ---- Laden und Speichern (Google Sheets) ---- */
async function wsEnsureTab(){
  if(wsTabOk) return;
  const ss = await api(`${SHEETS}/${spreadsheetId}?fields=sheets(properties(title))`);
  const titles = (ss.sheets||[]).map(s=>s.properties?.title||"");
  if(!titles.includes(WS_TAB)){
    await api(`${SHEETS}/${spreadsheetId}:batchUpdate`, {method:"POST", body:JSON.stringify({requests:[{addSheet:{properties:{title:WS_TAB}}}]})});
    await new Promise(r=>setTimeout(r,400));
  }
  wsTabOk = true;
}
async function wsReadServer(){
  const res = await api(`${SHEETS}/${spreadsheetId}/values/${WS_TAB}!A1:A${WS_MAXROWS}`);
  const rows = res.values || [];
  return {docs: wsParse(wsFromChunks(rows)), rows: rows.length};
}
async function wsWriteServer(docs, rowsOnServer){
  const chunks = wsToChunks(wsSerialize(docs));
  if(chunks.length>WS_MAXROWS) throw new Error("Arbeitsbereich zu groß für das Tabellenblatt");
  await api(`${SHEETS}/${spreadsheetId}/values/${WS_TAB}!A1?valueInputOption=RAW`,
    {method:"PUT", body:JSON.stringify({values:chunks.map(c=>[c])})});
  if(chunks.length < rowsOnServer){
    await api(`${SHEETS}/${spreadsheetId}/values/${WS_TAB}!A${chunks.length+1}:A${WS_MAXROWS}:clear`, {method:"POST", body:"{}"});
  }
}
async function loadWorkspace(){
  try{
    await wsEnsureTab();
    const s = await wsReadServer();
    wsDocs = wsFixPinned(wsLoaded ? wsMergeDocs(wsDocs, s.docs, wsDirty, wsDeleted) : s.docs);
    wsLoaded = true; wsLoadError = ""; wsLastLoad = Date.now();
  }catch(e){
    console.error("❌ loadWorkspace FEHLER:", e.message);
    if(!wsLoaded) wsLoadError = e.message;
  }
}
function wsScheduleSave(){
  clearTimeout(wsSaveTimer); wsSetStatus("…");
  wsSaveTimer = setTimeout(wsFlush, 1000);
}
function wsFlush(){
  clearTimeout(wsSaveTimer); wsSaveTimer = null;
  wsSaveQueue = wsSaveQueue.then(wsSaveNow).catch(e=>console.error("wsFlush:", e));
  return wsSaveQueue;
}
async function wsSaveNow(){
  if(!wsDirty.size && !wsDeleted.size) return;
  if(!wsLoaded){ toast("Arbeitsbereich nicht geladen: Speichern gesperrt"); return; }
  const dSnap = new Map(wsDirty), xSnap = new Map(wsDeleted);
  setSync("busy"); wsSetStatus("speichert …");
  try{
    await wsEnsureTab();
    const s = await wsReadServer();                                     // server-first: erst den Stand der anderen Geräte holen
    wsDocs = wsFixPinned(wsMergeDocs(wsDocs, s.docs, wsDirty, wsDeleted));
    wsRefreshChips();                                                   // Dokumente von anderen Geräten sofort in der Auswahl zeigen
    await wsWriteServer(wsDocs, s.rows);
    dSnap.forEach((rev,id)=>{ if(wsDirty.get(id)===rev) wsDirty.delete(id); });
    xSnap.forEach((rev,id)=>{ if(wsDeleted.get(id)===rev) wsDeleted.delete(id); });
    wsLastLoad = Date.now();
    setSync("on"); wsSetStatus("gespeichert ✓");
  }catch(e){
    console.error("❌ wsSaveNow FEHLER:", e.message);
    setSync("on"); wsSetStatus("Speichern fehlgeschlagen");
    toast("Arbeitsbereich: Speichern fehlgeschlagen, neuer Versuch folgt");
    clearTimeout(wsRetryTimer); wsRetryTimer = setTimeout(wsFlush, 15000);
  }
}
function wsRefreshChips(){
  const box = document.querySelector(".ws-chips"); if(!box || view!=="notes" || wsTab!=="docs") return;
  const cur = wsCurrentDoc();
  box.innerHTML = wsChipsInner(cur);
}
function wsChipsInner(cur){
  return wsDocs.map(d=>`<button class="ws-chip${cur&&cur.id===d.id?" sel":""}" data-wsact="open-doc" data-id="${d.id}">${d.pinned?"📌 ":""}${esc(d.title||"Ohne Titel")}</button>`).join("")
    + `<button class="ws-chip new" data-wsact="new-doc">+ Neu</button>`;
}
/* Beim Zurückkehren in die App (z. B. am Handy) den Stand neu holen, solange nichts ungespeichert ist */
async function wsRefreshIfIdle(){
  if(!accessToken || !wsLoaded || wsDirty.size || wsDeleted.size) return;
  if(Date.now()-wsLastLoad < 30000) return;
  const ae = document.activeElement;
  if(ae && ae.closest && ae.closest(".ws-doc")) return;
  const before = JSON.stringify(wsDocs);
  await loadWorkspace();
  if(JSON.stringify(wsDocs)!==before && (view==="today" || view==="notes")) render();
}

/* ---- Darstellung ---- */
function wsDateTime(iso){
  try{ return new Date(iso).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
}
function wsNodeChips(n){
  const att = wsIsAtt(n);
  const sp = att ? null : wsSpan(n);
  const today = todayKey();
  let h = "";
  if(!att && n.meta) h += `<button class="ws-lnk ws-metachip" data-wsact="link-menu" title="Meta-Projekt (oberste Ebene im Gantt)">★</button>`;

    h += `<button class="ws-date${over?" over":""}" data-wsact="link-menu" title="Termine und Verknüpfung einstellen">${esc(wsShortDate(n.date))}${(!att && n.dur)?" +"+n.dur+"T":""}</button>`;
  }else if(sp){
    h += `<button class="ws-date" data-wsact="link-menu" title="Zeitraum rückwärts von der Deadline berechnet">${esc(wsShortDate(sp.start))} ➜</button>`;
  }
  if(!att && n.dl) h += `<button class="ws-date dl${sp && sp.end>n.dl?" over":""}" data-wsact="link-menu" title="Deadline${sp && sp.end>n.dl?": Laufzeit reicht darüber hinaus":""}">⚑ ${esc(wsShortDate(n.dl))}</button>`;
  if(n.link) h += `<button class="ws-lnk" data-wsact="link-menu" title="${n.link.kind==="goal"?"Verknüpft mit Tages-Ziel":"Verknüpft mit ToDo"}${wsLinkDay(n)?" am "+wsShortDate(wsLinkDay(n)):""}${n.link.cal?" und Kalender":""}">${n.link.kind==="goal"?"🎯":"☑"}${n.link.cal?"📆":""}${(n.ld && n.ld!==n.date)?" "+esc(wsShortDate(n.ld)):""}</button>`;
  if(!n.date && !n.link && !sp && !(!att && n.meta)) h += `<button class="ws-mini" data-wsact="link-menu" title="Termine setzen oder als ToDo / Tages-Ziel anlegen">📅</button>`;
  return h;
}

function wsAttsHtml(n){

function wsNodeHtml(n, depth, inh){
  depth = depth||0;
  const eff = n.tag || inh || "";
  const shown = (wsF.manual ? n.children : wsUrgSort(n.children)).filter(c=>wsVis(c, eff));
  const hasKids = shown.length>0;
  const coll = wsEffCollapsed(n, depth);
  const cnt = n.children.length ? wsCount(n) : null;
  const sub = (hasKids && !coll) ? `<ul class="ws-tree ws-sub">${shown.map(c=>wsNodeHtml(c, depth+1, eff)).join("")}</ul>` : "";
  return `<li class="ws-node${n.done?" done":""}${n.hid?" hid":""}" data-nid="${n.id}">
    <div class="ws-nrow">
      <span class="ws-handle sm" draggable="true" data-wsdrag="node" title="Ziehen: Punkt samt Unterpunkten verschieben">⠿</span>
      <button class="ws-tog" data-wsact="toggle" title="${hasKids?(coll?"Aufklappen":"Zuklappen"):""}">${hasKids?(coll?"▸":"▾"):"·"}</button>
      <button class="ws-chk${n.done?" on":""}" data-wsact="done" title="Erledigt">${n.done?"✓":""}</button>
      <input type="text" class="ws-in ws-nin" data-wsf="node" value="${esc(n.text)}" placeholder="Punkt">
      <span class="ws-nright">
      ${wsNodeChips(n)}
      ${cnt?`<span class="ws-cnt" title="erledigte Unterpunkte">${cnt.done}/${cnt.total}</span>`:""}
      ${wsF.noAtt?"":`<button class="ws-attbtn${n.att.length?" has":""}" data-wsact="att-toggle" title="Text, Notiz oder Tabelle an diesen Punkt anhängen">📎 ${n.att.length?n.att.length:"Anhang"}</button>`}
      <button class="ws-mini ws-tagb${n.tag?" on":""}" data-wsact="tag-node" title="Tag setzen (gilt auch für alle Unterpunkte und Anhänge)">🏷${n.tag?" "+esc(n.tag):""}</button>
      <button class="ws-mini ws-eye${n.hid?" on":""}" data-wsact="hide-node" title="${n.hid?"Wieder einblenden":"Ausblenden (unter Ansicht wieder einblendbar)"}">${n.hid?"🙈":"👁"}</button>

function wsBlockHtml(b, eff){
  let body = "";
  if(wsF.tag && b.type!=="outline" && !wsTagMatch(eff, wsF.tag)) return "";
  if(b.type==="text"){
    const open = wsFoldOpen(b.id, "text");
    body = wsFoldBtn(open, open ? "Notiz" : (esc(wsFirstLine(b.text)) || "(leere Notiz)"))
      + (open ? `<textarea class="ws-in ws-ta" data-wsf="text" rows="1" placeholder="Text">${esc(b.text)}</textarea>` : "");
  }else if(b.type==="heading"){
    body = `<input type="text" class="ws-in ws-h" data-wsf="text" value="${esc(b.text)}" placeholder="Überschrift">`;
  }else if(b.type==="outline"){
    const vis = (wsF.manual ? b.items : wsUrgSort(b.items)).filter(n=>wsVis(n, eff));
    if(wsF.tag && !vis.length) return "";
    const open = wsFoldOpen(b.id, "outline");
    body = wsFoldBtn(open, "Gliederung · "+b.items.length+(b.items.length===1?" Punkt":" Punkte"))
      + (open ? `${(b.items.length && !vis.length)?`<div class="ws-meta">Alle Punkte sind durch die Ansicht ausgeblendet.</div>`:""}<ul class="ws-tree">${vis.map(n=>wsNodeHtml(n, 0, eff)).join("")}</ul>
      <button class="ws-addbtn" data-wsact="add-root-node">+ Punkt</button>` : "");
  }else if(b.type==="table"){
    const open = wsFoldOpen(b.id, "table");
    body = wsFoldBtn(open, "Tabelle · "+b.rows.length+(b.rows.length===1?" Zeile":" Zeilen")) + (open ? wsTableBody(b, true) : "");
  }
  return `<div class="ws-block" data-bid="${b.id}" data-kind="${b.type}">

    <div class="ws-bbody">${body}</div>
    ${b.type==="heading"?`<button class="ws-x ws-tagb${b.tag?" on":""}" data-wsact="tag-block" title="Tag setzen (gilt für diese Überschrift und alle Blöcke bis zur nächsten Überschrift)">🏷${b.tag?" "+esc(b.tag):""}</button>`:""}
    <button class="ws-x" data-wsact="del-block" title="Block löschen">✕</button>

}
function wsFilterHtml(docs){

      <div class="ws-frow"><span class="ws-fl">Suche</span><input type="search" id="wsq" data-wsq="1" class="ws-in" value="${esc(wsF.q)}" placeholder="Text in Punkten und Anhängen"></div>

      <div class="ws-frow"><span class="ws-fl">Ebenen</span>
        ${ch("lvl",0,"alle",!wsF.lvl)}${ch("lvl",1,"1",wsF.lvl===1)}${ch("lvl",2,"1-2",wsF.lvl===2)}${ch("lvl",3,"1-3",wsF.lvl===3)}</div>
      <div class="ws-frow"><span class="ws-fl">Zeigen</span>
        ${ch("hideDone",1,"Erledigte aus",wsF.hideDone)}${ch("dated",1,"Nur mit Termin",wsF.dated)}
        ${ch("due","today","Heute fällig",wsF.due==="today")}${ch("due","week","Diese Woche",wsF.due==="week")}
        ${ch("meta",1,"Nur Meta",wsF.meta)}${ch("noAtt",1,"Anhänge aus",wsF.noAtt)}${ch("notes",1,"Notizen zeigen",wsF.notes)}${ch("noTab",1,"Tabellen zu",wsF.noTab)}${ch("showHid",1,"Ausgeblendete zeigen",wsF.showHid)}</div>
    </div>`;
  }
  return h;
}
function wsEditorHtml(doc, mode){

    h += `<div class="ws-toolbar">
      <input type="text" class="ws-in ws-doctitle" data-wsf="title" value="${esc(doc.title)}" placeholder="Titel des Dokuments">

  const bt = wsBlockTags(doc);

  h += `<div class="ws-blocks">${parts.length ? parts.join("") : (doc.blocks.length ? `<div class="ws-empty">In diesem Dokument ist nichts für diese Ansicht.</div>` : `<div class="ws-empty">Noch leer. Unten einen Block hinzufügen.</div>`)}</div>

      ${mode==="today"?`<span class="ws-status"></span>`:""}

function wsTodayInner(doc){
  const open = wsTodayExpanded;
  let h = `<div class="ws-head" data-wsact="today-toggle">
    <span class="ws-title">${esc(doc.title||"Ohne Titel")}</span>
    <span class="ws-caret">${open?"▲ zuklappen":"▼ öffnen"}</span>
  </div>`;
  if(!open){
    const em = wsEffTags([doc]);
    const next = wsNextOpenItems(doc, 4, n=>wsVis(n, em.get(n.id)), wsSorter());
    h += `<div data-wsact="today-toggle" style="cursor:pointer">`;
    if(next.length){
      h += `<ul class="ws-prev">${next.map((n,i)=>`<li class="${i===0?"first":""}">${esc(n.text.trim())}${n.date?` <span class="ws-pd${n.date<todayKey()?" over":""}">${esc(wsShortDate(n.date))}</span>`:""}${n.link?` <span class="ws-pd">${n.link.kind==="goal"?"🎯":"☑"}</span>`:""}</li>`).join("")}</ul>`;
    }else{
      const lines = doc.blocks.filter(b=>(b.type==="text"||b.type==="heading") && (b.text||"").trim()).slice(0,3).map(b=>(b.text||"").trim().split("\n")[0]);
      h += lines.length ? `<ul class="ws-prev plain">${lines.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`
                        : `<div class="ws-meta">Nichts Offenes. Zum Bearbeiten aufklappen.</div>`;
    }
    const oc = wsOpenCount(doc);
    const tbl = doc.blocks.filter(b=>b.type==="table").length;
    h += `<div class="ws-meta">${oc} offene Punkte${tbl?` · ${tbl} Tabelle${tbl>1?"n":""}`:""}</div></div>`;
  }else{
    h += wsEditorHtml(doc, "today");
  }
  return h;
}
function wsTodayHtml(){

function wsDocsTabHtml(){
  if(!wsLoaded){
    return `<div class="empty">Der Arbeitsbereich konnte nicht geladen werden.${wsLoadError?`<br><span class="muted" style="font-size:12px">${esc(wsLoadError.slice(0,200))}</span>`:""}<br><br><button class="btn-ghost" style="flex:none;padding:10px 18px" data-wsact="retry-load">Erneut versuchen</button></div>`;
  }
  if(wsF.tag){
    let list = wsDocs.filter(d=>wsDocHasTag(d, wsF.tag));
    if(!wsF.manual){ list = list.map((d,i)=>({d,i,k:wsDocUrgKey(d)})).sort((a,b)=> (a.k?0:1)-(b.k?0:1) || (a.k<b.k?-1:a.k>b.k?1:0) || a.i-b.i).map(x=>x.d); }
    return wsTagBarHtml() + wsFilterHtml(list)
      + (list.length ? list.map(d=>`<div class="ws-card ws-mount" data-doc="${d.id}" data-mode="tab">${wsEditorHtml(d, "tab")}</div>`).join("")
                     : `<div class="empty">Kein Dokument hat Einträge mit diesem Tag.</div>`);

  const cur = wsCurrentDoc();

/* ---- Nacharbeiten nach dem Rendern ---- */
function wsAutosizeEl(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight+2)+"px"; }
function wsAfterRender(){
  document.querySelectorAll(".ws-ta").forEach(wsAutosizeEl);
  if(view==="notes" && wsTab==="gantt") wsGanttDraw();
  if(wsFocusSel){
    const el = document.querySelector(wsFocusSel); wsFocusSel = null;
    if(el){ el.focus(); try{ const n = el.value.length; el.setSelectionRange(n, n); }catch(e){} }
  }
}
function wsRerender(docId){
  if(wsF.tag && view==="notes" && wsTab==="docs"){ render(); return; }
  const doc = wsGet(docId);
  const mounts = document.querySelectorAll('.ws-mount[data-doc="'+docId+'"]');
  if(!doc || !mounts.length){ render(); return; }
  mounts.forEach(m=>{ m.innerHTML = m.dataset.mode==="today" ? wsTodayInner(doc) : wsEditorHtml(doc, "tab"); });
  wsAfterRender();
}

/* ---- Eingaben ---- */
/* Tabelle eines Eingabefelds: Anhang-Tabelle oder Tabellenblock */
function wsTableOf(doc, el){
  const ae = el.closest(".ws-att");
  if(ae) return wsFindAny(doc, ae.dataset.aid);
  const be = el.closest(".ws-block"); return be ? wsBlock(doc, be.dataset.bid) : null;
}
main.addEventListener("input", e=>{
  const el = e.target, f = el.dataset && el.dataset.wsf; if(!f) return;
  const docEl = el.closest(".ws-doc"); if(!docEl) return;
  const doc = wsGet(docEl.dataset.doc); if(!doc) return;
  if(f==="title") doc.title = el.value;
  else if(f==="text"){ const b = wsBlock(doc, el.closest(".ws-block").dataset.bid); if(b) b.text = el.value; if(el.tagName==="TEXTAREA") wsAutosizeEl(el); }
  else if(f==="node"){ const r = wsFindNode(doc, el.closest(".ws-node").dataset.nid); if(r) r.node.text = el.value; }
  else if(f==="atitle"){ const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.title = el.value; }
  else if(f==="atext"){ const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.text = el.value; if(el.tagName==="TEXTAREA") wsAutosizeEl(el); }
  else if(f==="col"){ const b = wsTableOf(doc, el); if(b) b.cols[+el.dataset.ci] = el.value; }
  else if(f==="cell"){ const b = wsTableOf(doc, el); if(b && b.rows[+el.dataset.ri]) b.rows[+el.dataset.ri][+el.dataset.ci] = el.value; }
  wsTouch(doc);
});
let wsQTimer = null;
main.addEventListener("input", e=>{
  const el = e.target; if(!(el.dataset && el.dataset.wsq)) return;
  clearTimeout(wsQTimer);
  wsQTimer = setTimeout(()=>{ wsF = wsFNorm({...wsF, q:el.value}); wsFSave(); wsFocusSel = "#wsq"; render(); }, 350);
});
main.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.wsf==="title"){
    const docEl = el.closest(".ws-doc"); const chip = document.querySelector('.ws-chip[data-id="'+(docEl?docEl.dataset.doc:"")+'"]');
    const doc = docEl ? wsGet(docEl.dataset.doc) : null;
    if(chip && doc) chip.textContent = (doc.pinned?"📌 ":"") + (doc.title||"Ohne Titel");
  }
  if(el.dataset && el.dataset.wsf==="atitle"){
    const docEl = el.closest(".ws-doc"); const doc = docEl ? wsGet(docEl.dataset.doc) : null;
    const a = doc ? wsFindAny(doc, el.closest(".ws-att").dataset.aid) : null;
    if(a && a.link) wsLinkRun(()=>wsSyncItem(doc, a, a.link.cal));
  }
  if(el.dataset && el.dataset.wsf==="atext"){
    const docEl = el.closest(".ws-doc"); const doc = docEl ? wsGet(docEl.dataset.doc) : null;
    const a = doc ? wsFindAny(doc, el.closest(".ws-att").dataset.aid) : null;
    if(a && a.link && !(a.title||"").trim()) wsLinkRun(()=>wsSyncItem(doc, a, a.link.cal));
  }
  if(el.dataset && el.dataset.wsf==="node"){
    const docEl = el.closest(".ws-doc"); const doc = docEl ? wsGet(docEl.dataset.doc) : null;
    const nodeEl = el.closest(".ws-node"); const r = (doc && nodeEl) ? wsFindNode(doc, nodeEl.dataset.nid) : null;
    if(r && r.node.link) wsLinkRun(()=>wsSyncItem(doc, r.node, r.node.link.cal));
  }
  if(el.id==="wsGanttSel"){ ganttSel = el.value; localStorage.setItem("ganttSel", ganttSel); wsGanttDraw(); }
});
main.addEventListener("keydown", e=>{
  const el = e.target, f = el.dataset && el.dataset.wsf; if(!f) return;
  const docEl = el.closest(".ws-doc"); if(!docEl) return;
  const doc = wsGet(docEl.dataset.doc); if(!doc) return;
  if(f==="node"){
    const nid = el.closest(".ws-node").dataset.nid;
    if(e.key==="Enter"){
      e.preventDefault();
      const n = wsAddSibling(doc, nid);
      if(n){ wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); }
    }else if(e.key==="Tab"){
      e.preventDefault();
      if(e.shiftKey ? wsOutdent(doc, nid) : wsIndent(doc, nid)){
        wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${nid}"] > .ws-nrow .ws-nin`; wsRerender(doc.id);
      }
    }else if(e.key==="Backspace" && el.value===""){
      const r = wsFindNode(doc, nid);
      if(r && r.node.children.length===0 && !r.node.link){
        e.preventDefault();
        const all = [...docEl.querySelectorAll(".ws-nin")]; const i = all.indexOf(el);
        const prev = i>0 ? all[i-1].closest(".ws-node").dataset.nid : null;
        wsDeleteNode(doc, nid); wsTouch(doc);
        if(prev) wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${prev}"] > .ws-nrow .ws-nin`;
        wsRerender(doc.id);
      }
    }else if((e.key==="ArrowUp" || e.key==="ArrowDown") && !e.shiftKey && !e.altKey && !e.ctrlKey){
      const all = [...docEl.querySelectorAll(".ws-nin")]; const i = all.indexOf(el);
      const t = all[i + (e.key==="ArrowUp"?-1:1)];
      if(t){ e.preventDefault(); t.focus(); }
    }
  }else if(f==="cell" && e.key==="Enter"){
    e.preventDefault();
    const b = wsTableOf(doc, el); if(!b) return;
    const ri = +el.dataset.ri, ci = +el.dataset.ci;
    if(ri>=b.rows.length-1){ wsAddRow(b); wsTouch(doc); }
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-${wsIsAtt(b)?"aid":"bid"}="${b.id}"] input[data-wsf="cell"][data-ri="${ri+1}"][data-ci="${ci}"]`;
    wsRerender(doc.id);
  }
});

/* ---- Klicks ---- */
main.addEventListener("click", e=>{
  const tab = e.target.closest("[data-wstab]");
  if(tab){ wsTab = tab.dataset.wstab; localStorage.setItem("wsTab", wsTab); render(); return; }
  const a = e.target.closest("[data-wsact]"); if(!a) return;
  const act = a.dataset.wsact;
  const mount = a.closest(".ws-mount");
  const docEl = a.closest(".ws-doc");
  const docId = docEl ? docEl.dataset.doc : (mount ? mount.dataset.doc : null);
  const doc = docId ? wsGet(docId) : null;

  if(act==="today-toggle"){
    wsTodayExpanded = !wsTodayExpanded; localStorage.setItem("wsTodayExp", wsTodayExpanded?"1":"0");
    if(doc) wsRerender(doc.id); return;
  }
  if(act==="f-open"){ wsFOpen = !wsFOpen; try{ localStorage.setItem("wsFOpen", wsFOpen?"1":"0"); }catch(err){} render(); return; }
  if(act==="tag-sel"){ wsF = wsFNorm({...wsF, tag:(wsF.tag===a.dataset.t)?"":a.dataset.t}); wsFSave(); render(); return; }
  if(act==="f-reset"){ wsF = wsFNorm(null); wsFSave(); render(); return; }
  if(act==="f-preset"){
    const p = a.dataset.p, keep = {showHid:wsF.showHid, tag:wsF.tag, manual:wsF.manual};
    if(p==="all") wsF = wsFNorm(keep);
    else if(p==="over") wsF = wsFNorm({...keep, lvl:1, hideDone:true, noAtt:true});
    else if(p==="today") wsF = wsFNorm({...keep, due:"today", hideDone:true});
    else if(p==="week") wsF = wsFNorm({...keep, due:"week", hideDone:true});
    else if(p==="meta") wsF = wsFNorm({...keep, meta:true, hideDone:true});
    wsFSave(); render(); return;
  }
  if(act==="f-set"){
    const k = a.dataset.k, v = a.dataset.v, nf = {...wsF};
    if(k==="lvl") nf.lvl = +v;
    else if(k==="due") nf.due = (nf.due===v)?"":v;
    else if(k==="manual") nf.manual = v==="1";
    else if(k==="notes" || k==="noTab"){ nf[k] = !nf[k]; wsOpenMap.clear(); }
    else nf[k] = !nf[k];
    wsF = wsFNorm(nf); wsFSave(); render(); return;
  }
  if(act==="retry-load"){ setSync("busy"); loadWorkspace().then(()=>{ setSync("on"); render(); }); return; }
  if(act==="new-doc"){
    if(!wsLoaded){ toast("Arbeitsbereich nicht geladen"); return; }
    const d = wsNewDoc("Neues Dokument"); wsDocs.push(d); wsOpenDocId = d.id; localStorage.setItem("wsOpenDoc", d.id);
    wsTouch(d); wsFocusSel = `.ws-doc[data-doc="${d.id}"] .ws-doctitle`; render();
    const t = document.querySelector(".ws-doctitle"); if(t) t.select();
    return;
  }
  if(act==="meta-open"){
    const hit = wsMetaNodes().find(h=>h.node.id===a.dataset.nid); if(!hit) return;
    wsOpenDocId = hit.doc.id; localStorage.setItem("wsOpenDoc", wsOpenDocId);
    wsTab = "docs"; localStorage.setItem("wsTab", wsTab); view = "notes"; render(); return;
  }
  if(act==="meta-done"){
    const hit = wsMetaNodes().find(h=>h.node.id===a.dataset.nid); if(!hit) return;
    hit.node.done = true; wsTouch(hit.doc); render();
    if(hit.node.link) wsLinkRun(()=>wsPushDone(hit.doc, hit.node));
    return;
  }
  if(act==="dl-open"){
    if(!wsGet(a.dataset.did)) return;
    wsOpenDocId = a.dataset.did; localStorage.setItem("wsOpenDoc", wsOpenDocId);
    wsTab = "docs"; localStorage.setItem("wsTab", wsTab); view = "notes"; render(); return;
  }
  if(act==="dl-done"){
    const d = wsGet(a.dataset.did), r = d ? wsFindNode(d, a.dataset.nid) : null; if(!r) return;
    r.node.done = true; wsTouch(d); render();
    if(r.node.link){ const node = r.node; wsLinkRun(()=>wsPushDone(d, node)); }
    return;
  }
  if(act==="open-doc"){ wsOpenDocId = a.dataset.id; localStorage.setItem("wsOpenDoc", wsOpenDocId); render(); return; }
  if(!doc) return;

  if(act==="tag-doc"){ wsOpenTagMenu(doc.id, "doc", doc.id); return; }
  if(act==="pin"){
    const was = doc.pinned;
    wsDocs.forEach(d=>{ if(d.pinned){ d.pinned = false; wsTouch(d); } });
    doc.pinned = !was; wsTouch(doc); render(); return;
  }
  if(act==="del-doc"){ wsDeleteDocFlow(doc); return; }
  if(act==="add-block"){
    const b = wsNewBlock(a.dataset.type); if(!b) return;
    wsOpenMap.set(b.id, true);
    doc.blocks.push(b); wsTouch(doc);
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-bid="${b.id}"] .ws-in`; wsRerender(doc.id); return;
  }
  const blockEl = a.closest(".ws-block");
  const block = blockEl ? wsBlock(doc, blockEl.dataset.bid) : null;
  if(act==="fold" && block && !a.closest(".ws-att") && !a.closest(".ws-node")){
    wsOpenMap.set(block.id, !wsFoldOpen(block.id, block.type)); wsRerender(doc.id); return;
  }
  if(act==="tag-block" && block){ wsOpenTagMenu(doc.id, "block", block.id); return; }
  if(act==="del-block" && block){
    wsDeleteBlockFlow(doc, block); return;
  }
  if(act==="add-root-node" && block){
    const n = wsNewNode(""); block.items.push(n); wsTouch(doc);
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); return;
  }
  const attEl = a.closest(".ws-att");
  if(attEl){
    const att = wsFindAny(doc, attEl.dataset.aid); if(!att) return;
    if(act==="fold"){ wsOpenMap.set(att.id, !wsFoldOpen(att.id, att.type)); wsRerender(doc.id); return; }
    if(act==="done"){
      att.done = !att.done; wsTouch(doc); wsRerender(doc.id);
      if(att.link) wsLinkRun(()=>wsPushDone(doc, att));
      return;
    }
    if(act==="link-menu"){ wsOpenLinkMenu(doc.id, att.id); return; }
    if(act==="del-att"){ wsDeleteAttFlow(doc, att); return; }
    if(att.type==="table" && wsTableAct(doc, att, `[data-aid="${att.id}"]`, act, a)) return;
    return;
  }
  const nodeEl = a.closest(".ws-node");
  if(nodeEl){
    const nid = nodeEl.dataset.nid, r = wsFindNode(doc, nid); if(!r) return;
    if(act==="toggle"){
      if(r.node.children.length){
        if(wsFiltered()){
          let depth = 0, p = nodeEl.parentElement; while(p){ if(p.classList && p.classList.contains("ws-node")) depth++; p = p.parentElement; }
          wsColl.set(nid, !wsEffCollapsed(r.node, depth)); wsRerender(doc.id);
        }else{ r.node.collapsed = !r.node.collapsed; wsTouch(doc); wsRerender(doc.id); }
      }
      return;
    }
    if(act==="tag-node"){ wsOpenTagMenu(doc.id, "node", nid); return; }
    if(act==="hide-node"){
      r.node.hid = !r.node.hid; wsTouch(doc); wsRerender(doc.id);
      if(r.node.hid && !wsF.showHid) toast("Ausgeblendet. Unter Ansicht kannst du es wieder einblenden.");
      return;
    }
    if(act==="done"){
      r.node.done = !r.node.done; wsTouch(doc); wsRerender(doc.id);
      if(r.node.link){ const node = r.node; wsLinkRun(()=>wsPushDone(doc, node)); }
      return;
    }
    if(act==="link-menu"){ wsOpenLinkMenu(doc.id, nid); return; }
    if(act==="att-toggle"){ r.node.aopen = !r.node.aopen; wsTouch(doc); wsRerender(doc.id); return; }
    if(act==="add-att"){
      const at = wsNewAtt(a.dataset.type); if(!at) return;
      wsOpenMap.set(at.id, true);
      r.node.att.push(at); r.node.aopen = true; wsTouch(doc);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-aid="${at.id}"] .ws-abody .ws-in`; wsRerender(doc.id); return;
    }
    if(act==="add-child"){
      const n = wsAddChild(doc, nid); wsTouch(doc); wsColl.set(nid, false);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); return;
    }
    if(act==="del-node"){ wsDeleteNodeFlow(doc, nid); return; }
  }
  if(block && block.type==="table"){ if(wsTableAct(doc, block, `[data-bid="${block.id}"]`, act, a)) return; }
});
function wsTableAct(doc, tbl, scope, act, a){
  if(act==="add-row"){ const i = wsAddRow(tbl); wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] ${scope} input[data-wsf="cell"][data-ri="${i}"][data-ci="0"]`; wsRerender(doc.id); return true; }
  if(act==="del-row"){
    const ri = +a.dataset.ri;
    if(tbl.rows[ri] && tbl.rows[ri].some(c=>c) && !confirm("Zeile mit Inhalt löschen?")) return true;
    tbl.rows.splice(ri, 1); wsTouch(doc); wsRerender(doc.id); return true;
  }
  if(act==="add-col"){ wsAddCol(tbl); wsTouch(doc); wsRerender(doc.id); return true; }
  if(act==="del-col"){
    const ci = +a.dataset.ci;
    if(tbl.rows.some(r=>r[ci]) && !confirm("Spalte mit Inhalt löschen?")) return true;
    if(wsDelCol(tbl, ci)){ wsTouch(doc); wsRerender(doc.id); } return true;
  }
  return false;
}

/* ---- Ziehen und Ablegen mit der Maus ---- */
function wsClearDropMarks(){
  document.querySelectorAll(".ws-drop-before,.ws-drop-after,.ws-drop-into").forEach(el=>el.classList.remove("ws-drop-before","ws-drop-after","ws-drop-into"));
}
function wsDragEnd(){
  wsClearDropMarks();
  document.querySelectorAll(".ws-dragging").forEach(el=>el.classList.remove("ws-dragging"));
  wsDrag = null; wsDrop = null;
}
function wsDropTarget(e){
  if(!wsDrag || !e.target.closest) return null;
  const docEl = e.target.closest(".ws-doc");
  if(!docEl || docEl.dataset.doc!==wsDrag.docId) return null;
  if(wsDrag.kind==="block"){
    const el = e.target.closest(".ws-block"); if(!el || el.dataset.bid===wsDrag.bid) return null;
    const r = el.getBoundingClientRect();
    return {el, pos:(e.clientY < r.top + r.height/2) ? "before" : "after", bid:el.dataset.bid};
  }
  if(wsDrag.kind==="node"){
    const row = e.target.closest(".ws-nrow"); if(!row) return null;
    const li = row.parentElement; if(!li || li.dataset.nid===wsDrag.nid) return null;
    if(wsDrag.el.contains(li)) return null;                                  // nie in den eigenen Teilbaum
    const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / (r.height||1);
    return {el:row, pos: y<0.3 ? "before" : (y>0.7 ? "after" : "into"), nid:li.dataset.nid};
  }
  if(wsDrag.kind==="row"){
    const tr = e.target.closest("tbody tr"); if(!tr || tr===wsDrag.el) return null;
    if(tr.closest(".ws-block")!==wsDrag.el.closest(".ws-block")) return null;
    const r = tr.getBoundingClientRect();
    return {el:tr, pos:(e.clientY < r.top + r.height/2) ? "before" : "after", ri:+tr.dataset.ri};
  }
  return null;
}
main.addEventListener("dragstart", e=>{
  const h = e.target.closest && e.target.closest("[data-wsdrag]"); if(!h) return;
  const docEl = h.closest(".ws-doc"); if(!docEl) return;
  const kind = h.dataset.wsdrag;
  const src = kind==="block" ? h.closest(".ws-block") : kind==="node" ? h.closest(".ws-node") : h.closest("tr");
  if(!src) return;
  wsDrag = {kind, docId:docEl.dataset.doc, el:src,
    bid: (h.closest(".ws-block")||{dataset:{}}).dataset.bid, nid: kind==="node" ? src.dataset.nid : null, ri: kind==="row" ? +src.dataset.ri : null};
  e.dataTransfer.effectAllowed = "move";
  try{
    e.dataTransfer.setData("text/plain", "ws");
    e.dataTransfer.setDragImage(kind==="node" ? src.querySelector(".ws-nrow") : src, 12, 12);
  }catch(_){}
  setTimeout(()=>{ if(wsDrag) src.classList.add("ws-dragging"); }, 0);
});
main.addEventListener("dragover", e=>{
  if(!wsDrag) return;
  const t = wsDropTarget(e);
  if(!t){ wsClearDropMarks(); wsDrop = null; return; }
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  wsClearDropMarks(); t.el.classList.add("ws-drop-"+t.pos); wsDrop = t;
});
main.addEventListener("drop", e=>{
  if(!wsDrag) return;
  e.preventDefault();
  const t = wsDropTarget(e) || wsDrop, d = wsDrag;
  const doc = wsGet(d.docId); let ok = false;
  if(doc && t){
    if(d.kind==="block") ok = wsMoveBlock(doc, d.bid, t.bid, t.pos);
    else if(d.kind==="node") ok = wsMoveNode(doc, d.nid, t.nid, t.pos);
    else { const b = wsBlock(doc, d.bid); if(b) ok = wsMoveRow(b, d.ri, t.ri, t.pos); }
  }
  wsDragEnd();
  if(ok){ wsTouch(doc); wsRerender(doc.id); }
});
main.addEventListener("dragend", wsDragEnd);

/* ---- Speichern beim Verlassen, Aktualisieren beim Zurückkehren ---- */
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden"){ if(wsDirty.size || wsDeleted.size) wsFlush(); }
  else wsRefreshIfIdle();
});
window.addEventListener("pagehide", ()=>{ if(wsDirty.size || wsDeleted.size) wsFlush(); });

/* ============ GANTT (aus den Dokumenten des Arbeitsbereichs) ============ */
/* Zeilen: Punkte mit Zeitraum (Start + Laufzeit oder Deadline). Meta-Projekte bilden die oberste Ebene. */
let ganttSel = localStorage.getItem("ganttSel") || "meta";
function gGanttHtml(rows, boxW, today){
  const dayMs = 86400000, D = s=>new Date(s+"T00:00:00");
  const dated = rows.filter(r=>r.start);
  if(!dated.length) return `<div class="empty">Keine Punkte mit Zeitraum. Im Menü 📅 eines Punkts legst du Start, Laufzeit und Deadline fest.</div>`;
  const allT = [];
  dated.forEach(r=>{ allT.push(D(r.start).getTime(), D(r.end).getTime()); if(r.dl) allT.push(D(r.dl).getTime()); });
  const minD = Math.min(...allT), maxD = Math.max(...allT);
  const rangeDays = Math.round((maxD-minD)/dayMs) + 1;
  const titleW = boxW<480 ? 118 : 220;
  const px = Math.max(6, (Math.max(boxW, 320) - titleW - 10) / rangeDays);
  const chartW = Math.round(px*rangeDays);
  const fmt = (d)=>d.getDate()+"."+(d.getMonth()+1)+".";
  const weekStep = Math.max(1, Math.ceil(46/(px*7)));
  let ticks = "", wk = 0;
  for(let i=0;i<rangeDays;i++){
    const d = new Date(minD + i*dayMs);
    if(d.getDay()===1){
      const lab = (wk % weekStep===0) ? `<span>${fmt(d)}</span>` : "";
      ticks += `<div class="g-tick" style="left:${Math.round(i*px)}px">${lab}</div>`;
      wk++;
    }
  }
  let todayLine = "";
  if(today){
    const t = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime()-minD)/dayMs);
    if(t>=0 && t<rangeDays) todayLine = `<div class="g-today" style="left:${Math.round(t*px)}px"></div>`;
  }
  let h = `<div class="g-wrap"><div class="g-inner" style="width:${titleW+chartW+10}px">`;
  h += `<div class="g-row g-headrow"><div class="g-title" style="width:${titleW}px">Punkt</div><div class="g-chart" style="width:${chartW}px">${ticks}</div></div>`;
  rows.forEach(it=>{
    const pad = 6 + it.level*10;
    const tt = it.start ? `${it.title} · ${D(it.start).toLocaleDateString("de-DE")} bis ${D(it.end).toLocaleDateString("de-DE")}${it.dl?" · Deadline "+D(it.dl).toLocaleDateString("de-DE"):""}` : it.title;
    let bar = "";
    if(it.start){
      const off = (D(it.start).getTime()-minD)/dayMs, dur = (D(it.end).getTime()-D(it.start).getTime())/dayMs + 1;
      const bw = Math.max(8, Math.round(dur*px)), bl = Math.round(off*px);
      const cls = "g-bar"+(it.meta?" meta":"")+(it.agg?" agg":"")+(it.late?" late":"");
      bar = `<div class="${cls}" style="left:${bl}px;width:${bw}px" title="${esc(tt)}">${bw>70?esc(it.title.slice(0,Math.floor(bw/7))):""}</div>`;
    }
    let dl = "";
    if(it.dl){ const o = Math.round((D(it.dl).getTime()-minD)/dayMs); dl = `<div class="g-dl" style="left:${Math.round((o+1)*px)-2}px" title="Deadline ${esc(D(it.dl).toLocaleDateString("de-DE"))}"></div>`; }
    h += `<div class="g-row${it.meta?" g-metarow":""}"><div class="g-title" style="width:${titleW}px;padding-left:${pad}px" title="${esc(tt)}">${it.meta?"★ ":""}${esc(it.title)}</div>
      <div class="g-chart" style="width:${chartW}px">${todayLine}${bar}${dl}</div></div>`;
  });
  return h + `</div></div>`;
}
function wsGanttDraw(){
  const box = $("wsGanttBox"); if(!box) return;
  if(!wsLoaded){ box.innerHTML = `<div class="empty">Der Arbeitsbereich ist nicht geladen.</div>`; return; }
  const hasMeta = wsMetaRoots(wsDocs).length>0;
  const opts = [{v:"meta", t:"Alle Meta-Projekte"}].concat(wsDocs.map(d=>({v:d.id, t:d.title||"Ohne Titel"})));
  if(!opts.some(o=>o.v===ganttSel)) ganttSel = hasMeta ? "meta" : (wsDocs[0] ? wsDocs[0].id : "meta");
  let roots;
  if(ganttSel==="meta") roots = wsMetaRoots(wsDocs);
  else{ const d = wsGet(ganttSel); roots = []; if(d) d.blocks.forEach(b=>{ if(b.type==="outline") roots.push(...b.items); }); }
  const rows = wsGanttRows(roots, wsF.tag, wsF.tag ? wsEffTags(wsDocs) : null, wsSorter());
  box.innerHTML = `<div class="g-bar-top"><select id="wsGanttSel">${opts.map(o=>`<option value="${esc(o.v)}"${o.v===ganttSel?" selected":""}>${esc(o.t)}</option>`).join("")}</select></div>`
    + (ganttSel==="meta" && !roots.length
        ? `<div class="empty">Noch kein Meta-Projekt. Im Menü 📅 eines Punktes den Schalter Meta-Projekt einschalten.</div>`
        : gGanttHtml(rows, box.clientWidth || 520, new Date()));
}

/* ============ PUNKT <-> TODO / TAGES-ZIEL ============ */
/* Jeder Punkt der Gliederung kann ein Datum tragen und als ToDo (Zeile im Tabellenblatt Tasks) oder Tages-Ziel (Google Task)
   angelegt werden. Titel, Datum und Erledigt-Status werden in beide Richtungen abgeglichen; Kalender ist optional (Standard: aus). */
const GOAL_MAX = 6;                                   // Tages-Ziele pro Tag
let wsLinkQueue = Promise.resolve();
function wsLinkRun(fn){
  const run = wsLinkQueue.then(fn);
  wsLinkQueue = run.catch(e=>{ console.error("❌ Verknüpfung:", e && e.message); toast("Verknüpfung: Abgleich fehlgeschlagen"); });
  return wsLinkQueue;
}
function wsGoalCount(date){
  if(date===todayKey()) return goalTasks.length;
  return allOpenGoals.filter(g=>g.due===date).length;
}
/* Oberfläche nach Hintergrundarbeit auffrischen, ohne Eingaben zu stören */
function wsRefreshDoc(doc){
  if(!document.querySelector('.ws-mount[data-doc="'+doc.id+'"]')) return;
  const ae = document.activeElement;
  if(ae && ae.classList && ae.classList.contains("ws-nin")){
    const li = ae.closest(".ws-node");
    if(li) wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${li.dataset.nid}"] > .ws-nrow .ws-nin`;
  }
  wsRerender(doc.id);
}
function wsRenderIfSafe(){
  const ae = document.activeElement;
  if(ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.tagName==="SELECT")) return;
  if(document.getElementById("modalBg")) return;
  if(view==="notes"){ wsDocs.forEach(wsRefreshDoc); return; }
  render();
}

/* ---- Kalendertermin, den ein verknüpftes Tages-Ziel selbst besitzt ---- */
async function wsGoalEvent(L, title, date, want){
  const calId = L.calId || defaultCalId || "primary";
  try{
    if(want){
      const body = JSON.stringify({summary:title, start:{date}, end:{date:nextDayKey(date)}});
      if(L.evId) await api(`${calUrl(calId)}/${L.evId}`, {method:"PUT", body});
      else{ const ev = await api(calUrl(calId), {method:"POST", body}); L.evId = ev.id; L.calId = calId; }
      L.cal = true;
    }else{
      if(L.evId) await api(`${calUrl(calId)}/${L.evId}`, {method:"DELETE"});
      L.evId = ""; L.cal = false;
    }
  }catch(e){
    console.warn("Kalendertermin (Ziel) fehlgeschlagen:", e);
    toast("Kalender-Eintrag fehlgeschlagen");
    L.cal = !!L.evId;
  }
}

/* ---- Punkt -> Eintrag: Titel, Datum, Kalender übertragen ---- */
async function wsSyncItem(doc, node, wantCal){
  const L = node.link; if(!L) return;
  const title = wsTitleOf(node);
  if(L.kind==="todo"){
    const t = tasks.find(x=>x.id===L.ref);
    if(!t){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); return; }
    if(title) t.title = title;
    t.startDate = wsLinkDay(node);
    const wd = parseDate(t.startDate); t.weekday = wd ? String(wd.getDay()) : "";
    t.syncCalendar = !!wantCal;
    await syncCalendar(t);
    L.cal = !!t.syncCalendar && !!t.calendarEventId;
    await saveTasks();
  }else{
    const listId = defaultGTaskListId || "@default";
    const body = {notes:GOAL_MARKER}; if(title) body.title = title; if(wsLinkDay(node)) body.due = wsLinkDay(node)+"T12:00:00.000Z";
    try{
      await api(`${GTASKS}/lists/${encodeURIComponent(listId)}/tasks/${encodeURIComponent(L.ref)}`, {method:"PATCH", body:JSON.stringify(body)});
    }catch(e){
      if(/404/.test(e.message||"")){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); toast("Das verknüpfte Tages-Ziel existiert nicht mehr"); return; }
      throw e;
    }
    await wsGoalEvent(L, title || "Ziel", wsLinkDay(node), !!wantCal);
    await loadGTasks();
  }
  wsTouch(doc);
  wsRenderIfSafe();
}
/* ---- Punkt abgehakt -> Eintrag erledigt (und zurück) ---- */
async function wsPushDone(doc, node){
  const L = node.link; if(!L) return;
  const done = node.done;
  if(L.kind==="todo"){
    const t = tasks.find(x=>x.id===L.ref);
    if(!t){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); return; }
    if(done){ if(!isEverDone(t.id)) logs.push({itemId:t.id, date:todayKey(), doneAt:new Date().toISOString()}); }
    else logs = logs.filter(l=>l.itemId!==t.id);
    await saveLogs();
  }else{
    const listId = defaultGTaskListId || "@default";
    try{
      await api(`${GTASKS}/lists/${encodeURIComponent(listId)}/tasks/${encodeURIComponent(L.ref)}`,
        {method:"PATCH", body:JSON.stringify(done ? {status:"completed"} : {status:"needsAction", completed:null})});
    }catch(e){
      if(/404/.test(e.message||"")){ node.link = null; wsTouch(doc); wsRefreshDoc(doc); toast("Das verknüpfte Tages-Ziel existiert nicht mehr"); return; }
      throw e;
    }
    if(done && !logs.some(l=>l.itemId===L.ref)){ logs.push({itemId:L.ref, date:todayKey(), doneAt:new Date().toISOString()}); await saveLogs(); }
    await loadGTasks();
  }
  wsRenderIfSafe();
}
/* ---- Neuen Eintrag aus einem Punkt anlegen ---- */
async function wsCreateItem(doc, node, kind, cal){
  if(node.link) return;
  const title = wsTitleOf(node);
  if(kind==="todo"){
    const wd = parseDate(wsLinkDay(node));
    const t = {id:uid(), type:"todo", title, scheduleType:"once", startDate:wsLinkDay(node), weekday:wd?String(wd.getDay()):"",
      syncCalendar:!!cal, calendarEventId:"", notes:"", createdAt:new Date().toISOString(), archived:false,
      calendarId:"", startTime:"", projectId:"", tag:""};
    tasks.push(t);
    if(t.syncCalendar) await syncCalendar(t);
    await saveTasks();
    node.link = {kind:"todo", ref:t.id, cal:!!t.syncCalendar && !!t.calendarEventId, evId:"", calId:""};
  }else{
    if(!defaultGTaskListId) await loadGTasks();
    if(!defaultGTaskListId){ toast("Google Tasks nicht erreichbar"); return; }
    const res = await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId)}/tasks`,
      {method:"POST", body:JSON.stringify({title, notes:GOAL_MARKER, due:wsLinkDay(node)+"T12:00:00.000Z"})});
    node.link = {kind:"goal", ref:res.id, cal:false, evId:"", calId:""};
    if(cal) await wsGoalEvent(node.link, title, wsLinkDay(node), true);
    await loadGTasks();
  }
  wsTouch(doc);
  if(node.done) await wsPushDone(doc, node);
  toast(kind==="goal" ? "Als Tages-Ziel angelegt" : "Als ToDo angelegt");
  wsRenderIfSafe();
}
async function wsApplyMenu(docId, nid, o){
  const doc = wsGet(docId), n = doc && wsFindAny(doc, nid); if(!n) return;
  const L = n.link, today = todayKey();
  const date0 = wsIsDate(o.date) ? o.date : "";
  const setFields = ()=>{
    if(wsIsAtt(n)) return;
    const dur = parseInt(o.dur, 10);
    n.dur = (dur>0 && dur<=3660) ? dur : 0;
    n.dl = wsIsDate(o.dl) ? o.dl : "";
    n.meta = !!o.meta;
  };
  const newDl = wsIsAtt(n) ? "" : (wsIsDate(o.dl) ? o.dl : "");
  const place = (day)=>{ if(newDl){ n.date = date0; n.ld = day; } else { n.date = day; n.ld = ""; } };
  if(!L){
    if(!o.kind){ n.date = date0; setFields(); wsTouch(doc); wsRefreshDoc(doc); return; }
    if(!wsTitleOf(n)){ toast(wsIsAtt(n) ? "Erst einen Titel oder Text eingeben" : "Erst einen Text eingeben"); return; }
    const day = wsPlanDay(n, date0, newDl, false, today);
    if(o.kind==="goal"){
      if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
      if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
    }
    setFields(); place(day); wsTouch(doc); wsRefreshDoc(doc);
    await wsLinkRun(()=>wsCreateItem(doc, n, o.kind, !!o.cal));
    return;
  }
  const oldLd = wsLinkDay(n);
  const day = wsPlanDay(n, date0, newDl, true, today);
  if(L.kind==="goal"){
    if(!day){ toast("Ein Tages-Ziel braucht ein Datum"); return; }
    if(day!==oldLd){
      if(day<today){ toast("Ein Tages-Ziel braucht ein heutiges oder späteres Datum"); return; }
      if(wsGoalCount(day)>=GOAL_MAX){ toast("Maximal "+GOAL_MAX+" Tages-Ziele pro Tag am "+wsShortDate(day)); return; }
    }
  }
  setFields(); place(day); wsTouch(doc); wsRefreshDoc(doc);
  await wsLinkRun(()=>wsSyncItem(doc, n, !!o.cal));
}
async function wsUnlink(docId, nid){
  const doc = wsGet(docId), nn = doc && wsFindAny(doc, nid); if(!nn || !nn.link) return;
  const L = nn.link; nn.link = null; wsTouch(doc); wsRefreshDoc(doc);
  if(L.kind==="goal" && L.evId) await wsLinkRun(()=>wsGoalEvent(L, "", "", false));
  toast("Verknüpfung gelöst, "+(L.kind==="goal"?"das Ziel":"das ToDo")+" bleibt bestehen");
}

/* ---- Löschen: Rückfrage, was mit verknüpften Einträgen geschehen soll ---- */
function wsAskLinks(links, what){
  return new Promise(resolve=>{
    if(document.getElementById("modalBg")){ resolve(null); return; }
    const nt = links.filter(l=>l.kind==="todo").length, ng = links.length - nt, parts = [];
    if(nt) parts.push(nt+(nt>1?" ToDos":" ToDo"));
    if(ng) parts.push(ng+(ng>1?" Tages-Ziele":" Tages-Ziel"));
    document.body.insertAdjacentHTML("beforeend",
      `<div class="modal-bg" id="modalBg"><div class="modal">
        <h2>Verknüpfte Einträge</h2>
        <p style="font-size:14px;margin-bottom:12px">${esc(what)} ${/^Dokument|^Block/.test(what)?"enthält":"hat"} ${esc(parts.join(" und "))} verknüpft. Was soll damit geschehen?</p>
        <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px">
          <button class="btn-ghost" id="wsq_keep">Nur hier löschen, ${links.length>1?"die Einträge bleiben":"der Eintrag bleibt"} bestehen</button>
          <button class="btn-primary" id="wsq_del">Auch ${links.length>1?"die verknüpften Einträge":"den verknüpften Eintrag"} löschen</button>
          <button class="btn-ghost" id="wsq_cancel">Abbrechen</button>
        </div></div></div>`);
    const done = v=>{ const m = $("modalBg"); if(m) m.remove(); resolve(v); };
    $("wsq_keep").onclick = ()=>done("keep");
    $("wsq_del").onclick = ()=>done("delete");
    $("wsq_cancel").onclick = ()=>done(null);
    $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") done(null); };
  });
}
async function wsReleaseLinks(links, del){
  let tasksChanged = false, goalsChanged = false;
  for(const L of links){
    if(L.kind==="todo"){
      if(!del) continue;
      const t = tasks.find(x=>x.id===L.ref); if(!t) continue;
      await deleteCalendar(t);
      tasks = tasks.filter(x=>x.id!==t.id); logs = logs.filter(l=>l.itemId!==t.id); tasksChanged = true;
    }else{
      if(L.evId){ try{ await api(`${calUrl(L.calId || defaultCalId || "primary")}/${L.evId}`, {method:"DELETE"}); }catch(e){} }
      if(del){
        try{ await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId||"@default")}/tasks/${encodeURIComponent(L.ref)}`, {method:"DELETE"}); }
        catch(e){ if(!/404/.test(e.message||"")) throw e; }
        goalsChanged = true;
      }
    }
  }
  if(tasksChanged){ await saveTasks(); await saveLogs(); }
  if(goalsChanged) await loadGTasks();
  if(tasksChanged || goalsChanged) wsRenderIfSafe();
}
const wsLinkCopies = nodes=>wsCollectLinkedNodes(nodes).map(n=>Object.assign({}, n.link));
async function wsDeleteNodeFlow(doc, nid){
  const r = wsFindNode(doc, nid); if(!r) return;
  const c = wsCount(r.node), links = wsLinkCopies([r.node]);
  const nAtt = wsAllNodes({blocks:[{type:"outline", items:[r.node]}]}).reduce((k,x)=>k+x.att.length, 0);
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dieser Punkt"+(c.total?" samt "+c.total+" Unterpunkten":""));
    if(!mode) return;
  }else if((c.total>0 || nAtt>0) && !confirm("Diesen Punkt samt "+c.total+" Unterpunkten"+(nAtt?" und "+nAtt+" Anhängen":"")+" löschen?")) return;
  if(!wsFindNode(doc, nid)) return;
  wsDeleteNode(doc, nid); wsTouch(doc); wsRerender(doc.id);
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}
async function wsDeleteAttFlow(doc, att){
  const links = att.link ? [Object.assign({}, att.link)] : [];
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dieser Anhang");
    if(!mode) return;
  }else{
    const empty = att.type==="table" ? att.rows.every(r=>r.every(c=>!c)) : !(att.text||"").trim();
    if(!empty && !confirm("Diesen Anhang mit Inhalt löschen?")) return;
  }
  const owner = wsAttOwner(doc, att.id); if(!owner) return;
  owner.att = owner.att.filter(x=>x.id!==att.id); wsTouch(doc); wsRerender(doc.id);
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}
async function wsDeleteBlockFlow(doc, block){
  const links = block.type==="outline" ? wsLinkCopies(block.items) : [];
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dieser Block");
    if(!mode) return;
  }else{
    const empty = block.type==="table" ? block.rows.every(r=>r.every(c=>!c)) : block.type==="outline" ? !wsOpenCount(doc) && !JSON.stringify(block.items).includes('"text":"') : !(block.text||"").trim();
    if(!empty && !confirm("Diesen Block mit Inhalt löschen?")) return;
  }
  doc.blocks = doc.blocks.filter(b=>b.id!==block.id); wsTouch(doc); wsRerender(doc.id);
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}
async function wsDeleteDocFlow(doc){
  if(!confirm('Dokument "'+(doc.title||"Ohne Titel")+'" mit allen Blöcken löschen?')) return;
  const links = wsDocLinkedNodes(doc).map(n=>Object.assign({}, n.link));
  let mode = "keep";
  if(links.length){
    mode = await wsAskLinks(links, "Dokument");
    if(!mode) return;
  }
  wsDocs = wsDocs.filter(d=>d.id!==doc.id); wsDirty.delete(doc.id); wsDeleted.set(doc.id, ++wsRev);
  if(wsOpenDocId===doc.id){ wsOpenDocId = null; localStorage.removeItem("wsOpenDoc"); }
  wsScheduleSave(); render();
  if(links.length) wsLinkRun(()=>wsReleaseLinks(links, mode==="delete"));
}

/* ---- Eintrag -> Punkt: Änderungen aus den übrigen Ansichten der App ---- */
function wsOnItemDone(kind, ref, done){
  if(!wsLoaded) return;
  const h = wsFindByLink(wsDocs, kind, ref); if(!h || h.node.done===done) return;
  h.node.done = done; wsTouch(h.doc);
}
function wsOnTodoChanged(t){
  if(!wsLoaded) return;
  const h = wsFindByLink(wsDocs, "todo", t.id); if(!h) return;
  if(t.type!=="todo" || t.scheduleType==="weekly"){ h.node.link = null; wsTouch(h.doc); toast("Verknüpfung mit dem Arbeitsbereich gelöst: kein einmaliges ToDo mehr"); return; }
  if(t.title) wsSetTitle(h.node, t.title);
  wsSetLinkDay(h.node, t.startDate || "");
  h.node.link.cal = !!t.syncCalendar && !!t.calendarEventId;
  wsTouch(h.doc);
}
function wsOnGoalChanged(id, title, date){
  if(!wsLoaded) return;
  const h = wsFindByLink(wsDocs, "goal", id); if(!h) return;
  if(title) wsSetTitle(h.node, title);
  if(date) wsSetLinkDay(h.node, date);
  wsTouch(h.doc);
  if(h.node.link.evId) wsLinkRun(()=>wsGoalEvent(h.node.link, wsTitleOf(h.node), wsLinkDay(h.node), true).then(()=>wsTouch(h.doc)));
}
function wsOnItemDeleted(kind, ref){
  if(!wsLoaded) return;
  const h = wsFindByLink(wsDocs, kind, ref); if(!h) return;
  const L = h.node.link; h.node.link = null; wsTouch(h.doc);
  if(kind==="goal" && L.evId) wsLinkRun(()=>wsGoalEvent(L, "", "", false));
}

/* ---- Abgleich beim Start: der Eintrag gilt, wenn Punkt und Eintrag auseinanderlaufen ---- */
async function wsReconcileLinks(){
  try{
    if(!wsLoaded) return;
    const touched = new Set(), unresolved = [];
    const setN = (doc, n, key, val)=>{ if(n[key]!==val){ n[key] = val; touched.add(doc); } };
    wsDocs.forEach(doc=>{
      wsDocLinkedNodes(doc).forEach(n=>{
        const L = n.link;
        if(L.kind==="todo"){
          if(!tasks.length) return;                                    // Tasks nicht geladen: nichts verändern
          const t = tasks.find(x=>x.id===L.ref);
          if(!t || t.type!=="todo" || t.scheduleType==="weekly"){ n.link = null; touched.add(doc); return; }
          setN(doc, n, "done", isEverDone(t.id));
          if(t.title && wsTitleOf(n)!==t.title){ wsSetTitle(n, t.title); touched.add(doc); }
          { const d = t.startDate || ""; if(wsLinkDay(n)!==d){ wsSetLinkDay(n, d); touched.add(doc); } }
          const cal = !!t.syncCalendar && !!t.calendarEventId;
          if(L.cal!==cal){ L.cal = cal; touched.add(doc); }
        }else{
          const g = allOpenGoals.find(x=>x.id===L.ref) || goalTasks.find(x=>x.id===L.ref);
          if(g){
            setN(doc, n, "done", !!g.completed);
            if(g.title && g.title!=="(ohne Titel)" && wsTitleOf(n)!==g.title){ wsSetTitle(n, g.title); touched.add(doc); }
            if(g.due && wsLinkDay(n)!==g.due){ wsSetLinkDay(n, g.due); touched.add(doc); }
          }else unresolved.push({doc, n});
        }
      });
    });
    // Ziele, die nicht in den geladenen Listen stehen (früher erledigt oder gelöscht): einzeln nachfragen
    if(unresolved.length && defaultGTaskListId){
      for(const {doc, n} of unresolved.slice(0, 30)){
        try{
          const res = await api(`${GTASKS}/lists/${encodeURIComponent(defaultGTaskListId)}/tasks/${encodeURIComponent(n.link.ref)}`);
          if(!res || res.deleted){ n.link = null; touched.add(doc); }
          else if(res.status==="completed") setN(doc, n, "done", true);
        }catch(e){
          if(/404/.test(e.message||"")){ n.link = null; touched.add(doc); }
        }
      }
    }
    touched.forEach(d=>wsTouch(d));
    if(touched.size) console.log("  ✓ wsReconcileLinks: Dokumente angepasst:", touched.size);
  }catch(e){ console.error("wsReconcileLinks:", e.message); }
}


/* ============ HEUTE: Dienstliche Metaprojekte aus dem Arbeitsbereich ============ */
/* Alle als Meta-Projekt markierten, noch nicht abgehakten Punkte; Reihenfolge nach Deadline (oder Ende des Zeitraums), ohne Termin zuletzt. */
function wsMetaNodes(){
  const out = [];
  wsDocs.forEach(doc=>{
    wsAllNodes(doc).forEach(n=>{ if(n.meta && !n.done) out.push({doc, node:n}); });
  });
  return out;
}

/* ---- Deadlines: Anzeige (Heute und Ansicht Deadlines) ---- */
function wsDlLabel(days){ return days<0 ? "⚠️ überfällig "+Math.abs(days)+"d" : deadlineLabel(days); }
function wsDlCard(it, full){
  const n = it.node, color = deadlineColor(it.days);
  const url = esc(wsShortDate(it.dl));
  let style = `border-left:4px solid ${color}`, tc = "";
  if(full){
    if(it.days<=3){ style = `border-left:3px solid ${color};background:#ef4444;color:#fff`; tc = "color:#fff"; }
    else if(it.days<=7){ style = `border-left:2px solid ${color};background:#fff;color:#000`; tc = "color:#000"; }
    else { style = `border-left:1px solid ${color};background:#bbf7d0;color:#000`; tc = "color:#000"; }
  }
  return `<div class="card" style="${style}">
    <div class="check" data-wsact="dl-done" data-did="${it.doc.id}" data-nid="${n.id}" title="Als erledigt abhaken">${checkSvg()}</div>
    <div class="body" data-wsact="dl-open" data-did="${it.doc.id}" data-nid="${n.id}" style="cursor:pointer">
      <div class="title" style="${full?tc:"color:#000"};font-weight:bold">${esc(wsTitleOf(n)||"(ohne Titel)")}${n.hid?" 🙈":""}</div>
      <div class="sub" style="${tc};font-size:12px;margin-top:2px">${n.meta?"🏛️ Metaprojekt · ":""}${esc(it.doc.title||"Ohne Titel")} · ⚑ ${url}</div>
      <div style="font-size:${full?14:12}px;margin-top:6px;padding:${full?"6px 10px":"4px 8px"};background:${color};color:#fff;border-radius:4px;display:inline-block;font-weight:bold">${wsDlLabel(it.days)}</div>
    </div></div>`;
}

function wsUrgentDeadlinesHtml(){
  if(!wsLoaded) return "";
  const list = wsDeadlineItems(wsDocs, todayKey()).filter(it=>it.days<=5 && !it.node.meta && !it.node.hid);

  if(list.length>MAX) h += `<div class="muted center" style="padding:6px;font-size:13px">+${list.length-MAX} weitere · vollständige Liste unter Deadlines</div>`;
  return h;
}
function wsDeadlinesViewHtml(){
  if(!wsLoaded) return `<div class="muted center" style="padding:8px">Der Arbeitsbereich konnte nicht geladen werden.</div>`;
  const list = wsDeadlineItems(wsDocs, todayKey());
  if(!list.length) return `<div class="muted center" style="padding:8px">Keine Deadlines vorhanden. Eine Deadline setzt du im Reiter Arbeit über das Datumssymbol eines Punktes.</div>`;
  return list.map(it=>wsDlCard(it, true)).join("");
}
function wsMetaTodayHtml(){
  const key = (h)=>{ const sp = wsSpan(h.node); return h.node.dl || (sp ? sp.end : ""); };
  const list = wsMetaNodes().sort((a,b)=>{
    const ka = key(a), kb = key(b);
    if(!ka && !kb) return 0; if(!ka) return 1; if(!kb) return -1;
    return ka<kb ? -1 : ka>kb ? 1 : 0;
  }).slice(0,4);
  if(!list.length) return "";
  const RANK = [{bg:"#4ade80",fg:"#000"},{bg:"#facc15",fg:"#000"},{bg:"#f97316",fg:"#fff"},{bg:"#ef4444",fg:"#fff"}];
  const today = todayKey();
  return `<div class="section-title">🏛️ Metaprojekte</div>` + list.map((h,i)=>{
    const {bg,fg} = RANK[i], n = h.node, k = key(h);
    const over = k && k < today;
    return `<div class="card" style="border-left:5px solid ${bg}">
      <div class="check" data-wsact="meta-done" data-nid="${n.id}" title="Als erledigt abhaken">${checkSvg()}</div>
      <div class="body" data-wsact="meta-open" data-nid="${n.id}" style="cursor:pointer"><div class="title">${esc(wsTitleOf(n)||"(ohne Titel)")}</div>
        ${k?`<div class="muted" style="font-size:12px;${over?"color:var(--red)":""}">${n.dl?"⚑ ":""}${esc(wsShortDate(k))}${over?" · überfällig":""}</div>`:""}</div>
      <span class="rankchip" style="background:${bg};color:${fg}">${i+1}</span>
    </div>`;
  }).join("");
}

/* ============ Backup (analog Projekt-Visualizer) ============ */
function doBackupSilentTodo(){
  const data = {
    type: "todo-app-backup",
    version: 1,
    created: new Date().toISOString(),
    tasks, logs, projects, notes, links, distractions,
    workspace: wsDocs
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "todo-app-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(url);
  console.log("✅ ToDo-App Auto-Backup heruntergeladen");
}
function doBackupTodo(){
  doBackupSilentTodo();
  toast("Backup heruntergeladen");
}
function autoBackupTodo(){
  const lastBackup = localStorage.getItem("todoLastAutoBackup");
  const now = Date.now();
  const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
  if(!lastBackup || (now - parseInt(lastBackup)) > sevenDaysMs){
    console.log("🔄 ToDo-App Auto-Backup läuft...");
    doBackupSilentTodo();
    localStorage.setItem("todoLastAutoBackup", now.toString());
  }
}
async function doRestoreTodo(){
  const input = document.getElementById("restoreFileTodo");
  if(!input.files || !input.files[0]){ toast("Keine Datei gewählt"); return; }
  const text = await input.files[0].text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ toast("Ungültige Datei"); return; }
  if(!data || (!data.tasks && !data.logs && !data.projects && !data.notes && !data.workspace)){ toast("Ungültiges Format"); return; }

  let addedTasks=0, addedLogs=0, addedProjects=0, addedNotes=0, addedLinks=0, addedDistractions=0;

  if(Array.isArray(data.tasks)){
    const existingIds = new Set(tasks.map(t=>t.id));
    data.tasks.forEach(t=>{ if(t.id && !existingIds.has(t.id)){ tasks.push(t); existingIds.add(t.id); addedTasks++; } });
  }
  if(Array.isArray(data.logs)){
    const existingKeys = new Set(logs.map(l=>l.itemId+"|"+l.date));
    data.logs.forEach(l=>{ const k=l.itemId+"|"+l.date; if(l.itemId && l.date && !existingKeys.has(k)){ logs.push(l); existingKeys.add(k); addedLogs++; } });
  }
  if(Array.isArray(data.projects)){
    const existingIds = new Set(projects.map(p=>p.id));
    data.projects.forEach(p=>{ if(p.id && !existingIds.has(p.id)){ projects.push(p); existingIds.add(p.id); addedProjects++; } });
  }
  if(Array.isArray(data.notes)){
    const existingIds = new Set(notes.map(n=>n.id));
    data.notes.forEach(n=>{ if(n.id && !existingIds.has(n.id)){ notes.push(n); existingIds.add(n.id); addedNotes++; } });
  }
  if(Array.isArray(data.links)){
    const existingIds = new Set(links.map(l=>l.id));
    data.links.forEach(l=>{ if(l.id && !existingIds.has(l.id)){ links.push(l); existingIds.add(l.id); addedLinks++; } });
  }
  if(Array.isArray(data.distractions)){
    const existingIds = new Set(distractions.map(d=>d.id));
    data.distractions.forEach(d=>{ if(d.id && !existingIds.has(d.id)){ distractions.push(d); existingIds.add(d.id); addedDistractions++; } });
  }

  let addedDocs=0;
  if(Array.isArray(data.workspace)){
    if(!wsLoaded){ toast("Arbeitsbereich nicht geladen: Dokumente nicht wiederhergestellt"); }
    else{
      const existingIds = new Set(wsDocs.map(d=>d.id));
      wsNormalizeDocs(data.workspace).forEach(d=>{ if(d.id && !existingIds.has(d.id)){ wsDocs.push(d); wsDirty.set(d.id, ++wsRev); existingIds.add(d.id); addedDocs++; } });
    }
  }

  if(addedTasks) await saveTasks();
  if(addedLogs) await saveLogs();
  if(addedProjects) await saveProjects();
  if(addedNotes) await saveNotes();
  if(addedLinks) await saveLinks();
  if(addedDistractions) await saveDistractions();
  if(addedDocs) await wsFlush();

  render();
  toast(`Wiederhergestellt: ${addedTasks} Aufgaben, ${addedLogs} Log-Einträge, ${addedProjects} Projekte, ${addedNotes} Notizen, ${addedDocs} Dokumente`);
}
