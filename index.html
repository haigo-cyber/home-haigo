<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>ToDo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1f242e; --line:#2a303c;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#6366f1; --accent2:#4f46e5;
    --green:#22c55e; --red:#ef4444; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:5;background:var(--bg);
    display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;flex:1;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--green)} .dot.busy{background:#f59e0b}
  .icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}

  main{flex:1;padding:14px 16px 90px}
  .muted{color:var(--muted)} .center{text-align:center}

  .signin{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:60px 24px;text-align:center}
  .signin p{color:var(--muted);max-width:320px;line-height:1.5}
  .btn-primary{background:var(--accent2);border:none;color:#fff;border-radius:12px;
    padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary:active{background:var(--accent)}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:18px 2px 8px}
  .card{background:#ffe0cc;border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .card .body{flex:1;min-width:0}
  .card .title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;color:#000}
  .card .sub{font-size:12px;color:#000;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card.done .title{text-decoration:line-through;color:var(--muted)}
  .badge{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px}
  .badge.cal{color:#a5b4fc;border-color:#3b3f63}

  .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent}
  .check.on{background:var(--green);border-color:var(--green)}
  .check svg{width:15px;height:15px;display:none} .check.on svg{display:block}

  .row-actions{display:flex;gap:6px}
  .mini{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px}
  .mini:active{color:var(--text)}

  .streak{display:flex;gap:4px;margin-top:6px}
  .streak .d{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
  .streak .d.on{background:var(--green);border-color:var(--green)}

  .fab{position:fixed;right:calc(50% - 280px + 16px);bottom:78px;width:54px;height:54px;border-radius:50%;
    background:var(--accent2);color:#fff;border:none;font-size:28px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:6}
  @media(max-width:592px){.fab{right:16px}}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);
    border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 1px 11px;
    font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.active{color:var(--text)}
  nav .nico{font-size:19px;line-height:1}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;
    align-items:flex-end;justify-content:center}
  .modal{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);
    border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px}
  textarea{resize:vertical;min-height:54px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:90px;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .seg button.sel{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .switch{width:46px;height:27px;border-radius:14px;background:var(--line);border:none;position:relative;cursor:pointer;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--green)} .switch.on::after{left:22px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn-primary{flex:1}
  .btn-ghost{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:13px;font-size:15px;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  a{color:#a5b4fc}
  .pie-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0 8px}
  .pie-pct{font-size:30px;font-weight:700;margin-top:8px}
  .pie-sub{color:var(--muted);font-size:13px}
  .legend{display:flex;gap:20px;margin-top:10px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .legend i.green{background:var(--green)} .legend i.red{background:var(--red)}
  .note-detail{margin-top:8px;cursor:pointer}
  .note-detail summary{font-size:13px;color:var(--muted);user-select:none}
  .note-detail[open] summary{color:var(--text)}
  .note-text{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#000;
    border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="./seiffertsupdate-icon.png" alt="Logo" style="height:32px;width:32px;margin-right:8px">
    <h1 id="hTitle">ToDo</h1>
    <span class="dot" id="syncDot" title="Synchronisierung"></span>
    <button class="icon-btn" id="acctBtn">Anmelden</button>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" style="display:none">+</button>
  <nav id="nav" style="display:none">
    <button data-view="today" class="active"><span class="nico">📅</span>Heute</button>
    <button data-view="projects"><span class="nico">🎯</span>Projekte</button>
    <button data-view="links"><span class="nico">🔗</span>Links</button>
    <button data-view="notes"><span class="nico">📝</span>Notizen</button>
    <button data-view="goals"><span class="nico">⭐</span>Ziele</button>
    <button data-view="habits"><span class="nico">🔥</span>Gewohn.</button>
    <button data-view="duties"><span class="nico">🔁</span>Pflicht</button>
    <button data-view="todos"><span class="nico">✓</span>ToDos</button>
    <button data-view="settings"><span class="nico">⚙️</span>Konto</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
"use strict";

/* ============ KONFIGURATION ============ */
const CLIENT_ID = "22658520266-72537b3ef6bi63gmfaavt4r5snnjv0ln.apps.googleusercontent.com";
const SCOPES = [
  "https://www.googleapis.com/auth/spreadsheets",
  "https://www.googleapis.com/auth/calendar.events",
  "https://www.googleapis.com/auth/calendar.calendarlist.readonly",
  "https://www.googleapis.com/auth/drive.file",
  "https://www.googleapis.com/auth/tasks"
].join(" ");
const SHEET_NAME = "ToDo App Data";
const DEFAULT_SYNC = true;          // Kalender-Sync standardmäßig AN
const TASK_COLS = ["id","type","title","scheduleType","startDate","weekday","syncCalendar","calendarEventId","notes","createdAt","archived","calendarId","startTime","projectId"];
const LOG_COLS  = ["itemId","date","doneAt"];
const WEEKDAYS  = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

/* ============ ZUSTAND ============ */
let accessToken = null, tokenClient = null, tokenResolve = null, tokenReject = null;
let spreadsheetId = localStorage.getItem("ssid") || null;
let tasks = [], logs = [], projects = [], notes = [], links = [];
let view = "today";
let selectedProjectId = null;
let calendars = [];                                       // schreibbare Kalender des Nutzers
let gtasks = [];                                          // Google-Tasks-Einträge (Standardliste)
let gtasksStatus = "";                                    // Diagnose-Text fürs UI
let defaultCalId = localStorage.getItem("defcal") || "primary";

/* ============ HILFEN ============ */
const $ = (id) => document.getElementById(id);
const main = $("main");
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayKey(){ return dateKey(new Date()); }
function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }
function setSync(state){ const d=$("syncDot"); d.className="dot"+(state==="on"?" on":state==="busy"?" busy":""); }

/* ============ WIEDERHOLUNGSLOGIK (geprüft) ============ */
function isDue(task, date){
  if(task.archived) return false;
  if(task.type==="habit") return true;
  if(task.type==="todo" && !task.startDate) return true; // Todo ohne Termin ist immer fällig
  const start=parseDate(task.startDate); if(!start) return false;
  const d=diffDays(start,date); if(d<0) return false;
  if(task.type==="duty"){
    if(task.scheduleType==="daily") return true;
    if(task.scheduleType==="every2days") return d%2===0;
    if(task.scheduleType==="weekly") return d%7===0;
  }
  if(task.type==="todo"){
    if(task.scheduleType==="weekly") return d%7===0;
    return d===0;
  }
  return false;
}
function isDone(itemId, key){ return logs.some(l=>l.itemId===itemId && l.date===key); }
function isEverDone(itemId){ return logs.some(l=>l.itemId===itemId); }
function streakDays(itemId){
  let n=0; const d=new Date();
  while(isDone(itemId,dateKey(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function scheduleLabel(t){
  const timeStr=t.startTime?` · ${t.startTime} Uhr`:"";
  if(t.type==="habit") return "täglich";
  if(t.type==="duty"){
    return {daily:"täglich",every2days:"alle 2 Tage",weekly:"wöchentlich"}[t.scheduleType]||t.scheduleType
      + (t.startDate?` · ab ${t.startDate}`:"") + timeStr;
  }
  if(t.type==="todo"){
    if(t.scheduleType==="weekly"){ const wd=parseDate(t.startDate); return "jeden "+WEEKDAYS[wd?wd.getDay():0]+timeStr; }
    return (t.startDate||"")+timeStr;
  }
  return "";
}

/* ============ GOOGLE OAUTH ============ */
function initTokenClient(){
  try{
    console.log("🔧 Initialisiere tokenClient mit CLIENT_ID:", CLIENT_ID.slice(0,20)+"...");
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: (resp)=>{
        console.log("📱 Token Callback:", resp);
        if(resp && resp.access_token){ accessToken=resp.access_token; if(tokenResolve) tokenResolve(resp); }
        else if(tokenReject) tokenReject(resp);
        tokenResolve=tokenReject=null;
      },
      error_callback: (err)=>{ console.error("❌ Token Fehler:", err); if(tokenReject) tokenReject(err); tokenResolve=tokenReject=null; }
    });
    console.log("✅ tokenClient initialisiert:", tokenClient);
  }catch(e){ console.error("❌ tokenClient init failed:", e); tokenClient=null; }
}
function requestToken(interactive){
  if(!tokenClient){ return Promise.reject(new Error("tokenClient not initialized")); }
  return new Promise((res,rej)=>{ tokenResolve=res; tokenReject=rej;
    // Kein erzwungenes "consent" mehr: Google zeigt den Zustimmungs-Bildschirm
    // nur beim ersten Mal. Danach meist lautlos oder mit kurzer Kontobestätigung.
    try{ tokenClient.requestAccessToken({prompt: ""}); }
    catch(e){ rej(e); } });
}

/* ============ GOOGLE-API-AUFRUFE ============ */
async function api(url, opts={}, retried=false){
  opts.headers = Object.assign({Authorization:"Bearer "+accessToken,"Content-Type":"application/json"}, opts.headers||{});
  const r = await fetch(url, opts);
  if(r.status===401 && !retried){
    console.log("🔄 Token abgelaufen, versuche zu erneuern...");
    try{ 
      await requestToken(false); // Erst silent
    }catch(e){ 
      console.log("  Silent fehlgeschlagen, frage interaktiv");
      toast("Bitte melden Sie sich erneut an");
      await requestToken(true); // Dann mit Popup
    }
    return api(url, opts, true);
  }
  if(!r.ok){ const txt=await r.text(); throw new Error("API "+r.status+": "+txt); }
  if(r.status===204) return null;
  return r.json();
}
const SHEETS="https://sheets.googleapis.com/v4/spreadsheets";
const GTASKS="https://tasks.googleapis.com/tasks/v1";

/* ---- Google Tasks laden (Standardliste, heute fällig + überfällig) ---- */
async function loadGTasks(){
  try{
    // Alle Aufgabenlisten holen, um die Standardliste zuverlässig zu finden
    const lists=await api(`${GTASKS}/users/@me/lists?maxResults=100`);
    const listItems=(lists && lists.items)||[];
    const defaultList=listItems[0]; // erste Liste = Standardliste "Meine Aufgaben"
    if(!defaultList){ gtasksStatus="Keine Aufgabenliste gefunden."; gtasks=[]; return; }
    const res=await api(`${GTASKS}/lists/${encodeURIComponent(defaultList.id)}/tasks?showCompleted=false&maxResults=100`);
    const items=(res && res.items)||[];
    const today=todayKey(); // YYYY-MM-DD
    const open=items.filter(t=>t.status!=="completed");
    const withDate=open.filter(t=>t.due);
    gtasks=withDate.filter(t=>t.due.slice(0,10)<=today);
    gtasksStatus=`Liste "${defaultList.title}": ${items.length} geholt, ${open.length} offen, ${withDate.length} mit Datum, ${gtasks.length} heute/überfällig.`;
    console.log("  ✓ loadGTasks:",gtasksStatus);
  }catch(e){
    gtasksStatus="Fehler beim Laden: "+e.message;
    console.error("❌ loadGTasks Fehler:",e.message);
    gtasks=[];
  }
}

/* ---- Google Task als erledigt zurückschreiben ---- */
async function completeGTask(taskId){
  setSync("busy");
  try{
    const gt=gtasks.find(t=>t.id===taskId);
    // 1) In Google Tasks auf erledigt setzen
    await api(`${GTASKS}/lists/@default/tasks/${encodeURIComponent(taskId)}`, {
      method:"PATCH",
      body:JSON.stringify({status:"completed"})
    });
    // 2) Im Sheet protokollieren (Tasks-Blatt + Log-Blatt)
    if(gt){
      const protoId="gt_"+taskId;
      const dueKey=gt.due?gt.due.slice(0,10):todayKey();
      if(!tasks.some(t=>t.id===protoId)){
        tasks.push({
          id:protoId, type:"todo", title:gt.title||"(ohne Titel)",
          scheduleType:"", startDate:dueKey, weekday:"",
          syncCalendar:false, calendarEventId:"",
          notes:(gt.notes||"")+(gt.notes?" ":"")+"[aus Google Tasks]",
          createdAt:new Date().toISOString(), archived:true,
          calendarId:"", startTime:"", projectId:""
        });
        await saveTasks();
      }
      if(!logs.some(l=>l.itemId===protoId)){
        logs.push({itemId:protoId, date:todayKey(), doneAt:new Date().toISOString()});
        await saveLogs();
      }
    }
    gtasks=gtasks.filter(t=>t.id!==taskId);
    render();
    setSync("on");
  }catch(e){
    console.error("❌ completeGTask Fehler:",e.message);
    alert("Google Task abhaken fehlgeschlagen:\n"+e.message);
    setSync("on");
  }
}
function effectiveCalId(t){ return t.calendarId || defaultCalId || "primary"; }
function calUrl(calId){ return "https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(calId)+"/events"; }

/* ---- Tabelle finden / anlegen ---- */
async function findSheet(){
  const q=encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const res=await api(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`);
  return res.files && res.files.length ? res.files[0].id : null;
}
async function deleteSheet(id){
  if(!id) return;
  console.log("🗑️ deleteSheet:",id);
  try{
    await api(`https://www.googleapis.com/drive/v3/files/${id}`,{method:"DELETE"});
    console.log("✅ deleteSheet OK");
  }catch(e){
    console.warn("deleteSheet Fehler:",e.message);
  }
}
async function createSheet(){
  const ss=await api(SHEETS,{method:"POST",body:JSON.stringify({
    properties:{title:SHEET_NAME},
    sheets:[
      {properties:{title:"Tasks"}},
      {properties:{title:"Log"}},
      {properties:{title:"Projects"}},
      {properties:{title:"Notes"}},
      {properties:{title:"Links"}}
    ]
  })});
  const id=ss.spreadsheetId;
  await api(`${SHEETS}/${id}/values/Tasks!A1?valueInputOption=RAW`,
    {method:"PUT",body:JSON.stringify({values:[TASK_COLS]})});
  await api(`${SHEETS}/${id}/values/Log!A1?valueInputOption=RAW`,
    {method:"PUT",body:JSON.stringify({values:[LOG_COLS]})});
  await api(`${SHEETS}/${id}/values/Projects!A1?valueInputOption=RAW`,
    {method:"PUT",body:JSON.stringify({values:[[JSON.stringify([])]]})});
  await api(`${SHEETS}/${id}/values/Notes!A1?valueInputOption=RAW`,
    {method:"PUT",body:JSON.stringify({values:[[JSON.stringify([])]]})});
  await api(`${SHEETS}/${id}/values/Links!A1?valueInputOption=RAW`,
    {method:"PUT",body:JSON.stringify({values:[[JSON.stringify([])]]})});
  return id;
}
async function ensureSheet(){
  // Lade oder erstelle spreadsheetId
  if(!spreadsheetId){
    spreadsheetId = await findSheet();
    if(!spreadsheetId) spreadsheetId = await createSheet();
    localStorage.setItem("ssid", spreadsheetId);
    console.log("📋 ensureSheet: spreadsheetId=",spreadsheetId);
  }
  
  // Stelle sicher, dass Projects, Notes und Links Tabs existieren (auch bei bestehenden Tabellen!)
  try{
    console.log("🔍 Prüfe ob Projects/Notes/Links Tabs existieren...");
    const ss=await api(`${SHEETS}/${spreadsheetId}?fields=sheets(properties(title))`);
    const titles=(ss.sheets||[]).map(s=>s.properties?.title||"");
    console.log("  Existierende Tabs:",titles);
    
    const needProjects=!titles.includes("Projects");
    const needNotes=!titles.includes("Notes");
    const needLinks=!titles.includes("Links");
    
    if(needProjects || needNotes || needLinks){
      console.log("  Erstelle fehlende Tabs: Projects=",needProjects," Notes=",needNotes," Links=",needLinks);
      const requests=[];
      if(needProjects) requests.push({addSheet:{properties:{title:"Projects"}}});
      if(needNotes) requests.push({addSheet:{properties:{title:"Notes"}}});
      if(needLinks) requests.push({addSheet:{properties:{title:"Links"}}});
      
      const result=await api(`${SHEETS}/${spreadsheetId}:batchUpdate`,{
        method:"POST",
        body:JSON.stringify({requests})
      });
      console.log("  ✓ Tabs erstellt");
      
      // Initialisiere mit leeren Daten
      if(needProjects){
        console.log("  Initialisiere Projects tab...");
        await api(`${SHEETS}/${spreadsheetId}/values/Projects!A1?valueInputOption=RAW`,
          {method:"PUT",body:JSON.stringify({values:[[JSON.stringify([])]]})});
        console.log("    ✓ Projects initialized");
      }
      if(needNotes){
        console.log("  Initialisiere Notes tab...");
        await api(`${SHEETS}/${spreadsheetId}/values/Notes!A1?valueInputOption=RAW`,
          {method:"PUT",body:JSON.stringify({values:[[JSON.stringify([])]]})});
        console.log("    ✓ Notes initialized");
      }
      if(needLinks){
        console.log("  Initialisiere Links tab...");
        await api(`${SHEETS}/${spreadsheetId}/values/Links!A1?valueInputOption=RAW`,
          {method:"PUT",body:JSON.stringify({values:[[JSON.stringify([])]]})});
        console.log("    ✓ Links initialized");
      }
    }else{
      console.log("✅ Alle Tabs vorhanden");
    }
    console.log("✅ ensureSheet OK");
  }catch(e){
    console.error("❌ ensureSheet Tab-Check fehlgeschlagen:",e.message);

/* ============ KALENDER-SYNC ============ */
function rruleFor(t){
  if(t.type==="habit") return ["RRULE:FREQ=DAILY"];
  if(t.type==="duty"){
    if(t.scheduleType==="daily") return ["RRULE:FREQ=DAILY"];
    if(t.scheduleType==="every2days") return ["RRULE:FREQ=DAILY;INTERVAL=2"];
    if(t.scheduleType==="weekly") return ["RRULE:FREQ=WEEKLY"];
  }
  if(t.type==="todo" && t.scheduleType==="weekly") return ["RRULE:FREQ=WEEKLY"];
  return null; // einmalig
}
function nextDayKey(key){ const d=parseDate(key); d.setDate(d.getDate()+1); return dateKey(d); }
function eventBody(t){
  const start=t.startDate||todayKey();
  let body;
  if(t.startTime){
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    const [h,m]=(t.startTime+"").split(":");
    const startHour=parseInt(h),startMin=parseInt(m);
    const endHour=startHour+1;
    let endDate=start,endHourStr=String(endHour).padStart(2,"0"),endMinStr=String(startMin).padStart(2,"0");
    if(endHour>=24){ 
      const d=new Date(parseDate(start)); d.setDate(d.getDate()+1);
      endDate=dateKey(d); endHourStr="00";
    }
    const startDT=start+"T"+t.startTime+":00", endDT=endDate+"T"+endHourStr+":"+endMinStr+":00";
    body={summary:t.title, start:{dateTime:startDT,timeZone:tz}, end:{dateTime:endDT,timeZone:tz}};
  }else{
    body={summary:t.title, start:{date:start}, end:{date:nextDayKey(start)}};
  }
  const rr=rruleFor(t); if(rr) body.recurrence=rr;
  return body;
}
async function syncCalendar(t){
  const url=calUrl(effectiveCalId(t));
  try{
    if(t.syncCalendar){
      if(t.calendarEventId){
        await api(`${url}/${t.calendarEventId}`,{method:"PUT",body:JSON.stringify(eventBody(t))});
      }else{
        const ev=await api(url,{method:"POST",body:JSON.stringify(eventBody(t))});
        t.calendarEventId=ev.id;
      }
    }else if(t.calendarEventId){
      await api(`${url}/${t.calendarEventId}`,{method:"DELETE"});
      t.calendarEventId="";
    }
  }catch(e){ console.warn("Kalender-Sync fehlgeschlagen:",e); toast("Kalender-Sync fehlgeschlagen"); }
}
async function deleteCalendar(t){
  if(t.calendarEventId){ try{ await api(`${calUrl(effectiveCalId(t))}/${t.calendarEventId}`,{method:"DELETE"}); }catch(e){} }
}

}

  if(!stale.length) return false;
  // Verknüpfte Kalendertermine der abgelaufenen Ziele entfernen
  for(const g of stale){ if(g.calendarEventId){ try{ await deleteCalendar(g); }catch(e){} } }

  await saveTasks(); await saveLogs();
  return true;

function pieBlock(done,total){
  const f = total ? done/total : 0;
  const pct = Math.round(f*100);
  const cx=70, cy=70, r=60;
  let wedge;
  if(f<=0) wedge=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--red)"/>`;
  else if(f>=1) wedge=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--green)"/>`;
  else{
    const a0=-Math.PI/2, a1=a0+f*2*Math.PI;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const large=f>0.5?1:0;
    wedge=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--red)"/>`+
      `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="var(--green)"/>`;
  }
  return `<div class="pie-wrap">
    <svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="${pct} Prozent erreicht">${wedge}</svg>
    <div class="pie-pct">${pct}%</div>
    <div class="pie-sub">${done} von ${total} erreicht</div>
    <div class="legend"><span><i class="lg green"></i>erledigt</span><span><i class="lg red"></i>unerledigt</span></div>
  </div>`;
}

function urgencyDays(startDate){
  if(!startDate) return 999;
  const due=parseDate(startDate), today=new Date();
  const d=Math.floor((due-today)/86400000);
  return Math.max(0,d);
}
function urgencyBar(d){
  if(d>3) return "";
  const pct=Math.max(0,(3-d)/3)*100;
  return `<div style="height:4px;background:#4caf50;width:${pct}%;margin-top:4px;border-radius:2px"></div>`;
}
function sortTasksForToday(tasks,key){
  const open=[],done=[];
  tasks.forEach(t=>{
    const d = t.type==="todo" ? isEverDone(t.id) : isDone(t.id,key);
    (d?done:open).push(t);
  });
  const withDate=open.filter(t=>t.startDate).sort((a,b)=>urgencyDays(a.startDate)-urgencyDays(b.startDate));
  const noDate=open.filter(t=>!t.startDate);
  console.log("sortTasksForToday: open=",open.length,"done=",done.length,"withDate=",withDate.length,"noDate=",noDate.length);
  open.forEach((t,i)=>console.log(`  open[${i}]:`,t.type,t.title,"startDate=",t.startDate));
  noDate.forEach((t,i)=>console.log(`  noDate[${i}]:`,t.type,t.title));
  const result=[...withDate,...noDate,...done];
  console.log("sortTasksForToday result order:",result.map((t,i)=>`${i}:${t.type}(${t.title.substring(0,10)})`).join(" "));
  return result;
}

function sortTasksByDateAndTime(tasks){
  return tasks.sort((a,b)=>{
    if(!a.startDate && !b.startDate) return 0;
    if(!a.startDate) return 1;
    if(!b.startDate) return -1;
    const dateA=new Date(a.startDate).getTime();
    const dateB=new Date(b.startDate).getTime();
    if(dateA!==dateB) return dateA-dateB;
    const timeA=(a.startTime||'00:00').split(':').map(Number);
    const timeB=(b.startTime||'00:00').split(':').map(Number);
    const minA=timeA[0]*60+timeA[1], minB=timeB[0]*60+timeB[1];
    return minA-minB;
  });
}

async function saveNotes(){
  console.log("💾 saveNotes START, Anzahl:",notes.length,"spreadsheetId:",spreadsheetId);
  if(!spreadsheetId){
    const msg="FEHLER: spreadsheetId nicht gesetzt!";
    console.error(msg);
    alert(msg);
    throw new Error(msg);
  }
  try{
    // Stelle sicher, dass Notes-Tab existiert
    const ss=await api(`${SHEETS}/${spreadsheetId}?fields=sheets(properties(title))`);
    const titles=(ss.sheets||[]).map(s=>s.properties?.title||"");
    if(!titles.includes("Notes")){
      console.log("  Notes-Tab nicht vorhanden, erstelle ihn...");
      await api(`${SHEETS}/${spreadsheetId}:batchUpdate`,{
        method:"POST",
        body:JSON.stringify({requests:[{addSheet:{properties:{title:"Notes"}}}]})
      });
      console.log("  ✓ Notes-Tab erstellt");
      await new Promise(r=>setTimeout(r,500));
    }
    
    const json=JSON.stringify(notes);
    console.log("  JSON-Länge:",json.length);
    const url=`${SHEETS}/${spreadsheetId}/values/Notes!A1?valueInputOption=RAW`;
    console.log("  Speichere zu:",url);
    const resp=await api(url,{method:"PUT",body:JSON.stringify({values:[[json]]})});
    console.log("✅ saveNotes OK, Antwort:",resp);
    toast("Notizen gespeichert ✓");
    return resp;
  }catch(e){
    const msg="❌ saveNotes FEHLER: "+e.message;
    console.error(msg);
    alert(msg);
    toast(msg);
    throw e;
  }
}
async function loadNotes(){
  try{
    console.log("📖 loadNotes START");
    const res=await api(`${SHEETS}/${spreadsheetId}/values/Notes!A1`);
    const cell=res.values?.[0]?.[0]||"[]";
    console.log("  Geladen, JSON-Länge:",cell.length);
    notes=JSON.parse(cell);
    console.log("✅ loadNotes OK, Anzahl:",notes.length);
  }catch(e){
    console.error("❌ loadNotes FEHLER:",e.message);
    notes=[];
  }
}
async function saveLinks(){
  console.log("💾 saveLinks START, Anzahl:",links.length);
  try{
    const json=JSON.stringify(links);
    const url=`${SHEETS}/${spreadsheetId}/values/Links!A1?valueInputOption=RAW`;
    
    // Versuch 1: Direkt speichern
    console.log("  Versuch 1: Speichern...");
    try{
      await api(url,{method:"PUT",body:JSON.stringify({values:[[json]]})});
      console.log("✅ saveLinks OK (Versuch 1)");
      toast("Links gespeichert ✓");
      return;
    }catch(err){
      // Wenn "Unable to parse range" → Tab existiert nicht
      if(err.message.includes("Unable to parse range")){
        console.log("  Links-Tab existiert nicht, erstelle ihn...");
        try{
          await api(`${SHEETS}/${spreadsheetId}:batchUpdate`,{
            method:"POST",
            body:JSON.stringify({requests:[{addSheet:{properties:{title:"Links"}}}]})
          });
          console.log("  ✓ Links-Tab erstellt");
        }catch(e){
          console.warn("  batchUpdate fehlgeschlagen (Tab existiert vielleicht schon):",e.message);
        }
        
        // Versuch 2: Nach Tab-Erstellung speichern
        console.log("  Versuch 2: Nach 1s erneut speichern...");
        await new Promise(r=>setTimeout(r,1000));
        await api(url,{method:"PUT",body:JSON.stringify({values:[[json]]})});
        console.log("✅ saveLinks OK (Versuch 2)");
        toast("Links gespeichert ✓");
        return;
      }
      // Andere Fehler → durchreichen
      throw err;
    }
  }catch(e){
    console.error("❌ saveLinks FEHLER:",e.message);
    alert("Links speichern FEHLGESCHLAGEN:\n"+e.message);
    throw e;
  }
}

  let typeFields="";
  if(type==="habit"){
    typeFields=`<label>Name</label><input type="text" id="f_title" value="${esc(t.title||"")}" placeholder="z. B. 20 Min lesen">`;
  }
  if(type==="goal"){
    typeFields=`<label>Ziel</label><input type="text" id="f_title" value="${esc(t.title||"")}" placeholder="z. B. 2 l Wasser trinken">
      <p class="muted" style="font-size:12px;margin-top:8px">Wird täglich um Mitternacht geleert — morgens neu eintragen.</p>`;
  }
  if(type==="duty"){
    const st=t.scheduleType||"daily";
    typeFields=`<label>Titel</label><input type="text" id="f_title" value="${esc(t.title||"")}" placeholder="z. B. Vokabeln wiederholen">
      <label>Rhythmus</label>
      <div class="seg" id="f_sched">
        <button data-v="daily" class="${st==="daily"?"sel":""}">täglich</button>
        <button data-v="every2days" class="${st==="every2days"?"sel":""}">alle 2 Tage</button>
        <button data-v="weekly" class="${st==="weekly"?"sel":""}">wöchentlich</button>
      </div>
      <label>Startdatum</label><input type="date" id="f_start" value="${t.startDate||todayKey()}">
      <label>Uhrzeit (optional)</label><input type="time" id="f_time" value="${t.startTime||""}">`;
  }
  if(type==="todo"){
    const weekly=t.scheduleType==="weekly";
    const curProj=(isEdit && t.projectId) ? t.projectId : "";
    const projSelect=`<label>Projekt (optional)</label>
      <select id="f_proj">
        <option value="">— kein Projekt —</option>
        ${projects.filter(p=>!p.archived).map(p=>`<option value="${esc(p.id)}" ${p.id===curProj?"selected":""}>${esc(p.name)}</option>`).join("")}
      </select>`;
    typeFields=`<label>Titel</label><input type="text" id="f_title" value="${esc(t.title||"")}" placeholder="z. B. Klassenarbeit korrigieren">
      <label>Datum (optional)</label><input type="date" id="f_start" value="${t.startDate||""}">
      <label>Uhrzeit (optional)</label><input type="time" id="f_time" value="${t.startTime||""}">
      ${projSelect}
      <div class="toggle-row"><div><div style="font-size:14px">Wöchentlich wiederholen</div>
        <div class="muted" style="font-size:12px" id="wdHint"></div></div>
        <button class="switch ${weekly?"on":""}" id="f_weekly"></button></div>`;
  }
  const sync = isEdit ? (t.syncCalendar!==false) : (type==="todo" ? false : DEFAULT_SYNC);
  const syncToggle = (type==="goal") ? "" : `<div class="toggle-row"><div><div style="font-size:14px">In Google Calendar</div>
    <div class="muted" style="font-size:12px">Termin synchronisieren</div></div>
    <button class="switch ${sync?"on":""}" id="f_sync"></button></div>`;
  const curCal = (isEdit && t.calendarId) ? t.calendarId : defaultCalId;
  const calSelect = (type==="goal") ? "" : `<label>Kalender</label>
    <select id="f_cal">${calendars.map(c=>`<option value="${esc(c.id)}" ${c.id===curCal?"selected":""}>${esc(c.summary)}</option>`).join("")}</select>`;
  const titleTxt={habit:"Gewohnheit",duty:"Pflichtaufgabe",todo:"ToDo",goal:"Tages-Ziel"}[type];

  main.insertAdjacentHTML("beforeend",
    `<div class="modal-bg" id="modalBg"><div class="modal">
      <h2>${isEdit?"Bearbeiten":"Neu: "+titleTxt}</h2>
      ${typeFields}${syncToggle}${calSelect}
      <label>Notizen (optional)</label><textarea id="f_notes" placeholder="Zusätzliche Infos..." style="width:100%;min-height:60px;padding:8px;border:1px solid var(--line);border-radius:6px;font-family:inherit;resize:vertical">${esc(existing?.notes||"")}</textarea>
      <div class="modal-actions">
        <button class="btn-ghost" id="f_cancel">Abbrechen</button>
        <button class="btn-primary" id="f_save">Speichern</button>
      </div>
    </div></div>`);

  // Interaktionen
  const segSel={v: (existing&&existing.scheduleType)|| (type==="duty"?"daily":"once")};
  const segEl=$("f_sched");
  if(segEl) segEl.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    segEl.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); segSel.v=b.dataset.v; });
  const syncBtn=$("f_sync"); if(syncBtn) syncBtn.onclick=()=>syncBtn.classList.toggle("on");
  const weeklyBtn=$("f_weekly");
  function updWdHint(){ if(!weeklyBtn) return; const s=$("f_start").value; const wd=parseDate(s);
    $("wdHint").textContent = weeklyBtn.classList.contains("on") && wd ? "jeden "+WEEKDAYS[wd.getDay()] : ""; }
  if(weeklyBtn){ weeklyBtn.onclick=()=>{ weeklyBtn.classList.toggle("on"); updWdHint(); };
    $("f_start").onchange=updWdHint; updWdHint(); }
  $("f_cancel").onclick=()=>$("modalBg").remove();
  $("modalBg").onclick=(e)=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };

  $("f_save").onclick=async()=>{
    const title=$("f_title").value.trim();
    if(!title){ toast("Titel fehlt"); return; }
    const data={type, title, syncCalendar: syncBtn ? syncBtn.classList.contains("on") : false};
    if(type==="habit"){ data.scheduleType="daily"; data.startDate=t.startDate||todayKey(); }
    if(type==="goal"){ data.scheduleType="daily"; data.startDate=t.startDate||todayKey(); data.syncCalendar=true; }
    if(type==="duty"){ data.scheduleType=segSel.v; data.startDate=$("f_start").value; }
    if(type==="todo"){ data.startDate=$("f_start").value;
      data.scheduleType=weeklyBtn.classList.contains("on")?"weekly":"once";
      const wd=parseDate(data.startDate); data.weekday=wd?String(wd.getDay()):"";
      const fp=$("f_proj"); if(fp && fp.value) data.projectId=fp.value; }
    const ft=$("f_time"); if(ft && ft.value) data.startTime=ft.value;
    const cs=$("f_cal"); if(cs) data.calendarId=cs.value;
    const fn=$("f_notes"); if(fn && fn.value.trim()) data.notes=fn.value.trim();
    $("modalBg").remove();
    if(isEdit) await updateTask(existing.id, data); else await addTask(data);
  };
}

function openProjectForm(existing){
  const isEdit=!!existing;
  document.body.insertAdjacentHTML("beforeend",
    `<div class="modal-bg" id="modalBg"><div class="modal">
      <h2>${isEdit?"Projekt bearbeiten":"Neues Projekt"}</h2>
      <label>Name</label><input type="text" id="f_name" value="${esc(existing?.name||"")}" placeholder="z. B. Blogpost über AI">
      <label>Link (optional)</label><input type="text" id="f_url" value="${esc(existing?.url||"")}" placeholder="https://example.com" style="width:100%;padding:10px;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;font-size:14px">
      <label style="margin-top:12px">Priorität (1–5)</label>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        ${[5,4,3,2,1].map(p=>`<button data-prio="${p}" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:4px;cursor:pointer;${(existing?.priority||1)==p?'background-color:var(--text);color:#fff':'background-color:transparent'}">${p}</button>`).join("")}
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="f_cancel">Abbrechen</button>
        <button class="btn-primary" id="f_save">Speichern</button>
      </div>
    </div></div>`);
  
  let prioVal=(existing?.priority||1);
  document.querySelectorAll('[data-prio]').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('[data-prio]').forEach(x=>{ x.style.backgroundColor='transparent'; x.style.color=''; });
      b.style.backgroundColor='var(--text)'; b.style.color='#fff'; prioVal=parseInt(b.dataset.prio);
    };
  });
  $("f_cancel").onclick=()=>$("modalBg").remove();
  $("f_save").onclick=async()=>{
    const name=$("f_name").value.trim();
    if(!name){ toast("Name erforderlich"); return; }
    const data={name, priority:prioVal};
    const url=$("f_url").value.trim();
    if(url) data.url=url;
    $("modalBg").remove();
    if(isEdit) await updateProject(existing.id, data); else await addProject(data);
  };
  $("modalBg").onclick=(e)=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };
}

/* ============ EVENTS ============ */
$("nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ view=b.dataset.view; render(); }});
$("fab").addEventListener("click",()=>{
  if(view==="goals"){
    if(tasks.filter(t=>t.type==="goal"&&!t.archived).length>=4){ toast("Maximal 4 Tages-Ziele"); return; }
    return openForm("goal");
  }
  if(view==="projects") return openProjectForm();
  if(view==="links") return openLinkForm();
  if(view==="notes") return openNoteForm();
  openForm(view==="habits"?"habit":view==="duties"?"duty":"todo");
});
main.addEventListener("click",e=>{
  const tg=e.target.closest("[data-toggle]"); if(tg){ toggleDone(tg.dataset.toggle, tg.dataset.key); return; }
  const gt=e.target.closest("[data-gtask]"); if(gt){ completeGTask(gt.dataset.gtask); return; }
  const ed=e.target.closest("[data-edit]"); if(ed){ const t=tasks.find(x=>x.id===ed.dataset.edit); if(t) openForm(t.type,t); return; }
  const dl=e.target.closest("[data-del]"); if(dl){
    const dt=tasks.find(x=>x.id===dl.dataset.del);
    const msg=(dt && dt.calendarEventId) ? "Wirklich löschen? Der verknüpfte Kalendertermin wird mitentfernt." : "Wirklich löschen?";
    if(confirm(msg)) deleteTask(dl.dataset.del); return;
  }
  const en=e.target.closest("[data-edit-note]"); if(en){ const n=notes.find(x=>x.id===en.dataset.editNote); if(n) openNoteForm(n); return; }
  const donn=e.target.closest("[data-done-note]"); if(donn){ 
    console.log("🔵 done-note clicked:", donn.dataset.doneNote);
    const n=notes.find(x=>x.id===donn.dataset.doneNote); 
    console.log("  Note gefunden:", n);
    if(n) updateNote(n.id, {archived:!n.archived}); 
    return; 
  }
  const dn=e.target.closest("[data-del-note]"); if(dn){ deleteNote(dn.dataset.delNote); return; }
  const vp=e.target.closest("[data-view-proj]"); if(vp){ 
    console.log("🎯 Projekt-Button geklickt! data-view-proj:", vp.dataset.viewProj);
    selectedProjectId=vp.dataset.viewProj; 
    view="projectDetail"; 
    render(); 
    return; 
  }
  const dopp=e.target.closest("[data-done-proj]"); if(dopp){ 
    const p=projects.find(x=>x.id===dopp.dataset.doneProj); 
    if(p) updateProject(p.id, {archived:!p.archived}); 
    return; 
  }
  const ep=e.target.closest("[data-edit-proj]"); if(ep){ const p=projects.find(x=>x.id===ep.dataset.editProj); if(p) openProjectForm(p); return; }
  const dp=e.target.closest("[data-del-proj]"); if(dp){
    if(confirm("Projekt wirklich löschen?")) deleteProject(dp.dataset.delProj); return;
  }
  const el=e.target.closest("[data-edit-link]"); if(el){ const l=links.find(x=>x.id===el.dataset.editLink); if(l) openLinkForm(l); return; }
  const dl2=e.target.closest("[data-del-link]"); if(dl2){ deleteLink(dl2.dataset.delLink); return; }
});

/* ============ ANMELDUNG / START ============ */
async function bootData(){
  console.log("🚀 bootData START");
  setSync("busy");
  try{
    console.log("1️⃣ ensureSheet...");
    await ensureSheet();
    console.log("  ✓ ensureSheet ok, spreadsheetId:",spreadsheetId);
    
    console.log("2️⃣ loadAll...");
    await loadAll();
    console.log("  ✓ loadAll ok, tasks:",tasks.length,"projects:",projects.length,"notes:",notes.length);
    
    console.log("3️⃣ purgeStaleGoals...");
    await purgeStaleGoals();
    console.log("  ✓ purgeStaleGoals ok");
    
    console.log("4️⃣ loadCalendars...");
    await loadCalendars();
    console.log("  ✓ loadCalendars ok, calendars:",calendars.length);
    
    console.log("5️⃣ loadGTasks...");
    await loadGTasks();
    
    setSync("on");
    $("acctBtn").textContent="Verbunden";
    $("nav").style.display="flex";
    render();
    console.log("✅ bootData FERTIG");
  }catch(e){
    console.error("❌ bootData FEHLER:",e.message);
    alert("Anmeldung fehlgeschlagen:\n"+e.message);
    setSync("off");
  }
}
async function signIn(){
  try{
    await requestToken(true);
    await bootData();
  }catch(e){ console.error(e); toast("Anmeldung abgebrochen"); showSignin(); }
}
function signOut(){
  if(accessToken){ try{ google.accounts.oauth2.revoke(accessToken,()=>{}); }catch(e){} }
  accessToken=null; tasks=[]; logs=[];
  localStorage.removeItem("ssid"); spreadsheetId=null;
  $("nav").style.display="none"; $("fab").style.display="none";
  $("acctBtn").textContent="Anmelden"; setSync("");
  showSignin();
}
function showSignin(){
  $("hTitle").textContent="ToDo";
  main.innerHTML=`<div class="signin">
    <div style="font-size:48px">📋</div>
    <h2 style="margin:0">Mit Google verbinden</h2>
    <p>Aufgaben, Gewohnheiten und Termine werden in deiner eigenen Google-Tabelle gespeichert und – optional – mit Google Calendar synchronisiert.</p>
    <button class="btn-primary" id="signinBtn">Mit Google anmelden</button>
  </div>`;
  $("signinBtn").onclick=signIn;
}

$("acctBtn").addEventListener("click",()=>{ if(accessToken) view="settings",render(); else signIn(); });

// Auf GIS-Skript warten
(function waitGIS(){
  if(window.google && google.accounts && google.accounts.oauth2){
    console.log("✅ Google Library geladen");
    try{
      initTokenClient(); 
      console.log("✅ tokenClient initialized");
      showSignin();
    }catch(e){
      console.error("❌ Init-Fehler:", e);
      showSignin();
    }
  }else{
    console.log("⏳ Warte auf Google Library...", {google: !!window.google, accounts: !!window.google?.accounts, oauth2: !!window.google?.accounts?.oauth2});
    setTimeout(waitGIS,50);
  }
})();

// Tageswechsel: Tages-Ziele um Mitternacht zurücksetzen (Ansicht bei laufender App)
let _curDay=todayKey();
setInterval(async()=>{ const k=todayKey(); if(k!==_curDay){ _curDay=k; if(accessToken){ await purgeStaleGoals(); render(); } } },60000);

// Service Worker
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
