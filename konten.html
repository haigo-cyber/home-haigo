function parsePayload(txt){ const o = JSON.parse(txt); return normalizeState(o && o.data && typeof o.data === 'object' ? o.data : o); }
function canon(s){
  return JSON.stringify({
    a:s.accounts.slice().sort((x, y) => x.id < y.id ? -1 : 1).map(a => [a.id, a.name, a.type, a.bank, a.owner, a.tags, a.liab, a.archived, !!a.norep]),
    e:s.entries.map(e => [e.accId, e.date, e.amount, e.note]).sort((x, y) => (x[0] + x[1]) < (y[0] + y[1]) ? -1 : 1),
    v:s.meta.views.map(v => [v.id, v.title, v.kind, v.group, v.f, v.range, v.at, v.archiv, v.total])
  });
}
function sumState(s){
  const last = s.entries.reduce((m, e) => e.date > m ? e.date : m, '');
  return `${s.accounts.length} Konten, ${s.entries.length} Kontostände` + (last ? `, letzter Stand ${fd(last)}` : '');
}
/* Vereinigung zweier Staende. Geloeschte Eintraege koennen dabei zurueckkehren, bei abweichenden Betraegen gilt der lokale Wert. */
function mergeStates(a, b){
  const s = JSON.parse(JSON.stringify(a)), am = {}; let addA = 0, addE = 0, diffE = 0, addV = 0;
  b.accounts.forEach(x => {
    let m = s.accounts.find(y => y.id === x.id) || s.accounts.find(y => y.name.toLowerCase() === x.name.toLowerCase());
    if (!m) { m = JSON.parse(JSON.stringify(x)); s.accounts.push(m); addA++; }
    am[x.id] = m.id;
  });
  b.entries.forEach(e => {
    const id = am[e.accId]; if (!id) return;
    const ex = s.entries.find(y => y.accId === id && y.date === e.date);
    if (!ex) { s.entries.push(Object.assign({}, e, {accId:id, id:uid()})); addE++; } else if (ex.amount !== e.amount) diffE++;
  });
  const vids = new Set(s.meta.views.map(v => v.id));
  b.meta.views.forEach(v => { if (!vids.has(v.id)) { s.meta.views.push(JSON.parse(JSON.stringify(v))); addV++; } });
  return {state:normalizeState(s), addA, addE, diffE, addV};
}

/* ---------- Sicherungskopien in Drive ---------- */
async function dbackup(tag){
  if (!dm.fileId) return;
  const day = todayISO();
  if (!tag && dm.backupDay === day) return;
  dm.backupId = await ensureFolder(D_BACKUP, dm.folderId, dm.backupId); saveDM();
  const list = await dlist(`'${dm.backupId}' in parents and trashed=false`, 'files(id,name)', {orderBy:'name desc'});
  let name;
  if (tag) { const n = new Date(); name = `konten-sicherung-${day}-${pad2(n.getHours())}${pad2(n.getMinutes())}-${tag}.json`; }
  else { name = `konten-sicherung-${day}.json`; if (list.some(f => f.name === name)) { dm.backupDay = day; saveDM(); await dprune(list.slice(D_KEEP)); return; } }
  await dapi(D_API + 'files/' + encodeURIComponent(dm.fileId) + '/copy?fields=id,name', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, parents:[dm.backupId]})});
  if (!tag) { dm.backupDay = day; saveDM(); }
  await dprune(list.slice(D_KEEP - 1));
}
/* Aeltere Sicherungskopien in den Drive-Papierkorb verschieben (nur die ueber dem Limit). */
async function dprune(old){
  for (const f of old) {
    try { await dapi(D_API + 'files/' + encodeURIComponent(f.id), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})}); } catch (e) { console.warn('Aufräumen', e); }
  }
}

/* ---------- Abfrage bei Konflikt ---------- */
function resolveConflict(rs, remote){
  return choose({
    title:'Unterschiedliche Stände',
    text:`Google Drive: ${sumState(rs)}\n(zuletzt geändert ${fdt(remote.modifiedTime)})\n\nDieser Browser: ${sumState(wsObj())}\n\nNichts geht verloren: Vor jedem Überschreiben in Drive wird eine Sicherungskopie angelegt, und ein ersetzter lokaler Stand bleibt als Notkopie im Browser.`,
    options:[
      {key:'merge', label:'Beide zusammenführen', sub:'Empfohlen. Gelöschte Einträge können zurückkehren.', primary:true},
      {key:'remote', label:'Stand aus Drive übernehmen', sub:'Lokale Änderungen werden ersetzt.'},
      {key:'local', label:'Diesen Browser nach Drive hochladen', sub:'Der Drive-Stand wird ersetzt (vorher kopiert).'},
      {key:'cancel', label:'Später entscheiden'}
    ]});
}

/* ---------- Synchronisation ---------- */
async function driveSync(opts = {}){
  if (!dm.on) return;
  if (dd.hold && !opts.force) return;
  dd.hold = false;
  setStatus('busy');
  try {
    await ensureToken(!!opts.interactive);
    dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId); saveDM();
    let remote = null, lost = false;
    if (dm.fileId) { try { const m = await dmeta(dm.fileId); if (!m.trashed) remote = m; } catch (e) { if (e.status !== 404) throw e; } }
    if (!remote) {
      const f = await dfind(dm.folderId);
      if (f) { remote = f; if (dm.fileId && f.id !== dm.fileId) dm.version = ''; dm.fileId = f.id; saveDM(); }
      else if (dm.fileId) { lost = true; dm.fileId = ''; dm.version = ''; saveDM(); }
    }
    const localHas = hasData(wsObj());
    const upload = async tag => {
      const my = rev, content = payload();
      if (remote) { await dbackup(tag || dd.nextTag || ''); dd.nextTag = ''; const res = await dupdate(remote.id, content); dm.version = res.version; }
      else { const res = await dcreate(dm.folderId, content); dm.fileId = res.id; dm.version = res.version; remote = {id:res.id, version:res.version}; }
      dm.lastSaved = new Date().toISOString();
      if (rev === my) dm.dirty = false;
      saveDM();
    };
    const takeRemote = (rs, msg) => { replaceState(rs, {noSync:true}); dm.version = remote.version; dm.dirty = false; saveDM(); render(); if (msg) toast(msg, 3500); };

    if (!remote) {
      if (localHas) { if (lost) toast('Die Drive-Datei war gelöscht und wird neu angelegt.', 4500); await upload(); }
      else { dm.dirty = false; saveDM(); }
    } else if (remote.version === dm.version) {
      if (dm.dirty || opts.force) await upload();
    } else {
      const rs = parsePayload(await dread(remote.id));
      if (canon(rs) === canon(wsObj())) { dm.version = remote.version; dm.dirty = false; saveDM(); }
      else if (!localHas) takeRemote(rs, 'Stand aus Google Drive geladen');
      else if (dm.version && !dm.dirty) takeRemote(rs, 'Neuerer Stand aus Google Drive geladen (anderes Gerät)');
      else {
        setStatus('conflict');
        const ch = await resolveConflict(rs, remote);
        if (ch === 'remote') takeRemote(rs, 'Stand aus Drive übernommen');
        else if (ch === 'local') { await upload('vor-ueberschreiben'); toast('Lokaler Stand nach Drive hochgeladen'); }
        else if (ch === 'merge') {
          const mg = mergeStates(wsObj(), rs);
          replaceState(mg.state, {noSync:true}); dm.dirty = true; rev++;
          await upload('vor-zusammenfuehren'); render();
          toast(`Zusammengeführt: ${mg.addE} Kontostände, ${mg.addA} Konten, ${mg.addV} Auswertungen aus Drive ergänzt` + (mg.diffE ? `. ${mg.diffE} abweichende Beträge: lokaler Wert behalten.` : ''), 6000);
        } else {
          if (opts.connecting) { dm.on = false; saveDM(); setStatus('off'); return; }
          dd.hold = true; setStatus('conflict'); return;
        }
      }
    }
    dd.lastCheck = Date.now();
    if (dm.dirty) { setStatus('pending'); clearTimeout(dd.timer); dd.timer = setTimeout(() => dq(() => driveSync({})), D_DEBOUNCE); }
    else setStatus('ok');
  } catch (e) { handleErr(e); }
}
function driveTouch(){
  if (!dm.on) return;
  rev++; dm.dirty = true; saveDM();
  if (dd.state === 'auth' || dd.state === 'conflict' || dd.state === 'unavail') { updatePill(); return; }
  setStatus('pending');
  if (!dm.auto) return;
  clearTimeout(dd.timer); dd.timer = setTimeout(() => dq(() => driveSync({})), D_DEBOUNCE);
}
async function driveConnect(){
  if (location.protocol === 'file:') { setStatus('unavail'); return; }
  try { setStatus('busy'); await requestToken(true); } catch (e) { dm.on ? handleErr(e) : (setStatus('off'), toast(e.message, 4000)); return; }
  dm.on = true; saveDM(); dq(() => driveSync({connecting:true}));
}
async function driveSignIn(){
  try { setStatus('busy'); await requestToken(true); } catch (e) { handleErr(e); return; }
  dq(() => driveSync({}));
}
async function driveStart(){
  if (!dm.on) { updatePill(); return; }
  if (location.protocol === 'file:') { setStatus('unavail'); return; }
  for (let i = 0; i < 160 && !gisOK(); i++) await sleep(50);
  if (!gisOK()) { setStatus('auth', 'Google-Anmeldung nicht geladen (offline?)'); return; }
  dq(() => driveSync({}));
}
function driveSaveNow(){
  gestureToken().then(() => { dd.hold = false; dq(() => driveSync({force:true, interactive:true})); }).catch(handleErr);
}
function driveLoadNow(){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId, false); saveDM();
      const remote = dm.folderId ? await dfind(dm.folderId) : null;
      if (!remote) { toast('In Drive gibt es noch keine Datei.', 3500); setStatus(dm.dirty ? 'pending' : 'ok'); return; }
      const rs = parsePayload(await dread(remote.id));
      setStatus(dm.dirty ? 'pending' : 'ok');
      const ok = await modal({title:'Stand aus Drive laden?', text:`Drive: ${sumState(rs)}\nDieser Browser: ${sumState(wsObj())}\n\nDer lokale Stand wird ersetzt` + (dm.dirty ? ' (noch nicht gesicherte Änderungen gehen dabei verloren)' : '') + '. Er bleibt als Notkopie im Browser erhalten.', ok:'Ersetzen', danger:true});
      if (!ok) return;
      dm.fileId = remote.id; dm.version = remote.version; dm.dirty = false; dd.hold = false;
      replaceState(rs, {noSync:true}); saveDM(); setStatus('ok'); render(); toast('Stand aus Drive geladen');
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
function driveListBackups(){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId, false);
      dm.backupId = dm.folderId ? await ensureFolder(D_BACKUP, dm.folderId, dm.backupId, false) : ''; saveDM();
      dd.backups = dm.backupId ? await dlist(`'${dm.backupId}' in parents and trashed=false`, 'files(id,name,modifiedTime,size)', {orderBy:'name desc'}) : [];
      setStatus(dm.dirty ? 'pending' : 'ok');
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
function driveRestore(id, name){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      const rs = parsePayload(await dread(id));
      setStatus(dm.dirty ? 'pending' : 'ok');
      const ok = await modal({title:'Sicherung einlesen?', text:`${name}\n${sumState(rs)}\n\nDer aktuelle Stand (${sumState(wsObj())}) wird ersetzt. In Drive wird vorher eine Sicherungskopie des aktuellen Standes angelegt.`, ok:'Einlesen', danger:true});
      if (!ok) return;
      dd.nextTag = 'vor-wiederherstellung'; replaceState(rs); render(); toast('Sicherung eingelesen, wird nach Drive gespeichert', 4000);
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
async function driveDisconnect(){
  if (!await modal({title:'Verbindung trennen?', text:'Die Dateien in Google Drive und die Daten in diesem Browser bleiben unverändert erhalten. Es wird nur nicht mehr synchronisiert.', ok:'Trennen'})) return;
  if (dd.token && gisOK()) { try { google.accounts.oauth2.revoke(dd.token, () => {}); } catch (e) {} }
  dd.token = null; dd.exp = 0; dd.backups = null; dd.hold = false; clearTimeout(dd.timer);
  dm = Object.assign(loadDM(), {on:false, fileId:'', folderId:'', backupId:'', version:'', lastSaved:'', dirty:false, backupDay:''}); saveDM();
  setStatus('off'); toast('Verbindung getrennt');
}
function pillClick(){
  const st = dd.state;
  if (st === 'auth') driveSignIn();
  else if (st === 'conflict') driveSaveNow();
  else if (st === 'error') dq(() => driveSync({}));
  else go('daten');
}

function driveCardInner(){
  const [lab, long] = driveLabel();
  if (!dm.on) {
    return `<p class="hint">Deine Konten werden als Datei <code>${D_FILE}</code> im Drive-Ordner „${D_FOLDER}“ gespeichert, mit täglicher Sicherungskopie. So hast du am Handy und am Rechner denselben Stand. Das Tool sieht in Drive nur Dateien, die es selbst angelegt hat.</p>`
      + (location.protocol === 'file:' ? `<p class="note">Die Google-Anmeldung funktioniert nur, wenn das Tool über seine https-Adresse geöffnet wird (GitHub Pages), nicht als lokale Datei.</p>` : '')
      + `<div class="btns"><button class="primary" data-act="driveconnect"${location.protocol === 'file:' ? ' disabled' : ''}>Mit Google Drive verbinden</button></div>${dd.msg ? `<p class="msg">${esc(dd.msg)}</p>` : ''}`;
  }
  const fl = dm.fileId ? `<a href="https://drive.google.com/file/d/${encodeURIComponent(dm.fileId)}/view" target="_blank" rel="noopener">${D_FILE}</a>` : D_FILE + ' (wird beim ersten Speichern angelegt)';
  const fo = dm.folderId ? `<a href="https://drive.google.com/drive/folders/${encodeURIComponent(dm.folderId)}" target="_blank" rel="noopener">${D_FOLDER}</a>` : D_FOLDER;
  let h = `<p><strong>${esc(lab)}</strong><span class="sub">${esc(long)}</span></p>${dd.msg ? `<p class="msg">${esc(dd.msg)}</p>` : ''}
    <p class="hint" style="margin-top:0">Ordner: ${fo}<br>Datei: ${fl}<br>Letzte Speicherung: ${dm.lastSaved ? fdt(dm.lastSaved) : 'noch keine'}<br>Sicherungskopien: täglich im Unterordner „${D_BACKUP}“, die letzten ${D_KEEP} bleiben erhalten.</p>
    <div class="btns"><button class="primary" data-act="drivesave">Jetzt speichern</button><button class="btn" data-act="driveload">Stand aus Drive laden</button><button class="btn" data-act="drivebackups">Sicherungen anzeigen</button><button class="btn" data-act="drivedisconnect">Verbindung trennen</button></div>
    <div class="checkrow" style="margin-top:12px"><input type="checkbox" id="driveAuto"${dm.auto ? ' checked' : ''}><label for="driveAuto" style="margin:0">Änderungen automatisch nach Drive speichern</label></div>`;
  if (dd.backups) {
    h += `<h3>Sicherungen in Drive (${dd.backups.length})</h3>`;
    h += dd.backups.length ? `<div class="histlist">${dd.backups.map(f => `<div><span>${esc(f.name.replace(/^konten-sicherung-/, '').replace(/\.json$/, ''))}</span><button class="btn small" data-act="driverestore" data-id="${esc(f.id)}" data-name="${esc(f.name)}">Einlesen</button></div>`).join('')}</div>` : `<p class="hint">Noch keine Sicherungskopien. Die erste entsteht beim ersten Überschreiben der Datei.</p>`;
  }
  return h;
}

window.addEventListener('online', () => { if (dm.on && dm.dirty && dd.state === 'error') dq(() => driveSync({})); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !dm.on || dd.hold || !tokenValid() || dd.state === 'busy') return;
  if ($('#modal-root').innerHTML) return;
  if (Date.now() - dd.lastCheck > 60000) dq(() => driveSync({}));
});


/* ======================================================================
   Tooltips und Ereignisse
   ====================================================================== */
const tipEl = $('#tip');
function showTip(el, e){
  tipEl.textContent = el.getAttribute('data-tip'); tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 6) x = innerWidth - r.width - 6;
  if (x < 6) x = 6;
  if (y + r.height > innerHeight - 6) y = Math.max(6, e.clientY - r.height - 14);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
const hideTip = () => { tipEl.style.display = 'none'; };
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); });
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); else hideTip(); });
document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); else hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});

function moveView(id, d){
  const vs = state.meta.views, i = vs.findIndex(v => v.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= vs.length) return;
  [vs[i], vs[j]] = [vs[j], vs[i]]; saveState(); render();
}
document.addEventListener('click', async e => {
  const nav = e.target.closest('#nav button'); if (nav) { go(nav.dataset.tab); return; }
  if (e.target.closest('#drivepill')) { pillClick(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'goto': go(b.dataset.tab); break;
    case 'sort': { const k = b.dataset.key; ui.sort = ui.sort.key === k ? {key:k, dir:-ui.sort.dir} : {key:k, dir:['name', 'type', 'owner', 'tags'].includes(k) ? 1 : -1}; render(); break; }
    case 'eclear': document.querySelectorAll('.kinput').forEach(i => { i.value = ''; }); updateESum(); break;
    case 'demo': {
      if (hasData(state)) { if (!await modal({title:'Beispieldaten laden?', text:'Die vorhandenen Daten werden durch erfundene Beispieldaten ersetzt. Der vorherige Stand bleibt als Notkopie im Reiter Daten.', ok:'Ersetzen', danger:true})) break; }
      loadDemo(); go('uebersicht'); toast('Beispieldaten geladen'); break;
    }
    case 'wipe': {
      if (!await modal({title:'Alle Daten löschen?', text:'Alle Konten, Kontostände und Auswertungen in diesem Browser werden gelöscht. Hast du vorher eine Sicherung gespeichert?', ok:'Endgültig löschen', danger:true})) break;
      replaceState(emptyState()); render(); toast('Alle Daten gelöscht. Der vorherige Stand bleibt als Notkopie im Reiter Daten.', 4500); break;
    }
    case 'reptex': exportReportTex(); break;
    case 'exportjson': exportJSON(); break;
    case 'importjson': $('#jsonfile').click(); break;
    case 'exportcsv': exportCSV(); break;
    case 'exportwide': exportWide(); break;
    case 'importcsv': $('#csvfile').click(); break;
    case 'driveconnect': driveConnect(); break;
    case 'drivesave': driveSaveNow(); break;
    case 'driveload': driveLoadNow(); break;
    case 'drivebackups': driveListBackups(); break;
    case 'driverestore': driveRestore(b.dataset.id, b.dataset.name); break;
    case 'drivedisconnect': driveDisconnect(); break;
    case 'prevrestore': {
      const pv = prevInfo(); if (!pv) break;
      if (!await modal({title:'Vorherigen Stand wiederherstellen?', text:`${sumState(pv.state)}\ngesichert am ${fdt(pv.saved)}\n\nDer aktuelle Stand (${sumState(state)}) wird ersetzt und bleibt seinerseits als Notkopie erhalten.`, ok:'Wiederherstellen', danger:true})) break;
      replaceState(pv.state); render(); toast('Vorheriger Stand wiederhergestellt'); break;
    }
    case 'accedit': ui.accEdit = b.dataset.id; render(); window.scrollTo(0, 0); break;
    case 'acccancel': ui.accEdit = null; render(); break;
    case 'accarch': {
      const a = accById(b.dataset.id); if (!a) break;
      const lastE = valueAt(a.id, LAST);
      if (!a.archived && lastE && Math.abs(lastE.amount) > 0.004 && !await modal({title:`„${a.name}“ archivieren?`, text:`Der letzte Stand beträgt ${eur(lastE.amount)} (${fd(lastE.date)}). Das Konto verschwindet aus Eingabe und Übersicht. In Auswertungen mit archivierten Konten bleibt dieser Stand weiterhin stehen. Trage ggf. vorher den Endstand 0 ein.`, ok:'Archivieren'})) break;
      a.archived = !a.archived; saveState(); render(); toast(a.archived ? 'Konto archiviert' : 'Konto wieder aktiv'); break;
    }
    case 'accdel': {
      const a = accById(b.dataset.id); if (!a) break;
      const n = (entriesBy().get(a.id) || []).length;
      if (!await modal({title:`Konto „${a.name}“ löschen?`, text:`Das Konto wird mit ${n} ${n === 1 ? 'Kontostand' : 'Kontoständen'} endgültig gelöscht. Zum Ausblenden ist Archivieren besser.`, ok:'Endgültig löschen', danger:true})) break;
      state.accounts = state.accounts.filter(x => x.id !== a.id); state.entries = state.entries.filter(x => x.accId !== a.id);
      state.meta.views.forEach(v => { v.f.acc = v.f.acc.filter(x => x !== a.id); });
      if (ui.accEdit === a.id) ui.accEdit = null; saveState(); render(); toast('Konto gelöscht'); break;
    }
    case 'cell': editCell(b.dataset.acc, b.dataset.date); break;
    case 'datedel': {
      const d = b.dataset.date, n = state.entries.filter(x => x.date === d).length;
      if (!await modal({title:`Alle Werte vom ${fd(d)} löschen?`, text:`${n} Kontostand${n === 1 ? '' : 'e'} an diesem Tag werden gelöscht.`, ok:'Löschen', danger:true})) break;
      state.entries = state.entries.filter(x => x.date !== d); saveState(); render(); toast('Gelöscht'); break;
    }
    case 'tablemore': ui.tableAll = true; render(); break;
    case 'vnew': ui.vedit = {id:'new', draft:normView({id:'x', title:'Neue Auswertung', kind:'line', group:'type', range:'all', archiv:false, f:{}})}; render(); { const c = $('#vedcard'); if (c) c.scrollIntoView(); } break;
    case 'vedit': { const v = state.meta.views.find(x => x.id === b.dataset.id); if (!v) break; ui.vedit = {id:v.id, draft:JSON.parse(JSON.stringify(v))}; render(); const c = $('#vedcard'); if (c) c.scrollIntoView(); break; }
    case 'vcancel': ui.vedit = null; render(); break;
    case 'vdup': {
      const i = state.meta.views.findIndex(x => x.id === b.dataset.id); if (i < 0) break;
      const c = JSON.parse(JSON.stringify(state.meta.views[i])); c.id = 'v' + uid().replace(/[^A-Za-z0-9]/g, ''); c.title = (c.title + ' (Kopie)').slice(0, 80);
      state.meta.views.splice(i + 1, 0, c); saveState(); render(); toast('Auswertung kopiert'); break;
    }
    case 'vdel': {
      const v = state.meta.views.find(x => x.id === b.dataset.id); if (!v) break;
      if (!await modal({title:'Auswertung löschen?', text:`„${v.title}“ wird gelöscht. Deine Kontostände bleiben unverändert.`, ok:'Löschen', danger:true})) break;
      state.meta.views = state.meta.views.filter(x => x.id !== v.id); saveState(); render(); toast('Auswertung gelöscht'); break;
    }
    case 'vup': moveView(b.dataset.id, -1); break;
    case 'vdown': moveView(b.dataset.id, 1); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('cell')) { e.preventDefault(); editCell(e.target.dataset.acc, e.target.dataset.date); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('kinput')) {
    e.preventDefault();
    const all = [...document.querySelectorAll('.kinput')], i = all.indexOf(e.target);
    if (i < all.length - 1) all[i + 1].focus(); else saveEingabe();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'eform') saveEingabe();
  else if (e.target.id === 'acform') saveAcc();
  else if (e.target.id === 'viewform') saveView();
});
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('kinput')) updateESum(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'showArch') { ui.showArch = t.checked; render(); }
  else if (t.id === 'edate') ui.edate = t.value || null;
  else if (t.id === 'vf-kind') toggleVF();
  else if (t.id === 'driveAuto') { dm.auto = t.checked; saveDM(); if (dm.auto && dm.dirty) driveTouch(); else updatePill(); }
  else if (t.id === 'jsonfile' && t.files[0]) { importJSON(t.files[0]); t.value = ''; }
  else if (t.id === 'csvfile' && t.files[0]) { importCSV(t.files[0]); t.value = ''; }
});
let rsT;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (ui.tab === 'diagramme') drawCharts(); if (ui.tab === 'uebersicht') drawPreview(); }, 150); });
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.includes(t) && t !== ui.tab) { ui.tab = t; render(); } });

/* Start */
$('#ver').textContent = 'v' + VERSION;
(function init(){
  const t = location.hash.slice(1); if (TABS.includes(t)) ui.tab = t;
  render(); toggleVF(); updatePill(); driveStart();
})();

</script>
<!-- LINUXHANDOFF BEGIN -->
<script id="linuxHandOff">
/* Anmeldung fuer die Linux-App von Seifferts Konten. Nur aktiv, wenn diese Seite mit ?linuxport=...&linuxstate=... geoeffnet wird
   (das macht die Linux-App). Die Seite meldet mit der vorhandenen Client-ID bei Google an und reicht das Token per Weiterleitung an
   127.0.0.1 weiter, also an die Linux-App auf diesem Rechner. Ohne diese Parameter geschieht nichts. Dieser Block muss erhalten bleiben. */
(function(){
  var q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var port = q.get('linuxport'), st = q.get('linuxstate');
  if (!port || !st) return;
  if (!/^[0-9]{2,5}$/.test(port) || !/^[A-Za-z0-9_-]{8,128}$/.test(st)) return;
  /* In diesem Modus ruhen die Oberflaeche des Tools und seine Drive-Synchronisation. */
  window.driveSync = async function(){}; window.driveStart = async function(){}; window.driveTouch = function(){}; window.render = function(){};
  document.body.innerHTML = '<div class="wrap" style="padding-top:40px"><div class="card hero"><h2>Anmeldung für Seifferts Konten (Linux-App)</h2>'
    + '<p>Mit dem Knopf meldest du dich bei Google an. Danach geht die Anmeldung an die Linux-App auf diesem Rechner, und du kannst diesen Browser-Tab schließen.</p>'
    + '<div class="btns" style="justify-content:center"><button class="primary" id="lxBtn" type="button">Bei Google anmelden</button></div>'
    + '<p class="msg" id="lxMsg" role="status" style="color:var(--text2)"></p></div></div>';
  var btn = document.getElementById('lxBtn'), msg = document.getElementById('lxMsg');
  function post(fields){
    /* wie beim Stammbaum: Weiterleitung (GET) an die Linux-App auf diesem Rechner */
    fields.state = st;
    var qs = Object.keys(fields).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(String(fields[k])); }).join('&');
    location.href = 'http://127.0.0.1:' + port + '/handoff?' + qs;
  }
  btn.addEventListener('click', function(){
    if (!(window.google && google.accounts && google.accounts.oauth2)) { msg.textContent = 'Die Google-Anmeldung ist noch nicht geladen. Bitte kurz warten und noch einmal klicken (Internetverbindung nötig).'; return; }
    btn.disabled = true; msg.textContent = 'Bitte im Fenster von Google anmelden …';
    try {
      google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: D_SCOPE,
        callback: function(r){
          if (r && r.access_token) { msg.textContent = 'Anmeldung wird übermittelt …'; post({access_token: r.access_token, expires_in: r.expires_in || 3600}); }
          else { btn.disabled = false; msg.textContent = 'Anmeldung fehlgeschlagen' + (r && r.error ? ' (' + r.error + ')' : '') + '. Du kannst es noch einmal versuchen.'; }
        },
        error_callback: function(e){ btn.disabled = false; msg.textContent = 'Anmeldung nicht möglich (' + ((e && e.type) || 'Fehler') + '). Bitte erlaube Pop-up-Fenster für diese Seite und versuche es noch einmal.'; }
      }).requestAccessToken({prompt: ''});
    } catch (e) { btn.disabled = false; msg.textContent = 'Anmeldung nicht möglich: ' + e.message; }
  });
})();
</script>
<!-- LINUXHANDOFF END -->
