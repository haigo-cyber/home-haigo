<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seifferts Stammbaum</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#1c2530; --muted:#667385; --line:#d5dce5; --line2:#e6ebf1;
  --accent:#245d73; --accent-ink:#ffffff; --accent-soft:#dcebf0;
  --mas:#e4edf8; --mas-line:#b9cfe8; --fem:#f9e8ed; --fem-line:#e8bccb; --neu:#eef0f3; --neu-line:#d3d8df;
  --focus:#e9a52b; --warn:#a8481a; --ok:#2f7d4f; --danger:#b3261e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px; --shadow:0 1px 2px rgba(20,30,45,.06),0 4px 14px rgba(20,30,45,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#19212a; --ink:#e6ebf1; --muted:#93a1b3; --line:#2b3643; --line2:#222c37;
    --accent:#6fb7cf; --accent-ink:#0c1a20; --accent-soft:#1d3440;
    --mas:#1b2b3d; --mas-line:#2f4a68; --fem:#35212d; --fem-line:#62394d; --neu:#212a34; --neu-line:#34404d;
    --focus:#e0a233; --warn:#e08a58; --ok:#6cc08d; --danger:#f07a72;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#19212a; --ink:#e6ebf1; --muted:#93a1b3; --line:#2b3643; --line2:#222c37;
  --accent:#6fb7cf; --accent-ink:#0c1a20; --accent-soft:#1d3440;
  --mas:#1b2b3d; --mas-line:#2f4a68; --fem:#35212d; --fem-line:#62394d; --neu:#212a34; --neu-line:#34404d;
  --focus:#e0a233; --warn:#e08a58; --ok:#6cc08d; --danger:#f07a72;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- Rahmen ---- */
#app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:600 18px var(--serif);margin-right:6px;white-space:nowrap}
.fname{color:var(--muted);font-size:13px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname b{color:var(--ink);font-weight:600}
.dirty{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--focus);margin-left:6px;vertical-align:middle}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 11px;min-height:34px;line-height:1.2}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 8px;min-height:28px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.tabs{display:flex;gap:2px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--ink)}
.main{display:grid;grid-template-columns:300px 1fr;min-height:0}
.main.nosb{grid-template-columns:1fr}
.main.nosb #side{display:none}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .sbtop{padding:10px;border-bottom:1px solid var(--line2)}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.abc{display:flex;flex-wrap:wrap;gap:1px;margin-top:6px}
.abc button{border:0;background:transparent;padding:1px 4px;font-size:12px;color:var(--muted);border-radius:4px}
.abc button:hover{background:var(--accent-soft);color:var(--ink)}
#plist{flex:1;overflow:auto;position:relative;min-height:0}
#plist .vs{position:relative}
.prow{position:absolute;left:0;right:0;height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:0;border-bottom:1px solid var(--line2);background:transparent;text-align:left;width:100%}
.prow:hover{background:var(--accent-soft)}
.prow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.prow .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .py{color:var(--muted);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--neu-line)}
.dot.M{background:var(--mas-line)} .dot.F{background:var(--fem-line)}
.count{padding:6px 12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line2)}
#content{overflow:auto;min-width:0;padding:18px 22px 60px}
#content.pad0{padding:0;display:flex;flex-direction:column;overflow:hidden}

/* ---- Startseite ---- */
.welcome{max-width:640px;margin:8vh auto;padding:0 18px}
.welcome h1{font:600 30px/1.2 var(--serif);margin:0 0 8px}
.welcome p{color:var(--muted);margin:0 0 18px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 18px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .btn{margin:4px}
.fine{font-size:13px;color:var(--muted)}

/* ---- Familienblatt ---- */
.card{max-width:1040px;margin:0 auto}
.nav{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.nav .pos{color:var(--muted);font-size:13px}
.couple{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative}
.pb{background:var(--neu);border:1px solid var(--neu-line);padding:14px 16px 12px;position:relative}
.pb.mas{background:var(--mas);border-color:var(--mas-line)}
.pb.fem{background:var(--fem);border-color:var(--fem-line)}
.couple .pb:first-child{border-radius:var(--r) 0 0 0}
.couple .pb:last-child{border-radius:0 var(--r) 0 0;border-left:0}
.pb.focus{box-shadow:inset 0 3px 0 var(--focus)}
.pb h3{margin:0;font:600 23px/1.2 var(--serif)}
.pb h3 button{border:0;background:transparent;padding:0;font:inherit;text-align:left;color:inherit}
.pb h3 button:hover{text-decoration:underline}
.pb .sub{color:var(--muted);font-size:13px;margin:2px 0 8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.par{font-size:13px;margin:0 0 8px;color:var(--muted)}
.par button{border:0;background:transparent;padding:0;color:var(--accent);text-decoration:underline;text-decoration-color:transparent}
.par button:hover{text-decoration-color:currentColor}
.ev{display:grid;grid-template-columns:7.5em 1fr;gap:8px;padding:3px 0;border-top:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.ev:first-of-type{border-top:0}
.ev .k{color:var(--muted);font-size:13px;padding-top:1px}
.ev .v{min-width:0;overflow-wrap:anywhere}
.ev .nt{font-size:13px;color:var(--muted);white-space:pre-line;margin-top:2px}
.ev.low .v,.ev.low .k{opacity:.7;font-size:13px}
.pbact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.band{background:var(--panel);border:1px solid var(--line);border-top:0;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center}
.band .ring{font:600 17px var(--serif)}
.band .ev{border:0;padding:0;display:inline-grid;grid-template-columns:auto auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.panel h4{margin:0 0 8px;font:600 16px var(--serif);display:flex;justify-content:space-between;align-items:center;gap:8px}
.couple + .band + .panel,.couple + .panel{margin-top:0;border-top:0;border-radius:0 0 var(--r) var(--r)}
table.kids{width:100%;border-collapse:collapse}
table.kids td,table.kids th{padding:6px 8px;border-top:1px solid var(--line2);text-align:left;vertical-align:top}
table.kids th{font-weight:500;color:var(--muted);font-size:13px;border-top:0}
table.kids td.n{color:var(--muted);width:2em}
table.kids button.lk{border:0;background:transparent;padding:0;color:var(--accent);text-align:left}
table.kids button.lk:hover{text-decoration:underline}
.sx{display:inline-block;width:1.2em;text-align:center;color:var(--muted)}
sup.fns{font-size:.7em;margin-left:2px}
sup.fns a{text-decoration:none;font-weight:600;padding:0 1px}
.fnl{margin:0;padding-left:1.6em;font-size:13px}
.fnl li{margin:2px 0}
.notes details{margin:4px 0}
.notes summary{cursor:pointer;color:var(--accent)}
.notes .txt{white-space:pre-line;margin:6px 0 4px;font-family:var(--serif);font-size:15px;line-height:1.55;max-width:75ch}
.media{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36ch}
.chip button{border:0;background:transparent;border-radius:50%;width:22px;height:22px;line-height:1}
.chip button:hover{background:var(--line)}
.other{font-size:13px;margin-top:8px}
.other button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0}
.other button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ---- Stammbaum ---- */
.treebar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.treebar label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.treebar select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.treebar{flex:none}
.tscroll{overflow:auto;flex:1;min-height:0}
.tstage{position:relative;margin:18px}
.tstage svg{position:absolute;left:0;top:0;pointer-events:none}
.tstage path{fill:none;stroke:var(--neu-line);stroke-width:1.5}
.tb{position:absolute;width:196px;height:48px;border:1px solid var(--neu-line);border-radius:6px;background:var(--neu);padding:4px 8px;text-align:left;overflow:hidden;line-height:1.2}
.tb.M{background:var(--mas);border-color:var(--mas-line)}
.tb.F{background:var(--fem);border-color:var(--fem-line)}
.tb.root{box-shadow:0 0 0 2px var(--focus)}
.tb .nm{font:600 13px var(--serif);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .yr{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .kk{position:absolute;right:5px;top:3px;font-size:10px;color:var(--muted)}
.tb:hover{filter:brightness(.97)}
.tb.empty{border-style:dashed;background:transparent;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center}
ul.desc{list-style:none;margin:0;padding-left:22px;border-left:1px dotted var(--line)}
ul.desc.root{padding-left:0;border-left:0}
ul.desc li{margin:2px 0}
.dn{display:inline-flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.dn button.lk{border:0;background:transparent;padding:0;color:var(--accent);text-align:left;font-weight:600}
.dn button.lk:hover{text-decoration:underline}
.dn .sp{color:var(--muted);font-size:13px}
details.dd>summary{cursor:pointer;list-style:none}
details.dd>summary::-webkit-details-marker{display:none}
details.dd>summary::before{content:"▸";display:inline-block;width:1.1em;color:var(--muted)}
details.dd[open]>summary::before{content:"▾"}
li.leaf{padding-left:1.1em}

/* ---- Quellen ---- */
.split{display:grid;grid-template-columns:340px 1fr;grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
.slist{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.slist .sbtop{padding:10px;border-bottom:1px solid var(--line2);display:flex;gap:6px}
.slist .sbtop input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.slist .items{overflow:auto;flex:1}
.sitem{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);background:transparent;padding:8px 12px}
.sitem:hover{background:var(--accent-soft)}
.sitem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.sitem .t{display:block;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sitem .m{font-size:12px;color:var(--muted)}
.sdetail{overflow:auto;padding:18px 22px 60px}
.kv{display:grid;grid-template-columns:11em 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
ul.cites{list-style:none;margin:0;padding:0}
ul.cites li{padding:3px 0;border-top:1px solid var(--line2);font-size:14px}
ul.cites button{border:0;background:transparent;color:var(--accent);padding:0;text-align:left}
ul.cites button:hover{text-decoration:underline}
.cites .w{color:var(--muted);font-size:12px;margin-left:6px}

/* ---- Dialoge ---- */
.ovl{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow:auto}
.dlg{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);display:flex;flex-direction:column;max-height:92vh}
.dlg.wide{width:min(860px,100%)}
.dlg>header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg>header h2{margin:0;font:600 19px var(--serif)}
.dlg .x{border:0;background:transparent;font-size:24px;line-height:1;width:34px;height:34px;border-radius:50%}
.dlg .x:hover{background:var(--accent-soft)}
.dbody{padding:14px 16px;overflow:auto}
.dlg>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sect{margin:16px 0 8px;font:600 15px var(--serif);display:flex;justify-content:space-between;align-items:center}
.erow{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin:0 0 8px;background:color-mix(in srgb,var(--bg) 60%,var(--panel))}
.erow .eh{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.erow .eh b{font-weight:600}
.erow.del{opacity:.5}
.erow .pv{font-size:12px;color:var(--muted);margin-top:2px;min-height:1em}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;margin-top:6px;white-space:pre-line}
.pickres{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
.pickres button{display:flex;gap:8px;width:100%;text-align:left;padding:7px 10px;border:0;border-bottom:1px solid var(--line2);background:transparent}
.pickres button:hover{background:var(--accent-soft)}
.pickres .y{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
textarea.raw{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:46vh;white-space:pre}
.issue{padding:6px 0;border-top:1px solid var(--line2);font-size:14px}
.issue b.fehler{color:var(--danger)} .issue b.warnung{color:var(--warn)}
.menu{position:absolute;right:14px;top:50px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:240px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--accent-soft)}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:90;max-width:90vw;font-size:14px;box-shadow:var(--shadow)}
.empty{color:var(--muted);padding:16px 0}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft)}
.sbtoggle{display:none}

@media (max-width:860px){
  .main{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,340px);z-index:30;transform:translateX(-102%);transition:transform .18s;box-shadow:var(--shadow)}
  body.sb #side{transform:none}
  .sbtoggle{display:inline-block}
  #content{padding:12px 12px 60px}
  .couple{grid-template-columns:1fr}
  .couple .pb:first-child{border-radius:var(--r) var(--r) 0 0}
  .couple .pb:last-child{border-radius:0;border-left:1px solid var(--fem-line);border-top:0}
  .split{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .slist{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}
  .kv{grid-template-columns:1fr}
  .row2,.row3{grid-template-columns:1fr}
  .ev{grid-template-columns:6em 1fr}
  .fname{display:none}
  .brand{display:none}
  .top{flex-wrap:nowrap;overflow-x:auto;padding:6px 10px}
  .top .btn{flex:none;white-space:nowrap}
  .nav .btn[data-act=print]{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.tabs,#side,.nav,.pbact,.btn,#toast{display:none!important}
  body,#app{background:#fff;color:#000;height:auto;display:block}
  .main{display:block} #content{overflow:visible;padding:0}
  .pb,.band,.panel{border-color:#999!important;break-inside:avoid}
}
.media{font-size:13px;color:var(--muted)}
.mhead{margin:6px 0 4px}
.mgrid{display:flex;flex-wrap:wrap;gap:8px}
.mth{display:flex;flex-direction:column;align-items:center;width:104px;padding:4px;border:1px solid var(--line,#8884);border-radius:6px;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:11px;gap:3px}
.mth img{width:96px;height:96px;object-fit:cover;border-radius:4px;background:#8882}
.mth.doc b{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:4px;background:#8882;font-size:18px}
.mth span{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmiss{margin-top:4px;font-size:12px}
.lb{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8)}
.lbbox{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:96vw;max-height:96vh}
.lbbox img{max-width:94vw;max-height:80vh;object-fit:contain}
.lbcap{color:#fff;font-size:14px}
@media print{.mgrid{display:none}}

</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="btn sbtoggle" id="btnSide" aria-label="Personenliste ein- oder ausblenden">Personen</button>
    <span class="brand">Seifferts Stammbaum</span>
    <span class="fname" id="fname"></span>
    <span class="spacer"></span>
    <button class="btn" id="btnOpen">Datei öffnen</button>
    <button class="btn" id="btnDrive">Google Drive</button>
    <button class="btn" id="btnUndo" disabled>Rückgängig</button>
    <button class="btn" id="btnRedo" disabled>Wiederholen</button>
    <button class="btn pri" id="btnSave" disabled>Speichern</button>
    <button class="btn" id="btnMenu" aria-haspopup="true" aria-expanded="false">Mehr</button>
  </div>
  <div class="tabs" role="tablist" id="tabs">

    <aside id="side">

        <div class="abc" id="abc"></div>
      </div>

<script>
/* ============ KERN: GEDCOM einlesen, ausgeben, bearbeiten (ohne DOM) ============ */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.GED = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /* ---------- Hilfsfunktionen ---------- */
  const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const MON_DE = ["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];
  const MON_LONG_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const CONC_LEN = 119;           // Reunion bricht NOTE- und TEXT-Werte bei 119 Zeichen um
  const CONC_LEN_OTHER = 240;     // alle anderen Felder (Dateipfade, Titel, Orte) schreibt Reunion in eine Zeile; Grenze nur wegen des GEDCOM-Limits von 255

  function fold(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/ß/g, "ss").replace(/æ/g, "ae").replace(/ø/g, "o");
  }
  const isPtr = (v) => /^@[^@\s]+@$/.test(v || "");
  const unesc = (s) => String(s == null ? "" : s).replace(/@@/g, "@");
  const esc = (s) => String(s == null ? "" : s).replace(/@/g, "@@");
  function todayGed() {
    const d = new Date();
    return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear();
  }

  /* ---------- Zeilen lesen ---------- */
  function decode(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const bom = u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF;
    const body = bom ? u8.subarray(3) : u8;
    const warn = [];
    let text;
    try { text = new TextDecoder("utf-8", { fatal: true }).decode(body); }
    catch (e) { text = new TextDecoder("windows-1252").decode(body); warn.push("Die Datei ist kein gültiges UTF-8 und wurde als Windows-1252 gelesen. Umlaute bitte prüfen."); }
    return { text, bom, warn };
  }

  function detectEol(text) {
    const crlf = (text.match(/\r\n/g) || []).length;
    const lf = (text.match(/\n/g) || []).length - crlf;
    const cr = (text.match(/\r/g) || []).length - crlf;
    if (crlf >= lf && crlf >= cr && crlf > 0) return "\r\n";
    if (cr > lf) return "\r";
    return "\n";
  }

  const LINE_RE = /^\s*(\d+)\s+(?:(@[^@]+@)\s+)?(\S+)(?: ([\s\S]*))?$/;

  /* ---------- Datenbank ---------- */
  class Database {
    constructor() {
      this.records = [];          // alle Sätze in Dateireihenfolge (inkl. HEAD und TRLR)
      this.byId = new Map();
      this.eol = "\r"; this.bom = false; this.trailingEol = true;
      this.warnings = [];
      this.undoStack = []; this.redoStack = [];
      this.changeCount = 0;       // Zähler für Änderungen seit dem Laden/Speichern
      this.version = 0;           // wird bei jeder Änderung erhöht (Cache-Schlüssel)
      this._cache = new Map(); this._memo = {};
      this._max = {};
    }
    get(id) { return this.byId.get(id) || null; }
    ofTag(tag) { return this.records.filter(r => r.tag === tag); }
    bump() { this.version++; this._cache.clear(); this._memo = {}; }
    _register(rec) {
      this.records.push(rec);
      if (rec.xref) {
        this.byId.set(rec.xref, rec);
        const m = /^@([A-Za-z_]+)(\d+)@$/.exec(rec.xref);
        if (m) this._max[m[1]] = Math.max(this._max[m[1]] || 0, +m[2]);
      }
    }
    newId(prefix) {
      let n = (this._max[prefix] || 0) + 1;
      while (this.byId.has("@" + prefix + n + "@")) n++;
      this._max[prefix] = n;
      return "@" + prefix + n + "@";
    }
  }

  function parseGedcom(text, opts) {
    opts = opts || {};
    const db = new Database();
    db.eol = detectEol(text);
    db.bom = !!opts.bom;
    db.trailingEol = /(\r\n|\r|\n)$/.test(text);
    const lines = text.split(/\r\n|\r|\n/);
    if (db.trailingEol) lines.pop();
    let cur = null, stack = [], startIdx = 0, lastFold = null;
    const finish = (endIdx) => {
      if (!cur) return;
      cur.raw = lines.slice(startIdx, endIdx).join(db.eol);
      cur.dirty = false;
      db._register(cur);
    };
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      if (l.trim() === "") continue;
      const m = LINE_RE.exec(l);
      if (!m) { db.warnings.push("Zeile " + (i + 1) + " nicht lesbar: " + l.slice(0, 60)); if (cur) cur.lossy = true; continue; }
      const lv = +m[1], xref = m[2] || null, tag = m[3], val = m[4] == null ? "" : m[4];
      if (lv === 0) {
        finish(i);
        cur = { xref, tag, val, kids: [], raw: null, dirty: false };
        startIdx = i; stack = [cur];
        continue;
      }
      if (!cur) { db.warnings.push("Zeile " + (i + 1) + " steht vor dem ersten Satz."); continue; }
      let parent = stack[lv - 1];
      // Reunion hängt Quellenangaben von Notizen als Unterzeile an eine CONT/CONC-Zeile.
      // Sie gehören zum Eltern-Satz der CONT/CONC-Zeile.
      if (!parent && lastFold && lastFold.lv === lv - 1) { parent = lastFold.parent; stack[lv - 1] = parent; }
      if (!parent) { db.warnings.push("Zeile " + (i + 1) + ": Ebenensprung."); cur.lossy = true; continue; }
      if (tag === "CONC" || tag === "CONT") {
        parent.val = (parent.val || "") + (tag === "CONC" ? val : "\n" + val);
        lastFold = { lv, parent };
        continue;
      }
      // Reunion-Eigenheit: "1 2 CONT text" setzt den vorherigen Wert gleicher Ebene fort
      if (/^\d+$/.test(tag)) {
        const mm = /^(CONT|CONC)(?: ([\s\S]*))?$/.exec(val);
        const target = stack[lv];
        if (mm && target && target !== cur) {
          target.val = (target.val || "") + (mm[1] === "CONC" ? (mm[2] || "") : "\n" + (mm[2] || ""));
          continue;
        }
      }
      const node = { tag, val, xref, kids: [] };
      parent.kids.push(node);
      stack.length = lv; stack[lv] = node;
      if (!(lastFold && lastFold.lv === lv - 1)) lastFold = null;
    }
    finish(lines.length);
    const head = db.records.find(r => r.tag === "HEAD");
    const charNode = head && head.kids.find(k => k.tag === "CHAR");
    db.charset = charNode ? charNode.val : "";
    if (db.charset && !/^(UTF-?8|UNICODE)$/i.test(db.charset)) {
      db.warnings.push("Zeichensatz laut Kopfzeile: " + db.charset + ". Die Datei wurde als UTF-8 gelesen.");
    }
    return db;
  }

  /* ---------- Zeilen schreiben ---------- */
  function chunks(s, n) {
    const out = [];
    s = String(s);
    while (s.length > n) {
      let k = n;
      const c = s.charCodeAt(k - 1);
      if (c >= 0xD800 && c <= 0xDBFF) k--;
      out.push(s.slice(0, k)); s = s.slice(k);
    }
    out.push(s);
    return out;
  }
  function pushNode(out, lv, xref, tag, val) {
    const head = lv + (xref ? " " + xref : "") + " " + tag;
    const parts = String(val == null ? "" : val).split("\n");
    const wrapAt = (tag === "NOTE" || tag === "TEXT") ? CONC_LEN : CONC_LEN_OTHER;
    parts.forEach((p, i) => {
      const cs = chunks(p, wrapAt);
      if (i === 0) {
        out.push(cs[0] === "" ? head : head + " " + cs[0]);
        for (let j = 1; j < cs.length; j++) out.push((lv + 1) + " CONC " + cs[j]);
      } else {
        out.push(cs[0] === "" ? (lv + 1) + " CONT" : (lv + 1) + " CONT " + cs[0]);
        for (let j = 1; j < cs.length; j++) out.push((lv + 1) + " CONC " + cs[j]);
      }
    });
  }
  function serNode(out, n, lv) {
    pushNode(out, lv, n.xref, n.tag, n.val);
    n.kids.forEach(k => serNode(out, k, lv + 1));
  }
  function serializeRecord(rec) {
    const out = [];
    pushNode(out, 0, rec.xref, rec.tag, rec.val);
    rec.kids.forEach(k => serNode(out, k, 1));
    return out;
  }
  function recordText(rec) { return serializeRecord(rec).join("\n"); }

  /* einzelnen Satz aus Text lesen (für den Rohdaten-Editor und Rückgängig) */
  function parseRecordText(text) {
    const db = parseGedcom(text.replace(/\r\n|\r/g, "\n"));
    if (db.warnings.length) throw new Error(db.warnings[0]);
    if (db.records.length !== 1) throw new Error("Der Text muss genau einen Satz enthalten (eine Zeile mit Ebene 0).");
    const r = db.records[0];
    return { xref: r.xref, tag: r.tag, val: r.val, kids: r.kids };
  }

  function exportText(db, eol) {
    eol = eol || db.eol;
    const parts = db.records.map(r => {
      if (!r.dirty && r.raw != null) return eol === db.eol ? r.raw : r.raw.split(db.eol).join(eol);
      return serializeRecord(r).join(eol);
    });
    return parts.join(eol) + (db.trailingEol ? eol : "");
  }

  /* ---------- Knoten-Helfer ---------- */
  const kid = (n, tag) => n.kids.find(k => k.tag === tag) || null;
  const kidsOf = (n, tag) => n.kids.filter(k => k.tag === tag);
  const kval = (n, tag) => { const k = kid(n, tag); return k ? k.val : ""; };

  /* ---------- Namen ---------- */
  function parseName(val) {
    const m = /^([^/]*)\/([^/]*)\/?\s*(.*)$/.exec(val || "");
    if (!m) return { given: (val || "").trim(), surn: "", nsfx: "" };
    return { given: m[1].trim(), surn: m[2].trim(), nsfx: m[3].trim() };
  }
  function buildName(given, surn, nsfx) {
    return (given || "").trim() + " /" + (surn || "").trim() + "/" + (nsfx ? " " + nsfx.trim() : "");
  }
  function nameParts(rec) {
    const n = kid(rec, "NAME");
    const p = n ? parseName(n.val) : { given: "", surn: "", nsfx: "" };
    const gv = n ? kval(n, "GIVN") : "", sv = n ? kval(n, "SURN") : "";
    return {
      given: unesc(gv || p.given), surn: unesc(sv || p.surn),
      nsfx: unesc(n && kval(n, "NSFX") || p.nsfx), npfx: unesc(n ? kval(n, "NPFX") : ""),
      nick: unesc(n ? kval(n, "NICK") : "")
    };
  }
  function displayName(rec, style) {
    const p = nameParts(rec);
    let s;
    if (style === "list") {
      s = (p.surn || "—") + (p.given || p.npfx || p.nsfx ? ", " + [p.npfx, p.given, p.nsfx].filter(Boolean).join(" ") : "");
    } else {
      s = [p.npfx, p.given, p.surn, p.nsfx].filter(Boolean).join(" ");
    }
    return s || "(ohne Namen)";
  }

  /* ---------- Datum ---------- */
  const QUAL_DE = {
    ABT: "um", UM: "um", CIR: "um", CA: "um", EST: "ca.", CAL: "berechnet", BEF: "vor", VOR: "vor", AFT: "nach", NACH: "nach",
    UNGEFÄHR: "ungefähr", VERMUTLICH: "vermutlich", ZWISCHEN: "zwischen"
  };
  function parseDate(raw) {
    raw = (raw || "").trim();
    const r = { raw, y: null, m: null, d: null, key: null, text: raw };
    if (!raw) return r;
    let m = /^(?:(\d{1,2}) )?(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC) (\d{1,4})$/i.exec(raw);
    if (m) { r.d = m[1] ? +m[1] : null; r.m = MON.indexOf(m[2].toUpperCase()) + 1; r.y = +m[3]; }
    else if ((m = /^(\d{1,4})$/.exec(raw))) { r.y = +m[1]; }
    else {
      const y = /(?:^|\D)(\d{4})(?!\d)/.exec(raw);
      if (y) r.y = +y[1];
      const dm = /\b(\d{1,2}) (JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC) (\d{4})\b/i.exec(raw);
      if (dm) { r.d = +dm[1]; r.m = MON.indexOf(dm[2].toUpperCase()) + 1; r.y = +dm[3]; }
    }
    if (r.y != null) r.key = r.y * 10000 + (r.m || 0) * 100 + (r.d || 0);
    r.text = formatDate(raw);
    return r;
  }
  function formatDate(raw) {
    let s = (raw || "").trim();
    if (!s) return "";
    if (/@#D/.test(s)) return s;                         // Kalender-Escape unverändert lassen
    const dateRe = /\b(\d{1,2}) (JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC) (\d{3,4})\b/gi;
    const monRe = /\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC) (\d{3,4})\b/gi;
    s = s.replace(dateRe, (_, d, m, y) => (+d) + ". " + MON_DE[MON.indexOf(m.toUpperCase())] + " " + y);
    s = s.replace(monRe, (_, m, y) => MON_DE[MON.indexOf(m.toUpperCase())] + " " + y);
    s = s.replace(/^FROM (.+?) TO (.+)$/i, "von $1 bis $2").replace(/^FROM (.+)$/i, "ab $1").replace(/^TO (.+)$/i, "bis $1");
    s = s.replace(/^BET (.+?) AND (.+)$/i, "zwischen $1 und $2");
    s = s.replace(/^(ABT|BEF|AFT|EST|CAL|UM|CIR|CA|VOR|NACH) /i, (_, q) => QUAL_DE[q.toUpperCase()] + " ");
    return s;
  }

  /* ---------- Ereignis-Tabellen ---------- */
  const INDI_EVENTS = {
    BIRT: "Geburt", CHR: "Taufe", BAPM: "Taufe", DEAT: "Tod", BURI: "Bestattung", CREM: "Einäscherung",
    RESI: "Wohnort", OCCU: "Beruf", BERUF: "Beruf", RELI: "Religion", EDUC: "Ausbildung", EMIG: "Auswanderung",
    IMMI: "Einwanderung", NATU: "Einbürgerung", ADOP: "Adoption", PROP: "Besitz", CENS: "Volkszählung", GRAD: "Abschluss",
    RETI: "Ruhestand", WILL: "Testament", PROB: "Testamentseröffnung", CONF: "Konfirmation", FCOM: "Erstkommunion",
    BARM: "Bar Mizwa", BASM: "Bat Mizwa", BLES: "Segnung", CHRA: "Erwachsenentaufe", ORDN: "Ordination",
    NATI: "Nationalität", DSCR: "Beschreibung", CAST: "Stand", IDNO: "Ausweisnummer", NCHI: "Kinderzahl",
    NMR: "Anzahl Ehen", SSN: "Sozialversicherungsnr.", TITL: "Titel", EVEN: "Ereignis", FACT: "Tatsache",
    _POW: "Kriegsgefangenschaft", _CAUS: "Todesursache", _BIOGRAPHICAL: "Biografie", _ANECDOTE: "Anekdote",
    PROPERTY: "Besitz", _WITNESSESWERE: "Zeugen", _ROLEASWITNESS: "Rolle als Zeuge"
  };
  const FAM_EVENTS = {
    MARR: "Heirat", DIV: "Scheidung", DIVF: "Scheidungsantrag", ANUL: "Annullierung", ENGA: "Verlobung",
    MARB: "Aufgebot", MARC: "Ehevertrag", MARL: "Heiratserlaubnis", MARS: "Ehevereinbarung", UMAR: "Nichteheliche Verbindung",
    _MARRIAGEREL: "Kirchliche Trauung", CENS: "Volkszählung", EVEN: "Ereignis", FACT: "Tatsache", NCHI: "Kinderzahl", RESI: "Wohnort"
  };
  const ORDER_INDI = ["BIRT","CHR","BAPM","DEAT","CREM","BURI"];

  function eventFromNode(db, n, labels) {
    const type = kval(n, "TYPE");
    let label = labels[n.tag] || n.tag;
    if ((n.tag === "EVEN" || n.tag === "FACT") && type) label = unesc(type);
    const date = parseDate(kval(n, "DATE"));
    const place = unesc(kval(n, "PLAC"));
    const val = isPtr(n.val) ? "" : unesc(n.val);
    return {
      node: n, tag: n.tag, label, type, date, place, val,
      notes: kidsOf(n, "NOTE"), sources: kidsOf(n, "SOUR"), objects: kidsOf(n, "OBJE")
    };
  }

  /* ---------- Personen und Familien ---------- */
  function personInfo(db, id) {
    let c = db._cache.get(id);
    if (c) return c;
    const rec = db.get(id);
    if (!rec || rec.tag !== "INDI") return null;
    const events = rec.kids.filter(k => INDI_EVENTS[k.tag]).map(k => eventFromNode(db, k, INDI_EVENTS));
    const first = (tags) => events.find(e => tags.includes(e.tag));
    c = {
      id, rec,
      name: nameParts(rec),
      sex: kval(rec, "SEX"),
      famc: kidsOf(rec, "FAMC").map(n => n.val).filter(v => db.get(v)),
      fams: kidsOf(rec, "FAMS").map(n => n.val).filter(v => db.get(v)),
      events,
      birt: first(["BIRT"]), chr: first(["BAPM", "CHR"]), deat: first(["DEAT"]), buri: first(["BURI", "CREM"]),
      refn: unesc(kval(rec, "REFN")), uid: kval(rec, "_UID")
    };
    db._cache.set(id, c);
    return c;
  }
  function famInfo(db, id) {
    const key = "F" + id;
    let c = db._cache.get(key);
    if (c) return c;
    const rec = db.get(id);
    if (!rec || rec.tag !== "FAM") return null;
    const husb = kval(rec, "HUSB"), wife = kval(rec, "WIFE");
    c = {
      id, rec,
      husb: db.get(husb) ? husb : null, wife: db.get(wife) ? wife : null,
      children: kidsOf(rec, "CHIL").map(n => n.val).filter(v => db.get(v)),
      events: rec.kids.filter(k => FAM_EVENTS[k.tag]).map(k => eventFromNode(db, k, FAM_EVENTS)),
    };
    c.marr = c.events.find(e => e.tag === "MARR") || null;
    c.div = c.events.find(e => e.tag === "DIV") || null;
    db._cache.set(key, c);
    return c;
  }
  function parentsOf(db, id) {
    const p = personInfo(db, id);
    if (!p || !p.famc.length) return null;
    const f = famInfo(db, p.famc[0]);
    return f ? { fam: f.id, father: f.husb, mother: f.wife } : null;
  }
  function spouseIn(db, famId, personId) {
    const f = famInfo(db, famId);
    if (!f) return null;
    return f.husb === personId ? f.wife : f.wife === personId ? f.husb : (f.husb || f.wife);
  }
  function lifeSpan(db, id) {
    const p = personInfo(db, id);
    if (!p) return "";
    const b = (p.birt && p.birt.date.y) || (p.chr && p.chr.date.y);
    const d = (p.deat && p.deat.date.y) || (p.buri && p.buri.date.y);
    const bp = b ? ((p.birt && p.birt.date.y) ? "" : "~") + b : "";
    if (!b && !d) return "";
    return bp + "–" + (d || "");
  }
  function startPerson(db) {
    for (const r of db.ofTag("INDI")) {
      if (r.kids.some(k => k.tag === "FACT" && /^0*1\s*,.*Kekul/i.test(k.val))) return r.xref;
    }
    const first = db.ofTag("INDI")[0];
    return first ? first.xref : null;
  }

  /* Liste für die Seitenleiste */
  function personIndex(db) {
    if (db._memo.index) return db._memo.index;
    const arr = db.ofTag("INDI").map(r => {
      const p = personInfo(db, r.xref);
      const by = (p.birt && p.birt.date.y) || (p.chr && p.chr.date.y) || null;
      const dy = (p.deat && p.deat.date.y) || null;
      return {
        id: r.xref, sortKey: fold(p.name.surn || "￿") + "|" + fold(p.name.given), by, dy,
        label: displayName(r, "list"),
        hay: fold([p.name.given, p.name.surn, p.name.nsfx, p.name.nick, p.refn, by || "", p.birt ? p.birt.place : "", p.deat ? p.deat.place : ""].join(" "))
      };
    });
    arr.sort((a, b) => a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : (a.by || 9999) - (b.by || 9999));
    db._memo.index = arr;
    return arr;
  }
  function searchPersons(db, q, limit) {
    const idx = personIndex(db);
    const terms = fold(q).split(/\s+/).filter(Boolean);
    if (!terms.length) return limit ? idx.slice(0, limit) : idx;
    const out = [];
    for (const e of idx) {
      if (terms.every(t => e.hay.includes(t))) { out.push(e); if (limit && out.length >= limit) break; }
    }
    return out;
  }

  /* Vorfahren nach Kekulé-Nummer: 1 = Person, 2n = Vater, 2n+1 = Mutter */
  function ancestors(db, id, gens) {
    const map = new Map();
    (function walk(pid, k, g) {
      if (!pid || g > gens) return;
      map.set(k, pid);
      const par = parentsOf(db, pid);
      if (par) { walk(par.father, 2 * k, g + 1); walk(par.mother, 2 * k + 1, g + 1); }
    })(id, 1, 1);
    return map;
  }

  /* Verweise: wer zitiert welche Quelle */
  function citationIndex(db) {
    if (db._memo.cite) return db._memo.cite;
    const map = new Map();
    const add = (sid, rec, path) => { if (!map.has(sid)) map.set(sid, []); map.get(sid).push({ rec: rec.xref, tag: rec.tag, path }); };
    for (const rec of db.records) {
      if (rec.tag === "SOUR" || rec.tag === "HEAD") continue;
      (function walk(n, path) {
        n.kids.forEach(k => {
          if (k.tag === "SOUR" && isPtr(k.val)) add(k.val, rec, path);
          walk(k, path.concat(k.tag));
        });
      })(rec, []);
    }
    db._memo.cite = map;
    return map;
  }
  function noteText(db, node) {
    let t;
    if (isPtr(node.val)) { const r = db.get(node.val); t = r ? r.val : ""; }
    else t = node.val;
    return unesc(t).replace(/^\n+/, "");
  }

  /* ---------- Änderungen mit Rückgängig ---------- */
  function capture(rec) {
    return { exists: true, text: recordText(rec), dirty: rec.dirty, raw: rec.raw, lossy: !!rec.lossy, idx: db_indexOf(rec) };
  }
  let _dbRef = null;
  function db_indexOf(rec) { return _dbRef ? _dbRef.records.indexOf(rec) : -1; }
  function applyState(db, rec, st) {
    if (!st) { removeRecord(db, rec); return; }
    if (!db.records.includes(rec)) insertRecord(db, rec, st.idx);
    const p = parseRecordText(st.text);
    rec.tag = p.tag; rec.val = p.val; rec.kids = p.kids;
    rec.dirty = st.dirty; rec.raw = st.raw;
  }
  function insertRecord(db, rec, idx) {
    if (idx != null && idx >= 0) db.records.splice(Math.min(idx, db.records.length), 0, rec);
    else {
      const ti = db.records.findIndex(r => r.tag === "TRLR");
      if (ti < 0) db.records.push(rec); else db.records.splice(ti, 0, rec);
    }
    if (rec.xref) db.byId.set(rec.xref, rec);
  }
  function removeRecord(db, rec) {
    const i = db.records.indexOf(rec);
    if (i >= 0) db.records.splice(i, 1);
    if (rec.xref) db.byId.delete(rec.xref);
  }

  class Tx {
    constructor(db, label) { this.db = db; this.label = label; this.snaps = new Map(); this.created = new Set(); this.removed = new Set(); }
    touch(rec) {
      if (!rec || this.snaps.has(rec) || this.created.has(rec)) return rec;
      this.snaps.set(rec, capture(rec));
      return rec;
    }
    create(tag, prefix) {
      const rec = { xref: prefix ? this.db.newId(prefix) : null, tag, val: "", kids: [], raw: null, dirty: true };
      this.created.add(rec);
      insertRecord(this.db, rec);
      return rec;
    }
    remove(rec) {
      if (this.created.has(rec)) { this.created.delete(rec); removeRecord(this.db, rec); return; }
      this.touch(rec);
      this.removed.add(rec);
      removeRecord(this.db, rec);
    }
  }
  function begin(db, label) { _dbRef = db; return new Tx(db, label); }
  function commit(db, tx) {
    const entries = [];
    const stamp = todayGed();
    tx.snaps.forEach((before, rec) => {
      if (tx.removed.has(rec)) { entries.push({ rec, before, after: null }); return; }
      const now = recordText(rec);
      if (now === before.text) { rec.dirty = before.dirty; rec.raw = before.raw; return; }
      if (rec.tag !== "HEAD" && rec.tag !== "TRLR") setChan(rec, stamp);
      rec.dirty = true;
      entries.push({ rec, before, after: capture(rec) });
    });
    tx.created.forEach(rec => {
      if (rec.tag !== "HEAD" && rec.tag !== "TRLR") setChan(rec, stamp);
      rec.dirty = true;
      entries.push({ rec, before: null, after: capture(rec) });
    });
    if (!entries.length) return false;
    db.undoStack.push({ label: tx.label, entries });
    if (db.undoStack.length > 200) db.undoStack.shift();
    db.redoStack = [];
    db.changeCount++;
    db.bump();
    return true;
  }
  function rollback(db, tx) {
    tx.created.forEach(rec => removeRecord(db, rec));
    restoreAll(db, Array.from(tx.snaps.entries()).map(([rec, st]) => ({ rec, st })));
    db.bump();
  }
  function run(db, label, fn) {
    const tx = begin(db, label);
    try { fn(tx); }
    catch (e) { rollback(db, tx); throw e; }
    return commit(db, tx);
  }
  function setChan(rec, stamp) {
    let ch = kid(rec, "CHAN");
    if (!ch) { ch = { tag: "CHAN", val: "", kids: [] }; rec.kids.push(ch); }
    const d = kid(ch, "DATE");
    if (d) { d.val = stamp; d.kids = d.kids.filter(k => k.tag !== "TIME"); }
    else ch.kids.push({ tag: "DATE", val: stamp, kids: [] });
  }
  function restoreAll(db, list) {
    list.filter(x => !x.st).forEach(x => applyState(db, x.rec, null));
    list.filter(x => x.st).sort((a, b) => (a.st.idx == null ? 1e9 : a.st.idx) - (b.st.idx == null ? 1e9 : b.st.idx))
      .forEach(x => applyState(db, x.rec, x.st));
  }
  function undo(db) {
    const s = db.undoStack.pop();
    if (!s) return null;
    restoreAll(db, s.entries.map(e => ({ rec: e.rec, st: e.before })));
    db.redoStack.push(s); db.changeCount--; db.bump();
    return s.label;
  }
  function redo(db) {
    const s = db.redoStack.pop();
    if (!s) return null;
    restoreAll(db, s.entries.map(e => ({ rec: e.rec, st: e.after })));
    db.undoStack.push(s); db.changeCount++; db.bump();
    return s.label;
  }

  /* ---------- Bearbeiten: Bausteine ---------- */
  function setKid(tx, node, tag, val) {
    // Wert eines Unterknotens setzen; leerer Wert entfernt den Knoten
    let k = kid(node, tag);
    if (val === "" || val == null) { if (k) node.kids.splice(node.kids.indexOf(k), 1); return null; }
    if (!k) { k = { tag, val: "", kids: [] }; node.kids.push(k); }
    k.val = val;
    return k;
  }
  function addPerson(tx, d) {
    const rec = tx.create("INDI", "I");
    const n = { tag: "NAME", val: buildName(esc(d.given), esc(d.surn), esc(d.nsfx)), kids: [] };
    rec.kids.push(n);
    if (d.sex) rec.kids.push({ tag: "SEX", val: d.sex, kids: [] });
    return rec;
  }
  function addFamily(tx, husbId, wifeId) {
    const db = tx.db;
    const f = tx.create("FAM", "F");
    if (husbId) { f.kids.push({ tag: "HUSB", val: husbId, kids: [] }); linkPtr(tx, db.get(husbId), "FAMS", f.xref); }
    if (wifeId) { f.kids.push({ tag: "WIFE", val: wifeId, kids: [] }); linkPtr(tx, db.get(wifeId), "FAMS", f.xref); }
    return f;
  }
  function linkPtr(tx, rec, tag, target) {
    tx.touch(rec);
    if (!rec.kids.some(k => k.tag === tag && k.val === target)) {
      // vor CHAN einfügen, damit die Reihenfolge wie in Reunion bleibt
      const ci = rec.kids.findIndex(k => k.tag === "CHAN");
      const n = { tag, val: target, kids: [] };
      if (ci < 0) rec.kids.push(n); else rec.kids.splice(ci, 0, n);
    }
  }
  function unlinkPtr(tx, rec, tag, target) {
    tx.touch(rec);
    rec.kids = rec.kids.filter(k => !(k.tag === tag && k.val === target));
  }
  function addChild(tx, famId, childId, atIndex) {
    const db = tx.db, f = db.get(famId), c = db.get(childId);
    tx.touch(f); tx.touch(c);
    if (!f.kids.some(k => k.tag === "CHIL" && k.val === childId)) {
      const node = { tag: "CHIL", val: childId, kids: [] };
      const idxs = f.kids.map((k, i) => k.tag === "CHIL" ? i : -1).filter(i => i >= 0);
      let pos;
      if (atIndex != null && atIndex < idxs.length) pos = idxs[atIndex];
      else if (idxs.length) pos = idxs[idxs.length - 1] + 1;
      else { const ci = f.kids.findIndex(k => k.tag === "CHAN"); pos = ci < 0 ? f.kids.length : ci; }
      f.kids.splice(pos, 0, node);
    }
    linkPtr(tx, c, "FAMC", famId);
  }
  function removeChild(tx, famId, childId) {
    const db = tx.db;
    unlinkPtr(tx, db.get(famId), "CHIL", childId);
    unlinkPtr(tx, db.get(childId), "FAMC", famId);
  }
  function setSpouse(tx, famId, role, personId) {
    const db = tx.db, f = db.get(famId);
    tx.touch(f);
    const old = kval(f, role);
    if (old === (personId || "")) return;
    if (old && db.get(old)) unlinkPtr(tx, db.get(old), "FAMS", famId);
    f.kids = f.kids.filter(k => k.tag !== role);
    if (personId) {
      const node = { tag: role, val: personId, kids: [] };
      const hi = f.kids.findIndex(k => k.tag === "HUSB" || k.tag === "WIFE");
      if (role === "HUSB") f.kids.splice(0, 0, node);
      else { const hj = f.kids.findIndex(k => k.tag === "HUSB"); f.kids.splice(hj >= 0 ? hj + 1 : 0, 0, node); }
      linkPtr(tx, db.get(personId), "FAMS", famId);
    }
  }
  /* Satz löschen und alle Verweise darauf entfernen; leere Familien fallen mit weg */
  function hasRef(n, id) { return n.kids.some(k => k.val === id || hasRef(k, id)); }
  function scrub(n, id) {
    for (let i = n.kids.length - 1; i >= 0; i--) {
      if (n.kids[i].val === id) n.kids.splice(i, 1); else scrub(n.kids[i], id);
    }
  }
  function deleteRecord(tx, rec) {
    const db = tx.db, id = rec.xref;
    const famsToCheck = new Set();
    for (const r of db.records.slice()) {
      if (r === rec || !hasRef(r, id)) continue;
      tx.touch(r); scrub(r, id);
      if (r.tag === "FAM") famsToCheck.add(r);
    }
    tx.remove(rec);
    famsToCheck.forEach(f => {
      if (!db.byId.has(f.xref)) return;
      if (!f.kids.some(k => k.tag !== "CHAN" && k.tag !== "_UID")) deleteRecord(tx, f);
    });
  }
  /* alle Verweise auf eine Kennung zählen (für Warnungen vor dem Löschen) */
  function countRefs(db, id) {
    let n = 0;
    for (const r of db.records) {
      if (r.xref === id) continue;
      (function walk(x) { x.kids.forEach(k => { if (k.val === id) n++; walk(k); }); })(r);
    }
    return n;
  }

  /* ---------- Prüfung ---------- */
  function check(db) {
    const issues = [];
    const add = (sev, msg, id) => issues.push({ sev, msg, id });
    for (const r of db.records) {
      (function walk(n, path) {
        n.kids.forEach(k => {
          if (isPtr(k.val) && !db.get(k.val) && !["HEAD", "TRLR"].includes(r.tag))
            add("fehler", "Verweis " + k.val + " (" + path.concat(k.tag).join("/") + ") zeigt auf einen nicht vorhandenen Satz.", r.xref);
          walk(k, path.concat(k.tag));
        });
      })(r, [r.tag]);
    }
    for (const r of db.ofTag("INDI")) {
      for (const fs of kidsOf(r, "FAMS")) {
        const f = db.get(fs.val);
        if (f && f.tag === "FAM" && !f.kids.some(k => (k.tag === "HUSB" || k.tag === "WIFE") && k.val === r.xref))
          add("warnung", "Person " + displayName(r) + " verweist auf Familie " + fs.val + ", ist dort aber weder Mann noch Frau.", r.xref);
      }
      for (const fc of kidsOf(r, "FAMC")) {
        const f = db.get(fc.val);
        if (f && f.tag === "FAM" && !f.kids.some(k => k.tag === "CHIL" && k.val === r.xref))
          add("warnung", "Person " + displayName(r) + " ist in Familie " + fc.val + " als Kind eingetragen, dort aber nicht als Kind aufgeführt.", r.xref);
      }
    }
    for (const f of db.ofTag("FAM")) {
      for (const k of f.kids) {
        if (["HUSB", "WIFE"].includes(k.tag)) {
          const p = db.get(k.val);
          if (p && !p.kids.some(x => x.tag === "FAMS" && x.val === f.xref))
            add("warnung", "Familie " + f.xref + ": " + (k.tag === "HUSB" ? "Mann" : "Frau") + " " + displayName(p) + " hat keinen Verweis zurück auf die Familie.", f.xref);
        }
        if (k.tag === "CHIL") {
          const p = db.get(k.val);
          if (p && !p.kids.some(x => x.tag === "FAMC" && x.val === f.xref))
            add("warnung", "Familie " + f.xref + ": Kind " + displayName(p) + " hat keinen Verweis zurück auf die Familie.", f.xref);
        }
      }
    }
    // Vorfahren-Schleifen: eine Person darf nicht ihr eigener Vorfahr sein
    const state = new Map();
    const visit = (id, stack) => {
      if (state.get(id) === 2) return;
      if (state.get(id) === 1) { add("fehler", "Schleife in den Vorfahren bei " + displayName(db.get(id)), id); return; }
      state.set(id, 1);
      const par = parentsOf(db, id);
      if (par) { if (par.father) visit(par.father); if (par.mother) visit(par.mother); }
      state.set(id, 2);
    };
    for (const r of db.ofTag("INDI")) visit(r.xref);
    return issues;
  }

  return {
    MON, MON_DE, MON_LONG_DE, INDI_EVENTS, FAM_EVENTS, ORDER_INDI,
    fold, isPtr, esc, unesc, todayGed, decode, detectEol, parseGedcom, parseRecordText, serializeRecord, recordText, exportText,
    kid, kidsOf, kval, parseName, buildName, nameParts, displayName, parseDate, formatDate,
    personInfo, famInfo, parentsOf, spouseIn, lifeSpan, startPerson, personIndex, searchPersons, ancestors, citationIndex, noteText,
    begin, commit, rollback, run, undo, redo, setKid, addPerson, addFamily, addChild, removeChild, setSpouse, linkPtr, unlinkPtr,
    deleteRecord, countRefs, check

});

<script>
"use strict";
/* ============ ZUSTAND UND HILFSFUNKTIONEN ============ */
const $ = (id) => document.getElementById(id);
const E = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const ACT = {};          // Klick-Aktionen (data-act)

const S = {
  db: null, fileName: "", source: "local", driveFile: null,
  view: "card", pid: null, fid: null, hist: [], hpos: -1,
  gens: +lsGet("st.gens", 5), depth: +lsGet("st.depth", 4),
  placeFull: lsGet("st.placeFull", "0") === "1", showAuto: lsGet("st.showAuto", "0") === "1",
  eolMode: lsGet("st.eol", "orig"),
  srcSel: null, srcQuery: "", listRows: [], savedMark: 0, lastBackupAt: 0
};

function toast(msg, ms) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, ms || 3200);
}
const isDirty = () => !!S.db && S.db.changeCount !== S.savedMark;

/* ---------- Anzeige-Bausteine ---------- */
function shortPlace(pl) {
  if (!pl) return "";
  if (S.placeFull) return pl;
  const parts = pl.split(",").map(s => s.trim());
  return parts.slice(0, 2).join(", ");
}
function sexSym(sex) { return sex === "M" ? "♂" : sex === "F" ? "♀" : "·"; }
function srcTitle(id) {
  const s = S.db.get(id);
  if (!s) return id;
  const t = GED.kval(s, "TITL") || GED.kval(s, "ABBR") || GED.kval(s, "REGI");
  return GED.unesc(t).replace(/\s*\n\s*/g, " ").trim() || ("Quelle " + id);
}
function nameOf(id) { const r = S.db.get(id); return r ? GED.displayName(r) : ""; }
function nameBtn(id, famId, cls) {
  if (!id) return "";
  return `<button class="${cls || "lk"}" data-act="go" data-id="${id}"${famId ? ` data-fam="${famId}"` : ""}>${E(nameOf(id))}</button>`;
}
function autoNote(text, surnames) {
  if (S.showAuto) return false;
  if (/\n/.test(text.trim()) || text.length > 170) return false;
  if (!/^[A-ZÄÖÜ][\wäöüß-]*(?: [\wäöüß-]+)? von /.test(text)) return false;
  const f = GED.fold(text);
  return surnames.some(s => s && f.includes(GED.fold(s)));
}

/* Fußnoten für Quellen innerhalb eines Blattes */
function newCtx() { return { n: 0, map: new Map(), list: [] }; }
function mark(ctx, nodes) {
  const out = [];
  for (const n of nodes || []) {
    if (!GED.isPtr(n.val) || !S.db.get(n.val)) continue;
    let k = ctx.map.get(n.val);
    if (!k) { k = ++ctx.n; ctx.map.set(n.val, k); ctx.list.push(n.val); }
    out.push(`<a href="#" data-act="src" data-id="${n.val}" title="${E(srcTitle(n.val))}">${k}</a>`);
  }
  return out.length ? `<sup class="fns">${out.join(",")}</sup>` : "";
}

const KEEP_EMPTY = new Set(["BIRT", "DEAT", "CHR", "BAPM", "BURI", "CREM", "MARR", "DIV", "ADOP"]);
function evHtml(ev, ctx, surnames) {
  const db = S.db;
  const notes = [];
  for (const n of ev.notes) {
    const t = GED.noteText(db, n).trim();
    if (t && !autoNote(t, surnames)) notes.push(t);
  }
  if (ev.node && GED.isPtr(ev.node.val)) {            // z. B. Zeugen: Wert ist ein Verweis auf einen Notizsatz
    const r = db.get(ev.node.val);
    if (r && r.tag === "NOTE") { const t = GED.noteText(db, { val: ev.node.val, kids: [] }).trim(); if (t) notes.push(t); }
  }
  const bits = [];
  if (ev.val) bits.push(E(ev.val));
  if (ev.date.text) bits.push(E(ev.date.text));
  let txt = bits.join(", ");
  if (ev.place) txt += (txt ? " in " : "") + `<span title="${E(ev.place)}">${E(shortPlace(ev.place))}</span>`;
  const marks = mark(ctx, ev.sources);
  let noteList = notes;
  if (!txt) {
    if (notes.length === 1 && notes[0].length <= 140 && !/\n/.test(notes[0])) { txt = E(notes[0]); noteList = []; }
    else if (!notes.length && !marks && !KEEP_EMPTY.has(ev.tag)) return "";
    else if (!notes.length) txt = "—";
  }
  const nh = noteList.map(t => `<div class="nt">${E(t.length > 400 ? t.slice(0, 400) + " …" : t)}</div>`).join("");
  const low = ev.tag === "FACT" && /Kekul/i.test(ev.val) ? " low" : "";
  return `<div class="ev${low}"><span class="k">${E(ev.label)}</span><span class="v">${txt}${marks}${nh}</span></div>`;
}

const EV_GROUP = { BIRT: 0, CHR: 1, BAPM: 1, DEAT: 2, BURI: 3, CREM: 3, OCCU: 4, BERUF: 4, EDUC: 5, RESI: 6, RELI: 7 };
function sortedEvents(evs) {
  return evs.map((e, i) => ({ e, i, g: EV_GROUP[e.tag] != null ? EV_GROUP[e.tag] : 8 }))
    .sort((a, b) => a.g - b.g || ((a.e.date.key || 0) - (b.e.date.key || 0)) || a.i - b.i).map(x => x.e);
}

/* ---------- Navigation ---------- */
function setFamFor(pid, wantFam) {
  const p = GED.personInfo(S.db, pid);
  if (!p) return null;
  if (wantFam && p.fams.includes(wantFam)) return wantFam;
  return p.fams[0] || null;
}
function go(pid, fam, noHist) {
  if (!S.db || !GED.personInfo(S.db, pid)) return;
  S.pid = pid;
  S.fid = setFamFor(pid, fam);
  if (!noHist) {
    S.hist = S.hist.slice(0, S.hpos + 1);
    if (S.hist[S.hist.length - 1] !== pid + "|" + (S.fid || "")) S.hist.push(pid + "|" + (S.fid || ""));
    if (S.hist.length > 200) S.hist.shift();
    S.hpos = S.hist.length - 1;
  }
  lsSet("st.last." + S.fileName, pid);
  render();
  scrollListTo(pid);
}
function histMove(d) {
  const n = S.hpos + d;
  if (n < 0 || n >= S.hist.length) return;
  S.hpos = n;
  const [pid, fid] = S.hist[n].split("|");
  if (GED.personInfo(S.db, pid)) { S.pid = pid; S.fid = fid && S.db.get(fid) ? fid : setFamFor(pid); render(); scrollListTo(pid); }
}
ACT.go = (d) => go(d.id, d.fam || null);
ACT.fam = (d) => { S.fid = d.id; render(); };
ACT.src = (d, e) => { e && e.preventDefault(); S.view = "src"; S.srcSel = d.id; render(); };
ACT.back = () => histMove(-1);
ACT.fwd = () => histMove(1);
ACT.home = () => go(GED.startPerson(S.db));
ACT.up = (d) => {
  const par = GED.parentsOf(S.db, d.id);
  if (!par) return;
  const who = par.father || par.mother;
  if (who) go(who, par.fam);
};
ACT.card = (d) => { S.view = "card"; go(d.id); };

/* ---------- Seitenleiste mit Suche (nur sichtbare Zeilen werden gezeichnet) ---------- */
const ROW_H = 36;
function renderList(keepScroll) {
  if (!S.db) return;
  const q = $("q").value;
  S.listRows = GED.searchPersons(S.db, q);
  $("vs").style.height = (S.listRows.length * ROW_H) + "px";
  $("pcount").textContent = S.listRows.length === GED.personIndex(S.db).length
    ? S.listRows.length + " Personen" : S.listRows.length + " von " + GED.personIndex(S.db).length + " Personen";
  if (!keepScroll) $("plist").scrollTop = 0;
  paintRows();
  const abc = $("abc");
  if (!abc.dataset.done) {
    abc.innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c => `<button data-act="abc" data-c="${c}" aria-label="Nachnamen mit ${c}">${c}</button>`).join("");
    abc.dataset.done = "1";
  }
}
function paintRows() {
  const box = $("plist"), vs = $("vs");
  const top = box.scrollTop, h = box.clientHeight || 600;
  const from = Math.max(0, Math.floor(top / ROW_H) - 4), to = Math.min(S.listRows.length, Math.ceil((top + h) / ROW_H) + 4);
  let html = "";
  for (let i = from; i < to; i++) {
    const r = S.listRows[i];
    const p = GED.personInfo(S.db, r.id);
    const yrs = (r.by || r.dy) ? (r.by || "") + "–" + (r.dy || "") : "";
    html += `<button class="prow${r.id === S.pid ? " on" : ""}" style="top:${i * ROW_H}px" data-act="go" data-id="${r.id}"><span class="dot ${p.sex}"></span><span class="pn">${E(r.label)}</span><span class="py">${E(yrs)}</span></button>`;
  }
  vs.innerHTML = html;
}
function scrollListTo(id) {
  const i = S.listRows.findIndex(r => r.id === id);
  const box = $("plist");
  if (i >= 0) {
    const y = i * ROW_H;
    if (y < box.scrollTop || y > box.scrollTop + box.clientHeight - ROW_H * 2) box.scrollTop = Math.max(0, y - box.clientHeight / 3);
  }
  paintRows();
}

/* ---------- Familienblatt ---------- */
function personBlock(id, famId, ctx, fallbackRole) {
  const db = S.db;
  if (!id) {
    const role = fallbackRole === "HUSB" ? "Ehemann" : "Ehefrau";
    return `<section class="pb ${fallbackRole === "HUSB" ? "mas" : "fem"}"><h3 style="color:var(--muted)">${role} unbekannt</h3>
      ${famId ? `<div class="pbact"><button class="btn sm" data-act="setSpouse" data-fam="${famId}" data-role="${fallbackRole}">Person wählen</button></div>` : ""}</section>`;
  }
  const p = GED.personInfo(db, id);
  const par = GED.parentsOf(db, id);
  const surn = [p.name.surn, p.name.given];
  const evs = sortedEvents(p.events);
  let h = `<section class="pb ${p.sex === "F" ? "fem" : p.sex === "M" ? "mas" : ""}${id === S.pid ? " focus" : ""}">`;
  h += `<h3><button data-act="go" data-id="${id}"${famId ? ` data-fam="${famId}"` : ""}>${E(GED.displayName(p.rec))}</button>${mark(ctx, GED.kid(p.rec, "NAME") ? GED.kidsOf(GED.kid(p.rec, "NAME"), "SOUR") : [])}</h3>`;
  h += `<div class="sub"><span>${sexSym(p.sex)} ${E(GED.lifeSpan(db, id))}</span>${p.refn ? `<span>Nr. ${E(p.refn)}</span>` : ""}<span>${E(id.replace(/@/g, ""))}</span>${p.name.nick ? `<span>„${E(p.name.nick)}“</span>` : ""}</div>`;
  if (par) {
    h += `<div class="par">Eltern: ${par.father ? nameBtn(par.father, par.fam) : "unbekannt"} und ${par.mother ? nameBtn(par.mother, par.fam) : "unbekannt"}</div>`;
  } else {
    h += `<div class="par"><button data-act="addParents" data-id="${id}">Eltern hinzufügen</button></div>`;
  }
  for (const e of evs) h += evHtml(e, ctx, surn);
  const pnotes = GED.kidsOf(p.rec, "NOTE");
  const nts = pnotes.map(n => GED.noteText(db, n).trim()).filter(t => t && !autoNote(t, surn));
  if (nts.length) {
    h += `<div class="notes">` + nts.map(t => {
      const first = t.split("\n")[0];
      const lbl = first.length > 70 ? first.slice(0, 70) + " …" : first;
      return `<details><summary>Notiz: ${E(lbl)}</summary><div class="txt">${E(t)}</div></details>`;
    }).join("") + `</div>`;
  }
  const pcites = mark(ctx, GED.kidsOf(p.rec, "SOUR"));
  if (pcites) h += `<div class="ev"><span class="k">Quellen</span><span class="v">${pcites}</span></div>`;
  h += mediaHtml(p.rec);
  h += `<div class="pbact"><button class="btn sm" data-act="editPerson" data-id="${id}">Person bearbeiten</button>`;
  if (par) h += `<button class="btn sm" data-act="up" data-id="${id}">Eltern anzeigen</button>`;
  h += `</div>`;
  const others = p.fams.filter(f => f !== famId);
  if (others.length) {
    h += `<div class="other">Weitere Ehen: ` + others.map(f => {
      const sp = GED.spouseIn(db, f, id);
      return `<button data-act="go" data-id="${id}" data-fam="${f}">${E(sp ? nameOf(sp) : "ohne Ehepartner")}</button>`;
    }).join("") + `</div>`;
  }
  h += `<div class="pbact"><button class="btn sm ghost" data-act="addSpouse" data-id="${id}">Ehe hinzufügen</button></div>`;
  return h + `</section>`;
}

/* ============ STAMMBAUM (VORFAHREN) ============ */
function renderPed() {
  const db = S.db, N = S.gens;
  const anc = GED.ancestors(db, S.pid, N);
  const BW = 196, BH = 48, GX = 46, GY = 8;
  const slots = Math.pow(2, N - 1), H = slots * (BH + GY), W = N * BW + (N - 1) * GX;
  const pos = (k) => {
    const g = Math.floor(Math.log2(k)), i = k - Math.pow(2, g);
    return { x: g * (BW + GX), cy: (i + 0.5) * H / Math.pow(2, g), g };
  };
  let boxes = "", d = "";
  const placeholders = new Set();
  anc.forEach((id, k) => {
    const g = Math.floor(Math.log2(k));
    if (g < N - 1 && (anc.has(2 * k) !== anc.has(2 * k + 1))) placeholders.add(anc.has(2 * k) ? 2 * k + 1 : 2 * k);
  });
  const all = new Set([...anc.keys(), ...placeholders]);
  all.forEach(k => {
    const p = pos(k), top = p.cy - BH / 2;
    if (placeholders.has(k)) {
      boxes += `<div class="tb empty" style="left:${p.x}px;top:${top}px">unbekannt</div>`;
    } else {
      const id = anc.get(k), pi = GED.personInfo(db, id);
      const born = pi.birt && pi.birt.place ? shortPlace(pi.birt.place).split(",")[0] : "";
      boxes += `<button class="tb ${pi.sex}${k === 1 ? " root" : ""}" style="left:${p.x}px;top:${top}px" data-act="pedgo" data-id="${id}" title="${E(GED.displayName(pi.rec))}\n${E(GED.lifeSpan(db, id))}\nKekulé-Nummer ${k}">
        <span class="kk">${k}</span><span class="nm">${E(GED.displayName(pi.rec))}</span><span class="yr">${E(GED.lifeSpan(db, id))}${born ? "  " + E(born) : ""}</span></button>`;
    }
  });
  anc.forEach((id, k) => {
    const a = 2 * k, b = 2 * k + 1;
    if (!all.has(a) && !all.has(b)) return;
    const me = pos(k), x1 = me.x + BW, xm = x1 + GX / 2;
    const ya = all.has(a) ? pos(a).cy : null, yb = all.has(b) ? pos(b).cy : null;
    d += `M${x1} ${me.cy}H${xm}`;
    if (ya != null) d += `M${xm} ${me.cy}V${ya}H${pos(a).x}`;
    if (yb != null) d += `M${xm} ${me.cy}V${yb}H${pos(b).x}`;
  });
  const opts = [3, 4, 5, 6, 7].map(n => `<option value="${n}"${n === N ? " selected" : ""}>${n}</option>`).join("");
  return `<div class="treebar"><strong style="font-family:var(--serif)">${E(nameOf(S.pid))}</strong>
    <label>Generationen <select id="gensSel">${opts}</select></label>
    <button class="btn sm" data-act="back" ${S.hpos <= 0 ? "disabled" : ""}>‹ Zurück</button>
    <button class="btn sm" data-act="card" data-id="${S.pid}">Familienblatt</button>
    <span class="hint">Klick setzt eine Person in die Mitte, Doppelklick öffnet ihr Familienblatt.</span></div>
    <div class="tscroll"><div class="tstage" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" aria-hidden="true"><path d="${d}"/></svg>${boxes}</div></div>`;
}

function renderDesc() {
  const db = S.db;
  let count = 0; const MAX = 1500; let cut = false;
  function person(pid, depth, path) {
    const p = GED.personInfo(db, pid);
    const yrs = GED.lifeSpan(db, pid);
    const nm = `<button class="lk" data-act="dgo" data-id="${pid}">${E(GED.displayName(p.rec))}</button> <span class="sp">${sexSym(p.sex)} ${E(yrs)}</span>`;
    count++;
    const fams = p.fams.filter(f => !path.has(f));
    if (!fams.length) return `<li class="leaf"><span class="dn">${nm}</span></li>`;
    const famLine = (fid) => {
      const f = GED.famInfo(db, fid), sp = GED.spouseIn(db, fid, pid);
      const m = f.marr && f.marr.date.text ? ` <span class="sp">(${E(f.marr.date.text)})</span>` : "";
      return `<span class="sp">⚭</span> ${sp ? `<button class="lk" data-act="dgo" data-id="${sp}">${E(nameOf(sp))}</button> <span class="sp">${E(GED.lifeSpan(db, sp))}</span>` : '<span class="sp">unbekannt</span>'}${m}`;
    };
    const kidsOf = (fid) => {
      const f = GED.famInfo(db, fid);
      if (!f.children.length) return "";
      if (depth >= S.depth) return `<ul class="desc"><li class="leaf"><button class="btn sm" data-act="dgo" data-id="${pid}">${f.children.length} Kinder – weiter ab hier</button></li></ul>`;
      if (count > MAX) { cut = true; return ""; }
      const np = new Set(path); np.add(fid);
      return `<ul class="desc">${f.children.map(c => person(c, depth + 1, np)).join("")}</ul>`;
    };
    let h;
    if (fams.length === 1) {
      h = `<li><details class="dd" open><summary><span class="dn">${nm} ${famLine(fams[0])}</span></summary>${kidsOf(fams[0])}</details></li>`;
    } else {
      h = `<li><details class="dd" open><summary><span class="dn">${nm}</span></summary><ul class="desc">` +
        fams.map(fid => `<li><details class="dd" open><summary><span class="dn">${famLine(fid)}</span></summary>${kidsOf(fid)}</details></li>`).join("") + `</ul></details></li>`;
    }
    return h;
  }
  const opts = [2, 3, 4, 5, 6, 8].map(n => `<option value="${n}"${n === S.depth ? " selected" : ""}>${n}</option>`).join("");
  const body = `<ul class="desc root">${person(S.pid, 1, new Set())}</ul>`;
  return `<div class="treebar"><strong style="font-family:var(--serif)">${E(nameOf(S.pid))}</strong>
    <label>Generationen <select id="depthSel">${opts}</select></label>
    <button class="btn sm" data-act="back" ${S.hpos <= 0 ? "disabled" : ""}>‹ Zurück</button>
    <button class="btn sm" data-act="card" data-id="${S.pid}">Familienblatt</button>
    ${cut ? '<span class="hint">Die Liste wurde nach etwa 1500 Personen gekürzt. Wähle weniger Generationen oder eine Person weiter unten.</span>' : ""}</div>
    <div class="tscroll" style="padding:14px 20px">${body}</div>`;
}

/* ============ QUELLEN ============ */
const SRC_FIELDS = [
  ["TITL", "Titel"], ["ABBR", "Kurzname"], ["TYPE", "Art"], ["AUTH", "Autor"], ["PUBL", "Veröffentlichung"], ["DATE", "Datum"],
  ["PLAC", "Ort"], ["REGI", "Register (REGI)"], ["REPO", "Archiv (REPO)"], ["_REPO", "Archiv (_REPO)"], ["FILN", "Dateinummer (FILN)"], ["LOCA", "Standort (LOCA)"],
  ["PERI", "Zeitraum (PERI)"], ["MEDI", "Medium (MEDI)"], ["DETA", "Details (DETA)"], ["TEXT", "Text"]
];
function sourceList() {
  if (S.db._memo.srcs) return S.db._memo.srcs;
  const arr = S.db.ofTag("SOUR").map(r => ({
    id: r.xref, t: srcTitle(r.xref), ty: GED.unesc(GED.kval(r, "TYPE")),
    hay: GED.fold([srcTitle(r.xref), GED.kval(r, "TYPE"), GED.kval(r, "AUTH"), GED.kval(r, "PLAC"), GED.kval(r, "REGI"), GED.kval(r, "TEXT"), r.xref].join(" "))
  })).sort((a, b) => GED.fold(a.t) < GED.fold(b.t) ? -1 : 1);
  S.db._memo.srcs = arr;
  return arr;
}
function citeLabel(c) {
  const db = S.db, rec = db.get(c.rec);
  if (!rec) return null;
  const what = (c.path[0] && (GED.INDI_EVENTS[c.path[0]] || GED.FAM_EVENTS[c.path[0]])) || (c.path[0] === "NAME" ? "Name" : "");
  if (rec.tag === "INDI") return { go: `data-act="go" data-id="${c.rec}"`, text: GED.displayName(rec), w: what || "Person" };
  if (rec.tag === "FAM") {
    const f = GED.famInfo(db, c.rec);
    const who = [f.husb, f.wife].filter(Boolean).map(nameOf).join(" und ") || c.rec;
    const target = f.husb || f.wife;
    return { go: target ? `data-act="go" data-id="${target}" data-fam="${c.rec}"` : "", text: who, w: what || "Familie" };
  }
  if (rec.tag === "NOTE") {
    const t = GED.noteText(db, rec).split("\n")[0];
    return { go: "", text: "Notiz: " + (t.length > 80 ? t.slice(0, 80) + " …" : t), w: "" };
  }
  return { go: "", text: c.rec, w: "" };
}
function renderSrc() {
  const db = S.db;
  const q = GED.fold(S.srcQuery).split(/\s+/).filter(Boolean);
  const all = sourceList();
  const list = q.length ? all.filter(s => q.every(t => s.hay.includes(t))) : all;
  if (!S.srcSel || !db.get(S.srcSel)) S.srcSel = list.length ? list[0].id : null;
  let detail = `<div class="empty">Keine Quelle gewählt.</div>`;
  if (S.srcSel && db.get(S.srcSel)) {
    const r = db.get(S.srcSel);
    const cites = (GED.citationIndex(db).get(S.srcSel) || []);
    let dl = "";
    for (const [tag, label] of SRC_FIELDS) {
      const v = GED.kval(r, tag);
      if (v) dl += `<dt>${E(label)}</dt><dd>${E(GED.unesc(v))}</dd>`;
    }
    const known = new Set(SRC_FIELDS.map(x => x[0]).concat(["OBJE", "NOTE", "CHAN", "_UID"]));
    for (const k of r.kids) if (!known.has(k.tag) && k.val) dl += `<dt>${E(k.tag)}</dt><dd>${E(GED.unesc(k.val))}</dd>`;
    for (const o of GED.kidsOf(r, "OBJE")) {
      const f = GED.kval(o, "FILE");
      dl += `<dt>Medium</dt><dd>${E(GED.kval(o, "TITL") || f.split("/").pop())}<div class="hint">${E(f)}</div></dd>`;
    }
    for (const n of GED.kidsOf(r, "NOTE")) dl += `<dt>Notiz</dt><dd>${E(GED.noteText(db, n))}</dd>`;
    const shown = cites.slice(0, 200);
    detail = `<div style="max-width:900px"><div class="nav"><h2 style="margin:0;font:600 22px var(--serif)">${E(srcTitle(S.srcSel))}</h2><span class="spacer"></span>
      <button class="btn sm" data-act="editSrc" data-id="${S.srcSel}">Bearbeiten</button>
      <button class="btn sm dng" data-act="delSrc" data-id="${S.srcSel}">Löschen</button></div>
      <dl class="kv">${dl}<dt>Kennung</dt><dd>${E(S.srcSel)}</dd></dl>
      <div class="panel"><h4>Zitiert von ${cites.length} Stellen</h4>${cites.length ? `<ul class="cites">${shown.map(c => {
        const l = citeLabel(c); if (!l) return "";
        return `<li>${l.go ? `<button ${l.go}>${E(l.text)}</button>` : E(l.text)}${l.w ? `<span class="w">${E(l.w)}</span>` : ""}</li>`;
      }).join("")}</ul>${cites.length > 200 ? `<div class="hint">Gezeigt werden die ersten 200.</div>` : ""}` : `<div class="hint">Diese Quelle wird von keiner Stelle zitiert.</div>`}</div></div>`;
  }
  const items = list.slice(0, 600).map(s => `<button class="sitem${s.id === S.srcSel ? " on" : ""}" data-act="srcsel" data-id="${s.id}"><span class="t">${E(s.t)}</span><span class="m">${E(s.ty)}${s.ty ? " · " : ""}${(GED.citationIndex(db).get(s.id) || []).length === 1 ? "1 Zitat" : (GED.citationIndex(db).get(s.id) || []).length + " Zitate"}</span></button>`).join("");
  return `<div class="split"><div class="slist"><div class="sbtop"><input id="sq" type="search" placeholder="Quellen durchsuchen" value="${E(S.srcQuery)}" aria-label="Quellen durchsuchen"><button class="btn sm" data-act="newSrc">Neue Quelle</button></div>
    <div class="items">${items || '<div class="empty" style="padding:12px">Keine Treffer.</div>'}${list.length > 600 ? `<div class="hint" style="padding:8px 12px">Weitere Treffer: Suche verfeinern.</div>` : ""}</div>
    <div class="count">${list.length} von ${all.length} Quellen</div></div><div class="sdetail">${detail}</div></div>`;
}

/* ============ DIALOGE UND BEARBEITEN ============ */
const MONTHS = GED.MON;
function normDate(s) {
  s = (s || "").trim();
  let m = /^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{3,4})$/.exec(s);
  if (m && +m[2] >= 1 && +m[2] <= 12) return (+m[1]) + " " + MONTHS[+m[2] - 1] + " " + m[3];
  m = /^(\d{1,2})\.\s*(\d{3,4})$/.exec(s);
  if (m && +m[1] >= 1 && +m[1] <= 12) return MONTHS[+m[1] - 1] + " " + m[2];
  return s;
}

let _dlgZ = 50;
function openDlg(opts) {

  document.body.appendChild(ovl);

    q(sel) { return d.body.querySelector(sel); },
    close() { ovl.remove(); _dlgZ--; if (opts.onClose) opts.onClose(d); },
    paint() {
      const sc = d.body.scrollTop;
      d.body.innerHTML = opts.body(d);
      d.foot.innerHTML = (opts.buttons ? opts.buttons(d) : []).map(b => `<button class="btn ${b.cls || ""}" data-d="${b.id}">${E(b.label)}</button>`).join("");

/* ---------- gemeinsame Hilfen für Ereignisse, Notizen, Quellen ---------- */
const CANON = ["TYPE", "DATE", "PLAC", "ADDR", "CAUS", "AGE", "NOTE", "SOUR", "OBJE"];
function putKid(node, tag, val) {
  let k = node.kids.find(x => x.tag === tag);
  if (val === "" || val == null) { if (k) node.kids.splice(node.kids.indexOf(k), 1); return null; }
  if (k) { k.val = val; return k; }
  k = { tag, val, kids: [] };
  const ord = CANON.indexOf(tag);
  const at = ord < 0 ? -1 : node.kids.findIndex(x => CANON.indexOf(x.tag) > ord);
  if (at < 0) node.kids.push(k); else node.kids.splice(at, 0, k);
  return k;
}
function putInlineNote(node, text, keepLead) {
  const val = text === "" ? "" : (keepLead ? "\n" : "") + GED.esc(text);
  let k = node.kids.find(x => x.tag === "NOTE" && !GED.isPtr(x.val));
  if (!val) { if (k) node.kids.splice(node.kids.indexOf(k), 1); return; }
  if (k) { k.val = val; return; }
  k = { tag: "NOTE", val, kids: [] };
  const at = node.kids.findIndex(x => CANON.indexOf(x.tag) > CANON.indexOf("NOTE"));
  if (at < 0) node.kids.push(k); else node.kids.splice(at, 0, k);
}
function syncSources(node, ptrs) {
  const keep = new Set(ptrs);
  node.kids = node.kids.filter(k => k.tag !== "SOUR" || !GED.isPtr(k.val) || keep.has(k.val));
  const have = new Set(node.kids.filter(k => k.tag === "SOUR").map(k => k.val));
  for (const p of ptrs) if (!have.has(p)) {
    const k = { tag: "SOUR", val: p, kids: [] };
    const at = node.kids.findIndex(x => CANON.indexOf(x.tag) > CANON.indexOf("SOUR"));
    if (at < 0) node.kids.push(k); else node.kids.splice(at, 0, k);
  }
}
const ATTR = new Set(["OCCU", "BERUF", "RELI", "EDUC", "FACT", "TITL", "NATI", "DSCR", "CAST", "IDNO", "NCHI", "NMR", "SSN", "PROP", "_CAUS", "EVEN"]);
const TYPES_INDI = ["BIRT", "CHR", "BAPM", "DEAT", "BURI", "CREM", "RESI", "OCCU", "EDUC", "RELI", "CONF", "FCOM", "EMIG", "IMMI", "NATU", "ADOP", "PROP", "CENS", "EVEN", "FACT"];
const TYPES_FAM = ["MARR", "DIV", "ENGA", "ANUL", "MARB", "MARC", "MARL", "MARS", "_MARRIAGEREL", "UMAR", "CENS", "EVEN", "FACT"];

function evModel(rec, labels) {
  return rec.kids.filter(k => labels[k.tag]).map(n => {
    const inl = n.kids.find(k => k.tag === "NOTE" && !GED.isPtr(k.val));
    return {
      node: n, tag: n.tag, type: GED.unesc(GED.kval(n, "TYPE")),
      val: GED.isPtr(n.val) ? "" : GED.unesc(n.val), ptrVal: GED.isPtr(n.val) ? n.val : null,
      date: GED.kval(n, "DATE"), place: GED.unesc(GED.kval(n, "PLAC")),
      note: inl ? GED.unesc(inl.val).replace(/^\n/, "") : "", lead: !!(inl && inl.val.startsWith("\n")),
      ptrNotes: n.kids.filter(k => k.tag === "NOTE" && GED.isPtr(k.val)).map(k => k.val),
      srcs: n.kids.filter(k => k.tag === "SOUR" && GED.isPtr(k.val)).map(k => k.val), del: false, dirty: false

function noteModel(rec) {
  return GED.kidsOf(rec, "NOTE").map(n => {

    const src = ptr ? S.db.get(ptr) : null;
    const raw = ptr ? (src ? src.val : "") : n.val;
    return { node: n, ptr, text: GED.unesc(raw).replace(/^\n/, ""), lead: raw.startsWith("\n"), shared: ptr ? GED.countRefs(S.db, ptr) : 0, del: false, changed: false };

}

function ensurePlaceList() {
  let dl = $("placelist");
  if (!dl) { dl = document.createElement("datalist"); dl.id = "placelist"; document.body.appendChild(dl); }
  if (dl.dataset.v === String(S.db.version)) return;
  if (!S.db._memo.places) {
    const set = new Map();
    for (const r of S.db.records) (function walk(n) { n.kids.forEach(k => { if (k.tag === "PLAC" && k.val) set.set(k.val, (set.get(k.val) || 0) + 1); walk(k); }); })(r);
    S.db._memo.places = Array.from(set.entries()).sort((a, b) => b[1] - a[1]).map(x => GED.unesc(x[0]));
  }
  dl.innerHTML = S.db._memo.places.slice(0, 3000).map(p => `<option value="${E(p)}">`).join("");

}

  };

function applyEvents(tx, rec, evs, labels, beforeTags) {
  for (const ev of evs) {
    if (ev.del) { if (ev.node) rec.kids.splice(rec.kids.indexOf(ev.node), 1); continue; }
    let n = ev.node;
    const isNew = !n;
    if (!isNew && !ev.dirty) continue;                 // nichts geändert: Knoten unangetastet lassen
    if (isNew) {
      n = { tag: ev.tag, val: "", kids: [] };
      const at = rec.kids.findIndex(k => beforeTags.includes(k.tag));
      if (at < 0) rec.kids.push(n); else rec.kids.splice(at, 0, n);
    }
    if (!ev.ptrVal && ATTR.has(ev.tag)) n.val = GED.esc(ev.val.trim());
    if (ev.tag === "EVEN" || ev.tag === "FACT") putKid(n, "TYPE", GED.esc(ev.type.trim()));
    putKid(n, "DATE", normDate(ev.date));
    putKid(n, "PLAC", GED.esc(ev.place.trim()));
    putInlineNote(n, ev.note.trim(), ev.lead);
    syncSources(n, ev.srcs);
    if (isNew && !ATTR.has(ev.tag)) n.val = n.kids.length ? "" : "Y";
  }
}
function applyNotes(tx, rec, notes, beforeTags) {
  for (const n of notes) {
    if (n.del) { if (n.node) rec.kids.splice(rec.kids.indexOf(n.node), 1); continue; }
    const text = n.text.replace(/\s+$/, "");
    if (n.node) {
      if (!n.changed) continue;
      if (n.ptr) { const nr = S.db.get(n.ptr); if (nr) { tx.touch(nr); nr.val = (n.lead ? "\n" : "") + GED.esc(text); } }
      else n.node.val = (n.lead ? "\n" : "") + GED.esc(text);
    } else if (text) {
      const node = { tag: "NOTE", val: GED.esc(text), kids: [] };
      const at = rec.kids.findIndex(k => beforeTags.includes(k.tag));
      if (at < 0) rec.kids.push(node); else rec.kids.splice(at, 0, node);
    }
  }
}

  const d = openDlg({

    body: (d) => {
