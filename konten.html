<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Seifferts Konten</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!--
  Seifferts Konten - woechentliche Kontostaende erfassen und auswerten, eine einzelne HTML-Datei ohne Build, ohne Server.
  Daten liegen im localStorage dieses Browsers (Sicherung ueber den Reiter Daten, optional Google Drive).
  v1.2.0 Konten im Kurzbericht ausblenden (je Bericht oder dauerhaft pro Konto), Bilanz im Bericht, weitere Kontoarten (Immobilie, Aktien, Fonds, ...)
  v1.1.0 Kurzbericht als LaTeX (.tex) mit Torten- und Verlaufsgrafiken (TikZ) im Reiter Diagramme
  v1.0.0 Erste Fassung: schnelle Eingabe geaenderter Kontostaende mit Datum, Uebersicht, frei erweiterbare Auswertungen
         (Verlauf als Linien, Anteile als Torte; Gruppierung und Filter nach Kontoart, Bank, Besitzer, Gruppe, Konto),
         Tabelle aller Staende, JSON/CSV, Google Drive, Block linuxHandOff fuer die Linux-App
-->
<style>
:root{
  color-scheme: light dark;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface2:#f0efec; --line:#d9d7d0; --grid:#e8e7e2;
  --text:#0b0b0b; --text2:#52514e; --muted:#76756e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --other:#9a9992; --pos:#1c5cab; --neg:#c0302f; --accent:#2a78d6; --warnbg:#fdf3dc; --warnline:#e3b24a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --surface:#1a1a19; --surface2:#252523; --line:#3a3a37; --grid:#2b2b29;
    --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#6f6e68; --pos:#6da7ec; --neg:#ef8584; --accent:#3987e5; --warnbg:#33290f; --warnline:#8a6a1c;
  }
}
a{color:var(--accent)}
.chartlink,.linkadd{font-size:.85rem;white-space:nowrap}
.cards-m{display:none}
.sortm{display:none}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard.err{background:var(--warnbg);border-color:var(--warnline)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph strong{font-size:1rem}
.pg{text-align:right;font-weight:650;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pg small{display:block;font-weight:500;font-size:.82rem}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px;margin:10px 0 0}
.pgrid div{min-width:0}
.pgrid dt{font-size:.74rem;color:var(--muted)}
.pgrid dd{margin:0;font-size:.92rem;font-variant-numeric:tabular-nums}
.pgrid dd small{color:var(--muted);font-size:.74rem}
@media(max-width:640px){
  .tbl-d{display:none}
  .cards-m{display:block}
  .sortm{display:block}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{margin:0;padding:10px 0 4px;font-size:1.15rem;font-weight:650}
.ver{font-size:.75rem;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:40px;padding:6px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text2);font:inherit;font-size:.95rem;cursor:pointer}
@media(max-width:480px){nav button{padding:6px 8px;font-size:.9rem}}
nav button[aria-selected="true"]{background:var(--surface2);border-color:var(--line);color:var(--text);font-weight:600}
main{padding-top:14px;padding-bottom:60px}
h2{font-size:1.05rem;margin:0 0 8px}
h3{font-size:.95rem;margin:14px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0}
.msg{color:var(--neg);font-size:.92rem;min-height:1.2em;margin:6px 0}
.note{background:var(--warnbg);border:1px solid var(--warnline);border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.3rem;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.85rem;color:var(--text2);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;z-index:1}
.sticky1 td:first-child{background:var(--surface)}
thead th{background:var(--surface2);font-weight:600;font-size:.82rem;color:var(--text2)}
th button{all:unset;cursor:pointer;display:inline-block;padding:2px 0}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tfoot td,.sticky1 tfoot td:first-child{font-weight:650;background:var(--surface2);border-bottom:none}
td small,.sub{display:block;color:var(--muted);font-size:.78rem}
tr.err td{background:var(--warnbg)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:10px}
input,select,textarea{display:block;width:100%;min-height:44px;margin-top:3px;padding:8px 10px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;-moz-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{-moz-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{display:inline-block;width:20px;min-height:20px;margin:0 8px 0 0;vertical-align:middle;-moz-appearance:auto;appearance:auto}
.checkrow{display:flex;align-items:center;font-size:.92rem;color:var(--text2);margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 label:first-child{grid-column:1/3}}
button.btn,button.primary,a.btn{display:inline-block;min-height:44px;padding:8px 16px;font:inherit;font-size:.95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;text-decoration:none;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--neg)}
button.small{min-height:34px;padding:4px 10px;font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
details{margin:8px 0}
summary{cursor:pointer;color:var(--text2);padding:6px 0;min-height:32px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--text2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.dot{border-radius:50%}
.sw.dia{transform:rotate(45deg);width:10px;height:10px;border-radius:1px}
.sw.line{height:3px;width:18px;border-radius:2px}
.sw.dash{height:0;width:18px;border-top:3px dashed}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;max-width:100%;height:auto}
svg .t{fill:var(--text2);font-size:12px}
svg .tm{fill:var(--muted);font-size:11px}
svg .tv{fill:var(--text);font-size:11px;font-variant-numeric:tabular-nums}
svg .tb{fill:var(--text);font-size:12px;font-weight:600}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--line);stroke-width:1}
svg .hit{fill:transparent}
svg .hit:hover{fill:rgba(128,128,128,.14)}
svg [data-tip]{cursor:default}
.donutrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.donutrow ul{list-style:none;padding:0;margin:0;flex:1 1 220px;font-size:.92rem}
.donutrow li{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--grid)}
.donutrow li span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donutrow li span.p{font-variant-numeric:tabular-nums;color:var(--text2)}
#tip{position:fixed;display:none;z-index:50;max-width:260px;padding:7px 10px;background:var(--text);color:var(--bg);border-radius:8px;font-size:.82rem;line-height:1.35;white-space:pre-line;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;display:none;max-width:92vw}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:420px}
.dlg h2{margin-top:0}
.dlg p{white-space:pre-line}
.hero{text-align:center;padding:30px 14px}
.hero p{max-width:520px;margin:8px auto}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:6px 0}
.pill{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--text2);margin-left:4px}
.pill.warn{border-color:var(--warnline);background:var(--warnbg)}
.histlist{max-height:220px;overflow:auto;border:1px solid var(--grid);border-radius:8px}
.histlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:.9rem}
.kursrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.kursrow input{margin-top:0}

.titlerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpill{flex:0 1 auto;min-height:32px;margin-top:6px;padding:3px 12px;font:inherit;font-size:.8rem;color:var(--text2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpill[data-st="ok"]{border-color:var(--s3)}
.dpill[data-st="pending"],.dpill[data-st="busy"]{border-color:var(--s4)}
.dpill[data-st="auth"],.dpill[data-st="conflict"],.dpill[data-st="error"],.dpill[data-st="unavail"]{border-color:var(--warnline);background:var(--warnbg);color:var(--text);font-weight:600}
.btns.col{flex-direction:column}
.btns.col button{text-align:left}

/* --- Seifferts Konten --- */
.erow{display:grid;grid-template-columns:minmax(0,1fr) 150px 160px 110px;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.erow.head{font-size:.8rem;color:var(--muted);font-weight:600;padding:4px 0}
.erow .en strong{word-break:break-word}
.erow .el{font-variant-numeric:tabular-nums;text-align:right}
.erow .el small{display:block;color:var(--muted);font-size:.76rem}
.erow .ei input{margin:0;text-align:right}
.erow .ed{text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.esum{margin:12px 0 4px;padding:9px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
input[aria-invalid="true"]{outline:2px solid var(--neg);outline-offset:1px}
@media(max-width:700px){
  .erow{grid-template-columns:1fr 1fr;gap:4px 10px}
  .erow.head{display:none}
  .erow .en{grid-column:1/3}
  .erow .el{text-align:left}
  .erow .ed{grid-column:1/3;text-align:right;min-height:1.2em}
}
td.cell{cursor:pointer}
td.cell:hover,td.cell:focus-visible{background:var(--surface2);outline:none}
td.nocell{color:var(--muted)}
.gtable th{white-space:normal;min-width:96px}
.gtable td:first-child .btn{min-height:26px;padding:0 8px;margin-right:6px}
.fdet{margin:6px 0;border:1px solid var(--grid);border-radius:8px;padding:2px 10px}
.fdet .chk{max-height:200px;overflow:auto;padding:4px 0 6px}
.fdet .checkrow{margin:2px 0}
.vcard .vbtns{justify-content:flex-end}
.vcard .legend b{font-variant-numeric:tabular-nums;color:var(--text)}
.sw.dash{border-top-style:dashed}
.chart details{margin-top:8px}
</style>
</head>

      <button role="tab" data-tab="eingabe">Eingabe</button>

<main class="wrap" id="view"></main>

<script>
'use strict';
/* ======================================================================
   Seifferts Konten v1.0
   ====================================================================== */
const VERSION = '1.2.0';
const LS_KEY = 'seifferts_konten_v1';
const PALETTE = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];
const FDIMS = ['type', 'bank', 'owner', 'tag', 'acc'];
const FDIM_NAMES = {type:'Kontoart', bank:'Bank', owner:'Besitzer', tag:'Gruppe', acc:'Einzelne Konten'};
const GROUPS = {sum:'Gesamtsumme', konto:'Konto', type:'Kontoart', bank:'Bank', owner:'Besitzer', tag:'Gruppe'};
const RANGES = {all:'Gesamter Zeitraum', ytd:'Laufendes Jahr', '1y':'Letzte 12 Monate', '6m':'Letzte 6 Monate', '3m':'Letzte 3 Monate'};
const TYPE_SUGGEST = ['Girokonto', 'Tagesgeld', 'Festgeld', 'Sparkonto', 'Depot', 'Bargeld', 'Kreditkarte', 'Darlehen', 'Immobilie', 'Aktien', 'Fonds und ETF', 'Edelmetalle', 'Fahrzeug', 'Altersvorsorge', 'Sonstiges'];
const LAST = '9999-12-31';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _uid = 0;
const uid = () => Date.now().toString(36) + (_uid++).toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- Formate ---------- */
const fEur  = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR'});
const fEurS = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR', signDisplay:'exceptZero'});
const fPct  = new Intl.NumberFormat('de-DE', {minimumFractionDigits:1, maximumFractionDigits:1, signDisplay:'exceptZero'});
const fPct0 = new Intl.NumberFormat('de-DE', {minimumFractionDigits:1, maximumFractionDigits:1});
const eur  = v => isFinite(v) ? fEur.format(v) : '–';
const eurS = v => isFinite(v) ? fEurS.format(v) : '–';
const pctS = r => isFinite(r) ? fPct.format(r * 100) + ' %' : '–';
const pctP = r => isFinite(r) ? fPct0.format(r * 100) + ' %' : '–';
const signCls = v => v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : '';

function pad2(n){ return String(n).padStart(2, '0'); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fd(iso){ if(!iso) return '–'; const [y, m, d] = iso.split('-'); return d + '.' + m + '.' + y; }
function fdShort(iso){ const [y, m, d] = iso.split('-'); return d + '.' + m + '.'; }
function daysBetween(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function isoMinusMonths(d, m){
  const [y, mo, da] = d.split('-').map(Number), dt = new Date(Date.UTC(y, mo - 1 - m, 1));
  const last = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
  dt.setUTCDate(Math.min(da, last)); return dt.toISOString().slice(0, 10);
}
function rangeFrom(r){
  const t = todayISO();
  return r === 'ytd' ? t.slice(0, 4) + '-01-01' : r === '1y' ? isoMinusMonths(t, 12) : r === '6m' ? isoMinusMonths(t, 6) : r === '3m' ? isoMinusMonths(t, 3) : '';
}
function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(/€/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc >= 0) s = s.replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  return /^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s) ? Number(s) : NaN;
}
function parseDate(s){
  s = String(s || '').trim();
  let y, m, d, mm;
  if ((mm = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/))) { d = +mm[1]; m = +mm[2]; y = +mm[3]; if (y < 100) y += 2000; }
  else return null;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
  return y + '-' + pad2(m) + '-' + pad2(d);
}
const round2 = v => Math.round(v * 100) / 100;
const collator = new Intl.Collator('de', {numeric:true, sensitivity:'base'});

/* ======================================================================
   Daten: Konten und Kontostände
   Konto: {id, name, type, bank, owner, tags[], liab, norep (im Kurzbericht standardmäßig ausgeblendet), archived}
   Kontostand: {id, accId, date, amount, note}  (je Konto und Tag höchstens einer)
   Auswertung (meta.views): gespeicherte Diagramm-Einstellungen
   ====================================================================== */
function defaultViews(){
  const F = () => ({type:[], bank:[], owner:[], tag:[], acc:[]});
  return [
    {id:'v-gesamt', title:'Gesamtvermögen im Verlauf', kind:'line', group:'sum', f:F(), range:'all', at:'', archiv:true, total:false},
    {id:'v-art-verlauf', title:'Verlauf nach Kontoart', kind:'line', group:'type', f:F(), range:'all', at:'', archiv:true, total:true},
    {id:'v-art-anteile', title:'Anteile nach Kontoart', kind:'pie', group:'type', f:F(), range:'all', at:'', archiv:false, total:false},
    {id:'v-bank-anteile', title:'Anteile nach Bank', kind:'pie', group:'bank', f:F(), range:'all', at:'', archiv:false, total:false}
  ];
}
function normView(v){
  if (!v || typeof v !== 'object') return null;
  const f = {}; FDIMS.forEach(k => { f[k] = Array.isArray(v.f && v.f[k]) ? v.f[k].map(x => String(x).slice(0, 80)).slice(0, 300) : []; });
  return {
    id:String(v.id == null ? '' : v.id).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || uid(),
    title:String(v.title || 'Auswertung').trim().slice(0, 80) || 'Auswertung',
    kind:v.kind === 'pie' ? 'pie' : 'line',
    group:GROUPS[v.group] ? v.group : 'type',

  };
}
function emptyState(){ return {accounts:[], entries:[], meta:{lastBackup:null, views:defaultViews()}}; }
const hasData = s => !!(s && (s.accounts.length || s.entries.length));
const cleanTxt = (x, n = 60) => String(x == null ? '' : x).replace(/\s+/g, ' ').trim().slice(0, n);
function cleanTags(t){
  const list = Array.isArray(t) ? t : String(t == null ? '' : t).split(/[,;]/);
  const out = []; list.forEach(x => { x = cleanTxt(x, 40); if (x && !out.some(y => y.toLowerCase() === x.toLowerCase())) out.push(x); });
  return out.slice(0, 20);
}
function normalizeState(o){
  const s = emptyState();
  if (!o || typeof o !== 'object') return s;
  const ids = new Set();
  (Array.isArray(o.accounts) ? o.accounts : []).forEach(a => {
    if (!a || a.id == null || !cleanTxt(a.name, 80) || ids.has(String(a.id))) return;
    ids.add(String(a.id));
    s.accounts.push({id:String(a.id), name:cleanTxt(a.name, 80), type:cleanTxt(a.type), bank:cleanTxt(a.bank), owner:cleanTxt(a.owner), tags:cleanTags(a.tags), liab:!!a.liab, norep:!!a.norep, archived:!!a.archived});
  });
  const seen = new Map();
  (Array.isArray(o.entries) ? o.entries : []).forEach(e => {
    if (!e || !ids.has(String(e.accId))) return;
    const d = parseDate(e.date), v = Number(e.amount);
    if (!d || !isFinite(v)) return;
    seen.set(String(e.accId) + '|' + d, {id:String(e.id || uid()), accId:String(e.accId), date:d, amount:round2(v), note:String(e.note || '').slice(0, 200)});
  });
  s.entries = [...seen.values()].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if (o.meta && o.meta.lastBackup) s.meta.lastBackup = String(o.meta.lastBackup);
  if (o.meta && Array.isArray(o.meta.views)) {
    const vs = [], vids = new Set();
    o.meta.views.forEach(v => { const n = normView(v); if (n && !vids.has(n.id)) { vids.add(n.id); vs.push(n); } });
    s.meta.views = vs.slice(0, 40);
  }
  return s;
}
let storageOK = true;
function loadState(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalizeState(JSON.parse(raw)); }
  catch (e) { storageOK = false; console.warn('Laden fehlgeschlagen', e); }
  return emptyState();
}
let state = loadState();
let cache = {};
function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; toast('Achtung: Speichern im Browser nicht möglich. Bitte Sicherung exportieren.', 5000); }
}
function saveState(opts){
  cache = {};
  persist();
  if (!(opts && opts.noSync)) driveTouch();
}
/* Ersetzt den kompletten Bestand. Der bisherige Stand bleibt als Notkopie im Browser (Reiter Daten). */
function replaceState(ns, opts){
  opts = opts || {};
  if (opts.keepPrev !== false && hasData(state)) {
    try { localStorage.setItem(LS_KEY + '_prev', JSON.stringify({saved:new Date().toISOString(), state})); } catch (e) {}
  }
  state = ns; ui.vedit = null; ui.accEdit = null; saveState({noSync:!!opts.noSync});
}
function wsObj(){ return state; }

/* ---------- Berechnung ---------- */
const accById = id => state.accounts.find(a => a.id === id);
const sgn = a => a.liab ? -1 : 1;
function entriesBy(){
  if (cache.by) return cache.by;
  const m = new Map(); state.accounts.forEach(a => m.set(a.id, []));
  state.entries.forEach(e => { const l = m.get(e.accId); if (l) l.push(e); });
  m.forEach(l => l.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  return (cache.by = m);
}
/* Letzter Eintrag eines Kontos bis einschließlich d (Stand wird bis zum nächsten Eintrag fortgeschrieben) */
function valueAt(accId, d){
  const l = entriesBy().get(accId) || [];
  for (let i = l.length - 1; i >= 0; i--) if (l[i].date <= d) return l[i];
  return null;
}
function firstDate(accId){ const l = entriesBy().get(accId) || []; return l.length ? l[0].date : null; }
function totalAt(accs, d){
  let sum = 0, n = 0;
  accs.forEach(a => { const e = valueAt(a.id, d); if (e) { sum += sgn(a) * e.amount; n++; } });
  return {sum, n};
}
const activeAccounts = () => state.accounts.filter(a => !a.archived);
function sortAccs(list){
  return list.slice().sort((a, b) => (!a.bank - !b.bank) || collator.compare(a.bank, b.bank) || collator.compare(a.type, b.type) || collator.compare(a.name, b.name));
}
function labelsOf(a, dim){
  switch (dim) {
    case 'konto': return [a.name];
    case 'type': return [a.type || 'Ohne Kontoart'];
    case 'bank': return [a.bank || 'Ohne Bank'];
    case 'owner': return [a.owner || 'Ohne Besitzer'];
    case 'tag': return a.tags.length ? a.tags : ['Ohne Gruppe'];
    default: return ['Gesamt'];
  }
}
function accMatches(a, f, archiv){
  if (a.archived && !archiv) return false;
  if (f.acc.length && !f.acc.includes(a.id)) return false;
  for (const k of ['type', 'bank', 'owner', 'tag']) if (f[k].length && !labelsOf(a, k).some(l => f[k].includes(l))) return false;
  return true;
}
function filterOptions(dim){
  if (dim === 'acc') return sortAccs(state.accounts).map(a => ({value:a.id, label:a.name + (a.archived ? ' (archiviert)' : '')}));
  const set = new Set(); state.accounts.forEach(a => labelsOf(a, dim).forEach(l => set.add(l)));
  return [...set].sort(collator.compare).map(l => ({value:l, label:l}));
}

/* ---------- Auswertungen: Daten für Linien und Torten ---------- */
function groupAccounts(accs, group){
  const g = new Map();
  accs.forEach(a => labelsOf(a, group).forEach(l => { if (!g.has(l)) g.set(l, []); g.get(l).push(a); }));
  return g;
}
function lineData(v){
  const accs = state.accounts.filter(a => accMatches(a, v.f, v.archiv));
  if (!accs.length) return {empty:'Kein Konto entspricht dem Filter.'};
  const ids = new Set(accs.map(a => a.id));
  let dates = [...new Set(state.entries.filter(e => ids.has(e.accId)).map(e => e.date))].sort();
  if (!dates.length) return {empty:'Für diese Konten sind noch keine Kontostände erfasst.'};
  const from = rangeFrom(v.range);
  if (from) {
    const before = dates.filter(d => d < from), inR = dates.filter(d => d >= from);
    dates = before.length && (!inR.length || inR[0] > from) ? [from, ...inR] : inR;
  }
  if (dates.length < 2) return {empty:'Ein Verlauf erscheint, sobald mindestens zwei verschiedene Erfassungstermine im Zeitraum liegen.'};
  const mk = (name, list) => {
    const fs = list.map(a => firstDate(a.id)).filter(Boolean).sort()[0];
    return {name, vals:dates.map(d => !fs || d < fs ? null : totalAt(list, d).sum)};
  };
  let series;
  if (v.group === 'sum') series = [mk('Gesamt', accs)];
  else {
    series = [...groupAccounts(accs, v.group)].map(([n, l]) => mk(n, l));
    const lastV = s => { for (let i = s.vals.length - 1; i >= 0; i--) if (s.vals[i] != null) return Math.abs(s.vals[i]); return 0; };
    series.sort((a, b) => lastV(b) - lastV(a) || collator.compare(a.name, b.name));
    if (series.length > 8) {
      const rest = series.slice(7);
      series = series.slice(0, 7);
      series.push({name:`Weitere (${rest.length})`, vals:dates.map((d, i) => { const x = rest.map(s => s.vals[i]).filter(z => z != null); return x.length ? x.reduce((p, q) => p + q, 0) : null; }), other:true});
    }
    if (v.total) series.push(Object.assign(mk('Gesamt', accs), {dash:true}));
  }
  let ci = 0;
  series.forEach(s => { s.color = s.dash ? 'var(--text2)' : s.other ? 'var(--other)' : PALETTE[ci++ % PALETTE.length]; });
  return {dates, series, count:accs.length};
}
function pieData(v){
  const accs = state.accounts.filter(a => accMatches(a, v.f, v.archiv));
  const at = v.at || LAST, map = new Map();
  let liab = 0, neg = 0, any = 0;
  accs.forEach(a => {
    const e = valueAt(a.id, at); if (!e) return;
    if (a.liab) { liab++; return; }
    if (e.amount <= 0) { neg++; return; }
    any++;
    labelsOf(a, v.group).forEach(l => map.set(l, (map.get(l) || 0) + e.amount));
  });
  let items = [...map].map(([name, value]) => ({name, value})).sort((a, b) => b.value - a.value || collator.compare(a.name, b.name));
  if (items.length > 8) { const rest = items.slice(7); items = items.slice(0, 7); items.push({name:`Weitere (${rest.length})`, value:rest.reduce((p, q) => p + q.value, 0), other:true}); }
  let ci = 0; items.forEach(it => { it.color = it.other ? 'var(--other)' : PALETTE[ci++ % PALETTE.length]; });
  const total = items.reduce((p, q) => p + q.value, 0);
  const multi = v.group === 'tag' && accs.some(a => a.tags.length > 1);
  return {items, total, liab, neg, multi, any};
}

/* ---------- Diagramme ---------- */
function niceStep(range, n){ const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }
function niceRange(lo, hi, n = 4){
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const step = niceStep(hi - lo, n), a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, ticks = [];
  for (let v = a; v <= b + step * 1e-6; v += step) ticks.push(+v.toFixed(10));
  return {lo:a, hi:b, step, ticks};
}
function axisFmt(step){
  const d = Math.abs(step - Math.round(step)) < 1e-9 ? 0 : Math.abs(step * 10 - Math.round(step * 10)) < 1e-9 ? 1 : 2;
  const f = new Intl.NumberFormat('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});
  return v => f.format(v);
}
const svgWrap = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const tableHTML = (head, rows) => `<div class="tablewrap"><table><thead><tr>${head.map((h, i) => `<th${i === 0 ? ' style="text-align:left"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const tm = d => Date.parse(d);
const tdate = t => new Date(t).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'2-digit', timeZone:'UTC'});
function timeTicks(t0, t1, n){ const a = []; for (let i = 0; i <= n; i++) a.push(t0 + (t1 - t0) * i / n); return a; }

function lineSVG(w, data, label){
  const {dates, series} = data;
  const t0 = tm(dates[0]), t1 = tm(dates[dates.length - 1]);
  const vals = series.flatMap(s => s.vals.filter(x => x != null));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const sp = (hi - lo) || Math.abs(hi) * 0.1 || 1;
  let a = lo - sp * 0.08; const b = hi + sp * 0.08;
  if (lo >= 0) a = lo < 0.35 * hi ? 0 : Math.max(0, a);
  const yr = niceRange(a, b, 4);
  const L = 70, R = 16, T = 14, H = 240, B = 28, pw = Math.max(80, w - L - R), h = T + H + B;
  const x = t => L + (t - t0) / (t1 - t0) * pw, y = v => T + H - (v - yr.lo) / (yr.hi - yr.lo) * H, af = axisFmt(yr.step);
  let g = '';
  timeTicks(t0, t1, w < 420 ? 3 : 5).forEach((t, i, arr) => { g += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${T + H}"/><text class="tm" x="${x(t)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === arr.length - 1 ? 'end' : 'middle'}">${tdate(t)}</text>`; });
  yr.ticks.forEach(v => { g += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}"/><text class="tm" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${af(v)}</text>`; });
  g += `<line class="axis" x1="${L}" x2="${L + pw}" y1="${T + H}" y2="${T + H}"/>`;
  dates.forEach((d, i) => {
    const xa = i ? (x(tm(dates[i - 1])) + x(tm(d))) / 2 : L, xb = i < dates.length - 1 ? (x(tm(d)) + x(tm(dates[i + 1]))) / 2 : L + pw;
    const tip = fd(d) + '\n' + series.map(s => `${s.name}: ${s.vals[i] == null ? '–' : eur(s.vals[i])}`).join('\n');
    g += `<rect class="hit" x="${xa}" y="${T}" width="${Math.max(2, xb - xa)}" height="${H}" data-tip="${esc(tip)}"/>`;
  });

    let p = '', on = false;
    s.vals.forEach((v, i) => { if (v == null) return; p += (on ? 'L' : 'M') + x(tm(dates[i])).toFixed(1) + ',' + y(v).toFixed(1); on = true; });
    g += `<path d="${p}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round${s.dash ? ';stroke-dasharray:6 4' : ''}"/>`;

  });

}
function lineLegend(data){
  return `<div class="legend">${data.series.map(s => {
    let last = null; for (let i = s.vals.length - 1; i >= 0; i--) if (s.vals[i] != null) { last = s.vals[i]; break; }
    return `<span><i class="sw ${s.dash ? 'dash' : 'line'}" style="${s.dash ? 'border-color' : 'background'}:${s.color}"></i>${esc(s.name)} <b>${eur(last)}</b></span>`;
  }).join('')}</div>`;
}
function lineTable(data){
  const head = ['Datum'].concat(data.series.map(s => esc(s.name)));
  const rows = data.dates.map((d, i) => [fd(d)].concat(data.series.map(s => s.vals[i] == null ? '–' : eur(s.vals[i])))).reverse();
  return `<details><summary>Werte als Tabelle</summary>${tableHTML(head, rows)}</details>`;
}
function donutSVG(pd, centerLabel){
  const S = 220, c = S / 2, R = 104, r0 = 64, total = pd.total;
  const pt = (rad, a) => [c + rad * Math.sin(a), c - rad * Math.cos(a)];
  let a0 = 0, g = '';
  const seg = (a, b, it, tip) => {
    const [x1, y1] = pt(R, a), [x2, y2] = pt(R, b), [x3, y3] = pt(r0, b), [x4, y4] = pt(r0, a), large = b - a > Math.PI ? 1 : 0;

  };

    const frac = it.value / total, a1 = a0 + frac * 2 * Math.PI, tip = `${it.name}\n${eur(it.value)} (${pctP(frac)})`;
    if (frac > 0.9999) g += seg(0, Math.PI, it, tip) + seg(Math.PI, 2 * Math.PI - 1e-6, it, tip);

}

function modal({title, text = '', fields = [], ok = 'OK', cancel = 'Abbrechen', danger = false}){

    const root = $('#modal-root');

    root.innerHTML = `<div class="overlay"><form class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}

      ${cancel ? `<button class="btn" type="button" data-cancel>${esc(cancel)}</button>` : ''}</div></form></div>`;
    const form = root.querySelector('form');
    const close = v => { root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) {} resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(fields.length ? null : false); } };
    document.addEventListener('keydown', onKey, true);
    form.addEventListener('submit', e => {
      e.preventDefault();
      close(fields.length ? fields.map((f, i) => form.querySelector(`[data-f="${i}"]`).value) : true);
    });
    const c = form.querySelector('[data-cancel]'); if (c) c.addEventListener('click', () => close(fields.length ? null : false));

function hero(){

}
function viewEingabe(){
  const accs = sortAccs(activeAccounts());

  const date = ui.edate || todayISO();

    return `<div class="erow"><div class="en"><strong>${esc(a.name)}</strong>${a.liab ? ' <span class="pill">Verbindlichkeit</span>' : ''}<span class="sub">${esc(sub)}</span></div>

  }).join('');
  return `<div class="card"><h2>Kontostände erfassen</h2>
    <p class="hint" style="margin-top:0">Trage nur die Konten ein, deren Stand sich geändert hat. Leere Felder bleiben unverändert (der letzte Stand gilt weiter). Mit Enter springst du zum nächsten Feld.</p>

      <div class="erow head"><div>Konto</div><div>Letzter Stand</div><div>Neuer Stand in €</div><div>Änderung</div></div>
      ${rows}
      <p id="esum" class="esum" role="status"></p>

    </form></div>`;
}
function updateESum(){
  let before = 0, after = 0, filled = 0, bad = 0;
  activeAccounts().forEach(a => {
    const inp = document.querySelector(`.kinput[data-acc="${CSS.escape(a.id)}"]`), cell = document.querySelector(`[data-dacc="${CSS.escape(a.id)}"]`);
    const e = valueAt(a.id, LAST), last = e ? e.amount : 0;
    before += sgn(a) * last;
    let val = last;
    if (inp) {
      const raw = inp.value.trim(); let txt = '', cls = '';
      inp.setAttribute('aria-invalid', 'false');
      if (raw) {
        const n = parseNum(raw);
        if (!isFinite(n)) { bad++; inp.setAttribute('aria-invalid', 'true'); txt = 'keine Zahl'; cls = 'neg'; }
        else { filled++; val = n; const dlt = n - last; txt = e ? (Math.abs(dlt) < 0.005 ? 'gleich' : eurS(dlt)) : 'neu'; cls = signCls(sgn(a) * dlt); }
      }
      if (cell) { cell.textContent = txt; cell.className = 'ed ' + cls; }
    }
    after += sgn(a) * val;
  });
  const el = $('#esum'); if (!el) return;
  el.innerHTML = filled || bad ? `Gesamt bisher <strong>${eur(before)}</strong>, mit den neuen Werten <strong>${eur(after)}</strong> <span class="${signCls(after - before)}">(${eurS(after - before)})</span> · ${filled} ${filled === 1 ? 'Konto' : 'Konten'} ausgefüllt${bad ? `, <span class="neg">${bad} ungültig</span>` : ''}`
    : `Gesamt aktuell <strong>${eur(before)}</strong>`;
}
function saveEingabe(){
  const date = parseDate($('#edate').value);
  if (!date) { toast('Bitte ein gültiges Datum wählen.'); return; }
  if (date > todayISO()) { toast('Das Datum liegt in der Zukunft.'); return; }
  const items = [], bad = [];
  document.querySelectorAll('.kinput').forEach(i => {
    const raw = i.value.trim(); if (!raw) return;
    const n = parseNum(raw), a = accById(i.dataset.acc);
    if (!a) return;
    if (!isFinite(n)) bad.push(a.name); else items.push({a, v:round2(n)});
  });
  if (bad.length) { toast('Keine gültige Zahl bei: ' + bad.join(', '), 5000); const f = document.querySelector('.kinput[aria-invalid="true"]'); if (f) f.focus(); return; }
  if (!items.length) { toast('Es ist kein Kontostand eingetragen.'); return; }
  let neu = 0, ers = 0;
  items.forEach(({a, v}) => {
    const ex = state.entries.find(e => e.accId === a.id && e.date === date);
    if (ex) { if (ex.amount !== v) { ex.amount = v; ers++; } } else { state.entries.push({id:uid(), accId:a.id, date, amount:v, note:''}); neu++; }
  });
  state.entries.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  ui.edate = null; saveState(); render();
  toast(`${neu + ers} ${neu + ers === 1 ? 'Kontostand' : 'Kontostände'} für ${fd(date)} gespeichert` + (ers ? ` (${ers} ersetzt)` : ''), 4000);
}

const OCOLS = [

function overviewRows(){
  const accs = state.accounts.filter(a => ui.showArch || !a.archived);
  const act = accs.filter(a => !a.archived);
  const assets = act.reduce((p, a) => { const e = valueAt(a.id, LAST); return p + (e && !a.liab && e.amount > 0 ? e.amount : 0); }, 0);
  return accs.map(a => {
    const l = entriesBy().get(a.id) || [], e = l[l.length - 1] || null, pv = l.length > 1 ? l[l.length - 2] : null;
    const val = e ? sgn(a) * e.amount : NaN;
    return {a, e, val, date:e ? e.date : '', delta:e && pv ? sgn(a) * (e.amount - pv.amount) : NaN, dpct:e && pv && pv.amount ? (e.amount - pv.amount) / Math.abs(pv.amount) : NaN,
            share:e && !a.liab && e.amount > 0 && !a.archived && assets > 0 ? e.amount / assets : NaN};
  });
}
function sortOverview(rows){

  const get = r => ({name:r.a.name, type:r.a.type, owner:r.a.owner, tags:r.a.tags.join(', '), value:r.val, date:r.date, delta:r.delta, share:r.share})[k];
  return rows.slice().sort((x, y) => {
    const a = get(x), b = get(y);
    if (typeof a === 'number' || typeof b === 'number') { const na = isFinite(a), nb = isFinite(b); if (na !== nb) return na ? -1 : 1; return (a - b) * d || collator.compare(x.a.name, y.a.name); }
    return collator.compare(a || '', b || '') * d || collator.compare(x.a.name, y.a.name);
  });
}
function viewOverview(){
  const act = activeAccounts();

  const yearEnd = (Number(last.slice(0, 4)) - 1) + '-12-31';
  const kp = kpi('Gesamtvermögen', eur(now), 'Stand ' + fd(last))

    <td style="text-align:left">${esc(r.a.type)}</td><td style="text-align:left">${esc(r.a.owner)}</td><td style="text-align:left">${esc(r.a.tags.join(', '))}</td>
    <td>${isFinite(r.val) ? eur(r.val) : '–'}</td><td>${r.date ? fd(r.date) : '–'}</td>
    <td class="${signCls(r.delta)}">${isFinite(r.delta) ? eurS(r.delta) : '–'}${isFinite(r.dpct) ? `<small>${pctS(r.dpct)}</small>` : ''}</td><td>${isFinite(r.share) ? pctP(r.share) : '–'}</td></tr>`).join('');
  return `<div class="kpis">${kp}</div>
    <div class="card"><h2>Gesamtvermögen im Verlauf</h2><div id="c-prev" class="chart"></div></div>
    <div class="card"><div class="titlerow"><h2>Konten</h2><div class="checkrow" style="margin:0"><input type="checkbox" id="showArch"${ui.showArch ? ' checked' : ''}><label for="showArch" style="margin:0">Archivierte zeigen</label></div></div>

      <tfoot><tr><td>Summe</td><td></td><td></td><td></td><td>${eur(sum)}</td><td></td><td></td><td></td></tr></tfoot></table></div>
      <p class="hint">Änderung = letzter Stand gegenüber der vorherigen Erfassung dieses Kontos. Verbindlichkeiten zählen negativ. Anteil bezieht sich auf alle aktuellen Guthaben.</p></div>`;

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const hnorm = s => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]/g, '');

  betrag:'amount', stand:'amount', kontostand:'amount', saldo:'amount', wert:'amount', amount:'amount', summe:'amount',

async function readTextFile(file){

  });
  if (!good.length) { await modal({title:'Nichts importiert', text:bad.slice(0, 8).join('\n'), ok:'OK', cancel:''}); return; }
  const newNames = [...new Set(good.map(g => g.name).filter(n => !state.accounts.some(a => a.name.toLowerCase() === n.toLowerCase())).map(n => n))];
  const ok = await modal({title:'CSV importieren?', text:`${good.length} ${good.length === 1 ? 'Kontostand wird' : 'Kontostände werden'} übernommen (vorhandene Werte am selben Tag werden ersetzt).` + (newNames.length ? `\nNeu angelegt ${newNames.length === 1 ? 'wird das Konto' : 'werden die Konten'}: ${newNames.slice(0, 6).join(', ')}${newNames.length > 6 ? ' …' : ''}` : '')
    + (bad.length ? `\n${bad.length === 1 ? 'Eine Zeile ist fehlerhaft und wird' : bad.length + ' Zeilen sind fehlerhaft und werden'} übersprungen:\n` + bad.slice(0, 6).join('\n') + (bad.length > 6 ? '\n…' : '') : ''), ok:'Importieren'});
  if (!ok) return;
  good.forEach(g => {
    let a = state.accounts.find(x => x.name.toLowerCase() === g.name.toLowerCase());

    const ex = state.entries.find(e => e.accId === a.id && e.date === g.date);

  });
  state.entries.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : 0);
  saveState(); render(); toast(`${good.length} Kontostände importiert`, 3500);
}

    fest = A('Festgeld Sparkasse', 'Festgeld', 'Sparkasse', 'Heiko', ['Altersvorsorge']), dep = A('Depot Smartbroker', 'Depot', 'Smartbroker', 'Heiko', ['Altersvorsorge', 'Geldanlage']),
    bar = A('Bargeld', 'Bargeld', '', 'Heiko', ['Alltag']), fam = A('Girokonto Familie', 'Girokonto', 'Sparkasse', 'Partner', ['Alltag', 'Familie']), kk = A('Kreditkarte DKB', 'Kreditkarte', 'DKB', 'Heiko', [], true);
  const s = emptyState(); s.accounts = [giro, tag, fest, dep, bar, fam, kk];

  for (let w = 0; w <= weeks; w++) {

    g = Math.max(200, g + (rnd() - 0.5) * 500); put(giro, date, g);

    if (w === 0 || w === 20) { f = w ? 10350 : 10000; put(fest, date, f); }
    d = d * (1 + (rnd() - 0.45) * 0.03); put(dep, date, d);
    if (w % 3 === 0) { b = 40 + rnd() * 160; put(bar, date, b); }
    if (w % 2 === 1) { fm = Math.max(100, fm + (rnd() - 0.5) * 300); put(fam, date, fm); }

const TEX_COLORS = {'var(--s1)':'2a78d6','var(--s2)':'eb6834','var(--s3)':'1baf7a','var(--s4)':'eda100','var(--s5)':'e87ba4','var(--s6)':'008300','var(--s7)':'6250d6','var(--s8)':'e34948','var(--other)':'9a9992','var(--text2)':'55544f'};
function texEsc(s){
  return String(s == null ? '' : s).replace(/[\\{}&%$#_~^<>|"]/g, c => ({'\\':'\\textbackslash{}', '{':'\\{', '}':'\\}', '&':'\\&', '%':'\\%', '$':'\\$', '#':'\\#', '_':'\\_', '~':'\\textasciitilde{}', '^':'\\textasciicircum{}', '<':'\\textless{}', '>':'\\textgreater{}', '|':'\\textbar{}', '"':'\\textquotedbl{}'}[c]));
}
/* formatierte Zahl/Text aus der App (Intl-Ausgabe) für LaTeX: NBSP, Euro, Minus */
function texNum(s){
  return String(s).replace(/[\u00a0\u202f]/g, '~').replace(/€/g, '\\texteuro{}').replace(/[−–]/g, c => c === '−' ? '\\textminus{}' : '--').replace(/%/g, '\\%').replace(/-(?=\d)/g, '\\textminus{}');
}
const texEur = v => isFinite(v) ? texNum(eur(v)) : '--';
const texEurS = v => isFinite(v) ? texNum(eurS(v)) : '--';
const texPct = r => isFinite(r) ? texNum(pctP(r)) : '--';
const texPctS = r => isFinite(r) ? texNum(pctS(r)) : '--';
const texCol = c => 'kc' + Object.keys(TEX_COLORS).indexOf(c);
const f3 = x => (Math.round(x * 1000) / 1000).toString();

function texLine(data, w = 14.4, h = 6.2){
  const {dates, series} = data;
  const t0 = tm(dates[0]), t1 = tm(dates[dates.length - 1]);
  let lo = Infinity, hi = -Infinity;
  series.forEach(s => s.vals.forEach(x => { if (x != null) { lo = Math.min(lo, x); hi = Math.max(hi, x); } }));
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const R = niceRange(lo, hi, 4), fmt = axisFmt(R.step);
  const X = d => t1 > t0 ? (tm(d) - t0) / (t1 - t0) * w : w / 2;
  const Y = v => (v - R.lo) / (R.hi - R.lo) * h;
  let o = '\\begin{tikzpicture}[x=1cm,y=1cm,font=\\footnotesize]\n';
  R.ticks.forEach(v => {
    o += `\\draw[gray!30,line width=0.3pt] (0,${f3(Y(v))}) -- (${w},${f3(Y(v))});\n`;
    o += `\\node[anchor=east,gray!60!black] at (-0.12,${f3(Y(v))}) {${texNum(fmt(v))}};\n`;
  });
  if (R.lo < 0 && R.hi > 0) o += `\\draw[gray!60,line width=0.6pt] (0,${f3(Y(0))}) -- (${w},${f3(Y(0))});\n`;
  timeTicks(t0, t1, Math.min(4, dates.length - 1)).forEach((t, i, a) => {
    const x = (t - t0) / ((t1 - t0) || 1) * w;
    o += `\\draw[gray!60] (${f3(x)},0) -- (${f3(x)},-0.1);\n\\node[anchor=north,gray!60!black] at (${f3(x)},-0.1) {${tdate(t)}};\n`;
  });
  o += `\\draw[gray!60] (0,0) -- (${w},0) (0,0) -- (0,${h});\n`;
  series.forEach(s => {
    let seg = [];
    const flush = () => {
      if (seg.length > 1) o += `\\draw[${texCol(s.color)},line width=${s.dash ? '0.9' : '1.3'}pt,line join=round${s.dash ? ',dash pattern=on 4pt off 3pt' : ''}] ${seg.join(' -- ')};\n`;
      else if (seg.length === 1) o += `\\fill[${texCol(s.color)}] ${seg[0]} circle (1.6pt);\n`;
      seg = [];
    };
    s.vals.forEach((v, i) => { if (v == null) flush(); else seg.push(`(${f3(X(dates[i]))},${f3(Y(v))})`); });
    flush();
  });
  return o + '\\end{tikzpicture}\n';
}
function texLineLegend(series){
  return '\\begin{center}\\footnotesize\n' + series.map(s =>
    `\\tikz[baseline=-0.5ex]\\draw[${texCol(s.color)},line width=${s.dash ? '0.9' : '1.6'}pt${s.dash ? ',dash pattern=on 3pt off 2pt' : ''}] (0,0) -- (0.6,0);~${texEsc(s.name)}`).join('\\quad\n') + '\n\\end{center}\n';
}
function texPie(pd, centerLabel, R = 2.6){
  let o = '\\begin{tikzpicture}[font=\\small]\n', cum = 0;
  pd.items.forEach(it => {
    const fr = it.value / pd.total, a1 = 90 - cum * 360, a2 = 90 - (cum + fr) * 360;
    if (fr >= 0.9999) o += `\\fill[${texCol(it.color)}] (0,0) circle (${R});\n`;
    else o += `\\fill[${texCol(it.color)}] (0,0) -- (${f3(a1)}:${R}) arc (${f3(a1)}:${f3(a2)}:${R}) -- cycle;\n`;
    cum += fr;
  });
  if (pd.items.length > 1) { cum = 0; pd.items.forEach(it => { const a = 90 - cum * 360; o += `\\draw[white,line width=1pt] (0,0) -- (${f3(a)}:${R});\n`; cum += it.value / pd.total; }); }
  o += `\\fill[white] (0,0) circle (${f3(R * 0.58)});\n`;
  o += `\\node[align=center] at (0,0) {{\\scriptsize ${texEsc(centerLabel)}}\\\\[-1pt]\\textbf{${texEur(pd.total)}}};\n`;
  return o + '\\end{tikzpicture}\n';
}
function texTable(spec, head, rows, foot){
  let o = `\\begin{tabular}{${spec}}\n\\toprule\n${head.join(' & ')} \\\\\n\\midrule\n`;
  rows.forEach(r => { o += r.join(' & ') + ' \\\\\n'; });
  if (foot) o += '\\midrule\n' + foot.join(' & ') + ' \\\\\n';
  return o + '\\bottomrule\n\\end{tabular}\n';
}
function buildReportTex(opt){
  const hide = new Set(opt.hide || []), saved = state;
  state = Object.assign({}, state, {accounts:state.accounts.filter(a => !hide.has(a.id))}); cache.by = null;
  try { return buildReportTexInner(opt, hide.size); } finally { state = saved; cache.by = null; }
}
function buildReportTexInner(opt, nHidden){
  const title = (opt.title || 'Kontenbericht').trim(), today = todayISO();
  const act = activeAccounts();
  const dates = [...new Set(state.entries.filter(e => act.some(a => a.id === e.accId)).map(e => e.date))].sort();
  const last = dates.length ? dates[dates.length - 1] : today;
  const views = state.meta.views.filter(v => opt.views.includes(v.id));
  const used = new Set(['var(--other)', 'var(--text2)']);
  PALETTE.forEach(c => used.add(c));
  let o = `% Kurzbericht, erzeugt von Seifferts Konten ${VERSION} am ${fd(today)}
% Übersetzen mit: pdflatex bericht.tex (zweimal ist nicht nötig)
\\documentclass[11pt,a4paper]{article}
\\usepackage[utf8]{inputenc}
\\usepackage[T1]{fontenc}
\\usepackage{lmodern}
\\IfFileExists{ngerman.ldf}{\\usepackage[ngerman]{babel}}{}
\\usepackage[margin=2.2cm]{geometry}
\\usepackage{booktabs}
\\usepackage{xcolor}
\\usepackage{textcomp}
\\usepackage{tikz}
\\usepackage{needspace}
\\setlength{\\parindent}{0pt}
\\setlength{\\parskip}{0.6em}
`;
  Object.keys(TEX_COLORS).forEach(c => { o += `\\definecolor{${texCol(c)}}{HTML}{${TEX_COLORS[c].toUpperCase()}}\n`; });
  o += `\\title{${texEsc(title)}}
\\author{}
\\date{Stand: ${fd(last)}}
\\begin{document}
\\maketitle
\\vspace{-2em}
`;
  /* Kennzahlen */
  if (dates.length) {
    const now = totalAt(act, LAST).sum, base = d => { const t = totalAt(act, d); return t.n ? t.sum : NaN; };
    const prev = dates.length > 1 ? dates[dates.length - 2] : null, yearEnd = (Number(last.slice(0, 4)) - 1) + '-12-31';
    const rows = [];
    const add = (l, b) => rows.push([l, texEur(b), isFinite(b) ? texEurS(now - b) : '--', isFinite(b) && b ? texPctS((now - b) / Math.abs(b)) : '--']);
    if (prev) add('Vergleich mit ' + fd(prev), base(prev));
    add('Seit Jahresbeginn', base(yearEnd));
    add('Letzte 12 Monate', base(isoMinusMonths(last, 12)));
    let as = 0, ds = 0;
    act.forEach(a => { const e = valueAt(a.id, LAST); if (e) { if (a.liab) ds += e.amount; else as += e.amount; } });
    o += `\\section*{Kennzahlen}\n` + texTable('lr', ['Bilanz', 'Stand ' + fd(last)], [['Vermögenswerte', texEur(as)], ['Verbindlichkeiten', texEur(-ds)]], ['Nettovermögen', texEur(as - ds)]) + '\\medskip\n\n' + texTable('lrrr', ['', 'Vergleichsstand', 'Änderung', 'in \\%'], rows);
  } else o += '\\emph{Es sind noch keine Kontostände erfasst.}\n';
  /* Kontenliste */
  if (opt.accounts && act.length) {
    const rows = sortOverview(overviewRows()).filter(r => !r.a.archived);
    const sum = rows.reduce((p, r) => p + (isFinite(r.val) ? r.val : 0), 0);
    o += `\\section*{Konten}\n{\\small\n` + texTable('llllrr', ['Konto', 'Bank', 'Art', 'Besitzer', 'Stand', 'Datum'],
      rows.map(r => [texEsc(r.a.name) + (r.a.liab ? ' (Verb.)' : ''), texEsc(r.a.bank), texEsc(r.a.type), texEsc(r.a.owner), isFinite(r.val) ? texEur(r.val) : '--', r.date ? fd(r.date) : '--']),
      ['Summe', '', '', '', texEur(sum), '']) + '}\n';
  }
  /* Auswertungen */
  views.forEach(v => {
    o += `\\Needspace{${v.kind === 'line' ? 11 : 10}cm}\n\\section*{${texEsc(v.title)}}\n{\\footnotesize\\textcolor{gray}{${texEsc(viewSummary(v))}}}\n\n`;
    if (v.kind === 'line') {
      const d = lineData(v);
      if (d.empty) { o += `\\emph{${texEsc(d.empty)}}\n`; return; }
      o += `\\begin{center}\n${texLine(d)}\n${texLineLegend(d.series)}\\end{center}\n`;
      const rows = d.series.map(s => {
        const vs = s.vals, fi = vs.findIndex(x => x != null); let li = -1; vs.forEach((x, i) => { if (x != null) li = i; });
        const a = fi >= 0 ? vs[fi] : NaN, b = li >= 0 ? vs[li] : NaN;
        return [texEsc(s.name), texEur(a), texEur(b), texEurS(b - a), isFinite(a) && a ? texPctS((b - a) / Math.abs(a)) : '--'];
      });
      o += `{\\small\n${texTable('lrrrr', ['Reihe', 'Anfang (' + fd(d.dates[0]) + ')', 'Ende (' + fd(d.dates[d.dates.length - 1]) + ')', 'Änderung', 'in \\%'], rows)}}\n`;
    } else {
      const pd = pieData(v);
      if (!(pd.total > 0)) { o += '\\emph{Keine Guthaben zum Darstellen.}\n'; return; }
      o += `\\begin{center}\n${texPie(pd, v.at ? 'Stand ' + fd(v.at) : 'Summe')}\\end{center}\n`;
      o += `{\\small\\begin{center}\n\\begin{tabular}{llrr}\n\\toprule\n & ${texEsc(GROUPS[v.group])} & Betrag & Anteil \\\\\n\\midrule\n`
        + pd.items.map(it => `\\tikz[baseline=-0.6ex]\\fill[${texCol(it.color)}] (0,-0.1) rectangle (0.3,0.2); & ${texEsc(it.name)} & ${texEur(it.value)} & ${texPct(it.value / pd.total)} \\\\\n`).join('')
        + `\\midrule\n & Summe & ${texEur(pd.total)} & 100,0~\\% \\\\\n\\bottomrule\n\\end{tabular}\n\\end{center}}\n`;
      if (pd.liab || pd.neg) { const parts = []; if (pd.liab) parts.push(pd.liab + (pd.liab === 1 ? ' Verbindlichkeit' : ' Verbindlichkeiten')); if (pd.neg) parts.push(pd.neg + (pd.neg === 1 ? ' Konto' : ' Konten') + ' ohne Guthaben'); o += `{\\footnotesize\\textcolor{gray}{Nicht dargestellt: ${parts.join(', ')}.}}\n`; }
      if (pd.multi) o += '{\\footnotesize\\textcolor{gray}{Konten mit mehreren Gruppen z\u00e4hlen in jeder ihrer Gruppen mit.}}\n';
    }
  });
  if (nHidden) o += `\n\\bigskip{\\footnotesize\\textcolor{gray}{${nHidden} ${nHidden === 1 ? 'Konto wurde' : 'Konten wurden'} auf Wunsch aus diesem Bericht ausgeblendet; alle Summen und Grafiken enthalten sie nicht.}}\n`;
  return o + '\n\\end{document}\n';
}
function exportReportTex(){

  const tex = buildReportTex({title:($('#rep-title') || {}).value, views:sel, accounts:!!($('#rep-acc') || {}).checked, hide:[...document.querySelectorAll('[data-ra]')].filter(x => !x.checked).map(x => x.dataset.ra)});

}

/* ---------- Token (Google Identity Services) ---------- */
const gisOK = () => !!(window.google && google.accounts && google.accounts.oauth2);
function initTC(){
  if (dd.tc) return true; if (!gisOK()) return false;
  dd.tc = google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:D_SCOPE,
    callback:r => { const t = dd.pending; dd.pending = null; if (!t) return;
      if (r && r.access_token) { dd.token = r.access_token; dd.exp = Date.now() + (+r.expires_in || 3600) * 1000; t.res(r); }
      else t.rej(new Error('Anmeldung fehlgeschlagen' + (r && r.error ? ' (' + r.error + ')' : ''))); },
    error_callback:e => { const t = dd.pending; dd.pending = null; if (t) t.rej(new Error('Anmeldung nicht möglich (' + ((e && e.type) || 'Fehler') + ')')); }
  });
  return true;
}
function requestToken(interactive){
  return new Promise((res, rej) => {
    if (!initTC()) return rej(Object.assign(new Error('Google-Anmeldung nicht geladen (offline?)'), {code:'nogis'}));
    const to = setTimeout(() => { if (dd.pending) { dd.pending = null; rej(Object.assign(new Error('Zeitüberschreitung bei der Anmeldung'), {code:'timeout'})); } }, interactive ? 120000 : 15000);
    dd.pending = {res:v => { clearTimeout(to); res(v); }, rej:e => { clearTimeout(to); rej(e); }};
    try { dd.tc.requestAccessToken({prompt:''}); } catch (e) { clearTimeout(to); dd.pending = null; rej(e); }
  });
}
const tokenValid = () => !!(dd.token && Date.now() < dd.exp - 60000);
async function ensureToken(interactive){ if (!tokenValid()) await requestToken(interactive); }
/* Fuer Knoepfe: das Anmelde-Fenster muss direkt aus dem Klick heraus geoeffnet werden. */
async function gestureToken(){ if (!tokenValid()) await requestToken(true); }

async function dapi(url, opts = {}, interactive = false, retried = false){
  await ensureToken(interactive);
  const h = Object.assign({Authorization:'Bearer ' + dd.token}, opts.headers || {});
  const r = await fetch(url, Object.assign({}, opts, {headers:h}));
  if (r.status === 401 && !retried) { dd.token = null; return dapi(url, opts, interactive, true); }
  if (!r.ok) {
    let m = ''; try { const j = await r.json(); m = (j.error && (j.error.message || j.error)) || ''; } catch (e) {}
    const err = new Error('Drive ' + r.status + (m ? ': ' + String(m).slice(0, 160) : '')); err.status = r.status; throw err;
  }
  return r;
}
const qs = o => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
async function dlist(q, fields = 'files(id,name,version,modifiedTime,size)', extra = {}){

}

async function ensureFolder(name, parent, knownId, create = true){
  if (knownId) { try { const f = await dmeta(knownId); if (f && !f.trashed) return knownId; } catch (e) { if (e.status !== 404) throw e; } }
  const l = await dlist(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parent ? ` and '${parent}' in parents` : ''), 'files(id,name)');
  if (l.length) return l[0].id;
  if (!create) return '';
  const body = {name, mimeType:'application/vnd.google-apps.folder'}; if (parent) body.parents = [parent];
  const r = await dapi(D_API + 'files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return (await r.json()).id;
}
