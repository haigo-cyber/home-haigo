<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Seifferts Depot</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!--
  Seifferts Depot - Aktiendepot-Tracker, eine einzelne HTML-Datei ohne Build, ohne Server, ohne Netzwerkzugriff.
  Daten liegen ausschliesslich im localStorage dieses Browsers (Sicherung ueber den Reiter Daten).
  v1.0  Erste Fassung: Kaeufe/Verkaeufe, manuelle Tageskurse, Uebersicht, Diagramme, JSON/CSV
  v1.1  Google-Drive-Anbindung (drive.file): Datei im Ordner Seifferts Depot, taegliche Sicherungskopien, Konfliktabfrage,
        Notkopie des zuletzt ersetzten lokalen Standes
  v1.2  Kurse per CSV einlesen (Liste oder Tabelle), Zeichensatz-Erkennung, tolerantere Zahlenerkennung
  v1.3  Berechnungsmethoden: gleitender Durchschnitt, FIFO, LIFO, Netto-Einstand (Kaufsummen minus Verkaufserloese), Methodenvergleich
  v1.6  Chart-Link je Position (manuell hinterlegt), Link in Uebersicht, Kurse, Positionen und Verlaufsdiagramm
  v1.7  Kerzen-Charts (Eroeffnung, Hoch, Tief), Wochen-/Monatskerzen, CSV-Spalten Open/High/Low
  v1.8  Rendite-Kennzahlen TTWROR und IRR (gesamt und je Position, waehlbarer Zeitraum), TTWROR-Chart
  v1.9  Mehrere Depots (Auswahl oben, Musterdepots, Kopieren), Sicherung und Drive umfassen alle Depots
  v1.5  Vorschaudiagramm auf der Uebersicht: Depotwert, Netto-Rendite und vorhandene Kursdaten
  v1.4  Reiter Konto: Einzahlungen, Auszahlungen, Ertraege; Kaeufe und Verkaeufe buchen automatisch gegen das Konto; Gesamtvermoegen und Gesamtergebnis
  v1.12.0 Eigene Diagramme: Kennzahlen im Zeitverlauf frei kombinierbar (Stueckzahl, Kurs, Wert, Einstand, Ergebnis, Depotwert ...), zwei Achsen, Prozentvergleich; Reiter Diagramme ohne Einstellungsleisten, diese stehen im Reiter Einstellungen
  v1.11.1 Verlaufsdiagramme im Seitenverhaeltnis von TradingView (Breitbild), Hoehe einstellbar
  v1.11.0 Daten einfuegen: Excel (.xlsx) und LibreOffice (.ods) lesen, kopierte Zellen einfuegen, Datei auf das Fenster ziehen; Kurse oder Transaktionen werden an den Ueberschriften erkannt
  v1.10.2 Pruefung und Feinschliff: Werteachse je Diagramm, schnelleres Verschieben und Zoomen (Zwischenspeicher), Verschieben per Finger, Tastaturfokus bleibt nach Aenderungen
  v1.10.1 Verlauf einer Position steht oben, Start- und Enddatum fuer den Chart-Ausschnitt tagesgenau
  v1.10.0 Charts im Stil von TradingView (Kerzen, hohle Kerzen, Heikin-Ashi, Balken, Linien; Kerzenstil flach, 3D, metallisch; Farben, Intervall, Zeitrahmen, Werteachse mit Minimum, Maximum, Intervall, Prozent, log; Fadenkreuz, Indikatoren), Reiter Einstellungen mit Reihenfolge und Sichtbarkeit von Reitern, Uebersichtsbloecken und Diagrammen
  v1.9.1 Linux-Anbindung: Block linuxHandOff am Ende (Anmeldung fuer die Linux-App, nur aktiv mit ?linuxport=...), Logo Seiffert Apps in der Kopfzeile
-->
<style>
:root{
  color-scheme: light dark;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface2:#f0efec; --line:#d9d7d0; --grid:#e8e7e2;
  --text:#0b0b0b; --text2:#52514e; --muted:#76756e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --other:#9a9992; --pos:#1c5cab; --neg:#c0302f; --accent:#2a78d6; --warnbg:#fdf3dc; --warnline:#e3b24a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --surface:#1a1a19; --surface2:#252523; --line:#3a3a37; --grid:#2b2b29;
    --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#6f6e68; --pos:#6da7ec; --neg:#ef8584; --accent:#3987e5; --warnbg:#33290f; --warnline:#8a6a1c;
  }
}
a{color:var(--accent)}
.chartlink,.linkadd{font-size:.85rem;white-space:nowrap}
.cards-m{display:none}
.sortm{display:none}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard.err{background:var(--warnbg);border-color:var(--warnline)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph strong{font-size:1rem}
.pg{text-align:right;font-weight:650;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pg small{display:block;font-weight:500;font-size:.82rem}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px;margin:10px 0 0}
.pgrid div{min-width:0}
.pgrid dt{font-size:.74rem;color:var(--muted)}
.pgrid dd{margin:0;font-size:.92rem;font-variant-numeric:tabular-nums}
.pgrid dd small{color:var(--muted);font-size:.74rem}
@media(max-width:640px){
  .tbl-d{display:none}
  .cards-m{display:block}
  .sortm{display:block}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{margin:0;padding:10px 0 4px;font-size:1.15rem;font-weight:650}
.ver{font-size:.75rem;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:40px;padding:6px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text2);font:inherit;font-size:.95rem;cursor:pointer}
@media(max-width:480px){nav button{padding:6px 8px;font-size:.9rem}}
nav button[aria-selected="true"]{background:var(--surface2);border-color:var(--line);color:var(--text);font-weight:600}
main{padding-top:14px;padding-bottom:60px}
h2{font-size:1.05rem;margin:0 0 8px}
h3{font-size:.95rem;margin:14px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0}
.msg{color:var(--neg);font-size:.92rem;min-height:1.2em;margin:6px 0}
.note{background:var(--warnbg);border:1px solid var(--warnline);border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.3rem;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.85rem;color:var(--text2);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;z-index:1}
.sticky1 td:first-child{background:var(--surface)}
thead th{background:var(--surface2);font-weight:600;font-size:.82rem;color:var(--text2)}
th button{all:unset;cursor:pointer;display:inline-block;padding:2px 0}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tfoot td,.sticky1 tfoot td:first-child{font-weight:650;background:var(--surface2);border-bottom:none}
td small,.sub{display:block;color:var(--muted);font-size:.78rem}
tr.err td{background:var(--warnbg)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:10px}
input,select,textarea{display:block;width:100%;min-height:44px;margin-top:3px;padding:8px 10px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;-moz-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{-moz-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{display:inline-block;width:20px;min-height:20px;margin:0 8px 0 0;vertical-align:middle;-moz-appearance:auto;appearance:auto}
.checkrow{display:flex;align-items:center;font-size:.92rem;color:var(--text2);margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 label:first-child{grid-column:1/3}}
button.btn,button.primary,a.btn{display:inline-block;min-height:44px;padding:8px 16px;font:inherit;font-size:.95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;text-decoration:none;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--neg)}
button.small{min-height:34px;padding:4px 10px;font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
details{margin:8px 0}
summary{cursor:pointer;color:var(--text2);padding:6px 0;min-height:32px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--text2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.dot{border-radius:50%}
.sw.dia{transform:rotate(45deg);width:10px;height:10px;border-radius:1px}
.sw.line{height:3px;width:18px;border-radius:2px}
.sw.dash{height:0;width:18px;border-top:3px dashed}
.chart{width:100%;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart.tvdark{background:#0f0f0f;border-radius:10px;--grid:#1c1c1c;--line:#2a2e39;--text:#d1d4dc;--text2:#b2b5be;--muted:#787b86;--surface:#0f0f0f}
.chart.tvlight{background:#fff;border-radius:10px;--grid:#f0f3fa;--line:#e0e3eb;--text:#131722;--text2:#434651;--muted:#787b86;--surface:#fff}
.tvlg{font-size:.78rem;color:var(--text2);padding:3px 8px 2px;min-height:1.5em;font-variant-numeric:tabular-nums;line-height:1.4}
.tvlg b{color:var(--text)}
.chtool{margin-bottom:12px}
.card .chtool{margin:0 0 8px}
.chrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.chdates{display:flex;flex-wrap:wrap;gap:0 12px;align-items:end;margin-top:8px}
.chdates label{flex:1 1 170px;max-width:240px}
.chdates .btn{margin-bottom:10px}
.chrow2{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.rng{display:inline-flex;flex-wrap:wrap;gap:4px}
.rbtn{padding:5px 11px;min-height:34px;border:1px solid var(--line);background:var(--surface);color:var(--text2);border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer}
.rbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chset{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.chk{display:flex;align-items:center;gap:0;font-size:.92rem;color:var(--text);margin-bottom:8px}
body.dropping::after{content:'Datei hier ablegen: CSV, Excel (.xlsx) oder LibreOffice (.ods)';position:fixed;inset:10px;z-index:90;display:flex;align-items:center;justify-content:center;border:3px dashed var(--accent);border-radius:16px;background:var(--surface);color:var(--text);font-size:1.2rem;font-weight:600;pointer-events:none}
.chk input{flex:none}
.vsrow{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:4px 10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.vsrow legend{font-size:.85rem;color:var(--text2);padding:0 4px}
.maRow{display:grid;grid-template-columns:minmax(170px,1.2fr) 1fr 90px;gap:8px;align-items:center;margin-bottom:6px}
.maRow select,.maRow input{margin-top:0}
.maRow .chk{margin:0}
input[type=color]{padding:2px;height:44px;cursor:pointer}
.laylist{list-style:none;margin:0 0 6px;padding:0}
.laylist li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--grid)}
.btn.sm{min-height:34px;padding:2px 10px}
@media (max-width:560px){.maRow{grid-template-columns:1fr 1fr}.maRow .chk{grid-column:1/-1}}
.chart svg{display:block;max-width:100%;height:auto}
svg .t{fill:var(--text2);font-size:12px}
svg .tm{fill:var(--muted);font-size:11px}
svg .tv{fill:var(--text);font-size:11px;font-variant-numeric:tabular-nums}
svg .tb{fill:var(--text);font-size:12px;font-weight:600}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--line);stroke-width:1}
svg .hit{fill:transparent}
svg .hit:hover{fill:rgba(128,128,128,.14)}
svg [data-tip]{cursor:default}
.donutrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.donutrow ul{list-style:none;padding:0;margin:0;flex:1 1 220px;font-size:.92rem}
.donutrow li{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--grid)}
.donutrow li span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donutrow li span.p{font-variant-numeric:tabular-nums;color:var(--text2)}
#tip{position:fixed;display:none;z-index:50;max-width:260px;padding:7px 10px;background:var(--text);color:var(--bg);border-radius:8px;font-size:.82rem;line-height:1.35;white-space:pre-line;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;display:none;max-width:92vw}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:420px}
.dlg h2{margin-top:0}
.dlg p{white-space:pre-line}
.hero{text-align:center;padding:30px 14px}
.hero p{max-width:520px;margin:8px auto}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:6px 0}
.pill{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--text2);margin-left:4px}
.pill.warn{border-color:var(--warnline);background:var(--warnbg)}
.histlist{max-height:220px;overflow:auto;border:1px solid var(--grid);border-radius:8px}
.histlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:.9rem}
.kursrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.kursrow input{margin-top:0}

.depotrow{display:flex;align-items:center;gap:8px;margin:0 0 8px}.depotrow label{margin:0;font-size:.85rem;color:var(--text2);flex:none}.depotrow select{flex:1;min-width:0;padding-top:6px;padding-bottom:6px;font-weight:600}
.titlerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpill{flex:0 1 auto;min-height:32px;margin-top:6px;padding:3px 12px;font:inherit;font-size:.8rem;color:var(--text2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpill[data-st="ok"]{border-color:var(--s3)}
.dpill[data-st="pending"],.dpill[data-st="busy"]{border-color:var(--s4)}
.dpill[data-st="auth"],.dpill[data-st="conflict"],.dpill[data-st="error"],.dpill[data-st="unavail"]{border-color:var(--warnline);background:var(--warnbg);color:var(--text);font-weight:600}
.btns.col{flex-direction:column}
.btns.col button{text-align:left}
</style>
</head>

function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(/€/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');

const CH_VS = [['detail', 'Verlauf einer Position'], ['depot', 'Depotwert (auch Vorschau)'], ['konto', 'Gesamtvermögen']];
const CH_DEFAULT = {type:'line', interval:'day', style:'flat', range:'all', from:null, to:null, axis:'time', height:'tv', bg:'theme', grid:'both', mode:'abs', log:false,
  up:TV.up, down:TV.down, vs:{}, cross:true, last:true, hl:true, legend:true,
  ma1:{on:false, k:'sma', n:20}, ma2:{on:false, k:'ema', n:50}, bb:false};
function cleanChart(o){
  if (!o || typeof o !== 'object') return null;
  const has = Object.prototype.hasOwnProperty, pick = (v, map, d) => has.call(map, v) ? v : d;
  const col = (v, d) => /^#[0-9a-fA-F]{6}$/.test(String(v)) ? String(v).toLowerCase() : d;
  const nn = v => { const n = typeof v === 'number' ? v : parseNum(v); return isFinite(n) ? n : null; };
  const ma = (m, k, n) => { m = m && typeof m === 'object' ? m : {}; const x = Math.round(Number(m.n)); return {on:!!m.on, k:m.k === 'ema' ? 'ema' : m.k === 'sma' ? 'sma' : k, n:x >= 2 && x <= 400 ? x : n}; };
  const vsOf = x => { x = x && typeof x === 'object' ? x : {}; const stp = nn(x.step); return {min:nn(x.min), max:nn(x.max), step:stp > 0 ? stp : null}; };
  const vsIn = o.vs && typeof o.vs === 'object' ? o.vs : {}, vs = {};
  CH_VS.forEach(g => { vs[g[0]] = vsOf(has.call(vsIn, g[0]) ? vsIn[g[0]] : g[0] === 'depot' ? {min:o.vmin, max:o.vmax, step:o.vstep} : null); });
  const dt = v => { v = String(v || ''); return /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v)) ? v : null; };
  let dfrom = dt(o.from), dto = dt(o.to); if (dfrom && dto && dfrom > dto) { dfrom = null; dto = null; }

    range:pick(o.range, CH_RANGE, 'all'), from:dfrom, to:dto, axis:pick(o.axis, CH_AXIS, 'time'), height:pick(o.height, CH_HEIGHT, 'tv'), bg:pick(o.bg, CH_BG, 'theme'), grid:pick(o.grid, CH_GRID, 'both'),
    mode:o.mode === 'pct' ? 'pct' : 'abs', log:!!o.log, up:col(o.up, TV.up), down:col(o.down, TV.down), vs,
    cross:o.cross !== false, last:o.last !== false, hl:o.hl !== false, legend:o.legend !== false, ma1:ma(o.ma1, 'sma', 20), ma2:ma(o.ma2, 'ema', 50), bb:!!o.bb};
}
/* ---------- Aufbau: Reihenfolge und Sichtbarkeit (meta.layout) ---------- */
const LAY_OV = [['vorschau', 'Vorschau-Diagramm'], ['methode', 'Berechnungsmethode'], ['kennzahlen', 'Kennzahlen'], ['rendite', 'Rendite'], ['positionen', 'Positionen (Tabelle)'], ['vergleich', 'Vergleich der Methoden']];
const LAY_CH = [['detail', 'Verlauf einer Position'], ['qty', 'Stückzahlen je Position'], ['dots', 'Einstiegspreise der Käufe'], ['val', 'Eingesetztes Kapital und aktueller Wert'], ['donut', 'Gewichtung'], ['depot', 'Depotwert im Zeitverlauf'], ['ttwror', 'Wertentwicklung (TTWROR)'], ['konto', 'Gesamtvermögen im Zeitverlauf (nur mit Konto)']];
const TAB_NAMES = {uebersicht:'Übersicht', diagramme:'Diagramme', kurse:'Kurse', kaeufe:'Käufe', konto:'Konto', daten:'Daten', einstellungen:'Einstellungen'};
function cleanOrder(arr, known){
  const out = [];
  (Array.isArray(arr) ? arr : []).forEach(id => { if (known.includes(id) && !out.includes(id)) out.push(id); });
  known.forEach(id => { if (!out.includes(id)) out.push(id); });

}
function cleanHide(arr, known){ const out = []; (Array.isArray(arr) ? arr : []).forEach(id => { if (known.includes(id) && !out.includes(id)) out.push(id); }); return out; }
/* ---------- Eigene Diagramme (meta.custom): frei kombinierbare Kennzahlen im Zeitverlauf ---------- */

  gvp:{n:'Gewinn/Verlust in Prozent (offener Bestand)', k:'G/V %', u:'p', pos:1, t:'line'},
  dvalue:{n:'Depotwert gesamt', k:'Depotwert', u:'e', t:'line'},

const CU_TYPES = {line:'Linie', step:'Treppe', area:'Fläche', dots:'Linie mit Punkten'};
const CU_DEFAULT = [{id:'stueck', title:'Stückzahlen im Zeitverlauf', pct:false, series:[{m:'qty', p:'all', t:'step', ax:'r', col:''}]}];
function cleanCustom(arr){
  if (!Array.isArray(arr)) return null;
  const out = [], ids = new Set(), has = Object.prototype.hasOwnProperty;
  arr.slice(0, 20).forEach(c => {
    if (!c || typeof c !== 'object') return;

function cleanLayout(o, custom){

    value:openRows.reduce((a, r) => a + r.value, 0),

}

/* ======================================================================
   Rendite: TTWROR (zeitgewichtet) und IRR (interner Zinsfuss)
   ====================================================================== */
const PERF_PERIODS = {all:'Gesamter Zeitraum', ytd:'Laufendes Jahr', '1y':'Letzte 12 Monate', '6m':'Letzte 6 Monate', '3m':'Letzte 3 Monate', '1m':'Letzter Monat'};
const curPerf = () => PERF_PERIODS[state.meta.perfPeriod] ? state.meta.perfPeriod : 'all';
const isoAdd = (d, n) => new Date(Date.parse(d) + n * 864e5).toISOString().slice(0, 10);
function isoMinusMonths(d, m){
  const t = new Date(Date.parse(d)), day = t.getUTCDate();
  t.setUTCDate(1); t.setUTCMonth(t.getUTCMonth() - m);
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last)); return t.toISOString().slice(0, 10);
}
function perfRange(period){
  const set = new Set();
  state.txs.forEach(t => set.add(t.date)); state.cash.forEach(c => set.add(c.date));
  Object.values(state.prices).forEach(a => a.forEach(e => set.add(e.date)));
  if (!set.size) return null;
  const dates = [...set].sort(), e = dates[dates.length - 1], s0 = isoAdd(dates[0], -1);
  let s = s0;
  if (period === 'ytd') s = (+e.slice(0, 4) - 1) + '-12-31';
  else if (period === '1y') s = isoMinusMonths(e, 12);
  else if (period === '6m') s = isoMinusMonths(e, 6);
  else if (period === '3m') s = isoMinusMonths(e, 3);
  else if (period === '1m') s = isoMinusMonths(e, 1);
  const clamped = s < s0; if (clamped) s = s0;
  return {s, e, s0, dates, clamped};
}
/* Wert des Portfolios (Depot, mit Konto zusätzlich der Kontostand) oder einer einzelnen Position an einem Tag. */
function perfValue(d, cashy, posId){
  let v = 0;
  state.positions.forEach(p => {
    if (posId && p.id !== posId) return;
    const st = calcPosition(p.id, d);
    if (st.qty > 1e-9) { const pr = priceAtDate(p.id, d); if (pr != null) v += st.qty * pr; }
  });
  return posId || !cashy ? v : v + cashInfo(d).bal;
}
/* Zahlungen ins Portfolio: positiv = Einzahlung/Kauf, negativ = Auszahlung/Verkauf. */
function perfFlows(cashy, posId){
  if (cashy && !posId) return state.cash.filter(c => c.type === 'in' || c.type === 'out').map(c => ({d:c.date, a:c.type === 'in' ? c.amount : -c.amount}));
  return state.txs.filter(t => !posId || t.posId === posId).map(t => ({d:t.date, a:t.type === 'buy' ? t.qty * t.price + t.fee : -(t.qty * t.price - t.fee)}));
}
/* XIRR: Jahreszins, bei dem der Barwert aller Zahlungen null ist (365-Tage-Jahr). cfs: [{t:Tage, a:Betrag aus Sicht des Anlegers}] */
function xirr(cfs){
  if (!cfs.some(c => c.a > 1e-9) || !cfs.some(c => c.a < -1e-9)) return null;
  const f = x => cfs.reduce((a, c) => a + c.a * Math.exp(-x * c.t / 365), 0);
  let lo = -12, hi = 12, flo = f(lo);
  if (!(flo * f(hi) < 0)) return null;
  for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2, fm = f(mid); if (flo * fm <= 0) hi = mid; else { lo = mid; flo = fm; } }
  return Math.exp((lo + hi) / 2) - 1;
}
/* Kennzahlen fuer einen Zeitraum (s, e]. Verkettung der Teilrenditen an allen Datumsstellen:
   r = (Wert am Ende - Zahlungen des Tages) / Wert am Vortag. Zahlungen gelten am Ende des Tages zum Tageskurs.
   War der Wert am Vortag null (erste Zahlung), gilt r = Wert / Zahlung. */
function perfCalc(R, valueAt, flows){
  const {s, e, dates} = R, byD = {}, inR = flows.filter(f => f.d > s && f.d <= e);
  inR.forEach(f => { byD[f.d] = (byD[f.d] || 0) + f.a; });
  const v0 = valueAt(s); let prev = v0, cum = 1, started = v0 > 1e-9; const series = [{d:s, r:0}];
  dates.filter(d => d > s && d <= e).forEach(d => {
    const V = valueAt(d), F = byD[d] || 0;
    if (prev > 1e-9) { cum *= Math.max(0, (V - F) / prev); started = true; }
    else if (F > 1e-9) { cum *= Math.max(0, V / F); started = true; } /* erste Zahlung bei Wert null: Wert gegen eingezahlten Betrag, damit Gebühren sichtbar werden */
    prev = V; series.push({d, r:cum - 1});
  });
  const vE = valueAt(e), net = inR.reduce((a, f) => a + f.a, 0);
  const firstFlow = inR.length ? inR.map(f => f.d).sort()[0] : null, startD = v0 > 1e-9 ? s : firstFlow;
  const days = startD ? daysBetween(startD, e) : 0;
  const cfs = []; if (v0 > 1e-9) cfs.push({t:0, a:-v0});
  inR.forEach(f => cfs.push({t:daysBetween(s, f.d), a:-f.a}));
  if (vE > 1e-9) cfs.push({t:daysBetween(s, e), a:vE});
  const ok = started && series.length > 1 && days > 0;
  const cumR = ok ? cum - 1 : null;
  return {ok, cum:cumR, days, startD, pa:ok && days >= 30 && cum > 0 ? Math.pow(cum, 365 / days) - 1 : null,
    irr:ok && days >= 30 ? xirr(cfs) : null, gain:vE - v0 - net, v0, vE, net, series};
}
function perfAll(){
  if (cache.perf) return cache.perf;
  const R = perfRange(curPerf()); if (!R) return null;
  const cashy = cashOn();
  const total = perfCalc(R, d => perfValue(d, cashy), perfFlows(cashy));
  const per = state.positions.map(p => ({pos:p, res:perfCalc(R, d => perfValue(d, false, p.id), perfFlows(false, p.id))})).filter(x => x.res.ok);
  return (cache.perf = {R, cashy, total, per});
}
function setPerfPeriod(v){ if (!PERF_PERIODS[v]) return; state.meta.perfPeriod = v; saveState(); const y = window.scrollY; render(); window.scrollTo(0, y); }
const perfSelHTML = () => `<label style="margin:0">Zeitraum<select id="perfSel">${Object.keys(PERF_PERIODS).map(k => `<option value="${k}"${k === curPerf() ? ' selected' : ''}>${PERF_PERIODS[k]}</option>`).join('')}</select></label>`;
const irrTxt = v => v == null ? '–' : v > 10 ? 'über 1.000 %' : pctS(v);
function perfCard(){
  const P = perfAll(), T = P && P.total;
  let h = `<section class="card" id="perfcard"><h2>Rendite</h2>${perfSelHTML()}`;
  if (!T || !T.ok) return h + `<p class="hint">Für die Renditekennzahlen braucht das Tool mindestens eine Transaktion (oder Einzahlung) und Kurse oder Transaktionen von mindestens zwei verschiedenen Tagen${P && P.R.clamped ? '' : ' im gewählten Zeitraum'}.</p></section>`;
  const pa = T.pa != null ? pctS(T.pa) : '–', paSub = T.days < 30 ? 'Zeitraum unter 30 Tage' : T.days < 365 ? 'auf ein Jahr hochgerechnet' : 'je Jahr';
  h += `<p class="hint" style="margin:6px 0 10px">${fd(T.startD)} bis ${fd(P.R.e)} (${T.days} Tage)${P.R.clamped ? ', Daten beginnen später' : ''}</p>
    <div class="kpis"><div class="kpi"><div class="l">TTWROR</div><div class="v ${signCls(T.cum)}">${pctS(T.cum)}</div><div class="s">zeitgewichtet, gesamter Zeitraum</div></div>
    <div class="kpi"><div class="l">TTWROR p. a.</div><div class="v ${signCls(T.pa)}">${pa}</div><div class="s">${paSub}</div></div>
    <div class="kpi"><div class="l">IRR p. a.</div><div class="v ${signCls(T.irr)}">${irrTxt(T.irr)}</div><div class="s">${T.days < 30 ? 'Zeitraum unter 30 Tage' : 'berücksichtigt Zahlungszeitpunkte'}</div></div>
    <div class="kpi"><div class="l">Ergebnis im Zeitraum</div><div class="v ${signCls(T.gain)}">${eurS(T.gain)}</div><div class="s">nach Gebühren, ohne Steuern</div></div></div>`;
  if (P.per.length) h += `<details><summary>Rendite je Position</summary>` +

    `<p class="hint">Je Position nur Käufe, Verkäufe und Kurse. Erträge (Dividenden, Zinsen) aus dem Konto lassen sich keiner Position zuordnen und fehlen hier, sind im Gesamtwert oben aber enthalten (bei erfasstem Konto). IRR wird erst ab 30 Tagen berechnet.</p></details>`;
  h += `<details><summary>Was bedeuten TTWROR und IRR?</summary>
    <p class="hint" style="margin-top:0">TTWROR (zeitgewichtete Rendite) zeigt, wie sich das angelegte Geld entwickelt hat, unabhängig davon, wann und wie viel du ein- oder ausgezahlt hast. Der Zeitraum wird dazu an jeder Zahlung geteilt und die Teilrenditen werden miteinander verkettet. Das eignet sich zum Vergleich mit einem Index oder einem Fonds.</p>

  return h;
}
function ttwrorChart(w, series){
  if (!series || series.length < 2) return null;
  const t0 = tm(series[0].d), t1 = tm(series[series.length - 1].d), vals = series.map(p => p.r * 100);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals), sp = (hi - lo) || 1;
  const yr = niceRange(lo < 0 ? lo - sp * 0.08 : 0, hi + sp * 0.08, 4);
  const L = 56, R = 16, T = 16, H = 210, B = 28, pw = Math.max(80, w - L - R), h = T + H + B;
  const x = t => L + (t - t0) / (t1 - t0) * pw, y = v => T + H - (v - yr.lo) / (yr.hi - yr.lo) * H, af = axisFmt(yr.step);
  let g = '';
  timeTicks(t0, t1, w < 420 ? 3 : 5).forEach((t, i, a) => { g += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${T + H}"/><text class="tm" x="${x(t)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === a.length - 1 ? 'end' : 'middle'}">${tdate(t)}</text>`; });
  yr.ticks.forEach(v => { g += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}"/><text class="tm" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${af(v)} %</text>`; });
  g += `<line class="axis" x1="${L}" x2="${L + pw}" y1="${y(0)}" y2="${y(0)}"/>`;
  series.forEach((p, i) => {
    const xa = i ? (x(tm(series[i - 1].d)) + x(tm(p.d))) / 2 : L, xb = i < series.length - 1 ? (x(tm(p.d)) + x(tm(series[i + 1].d))) / 2 : L + pw;
    g += `<rect class="hit" x="${xa}" y="${T}" width="${Math.max(2, xb - xa)}" height="${H}" data-tip="${esc(`${fd(p.d)}\nTTWROR seit Beginn ${pctS(p.r)}`)}"/>`;
  });
  g += `<path d="${series.map((p, i) => (i ? 'L' : 'M') + x(tm(p.d)) + ',' + y(p.r * 100)).join('')}" style="fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round"/>`;
  if (series.length <= 40) series.forEach(p => { g += `<circle cx="${x(tm(p.d))}" cy="${y(p.r * 100)}" r="3" style="fill:var(--s1);stroke:var(--surface);stroke-width:2;pointer-events:none"/>`; });
  const last = series[series.length - 1];
  g += `<text class="tv" x="${L + pw}" y="${y(last.r * 100) + (last.r >= 0 ? -9 : 17)}" text-anchor="end">${pctS(last.r)}</text>`;
  return {svg:svgWrap(w, h, g, 'Zeitgewichtete Rendite (TTWROR) im Zeitverlauf'), series};
}

function modal({title, text = '', fields = [], ok = 'OK', cancel = 'Abbrechen', danger = false}){
  return new Promise(resolve => {
    const root = $('#modal-root');
    const prevFocus = document.activeElement;
    root.innerHTML = `<div class="overlay"><form class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}
      ${fields.map((f, i) => `<label>${esc(f.label)}<input data-f="${i}" value="${esc(f.value || '')}" autocomplete="off"></label>`).join('')}
      <div class="btns"><button class="primary${danger ? ' danger' : ''}" type="submit"${danger ? ' style="background:var(--neg);border-color:var(--neg)"' : ''}>${esc(ok)}</button>
      ${cancel ? `<button class="btn" type="button" data-cancel>${esc(cancel)}</button>` : ''}</div></form></div>`;
    const form = root.querySelector('form');
    const close = v => { root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) {} resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(fields.length ? null : false); } };
    document.addEventListener('keydown', onKey, true);
    form.addEventListener('submit', e => {
      e.preventDefault();
      close(fields.length ? fields.map((f, i) => form.querySelector(`[data-f="${i}"]`).value) : true);
    });
    const c = form.querySelector('[data-cancel]'); if (c) c.addEventListener('click', () => close(fields.length ? null : false));
    const first = form.querySelector('input') || form.querySelector('button'); if (first) first.focus();
  });
}
function download(name, text, mime){
  const blob = new Blob([text], {type:mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function saveKurse(){
  const date = parseDate($('#kdate').value), msg = $('#kmsg');
  if (!date) { msg.textContent = 'Bitte ein gültiges Datum wählen.'; return; }
  const inputs = [...document.querySelectorAll('.kinput')];
  const byPid = {};
  for (const i of inputs) {
    if (!i.value.trim()) continue;
    const v = parseNum(i.value);
    if (!(v > 0)) { msg.textContent = `Ungültiger Kurs bei „${posById(i.dataset.pos).name}“.`; i.focus(); return; }
    byPid[i.dataset.pos] = {pid:i.dataset.pos, v, ohl:null};
  }
  const ohlIn = {};
  document.querySelectorAll('.kohl').forEach(i => { (ohlIn[i.dataset.pos] = ohlIn[i.dataset.pos] || {})[i.dataset.f] = i; });
  for (const pid of Object.keys(ohlIn)) {
    const f = ohlIn[pid], vals = ['o', 'h', 'l'].map(k => f[k].value.trim());
    if (vals.every(x => !x)) continue;
    const nm = posById(pid).name;
    if (vals.some(x => !x)) { msg.textContent = `Bei „${nm}“ bitte Eröffnung, Hoch und Tief alle drei ausfüllen.`; f.o.focus(); return; }
    const [o, h, l] = vals.map(parseNum);
    if (![o, h, l].every(x => x > 0)) { msg.textContent = `Bei „${nm}“ ist ein Wert für Eröffnung, Hoch oder Tief ungültig.`; f.o.focus(); return; }
    const entry = byPid[pid] || (byPid[pid] = {pid, v:null, ohl:null});
    const exist = (state.prices[pid] || []).find(e => e.date === date);
    const c = entry.v != null ? entry.v : exist ? exist.price : null;
    if (c == null) { msg.textContent = `Bei „${nm}“ fehlt der Schlusskurs für ${fd(date)}. Bitte oben eintragen.`; return; }
    if (!(h >= Math.max(o, c, l) - 1e-9 && l <= Math.min(o, c, h) + 1e-9)) { msg.textContent = `Bei „${nm}“ passen die Werte nicht zusammen: Hoch muss der höchste, Tief der niedrigste Wert sein.`; f.h.focus(); return; }
    entry.ohl = {o, h, l};
  }
  const todo = Object.values(byPid);
  if (!todo.length) { msg.textContent = 'Kein Kurs eingegeben.'; return; }
  todo.forEach(t => {
    const arr = (state.prices[t.pid] = state.prices[t.pid] || []);
    let ex = arr.find(e => e.date === date);
    if (ex) { if (t.v != null) ex.price = t.v; } else { ex = {date, price:t.v}; arr.push(ex); }
    if (t.ohl) { ex.o = t.ohl.o; ex.h = t.ohl.h; ex.l = t.ohl.l; }
    else if (ex.o && !(ex.h >= ex.price && ex.l <= ex.price)) { delete ex.o; delete ex.h; delete ex.l; }
    arr.sort((a, b) => a.date < b.date ? -1 : 1);
  });
  saveState(); render(); toast(`${todo.length} Kurs${todo.length > 1 ? 'e' : ''} für ${fd(date)} gespeichert`);
  const kd = $('#kdate'); if (kd) kd.value = date;
}

function updateTxSum(){
  const el = $('#txsum'); if (!el) return;
  const q = parseNum($('#f-qty').value), p = parseNum($('#f-price').value), f = parseNum($('#f-fee').value) || 0;
  const sell = $('#f-type').value === 'sell';
  const amt = q > 0 && p >= 0 ? q * p + (sell ? -f : f) : NaN;
  let txt = isFinite(amt) ? `${sell ? 'Erlös' : 'Kaufbetrag'} inklusive Gebühr: ${eur(amt)}` : '';
  if (isFinite(amt) && cashOn()) {
    const edit = ui.txEdit ? state.txs.find(t => t.id === ui.txEdit) : null;
    const old = edit ? (edit.type === 'sell' ? edit.qty * edit.price - edit.fee : -(edit.qty * edit.price + edit.fee)) : 0;
    const after = cashInfo().bal - old + (sell ? amt : -amt);
    txt += `. Kontostand danach: ${eur(after)}` + (after < -0.005 ? ` (Achtung: das Konto wäre um ${eur(-after)} überzogen)` : '');
  }
  el.textContent = txt;
}
function saveTx(){
  const msg = $('#txmsg'), date = parseDate($('#f-date').value), type = $('#f-type').value;
  const name = $('#f-name').value.trim(), q = parseNum($('#f-qty').value), pr = parseNum($('#f-price').value);
  const feeRaw = $('#f-fee').value.trim(), fee = feeRaw ? parseNum(feeRaw) : 0;
  if (!date) return void (msg.textContent = 'Bitte ein gültiges Datum wählen.');
  if (!name) return void (msg.textContent = 'Bitte eine Position angeben.');
  if (!(q > 0)) return void (msg.textContent = 'Stückzahl muss größer als 0 sein.');
  if (!(pr >= 0)) return void (msg.textContent = 'Bitte einen gültigen Kurs je Stück angeben.');
  if (!(fee >= 0)) return void (msg.textContent = 'Gebühr ungültig (leer lassen oder eine Zahl ≥ 0).');
  let pos = state.positions.find(p => p.name.toLowerCase() === name.toLowerCase());
  const isNew = !pos;
  const posId = pos ? pos.id : '__new__';
  const edit = ui.txEdit ? state.txs.find(t => t.id === ui.txEdit) : null;
  const tx = {id:edit ? edit.id : uid(), posId, type, date, qty:q, price:pr, fee};
  // Plausibilität: Verkauf darf Bestand nicht übersteigen
  const others = state.txs.filter(t => t.posId === posId && (!edit || t.id !== edit.id));
  const before = edit && edit.posId === posId ? calcFrom(txsOf(posId)).errors.length : calcFrom(others).errors.length;
  const after = calcFrom(others.concat([tx])).errors.length;
  if (after > before) return void (msg.textContent = 'Mit dieser Eingabe würde ein Verkauf den vorhandenen Bestand übersteigen. Bitte Datum, Art und Stückzahl prüfen.');
  if (isNew) { pos = {id:uid(), name, sym:'', url:''}; state.positions.push(pos); }
  tx.posId = pos.id;
  if (edit) Object.assign(edit, tx); else state.txs.push(tx);
  ui.txEdit = null; ui.lastDate = date;
  saveState(); render(); toast((edit ? 'Änderung gespeichert' : 'Transaktion gespeichert' + (isNew ? ` (neue Position „${name}“)` : '')) + (cashOn() ? `. Konto: ${eur(cashInfo().bal)}` : ''), 3200);
}

async function importCSV(file){
  let rows;
  try { rows = await tableRows(file); } catch (e) { await modal({title:'Nicht lesbar', text:'Die Datei konnte nicht gelesen werden: ' + (e && e.message || e), ok:'OK', cancel:''}); return; }
  if (rows.length < 2) { toast('Die Tabelle enthält keine Datenzeilen.', 4000); return; }
  const col = {}; rows[0].forEach((h, i) => { const k = HMAP[hnorm(h)]; if (k && !(k in col)) col[k] = i; });
  const miss = ['date', 'name', 'type', 'qty', 'price'].filter(k => !(k in col));
  if (miss.length) { await modal({title:'Spalten fehlen', text:'Es fehlen Spalten für: ' + miss.map(k => ({date:'Datum', name:'Name', type:'Art', qty:'Stück', price:'Kurs'})[k]).join(', ') + '.\nErkannte Überschriften: ' + rows[0].join(' | '), ok:'OK', cancel:''}); return; }
  const good = [], bad = [];
  rows.slice(1).forEach((r, i) => {
    const g = k => (k in col ? (r[col[k]] || '').trim() : '');
    const date = parseDate(g('date')), name = g('name'), t = g('type').toLowerCase(), q = parseNum(g('qty')), pr = parseNum(g('price'));
    const fee = g('fee') ? parseNum(g('fee')) : 0;
    const type = /^(k|b)/.test(t) ? 'buy' : /^(v|s)/.test(t) ? 'sell' : null;
    const why = !date ? 'Datum' : !name ? 'Name' : !type ? 'Art' : !(q > 0) ? 'Stück' : !(pr >= 0) ? 'Kurs' : !(fee >= 0) ? 'Gebühr' : null;
    if (why) bad.push(`Zeile ${i + 2}: ${why} ungültig`); else good.push({date, name, sym:g('sym'), type, qty:q, price:pr, fee});
  });
  if (!good.length) { await modal({title:'Nichts importiert', text:bad.slice(0, 8).join('\n'), ok:'OK', cancel:''}); return; }
  const ok = await modal({title:'CSV importieren?', text:`${good.length} Transaktionen werden hinzugefügt.` + (bad.length ? `\n${bad.length} Zeilen sind fehlerhaft und werden übersprungen:\n` + bad.slice(0, 6).join('\n') + (bad.length > 6 ? '\n…' : '') : ''), ok:'Importieren'});
  if (!ok) return;
  good.forEach(g => {
    const lc = g.name.toLowerCase();
    let p = state.positions.find(x => x.name.toLowerCase() === lc || (g.sym && x.sym && x.sym.toLowerCase() === g.sym.toLowerCase()));
    if (!p) { p = {id:uid(), name:g.name, sym:g.sym, url:''}; state.positions.push(p); }
    else if (g.sym && !p.sym) p.sym = g.sym;
    state.txs.push({id:uid(), posId:p.id, type:g.type, date:g.date, qty:g.qty, price:g.price, fee:g.fee});
  });
  saveState(); render();
  const errN = state.positions.reduce((a, p) => a + calcPosition(p.id).errors.length, 0);
  toast(`${good.length} Transaktionen importiert` + (errN ? `. ${errN} Verkauf/Verkäufe übersteigen den Bestand (siehe Käufe).` : ''), errN ? 6000 : 3000);
}

/* Excel speichert CSV oft als Windows-1252: erst UTF-8 versuchen, sonst Windows-1252. */
async function readTextFile(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function matchPos(str){
  str = String(str || '').trim(); if (!str) return null;
  const l = str.toLowerCase(), n = hnorm(str);
  return state.positions.find(p => p.name.toLowerCase() === l)
    || state.positions.find(p => p.sym && p.sym.toLowerCase() === l)
    || state.positions.find(p => hnorm(p.name) === n || (p.sym && hnorm(p.sym) === n)) || null;
}
/* Kurse einlesen. Liste: Datum;Name;Kurs. Tabelle: Datum;Position A;Position B ... Einzelliste: Datum;Kurs (Position wird abgefragt). */
async function importKurseCSV(file){
  const info = (title, text) => modal({title, text, ok:'OK', cancel:''});
  let rows;
  try { rows = await tableRows(file); } catch (e) { await info('Nicht lesbar', 'Die Datei konnte nicht gelesen werden: ' + (e && e.message || e)); return; }
  if (!state.positions.length) { await info('Keine Positionen', 'Lege zuerst unter Käufe mindestens eine Position an. Kurse werden nur vorhandenen Positionen zugeordnet.'); return; }
  if (rows.length < 2) { await info('Keine Datenzeilen', 'Die Tabelle enthält keine Datenzeilen.'); return; }
  const hdr = rows[0], col = {};
  hdr.forEach((h, i) => { const k = HMAP[hnorm(h)]; if (k && !(k in col)) col[k] = i; });
  if (!('date' in col)) { await info('Spalte Datum fehlt', 'Die erste Zeile muss Überschriften enthalten, mindestens eine Spalte „Datum“.\nErkannte Überschriften: ' + hdr.join(' | ')); return; }
  const items = [], bad = [], unmatched = {}, unmatchedCols = []; let nOhlBad = 0;
  const push = (line, dateStr, pos, priceStr, os) => {
    const date = parseDate(dateStr), v = parseNum(priceStr);
    if (!date) { bad.push(`Zeile ${line}: Datum ungültig`); return; }
    if (!(v > 0)) { bad.push(`Zeile ${line}: Kurs ungültig`); return; }
    let ohl = null;
    if (os && (os.o || os.h || os.l)) {
      const o = parseNum(os.o), h = parseNum(os.h), l = parseNum(os.l);
      if (o > 0 && h > 0 && l > 0 && h >= l) ohl = {o, h, l}; else nOhlBad++;
    }
    items.push({pos, date, price:v, ohl});
  };
  let mode, single = null, wcols = [];
  if ('price' in col && ('name' in col || 'sym' in col)) mode = 'Liste (eine Zeile je Kurs)';
  else {
    hdr.forEach((h, i) => { if (i === col.date || !h.trim()) return; const p = matchPos(h); if (p) wcols.push({i, pos:p}); else unmatchedCols.push(h.trim()); });
    if (wcols.length) mode = 'Tabelle (eine Spalte je Position)';
    else if ('price' in col) {
      mode = 'Kurse einer Position';
      if (state.positions.length > 10) { await info('Position unklar', 'Die Datei enthält keine Spalte mit dem Namen der Position. Ergänze eine Spalte „Name“ oder benenne die Kursspalte nach der Position.'); return; }
      const ch = await choose({title:'Zu welcher Position gehören die Kurse?', text:'In der Datei steht kein Positionsname. Bitte wähle die Position:', options:state.positions.map(p => ({key:p.id, label:p.name, sub:p.sym || ''})).concat([{key:'', label:'Abbrechen'}])});
      if (!ch) return;
      single = posById(ch); unmatchedCols.length = 0;
    } else { await info('Format nicht erkannt', 'Erwartet wird entweder eine Liste mit den Spalten Datum, Name (oder Kürzel) und Kurs, oder eine Tabelle mit Datum und je einer Spalte pro Position (Überschrift = Name oder Kürzel).\nErkannte Überschriften: ' + hdr.join(' | ')); return; }
  }
  rows.slice(1).forEach((r, i) => {
    const line = i + 2, g = k => (k in col ? (r[col[k]] || '').trim() : '');
    if (mode.startsWith('Tabelle')) wcols.forEach(w => { const c = (r[w.i] || '').trim(); if (c) push(line, g('date'), w.pos, c); });
    else if (single) push(line, g('date'), single, g('price'), {o:g('open'), h:g('high'), l:g('low')});
    else {
      const key = g('name') || g('sym');
      if (!key) { bad.push(`Zeile ${line}: Name fehlt`); return; }
      const p = matchPos(g('name')) || matchPos(g('sym'));
      if (!p) { unmatched[key] = (unmatched[key] || 0) + 1; return; }
      push(line, g('date'), p, g('price'), {o:g('open'), h:g('high'), l:g('low')});
    }
  });
  const m = new Map(); items.forEach(it => m.set(it.pos.id + '|' + it.date, it));
  const list = [...m.values()]; let nNew = 0, nChg = 0, nSame = 0, nOhl = 0; const chg = [];
  list.forEach(it => {
    const ex = (state.prices[it.pos.id] || []).find(e => e.date === it.date);
    if (!ex) { nNew++; it.k = 'new'; }
    else if (Math.abs(ex.price - it.price) < 1e-9) {
      if (it.ohl && !(ex.o === it.ohl.o && ex.h === it.ohl.h && ex.l === it.ohl.l)) { nOhl++; it.k = 'ohl'; } else { nSame++; it.k = 'same'; }
    } else { nChg++; it.k = 'chg'; it.old = ex.price; chg.push(it); }
  });
  const nWithOhl = list.filter(i => i.ohl).length;
  const unN = Object.keys(unmatched);
  const probs = [];
  if (unN.length) probs.push('Keiner Position zugeordnet (übersprungen): ' + unN.slice(0, 5).map(n => `„${n}“ (${unmatched[n]})`).join(', ') + (unN.length > 5 ? ' …' : ''));
  if (unmatchedCols.length) probs.push('Spalten ohne passende Position (übersprungen): ' + unmatchedCols.slice(0, 5).join(', ') + (unmatchedCols.length > 5 ? ' …' : ''));
  if (nOhlBad) probs.push(`${nOhlBad} Zeile${nOhlBad > 1 ? 'n' : ''} mit unstimmigen Werten für Eröffnung/Hoch/Tief (nur der Schlusskurs wird übernommen)`);
  if (bad.length) probs.push(`${bad.length} fehlerhafte Zeile${bad.length > 1 ? 'n' : ''} (übersprungen): ` + bad.slice(0, 4).join('; ') + (bad.length > 4 ? ' …' : ''));
  if (nNew + nChg + nOhl === 0) { await info('Nichts zu importieren', (nSame ? `Alle ${nSame} Kurse sind schon vorhanden.` : 'In der Datei wurde kein passender Kurs gefunden.') + (probs.length ? '\n\n' + probs.join('\n') : '')); return; }
  const dates = list.map(i => i.date).sort(), npos = new Set(list.map(i => i.pos.id)).size;
  let text = `Format: ${mode}\n${list.length} Kurse für ${npos} Position${npos > 1 ? 'en' : ''}, ${fd(dates[0])}${dates[0] !== dates[dates.length - 1] ? ' bis ' + fd(dates[dates.length - 1]) : ''}\n\nNeu: ${nNew}\nErsetzt (anderer Preis am selben Tag): ${nChg}` + (nWithOhl ? `\nNur um Kerzenwerte ergänzt (gleicher Schlusskurs): ${nOhl}\nMit Eröffnung, Hoch und Tief: ${nWithOhl}` : '') + `\nUnverändert, wird übersprungen: ${nSame}`;
  if (chg.length) text += '\n\nErsetzt werden zum Beispiel:\n' + chg.slice(0, 4).map(c => `${c.pos.name} ${fd(c.date)}: ${price(c.old)} → ${price(c.price)}`).join('\n') + (chg.length > 4 ? '\n…' : '');
  if (probs.length) text += '\n\n' + probs.join('\n');
  const ok = await modal({title:'Kurse importieren?', text, ok:'Importieren'});
  if (!ok) return;
  list.forEach(it => {
    if (it.k === 'same') return;
    const arr = (state.prices[it.pos.id] = state.prices[it.pos.id] || []);
    const ex = arr.find(e => e.date === it.date);
    let e2 = ex; if (e2) e2.price = it.price; else { e2 = {date:it.date, price:it.price}; arr.push(e2); }
    if (it.ohl) { e2.o = it.ohl.o; e2.h = it.ohl.h; e2.l = it.ohl.l; } else if (it.k === 'chg') { delete e2.o; delete e2.h; delete e2.l; }
    arr.sort((a, b) => a.date < b.date ? -1 : 1);
  });
  saveState(); render();
  toast(`${nNew + nChg} Kurse importiert (${nNew} neu, ${nChg} ersetzt)` + (nOhl ? `, ${nOhl} um Kerzenwerte ergänzt` : ''), 4500);
}

/* --- Helfer --- */
function niceStep(range, n){ const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }
function niceRange(lo, hi, n = 4){
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const step = niceStep(hi - lo, n), a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, ticks = [];
  for (let v = a; v <= b + step * 1e-6; v += step) ticks.push(+v.toFixed(10));
  return {lo:a, hi:b, step, ticks};
}
function axisFmt(step){
  const d = Math.abs(step - Math.round(step)) < 1e-9 ? 0 : Math.abs(step * 10 - Math.round(step * 10)) < 1e-9 ? 1 : 2;
  const f = new Intl.NumberFormat('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});
  return v => f.format(v);
}
const trunc = (s, n) => s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s;
const svgWrap = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const tableHTML = (head, rows) => `<div class="tablewrap"><table><thead><tr>${head.map((h, i) => `<th${i === 0 ? ' style="text-align:left"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function barPath(x, y, w, h, col, tip){
  if (w <= 0) return `<rect class="hit" x="${x}" y="${y - 3}" width="14" height="${h + 6}" data-tip="${esc(tip)}"/>`;
  const r = Math.min(4, w, h / 2);
  return `<path d="M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${-(w - r)}z" style="fill:${col}"/><rect class="hit" x="${x}" y="${y - 3}" width="${w + 40}" height="${h + 6}" data-tip="${esc(tip)}"/>`;
}

function timeTicks(t0, t1, n){ const a = []; for (let i = 0; i <= n; i++) a.push(t0 + (t1 - t0) * i / n); return a; }

/* --- Donut --- */

  if (open.length > 7) items.push({name:`Sonstige (${open.length - 7})`, value:open.slice(7).reduce((a, r) => a + r.value, 0), color:'var(--other)'});

function saveCustom(list){ state.meta.custom = cleanCustom(list) || []; saveState(); rerenderKeep(); }
function customEditor(id){

    ed.title = root.querySelector('#cu-title').value; ed.pct = root.querySelector('#cu-pct').checked;

      <p class="hint" style="margin:0 0 6px">Jede Reihe ist eine Kennzahl im Zeitverlauf. Mehrere Reihen lassen sich in einem Diagramm kombinieren, bei verschiedenen Größen am besten mit linker und rechter Achse oder als Prozentvergleich.</p>
      ${ed.series.map((s, i) => `<fieldset class="vsrow curow"><legend>Reihe ${i + 1}</legend>

        <label>Position<select data-k="p"${MEAS[s.m].pos ? '' : ' disabled'}>${MEAS[s.m].pos ? posOpt(s.p) : '<option value="">gesamtes Depot</option>'}</select></label>
        <label>Darstellung<select data-k="t">${opt(CU_TYPES, s.t)}</select></label>
        <label>Achse<select data-k="ax"><option value="r"${s.ax === 'r' ? ' selected' : ''}>rechts</option><option value="l"${s.ax === 'l' ? ' selected' : ''}>links</option></select></label>
        <label class="chk" style="align-self:end"><input type="checkbox" data-k="own"${s.col ? ' checked' : ''}><span>Eigene Farbe</span></label>
        <label>Farbe<input type="color" data-k="col" value="${s.col || '#2a78d6'}"></label>
        <div style="align-self:end;margin-bottom:10px"><button type="button" class="btn sm" data-x="del" data-i="${i}">Reihe entfernen</button></div></fieldset>`).join('')}
      <div class="btns"><button type="button" class="btn" data-x="add"${ed.series.length >= 12 ? ' disabled' : ''}>+ Reihe hinzufügen</button></div>
      <label class="chk"><input type="checkbox" id="cu-pct"${ed.pct ? ' checked' : ''}><span>Prozentvergleich: alle Reihen als Veränderung seit Beginn des Ausschnitts</span></label>

    <details style="margin-top:10px"><summary>Wie lese ich Kerzen?</summary><p class="hint" style="margin-top:0">Eine Kerze zeigt Eröffnung, Hoch, Tief und Schluss eines Zeitraums. Der dünne Strich reicht vom Tief bis zum Hoch, der Körper von der Eröffnung bis zum Schluss. Gestiegene Kerzen sind grün, gefallene rot (Farben unten einstellbar). Der Kerzenstil (flach, 3D, metallisch) gilt für Kerzen, hohle Kerzen und Heikin-Ashi. Handelstage zeichnet jede Kerze gleich breit ohne Lücken, Kalenderzeit hält die Abstände zwischen den Daten maßstabsgetreu. Hohle Kerzen: gestiegene nur als Rahmen. Heikin-Ashi glättet die Kerzen, Balken (OHLC) zeigen Eröffnung links und Schluss rechts als Strich. Hast du keine Werte für Eröffnung, Hoch und Tief erfasst (Reiter Kurse, auch per CSV mit Open, High, Low), werden sie aus den erfassten Schlusskursen abgeleitet: Eröffnung ist der Schluss des Vorzeitraums, Hoch und Tief sind der höchste und niedrigste erfasste Kurs im Zeitraum. Das sind dann Näherungen, keine echten Tageshochs. Volumen und Zeichenwerkzeuge gibt es nicht.</p></details></section>

    <h3 style="font-size:1rem;margin:14px 0 4px">Diagramme</h3>${layList('ch', LAY_CH.concat(curCustom().map(c => ['u_' + c.id, c.title + ' (eigenes Diagramm)'])), 'chHide', L.ch, L.chHide, 'Häkchen = sichtbar. Das Gesamtvermögen erscheint nur, wenn das Konto genutzt wird.')}</section>
  <section class="card"><h2>Berechnung</h2>${methodBar()}</section>

function curLayout(){ return cleanLayout(state.meta.layout, curCustom()); }
function setLayout(patch){ state.meta.layout = cleanLayout(Object.assign({}, curLayout(), patch), curCustom()); saveState(); rerenderKeep(); }
function layMove(list, id, dir){
  const L = curLayout(), a = L[list].slice(), i = a.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; setLayout({[list]:a});
}
function chartChange(t){
  const k = t.dataset.cs, c = curChart(), p = {};
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'from' || k === 'to') v = v || null;
  const mv = /^vs\.(\w+)\.(min|max|step)$/.exec(k);
  if (mv) { const n = parseNum(v), vs = JSON.parse(JSON.stringify(c.vs)); vs[mv[1]][mv[2]] = isFinite(n) && (mv[2] !== 'step' || n > 0) ? n : null; setChart({vs}); return; }
  const m = /^(ma[12])(on|k|n)$/.exec(k);
  if (m) { const cur = Object.assign({}, c[m[1]]); if (m[2] === 'on') cur.on = v; else if (m[2] === 'k') cur.k = v; else cur.n = Number(v); p[m[1]] = cur; }
  else p[k] = v;
  setChart(p);
}
function layChange(t){
  const k = t.dataset.lay;
  if (k === 'start') { setLayout({start:t.value}); return; }
  const L = curLayout(), id = t.dataset.id, h = L[k].filter(x => x !== id);
  if (!t.checked) h.push(id);
  setLayout({[k]:h});
}

const tipEl = $('#tip');
function showTip(el, e){
  tipEl.textContent = el.getAttribute('data-tip'); tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 6) x = innerWidth - r.width - 6;
  if (x < 6) x = 6;
  if (y + r.height > innerHeight - 6) y = Math.max(6, e.clientY - r.height - 14);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
const hideTip = () => { tipEl.style.display = 'none'; };
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); });
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); else hideTip(); });
document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e); else hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});
/* --- Fadenkreuz, Verschieben, Zoomen der Preis-Charts --- */
function chartPoint(e){
  const host = e.target && e.target.closest ? e.target.closest('.chart') : null;
  if (!host || !chartReg[host.id]) return null;
  const svg = host.querySelector('svg'); if (!svg) return null;
  const r = svg.getBoundingClientRect(), reg = chartReg[host.id], k = reg.w / (r.width || reg.w);
  return {host, reg, id:host.id, k, x:(e.clientX - r.left) * k, y:(e.clientY - r.top) * k};
}
let xhActive = null;
function crossOff(id){
  const host = document.getElementById(id), reg = chartReg[id]; if (!host || !reg) return;
  const g = host.querySelector('svg .xh'); if (g) g.innerHTML = '';
  const lg = host.querySelector('.tvlg'); if (lg) lg.innerHTML = reg.legend(reg.P.i1);
  reg.cur = null;
}
function crossAt(cp){
  const reg = cp.reg, g = cp.host.querySelector('svg .xh'); if (!g) return;
  if (!reg.cc.cross || cp.x < reg.L || cp.x > reg.L + reg.pw || cp.y < reg.T || cp.y > reg.vb) { crossOff(cp.id); return; }
  const P = reg.P, i = P.lay.nearest(cp.x), cx = r1(P.lay.xi(i)), c = P.disp[i], X0 = reg.L + reg.pw;
  let s = `<line x1="${cx}" x2="${cx}" y1="${reg.T}" y2="${reg.vb}" style="stroke:#787b86;stroke-width:1;stroke-dasharray:4 3"/>`;
  if (cp.y <= reg.T + reg.H) s += `<line x1="${reg.L}" x2="${X0}" y1="${r1(cp.y)}" y2="${r1(cp.y)}" style="stroke:#787b86;stroke-width:1;stroke-dasharray:4 3"/>` + axTag(X0, reg.w - X0, cp.y, P.vfmt(P.inv(cp.y)), '#363a45');
  const lx = Math.max(2, Math.min(reg.w - 70, cx - 34));
  s += `<rect x="${r1(lx)}" y="${reg.axisY - 12}" width="68" height="17" rx="2" style="fill:#363a45"/><text x="${r1(lx + 34)}" y="${reg.axisY + 1}" text-anchor="middle" style="fill:#fff;font-size:11px">${fd(c.d1)}</text>`;
  g.innerHTML = s;
  if (reg.cur !== i) { reg.cur = i; const lg = cp.host.querySelector('.tvlg'); if (lg) lg.innerHTML = reg.legend(i); }
}
function setView(id, i0, i1){
  const reg = chartReg[id]; if (!reg) return;
  const n = reg.P.n, span = Math.max(Math.min(4, n - 1), i1 - i0);
  i0 = Math.max(0, Math.min(i0, n - 1 - span)); i1 = Math.min(n - 1, i0 + span);

  const r = await dapi(D_UP + 'files?uploadType=multipart&fields=id,version,modifiedTime', {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body});
  return r.json();
}
async function dupdate(id, content){
  const r = await dapi(D_UP + 'files/' + encodeURIComponent(id) + '?uploadType=media&fields=id,version,modifiedTime', {method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body:content});
  return r.json();
}
async function dread(id){ const r = await dapi(D_API + 'files/' + encodeURIComponent(id) + '?alt=media'); return r.text(); }

/* ---------- Inhalt ---------- */
/* Ein einzelnes Standard-Depot wird wie bisher (Format 1) geschrieben. Bei mehreren Depots steht "depots" im Objekt,
   und "data" enthaelt zur Absicherung aelterer Versionen das erste Depot. */
const payload = () => {
  const w = wsObj(), single = w.depots.length === 1 && w.depots[0].id === 'main' && w.depots[0].name === DEF_NAME;
  const o = {app:'seifferts-depot', format:single ? 1 : 2, saved:new Date().toISOString(), data:w.depots[0].state};
  if (!single) o.depots = w.depots.map(d => ({id:d.id, name:d.name, state:d.state}));
  return JSON.stringify(o, null, 1);
};
function parsePayload(txt){ const o = JSON.parse(txt); return normalizeWS(o && Array.isArray(o.depots) ? o : (o && o.data ? o.data : o)); }
function canon(s){
  if (isWS(s)) return JSON.stringify(s.depots.slice().sort((a, b) => a.id < b.id ? -1 : 1).map(d => [d.id, d.name, canon(d.state)]));
  const by = (a, b) => a.id < b.id ? -1 : 1;
  return JSON.stringify({
    p:s.positions.slice().sort(by).map(p => [p.id, p.name, p.sym, p.url || '']),
    t:s.txs.slice().sort(by).map(t => [t.id, t.posId, t.type, t.date, t.qty, t.price, t.fee || 0]),
    k:Object.keys(s.prices).sort().map(k => [k, s.prices[k].map(e => e.o ? [e.date, e.price, e.o, e.h, e.l] : [e.date, e.price])]),
    c:(s.cash || []).slice().sort(by).map(c => [c.id, c.date, c.type, c.amount, c.note])
  });
}
function sumState(s){
  if (isWS(s)) return s.depots.length === 1 ? sumState(s.depots[0].state) : `${s.depots.length} Depots: ` + s.depots.map(d => `${d.name} (${d.state.positions.length} Positionen, ${d.state.txs.length} Transaktionen)`).join('; ');
  let last = ''; Object.values(s.prices).forEach(a => a.forEach(e => { if (e.date > last) last = e.date; }));
  return `${s.positions.length} Positionen, ${s.txs.length} Transaktionen` + (s.cash && s.cash.length ? `, ${s.cash.length} Kontobuchungen` : '') + (last ? `, letzter Kurs ${fd(last)}` : ', noch keine Kurse');
}
/* Vereinigung zweier Staende ueber die IDs. Geloeschte Eintraege koennen dabei zurueckkehren. */
function mergeStates(a, b){
  if (!isWS(a) && !isWS(b)) return mergeOne(a, b);
  const wrap = x => isWS(x) ? x : {depots:[{id:'main', name:DEF_NAME, state:x}]};
  const out = JSON.parse(JSON.stringify(wrap(a))), sum = {addP:0, addT:0, addK:0, diffK:0, addC:0, addD:0};
  wrap(b).depots.forEach(bd => {
    const ad = out.depots.find(d => d.id === bd.id);
    if (!ad) { out.depots.push(JSON.parse(JSON.stringify(bd))); sum.addD++; return; }
    const m = mergeOne(ad.state, bd.state); ad.state = m.state;
    ['addP', 'addT', 'addK', 'diffK', 'addC'].forEach(k => { sum[k] += m[k]; });
  });
  return Object.assign({state:out}, sum);
}
function mergeOne(a, b){
  const s = JSON.parse(JSON.stringify(a)), pm = {}; let addP = 0, addT = 0, addK = 0, diffK = 0, addC = 0;
  b.positions.forEach(p => {
    let m = s.positions.find(x => x.id === p.id) || s.positions.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    if (!m) { m = {id:p.id, name:p.name, sym:p.sym, url:p.url || ''}; s.positions.push(m); addP++; } else { if (!m.sym && p.sym) m.sym = p.sym; if (!m.url && p.url) m.url = p.url; }
    pm[p.id] = m.id;
  });
  const ids = new Set(s.txs.map(t => t.id));
  b.txs.forEach(t => { if (ids.has(t.id) || !pm[t.posId]) return; s.txs.push(Object.assign({}, t, {posId:pm[t.posId]})); ids.add(t.id); addT++; });
  s.cash = s.cash || []; const cids = new Set(s.cash.map(c => c.id));
  (b.cash || []).forEach(c => { if (!cids.has(c.id)) { s.cash.push(Object.assign({}, c)); cids.add(c.id); addC++; } });
  Object.keys(b.prices).forEach(pid => {
    const tid = pm[pid]; if (!tid) return;
    const arr = (s.prices[tid] = s.prices[tid] || []);
    b.prices[pid].forEach(e => { const ex = arr.find(x => x.date === e.date); if (!ex) { arr.push(Object.assign({}, e)); addK++; } else if (ex.price !== e.price) diffK++; else if (!ex.o && e.o) { ex.o = e.o; ex.h = e.h; ex.l = e.l; } });
    arr.sort((x, y) => x.date < y.date ? -1 : 1);
  });
  return {state:normalizeState(s), addP, addT, addK, diffK, addC};
}

/* ---------- Sicherungskopien in Drive ---------- */
async function dbackup(tag){
  if (!dm.fileId) return;
  const day = todayISO();
  if (!tag && dm.backupDay === day) return;
  dm.backupId = await ensureFolder(D_BACKUP, dm.folderId, dm.backupId); saveDM();
  const list = await dlist(`'${dm.backupId}' in parents and trashed=false`, 'files(id,name)', {orderBy:'name desc'});
  let name;
  if (tag) { const n = new Date(); name = `depot-sicherung-${day}-${pad2(n.getHours())}${pad2(n.getMinutes())}-${tag}.json`; }
  else { name = `depot-sicherung-${day}.json`; if (list.some(f => f.name === name)) { dm.backupDay = day; saveDM(); await dprune(list.slice(D_KEEP)); return; } }
  await dapi(D_API + 'files/' + encodeURIComponent(dm.fileId) + '/copy?fields=id,name', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, parents:[dm.backupId]})});
  if (!tag) { dm.backupDay = day; saveDM(); }
  await dprune(list.slice(D_KEEP - 1));
}
/* Aeltere Sicherungskopien in den Drive-Papierkorb verschieben (nur die ueber dem Limit). */
async function dprune(old){
  for (const f of old) {
    try { await dapi(D_API + 'files/' + encodeURIComponent(f.id), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})}); } catch (e) { console.warn('Aufräumen', e); }
  }
}

/* ---------- Abfrage bei Konflikt ---------- */
function choose({title, text, options}){
  return new Promise(resolve => {
    const root = $('#modal-root');
    root.innerHTML = `<div class="overlay"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="max-height:92vh;overflow:auto"><h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="btns col">${options.map(o => `<button type="button" class="${o.primary ? 'primary' : 'btn'}" data-k="${o.key}">${esc(o.label)}${o.sub ? `<span class="sub" style="color:inherit;opacity:.8">${esc(o.sub)}</span>` : ''}</button>`).join('')}</div></div></div>`;
    root.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { root.innerHTML = ''; resolve(b.dataset.k); }));
    const f = root.querySelector('button'); if (f) f.focus();
  });
}
function resolveConflict(rs, remote){
  return choose({
    title:'Unterschiedliche Stände',
    text:`Google Drive: ${sumState(rs)}\n(zuletzt geändert ${fdt(remote.modifiedTime)})\n\nDieser Browser: ${sumState(wsObj())}\n\nNichts geht verloren: Vor jedem Überschreiben in Drive wird eine Sicherungskopie angelegt, und ein ersetzter lokaler Stand bleibt als Notkopie im Browser.`,
    options:[
      {key:'merge', label:'Beide zusammenführen', sub:'Empfohlen. Gelöschte Einträge können zurückkehren.', primary:true},
      {key:'remote', label:'Stand aus Drive übernehmen', sub:'Lokale Änderungen werden ersetzt.'},
      {key:'local', label:'Diesen Browser nach Drive hochladen', sub:'Der Drive-Stand wird ersetzt (vorher kopiert).'},
      {key:'cancel', label:'Später entscheiden'}
    ]});
}

/* ---------- Synchronisation ---------- */
async function driveSync(opts = {}){
  if (!dm.on) return;
  if (dd.hold && !opts.force) return;
  dd.hold = false;
  setStatus('busy');
  try {
    await ensureToken(!!opts.interactive);
    dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId); saveDM();
    let remote = null, lost = false;
    if (dm.fileId) { try { const m = await dmeta(dm.fileId); if (!m.trashed) remote = m; } catch (e) { if (e.status !== 404) throw e; } }
    if (!remote) {
      const f = await dfind(dm.folderId);
      if (f) { remote = f; if (dm.fileId && f.id !== dm.fileId) dm.version = ''; dm.fileId = f.id; saveDM(); }
      else if (dm.fileId) { lost = true; dm.fileId = ''; dm.version = ''; saveDM(); }
    }
    const localHas = hasData(wsObj());
    const upload = async tag => {
      const my = rev, content = payload();
      if (remote) { await dbackup(tag || dd.nextTag || ''); dd.nextTag = ''; const res = await dupdate(remote.id, content); dm.version = res.version; }
      else { const res = await dcreate(dm.folderId, content); dm.fileId = res.id; dm.version = res.version; remote = {id:res.id, version:res.version}; }
      dm.lastSaved = new Date().toISOString();
      if (rev === my) dm.dirty = false;
      saveDM();
    };
    const takeRemote = (rs, msg) => { replaceState(rs, {noSync:true}); dm.version = remote.version; dm.dirty = false; saveDM(); render(); if (msg) toast(msg, 3500); };

    if (!remote) {
      if (localHas) { if (lost) toast('Die Drive-Datei war gelöscht und wird neu angelegt.', 4500); await upload(); }
      else { dm.dirty = false; saveDM(); }
    } else if (remote.version === dm.version) {
      if (dm.dirty || opts.force) await upload();
    } else {
      const rs = parsePayload(await dread(remote.id));
      if (canon(rs) === canon(wsObj())) { dm.version = remote.version; dm.dirty = false; saveDM(); }
      else if (!localHas) takeRemote(rs, 'Stand aus Google Drive geladen');
      else if (dm.version && !dm.dirty) takeRemote(rs, 'Neuerer Stand aus Google Drive geladen (anderes Gerät)');
      else {
        setStatus('conflict');
        const ch = await resolveConflict(rs, remote);
        if (ch === 'remote') takeRemote(rs, 'Stand aus Drive übernommen');
        else if (ch === 'local') { await upload('vor-ueberschreiben'); toast('Lokaler Stand nach Drive hochgeladen'); }
        else if (ch === 'merge') {
          const mg = mergeStates(wsObj(), rs);
          replaceState(mg.state, {noSync:true}); dm.dirty = true; rev++;
          await upload('vor-zusammenfuehren'); render();
          toast(`Zusammengeführt: ${mg.addT} Transaktionen, ${mg.addK} Kurse, ${mg.addP} Positionen, ${mg.addC} Kontobuchungen` + (mg.addD ? `, ${mg.addD} Depots` : '') + ` aus Drive ergänzt` + (mg.diffK ? `. ${mg.diffK} abweichende Kurse: lokaler Wert behalten.` : ''), 6000);
        } else {
          if (opts.connecting) { dm.on = false; saveDM(); setStatus('off'); return; }
          dd.hold = true; setStatus('conflict'); return;
        }
      }
    }
    dd.lastCheck = Date.now();
    if (dm.dirty) { setStatus('pending'); clearTimeout(dd.timer); dd.timer = setTimeout(() => dq(() => driveSync({})), D_DEBOUNCE); }
    else setStatus('ok');
  } catch (e) { handleErr(e); }
}
function driveTouch(){
  if (!dm.on) return;
  rev++; dm.dirty = true; saveDM();
  if (dd.state === 'auth' || dd.state === 'conflict' || dd.state === 'unavail') { updatePill(); return; }
  setStatus('pending');
  if (!dm.auto) return;
  clearTimeout(dd.timer); dd.timer = setTimeout(() => dq(() => driveSync({})), D_DEBOUNCE);
}
async function driveConnect(){
  if (location.protocol === 'file:') { setStatus('unavail'); return; }
  try { setStatus('busy'); await requestToken(true); } catch (e) { dm.on ? handleErr(e) : (setStatus('off'), toast(e.message, 4000)); return; }
  dm.on = true; saveDM(); dq(() => driveSync({connecting:true}));
}
async function driveSignIn(){
  try { setStatus('busy'); await requestToken(true); } catch (e) { handleErr(e); return; }
  dq(() => driveSync({}));
}
async function driveStart(){
  if (!dm.on) { updatePill(); return; }
  if (location.protocol === 'file:') { setStatus('unavail'); return; }
  for (let i = 0; i < 160 && !gisOK(); i++) await sleep(50);
  if (!gisOK()) { setStatus('auth', 'Google-Anmeldung nicht geladen (offline?)'); return; }
  dq(() => driveSync({}));
}
function driveSaveNow(){
  gestureToken().then(() => { dd.hold = false; dq(() => driveSync({force:true, interactive:true})); }).catch(handleErr);
}
function driveLoadNow(){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId, false); saveDM();
      const remote = dm.folderId ? await dfind(dm.folderId) : null;
      if (!remote) { toast('In Drive gibt es noch keine Datei.', 3500); setStatus(dm.dirty ? 'pending' : 'ok'); return; }
      const rs = parsePayload(await dread(remote.id));
      setStatus(dm.dirty ? 'pending' : 'ok');
      const ok = await modal({title:'Stand aus Drive laden?', text:`Drive: ${sumState(rs)}\nDieser Browser: ${sumState(wsObj())}\n\nDer lokale Stand wird ersetzt` + (dm.dirty ? ' (noch nicht gesicherte Änderungen gehen dabei verloren)' : '') + '. Er bleibt als Notkopie im Browser erhalten.', ok:'Ersetzen', danger:true});
      if (!ok) return;
      dm.fileId = remote.id; dm.version = remote.version; dm.dirty = false; dd.hold = false;
      replaceState(rs, {noSync:true}); saveDM(); setStatus('ok'); render(); toast('Stand aus Drive geladen');
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
function driveListBackups(){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId, false);
      dm.backupId = dm.folderId ? await ensureFolder(D_BACKUP, dm.folderId, dm.backupId, false) : ''; saveDM();
      dd.backups = dm.backupId ? await dlist(`'${dm.backupId}' in parents and trashed=false`, 'files(id,name,modifiedTime,size)', {orderBy:'name desc'}) : [];
      setStatus(dm.dirty ? 'pending' : 'ok');
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
function driveRestore(id, name){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      const rs = parsePayload(await dread(id));
      setStatus(dm.dirty ? 'pending' : 'ok');
      const ok = await modal({title:'Sicherung einlesen?', text:`${name}\n${sumState(rs)}\n\nDer aktuelle Stand (${sumState(wsObj())}) wird ersetzt. In Drive wird vorher eine Sicherungskopie des aktuellen Standes angelegt.`, ok:'Einlesen', danger:true});
      if (!ok) return;
      dd.nextTag = 'vor-wiederherstellung'; replaceState(rs); render(); toast('Sicherung eingelesen, wird nach Drive gespeichert', 4000);
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
async function driveDisconnect(){
  if (!await modal({title:'Verbindung trennen?', text:'Die Dateien in Google Drive und die Daten in diesem Browser bleiben unverändert erhalten. Es wird nur nicht mehr synchronisiert.', ok:'Trennen'})) return;
  if (dd.token && gisOK()) { try { google.accounts.oauth2.revoke(dd.token, () => {}); } catch (e) {} }
  dd.token = null; dd.exp = 0; dd.backups = null; dd.hold = false; clearTimeout(dd.timer);
  dm = Object.assign(loadDM(), {on:false, fileId:'', folderId:'', backupId:'', version:'', lastSaved:'', dirty:false, backupDay:''}); saveDM();
  setStatus('off'); toast('Verbindung getrennt');
}
function pillClick(){
  const st = dd.state;
  if (st === 'auth') driveSignIn();
  else if (st === 'conflict') driveSaveNow();
  else if (st === 'error') dq(() => driveSync({}));
  else go('daten');
}

<script id="linuxHandOff">
/* Anmeldung fuer die Linux-App von Seifferts Depot. Nur aktiv, wenn diese Seite mit ?linuxport=...&linuxstate=... geoeffnet wird
   (das macht die Linux-App). Die Seite meldet mit der vorhandenen Client-ID bei Google an und reicht das Token per Weiterleitung an
   127.0.0.1 weiter, also an die Linux-App auf diesem Rechner. Ohne diese Parameter geschieht nichts. Dieser Block muss erhalten bleiben. */
(function(){
  var q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
  var port = q.get('linuxport'), st = q.get('linuxstate');
  if (!port || !st) return;
  if (!/^[0-9]{2,5}$/.test(port) || !/^[A-Za-z0-9_-]{8,128}$/.test(st)) return;
  /* In diesem Modus ruhen die Oberflaeche des Tools und seine Drive-Synchronisation. */
  window.driveSync = async function(){}; window.driveStart = async function(){}; window.driveTouch = function(){}; window.render = function(){};
  document.body.innerHTML = '<div class="wrap" style="padding-top:40px"><div class="card hero"><h2>Anmeldung für Seifferts Depot (Linux-App)</h2>'
    + '<p>Mit dem Knopf meldest du dich bei Google an. Danach geht die Anmeldung an die Linux-App auf diesem Rechner, und du kannst diesen Browser-Tab schließen.</p>'
    + '<div class="btns" style="justify-content:center"><button class="primary" id="lxBtn" type="button">Bei Google anmelden</button></div>'
    + '<p class="msg" id="lxMsg" role="status" style="color:var(--text2)"></p></div></div>';
  var btn = document.getElementById('lxBtn'), msg = document.getElementById('lxMsg');
  function post(fields){
    /* wie beim Stammbaum: Weiterleitung (GET) an die Linux-App auf diesem Rechner */
    fields.state = st;
    var qs = Object.keys(fields).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(String(fields[k])); }).join('&');
    location.href = 'http://127.0.0.1:' + port + '/handoff?' + qs;
  }
  btn.addEventListener('click', function(){
    if (!(window.google && google.accounts && google.accounts.oauth2)) { msg.textContent = 'Die Google-Anmeldung ist noch nicht geladen. Bitte kurz warten und noch einmal klicken (Internetverbindung nötig).'; return; }
    btn.disabled = true; msg.textContent = 'Bitte im Fenster von Google anmelden …';
    try {
      google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: D_SCOPE,
        callback: function(r){
          if (r && r.access_token) { msg.textContent = 'Anmeldung wird übermittelt …'; post({access_token: r.access_token, expires_in: r.expires_in || 3600}); }
          else { btn.disabled = false; msg.textContent = 'Anmeldung fehlgeschlagen' + (r && r.error ? ' (' + r.error + ')' : '') + '. Du kannst es noch einmal versuchen.'; }
        },
        error_callback: function(e){ btn.disabled = false; msg.textContent = 'Anmeldung nicht möglich (' + ((e && e.type) || 'Fehler') + '). Bitte erlaube Pop-up-Fenster für diese Seite und versuche es noch einmal.'; }
      }).requestAccessToken({prompt: ''});
    } catch (e) { btn.disabled = false; msg.textContent = 'Anmeldung nicht möglich: ' + e.message; }
  });
})();
