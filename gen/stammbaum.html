  const mk = (id, lab) => { const r = document.createElement("div"); r.id = id; r.className = "rz"; r.tabIndex = 0; r.setAttribute("role", "separator"); r.setAttribute("aria-orientation", "vertical"); r.setAttribute("aria-label", lab); r.title = "Ziehen ändert die Breite, Doppelklick stellt sie zurück"; return r; };
  const rs = mk("rzS", "Breite der Personenliste"), ri = mk("rzI", "Breite der Info-Leiste");
  $("side").after(rs); $("info").before(ri);
  const apply = () => { applySide(); };
  const wire = (el, get, set, dflt, lim) => {
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("drag"); document.body.classList.add("rzing");
      const mv = (ev) => { set(clampW(get(ev), lim[0], lim[1])); apply(); };
      const up = () => { el.classList.remove("drag"); document.body.classList.remove("rzing"); el.removeEventListener("pointermove", mv); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); lsSet("st.sw", SIDE.sw); lsSet("st.iw", SIDE.iw); };
      el.addEventListener("pointermove", mv); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    });
    el.addEventListener("dblclick", (e) => { e.stopPropagation(); set(dflt); apply(); lsSet("st.sw", SIDE.sw); lsSet("st.iw", SIDE.iw); });
    el.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault(); const dir = e.key === "ArrowRight" ? 1 : -1;
      const cur = el === rs ? SIDE.sw : SIDE.iw, sign = el === rs ? 1 : (SIDE.dockl ? 1 : -1);
      set(clampW(cur + dir * sign * 20, lim[0], lim[1])); apply(); lsSet("st.sw", SIDE.sw); lsSet("st.iw", SIDE.iw);
    });
  };
  wire(rs, (ev) => ev.clientX - $("side").getBoundingClientRect().left, (v) => { SIDE.sw = v; }, 300, [200, 560]);
  wire(ri, (ev) => { const r = $("info").getBoundingClientRect(); return SIDE.dockl ? ev.clientX - r.left : r.right - ev.clientX; }, (v) => { SIDE.iw = v; }, 340, [220, 760]);
}
ACT.t_plgo = (d) => { TG.plSel = d.p; TG.plMap = false; S.view = "places"; render(); };
function infoSources(p) {
  const ps = personSrc(S.db, p.id), out = new Map();
  for (const x of ps.parts) for (const s of x.ids) { const a = out.get(s) || []; if (!a.includes(x.label)) a.push(x.label); out.set(s, a); }
  return out;
}
function infoSourcesOld(p) {
  const out = new Map();
  const add = (ptr, ctx) => { if (!GED.isPtr(ptr) || !S.db.get(ptr)) return; const a = out.get(ptr) || []; if (ctx && !a.includes(ctx)) a.push(ctx); out.set(ptr, a); };
  for (const k of p.rec.kids) {
    if (k.tag === "SOUR") add(k.val, "Person");
    else if (GED.INDI_EVENTS[k.tag] || k.tag === "NAME") for (const s of GED.kidsOf(k, "SOUR")) add(s.val, GED.INDI_EVENTS[k.tag] || "Name");
  }
  for (const fid of p.fams) {
    const f = GED.famInfo(S.db, fid);
    for (const k of f.rec.kids) { if (k.tag === "SOUR") add(k.val, "Familie"); else if (GED.FAM_EVENTS[k.tag]) for (const s of GED.kidsOf(k, "SOUR")) add(s.val, GED.FAM_EVENTS[k.tag]); }
  }
  return out;
}

function applyZoom(kind, keepCenter) {

  const tz = sc.querySelector(".tz"), st = sc.querySelector(".tstage"), z = ZOOM[kind];
  const W = +tz.dataset.w, H = +tz.dataset.h;
  const cx = (sc.scrollLeft + sc.clientWidth / 2) / (tz.offsetWidth || 1), cy = (sc.scrollTop + sc.clientHeight / 2) / (tz.offsetHeight || 1);

function renderPed() { return VMODE.ped === "list" ? renderPedList() : VMODE.ped === "fan" ? renderPedFan() : renderPedTree(); }
const GEN_NAMES = ["Person", "Eltern", "Großeltern", "Urgroßeltern", "Ururgroßeltern"];
function renderPedList() {
  const db = S.db, N = S.gens, anc = GED.ancestors(db, S.pid, N);
  const opts = [3, 4, 5, 6, 7, 8, 10].map(n => `<option value="${n}"${n === N ? " selected" : ""}>${n}</option>`).join("");
  const rootKin = pedKin(S.pid);
  const byGen = new Map();
  anc.forEach((id, k) => { const g = Math.floor(Math.log2(k)); if (!byGen.has(g)) byGen.set(g, []); byGen.get(g).push([k, id]); });
  let body = "";
  [...byGen.keys()].sort((a, b) => a - b).forEach(g => {
    const rows = byGen.get(g).sort((a, b) => a[0] - b[0]);
    body += `<section class="agen"><h3>${g < GEN_NAMES.length ? GEN_NAMES[g] : g + ". Generation"} <span class="hint">(${rows.length}${g ? " von " + Math.pow(2, g) : ""})</span></h3><ul class="alist">`;
    for (const [k, id] of rows) {
      const p = GED.personInfo(db, id);
      const bp = p.birt && p.birt.place ? shortPlace(p.birt.place) : "", dp = p.deat && p.deat.place ? shortPlace(p.deat.place) : "";
      const role = g === 0 ? "" : k % 2 === 0 ? "Vater" : "Mutter";
      body += `<li class="arow ${p.sex}" data-id="${id}"><span class="kn" title="Kekulé-Nummer">${k}</span><span class="am"><button class="lk" data-act="pedgo" data-id="${id}">${E(GED.displayName(p.rec))}</button> <span class="sp">${sexSym(p.sex)} ${E(GED.lifeSpan(db, id))}</span>${role && g === 1 ? ` <span class="hint">${role}</span>` : ""}${bdBlock(db, id)}</span><button class="btn sm ghost" data-act="card" data-id="${id}" title="Familienblatt">Blatt</button></li>`;
    }
    body += `</ul></section>`;
  });

/* ---------- gemeinsames Layout für Kästen (vier Richtungen) ---------- */
function layoutTree(items, edges, ori, slots) {
  const BW = 214, GX = 46, GY = 8, BH = 48, VG = 44, vert = ori === "TB" || ori === "BT";
  const G = items.reduce((m, i) => Math.max(m, i.g), 0) + 1, lvlH = new Array(G).fill(BH), gOf = new Map();
  let maxH = BH;
  for (const it of items) { gOf.set(it.key, it.g); if (it.h > maxH) maxH = it.h; if (it.h > lvlH[it.g]) lvlH[it.g] = it.h; }
  const pos = new Map(); let W, H; const tops = [];
  if (!vert) {
    const pitch = maxH + GY; W = G * BW + (G - 1) * GX; H = Math.max(1, slots) * pitch;
    for (const it of items) pos.set(it.key, { left: ori === "LR" ? it.g * (BW + GX) : W - BW - it.g * (BW + GX), top: Math.round(it.c * pitch - it.h / 2), h: it.h });
  } else {
    const pitch = BW + 12; let y = 0;
    for (let g = 0; g < G; g++) { tops.push(y); y += lvlH[g] + VG; }

}

  return h;

/* Knöpfe in den eingebetteten Ansichten bleiben in der geteilten Ansicht */

/* Trenner zwischen den Bereichen */
document.addEventListener("pointerdown", (e) => {

  const up = () => { rz.classList.remove("drag"); document.body.classList.remove("rzing"); rz.removeEventListener("pointermove", mv); rz.removeEventListener("pointerup", up); rz.removeEventListener("pointercancel", up); splSave(); };
  rz.addEventListener("pointermove", mv); rz.addEventListener("pointerup", up); rz.addEventListener("pointercancel", up);
});

  SPL.w = Math.max(280, Math.min(sp.getBoundingClientRect().width - 280, cur + (e.key === "ArrowRight" ? 24 : -24))); sp.style.setProperty("--spw", SPL.w + "px"); splSave();
});

/* ============ ZWEI DATEIEN: einzelne Personen aus einer zweiten Datei übernehmen ============
   Links die Hauptdatei (wird bearbeitet), rechts die zweite Datei (nur lesend). Übernommen wird immer genau eine Person
   mit ihren eigenen Angaben, Quellen, Notizen und Medienverweisen, nie ihre Familie. Wohin sie gehört (Kind, Elternteil,
   Partner), legt man beim Ablegen fest. Die zweite Datei teilt sich den Zustand mit dem Abgleich (CMP). */
const TWO = { sel: null, q: "", limit: 80, src: "", drag: null, done: new Map() };
const TW_SKIP = new Set(["FAMC", "FAMS", "CHAN", "REFN", "_UID", "RIN", "AFN", "ASSO", "_MTTAG"]);       // wird nicht mitkopiert
const TW_NONEVENT = new Set(["NAME", "SEX", "FAMC", "FAMS", "SOUR", "NOTE", "OBJE", "CHAN", "REFN", "RIN", "RFN", "AFN", "_UID", "ASSO", "SUBM", "ALIA", "ANCI", "DESI", "RESN", "_MTTAG"]);
const twIsRef = (v) => /^@[^@\s]+@$/.test(v || "");
const twBase = (n) => String(n || "").replace(/\.(ged|gedcom|txt)$/i, "");

/* ---------- Kopieren ---------- */
function twMapRec(tx, ptr, cache) {
  if (cache.has(ptr)) return cache.get(ptr);
  const sr = CMP.db.get(ptr);
  let out = null;
  if (sr && ["SOUR", "REPO", "NOTE", "OBJE"].includes(sr.tag)) {
    // gleiche Quelle oder gleiches Archiv gibt es in der Zieldatei vielleicht schon
    if (sr.tag === "SOUR" || sr.tag === "REPO") {
      const nameOf = (r) => GED.unesc(GED.kval(r, "TITL") || GED.kval(r, "ABBR") || GED.kval(r, "NAME") || "");
      const key = cf(nameOf(sr));
      if (key) { const ex = S.db.ofTag(sr.tag).find(r => cf(nameOf(r)) === key); if (ex) out = ex.xref; }
    }
    if (!out) {
      const nr = tx.create(sr.tag, { SOUR: "S", REPO: "R", NOTE: "N", OBJE: "O" }[sr.tag]);
      cache.set(ptr, nr.xref);
      nr.val = sr.val;
      nr.kids = twCopyKids(tx, sr.kids, cache, new Set(["CHAN"]));
      out = nr.xref;
    }
  }
  cache.set(ptr, out);
  return out;
}
function twCopyKids(tx, kids, cache, skip) {
  const out = [];
  for (const k of kids) {
    if (skip && skip.has(k.tag)) continue;
    let val = k.val;
    if (twIsRef(val)) { val = twMapRec(tx, val, cache); if (!val) continue; }   // Verweise auf Personen oder Familien fallen weg
    out.push({ tag: k.tag, val, kids: twCopyKids(tx, k.kids, cache) });
  }
  return out;
}
function twFileSource(tx, title) {
  const key = cf(title);
  let s = S.db.ofTag("SOUR").find(r => cf(GED.unesc(GED.kval(r, "TITL") || "")) === key);
  if (!s) { s = tx.create("SOUR", "S"); s.kids.push({ tag: "TITL", val: GED.esc(title), kids: [] }); }
  return s.xref;
}
function twClonePerson(tx, bId, srcTitle) {
  const B = CMP.db.get(bId);
  const rec = tx.create("INDI", "I");
  rec.kids = twCopyKids(tx, B.kids, new Map(), TW_SKIP);
  if (srcTitle) {
    const sp = twFileSource(tx, srcTitle);
    for (const k of rec.kids) {
      if (TW_NONEVENT.has(k.tag)) continue;
      if (!k.kids.some(c => c.tag === "SOUR" && c.val === sp)) k.kids.push({ tag: "SOUR", val: sp, kids: [] });
    }
    if (!rec.kids.some(k => k.tag === "SOUR" && k.val === sp)) rec.kids.push({ tag: "SOUR", val: sp, kids: [] });
  }
  return rec;
}

/* ---------- Anhängen ---------- */
const twFamsOf = (rec, tag) => GED.kidsOf(rec, tag).map(n => n.val).filter(v => S.db.get(v) && S.db.get(v).tag === "FAM");
function twParentSlot(targetId, newSex) {
  const T = S.db.get(targetId);
  const fams = twFamsOf(T, "FAMC");
  const want = newSex === "F" ? "WIFE" : newSex === "M" ? "HUSB" : null;
  if (!fams.length) return { ok: true, fam: null, role: want || "HUSB" };
  const f = S.db.get(fams[0]);
  const role = want || (!GED.kval(f, "HUSB") ? "HUSB" : "WIFE");
  if (GED.kval(f, role)) return { ok: false, text: role === "HUSB" ? "Beim Ziel ist schon ein Vater eingetragen." : "Beim Ziel ist schon eine Mutter eingetragen." };
  return { ok: true, fam: f.xref, role };
}
function twAttach(tx, rec, rel, targetId, famId) {
  if (rel === "none") return;
  const T = S.db.get(targetId), sexN = GED.kval(rec, "SEX"), sexT = GED.kval(T, "SEX");
  if (rel === "child") {
    const mine = twFamsOf(T, "FAMS");
    let fam = famId === "new" ? null : S.db.get(famId) && mine.includes(famId) ? S.db.get(famId) : mine.length ? S.db.get(mine[0]) : null;
    if (!fam) fam = GED.addFamily(tx, sexT === "F" ? null : targetId, sexT === "F" ? targetId : null);
    GED.addChild(tx, fam.xref, rec.xref);
  } else if (rel === "parent") {
    const slot = twParentSlot(targetId, sexN);
    if (!slot.ok) throw new Error(slot.text);
    if (slot.fam) GED.setSpouse(tx, slot.fam, slot.role, rec.xref);
    else { const fam = GED.addFamily(tx, slot.role === "HUSB" ? rec.xref : null, slot.role === "WIFE" ? rec.xref : null); GED.addChild(tx, fam.xref, targetId); }
  } else if (rel === "spouse") {
    const newIsWife = sexN === "F" || (sexN !== "M" && sexT !== "F");
    const role = newIsWife ? "WIFE" : "HUSB";
    const free = twFamsOf(T, "FAMS").find(f => !GED.kval(S.db.get(f), role));
    if (free) GED.setSpouse(tx, free, role, rec.xref);
    else GED.addFamily(tx, newIsWife ? targetId : rec.xref, newIsWife ? rec.xref : targetId);
  }
}
const TW_REL = { none: "als neue Person angelegt", child: "als Kind angehängt", parent: "als Elternteil angehängt", spouse: "als Partner angehängt" };

/* ---------- Dubletten ---------- */
function twCandidates(bId) {
  const b = cpInfo(CMP.db, bId), out = [];
  for (const r of S.db.ofTag("INDI")) {
    const p = GED.personInfo(S.db, r.xref);
    if (cf(p.name.surn) !== b.surn) continue;
    const sc = cpScore(cpInfo(S.db, r.xref), b);
    if (sc >= 3) out.push({ id: r.xref, sc });
  }
  out.sort((x, y) => y.sc - x.sc);
  return out.slice(0, 6);
}
const twCount = (n, tag) => n.kids.reduce((s, k) => s + (k.tag === tag ? 1 : 0) + twCount(k, tag), 0);

/* ---------- Dialog „Person übernehmen“ ---------- */
function openTakeDlg(bId, o) {
  o = o || {};
  if (!needDb() || S.viewer || !CMP.db || !CMP.db.get(bId)) return;
  const cands = twCandidates(bId);
  const D0 = { b: bId, rel: o.rel || "child", target: o.target || (S.pid && S.db.get(S.pid) ? S.pid : null), fam: "", srcOn: !!TWO.src.trim(), srcTitle: TWO.src, ack: false, err: "" };
  if (!D0.target) D0.rel = "none";
  return openDlg({
    title: "Person aus der zweiten Datei übernehmen", wide: true, noFocus: true, data: D0,
    body: (d) => {
      const D = d.data, B = GED.personInfo(CMP.db, D.b), brec = CMP.db.get(D.b);
      const T = D.target && S.db.get(D.target) ? GED.personInfo(S.db, D.target) : null;
      const sexN = B.sex;
      const tName = T ? `<b>${E(GED.displayName(T.rec))}</b> <span class="w">${E(GED.lifeSpan(S.db, T.id))}</span>` : "";
      let h = `<h3 style="margin-top:0">${E(GED.displayName(brec))} <span class="w">${E(GED.lifeSpan(CMP.db, D.b))}</span></h3>
        <div class="hint" style="margin-bottom:8px">Übernommen werden nur die eigenen Angaben dieser Person: ${twCount(brec, "SOUR")} Quellenverweis(e), ${twCount(brec, "NOTE")} Notiz(en), ${twCount(brec, "OBJE")} Medienverweis(e). Familie, Eltern, Partner und Kinder bleiben in der zweiten Datei.</div>${cpFieldsOnly(D.b)}`;
      if (cands.length) {
        h += `<div class="panel" style="border-color:var(--warn)"><h4 style="color:var(--warn)">Ähnliche Personen in ${E(S.fileName)}</h4>
          <ul class="cites">${cands.map(c => `<li>${cpPerson(S.db, c.id)} <button class="btn sm" data-d="cmp" data-a="${c.id}">Angaben vergleichen</button> <button class="btn sm" data-d="seeA" data-a="${c.id}">Anzeigen</button></li>`).join("")}</ul>
          <label class="chk"><input type="checkbox" id="twack"${D.ack ? " checked" : ""}> Ich habe geprüft: Das ist keine Dublette, die Person soll trotzdem neu angelegt werden.</label></div>`;
      }
      const par = T ? twParentSlot(T.id, sexN) : { ok: false, text: "" };
      const rad = (v, label, dis, why) => `<label class="chk"><input type="radio" name="twrel" value="${v}"${D.rel === v ? " checked" : ""}${dis ? " disabled" : ""}> ${label}${dis && why ? ` <span class="hint">(${E(why)})</span>` : ""}</label>`;
      h += `<div class="panel"><h4>Wohin gehört die Person?</h4>`;
      h += rad("none", "Nur als neue Person anlegen (ohne Verbindung)", false);
      if (T) {
        let famSel = "";
        if (T.fams.length > 1) famSel = ` <select id="twfam">${T.fams.map(f => { const sp = GED.spouseIn(S.db, f, T.id); return `<option value="${f}"${D.fam === f || (!D.fam && f === T.fams[0]) ? " selected" : ""}>mit ${E(sp && S.db.get(sp) ? GED.displayName(S.db.get(sp)) : "unbekanntem Partner")}</option>`; }).join("")}<option value="new"${D.fam === "new" ? " selected" : ""}>in neuer Familie ohne Partner</option></select>`;
        else if (T.fams.length === 1) { const sp = GED.spouseIn(S.db, T.fams[0], T.id); famSel = ` <span class="hint">in der Familie mit ${E(sp && S.db.get(sp) ? GED.displayName(S.db.get(sp)) : "unbekanntem Partner")}</span>`; }
        else famSel = ` <span class="hint">(es wird eine neue Familie angelegt)</span>`;
        h += rad("child", `Als Kind von ${tName}${D.rel === "child" ? famSel : ""}`, false);
        h += rad("parent", `Als Elternteil von ${tName}`, !par.ok, par.text);
        h += rad("spouse", `Als Partner von ${tName}`, false);
      } else h += `<div class="hint">Wähle eine Zielperson, um die Person als Kind, Elternteil oder Partner anzuhängen.</div>`;
      h += `<div style="margin-top:8px"><button class="btn sm" data-d="pick">${T ? "Andere Zielperson wählen" : "Zielperson wählen"}</button></div></div>`;
      h += `<div class="panel"><h4>Quelle</h4><label class="chk"><input type="checkbox" id="twsrcon"${D.srcOn ? " checked" : ""}> Diese Quelle an die übernommenen Angaben hängen:</label>
        <input id="twsrct" class="fld" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)" value="${E(D.srcTitle)}" placeholder="zum Beispiel der Name der PDF-Datei">
        <div class="hint">Sie wird an die Person und an jedes übernommene Ereignis gehängt und nur einmal angelegt. Quellen, die die Person in der zweiten Datei schon hat, werden zusätzlich mitkopiert.</div></div>`;
      return h + (D.err ? `<div class="err">${E(D.err)}</div>` : "");
    },
    buttons: () => [{ id: "take", label: "Übernehmen", cls: "pri" }, { id: "close", label: "Abbrechen" }],
    onChange: (d, e) => {
      const D = d.data, t = e.target;
      if (t.name === "twrel") { D.rel = t.value; D.err = ""; d.paint(); }
      else if (t.id === "twfam") D.fam = t.value;
      else if (t.id === "twack") D.ack = t.checked;
      else if (t.id === "twsrcon") D.srcOn = t.checked;
    },
    onInput: (d, e) => { if (e.target.id === "twsrct") d.data.srcTitle = e.target.value; },
    on: {
      pick: (d) => pickPerson({ title: "Zielperson in " + S.fileName, onPick: (id) => { d.data.target = id; d.data.fam = ""; if (d.data.rel === "none") d.data.rel = "child"; d.paint(); } }),
      cmp: (d, t) => { CMP.sel = { a: t.dataset.a, b: d.data.b }; openCompare(); },
      seeA: (d, t) => { d.close(); S.view = "card"; go(t.dataset.a); },
      take: (d) => {
        const D = d.data;
        D.srcTitle = (d.q("#twsrct") ? d.q("#twsrct").value : D.srcTitle);
        if (cands.length && !D.ack) { D.err = "Bitte bestätige zuerst, dass es keine Dublette ist."; d.paint(); return; }
        if (D.rel !== "none" && !(D.target && S.db.get(D.target))) { D.err = "Bitte eine Zielperson wählen."; d.paint(); return; }
        const title = D.srcOn ? D.srcTitle.trim() : "";
        let newId, name;
        try {
          GED.run(S.db, "Aus zweiter Datei übernommen", tx => {
            const rec = twClonePerson(tx, D.b, title);
            newId = rec.xref; name = GED.displayName(rec);
            twAttach(tx, rec, D.rel, D.target, D.fam);
          });
        } catch (e) { D.err = e.message || String(e); d.paint(); return; }
        TWO.src = D.srcOn ? title : TWO.src;
        TWO.done.set(D.b, newId);
        d.close();
        if (D.rel === "none" || !D.target) { S.pid = newId; S.fid = setFamFor(newId); }
        afterEdit(name + " " + TW_REL[D.rel] + (D.rel !== "none" ? " an " + GED.displayName(S.db.get(D.target)) : "") + ". Mit Rückgängig lässt sich das zurücknehmen.");
        twPaintR();
      }
    }
  });
}

/* ---------- Ansicht ---------- */
function twRow(id) {
  const db = CMP.db, p = GED.personInfo(db, id);
  const done = TWO.done.get(id);
  return `<span class="twrow${TWO.sel === id ? " sel" : ""}" draggable="true" data-two="${id}" data-act="twoSel" data-b="${id}" title="Anklicken zum Ansehen, auf eine Person links ziehen zum Übernehmen"><span class="sx">${sexSym(p.sex)}</span> ${E(GED.displayName(p.rec))} <span class="w">${E(bdShort(db, id) || GED.lifeSpan(db, id))}</span>${done && S.db.get(done) ? ` <span class="twdone" title="Schon übernommen">✓</span>` : ""}</span>`;
}
function twListHtml() {
  const rows = GED.searchPersons(CMP.db, TWO.q, TWO.limit + 1);
  const more = rows.length > TWO.limit;
  return (rows.slice(0, TWO.limit).map(r => `<div>${twRow(r.id)}</div>`).join("") || `<div class="hint" style="padding:8px">Nichts gefunden.</div>`) + (more ? `<div style="padding:6px"><button class="btn sm" data-act="twoMore">Mehr anzeigen</button></div>` : "");
}
function twDetHtml() {
  const db = CMP.db;
  if (!TWO.sel || !db.get(TWO.sel)) return `<div class="hint" style="padding:8px">Wähle eine Person aus der Liste. Dann siehst du hier ihre Angaben und ihre Angehörigen.</div>`;
  const id = TWO.sel, B = GED.personInfo(db, id), par = GED.parentsOf(db, id);
  const rel = (label, ids) => ids.length ? `<div class="twrel"><b>${label}</b> ${ids.map(x => twRow(x)).join(" ")}</div>` : "";
  const parents = par ? [par.father, par.mother].filter(x => x && db.get(x)) : [];
  let h = `<div class="twhead"><span class="twrow big" draggable="true" data-two="${id}" title="Auf eine Person links ziehen"><span class="sx">${sexSym(B.sex)}</span> <b>${E(GED.displayName(B.rec))}</b> <span class="w">${E(GED.lifeSpan(db, id))}</span></span>
    <button class="btn sm pri" data-act="twoTake" data-b="${id}">Übernehmen …</button></div>`;
  h += bdBlock(db, id, true);
  h += cpFieldsOnly(id);
  h += rel("Eltern", parents);
  for (const f of B.fams) {
    const fi = GED.famInfo(db, f), sp = GED.spouseIn(db, f, id);
    h += rel("Partner", sp && db.get(sp) ? [sp] : []) + rel("Kinder", fi.children.filter(c => db.get(c)));
  }
  return h;
}
function twPaintR() {
  const l = $("twoList"), d = $("twoDet");
  if (!l || !d || !CMP.db) return;
  const sc = l.scrollTop;
  l.innerHTML = twListHtml(); l.scrollTop = sc;
  d.innerHTML = twDetHtml();

const CAR = { open: false, pos: 0, n: 0, views: [], cw: 190, R: 0, step: 0, ov: null, drag: null, wheelT: 0, from: null };

function carViews() {

function whenGIS(ms) {
  return new Promise((res, rej) => {
    const t0 = Date.now();
    (function poll() {
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      if (Date.now() - t0 > ms) return rej(new Error("Die Google-Anmeldung konnte nicht geladen werden. Läuft die Seite über https und bist du online?"));
      setTimeout(poll, 100);
    })();
  });
}
function initTokenClient() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: (resp) => {
      if (resp && resp.access_token) { accessToken = resp.access_token; if (tokenResolve) tokenResolve(resp); }
      else if (tokenReject) tokenReject(resp);
      tokenResolve = tokenReject = null;
    },
    error_callback: (err) => { if (tokenReject) tokenReject(err); tokenResolve = tokenReject = null; }
  });
}
function requestToken(interactive) {
  if (!tokenClient) return Promise.reject(new Error("tokenClient not initialized"));
  return new Promise((res, rej) => {
    tokenResolve = res; tokenReject = rej;
    try { tokenClient.requestAccessToken({ prompt: "" }); } catch (e) { rej(e); }
  });
}

async function api(url, opts = {}, retried = false) {
  opts.headers = Object.assign({ Authorization: "Bearer " + accessToken, "Content-Type": "application/json" }, opts.headers || {});
  const r = await fetch(url, opts);
  if (r.status === 401 && !retried) {
    try { await requestToken(false); } catch (e) { toast("Bitte melde dich erneut an"); await requestToken(true); }
    opts.headers.Authorization = "Bearer " + accessToken;
    return api(url, opts, true);
  }
  if (!r.ok) { const txt = await r.text(); throw new Error("Drive " + r.status + ": " + txt.slice(0, 300)); }

  return r.json();
}

async function restoreMediaFromDrive(onProg) {
  if (!FS.dirOk) throw new Error("Dieser Browser kann keinen Ordner beschreiben. Nutze Chrome oder Edge.");
  let dir;
  try { dir = await window.showDirectoryPicker({ mode: "readwrite", id: "stammbaum-medien-neu" }); } catch (e) { return null; }
  const list = await driveMediaList();
  const tops = new Set(list.map(x => x.rel[0]));
  const strip = tops.size === 1 && list.every(x => x.rel.length > 1);
  const st = { total: list.length, done: 0, written: 0, same: 0, failed: [] };
  let i = 0;
  async function worker() {
    while (i < list.length) {
      const e = list[i++];
      try {
        let segs = (strip ? e.rel.slice(1) : e.rel).filter(x => x !== ".." && !/[\/\\]/.test(x));
        if (!segs.length) segs = [e.name];
        let d = dir;
        for (const sg of segs.slice(0, -1)) d = await d.getDirectoryHandle(sg, { create: true });
        const fname = segs[segs.length - 1];
        let have = null;
        try { have = await (await d.getFileHandle(fname)).getFile(); } catch (x) {}
        if (have && have.size === e.size) st.same++;
        else {
          const bytes = await driveRead(e.id);
          const fh = await d.getFileHandle(fname, { create: true });
          const w = await fh.createWritable(); await w.write(bytes); await w.close();
          st.written++;
        }
      } catch (err) { st.failed.push(e.rel.join("/") + " (" + String(err.message || err).slice(0, 80) + ")"); }
      st.done++;
      if (onProg && (st.done % 4 === 0 || st.done === st.total)) onProg(Object.assign({}, st));
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  let known = false;
  for (const x of LM.dirs) { try { if (await x.isSameEntry(dir)) known = true; } catch (e) {} }
  if (!known) { LM.dirs.push(dir); lmSync(); await lmSave(); }
  await lmScan();
  let zus = null;

  st.zus = zus; st.dir = dir.name; st.top = strip ? [...tops][0] : "";

  return st;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (S.viewer && !VIEW_OK.has(el.dataset.act) && !/^(t_|v)/.test(el.dataset.act)) return;

/* Doppelklick öffnet überall das Bearbeiten der Person unter dem Mauszeiger (sonst der gewählten Person).
   Eigene Erkennung über Zeit und Ort zweier Klicks, weil die Ansichten beim ersten Klick neu aufgebaut werden
   und der Browser dann kein dblclick-Ereignis mehr meldet. */
const LASTCLK = { id: null, t: 0, x: 0, y: 0 };
const personIdOf = (el) => { const x = el && el.closest && el.closest("[data-id]"); const id = x && x.dataset.id; const r = id && S.db && S.db.get(id); return r && (r.tag === "INDI" || (r.tag === "SOUR" && !x.closest(".twoR"))) ? id : null; };
const editRec = (id) => { const r = S.db.get(id); if (!r) return false; if (r.tag === "SOUR") { editSrc(id); return true; } if (GED.personInfo(S.db, id)) { editPerson(id); return true; } return false; };
document.addEventListener("click", (e) => {
  if (!S.db || e.target.closest(".ovl")) return;
  const t = e.target;
  const area = t.closest("#content, #plist, #info");
  const id = personIdOf(t);
  const blocked = t.closest("input, textarea, select, label, .ar, .parrows, .treebar, .splbar, .rz, #info .ihead, .abc, .tabs, .top") || (!id && t.closest("button, a, [data-act], summary"));
  const now = e.timeStamp;   // Zeitpunkt des Klicks selbst, nicht der Verarbeitung (ein langsamer Neuaufbau verzögert diese)
  const dbl = LASTCLK.t && now - LASTCLK.t < 600 && Math.abs(e.clientX - LASTCLK.x) < 10 && Math.abs(e.clientY - LASTCLK.y) < 10;
  if (dbl && area && !blocked && !S.viewer) {
    const target = LASTCLK.id || id || (t.closest("#content") ? S.pid : null);
    LASTCLK.t = 0;
    if (target && S.db.get(target) && (S.db.get(target).tag === "SOUR" || GED.personInfo(S.db, target))) {
      e.stopPropagation(); e.preventDefault();
      const sel = window.getSelection && window.getSelection(); if (sel && sel.removeAllRanges) sel.removeAllRanges();
      editRec(target);
      return;
    }
  }
  LASTCLK.id = id; LASTCLK.t = now; LASTCLK.x = e.clientX; LASTCLK.y = e.clientY;
}, true);
/* Fallback: meldet der Browser trotzdem ein dblclick und es ist noch kein Dialog offen, wird bearbeitet */
document.addEventListener("dblclick", (e) => {
  if (!S.db || S.viewer || document.querySelector(".ovl")) return;
  const t = e.target;
  if (!t.closest("#content, #plist, #info") || t.closest("input, textarea, select, label, .ar, .parrows, .treebar, .splbar, .rz, #info .ihead, .abc, .tabs, .top")) return;
  if (!personIdOf(t) && t.closest("button, a, [data-act], summary")) return;
  const id = personIdOf(t) || LASTCLK.id || (t.closest("#content") ? S.pid : null);
  if (id) editRec(id);
});
document.addEventListener("change", (e) => {

$("btnOpen").onclick = () => openLocalPicker();

document.addEventListener("keydown", (e) => {

const HM = { on: lsGet("st.hm", "0") === "1" };
function hmApply() {
  const b = $("btnHm"); if (!b) return;
  const show = !!S.db;
  b.hidden = !show;

}

{ const _r = render; render = function () { const r = _r.apply(this, arguments); hmApply(); return r; }; }

/* ============ AUTOMATISCHES SPEICHERN ============
   Stufe 1: Hängt die Hauptdatei direkt an einer lokalen Datei (Dateizugriff), wird sie nach kurzer Ruhe still überschrieben,
            mit Rücklesekontrolle. Der Stand von der Platte wird als Vorversion aufbewahrt (zu Beginn und danach höchstens alle 30 Minuten).
   Stufe 2: Immer wird zusätzlich ein Entwurf im Browser abgelegt. Er erscheint beim nächsten Start zur Wiederherstellung, solange nichts gespeichert ist. */
const AS_IDLE = 3500, AS_VER_EVERY = 30 * 60000;
async function asLoadDrafts() { const d = await IDB.get("drafts"); AS.drafts = Array.isArray(d) ? d : []; if (!S.db && !S.viewer && !document.getElementById("vdata") && AS.drafts.length) render(); }
async function asStoreDrafts() { await IDB.set("drafts", AS.drafts); }
async function asWriteDraft() {
  const c = S.db.changeCount, text = exportBlobText();
  AS.drafts = AS.drafts.filter(x => x.name !== S.fileName);
  AS.drafts.unshift({ name: S.fileName, at: Date.now(), text, n: S.db.ofTag("INDI").length });
  AS.drafts = AS.drafts.slice(0, 3);
  await asStoreDrafts();
  AS.draftCount = c; AS.draftOf = S.fileName;
}
async function asClearDraft(name) {
  if (!AS.drafts.some(x => x.name === name)) return;
  AS.drafts = AS.drafts.filter(x => x.name !== name);
  await asStoreDrafts();
  AS.draftCount = -1;
}
function asPause(msg) { if (AS.paused !== msg) { AS.paused = msg; if (S.db) updateTop(); } }
async function asSaveFile() {
  const h = S.fileHandle;
  let perm = "denied"; try { perm = await h.queryPermission({ mode: "readwrite" }); } catch (e) {}
  if (perm !== "granted") return asPause("Der Browser hat den Schreibzugriff nicht mehr erlaubt. Klicke einmal auf „In Datei speichern“.");
  const cur = await h.getFile();
  if (cur.lastModified !== S.localMod || cur.size !== S.localSize) return asPause("Die Datei wurde außerhalb geändert. Automatisch wird nichts überschrieben. Klicke auf „In Datei speichern“ und entscheide.");
  const sum = changeSummary();
  if (sum.o.indi && (sum.o.indi - sum.indi) / sum.o.indi > 0.05) return asPause("Es sind deutlich weniger Personen als beim Laden. Automatisch wird nicht überschrieben. Prüfe unter Details und speichere dann von Hand.");
  const count = S.db.changeCount, n = sum.changed.length + sum.added.length + sum.deleted.length;
  if (!AS.verAt || Date.now() - AS.verAt > AS_VER_EVERY) { await verPush(cur.name, new Uint8Array(await cur.arrayBuffer()), cur.lastModified); AS.verAt = Date.now(); }
  const blob = new Blob([exportBlobText()], { type: "text/plain;charset=utf-8" });
  const w = await h.createWritable(); await w.write(blob); await w.close();
  const after = await h.getFile();
  const sent = new Uint8Array(await blob.arrayBuffer()), back = new Uint8Array(await after.arrayBuffer());
  if (back.length !== sent.length || !sent.every((v, i) => v === back[i])) throw new Error("Die gespeicherte Datei weicht von dem ab, was geschrieben werden sollte. Die Vorversion ist unter „Mehr“, „Lokale Dateien und Sicherung“ abrufbar.");
  S.localMod = after.lastModified; S.localSize = after.size;
  S.savedMark = count;
  S.lastSave = { at: Date.now(), target: "local", name: after.name, size: blob.size, verified: true, n, auto: true };
  AS.paused = ""; AS.ok++;
  await asClearDraft(S.fileName);
  updateTop();
  if (typeof bkDue === "function" && bkDue() && accessToken) runBackup().then(backupToast);
}
async function asTick(force) {
  if (!S.db || S.viewer || AS.busy) return;
  const c = S.db.changeCount;
  if (c !== AS.lastCount) { AS.lastCount = c; AS.lastChange = Date.now(); }
  if (!isDirty()) return;
  if (!force && Date.now() - AS.lastChange < AS_IDLE) return;
  if (_lsaving || (typeof _saving !== "undefined" && _saving)) return;
  AS.busy = true;
  try {
    if (AS.draftCount !== c || AS.draftOf !== S.fileName) await asWriteDraft();
    if (AS.on && S.fileHandle) {
      try { await asSaveFile(); AS.failAt = 0; }
      catch (e) {
        asPause("Automatisches Speichern ist fehlgeschlagen: " + (e && e.message || e) + " Dein Stand liegt als Entwurf im Browser.");
        if (Date.now() - AS.failAt > 120000) { AS.failAt = Date.now(); toast("Automatisches Speichern in die Datei ist fehlgeschlagen. Details in der Statuszeile.", 6000); }
      }
    }
  } catch (e) { asPause("Der Entwurf im Browser konnte nicht abgelegt werden: " + (e && e.message || e)); }
  finally { AS.busy = false; }
}
setInterval(() => { asTick(false); }, 1500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") asTick(true); });
window.addEventListener("pagehide", () => { asTick(true); });
/* wurde zwischenzeitlich anders gespeichert (Download oder von Hand), ist der Entwurf überflüssig */
setInterval(() => { if (S.db && !isDirty() && AS.draftOf === S.fileName && AS.drafts.some(x => x.name === S.fileName)) asClearDraft(S.fileName); }, 4000);
/* Hinweis für die Statuszeile */
function asNote() {
  if (!S.db || S.viewer) return "";
  if (AS.paused) return `<span class="stwarn" style="display:block;margin-top:3px">${E(AS.paused)}</span>`;
  return "";
}
function asState() {
  if (S.fileHandle) return AS.on ? "Automatisch speichern: an" : "Automatisch speichern: aus";
  return "Entwurf im Browser: an";
}
ACT.asToggle = () => {
  if (!S.fileHandle) { toast("Ohne direkt verbundene Datei wird alles als Entwurf im Browser gehalten. Zum Sichern: Mehr, Lokale Dateien und Sicherung, Speichern unter …", 7000); return; }
  AS.on = !AS.on; lsSet("st.autosave", AS.on ? "1" : "0"); AS.paused = "";
  toast(AS.on ? "Automatisches Speichern ist an." : "Automatisches Speichern ist aus. Speichere mit „In Datei speichern“.", 4000);
  updateTop(); if (AS.on) asTick(true);
};
/* Wiederherstellung auf der Startseite */
function asWelcomeHtml() {
  if (!AS.drafts.length) return "";
  return `<div class="panel" style="margin-top:14px"><h4 style="margin-top:0">Nicht gespeicherte Änderungen gefunden</h4>
    <div class="hint">Beim letzten Mal wurde nicht alles in die Datei gespeichert. Diese Entwürfe liegen noch in diesem Browser:</div>
    ${AS.drafts.map((d, i) => `<div style="margin-top:8px"><b>${E(d.name)}</b> vom ${E(new Date(d.at).toLocaleString("de-DE"))} (${d.n} Personen) <button class="btn sm pri" data-act="asRestore" data-i="${i}">Wiederherstellen</button> <button class="btn sm ghost" data-act="asDrop" data-i="${i}">Verwerfen</button></div>`).join("")}</div>`;
}
ACT.asRestore = async (d) => {
  const x = AS.drafts[+d.i]; if (!x) return;
  const bytes = new TextEncoder().encode(x.text);
  if (await loadBuffer(bytes.buffer, x.name, "local", null)) {
    S.savedMark = -1; AS.draftCount = -1; AS.draftOf = null; updateTop();
    toast("Entwurf wiederhergestellt. Speichere jetzt mit „Als .ged speichern“, oder über Mehr, Lokale Dateien und Sicherung, Speichern unter …, um wieder direkt in eine Datei zu schreiben.", 9000);
  }
};
ACT.asDrop = async (d) => {
  const x = AS.drafts[+d.i]; if (!x) return;
  if (!(await confirmDlg({ title: "Entwurf verwerfen?", text: `Der Entwurf „${x.name}“ vom ${new Date(x.at).toLocaleString("de-DE")} wird gelöscht. Das lässt sich nicht rückgängig machen.`, ok: "Verwerfen", cls: "dng" }))) return;
  AS.drafts.splice(+d.i, 1); await asStoreDrafts(); render();
};
asLoadDrafts();
