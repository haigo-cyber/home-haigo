<style>
  :root { --bg:#0d1016; --surface:#141922; --surface2:#1a202b; --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.15);
          --text:#eef1f5; --muted:#99a3b1; --light:#eef1f6; --ink:#10131a; --qa:#7cc4f7; --good:#5fd06f; --bad:#ff6b5e; --warn:#f2a900; --ufs:1;
          --f1:#ff7a8a; --f2:#ffa05c; --f3:#ffd95c; --f4:#7fe08a; --f5:#5fd6d6; --f6:#6cb6ff; --f7:#a58bff; --f8:#f08bd8; --f9:#c3c8d0; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { font-size:calc(clamp(14px, min(0.45vw + 9.6px, 1.35vh + 6px), 34px) * var(--ufs)); }
  body { margin:0; min-height:100vh; font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--text);
         background:radial-gradient(58rem 30rem at 85% -8%, rgba(86,120,196,.17), transparent 62%), radial-gradient(46rem 29rem at 0% 105%, rgba(140,100,220,.08), transparent 60%), var(--bg) fixed; }
  .wrap { max-width:64rem; margin:0 auto; padding:.8rem; }
  button { font-family:inherit; font-size:1rem; background:rgba(255,255,255,.06); border:1px solid var(--hair); border-radius:.6rem; padding:.45rem .9rem; color:var(--text); cursor:pointer; transition:background .15s, border-color .15s, transform .05s; }
  button:hover { background:rgba(255,255,255,.12); border-color:var(--hair2); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.35; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--qa); outline-offset:2px; }
  input, select, textarea { font-family:inherit; font-size:1rem; color:var(--text); background:var(--surface2); border:1px solid var(--hair2); border-radius:.6rem; padding:.45rem .7rem; }
  textarea { width:100%; min-height:8rem; resize:vertical; }
  .card { background:var(--surface); border:1px solid var(--hair); border-radius:1rem; padding:1rem 1.1rem; margin-bottom:.9rem; }
  .muted { color:var(--muted); }
  .small { font-size:.88rem; }
  h2 { font-size:1.25rem; margin:.2rem 0 .5rem; }

  /* Kopfzeile */
  .top { display:flex; align-items:center; gap:.8rem; margin-bottom:.8rem; flex-wrap:wrap; }
  .logo { width:2.8rem; height:2.8rem; border-radius:.6rem; flex:none; }
  .ttl { flex:1; min-width:11rem; }
  .ttl h1 { margin:0; font-size:1.45rem; line-height:1.15; }
  .ttl p { margin:.1rem 0 0; color:var(--muted); font-size:.9rem; }
  .rankpill { display:flex; align-items:center; gap:.55rem; padding:.3rem .8rem; border-radius:999px; border:1.5px solid var(--qa); color:var(--qa); font-weight:700; font-size:.92rem; background:rgba(255,255,255,.04); }
  .rankpill svg { width:1.4rem; height:1.5rem; }
  .icon-btn { width:2.6rem; height:2.6rem; padding:0; display:inline-flex; align-items:center; justify-content:center; font-size:1.2rem; border-radius:.7rem; }

  /* Reiter */
  .tabs { display:flex; flex-wrap:wrap; gap:.45rem; margin:0 0 .8rem; }
  .tab { background:rgba(255,255,255,.05); border:1px solid var(--hair); border-radius:999px; padding:.5rem 1.1rem; font-size:1.05rem; }
  .tab[aria-selected="true"] { background:var(--light); color:var(--ink); border-color:transparent; font-weight:700; }

  /* Wortfeld-Auswahl */
  .chips { display:flex; flex-wrap:wrap; gap:.45rem; }
  .chip { border-radius:999px; padding:.4rem .85rem; font-size:.98rem; display:inline-flex; align-items:center; gap:.4rem; }
  .chip small { color:var(--muted); font-size:.78rem; }
  .chip[aria-pressed="true"] { background:rgba(124,196,247,.2); border-color:var(--qa); color:#fff; }
  .chip[aria-pressed="true"] small { color:#cfe9fb; }
  .chiphead { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.5rem; flex-wrap:wrap; }
  .linkbtn { background:none; border:none; color:var(--qa); padding:.2rem .4rem; text-decoration:underline; font-size:.9rem; }
  .linkbtn:hover { background:none; }

  /* Lernkarten */
  .optrow { display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; align-items:center; }
  .optrow label { display:flex; align-items:center; gap:.4rem; cursor:pointer; }
  input[type=checkbox], input[type=radio] { accent-color:var(--qa); width:1.1rem; height:1.1rem; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(9.2rem, 1fr)); gap:.7rem; margin:.4rem 0 1.1rem; }
  .tile { display:flex; flex-direction:column; align-items:center; gap:.15rem; padding:.7rem .4rem .6rem; border-radius:1rem; border:2px solid var(--hair2); background:linear-gradient(180deg,#232a37,#1a202b); box-shadow:0 4px 0 #070a10; min-height:8.4rem; justify-content:flex-start; }
  .tile:hover { border-color:var(--qa); transform:translateY(-2px); box-shadow:0 6px 0 #070a10; }
  .tile.sel { border-color:var(--warn); box-shadow:0 4px 0 #070a10, 0 0 14px rgba(242,169,0,.35); }
  .ico { display:inline-flex; align-items:center; justify-content:center; font-size:2.6rem; line-height:1.1; min-height:3rem; font-weight:700; }
  .ico.sw { width:2.8rem; height:2.8rem; min-height:0; border-radius:50%; border:2px solid rgba(255,255,255,.5); margin:.1rem 0 .2rem; }
  .ico.big { font-size:4.6rem; min-height:5.4rem; }
  .ico.big.sw { width:5rem; height:5rem; }
  .ico.mid { font-size:2.2rem; min-height:2.6rem; }
  .ico.mid.sw { width:2.4rem; height:2.4rem; }
  .te { font-size:1.2rem; font-weight:800; overflow-wrap:anywhere; text-align:center; }
  .td { font-size:.88rem; color:var(--muted); text-align:center; overflow-wrap:anywhere; }
  .hideEn .tile:not(.rev) .te, .hideDe .tile:not(.rev) .td, .hideIc .tile:not(.rev) .ico { visibility:hidden; }
  .detail { position:sticky; bottom:.6rem; z-index:4; display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:.8rem 1rem; border-radius:1rem; background:var(--surface2); border:1px solid var(--hair2); box-shadow:0 .5rem 1.6rem rgba(0,0,0,.55); }
  .detail .dw { font-size:1.6rem; font-weight:800; }
  .detail .ds { flex:1; min-width:12rem; }
  .spk { display:inline-flex; align-items:center; gap:.4rem; }
  .spk svg { width:1.1rem; height:1.1rem; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* Üben: Einstellungen */
  .grp { margin:.7rem 0; }
  .grp > .lab { font-size:.82rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-bottom:.35rem; }
  .seg { display:flex; flex-wrap:wrap; gap:.45rem; }
  .seg button[aria-pressed="true"] { background:var(--qa); color:#0d1016; border-color:var(--qa); font-weight:800; }
  button.big { font-size:1.35rem; font-weight:800; padding:.7rem 2rem; border-radius:.9rem; border:2px solid var(--qa); background:var(--qa); color:#0d1016; box-shadow:0 5px 0 rgba(0,0,0,.45); }
  button.big:hover { background:var(--qa); filter:brightness(1.1); }
  button.big:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.45); }
  button.big:disabled { filter:grayscale(.8); box-shadow:none; }
  .badges { display:flex; flex-wrap:wrap; gap:.5rem; margin:.4rem 0; }
  .badge { display:inline-block; padding:.25rem .8rem; border-radius:999px; border:1.5px solid var(--qa); color:var(--qa); font-weight:700; font-size:.92rem; background:rgba(255,255,255,.04); }
  .badge.off { border-color:var(--hair2); color:var(--muted); opacity:.6; }
  .badge.new { background:var(--qa); color:#0d1016; animation:pop .6s ease; }
  .note { padding:.6rem .9rem; border-radius:.7rem; background:rgba(242,169,0,.1); border:1px solid rgba(242,169,0,.5); }

  /* Runde */
  .hud { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1.2rem; padding:.5rem .9rem; margin-bottom:.6rem; border-radius:1rem; background:var(--surface2); border:1px solid var(--hair2); }
  .lives { display:flex; gap:.35rem; }
  .lives svg { width:2.3rem; height:2.3rem; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .lives svg.off { animation:ghost 2.4s ease-in-out infinite; }
  .lives svg.pop { animation:heartpop .9s ease; }
  .hs { display:flex; flex-direction:column; line-height:1.1; }
  .hs small { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; }
  .hs b { font-size:1.35rem; font-variant-numeric:tabular-nums; }
  .hud .grow { flex:1; }
  .bar { height:.55rem; border-radius:.3rem; background:rgba(255,255,255,.08); overflow:hidden; min-width:7rem; }
  .bar > i { display:block; height:100%; background:var(--qa); transition:width .3s; }
  .rcard { position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--hair); border-radius:1rem; padding:.8rem 1.1rem 1rem; animation:slidein .3s ease; text-align:center; }
  .rcard.boss { border:2px solid var(--warn); box-shadow:0 0 22px rgba(242,169,0,.25); }
  .rcard.shake { animation:shake .45s ease; }
  .meta { font-size:.85rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--qa); }
  .rcard.boss .meta { color:var(--warn); }
  .ask { font-size:1.15rem; margin:.2rem 0 .1rem; color:var(--muted); }
  .bigword { font-size:2.6rem; font-weight:800; margin:.1rem 0; overflow-wrap:anywhere; }
  .de { font-size:1.6rem; font-weight:800; margin:.1rem 0 .3rem; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(12rem, 1fr)); gap:.8rem; margin:.7rem 0 .5rem; }
  .opt { position:relative; display:flex; align-items:center; justify-content:center; gap:.6rem; font-size:1.4rem; font-weight:800; min-height:4.2rem; border-radius:1rem; border:2px solid var(--hair2); background:linear-gradient(180deg,#232a37,#1a202b); box-shadow:0 5px 0 #070a10; transition:transform .08s, box-shadow .08s; padding:.4rem .8rem; }
  .opt:hover:not(:disabled) { border-color:var(--qa); transform:translateY(-2px); box-shadow:0 7px 0 #070a10; }
  .opt:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 #070a10; }
  .opt .n { position:absolute; top:.25rem; left:.5rem; font-size:.72rem; color:var(--muted); font-weight:700; }
  .opt.ok { background:linear-gradient(180deg,rgba(95,208,111,.5),rgba(95,208,111,.25)); border-color:var(--good); animation:pop .5s ease; }
  .opt.no { background:linear-gradient(180deg,rgba(255,107,94,.45),rgba(255,107,94,.2)); border-color:var(--bad); }
  .opt:disabled { cursor:default; }
  .opt:disabled:not(.no) { opacity:1; }
  .opt .ico { min-height:0; font-size:2rem; }
  .opt .ico.sw { width:2rem; height:2rem; }
  .fb { font-size:1.15rem; margin:.5rem auto; padding:.6rem .9rem; border-radius:.7rem; max-width:44rem; text-align:left; }
  .fb.good { background:rgba(95,208,111,.15); border:1px solid var(--good); }
  .fb.help { background:rgba(242,169,0,.12); border:1px solid var(--warn); }
  .fb.no { background:rgba(255,107,94,.12); border:1px solid var(--bad); }
  .fb .ex { margin-top:.3rem; color:var(--muted); font-size:1rem; }
  .actions { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin:.5rem 0 0; }
  .float { position:absolute; right:1.2rem; top:2.6rem; pointer-events:none; font-size:2.2rem; font-weight:900; animation:floatup 1.4s ease forwards; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .float.gain { color:var(--good); } .float.loss { color:var(--bad); }
  .banner { position:absolute; left:0; right:0; top:30%; text-align:center; font-size:clamp(1.8rem,7vw,3.4rem); font-weight:900; letter-spacing:.08em; color:var(--warn); text-shadow:0 0 22px rgba(242,169,0,.7), 0 4px 0 #6a4a00; pointer-events:none; z-index:5; animation:banner 1.5s ease forwards; }

  /* Tippen */
  .slots { display:flex; flex-wrap:wrap; justify-content:center; gap:.35rem; margin:.5rem 0 .3rem; }
  .slot { min-width:2.5rem; height:3.4rem; padding:0 .25rem; display:inline-flex; align-items:center; justify-content:center; font-size:2rem; font-weight:800; border-radius:.6rem; border:2px solid var(--hair2); background:var(--surface2); color:var(--muted); font-variant-ligatures:none; }
  .slot.done { color:var(--good); border-color:rgba(95,208,111,.7); background:rgba(95,208,111,.12); }
  .slot.cur { border-color:var(--qa); box-shadow:0 0 14px rgba(124,196,247,.6); animation:blink 1s ease-in-out infinite; }
  .slot.hint { color:var(--warn); border-color:var(--warn); }
  .slot.fixed { border-color:transparent; background:none; color:var(--text); min-width:1rem; }
  .slot.space { min-width:1.6rem; }
  .slot.space.cur::after { content:"␣"; font-size:1.3rem; color:var(--qa); }
  .slot.err { animation:shake .3s ease; border-color:var(--bad); }
  .slot.hid { color:transparent; }
  .vkb { margin:.4rem auto 0; max-width:46rem; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .vrow { display:grid; grid-template-columns:repeat(24, 1fr); gap:.28rem; margin-bottom:.28rem; }
  .vk { grid-column:span 2; height:clamp(2.3rem, 6.2vh, 3.3rem); padding:0; display:flex; align-items:center; justify-content:center; font-size:1.15rem; font-weight:700; text-transform:uppercase; border-radius:.5rem; background:linear-gradient(180deg,#2a3140,#1c2230); border:1px solid var(--hair2); box-shadow:0 3px 0 #070a10; position:relative; }
  .vrow.r1 .vk:first-child { grid-column:2 / span 2; } .vrow.r2 .vk:first-child { grid-column:3 / span 2; } .vrow.r3 .vk:first-child { grid-column:5 / span 2; }
  .vk.space { grid-column:7 / span 12; text-transform:none; font-size:.85rem; color:var(--muted); }
  .vk.home::after { content:""; position:absolute; bottom:.28rem; width:.9rem; height:2px; background:currentColor; opacity:.7; border-radius:2px; }
  .vk.next { color:#10131a; font-weight:900; background:var(--fc); border-color:var(--fc); box-shadow:0 0 14px var(--fc), 0 3px 0 #070a10; animation:keyblink .9s ease-in-out infinite; }
  .vk.flashok { background:var(--good) !important; color:#10131a; }
  .vk.flashbad { background:var(--bad) !important; color:#10131a; }
  .kbdhint .vk[data-f] { border-bottom:3px solid var(--fc); }

  /* Diktat */
  .dictrow { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; align-items:center; margin:.6rem 0; }
  .dictin { font-size:1.6rem; font-weight:700; width:min(30rem, 100%); text-align:center; border:3px solid var(--qa); border-radius:.8rem; padding:.5rem .9rem; }
  .dictin.sent { font-size:1.25rem; text-align:left; width:min(44rem, 100%); }
  .diff { font-size:1.6rem; font-weight:800; line-height:1.9; overflow-wrap:anywhere; }
  .diff .dok { color:var(--good); } .diff .dbad { color:var(--bad); } .diff .dmiss { color:var(--bad); border-bottom:3px solid var(--bad); display:inline-block; min-width:.5em; text-align:center; } .diff .dcase { color:var(--warn); } .diff .dx { color:var(--bad); text-decoration:line-through; }
  .diff .dfix { color:var(--warn); font-size:.8em; margin-left:.15em; }
  .diff.sent { font-size:1.3rem; font-weight:700; line-height:2.1; }
  .diff .w { display:inline-block; margin:0 .25em; }
  .diff .w.p { margin:0 .1em 0 -.2em; }
  .rightline { margin:.2rem 0; color:var(--muted); }
  .rightline b { color:var(--text); font-size:1.4rem; }

  /* Ende */
  .end { text-align:center; }
  .end h2 { font-size:2rem; color:var(--qa); margin-bottom:.2rem; }
  .stars { display:flex; justify-content:center; gap:.5rem; margin:.4rem 0; }
  .stars svg { width:4rem; height:4rem; fill:#2b313b; }
  .stars svg.on { fill:var(--warn); filter:drop-shadow(0 0 6px rgba(242,169,0,.6)); animation:pop .7s ease; }
  .bigpts { font-size:2.6rem; font-weight:900; margin:.2rem 0; }
  .sum { color:var(--muted); font-size:1.1rem; margin:.3rem 0; } .sum b { color:var(--text); }
  .rankrow { display:flex; align-items:center; justify-content:center; gap:1rem; margin:.8rem 0; text-align:left; }
  .rankrow svg { width:4.4rem; height:4.4rem; flex:none; filter:drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
  .rname { font-size:1.25rem; font-weight:900; color:var(--qa); }
  .rankup { font-size:1.3rem; font-weight:900; color:var(--warn); animation:pop .8s ease; margin:.3rem 0; }
  .revlist { text-align:left; margin:1rem auto 0; max-width:46rem; }
  .revi { display:flex; align-items:center; gap:.8rem; margin:.4rem 0; padding:.5rem .8rem; border-radius:.7rem; background:var(--surface2); flex-wrap:wrap; }
  .revi .ico { min-height:0; font-size:1.8rem; }
  .revi .rw { font-weight:800; font-size:1.2rem; }
  .revi.helpi { border-left:4px solid var(--warn); } .revi.badi { border-left:4px solid var(--bad); }
  .conf { position:absolute; top:-10px; width:.6rem; height:1rem; border-radius:2px; pointer-events:none; animation:conf 1.8s ease-out forwards; }

  /* Wortlisten */
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--hair); vertical-align:middle; }
  th { color:var(--muted); font-size:.82rem; text-transform:uppercase; letter-spacing:.06em; }
  .dots { display:inline-flex; gap:.2rem; }
  .dots i { width:.7rem; height:.7rem; border-radius:50%; background:rgba(255,255,255,.12); display:inline-block; }
  .dots i.on { background:var(--good); }
  .tblwrap { overflow-x:auto; }
  .row { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin:.5rem 0; }
  .customitem { display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; padding:.45rem .7rem; border-radius:.7rem; background:var(--surface2); margin:.35rem 0; }
  .customitem b { flex:1; min-width:8rem; }


  /* Hauptmenü */
  .homebtn { display:inline-flex; align-items:center; gap:.4rem; padding:.45rem .9rem; border-radius:.7rem; font-size:1rem; background:var(--light); color:var(--ink); border-color:transparent; font-weight:800; }
  .homebtn:hover { background:#fff; }
  .menu { display:grid; grid-template-columns:repeat(auto-fit, minmax(14rem, 1fr)); gap:.9rem; margin-bottom:.9rem; }
  .mtile { display:flex; flex-direction:column; align-items:flex-start; gap:.2rem; padding:1rem 1.1rem; border-radius:1.1rem; border:2px solid var(--hair2); background:linear-gradient(180deg,#232a37,#1a202b); box-shadow:0 5px 0 #070a10; text-align:left; }
  .mtile:hover { border-color:var(--qa); transform:translateY(-2px); box-shadow:0 7px 0 #070a10; }
  .mtile .mi { font-size:2.6rem; line-height:1.1; }
  .mtile b { font-size:1.45rem; }
  .mtile small { color:var(--muted); font-size:.95rem; }

  /* Countdown */
  .cd { display:flex; align-items:center; gap:.8rem; margin:.3rem 0 .2rem; }
  .cd .bar { flex:1; height:.8rem; }
  .cd .bar > i { transition:none; width:100%; }
  .cd b { font-size:1.9rem; min-width:2.6rem; text-align:center; font-variant-numeric:tabular-nums; }
  .cd.low .bar > i { background:var(--bad); } .cd.low b { color:var(--bad); }
  .cd.out b { color:var(--muted); } .cd.out .bar > i { background:#4a4f55; }
  .late { font-weight:800; color:#ffb347; padding:.45rem .8rem; border:2px solid #ffb347; border-radius:.7rem; background:rgba(255,179,71,.12); margin:.3rem auto; max-width:44rem; }

  /* Wettkampf */
  .teamrow { display:flex; gap:.5rem; flex:1 1 auto; flex-wrap:nowrap; min-width:0; }
  .hud.t .grow { flex:0 0 9rem; }
  .team { flex:1 1 0; min-width:4.2rem; padding:.25rem .5rem; border-radius:1rem; border:3px solid var(--tc); background:var(--surface); opacity:.55; text-align:center; transition:opacity .2s, transform .2s, box-shadow .2s; }
  .team.cur { opacity:1; transform:scale(1.03); box-shadow:0 0 18px var(--tc); }
  .teamn { font-weight:800; color:var(--tc); overflow-wrap:anywhere; line-height:1.15; }
  .teamsc { font-size:1.6rem; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1; }
  .teamf { font-size:.78rem; color:var(--muted); }
  .teamset { display:flex; flex-direction:column; gap:.5rem; margin:.4rem 0; }
  .tin { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
  .tin span { min-width:8.5rem; font-weight:800; color:var(--tc); }
  .tin input { border:3px solid var(--tc); width:min(22rem, 100%); font-weight:700; }
  .podw { display:flex; flex-direction:column; gap:.7rem; max-width:34rem; margin:1rem auto; }
  .pod { display:flex; align-items:center; gap:1rem; text-align:left; padding:.7rem 1rem; border-radius:1rem; border:3px solid var(--tc); background:var(--surface2); }
  .pod.p1 { box-shadow:0 0 22px var(--tc); }
  .pod .pl { font-size:2rem; font-weight:900; color:var(--tc); min-width:2.2rem; text-align:center; }
  .pod .pn { font-size:1.35rem; font-weight:900; overflow-wrap:anywhere; }
  .pod .ps { margin-left:auto; font-size:1.7rem; font-weight:900; font-variant-numeric:tabular-nums; }
  .pod .pd { font-size:.95rem; color:var(--muted); }

  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.1); } 100% { transform:scale(1); } }
  @keyframes shake { 0%,100% { transform:translateX(0); } 20%,60% { transform:translateX(-8px); } 40%,80% { transform:translateX(8px); } }
  @keyframes slidein { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  @keyframes floatup { 0% { opacity:0; transform:translateY(14px) scale(.8); } 20% { opacity:1; } 100% { opacity:0; transform:translateY(-70px) scale(1.25); } }
  @keyframes banner { 0% { opacity:0; transform:scale(2.2); } 25% { opacity:1; transform:scale(1); } 75% { opacity:1; } 100% { opacity:0; transform:scale(.9); } }
  @keyframes blink { 0%,100% { box-shadow:0 0 6px rgba(124,196,247,.3); } 50% { box-shadow:0 0 18px rgba(124,196,247,.9); } }
  @keyframes keyblink { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.35); } }
  @keyframes heartpop { 0% { transform:scale(1); } 25% { transform:scale(1.5) rotate(-12deg); } 55% { transform:scale(.8) rotate(10deg); } 100% { transform:scale(1) rotate(0); } }
  @keyframes ghost { 0%,100% { transform:translateY(0); opacity:.55; } 50% { transform:translateY(-4px); opacity:.8; } }

function mk(topicId, a) { return { en: a[0], de: a[1], ic: a[2] || "", ex: a[3] || "", topic: topicId, key: (a[0] + "|" + a[1]).toLowerCase() }; }
const isIcon = s => !!s && (/^#[0-9a-f]{3,8}$/i.test(s) || (s.length <= 8 && !/[A-Za-z]{3,}/.test(s)));
function parseList(text) {
  const out = [], bad = [];
  String(text).split(/\r?\n/).forEach((line, i) => {
    line = line.trim(); if (!line) return;
    let p = (line.indexOf("\t") >= 0 ? line.split("\t") : line.split(";")).map(s => s.trim());
    if (p.length < 2 || !p[0] || !p[1]) { bad.push(i + 1); return; }
    let ic = p[2] || "", ex = p[3] || "";
    if (ic && !isIcon(ic)) { if (!ex) ex = ic; ic = ""; }
    out.push([p[0], p[1], ic, ex]);
  });
  return { out: out, bad: bad };
}
function builtinTopics() {
  TOPICS.forEach(t => { if (!t._w) t._w = t.w.map(a => mk(t.id, a)); });
  return TOPICS;
}
function customTopics() {
  return CUSTOM.map(c => { const r = parseList(c.text); return { id: c.id, name: c.name, ic: "📝", custom: true, _w: r.out.map(a => mk(c.id, a)) }; });
}
const topicList = () => builtinTopics().concat(customTopics());
const allWords = () => { const o = []; topicList().forEach(t => t._w.forEach(w => o.push(w))); return o; };
const prog = w => P[w.key] || (P[w.key] = { b: 0, n: 0, ok: 0, bad: 0, hp: 0 });
const isHard = w => { const p = P[w.key]; return !!(p && p.n > 0 && p.bad > 0 && p.b <= 1); };
function hardWords() { const seen = {}, o = []; allWords().forEach(w => { if (!seen[w.key] && isHard(w)) { seen[w.key] = 1; o.push(w); } }); return o; }
function selectedTopics() {
  const out = [];
  topicList().forEach(t => { if (ST.sel.indexOf(t.id) >= 0) out.push(t); });
  if (ST.sel.indexOf("hard") >= 0) { const h = hardWords(); if (h.length) out.push({ id: "hard", name: "Schwierige Wörter", ic: "🔥", _w: h }); }
  return out;
}
function selectedWords() { const seen = {}, o = []; selectedTopics().forEach(t => t._w.forEach(w => { if (!seen[w.key]) { seen[w.key] = 1; o.push(w); } })); return o; }
function markWord(w, res) {
  const p = prog(w); p.n++;
  if (res === "ok") { p.ok++; p.b = Math.min(4, p.b + 1); } else if (res === "help") { p.hp = (p.hp || 0) + 1; } else { p.bad++; p.b = 0; }
}

/* ===================== Ton ===================== */
let AC = null;
function tone(freqs, dur, type, vol) {
  if (!ST.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    freqs.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + i * dur);
      g.gain.exponentialRampToValueAtTime(vol || 0.14, t0 + i * dur + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur);
      o.connect(g); g.connect(AC.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.03);
    });
  } catch (e) { /* kein Ton möglich */ }
}
const SFX = {
  tick: () => tone([700], 0.05, "triangle", 0.07), good: () => tone([523, 659, 784], 0.09, "triangle", 0.15),
  help: () => tone([523, 587], 0.1, "triangle", 0.12), bad: () => tone([233, 175], 0.17, "sawtooth", 0.09), soft: () => tone([260], 0.09, "square", 0.05),
  rank: () => tone([392, 523, 659, 784, 1047], 0.12, "triangle", 0.16), win: () => tone([523, 659, 784, 1047, 784, 1047], 0.11, "triangle", 0.16),
  lose: () => tone([330, 262, 196, 131], 0.2, "sawtooth", 0.09), boss: () => tone([392, 392, 523], 0.12, "square", 0.07)
};

/* ===================== Sprachausgabe (englisch) ===================== */
const TTS = (function () {
  const syn = window.speechSynthesis, ok = !!(syn && window.SpeechSynthesisUtterance);
  let voices = [], voice = null, curU = null;
  function choose() {
    voice = voices.find(v => v.voiceURI === ST.voice) ||
      voices.find(v => /^en[-_]GB/i.test(v.lang) && /google|natural|online|daniel|serena|libby|sonia|kate/i.test(v.name)) ||
      voices.find(v => /^en[-_]GB/i.test(v.lang)) || voices.find(v => /^en[-_]US/i.test(v.lang)) || voices[0] || null;
  }
  function load() {
    if (!ok) return;
    voices = (syn.getVoices() || []).filter(v => /^en/i.test(v.lang));
    choose(); fillSelect();
  }
  function fillSelect() {
    const sel = $("sVoice"); if (!sel) return;
    sel.innerHTML = voices.length ? voices.map(v => '<option value="' + esc(v.voiceURI) + '">' + esc(v.name + " (" + v.lang + ")") + "</option>").join("") : '<option value="">keine englische Stimme gefunden</option>';
    if (voice) sel.value = voice.voiceURI;
    $("voiceNote").textContent = !ok ? "Dieses Gerät oder dieser Browser hat keine Sprachausgabe. Hör-Aufgaben und Diktat sind dann nicht möglich."
      : voices.length ? "" : "Es wurde keine englische Stimme gefunden. Wenn nichts zu hören ist, in den Systemeinstellungen eine englische Stimme installieren.";
  }
  function say(text, opt) {
    if (!ok || !text) { if (opt && opt.done) opt.done(); return; }
    opt = opt || {};
    if (curU) { curU.onend = curU.onerror = null; }
    syn.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : "en-GB"; if (voice) u.voice = voice;
    u.rate = Math.max(0.3, ST.rate * (opt.slow ? 0.6 : 1));
    u.onend = u.onerror = () => { if (curU === u) curU = null; if (opt.done) opt.done(); };
    curU = u;
    setTimeout(() => { try { syn.speak(u); } catch (e) { /* egal */ } }, 40);
  }
  function stop() { if (!ok) return; if (curU) { curU.onend = curU.onerror = null; curU = null; } syn.cancel(); }
  if (ok) { load(); if (syn.addEventListener) syn.addEventListener("voiceschanged", load); }
  return { ok: ok, say: say, stop: stop, load: load, setVoice(uri) { ST.voice = uri; saveST(); choose(); }, count: () => voices.length };
})();

const RANKS = [[0, "Newcomer"], [80, "Word Collector"], [220, "Sound Hunter"], [450, "Spelling Scout"], [800, "Word Wizard"], [1300, "Vocab Hero"], [2000, "Master of Words"]];
function rankOf(xp) {
  let l = 0; for (let i = 0; i < RANKS.length; i++) if (xp >= RANKS[i][0]) l = i;
  const lo = RANKS[l][0], hi = l + 1 < RANKS.length ? RANKS[l + 1][0] : null;
  return { l: l, name: RANKS[l][1], lo: lo, hi: hi, pct: hi ? Math.round((xp - lo) / (hi - lo) * 100) : 100 };
}

/* ===================== Runde: Aufgaben bauen ===================== */
let R = null;
function kindsFor(cfg) {

  else if (cfg.mode === "type") k = ["type"];
  else if (cfg.mode === "dict") k = [cfg.dict === "sent" ? "dictS" : "dictW"];
  else k = ["hear", "en2de", "de2en", "type", "dictW", "dictS"];
  if (!TTS.ok) k = k.filter(x => x === "en2de" || x === "de2en" || x === "type");
  if (!k.length) k = ["en2de", "de2en"];
  return k;
}
function pickWords(pool, n) {
  const arr = pool.map(w => { const p = P[w.key]; return { w: w, s: (p && p.n ? p.b : 1.2) + Math.random() * 2.4 }; }).sort((a, b) => a.s - b.s).map(x => x.w);
  const out = []; let i = 0;
  while (out.length < n) { out.push(arr[i % arr.length]); i++; }

}
const TCOL = ["#6cc0f5", "#ff8a65", "#5fd06f", "#c4a1ff"], DEFN = ["Team Blau", "Team Rot", "Team Grün", "Team Lila"];
function buildTasks(cfg, pool) {
  const kinds = kindsFor(cfg), nT = cfg.team ? cfg.teams : 0, total = cfg.team ? cfg.teams * cfg.tr : cfg.n;
  const ws = pickWords(pool, total), tasks = [], last = [];
  ws.forEach((w, i) => {
    let k, tries = 0;
    do { k = kinds[rnd(kinds.length)]; tries++; } while (kinds.length > 1 && tries < 12 && last.length >= 2 && last[0] === k && last[1] === k);
    if (k === "dictS" && !w.ex) k = "dictW";
    last.unshift(k); if (last.length > 2) last.pop();
    const boss = cfg.team ? Math.floor(i / nT) === cfg.tr - 1 : (total >= 5 && i === total - 1);
    if (boss && cfg.mode === "mix") k = w.ex && Math.random() < 0.4 ? "dictS" : (Math.random() < 0.5 ? "type" : "dictW");
    tasks.push({ w: w, type: k, boss: boss, mc: k === "hear" || k === "en2de" || k === "de2en", hide: k === "type" && (cfg.mode === "type" ? !!cfg.hide : boss) });
  });

}

/* ---------- Countdown ---------- */
let tmr = null, cdRound = 0;
const CDMIN = 5;
const cdNow = c => Math.max(CDMIN, (+c.cd || 0) - cdRound);
function stopTimer() { if (tmr) { clearInterval(tmr); tmr = null; } }
function taskSeconds(t) {
  const b = R.cdBase, L = Array.from(t.w.en).filter(c => c !== " ").length;
  if (t.mc) return b;
  if (t.type === "type") return b + Math.ceil(L * 0.8);
  if (t.type === "dictW") return b + L;
  return b + 3 * String(t.w.ex || t.w.en).split(/\s+/).length;

  const bar = $("cdBar"), num = $("cdNum"), box = $("cd"); if (!bar || !num || !box) return;
  bar.style.width = Math.max(0, t.rem / t.T * 100) + "%"; num.textContent = Math.max(0, Math.ceil(t.rem));
  box.classList.toggle("low", t.rem <= 5 && t.rem > 0); box.classList.toggle("out", t.rem <= 0);
}

  stopTimer(); t.T = taskSeconds(t); t.rem = t.T; t.late = false; paintTimer(t);
  let last = Date.now();
  tmr = setInterval(() => {
    const now = Date.now(), dt = Math.min(0.5, (now - last) / 1000); last = now;
    if (!R || R.cur !== t || t.done) { stopTimer(); return; }
    if (R.paused || $("v-runde").hidden) return;
    t.rem -= dt; paintTimer(t);
    if (t.rem <= 0) { stopTimer(); t.late = true; SFX.soft(); const l = $("cdLate"); if (l) l.hidden = false; }
  }, 100);
}

function startRound(cfg, pool, only) {

  const c = Object.assign({}, cfg);

    const n = Math.min(4, Math.max(2, +c.teams || 2)), TRn = Math.max(1, +c.tr || 5);
    let names = [0, 1, 2, 3].slice(0, n).map(i => String((c.tnames || [])[i] || "").trim() || DEFN[i]);
    names = names.map((x, i) => names.indexOf(x) !== i ? x + " " + (i + 1) : x);
    const z = k => Array(n).fill(k);
    team = { n: n, names: names, scores: z(0), streaks: z(0), correct: z(0), max: z(0), TR: TRn };
    c.teams = n; c.tr = TRn; c.lives = false; c.n = n * TRn;
  }
  const cdBase = c.cd ? cdNow(c) : 0; if (c.cd) cdRound++;
  R = { cfg: c, pool: pool, only: !!only, team: team, cdBase: cdBase, tasks: buildTasks(c, pool), i: 0, lives: 3, pts: 0, streak: 0, maxStreak: 0, res: [], cur: null, dead: false, typeKeys: 0, typeMs: 0, paused: false };

}

/* Aufgabe abschließen: Punkte, Leben, Lernstand. open=true: Fehler sofort werten, Aufgabe läuft aber weiter (Mitraten). */
function finishTask(t, res, open) {

const exLine = (w, btnOnly) => w.ex ? '<div class="ex">' + (btnOnly ? "Satz anhören: " : esc(w.ex) + " ") + '<button class="spk small" data-say="sent" data-slow="0" aria-label="Satz vorlesen">' + SPK + "</button></div>" : "";
const autoSay = (w) => { if (ST.auto) TTS.say(w.en); };

/* ---------- Mitraten (drei Möglichkeiten) ---------- */
function distract(w, n, key) {
  const pool = allWords().filter(x => x.key !== w.key && x[key] !== w[key] && !(x.ic && x.ic === w.ic));

  let body = "";
  if (t.type === "hear") body = '<div class="ask">Hör zu. Welches Wort ist das?</div><div class="actions"><button class="big spk" data-say="w" aria-label="Wort anhören">' + SPK + 'Anhören</button><button class="spk" data-say="w" data-slow="1">' + SPK + "langsam</button></div>";
  else if (t.type === "en2de") body = '<div class="ask">Was heißt das auf Deutsch?</div><div class="bigword">' + esc(w.en) + '</div><div class="actions"><button class="spk" data-say="w">' + SPK + "Anhören</button></div>";
  else body = '<div class="ask">Wie heißt das auf Englisch?</div>' + iconHtml(w.ic, "big") + '<div class="de">' + esc(w.de) + "</div>";

  const seen = {}, revList = review.filter(r => { if (seen[r.w.key]) return false; seen[r.w.key] = 1; return true; });
  let h = '<div class="card end" style="position:relative;overflow:hidden" id="endCard"><h2>' + title + "</h2>";
  if (why === "dead") h += '<p class="muted">Alle drei Leben sind weg. Übe die Wörter unten und versuche es gleich noch einmal.</p>';
  h += '<div class="stars" aria-label="' + stars + ' von 3 Sternen">' + [1, 2, 3].map(i => STAR.replace("<svg", '<svg class="' + (i <= stars ? "on" : "") + '"')).join("") + "</div>";
  h += '<div class="bigpts">' + R.pts + " Punkte</div>";
  h += '<div class="sum"><b>' + okN + "</b> sicher · <b>" + helpN + "</b> fast · <b>" + badN + "</b> noch üben" + (R.maxStreak >= 2 ? " · beste Serie <b>" + R.maxStreak + "</b>" : "") + (tempo ? " · Tippen <b>" + tempo + "</b> Anschläge pro Minute" : "") + "</div>";
  if (up) h += '<div class="rankup">Neuer Rang: ' + esc(r1.name) + "!</div>";
  h += '<div class="rankrow">' + SHIELD(r1.l + 1) + '<div style="min-width:12rem"><div class="rname">Rang ' + (r1.l + 1) + ": " + esc(r1.name) + '</div><div class="bar"><i style="width:' + r1.pct + '%"></i></div><div class="muted small">' + XP + " XP" + (r1.hi ? " · nächster Rang bei " + r1.hi : "") + "</div></div></div>";
  if (fresh.length) h += '<div class="badges" style="justify-content:center">' + fresh.map(id => '<span class="badge new">Neu: ' + esc(BADGE_DEFS.filter(b => b.id === id)[0].name) + "</span>").join("") + "</div>";
  h += '<div class="actions"><button class="big" id="againBtn">Noch einmal</button>' + (revList.length ? '<button class="big" id="fixBtn" style="background:var(--warn);border-color:var(--warn)">' + (revList.length === 1 ? "Dieses Wort üben" : "Diese " + revList.length + " Wörter üben") + "</button>" : "") + '<button id="backBtn">Zur Auswahl</button></div>';
  if (revList.length) {
    h += '<div class="revlist"><h2>Hier lohnt sich Üben</h2>' + revList.map(r => '<div class="revi ' + (r.res === "help" ? "helpi" : "badi") + '">' + iconHtml(r.w.ic) + '<span class="rw">' + esc(r.w.en) + '</span><span class="muted">' + esc(r.w.de) + '</span><button class="spk small" data-hear="' + esc(r.w.key) + '" aria-label="Anhören">' + SPK + "</button></div>").join("") + "</div>";
  }
  h += "</div>";
  show("ende"); $("v-ende").innerHTML = h;
  R.revWords = revList.map(r => r.w);
  if (why === "done" && stars >= 2) { SFX.win(); confetti($("endCard")); } else if (why === "dead") SFX.lose();
  if (up) setTimeout(SFX.rank, 600);
  renderRank();
}
$("v-ende").addEventListener("click", e => {
  const hr = e.target.closest("[data-hear]");
  if (hr) { TTS.say(hr.dataset.hear.split("|")[0]); return; }
  if (e.target.closest("#againBtn")) { startRound(R.cfg, R.pool, R.only); return; }
  if (e.target.closest("#fixBtn")) { const ws = R.revWords.slice(); const cfg = Object.assign({}, R.cfg, { n: Math.max(5, Math.min(20, ws.length * 2)) }); startRound(cfg, ws, true); return; }
  if (e.target.closest("#backBtn")) { R = null; show("ueben"); refresh(); }
});

/* ===================== Wortlisten ===================== */
let editId = null;
function dots(w) { const b = (P[w.key] || {}).b || 0; let s = '<span class="dots" title="Sicherheit ' + b + ' von 4">'; for (let i = 1; i <= 4; i++) s += '<i class="' + (i <= b ? "on" : "") + '"></i>'; return s + "</span>"; }
function renderListen() {
  const tops = selectedTopics(), host = $("v-listen");
  let h = "";
  h += '<div class="card"><h2>Hinweis zu den eingebauten Wörtern</h2><p class="muted" style="margin:0">Die eingebauten Wortfelder sind eine eigene Zusammenstellung typischer Einstiegswörter für Klasse 5. Sie sind keine amtliche Liste und folgen keinem bestimmten Lehrwerk. Passe sie unten an dein Lehrwerk an, indem du eine eigene Wortliste einfügst.</p></div>';
  h += '<div class="card"><h2>Eigene Wortliste</h2><p class="muted small" style="margin-top:0">Eine Zeile je Wort: <b>englisch; deutsch; Bild (Emoji, optional); Beispielsatz (optional)</b>. Tabulator statt Strichpunkt geht auch, so kannst du direkt aus einer Tabelle einfügen.</p>' +
    '<div class="row"><input id="cName" type="text" placeholder="Name der Liste, z. B. Unit 1" style="flex:1;min-width:12rem" value="' + esc(editId ? (CUSTOM.filter(c => c.id === editId)[0] || {}).name || "" : "") + '"></div>' +
    '<textarea id="cText" spellcheck="false" placeholder="cat; die Katze; 🐱; The cat is black.&#10;dog; der Hund; 🐶">' + esc(editId ? (CUSTOM.filter(c => c.id === editId)[0] || {}).text || "" : "") + '</textarea>' +
    '<div class="row"><button class="big" id="cSave" style="font-size:1.1rem;padding:.5rem 1.3rem">' + (editId ? "Änderungen speichern" : "Liste speichern") + '</button>' + (editId ? '<button id="cCancel">Abbrechen</button>' : "") + '<span id="cMsg" class="muted"></span></div>';
  if (CUSTOM.length) {
    h += "<h2>Meine Listen</h2>" + CUSTOM.map(c => '<div class="customitem"><b>' + esc(c.name) + '</b><span class="muted">' + parseList(c.text).out.length + ' Wörter</span><button data-edit="' + esc(c.id) + '">Bearbeiten</button><button data-del="' + esc(c.id) + '">Löschen</button></div>').join("");
  }
  h += "</div>";
  h += '<div class="card"><h2>Wörter der gewählten Wortfelder</h2><div class="row"><button id="copyBtn">Als Text kopieren</button><span class="muted small">Zum Anpassen: kopieren, ändern und oben als eigene Liste einfügen.</span><span id="copyMsg" class="muted"></span></div>';
  if (!tops.length) h += '<p class="muted">Wähle oben mindestens ein Wortfeld aus.</p>';
  else {
    h += '<div class="tblwrap"><table><thead><tr><th>Englisch</th><th>Deutsch</th><th>Beispielsatz</th><th>Sicherheit</th></tr></thead><tbody>';
    tops.forEach(t => { h += '<tr><td colspan="4"><b>' + esc(t.ic || "") + " " + esc(t.name) + "</b></td></tr>"; t._w.forEach(w => { h += "<tr><td><b>" + esc(w.en) + "</b></td><td>" + esc(w.de) + '</td><td class="muted">' + esc(w.ex) + "</td><td>" + dots(w) + "</td></tr>"; }); });
    h += "</tbody></table></div>";
  }
  h += "</div>";
  h += '<div class="card"><h2>Lernstand</h2><p class="muted" style="margin-top:0">Rang, Punkte, Abzeichen und die Sicherheit jedes Wortes werden nur auf diesem Gerät im Browser gespeichert.</p><button data-reset="1">Ergebnis löschen</button></div>';
  host.innerHTML = h;
}
$("v-listen").addEventListener("click", e => {
  if (e.target.closest("#cSave")) {
    const name = $("cName").value.trim() || "Meine Liste", text = $("cText").value, r = parseList(text);
    if (!r.out.length) { $("cMsg").textContent = "Keine gültige Zeile gefunden. Jede Zeile braucht englisch; deutsch."; return; }
    if (editId) { const c = CUSTOM.filter(x => x.id === editId)[0]; if (c) { c.name = name; c.text = text; } }
    else { const id = "c" + Date.now(); CUSTOM.push({ id: id, name: name, text: text }); if (ST.sel.indexOf(id) < 0) ST.sel.push(id); }
    store.set("vt_custom", CUSTOM); saveST(); editId = null; refresh();
    $("cMsg").textContent = r.out.length + " Wörter gespeichert" + (r.bad.length ? ", Zeilen übersprungen: " + r.bad.join(", ") : "") + "."; return;
  }
  if (e.target.closest("#cCancel")) { editId = null; renderListen(); return; }
  const ed = e.target.closest("[data-edit]"); if (ed) { editId = ed.dataset.edit; renderListen(); window.scrollTo(0, 0); return; }
  const del = e.target.closest("[data-del]");
  if (del) {
    if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = "Wirklich löschen?"; return; }
    const id = del.dataset.del; CUSTOM = CUSTOM.filter(c => c.id !== id); ST.sel = ST.sel.filter(x => x !== id);
    store.set("vt_custom", CUSTOM); saveST(); if (editId === id) editId = null; refresh(); return;
  }
  if (e.target.closest("#copyBtn")) {
    const txt = selectedTopics().map(t => t._w.map(w => [w.en, w.de, w.ic, w.ex].join("; ")).join("\n")).join("\n");
    const done = ok => { $("copyMsg").textContent = ok ? "Kopiert." : "Kopieren nicht möglich."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); else done(false);
    return;
  }
});

/* ===================== Start ===================== */
ST.sel = ST.sel.filter(id => id === "hard" || topicList().some(t => t.id === id));
if (!ST.sel.length) ST.sel = [topicList()[0].id];
initSettings();
show("menu");
refresh();
window.__vt = { state: () => R, topics: () => topicList(), startRound: startRound, cfg: () => ST.cfg, judgeWord: judgeWord, judgeSent: judgeSent, osa: osa, parseList: parseList, cdNow: cdNow, setCdRound: n => { cdRound = n; } };
})();
</script>
