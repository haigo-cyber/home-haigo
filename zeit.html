<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seifferts Zeit</title>
<!--SZ-LINUX-->
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--line:#d9d6cc;--acc:#2f6f9f;--acc-ink:#fff;--ok:#2e7d4f;--bad:#b3402f;--soll:#c0392b;
--c0:#2f6f9f;--c1:#e08a1e;--c2:#4c9a5a;--c3:#8e5bb5;--c4:#c0504d;--c5:#3aa6a6;--c6:#a68a3a;--c7:#7a7a7a}
@media(prefers-color-scheme:dark){:root{--bg:#1b1d20;--card:#25282c;--tx:#e6e6e6;--mut:#9aa1a9;--line:#3a3f45;--acc:#5aa3d6;--acc-ink:#101214;--ok:#5fc283;--bad:#ef7a68;--soll:#ef7a68}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 8px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:1px solid transparent;background:none;color:var(--tx);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:var(--acc-ink)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
button.b{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
button.s{padding:2px 8px;font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.timer{font-size:28px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--tx);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.hide{display:none}
.abrbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.abrbar button{border:1px solid var(--line);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:16px;cursor:pointer;font:inherit}
.abrbar button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
@media print{.abrbar{display:none}}
.chip{margin-left:auto;font-size:13px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;background:none;color:var(--tx)}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar select,.bar input{width:auto}
@media print{header,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0}main{max-width:none}svg text{fill:#000}}
</style>
</head>
<body>
<header>
<h1>Seifferts Zeit</h1>
<nav id="nav"></nav>
</header>
<div class="abrbar" id="abrbar"></div>
<main id="main"></main>
<script>
"use strict";
const LX=window.SZ_LINUX||null;
const KEY='seifferts_zeit_v1';
const COLS=['--c0','--c1','--c2','--c3','--c4','--c5','--c6','--c7'];
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const CATS=['Unterricht','Vorbereitung','Korrektur','Konferenz und Gremien','Inklusion, NTA, AO-SF','Beratung und Elterngespräche','Aufsicht und Vertretung','Organisation','Fortbildung','Sonstiges'];
function defaultsAbr(name){return{id:uid(),name:name||'Abrechnung',mode:'monat',startMonth:1,entries:[],free:[],days:{},dayS:{},settled:{},set:{wd:[5,5,5,5,5],unit:45,cats:[...CATS],schools:['EvT','Herder']}}}
function normAbr(j){const d=defaultsAbr(j.name);const r={...d,...j,id:j.id||d.id,set:{...d.set,...(j.set||{})}};
 if(!Array.isArray(r.entries))r.entries=[];if(!Array.isArray(r.free))r.free=[];
 if(!r.days||typeof r.days!=='object')r.days={};if(!r.dayS||typeof r.dayS!=='object')r.dayS={};if(!r.settled||typeof r.settled!=='object')r.settled={};
 if(r.mode!=='jahr')r.mode='monat';r.startMonth=Math.min(12,Math.max(1,+r.startMonth||1));
 if(j.set&&j.set.soll!=null&&!j.set.wd)r.set.wd=Array(5).fill(j.set.soll/5);
 if(!Array.isArray(r.set.wd)||r.set.wd.length!==5)r.set.wd=[5,5,5,5,5];delete r.set.soll;return r}
function normFokus(j){const f=(j&&Array.isArray(j.fokus)?j.fokus:[]).filter(x=>x&&x.id&&x.start&&x.end&&+x.ms>0).map(x=>({id:String(x.id),ref:String(x.ref||''),title:String(x.title||''),meta:String(x.meta||''),tags:Array.isArray(x.tags)?x.tags.map(String):String(x.tags||'').split(',').map(t=>t.trim()).filter(Boolean),next:!!x.next,start:String(x.start),end:String(x.end),ms:Math.round(+x.ms)}));
 const run=j&&j.fokusRun&&j.fokusRun.start&&!isNaN(Date.parse(j.fokusRun.start))?{title:String(j.fokusRun.title||''),start:String(j.fokusRun.start),tags:Array.isArray(j.fokusRun.tags)?j.fokusRun.tags.map(String):[]}:null;const used=(j&&Array.isArray(j.fokusUsed)?j.fokusUsed:[]).map(String).slice(-3000);return{fokus:f,fokusRun:run,fokusUsed:used}}
function normRoot(j){
 if(j&&Array.isArray(j.abr)&&j.abr.length){const abr=j.abr.map(normAbr);return{format:3,cur:abr.some(a=>a.id===j.cur)?j.cur:abr[0].id,abr,...normFokus(j)}}
 if(j&&Array.isArray(j.entries)){const a=normAbr({...j,name:j.name||'Abrechnung 1'});return{format:3,cur:a.id,abr:[a],...normFokus(j)}}
 const a=defaultsAbr('Abrechnung 1');return{format:3,cur:a.id,abr:[a],...normFokus(j)}}
function load(){
 try{if(LX)return normRoot(LX.init||{})}catch(e){}
 try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return normRoot(j)}catch(e){}return normRoot({})}
let R=load();
let S=R.abr.find(a=>a.id===R.cur)||R.abr[0];
let ui={tab:'erfassen',edit:null,month:todayIso().slice(0,7),ay:0,fc:'',drive:null};
let istMap=null;
let saveT=null;
function save(){
 istMap=null;
 if(LX){clearTimeout(saveT);saveT=setTimeout(()=>{fetch(LX.base+'/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(R)}).catch(()=>{})},400);return}
 try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}}
if(LX)addEventListener('pagehide',()=>{if(saveT){clearTimeout(saveT);saveT=null;fetch(LX.base+'/api/state',{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify(R)})}});
function pad(n){return String(n).padStart(2,'0')}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayIso(){return isoOf(new Date())}
function dOf(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(iso,n){const d=dOf(iso);d.setDate(d.getDate()+n);return isoOf(d)}
function fmtDate(iso){const d=dOf(iso);return WD[d.getDay()]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()}
function fu0(u){return String(Math.round(u*100)/100)}
function fu(u){u=Math.round(u*10)/10;return Number.isInteger(u)?String(u):u.toFixed(1).replace('.',',')}
function sg(u){return (u>0.04?'+':'')+fu(u)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function mondayOf(iso){const d=dOf(iso);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return isoOf(d)}
function kw(iso){const d=dOf(iso);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}
function zeitH(u){return fu(u*S.set.unit/60)}

/* Soll und Ist, alles in Schulstunden */
function isFree(iso){return S.free.some(f=>iso>=f.from&&iso<=f.to)}
function sollWeek(){return S.set.wd.reduce((a,b)=>a+(+b||0),0)}
function sollDefault(iso){const w=dOf(iso).getDay();if(w==0||w==6||isFree(iso))return 0;return +S.set.wd[w-1]||0}
function sollDay(iso){const v=S.days[iso];return v!=null?v:sollDefault(iso)}
function istDay(iso){if(!istMap){istMap={};for(const e of S.entries)istMap[e.date]=(istMap[e.date]||0)+e.u}return istMap[iso]||0}
function sumRange(a,b,fn){let s=0;for(let d=a;d<=b;d=addDays(d,1))s+=fn(d);return s}
function monthRange(ym){const [y,m]=ym.split('-').map(Number);return[ym+'-01',ym+'-'+pad(new Date(y,m,0).getDate())]}
function smEff(){return S.mode==='jahr'?(S.startMonth||1):1}
function ayOf(iso){const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=smEff()?y:y-1}
function ayRange(y){const sm=smEff();return[y+'-'+pad(sm)+'-01',addDays((y+1)+'-'+pad(sm)+'-01',-1)]}
function ayLabel(y){return smEff()===1?String(y):y+'/'+String(y+1).slice(2)}
function ayList(){return[...new Set(S.entries.map(e=>ayOf(e.date)).concat([ayOf(todayIso())]))].sort((a,b)=>b-a)}
function aySel(fn){return`<select onchange="${fn}(this.value)">${ayList().map(y=>`<option value="${y}" ${y===ui.ay?'selected':''}>${ayLabel(y)}</option>`).join('')}</select>`}
function setAY(v){ui.ay=+v;render()}
function period(){
 if(S.mode==='jahr'){const [a,b]=ayRange(ui.ay);return{a,b,key:'J'+ui.ay,label:'Abrechnungsjahr '+ayLabel(ui.ay),file:'jahr-'+ayLabel(ui.ay).replace('/','-')}}
 const [a,b]=monthRange(ui.month);return{a,b,key:ui.month,label:MN[+ui.month.slice(5)-1]+' '+ui.month.slice(0,4),file:ui.month}}
function periodSel(){return S.mode==='jahr'?aySel('setAY'):monthSel(ui.month,'setMonth')}
function monthsIn(a,b){const out=[];let d=a.slice(0,7)+'-01';while(d<=b){const ym=d.slice(0,7),[x,y]=monthRange(ym),lo=x<a?a:x,hi=y>b?b:y;out.push({ym,label:MN[+ym.slice(5)-1]+' '+ym.slice(0,4),i:sumRange(lo,hi,istDay),s:sumRange(lo,hi,sollDay)});d=addDays(y,1)}return out}
function firstDate(){return S.entries.reduce((a,e)=>!a||e.date<a?e.date:a,'')}
function entriesOf(ym){return S.entries.filter(e=>e.date.startsWith(ym)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function byCat(list){const m={};list.forEach(e=>m[e.cat]=(m[e.cat]||0)+e.u);return Object.entries(m).sort((a,b)=>b[1]-a[1])}

function $(s){return document.querySelector(s)}
const TABS=[['erfassen','Erfassen'],['tage','Tage'],['liste','Liste'],['diagramme','Diagramme'],['bericht','Bericht'],['fokus','Fokus'],['daten','Einstellungen und Daten']];
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button class="${ui.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')+(LX?`<button class="chip" id="chip" onclick="chipClick()">Drive: ...</button>`:'');chipShow()}
function go(t){ui.tab=t;if(t==='fokus')foPull();render()}
function abrBar(){$('#abrbar').innerHTML=R.abr.map(a=>`<button class="${a.id===S.id?'on':''}" onclick="switchAbr('${a.id}')" title="${a.mode==='jahr'?'Abrechnung für das ganze Jahr':'monatsweise Abrechnung'}">${esc(a.name)} <small>${a.mode==='jahr'?'Jahr':'Monat'}</small></button>`).join('')+'<button onclick="newAbrGo()">+ Neue Abrechnung</button><span class="mut" style="margin-left:14px;align-self:center">Diese Abrechnung:</span><button class="'+(S.mode==='monat'?'on':'')+'" onclick="setMode(\'monat\')" title="Überstunden je Monat abrechnen">monatlich</button><button class="'+(S.mode==='jahr'?'on':'')+'" onclick="setMode(\'jahr\')" title="Ein Saldo über das ganze Schuljahr (Beginn einstellbar, Vorgabe August)">schuljährlich</button>'}
function setMode(m){if(S.mode===m)return;if(m==='jahr'&&(!S.startMonth||S.startMonth===1))S.startMonth=8;S.mode=m;istMap=null;ui.ay=ayOf(todayIso());ui.month=todayIso().slice(0,7);save();render()}
function switchAbr(id){const a=R.abr.find(x=>x.id===id);if(!a)return;R.cur=id;S=a;istMap=null;ui.edit=null;ui.fc='';ui.month=todayIso().slice(0,7);ui.ay=ayOf(todayIso());save();render()}
function newAbrGo(){ui.tab='daten';render();const e=$('#na_name');if(e){e.scrollIntoView({block:'center'});e.focus()}}
function render(){nav();abrBar();({erfassen:vErfassen,tage:vTage,liste:vListe,diagramme:vDiagramme,bericht:vBericht,fokus:vFokus,daten:vDaten})[ui.tab]();}

/* Erfassen */
function opts(list,sel){return list.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}
function kpis(){
 const t=todayIso(),mo=mondayOf(t),so=addDays(mo,6),[ma,mb]=monthRange(t.slice(0,7));
 const wi=sumRange(mo,so,istDay),ws=sumRange(mo,so,sollDay),mi=sumRange(ma,mb,istDay),ms=sumRange(ma,mb,sollDay);
 return `<div class="grid">
 <div class="kpi"><b>${fu(istDay(t))}</b><span>heute (Soll ${fu(sollDay(t))})</span></div>
 <div class="kpi"><b>${fu(wi)}</b><span>diese Woche (Soll ${fu(ws)})</span></div>
 <div class="kpi"><b>${fu(mi)}</b><span>dieser Monat (Soll ${fu(ms)})</span></div>
 ${kpi4(t,ma)}</div>`}
function kpi4(t,ma){
 if(S.mode==='jahr'){const y=ayOf(t),[ya,yb]=ayRange(y),e=t<yb?t:yb,v=sumRange(ya,e,istDay)-sumRange(ya,e,sollDay);return`<div class="kpi"><b class="${v>=-0.04?'pos':'neg'}">${sg(v)}</b><span>Saldo im Abrechnungsjahr ${ayLabel(y)} bis heute</span></div>`}
 const v=sumRange(ma,t,istDay)-sumRange(ma,t,sollDay);return`<div class="kpi"><b class="${v>=-0.04?'pos':'neg'}">${sg(v)}</b><span>Überstunden in diesem Monat bis heute</span></div>`}
function vErfassen(){
 const e=ui.edit?S.entries.find(x=>x.id===ui.edit):null;
 $('#main').innerHTML=`
 <div class="card"><h2>${esc(S.name)}: Übersicht (in Schulstunden)</h2>${kpis()}<p class="mut">Eine Schulstunde sind ${S.set.unit} Minuten, das Soll ${fu(sollWeek())} Schulstunden je Woche. Das Soll jedes einzelnen Tages können Sie im Reiter Tage oder beim Erfassen ändern; Standardwerte je Wochentag, Ferien und freie Tage stehen unter Einstellungen.</p></div>
 <div class="card"><h2>${e?'Eintrag ändern':'Schulstunden erfassen'}</h2>
 <div class="row">
 <div><label>Datum</label><input type="date" id="fd" value="${e?e.date:(ui.fdate||todayIso())}" onchange="ui.fdate=this.value;$('#fsoll').value=fu0(sollDay(this.value))"></div>
 <div><label>Soll dieses Tages (Schulstunden)</label><input type="number" min="0" step="0.5" id="fsoll" value="${fu0(sollDay(e?e.date:(ui.fdate||todayIso())))}"></div>
 <div><label>Schulstunden (ganze Zahl)</label><input type="number" min="1" step="1" id="fu" value="${e?e.u:''}" onkeydown="if(event.key==='Enter')saveEntry()"></div>
 <div><label>Tätigkeit</label><select id="fc">${opts(S.set.cats,e?.cat)}</select></div>
 <div><label>Schule</label><select id="fsch">${opts(S.set.schools,e?.school)}</select></div></div>
 <div class="row"><div style="grid-column:1/-1"><label>Notiz</label><input id="fn" value="${esc(e?.note||'')}" placeholder="z. B. AO-SF Gutachten Klasse 5" onkeydown="if(event.key==='Enter')saveEntry()"></div></div>
 <button class="b" onclick="saveEntry()">${e?'Änderung speichern':'Speichern'}</button> ${e?'<button class="g" onclick="ui.edit=null;render()">Abbrechen</button>':''}</div>
 ${recent()}`;
 if(!e)$('#fu').focus();
}
function recent(){const l=[...S.entries].reverse().sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:0).slice(0,8);if(!l.length)return'';
 return`<div class="card"><h2>Zuletzt erfasst</h2><table>${l.map(rowHtml).join('')}</table></div>`}
function rowHtml(e){return`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.cat)}<div class="mut">${esc(e.school)}${e.note?', '+esc(e.note):''}</div></td><td class="n">${fu(e.u)} Std.</td><td class="n noprint"><button class="g s" onclick="editE('${e.id}')">Ändern</button> <button class="g s" onclick="delE('${e.id}')">Löschen</button></td></tr>`}
function saveEntry(){
 const u=Number($('#fu').value),date=$('#fd').value;
 if(!date||!Number.isInteger(u)||u<1){alert('Bitte ein Datum und eine ganze Zahl an Schulstunden (mindestens 1) angeben.');return}
 const rec={id:ui.edit||uid(),date,u,cat:$('#fc').value,school:$('#fsch').value,note:$('#fn').value.trim()};
 const sv=$('#fsoll').value;if(sv!==''&&Number(sv)>=0)setSoll(date,sv,true);
 const i=S.entries.findIndex(x=>x.id===rec.id);if(i>=0)S.entries[i]=rec;else S.entries.push(rec);
 ui.fdate=date;ui.edit=null;save();render();
}
function editE(id){ui.edit=id;ui.tab='erfassen';render();scrollTo(0,0)}
function delE(id){if(confirm('Eintrag löschen?')){S.entries=S.entries.filter(e=>e.id!==id);save();render()}}

/* Tage: Soll und Ist je Tag, Soll frei änderbar */
function setSoll(iso,val,quiet){
 if(val===''||val==null||Number(val)===sollDefault(iso)){delete S.days[iso]}
 else{const v=Number(val);if(!(v>=0)){if(!quiet)alert('Bitte eine Zahl ab 0 eingeben.');return}S.days[iso]=v}
 save();if(!quiet)vTage()}
function resetSoll(iso){delete S.days[iso];delete S.dayS[iso];save();vTage()}
/* Soll je Schule: S.dayS[datum]={Schule:Stunden}; das Tagessoll S.days[datum] ist dann die Summe, damit alle Auswertungen unverändert bleiben */
function setSollS(iso,school,val){const m=S.dayS[iso]||(S.dayS[iso]={});
 if(val===''||val==null)delete m[school];else{const v=Number(val);if(!(v>=0)){alert('Bitte eine Zahl ab 0 eingeben.');return}m[school]=v}
 const ks=Object.keys(m);if(!ks.length){delete S.dayS[iso];delete S.days[iso]}else S.days[iso]=ks.reduce((a,k)=>a+m[k],0);
 save();vTage()}
function istSchool(iso){const m={};S.entries.forEach(e=>{if(e.date===iso)m[e.school]=(m[e.school]||0)+e.u});return m}
function quickAdd(iso,i){const u=Number(($('#qh'+i)||{}).value);if(!Number.isInteger(u)||u<1){alert('Bitte eine ganze Zahl an Schulstunden (mindestens 1) angeben.');return}
 ui.qs=$('#qs'+i).value;ui.qc=$('#qc'+i).value;S.entries.push({id:uid(),date:iso,u,cat:ui.qc,school:ui.qs,note:''});save();vTage()}
function vTage(){
 const [a,b]=monthRange(ui.month),sch=S.set.schools;let rows='',ti=0,ts=0,n=0;
 const qs=ui.qs&&sch.includes(ui.qs)?ui.qs:sch[0],qc=ui.qc&&S.set.cats.includes(ui.qc)?ui.qc:(S.set.cats.includes('Sonstiges')?'Sonstiges':S.set.cats[0]);
 for(let d=a;d<=b;d=addDays(d,1),n++){const w=dOf(d).getDay(),we=w==0||w==6,i=istDay(d),s=sollDay(d),ov=S.days[d]!=null||S.dayS[d],m=S.dayS[d]||{},im=istSchool(d);ti+=i;ts+=s;
  const hasS=!!S.dayS[d];
  rows+=`<tr ${we?'style="opacity:.6"':''}><td>${fmtDate(d)}${isFree(d)?' <span class="mut">frei</span>':''}</td>
  <td class="n"><input type="number" min="0" step="0.5" style="width:80px;text-align:right" value="${fu0(s)}" ${hasS?'disabled title="Summe der Schulen, links daneben änderbar"':`onchange="setSoll('${d}',this.value)" title="Standard: ${fu(sollDefault(d))}"`}></td>

/* Diagramme */
function stepOf(h){const raw=h/6;for(const n of [1,2,5,10,20,50,100,200,500])if(n>=raw)return n;return 1000}
function niceMax(v){const st=stepOf(v);return Math.max(st,Math.ceil(v/st)*st)}
function barSvg(items,o={}){
 const W=720,H=260,L=40,R=10,T=14,B=o.rot?52:30;
 const mx=niceMax(Math.max(1,...items.map(i=>Math.max(i.v,i.s||0)))),st=stepOf(mx);
 const iw=(W-L-R)/items.length,bw=Math.min(36,iw*0.7);
 const y=v=>T+(H-T-B)*(1-v/mx);
 let g='';
 for(let h=0;h<=mx;h+=st){g+=`<line x1="${L}" x2="${W-R}" y1="${y(h)}" y2="${y(h)}" stroke="var(--line)"/><text x="${L-5}" y="${y(h)+4}" text-anchor="end">${h}</text>`}
 items.forEach((it,i)=>{const x=L+iw*i+iw/2;
  g+=`<rect x="${x-bw/2}" y="${y(it.v)}" width="${bw}" height="${Math.max(0,y(0)-y(it.v))}" fill="var(--c0)" rx="2"><title>${esc(it.t||it.label)}: ${fu(it.v)} Schulstunden${it.s!=null?' (Soll '+fu(it.s)+')':''}</title></rect>`;
  if(it.s)g+=`<line x1="${x-bw/2-3}" x2="${x+bw/2+3}" y1="${y(it.s)}" y2="${y(it.s)}" stroke="var(--soll)" stroke-width="2.5"/>`;
  const ly=H-B+14;
  g+=o.rot?`<text transform="translate(${x},${ly}) rotate(40)">${esc(it.label)}</text>`:`<text x="${x}" y="${ly}" text-anchor="middle" ${it.we?'opacity=".5"':''}>${esc(it.label)}</text>`;
 });
 return`<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend"><span><i style="background:var(--c0)"></i>Ist (Schulstunden)</span><span><i style="background:var(--soll)"></i>Soll</span></div>`}
function donutSvg(data){
 const tot=data.reduce((a,d)=>a+d[1],0);if(!tot)return'<p class="mut">Keine Daten.</p>';
 const cx=110,cy=110,R=100,r=60;let a0=-Math.PI/2,p='';
 const top=data.slice(0,7),rest=data.slice(7).reduce((a,d)=>a+d[1],0);if(rest)top.push(['Weitere',rest]);
 top.forEach((d,i)=>{const a1=a0+d[1]/tot*2*Math.PI,large=a1-a0>Math.PI?1:0;
  const pt=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
  if(top.length===1){p+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="var(--c0)" stroke-width="${R-r}"/>`}
  else{const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
  p+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="var(${COLS[i]})"><title>${esc(d[0])}: ${fu(d[1])}</title></path>`}
  a0=a1});
 p+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:18px;font-weight:600">${fu(tot)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle">Schulstunden</text>`;
 const leg=top.map((d,i)=>`<span><i style="background:var(${COLS[i]})"></i>${esc(d[0])}: ${fu(d[1])} (${Math.round(d[1]/tot*100)} %)</span>`).join('');
 return`<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><svg viewBox="0 0 220 220" style="width:220px">${p}</svg><div class="legend" style="flex-direction:column;flex:1;min-width:200px">${leg}</div></div>`}
function vDiagramme(){
 const [a,b]=monthRange(ui.month);const days=[];
 for(let d=a;d<=b;d=addDays(d,1)){const w=dOf(d).getDay();days.push({label:String(+d.slice(8)),t:fmtDate(d),v:istDay(d),s:sollDay(d),we:w==0||w==6})}
 const weeks=[];const t=todayIso();let mo=mondayOf(addDays(t,-77));
 for(let i=0;i<12;i++){const e=addDays(mo,6);weeks.push({label:'KW '+kw(mo),t:'KW '+kw(mo)+' ('+fmtDate(mo)+')',v:sumRange(mo,e,istDay),s:sumRange(mo,e,sollDay)});mo=addDays(mo,7)}
 const months=[];for(let i=0;i<12;i++){const sm=smEff(),y=ui.ay+Math.floor((sm-1+i)/12),m=(sm-1+i)%12,ym=y+'-'+pad(m+1),[x,z]=monthRange(ym);months.push({label:MN[m].slice(0,3),t:MN[m]+' '+y,v:sumRange(x,z,istDay),s:sumRange(x,z,sollDay)})}
 $('#main').innerHTML=`
 <div class="card"><h2>Tage im Monat</h2><div class="bar">${monthSel(ui.month,'setMonth')}</div>${barSvg(days)}</div>
 <div class="card"><h2>Verteilung nach Tätigkeit, ${MN[+ui.month.slice(5)-1]} ${ui.month.slice(0,4)}</h2>${donutSvg(byCat(entriesOf(ui.month)))}</div>
 <div class="card"><h2>Die letzten 12 Wochen</h2>${barSvg(weeks,{rot:1})}</div>
 <div class="card"><h2>Monate im ${S.mode==='jahr'?'Abrechnungsjahr':'Jahr'}</h2><div class="bar">${aySel('setAY')}</div>${barSvg(months)}</div>`;
}

function reportData(a,b){

 const sch={};l.forEach(e=>sch[e.school]=(sch[e.school]||0)+e.u);

function fname(x){return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'abrechnung'}
function dl(kind){

 else{
  const T=s=>String(s).replace(/\\/g,'\\textbackslash{}').replace(/([&%$#_{}])/g,'\\$1').replace(/~/g,'\\textasciitilde{}').replace(/\^/g,'\\textasciicircum{}');
  let cum=0;
  txt=`\\documentclass[11pt,a4paper]{article}

${mo.map(m=>{cum+=m.i-m.s;return`${m.label} & ${fu(m.s)} & ${fu(m.i)} & ${sg(m.i-m.s)} & ${S.mode==='jahr'?sg(cum):T(S.settled[m.ym]?'abgerechnet':'')}\\\\`}).join('\n')}

`.replace('\\begin{document}','\\usepackage{longtable}\n\\begin{document}');name+='.tex'}
 down(txt,name,'text/plain');
}

 <div class="card"><h2>Datensicherung (alle Abrechnungen)</h2><p class="mut">${LX?'Die Linux-App speichert in Dokumente/Seifferts Zeit. Hier zusätzlich eine Datei oder CSV:':'Die Daten liegen im Speicher dieses Browsers. Bitte regelmäßig eine Sicherungsdatei speichern.'}</p>
 <button class="b" onclick="down(JSON.stringify({app:'seifferts-zeit',version:3,data:R},null,1),'zeit-sicherung-'+todayIso()+'.json','application/json')">Sicherung speichern</button>
 <label class="g" style="display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--tx);font:inherit">Sicherung laden<input type="file" accept=".json" class="hide" onchange="imp(this.files[0])"></label>
 <button class="g" onclick="dl2()">Alle Daten als CSV</button></div>`;
 if(LX)driveCard();
}
function createAbr(){
 const n=$('#na_name').value.trim();if(!n){alert('Bitte einen Namen eingeben.');return}
 const a=defaultsAbr(n);a.mode=$('#na_mode').value;a.startMonth=+$('#na_sm').value||1;
 if($('#na_copy').checked){a.set=JSON.parse(JSON.stringify(S.set));a.free=JSON.parse(JSON.stringify(S.free)).map(f=>({...f,id:uid()}))}
 R.abr.push(a);switchAbr(a.id);go('erfassen')}
function delAbr(){
 if(R.abr.length<2){alert('Die letzte Abrechnung kann nicht gelöscht werden.');return}
 if(!confirm('Abrechnung "'+S.name+'" mit '+S.entries.length+' Einträgen unwiderruflich löschen?'))return;
 R.abr=R.abr.filter(a=>a.id!==S.id);switchAbr(R.abr[0].id)}
function saveSet(){
 const L=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
 const c=L('#sc'),s=L('#sh');if(!c.length||!s.length){alert('Mindestens eine Tätigkeit und eine Schule nötig.');return}
 S.name=$('#an').value.trim()||S.name;S.mode=$('#am').value;S.startMonth=+$('#asmv').value||1;
 S.set={wd:[0,1,2,3,4].map(i=>Math.max(0,+$('#wd'+i).value||0)),unit:+$('#su').value||45,cats:c,schools:s};ui.ay=ayOf(todayIso());save();render()}
function addFree(){const f=$('#ff').value,t=$('#ft').value||f;if(!f||t<f){alert('Bitte gültige Daten angeben.');return}
 S.free.push({id:uid(),from:f,to:t,note:$('#fg').value.trim()});save();render()}
function delFree(id){S.free=S.free.filter(f=>f.id!==id);save();render()}
function imp(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;
 if(Array.isArray(d.abr)){if(!confirm('Alle aktuellen Abrechnungen durch die Sicherung ersetzen? ('+d.abr.length+' Abrechnungen)'))return;R=normRoot(d);S=R.abr.find(a=>a.id===R.cur)||R.abr[0];istMap=null;ui.ay=ayOf(todayIso());save();render()}
 else if(Array.isArray(d.entries)){if(!confirm('Diese Sicherung ('+d.entries.length+' Einträge) als neue Abrechnung hinzufügen?'))return;const a=normAbr({...d,id:undefined,name:d.name||'Importiert'});R.abr.push(a);switchAbr(a.id)}
 else throw 0}catch(e){alert('Die Datei ist keine gültige Sicherung.')}};r.readAsText(file)}
function dl2(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
 down('\ufeffDatum;Schulstunden;Tätigkeit;Schule;Notiz\n'+[...S.entries].sort((a,b)=>a.date<b.date?-1:1).map(e=>[e.date,e.u,e.cat,e.school,e.note].map(q).join(';')).join('\n'),'zeit-'+fname(S.name)+'-alle-daten.csv','text/csv')}

/* Fokus: Zeitmessung mit Sitzungen im Format der ToDo-Tabelle (Blatt Fokus). Punkte berechnet das ToDo, hier nur Zeiten. */
const fo={t:null};
function foFmt(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
function foMin(ms){return Math.round(ms/60000)}
function foStart(){const t=($('#fo_t')||{}).value||'',g=($('#fo_g')||{}).value||'';R.fokusRun={title:t.trim(),start:new Date().toISOString(),tags:g?[g]:[]};save();render()}
function foStop(){const r=R.fokusRun;if(!r)return;const end=new Date(),ms=end-new Date(r.start);R.fokusRun=null;
 if(ms>=1000){const title=(r.title||'Fokus').trim();R.fokus.push({id:'z|'+uid(),ref:'',title,meta:'',tags:r.tags||[],next:false,start:r.start,end:end.toISOString(),ms});}
 save();foPush();render()}
function foDrop(){if(!R.fokusRun||!confirm('Laufende Messung verwerfen?'))return;R.fokusRun=null;save();render()}
function foDel(id){if(!confirm('Diese Sitzung löschen?'))return;R.fokus=R.fokus.filter(x=>x.id!==id);save();render()}
const FO_WORK={evt:'EvT',herder:'Herder',job:'Job'};
function foCatOf(t){t=String(t).toLowerCase();const m=[[/korrektur|korrigier|klassenarbeit|klausur/,'Korrektur'],[/vorbereit|planung|material|arbeitsblatt/,'Vorbereitung'],[/konferenz|gremi|sitzung|dienstbesprechung/,'Konferenz und Gremien'],[/nta|ao-sf|aosf|inklusion|gutachten|förderplan|foerderplan/,'Inklusion, NTA, AO-SF'],[/eltern|beratung|gespräch|gespraech/,'Beratung und Elterngespräche'],[/aufsicht|vertretung/,'Aufsicht und Vertretung'],[/fortbildung|fobi/,'Fortbildung'],[/organis|verwaltung|e-?mail|mails/,'Organisation'],[/unterricht|stunde/,'Unterricht']];
 for(const [re,c] of m)if(re.test(t)&&S.set.cats.includes(c))return c;return S.set.cats.includes('Sonstiges')?'Sonstiges':S.set.cats[0]}
function foProps(){const used=new Set(R.fokusUsed),g={};
 R.fokus.forEach(x=>{if(used.has(x.id))return;const k=(x.tags||[]).map(t=>String(t).toLowerCase()).find(t=>FO_WORK[t]);if(!k)return;const d=isoOf(new Date(x.start)),key=d+'|'+k;
  const e=g[key]||(g[key]={key,date:d,tag:k,ms:0,ids:[],titles:[]});e.ms+=x.ms;e.ids.push(x.id);if(x.title&&!e.titles.includes(x.title))e.titles.push(x.title)});
 return Object.values(g).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)}
function foSchoolOf(tag){const n=FO_WORK[tag];if(tag==='job')return S.set.schools[0]||'';return S.set.schools.find(x=>x.toLowerCase()===n.toLowerCase())||n}
function foAccept(i){const p=foProps()[i];if(!p)return;const u=Math.max(1,parseInt(($('#fp_u'+i)||{}).value)||1);
 S.entries.push({id:uid(),date:p.date,u,cat:($('#fp_c'+i)||{}).value||foCatOf(p.titles.join(' ')),school:($('#fp_s'+i)||{}).value||foSchoolOf(p.tag),note:('Fokus: '+p.titles.join(', ')).slice(0,200)});
 R.fokusUsed.push(...p.ids);save();render()}
function foSkip(i){const p=foProps()[i];if(!p||!confirm('Diesen Vorschlag verwerfen? Es wird kein Eintrag angelegt.'))return;R.fokusUsed.push(...p.ids);save();render()}
function foPull(){if(!LX)return;api('fokus/pull','POST').then(r=>{if(!r||!r.ok){if(r&&r.msg){ui.foMsg=r.msg;if(ui.tab==='fokus')render()}return}ui.foPulled=true;
 const have=new Set(R.fokus.map(x=>x.id));let n=0;normFokus({fokus:r.rows}).fokus.forEach(x=>{if(!have.has(x.id)){R.fokus.push(x);n++}});
 ui.foMsg=n?n+' neue Sitzungen aus der ToDo-Tabelle übernommen.':'ToDo-Tabelle gelesen, nichts Neues ('+r.rows.length+' Sitzungen dort).';if(n)save();if(ui.tab==='fokus')render()}).catch(()=>{})}
function foPush(){if(LX)api('fokus/push','POST',{rows:R.fokus.slice(-900)}).then(r=>{ui.foMsg=r&&r.msg||'';if(ui.tab==='fokus')render()}).catch(()=>{})}
function vFokus(){const run=R.fokusRun,today=todayIso();
 const day=R.fokus.filter(x=>isoOf(new Date(x.start))===today).sort((a,b)=>a.start<b.start?1:-1);
 const sum=day.reduce((a,x)=>a+x.ms,0);
 const days={};R.fokus.forEach(x=>{const d=isoOf(new Date(x.start));days[d]=(days[d]||0)+x.ms});
 const last=Object.keys(days).sort().reverse().slice(0,14);
 $('#main').innerHTML=`<div class="card"><h2>Fokus</h2>
 ${run?`<p style="font-size:34px;margin:6px 0" id="fo_clock">${foFmt(Date.now()-new Date(run.start))}</p><p>${esc(run.title||'ohne Titel')}</p>
 <button class="b" onclick="foStop()">Beenden und speichern</button> <button class="g" onclick="foDrop()">Verwerfen</button>`
 :`<div class="bar"><input id="fo_t" placeholder="Woran arbeite ich?" style="min-width:260px" onkeydown="if(event.key==='Enter')foStart()"><select id="fo_g" title="Zählt als Arbeitszeit, wenn EvT, Herder oder Job gewählt ist"><option value="">ohne Zuordnung</option><option value="evt">EvT</option><option value="herder">Herder</option><option value="job">Job</option></select><button class="b" onclick="foStart()">Start</button></div>`}
 <p class="mut">Die Sitzungen werden mit den Zeitdaten gesichert${LX?' und, wenn eingerichtet, in das Blatt Fokus der ToDo-Tabelle geschrieben':''}. Punkte und Auswertung zeigt das ToDo.${ui.foMsg?'<br>'+esc(ui.foMsg):''}</p></div>
 ${(()=>{const pr=foProps();return pr.length?`<div class="card"><h3>Vorschläge für die Arbeitszeit</h3><p class="mut">Sitzungen mit EvT, Herder oder Job. Ein Eintrag entsteht erst, wenn Sie bestätigen. Schulstunden sind auf ganze Stunden gerundet (eine Stunde = ${S.set.unit} Minuten).</p><table><tr><th>Datum</th><th>Zuordnung</th><th>Minuten</th><th>Stunden</th><th>Tätigkeit</th><th>Schule</th><th></th></tr>${pr.map((p,i)=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(FO_WORK[p.tag])}</td><td>${foMin(p.ms)}</td><td><input id="fp_u${i}" type="number" min="1" step="1" style="width:60px" value="${Math.max(1,Math.round(p.ms/60000/S.set.unit))}"></td><td><select id="fp_c${i}">${S.set.cats.map(c=>`<option${c===foCatOf(p.titles.join(' '))?' selected':''}>${esc(c)}</option>`).join('')}</select></td><td><select id="fp_s${i}">${S.set.schools.map(c=>`<option${c===foSchoolOf(p.tag)?' selected':''}>${esc(c)}</option>`).join('')}</select></td><td><button class="b" onclick="foAccept(${i})">Eintragen</button> <button class="g" onclick="foSkip(${i})">Verwerfen</button></td></tr>`).join('')}</table></div>`:''})()}
 <div class="card"><h3>Heute: ${foMin(sum)} Minuten</h3>${day.length?`<table><tr><th>Von</th><th>Bis</th><th>Minuten</th><th>Titel</th><th>Zuordnung</th><th></th></tr>${day.map(x=>`<tr><td>${new Date(x.start).toTimeString().slice(0,5)}</td><td>${new Date(x.end).toTimeString().slice(0,5)}</td><td>${foMin(x.ms)}</td><td>${esc(x.title)}</td><td>${esc((x.tags||[]).join(', '))}</td><td><button class="g" onclick="foDel('${esc(x.id)}')">Löschen</button></td></tr>`).join('')}</table>`:'<p class="mut">Noch keine Sitzung heute.</p>'}</div>
 <div class="card"><h3>Letzte Tage</h3>${last.length?`<table>${last.map(d=>`<tr><td>${fmtDate(d)}</td><td>${foMin(days[d])} Minuten</td></tr>`).join('')}</table>`:'<p class="mut">Noch keine Sitzungen.</p>'}</div>`}
setInterval(()=>{const c=$('#fo_clock');if(c&&R.fokusRun)c.textContent=foFmt(Date.now()-new Date(R.fokusRun.start))},500);

/* Linux-App: Drive, Sicherung, Statusanzeige */
function api(path,method,body){return fetch(LX.base+'/api/'+path,{method:method||'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>r.json())}
function chipShow(){const c=$('#chip');if(c&&ui.drive)c.textContent='Drive: '+ui.drive.label}
function chipClick(){if(!ui.drive||ui.drive.state!=='ok'){driveLogin()}else{driveSync()}}
async function pollStatus(){
 try{const st=await api('status');
  if(st.seq!==LX.seq){location.reload();return}
  ui.drive=st.drive;ui.backup=st.backup;chipShow();if(st.drive.state==='ok'&&!ui.foPulled&&!ui.foTry){ui.foTry=true;foPull();setTimeout(()=>{ui.foTry=false},20000)}if(ui.tab==='daten')driveCard()}catch(e){}}
function driveCard(){const el=$('#drivecard');if(!el||!ui.drive)return;const d=ui.drive,b=ui.backup||{};
 el.innerHTML=`<h2>Google Drive und Laptop-Sicherung</h2>
 <p>Drive: <b>${esc(d.label)}</b>${d.last?', letzter Abgleich '+esc(d.last):''}${d.msg?'<br><span class="mut">'+esc(d.msg)+'</span>':''}</p>
 <p class="mut">Konflikte: Die Linux-App ist führend. Vor dem Überschreiben wird der alte Drive-Stand als Kopie in Drive gesichert. Die Anmeldung gilt etwa eine Stunde und wird nicht gespeichert.</p>
 <p class="mut">Anmelde-Adresse: ${esc(d.handoff_url||'noch nicht eingetragen')}<br>Client-ID: ${d.client_set?'eingetragen':'noch nicht eingetragen'}</p>
 <button class="b" onclick="driveLogin()">Mit Google Drive verbinden</button>
 <button class="g" onclick="driveSync()">Jetzt abgleichen</button>
 <button class="g" onclick="setHandoff()">Anmelde-Adresse ändern</button>
 <button class="g" onclick="setClient()">Client-ID ändern</button>
 <button class="g" onclick="setSheet()">ToDo-Tabelle für Fokus eintragen</button>
 <h3>Laptop</h3><p class="mut">Hauptdatei und Sicherungen: ${esc(b.dir||'')}<br>Letzte Sicherung: ${esc(b.last||'noch keine')}</p>
 <button class="g" onclick="api('backup','POST').then(pollStatus)">Sicherung jetzt anlegen</button>
 <button class="g" onclick="api('open_data','POST')">Datenordner öffnen</button>`}
async function ensureSettings(){const st=await api('status');
 if(!st.drive.handoff_url){const u=prompt('Internetadresse der veröffentlichten Seifferts Zeit (GitHub Pages, ohne Anhang), z. B. https://haigo-cyber.github.io/home-haigo/zeit.html');if(!u)return false;await api('settings','POST',{handoff_url:u.trim()})}
 if(!st.drive.client_set){const c=prompt('Google Client-ID (dieselbe wie beim Depot, endet auf apps.googleusercontent.com)');if(!c)return false;await api('settings','POST',{client_id:c.trim()})}
 return true}
async function driveLogin(){if(!await ensureSettings())return;await api('drive/login','POST');pollStatus()}
async function driveSync(){const r=await api('drive/sync','POST');if(r.need_login){driveLogin();return}pollStatus()}
async function setHandoff(){const u=prompt('Internetadresse der veröffentlichten Seite:',(ui.drive&&ui.drive.handoff_url)||'');if(u!==null){await api('settings','POST',{handoff_url:u.trim()});pollStatus()}}
async function setSheet(){const c=prompt('Tabellen-ID der ToDo-Tabelle (der lange Teil der Adresse zwischen /d/ und /edit). Leer lassen zum Abschalten:');if(c!==null){await api('settings','POST',{todo_sheet_id:c.trim()});alert('Gespeichert. Danach bitte einmal neu mit Google verbinden, damit der Zugriff auf Tabellen erteilt wird.');pollStatus()}}
async function setClient(){const c=prompt('Google Client-ID:');if(c){await api('settings','POST',{client_id:c.trim()});pollStatus()}}
if(LX){window.print=()=>{api('pdf','POST')};pollStatus();setInterval(pollStatus,3000);setTimeout(foPull,4000);setInterval(foPull,120000)}

ui.ay=ayOf(todayIso());
render();

/* linuxHandOff: Anmeldung für die Linux-App (nur aktiv mit Parametern in der Adresse) */
(function linuxHandOff(){
 const p=new URLSearchParams(location.search),port=p.get('linuxport'),st=p.get('linuxstate'),cid=p.get('linuxcid');
 if(!port||!st||!cid||LX)return;
 const ov=document.createElement('div');
 ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#f6f5f1;color:#1f2328;display:flex;align-items:center;justify-content:center;font:16px system-ui,sans-serif;text-align:center;padding:20px';
 ov.innerHTML='<div><h2>Seifferts Zeit: Anmeldung bei Google Drive</h2><p id="hom">Google-Bibliothek wird geladen ...</p><button id="hob" disabled style="font:inherit;padding:10px 18px;border-radius:6px;border:0;background:#2f6f9f;color:#fff;cursor:pointer">Bei Google anmelden</button></div>';
 document.body.appendChild(ov);
 const msg=t=>{document.getElementById('hom').textContent=t};
 const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';
 sc.onload=()=>{msg('Bitte auf die Schaltfläche klicken. Danach können Sie dieses Fenster schließen.');document.getElementById('hob').disabled=false};
 sc.onerror=()=>msg('Die Google-Bibliothek konnte nicht geladen werden.');
 document.head.appendChild(sc);
 document.getElementById('hob').onclick=()=>{
  try{google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file'+(p.get('linuxsheets')==='1'?' https://www.googleapis.com/auth/spreadsheets':''),
   callback:r=>{if(r.error||!r.access_token){msg('Anmeldung fehlgeschlagen: '+(r.error||'kein Token'));return}
    msg('Übergabe an die App ...');
    location.href='http://127.0.0.1:'+port+'/auth/token?state='+encodeURIComponent(st)+'&token='+encodeURIComponent(r.access_token)+'&expires='+encodeURIComponent(r.expires_in||3300)},
   error_callback:e=>msg('Anmeldung abgebrochen oder blockiert: '+(e&&e.type||''))}).requestAccessToken()}catch(e){msg('Fehler: '+e)}}
})();
</script>
