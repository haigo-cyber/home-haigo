<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seifferts Zeit</title>
<!--SZ-LINUX-->
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--line:#d9d6cc;--acc:#2f6f9f;--acc-ink:#fff;--ok:#2e7d4f;--bad:#b3402f;--soll:#c0392b;

*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:14px 10px 10px;background:var(--card);border-right:1px solid var(--line);z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand .ver{display:block;font-size:11.5px;color:var(--mut)}
svg.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.logo svg.ico{width:20px;height:20px}
.side h6{margin:10px 10px 2px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
nav{display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:6px 10px;border:0;border-radius:8px;background:none;color:var(--tx);font:inherit;text-align:left;cursor:pointer;position:relative}
.item:hover{background:var(--bg)}
.item .ico{color:var(--mut)}
.item.on{background:var(--bg);color:var(--acc);font-weight:600}
.item.on .ico{color:var(--acc)}
.item.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.item:focus-visible,.abrbar button:focus-visible,.chip:focus-visible,.menubtn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.item .cnt{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:600;line-height:20px;text-align:center}
.abrbar{display:flex;flex-direction:column;gap:2px}
.abrbar .abr{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:5px 10px;border:1px solid transparent;border-radius:8px;background:none;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.abrbar .abr:hover{background:var(--bg)}
.abrbar .abr.on{background:var(--bg);border-color:var(--line);font-weight:600}
.abrbar .abr small{color:var(--mut);font-weight:400;font-size:11.5px}
.abrbar .abr.new{color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;margin:6px 2px 0;padding:2px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.seg button{border:0;border-radius:7px;padding:5px 6px;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.sidefoot{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side .chip{margin:2px 2px 0;width:calc(100% - 4px);text-align:left;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:none;color:var(--mut);cursor:pointer}
.topbar{display:none}
.scrim{display:none}
.content{min-width:0}
main{max-width:1000px;margin:0 auto;padding:22px 24px}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:auto;transform:translateX(-102%);transition:transform .2s ease;box-shadow:none}
 body.navopen .side{transform:none;box-shadow:0 0 30px rgba(0,0,0,.35)}
 body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
 .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;height:50px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
 .topbar b{font-size:16px}
 .menubtn{border:0;background:none;color:var(--tx);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
 .menubtn:hover{background:var(--bg)}
 main{padding:14px 12px}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:22px}
.kpi span{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
input,select,textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:10px}
button.b{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:none;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
button.s{padding:2px 8px;font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.timer{font-size:28px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--tx);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.hide{display:none}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar select,.bar input{width:auto}
@media print{.side,.topbar,.scrim,.noprint{display:none!important}.app{display:block}body{background:#fff;color:#000}.card{border:0;padding:0}main{max-width:none;padding:0}svg text{fill:#000}}
</style>
</head>

 <div class="brand"><div class="logo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div><div><b>Seifferts Zeit</b><span class="ver">Version 2.35</span></div></div>

</div>

function dOf(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d)}

/* Schulstunden und Minuten: Eingabe in Schulstunden, Ausgabe immer mit Minuten (4 Schulstunden (180 min)). Einträge aus dem Fokus tragen die echten Minuten (e.min). */
function emin(e){return e.min!=null&&!isNaN(+e.min)?+e.min:e.u*S.set.unit}

function hm(min){const m=Math.round(min),a=Math.abs(m);return(m<0?'-':'')+Math.floor(a/60)+':'+pad(a%60)+' h'}
function istManMin(iso){return S.entries.reduce((a,e)=>e.date===iso?a+emin(e):a,0)}
/* Dienst netto: Präsenz minus Pause, heute nur bis jetzt, nicht für die Zukunft, nicht bei Krankheit */
function dnNetMin(iso){const t=todayIso();if(iso>t)return 0;const o=dnEff(iso);if(!o||o.krank)return 0;const a=dnMin(o.von);if(a<0)return 0;let b=dnMin(o.bis);const n=new Date(),now=n.getHours()*60+n.getMinutes();
 if(iso===t){if(b<0||b>now)b=now}else if(b<0)return 0;return Math.max(0,b-a-(o.pause||0))}
/* Arbeitszeit eines Tages: Dienst (automatisch) oder erfasste Einträge, was größer ist; so wird nichts doppelt gezählt */
function istMin(iso){const m=istManMin(iso);return S.set.auto?Math.max(m,dnNetMin(iso)):m}
function istAuto(iso){return !!S.set.auto&&dnNetMin(iso)>istManMin(iso)}

function isFree(iso){return S.free.some(f=>iso>=f.from&&iso<=f.to)}

/* Erfassungsbeginn: Vor dem ersten erfassten Tag (Unterricht, Dienst, Eintrag) gibt es kein Soll, sonst stünde für Zeiten ohne Erfassung ein Rückstand da. Von Hand änderbar (Einstellungen). */
function erfStart(){if(R.erfab)return R.erfab;if(_erf)return _erf;let m='';const up=d=>{if(d&&(!m||d<m))m=d};
 R.ur.stunden.forEach(x=>{if(!x.pl)up(x.date)});R.abr.forEach(a=>a.entries.forEach(e=>up(e.date)));Object.keys(R.dienst).forEach(up);if(R.dplan.on)up(R.dplan.from);
 return _erf=m||todayIso()}
/* Wochensoll je Schule: die Einstellung der Abrechnung; steht dort nichts, gelten die Pflichtstunden aus dem Deputat (je Schule, sonst gesamt auf der Standardschule) */

 S.set.schools.forEach(k=>{const v=+((R.ur.set.sch[k]||{}).wh)||0;o[k]=v;t+=v});if(t>0)return o;
 const d=urDef();if(d in o&&R.ur.set.wh>0)o[d]=R.ur.set.wh;return o}
function sollWeek(){return Object.values(swEff()).reduce((a,b)=>a+(+b||0),0)}
function sollOff(iso){const w=dOf(iso).getDay();if(w==0||w==6||isFree(iso)||iso<erfStart())return true;if(S.set.auto){const e=R.dienst[iso];if((e&&e.krank)||dnFree(iso))return true}return false}

function unterrichtMap(){const held={},man={},keys=new Set();
 urLive().forEach(x=>{if(x.status==='gehalten'){const k=x.date+'|'+urSch(x);held[k]=(held[k]||0)+(+x.n||0);keys.add(k)}});

  if(S.set.auto){const m=unterrichtMap();Object.keys(m).forEach(k=>{const d=k.slice(0,10);istMap[d]=(istMap[d]||0)+m[k]})}}return istMap[iso]||0}

function sollEff(d){const t=todayIso();if(d>t)return 0;const x=sollDay(d);return d===t?Math.min(x,istDay(d)):x}

 else if(f.per==='woche'){a=addDays(mondayOf(t),7*o);b=addDays(a,6);lab='KW '+kw(a)+' ('+fmtDate(a).slice(4)+' bis '+fmtDate(b).slice(4)+')'}
 else if(f.per==='monat'){const d=dOf(t.slice(0,7)+'-01');d.setMonth(d.getMonth()+o);const ym=isoOf(d).slice(0,7);[a,b]=monthRange(ym);lab=MN[+ym.slice(5)-1]+' '+ym.slice(0,4)}
 else if(f.per==='kj'){[a,b]=kjRange(o);lab='Kalenderjahr '+a.slice(0,4)}
 else if(f.per==='sj'){[a,b]=sjRange(o);lab='Schuljahr '+sjLab(a)}
 else if(f.per==='jahr'){const y=ayOf(t)+o;[a,b]=ayRange(y);lab=(S.mode==='jahr'?'Abrechnungsjahr ':'Jahr ')+ayLabel(y)}
 else{a=f.a||t;b=f.b||a;if(b<a)b=a;lab=fmtDate(a)+' bis '+fmtDate(b)}

function tpSet(k,v){const f=ui.tp||(ui.tp={per:'monat',off:0,a:todayIso(),b:todayIso()});if(k==='per')f.off=0;f[k]=v;if(k==='a'&&(!f.b||f.b<v))f.b=v;render()}
function tachoSvg(o){const {ist,soll,ref,fmt,tol,title,pastEnd}=o,pct=soll>0?ist/soll*100:0,P=Math.min(125,Math.max(0,pct)),cx=130,cy=118,r=92,pt=(p,rr)=>{const th=Math.PI*(1-p/125);return[cx+rr*Math.cos(th),cy-rr*Math.sin(th)]};
 const arc=(p0,p1,col,w)=>{if(p1<=p0)return'';const seg=(a,b)=>{const A=pt(a,r),B=pt(b,r);return`<path d="M${A[0].toFixed(1)},${A[1].toFixed(1)} A${r},${r} 0 0 1 ${B[0].toFixed(1)},${B[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="butt"/>`};return p1-p0>62?seg(p0,(p0+p1)/2)+seg((p0+p1)/2,p1):seg(p0,p1)};
 const d=ist-ref,state=(soll<=0||(ref===0&&ist===0))?'n':d>=-tol?'ok':(ref>0&&ist>=ref*0.9)?'warn':'bad',col={ok:'var(--ok)',warn:'#d99a1e',bad:'var(--bad)',n:'var(--mut)'}[state];
 const t100=[pt(100,r-12),pt(100,r+12)],nd=pt(P,r-10),pr=ref>0&&soll>0&&ref<soll?Math.min(125,ref/soll*100):null;
 let g=arc(0,125,'var(--line)',16)+arc(0,P,col,16);
 g+=`<line x1="${t100[0][0].toFixed(1)}" y1="${t100[0][1].toFixed(1)}" x2="${t100[1][0].toFixed(1)}" y2="${t100[1][1].toFixed(1)}" stroke="var(--tx)" stroke-width="2"/><text x="${pt(100,r+22)[0].toFixed(1)}" y="${(pt(100,r+22)[1]+4).toFixed(1)}" text-anchor="middle" style="font-size:11px;fill:var(--mut)">Soll</text>`;
 if(pr!=null){const a=pt(pr,r+11),b=pt(pr,r-11);g+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="var(--acc)" stroke-width="3"><title>Soll bis heute: ${fmt(ref)}</title></line><text x="${pt(pr,r+24)[0].toFixed(1)}" y="${(pt(pr,r+24)[1]+4).toFixed(1)}" text-anchor="middle" style="font-size:11px;fill:var(--acc)">heute</text>`}
 g+=`<line x1="${cx}" y1="${cy}" x2="${nd[0].toFixed(1)}" y2="${nd[1].toFixed(1)}" stroke="var(--tx)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="var(--tx)"/>`;
 g+=`<text x="${cx-r}" y="${cy+16}" text-anchor="middle" style="font-size:11px;fill:var(--mut)">0</text><text x="${cx+r}" y="${cy+16}" text-anchor="middle" style="font-size:11px;fill:var(--mut)">125 %</text>`;
 g+=`<text x="${cx}" y="${cy+40}" text-anchor="middle" style="font-size:26px;font-weight:700;fill:${col}">${soll>0?Math.round(pct)+' %':'–'}</text>`;
 const rest=soll-ist,txt=[`Ist <b>${fmt(ist)}</b> von Soll <b>${fmt(soll)}</b>`];
 if(pr!=null||(ref>0&&ref<soll))txt.push(`Soll bis heute ${fmt(ref)}: <b class="${d>=-tol?'pos':'neg'}">${(d>=-tol?'+':'-')+fmt(Math.abs(d)).replace(/^-/,'')}</b> ${d>=-tol?'voraus':'im Rückstand'}`);
 else if(ref===0&&ist===0&&soll>0)txt.push('Der Zeitraum hat noch nicht begonnen.');
 else if(soll>0)txt.push(`Differenz zum Soll: <b class="${d>=-tol?'pos':'neg'}">${d>=0?'+':'-'}${fmt(Math.abs(d))}</b>`);
 if(rest>tol&&!pastEnd)txt.push(`Noch offen bis zum Soll: ${fmt(rest)}`);
 return`<div class="tacho" style="flex:1;min-width:270px;max-width:380px"><h3 style="margin:0 0 2px">${esc(title)}</h3><svg viewBox="0 0 260 182" role="img" aria-label="${esc(title)}: ${soll>0?Math.round(pct)+' Prozent des Solls':'kein Soll'}" style="width:100%;max-width:340px">${g}</svg><div style="font-size:13.5px;line-height:1.5">${txt.join('<br>')}</div></div>`}
function tachoCard(kinds){const R_=tpRange(),f=ui.tp,t=R_.t,a=R_.a,b=R_.b,ref=(fn)=>t<a?0:sumRange(a,t<b?t:b,fn),pastEnd=b<t;
 const per=[['tag','Tag'],['woche','Woche'],['monat','Monat'],['kj','Kalenderjahr'],['sj','Schuljahr'],...(S.mode==='jahr'&&![1,8].includes(S.startMonth)?[['jahr','Abrechnungsjahr']]:[]),['frei','Zeitraum']];
 const sg_=kinds.includes('s')?tachoSvg({title:'Schulstunden',ist:sumRange(a,b,istDay),soll:sumRange(a,b,sollDay),ref:ref(sollEff),fmt:v=>fu(v),tol:0.04,pastEnd}):'';
 const ag_=kinds.includes('a')?tachoSvg({title:'Arbeitszeit',ist:sumRange(a,b,istMin),soll:sumRange(a,b,sollAz),ref:ref(sollAzEff),fmt:v=>hm(v),tol:2,pastEnd}):'';
 return`<div class="card"><h2>Tacho: Ist gegen Soll</h2><div class="bar noprint">${per.map(q=>`<button class="${f.per===q[0]?'b':'g'}" onclick="tpSet('per','${q[0]}')">${q[1]}</button>`).join('')}${f.per==='frei'?`<input type="date" value="${R_.a}" onchange="tpSet('a',this.value)"><input type="date" value="${R_.b}" onchange="tpSet('b',this.value)">`:`<button class="g" onclick="tpSet('off',${(f.off||0)-1})" title="früher">&#9664;</button><button class="g" onclick="tpSet('off',${(f.off||0)+1})" title="später">&#9654;</button><button class="g" onclick="tpSet('off',0)">aktuell</button>`}<b>${esc(R_.lab)}</b></div><div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">${sg_}${ag_}</div><p class="mut">Der Zeiger zeigt, wie viel vom Soll des ganzen Zeitraums erreicht ist. Die blaue Marke "heute" zeigt, wie viel Soll bis heute schon fällig war. Grün: Soll bis heute erreicht, gelb: bis zu 10 % darunter, rot: weiter darunter. Die Zeiger reichen bis 125 %.</p></div>`}
function kpis(){
 const t=todayIso(),mo=mondayOf(t),so=addDays(mo,6),[ma,mb]=monthRange(t.slice(0,7));
 const wi=sumRange(mo,so,istDay),ws=sumRange(mo,so,sollEff),mi=sumRange(ma,mb,istDay),ms=sumRange(ma,mb,sollEff);
 return `<div class="grid">

 <div class="kpi"><b>${fu(wi)}</b><span>diese Woche (Soll bis heute ${fu(ws)})</span></div>
 <div class="kpi"><b>${fu(mi)}</b><span>dieser Monat (Soll bis heute ${fu(ms)})</span></div>
 ${kpi4(t,ma)}
 ${[['Kalenderjahr '+t.slice(0,4),kjRange()],['seit Schuljahresbeginn '+sjLab(sjRange()[0]),sjRange()]].map(x=>{const k=seitSum(x[1][0],x[1][1],istDay,sollEff);return`<div class="kpi"><b>${fu(k.i)}</b><span>${x[0]} (Soll bis heute ${fu(k.s)}, ${sg(k.i-k.s)})</span></div>`}).join('')}</div>`}
function kpi4(t,ma){
 if(S.mode==='jahr'){const y=ayOf(t),[ya,yb]=ayRange(y),e=t<yb?t:yb,v=sumRange(ya,e,istDay)-sumRange(ya,e,sollEff);return`<div class="kpi"><b class="${v>=-0.04?'pos':'neg'}">${sg(v)}</b><span>Saldo im Abrechnungsjahr ${ayLabel(y)} bis heute</span></div>`}
 const v=sumRange(ma,t,istDay)-sumRange(ma,t,sollEff);return`<div class="kpi"><b class="${v>=-0.04?'pos':'neg'}">${sg(v)}</b><span>Überstunden in diesem Monat bis heute</span></div>`}

/* Diagramme */
function stepOf(h){const raw=h/6;for(const n of [1,2,5,10,20,50,100,200,500])if(n>=raw)return n;return 1000}
function niceMax(v){const st=stepOf(v);return Math.max(st,Math.ceil(v/st)*st)}
function barSvg(items,o={}){
 const W=720,H=260,L=40,R=10,T=14,B=o.rot?52:30;
 const mx=niceMax(Math.max(1,...items.map(i=>Math.max(i.v,i.s||0)))),st=stepOf(mx);
 const iw=(W-L-R)/items.length,bw=Math.min(36,iw*0.7);
 const y=v=>T+(H-T-B)*(1-v/mx);
 let g='';
 for(let h=0;h<=mx;h+=st){g+=`<line x1="${L}" x2="${W-R}" y1="${y(h)}" y2="${y(h)}" stroke="var(--line)"/><text x="${L-5}" y="${y(h)+4}" text-anchor="end">${h}</text>`}
 items.forEach((it,i)=>{const x=L+iw*i+iw/2;
  g+=`<rect x="${x-bw/2}" y="${y(it.v)}" width="${bw}" height="${Math.max(0,y(0)-y(it.v))}" fill="var(--c0)" rx="2"><title>${esc(it.t||it.label)}: ${fu(it.v)} Schulstunden${it.s!=null?' (Soll '+fu(it.s)+')':''}</title></rect>`;
  if(it.s)g+=`<line x1="${x-bw/2-3}" x2="${x+bw/2+3}" y1="${y(it.s)}" y2="${y(it.s)}" stroke="var(--soll)" stroke-width="2.5"/>`;
  const ly=H-B+14;
  g+=o.rot?`<text transform="translate(${x},${ly}) rotate(40)">${esc(it.label)}</text>`:`<text x="${x}" y="${ly}" text-anchor="middle" ${it.we?'opacity=".5"':''}>${esc(it.label)}</text>`;
 });
 return`<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend"><span><i style="background:var(--c0)"></i>Ist (Schulstunden)</span><span><i style="background:var(--soll)"></i>Soll</span></div>`}
function dcol(d,i){return R.vis&&R.vis.on?(d[0]==='Weitere'?'#999':visColor('cat',d[0])):'var('+COLS[i]+')'}
function donutSvg(data){
 const tot=data.reduce((a,d)=>a+d[1],0);if(!tot)return'<p class="mut">Keine Daten.</p>';
 const cx=110,cy=110,R=100,r=60;let a0=-Math.PI/2,p='';
 const top=data.slice(0,7),rest=data.slice(7).reduce((a,d)=>a+d[1],0);if(rest)top.push(['Weitere',rest]);
 top.forEach((d,i)=>{const a1=a0+d[1]/tot*2*Math.PI,large=a1-a0>Math.PI?1:0;
  const pt=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
  if(top.length===1){p+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${dcol(top[0],0)}" stroke-width="${R-r}"/>`}
  else{const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
  p+=`<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${dcol(d,i)}"><title>${esc(d[0])}: ${fu(d[1])}</title></path>`}
  a0=a1});
 p+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:18px;font-weight:600">${fu(tot)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle">Schulstunden</text>`;
 const leg=top.map((d,i)=>`<span><i style="background:${dcol(d,i)}"></i>${esc(d[0])}: ${fu(d[1])} (${Math.round(d[1]/tot*100)} %)</span>`).join('');
 return`<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><svg viewBox="0 0 220 220" style="width:220px">${p}</svg><div class="legend" style="flex-direction:column;flex:1;min-width:200px">${leg}</div></div>`}

 t2=tachoSvg({title:'Unterricht im Schuljahr',ist:sum(x=>x.ist),soll:sum(urFull),ref:sum(x=>x.eff),fmt:urFmt,tol:0.04,pastEnd:false}),

 bars=sy.map(x=>({label:MN[+x.ym.slice(5)-1].slice(0,3),t:MN[+x.ym.slice(5)-1]+' '+x.ym.slice(0,4),v:x.ist,s:urFull(x)}));

 else{
  const T=s=>String(s).replace(/\\/g,'\\textbackslash{}').replace(/([&%$#_{}])/g,'\\$1').replace(/~/g,'\\textasciitilde{}').replace(/\^/g,'\\textasciicircum{}');

/* Dienst: Dienstantritt und Dienstende je Tag (Präsenz). Regulärer Wochenplan (R.dplan) erzeugt die Dienste automatisch, einzelne Tage lassen sich überschreiben, als krank oder als dienstfrei markieren.
   Alles geht in das Blatt Dienst der ToDo-Tabelle; dort rechnet das ToDo Punkte (Unterricht, Gespräche und Fokus werden abgezogen). */
function dnSchoolStart(){const t=todayIso(),y=+t.slice(0,4),m=+t.slice(5,7);return(m>=8?y:y-1)+'-08-01'}
function dnTime(v){return /^\d{2}:\d{2}$/.test(v||'')?v:''}
function normDplan(d){d=d&&typeof d==='object'?d:{};const wd={};for(let w=1;w<=5;w++){const v=(d.wd||{})[w]||{},a=dnTime(v.von),b=dnTime(v.bis);if(a&&b&&b>a)wd[w]={von:a,bis:b,pause:Math.max(0,Math.min(600,Math.round(+v.pause)||0))}}
 const paused=d.paused!==undefined?!!d.paused:(d.on===false&&!!d.mod);
 return{on:Object.keys(wd).length>0&&!paused,paused,from:/^\d{4}-\d{2}-\d{2}$/.test(d.from||'')?d.from:dnSchoolStart(),wd,mod:String(d.mod||'')}}
function normDienst(d){d=d&&typeof d==='object'?d:{};const r={},cut=isoOf(new Date(Date.now()-400*864e5));
 Object.keys(d).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().slice(-600).forEach(k=>{const v=d[k]||{},von=dnTime(v.von),mod=String(v.mod||'');
  if(v.krank)r[k]={von:'',bis:'',pause:0,mod,krank:true};
  else if(von)r[k]={von,bis:dnTime(v.bis),pause:Math.max(0,Math.min(600,Math.round(+v.pause)||0)),mod};
  else if(v.del&&k>=cut)r[k]={von:'',bis:'',pause:0,mod,del:true}});return r}
function dnMin(t){const m=/^(\d{2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):-1}
function dnHM(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function dnFree(day){return urFreeSet(+day.slice(0,4)).has(day)}
/* wirksamer Dienst eines Tages: eigener Eintrag, sonst Wochenplan (nicht in Ferien und an freien Tagen, nicht vor dem Startdatum, bis 14 Tage voraus) */
function dnEff(day){const e=R.dienst[day];
 if(e){if(e.krank)return{krank:true};if(e.del)return null;return{von:e.von,bis:e.bis,pause:e.pause,plan:false,mod:e.mod}}
 const P=R.dplan;if(!P.on||day<P.from||day>addDays(todayIso(),14))return null;
 const v=P.wd[dOf(day).getDay()];if(!v||dnFree(day))return null;return{von:v.von,bis:v.bis,pause:v.pause,plan:true,mod:P.mod}}
function dnDays(){const t=todayIso(),set=new Set(Object.keys(R.dienst));
 if(R.dplan.on){for(let d=R.dplan.from;d<=addDays(t,14)&&set.size<1500;d=addDays(d,1))set.add(d)}return[...set].sort()}
function dnLive(){return dnDays().filter(k=>{const e=dnEff(k);return e&&!e.krank})}
function dnLastPause(){const k=dnLive().filter(d=>d<=todayIso()).pop();return k?dnEff(k).pause:0}
function dnBelegt(day){return R.gs.list.filter(x=>x.date===day&&(x.status==='geplant'||x.status==='gefuehrt')).map(x=>{const s=dnMin(x.time);return s<0?null:[s,Math.min(1440,s+x.min)]}).filter(Boolean)}
function dnRows(){const rows=[];dnDays().forEach(k=>{const e=dnEff(k),ex=R.dienst[k];
  if(e&&!e.krank)rows.push({date:k,von:e.von,bis:e.bis,pause:e.pause,belegt:dnBelegt(k).map(w=>dnHM(w[0])+'-'+dnHM(w[1])).join(';'),mod:e.mod||''});
  else if(ex)rows.push({date:k,von:'',bis:'',pause:0,belegt:'',mod:ex.mod||''})});return rows}
function dnPushMaybe(){if(!LX)return;const rows=dnRows(),j=JSON.stringify(rows);if(j===ui.dnSent||!rows.length)return;
 api('dienst/push','POST',{rows}).then(r=>{if(r&&r.ok)ui.dnSent=j;ui.dnMsg=(r&&r.msg)||'';const f=document.activeElement;if(ui.tab==='dienst'&&!(f&&/^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)))render()}).catch(()=>{})}
if(LX){setTimeout(dnPushMaybe,4000);setInterval(dnPushMaybe,60000);setTimeout(()=>urImport(true),1500);setInterval(()=>{if(Date.now()-_urLast>600000)urImport(true)},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-_urLast>300000)urImport(true)})}
function dnSet(day,ch){const e=dnEff(day),o=e&&!e.krank?{von:e.von,bis:e.bis,pause:e.pause}:{von:'',bis:'',pause:dnLastPause()};Object.assign(o,ch,{mod:new Date().toISOString()});R.dienst[day]=o;save();dnPushMaybe()}
function dnNow(w){const day=todayIso(),n=new Date(),t=pad(n.getHours())+':'+pad(n.getMinutes());ui.dnDay=day;
 if(w==='von'){dnSet(day,{von:t,bis:''});ui.dnMsg='Dienstantritt '+t+' eingetragen.'}
 else{const e=dnEff(day);if(!e||e.krank||!e.von){ui.dnMsg='Für heute ist noch kein Dienstantritt eingetragen.';render();return}
  if(dnMin(t)<=dnMin(e.von)){ui.dnMsg='Das Dienstende muss nach dem Dienstantritt liegen.';render();return}
  dnSet(day,{bis:t});ui.dnMsg='Dienstende '+t+' eingetragen.'}
 render()}
function dnSave(){const day=($('#dn_d')||{}).value||todayIso(),von=($('#dn_v')||{}).value||'',bis=($('#dn_b')||{}).value||'',pause=Math.max(0,Math.min(600,Math.round(+($('#dn_p')||{}).value)||0));
 if(!von){ui.dnMsg='Bitte einen Dienstantritt eintragen.';render();return}
 if(bis&&dnMin(bis)<=dnMin(von)){ui.dnMsg='Das Dienstende muss nach dem Dienstantritt liegen (Dienste über Mitternacht werden nicht unterstützt).';render();return}
 ui.dnDay=day;R.dienst[day]={von,bis,pause,mod:new Date().toISOString()};save();dnPushMaybe();ui.dnMsg='Gespeichert: '+dnDe(day)+', '+von+(bis?' bis '+bis:' (Dienstende offen)')+'.';render()}
function dnDe(k){return k.split('-').reverse().join('.')}
function dnMark(day,kind){R.dienst[day]={von:'',bis:'',pause:0,mod:new Date().toISOString(),...(kind==='krank'?{krank:true}:{del:true})}}
function dnKrankDay(day){dnMark(day,'krank');ui.dnDay=day;save();dnPushMaybe();ui.dnMsg=dnDe(day)+' als krank eingetragen.';render()}
function dnKeinDienst(day){dnMark(day,'frei');ui.dnDay=day;save();dnPushMaybe();ui.dnMsg=dnDe(day)+': kein Dienst.';render()}
function dnReset(day){delete R.dienst[day];save();dnPushMaybe();ui.dnMsg=dnDe(day)+': eigener Eintrag entfernt'+(R.dplan.on?', der Wochenplan gilt wieder.':'.');render()}
function dnKrankRange(){const a=($('#dk_a')||{}).value||'',b=($('#dk_b')||{}).value||a;
 if(!a){ui.dnMsg='Bitte den ersten Krankheitstag eintragen.';render();return}
 if(b<a){ui.dnMsg='Das Ende der Krankheit liegt vor dem Beginn.';render();return}
 let n=0;for(let d=a;d<=b&&n<400;d=addDays(d,1)){const w=dOf(d).getDay();if(w>0&&w<6&&!dnFree(d)){dnMark(d,'krank');n++}}
 save();dnPushMaybe();ui.dnMsg=n?n+' Krankheitstag'+(n===1?'':'e')+' eingetragen ('+dnDe(a)+(b!==a?' bis '+dnDe(b):'')+'; Wochenenden, Ferien und freie Tage ausgelassen).':'Im gewählten Zeitraum liegt kein Schultag.';render()}
function dnPlanRead(){const P={paused:!($('#dp_on')||{checked:true}).checked,from:($('#dp_f')||{}).value||dnSchoolStart(),wd:{},mod:new Date().toISOString()};let err='';
 for(let w=1;w<=5;w++){const a=($('#dp_v'+w)||{}).value||'',b=($('#dp_b'+w)||{}).value||'';
  if(a&&b){if(b<=a){err='Das Ende muss nach dem Antritt liegen ('+DN_WD[w]+'). Dieser Tag wurde noch nicht übernommen.';continue}P.wd[w]={von:a,bis:b,pause:Math.max(0,Math.min(600,Math.round(+($('#dp_p'+w)||{}).value)||0))}}}
 return{P,err}}
function dnPlanInfo(){const P=R.dplan,t=todayIso();if(!Object.keys(P.wd).length)return'Trage unten für die Wochentage Antritt und Ende ein. Danach zählt der Dienst automatisch, du musst nichts weiter tun.';
 if(P.paused)return'Der Wochenplan ist angehalten (Haken oben setzen, um ihn wieder zu nutzen).';
 let n=0,k=0;for(let d=P.from;d<=t;d=addDays(d,1)){if(R.dienst[d]){k++;continue}if(dnEff(d))n++}
 return'Der Wochenplan ist aktiv: Seit dem '+dnDe(P.from)+' zählen '+n+' Tage automatisch'+(k?', '+k+' Tage haben einen eigenen Eintrag (krank, frei oder abweichend)':'')+'. Nur wo du abweichst, musst du etwas ändern.'}
/* speichert sofort bei jeder Änderung; baut die Seite nicht neu auf, damit man weitertippen kann */
function dnPlanAuto(){const{P,err}=dnPlanRead();R.dplan=normDplan({...P,wd:{...R.dplan.wd,...P.wd}});
 for(let w=1;w<=5;w++){const a=($('#dp_v'+w)||{}).value||'',b=($('#dp_b'+w)||{}).value||'';if(!a||!b)delete R.dplan.wd[w]}
 R.dplan=normDplan(R.dplan);save();dnPushMaybe();const e=$('#dp_msg');if(e)e.innerHTML=(err?'<b style="color:#b00">'+esc(err)+'</b><br>':'')+esc(dnPlanInfo())}
function dnPlanSave(){dnPlanAuto();ui.dnMsg='Wochenplan gespeichert.';render()}
function dnPlanCopy(w){const a=($('#dp_v'+w)||{}).value||'',b=($('#dp_b'+w)||{}).value||'',p=($('#dp_p'+w)||{}).value||'';if(!a||!b){ui.dnMsg='Zuerst Antritt und Ende für '+DN_WD[w]+' eintragen.';render();return}
 for(let x=1;x<=5;x++){$('#dp_v'+x).value=a;$('#dp_b'+x).value=b;$('#dp_p'+x).value=p}dnPlanAuto();ui.dnMsg=DN_WD[w]+' auf alle Wochentage übernommen. Abweichende Tage jetzt einfach ändern.';render()}
function dnPick(day){ui.dnDay=day;ui.dnMsg='';render();const e=$('#dn_v');if(e){e.scrollIntoView({block:'center'})}}
const DN_WD={1:'Montag',2:'Dienstag',3:'Mittwoch',4:'Donnerstag',5:'Freitag'};
function dnStats(day){const o=dnEff(day);if(!o||o.krank)return null;const a=dnMin(o.von);let b=dnMin(o.bis),open=false;
 if(b<0){if(day===todayIso()){const n=new Date();b=n.getHours()*60+n.getMinutes()}else{open=true;b=a}}
 const pres=Math.max(0,b-a),unt=R.ur.stunden.filter(x=>x.date===day&&x.status==='gehalten'&&!x.pl).reduce((t,x)=>t+(x.min||Math.round(x.n*S.set.unit)),0),
  ges=dnBelegt(day).reduce((t,w)=>t+Math.max(0,Math.min(w[1],b)-Math.max(w[0],a)),0),
  fok=fokusLive().filter(x=>isoOf(new Date(x.start))===day).reduce((t,x)=>t+Math.round(x.ms/60000),0);
 const rest=Math.max(0,pres-o.pause-unt-ges-fok);
 const warn=open?'Dienstende fehlt':(unt+ges>pres-o.pause&&pres>0?'Unterricht und Gespräche sind länger als der Dienst: Zeiten prüfen':'');
 return{o,pres,unt,ges,fok,rest,warn,open}}
function dnKrankList(){const f=dnSchoolStart();return Object.keys(R.dienst).filter(k=>R.dienst[k].krank&&k>=f).sort()}
function vDienst(){const today=todayIso(),day=ui.dnDay||today,eff=dnEff(day),cur=eff&&!eff.krank?eff:null,td=dnEff(today),P=R.dplan;
 const days=dnDays().filter(k=>k<=today).reverse().filter(k=>dnEff(k)).slice(0,30),kr=dnKrankList();
 const wd=k=>new Date(k+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
 const inp='style="padding:6px 8px"',inT='style="padding:5px 6px;width:110px"';
 const tdTxt=!td?'Heute kein Dienst.':td.krank?'Heute: krank.':'Heute: '+esc(td.von)+' bis '+(td.bis?esc(td.bis):'offen')+', Pause '+td.pause+' Min.'+(td.plan?' (laut Wochenplan)':'');
 $('#main').innerHTML=`<div class="card"><h2>Dienst</h2>
 <p class="mut">Dienstantritt und Dienstende je Tag, also die Zeit, in der du in der Schule bist. Das ToDo zählt daraus Punkte je volle 10 Minuten. Abgezogen werden Unterricht (Tagesstruktur), Gespräche aus Zeit und Fokus-Zeiten innerhalb des Dienstes, außerdem die Pause. Fokus-Zeit zählt nur als Fokus, nicht zusätzlich als Dienst.</p>

 ${ui.dnMsg?`<p class="mut"><b>${esc(ui.dnMsg)}</b></p>`:''}
 ${LX?`<p class="mut">${esc(ui.dnSent?'Dienstzeiten sind in der ToDo-Tabelle (Blatt Dienst) aktuell.':'Noch nicht in die ToDo-Tabelle geschrieben: Das passiert automatisch, sobald die Tabellen-ID bekannt ist und du bei Google angemeldet bist (Drive-Knopf oben).')}</p>`:'<p class="mut">Ohne die Linux-App bleiben die Dienstzeiten nur in diesem Browser; die Übertragung in die ToDo-Tabelle gibt es nur in der Linux-App.</p>'}</div>
 <div class="card"><h3>Regulärer Dienst (Wochenplan)</h3>

 <table><tr><th>Tag</th><th>Antritt</th><th>Ende</th><th>Pause (Min.)</th><th></th></tr>${[1,2,3,4,5].map(w=>{const v=P.wd[w]||{};return`<tr><td>${DN_WD[w]}</td><td><input type="time" id="dp_v${w}" value="${esc(v.von||'')}" onchange="dnPlanAuto()" ${inT}></td><td><input type="time" id="dp_b${w}" value="${esc(v.bis||'')}" onchange="dnPlanAuto()" ${inT}></td><td><input type="number" id="dp_p${w}" min="0" max="600" step="5" value="${v.pause!=null?v.pause:''}" onchange="dnPlanAuto()" style="width:80px;padding:5px 6px"></td><td><button class="g" title="Diese Zeiten für alle Wochentage übernehmen" onclick="dnPlanCopy(${w})">für alle Tage</button></td></tr>`}).join('')}</table>

 ${eff&&eff.krank?'<p class="mut">An diesem Tag bist du als krank eingetragen.</p>':''}</div>

 <p class="mut">Trägt alle Schultage im Zeitraum als krank ein (auch rückwirkend; Wochenenden, Ferien und freie Tage bleiben außen vor). Krankentage zählen keine Dienstpunkte. Seit Schuljahresbeginn (${esc(dnDe(dnSchoolStart()))}): <b>${kr.length} Krankheitstag${kr.length===1?'':'e'}</b>.</p>
 ${kr.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${kr.slice().reverse().slice(0,80).map(k=>`<span style="border:1px solid var(--line,#ccc);border-radius:12px;padding:2px 8px;font-size:13px">${esc(wd(k))} <a href="#" title="Krankheit zurücknehmen" onclick="dnReset('${k}');return false" style="text-decoration:none">✕</a></span>`).join('')}</div>`:''}</div>

/* Fahrten: Wege zwischen Wohnung und Schulen für die Steuererklärung (Werbungskosten). Arbeitstage kommen aus dem Dienst (Wochenplan, Krank, Ferien).
   Posten A: Entfernungspauschale für die erste Tätigkeitsstätte (einfache Strecke mal Arbeitstage mal Satz, Verkehrsmittel unerheblich, ohne Pkw höchstens 4.500 Euro).
   Posten B: Fahrten zu weiteren Schulen und zwischen den Schulen nach tatsächlichen Kosten: Pkw je gefahrenem Kilometer, ÖPNV mit dem Fahrpreis je Fahrt. Sätze sind einstellbar. */
function fkMit(){return{auto:'Pkw',oev:'ÖPNV',rad:'Fahrrad',fuss:'zu Fuß'}}
const FK_MITTEL=fkMit();
function fkNum(v,d){v=String(v==null?'':v).replace(',','.').trim();const n=+v;return v===''||isNaN(n)||n<0?d:n}
function normFk(f){f=f&&typeof f==='object'?f:{};const ep=f.ep||{},one=(o,d)=>({a:fkNum(o&&o.a,d.a),b:fkNum(o&&o.b,d.b),g:Math.max(0,Math.round(fkNum(o&&o.g,d.g)))});

function foChange(id,ch){const x=R.fokus.find(y=>y.id===id);if(!x)return false;const now=new Date().toISOString();
 R.fokus.forEach(y=>{if(y!==x&&!y.del&&y.start===x.start&&y.ms===x.ms){y.del=true;y.ms=0;y.mod=now}});
 if(ch.del){x.del=true;x.ms=0}else{if(ch.ms>0){x.ms=Math.round(ch.ms);x.end=new Date(Date.parse(x.start)+x.ms).toISOString()}if(ch.title!==undefined)x.title=String(ch.title).trim();if(ch.tags)x.tags=ch.tags}
 x.mod=now;save();foPush();return true}
function foDel(id){if(!confirm('Diese Sitzung löschen?'))return;foChange(id,{del:true});render()}
function foSave(id){const row=document.querySelector('[data-sid="'+id.replace(/"/g,'\\"')+'"]');if(!row)return;const q=f=>row.querySelector('[data-f="'+f+'"]'),m=parseFloat(q('min').value);if(!(m>0)){alert('Dauer in Minuten angeben');return}
 foChange(id,{ms:m*60000,title:q('title').value,tags:q('tags').value.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean)});ui.foMsg='Sitzung gespeichert.';render()}

 for(const [re,c] of m)if(re.test(t)&&S.set.cats.includes(c))return c;return S.set.cats.includes('Sonstiges')?'Sonstiges':S.set.cats[0]}

  const e=g[key]||(g[key]={key,date:d,tag:k,ms:0,ids:[],titles:[]});e.ms+=x.ms;e.ids.push(x.id);if(x.title&&!e.titles.includes(x.title))e.titles.push(x.title)});
 return Object.values(g).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)}

 S.entries.push({id:uid(),date:p.date,u,...(u===auto?{min:Math.round(p.ms/60000)}:{}),cat:($('#fp_c'+i)||{}).value||foCatOf(p.titles.join(' ')),school:($('#fp_s'+i)||{}).value||foSchoolOf(p.tag),note:('Fokus: '+p.titles.join(', ')).slice(0,200)});

 const keys=new Set(R.fokus.filter(x=>!x.del).map(x=>x.start+'|'+x.ms));let n=0,u=0;normFokus({fokus:r.rows}).fokus.forEach(x=>{const o=R.fokus.find(y=>y.id===x.id);if(o){if(String(x.mod||'')>String(o.mod||'')){Object.assign(o,x);if(!x.del)delete o.del;u++}}else if(x.del||!keys.has(x.start+'|'+x.ms)){R.fokus.push(x);if(!x.del)n++}});

/* Linux-App: Drive, Sicherung, Statusanzeige */
function api(path,method,body){return fetch(LX.base+'/api/'+path,{method:method||'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(r=>r.json())}
function chipShow(){const c=$('#chip');if(c&&ui.drive)c.textContent='Drive: '+ui.drive.label}
function chipClick(){if(!ui.drive||ui.drive.state!=='ok'){driveLogin()}else{driveSync()}}
async function pollStatus(){
 try{const st=await api('status');
  if(st.seq!==LX.seq){location.reload();return}
  ui.drive=st.drive;ui.backup=st.backup;chipShow();if(st.drive.state==='ok'&&!ui.foPulled&&!ui.foTry){ui.foTry=true;foPull();setTimeout(()=>{ui.foTry=false},20000)}if(ui.tab==='daten')driveCard()}catch(e){}}
function driveCard(){const el=$('#drivecard');if(!el||!ui.drive)return;const d=ui.drive,b=ui.backup||{};
 el.innerHTML=`<h2>Google Drive und Laptop-Sicherung</h2>
 <p>Drive: <b>${esc(d.label)}</b>${d.last?', letzter Abgleich '+esc(d.last):''}${d.msg?'<br><span class="mut">'+esc(d.msg)+'</span>':''}</p>
 <p class="mut">Konflikte: Die Linux-App ist führend. Vor dem Überschreiben wird der alte Drive-Stand als Kopie in Drive gesichert. Die Anmeldung gilt etwa eine Stunde und wird nicht gespeichert.</p>
 <p class="mut">Anmelde-Adresse: ${esc(d.handoff_url||'noch nicht eingetragen')}<br>Client-ID: ${d.client_set?'eingetragen':'noch nicht eingetragen'}</p>
 <button class="b" onclick="driveLogin()">Mit Google Drive verbinden</button>
 <button class="g" onclick="driveSync()">Jetzt abgleichen</button>
 <button class="g" onclick="setHandoff()">Anmelde-Adresse ändern</button>
 <button class="g" onclick="setClient()">Client-ID ändern</button>
 <button class="g" onclick="setSheet()">ToDo-Tabelle für Fokus eintragen</button>
 <h3>Laptop</h3><p class="mut">Hauptdatei und Sicherungen: ${esc(b.dir||'')}<br>Letzte Sicherung: ${esc(b.last||'noch keine')}</p>
 <button class="g" onclick="api('backup','POST').then(pollStatus)">Sicherung jetzt anlegen</button>
 <button class="g" onclick="api('open_data','POST')">Datenordner öffnen</button>`}
async function ensureSettings(){const st=await api('status');
 if(!st.drive.handoff_url){const u=prompt('Internetadresse der veröffentlichten Seifferts Zeit (GitHub Pages, ohne Anhang), z. B. https://haigo-cyber.github.io/home-haigo/zeit.html');if(!u)return false;await api('settings','POST',{handoff_url:u.trim()})}
 if(!st.drive.client_set){const c=prompt('Google Client-ID (dieselbe wie beim Depot, endet auf apps.googleusercontent.com)');if(!c)return false;await api('settings','POST',{client_id:c.trim()})}
 return true}
async function driveLogin(){if(!await ensureSettings())return;await api('drive/login','POST');pollStatus()}

/* linuxHandOff: Anmeldung für die Linux-App (nur aktiv mit Parametern in der Adresse) */
(function linuxHandOff(){
 const p=new URLSearchParams(location.search),port=p.get('linuxport'),st=p.get('linuxstate'),cid=p.get('linuxcid');
 if(!port||!st||!cid||LX)return;
 const ov=document.createElement('div');
 ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#f6f5f1;color:#1f2328;display:flex;align-items:center;justify-content:center;font:16px system-ui,sans-serif;text-align:center;padding:20px';
 ov.innerHTML='<div><h2>Seifferts Zeit: Anmeldung bei Google Drive</h2><p id="hom">Google-Bibliothek wird geladen ...</p><button id="hob" disabled style="font:inherit;padding:10px 18px;border-radius:6px;border:0;background:#2f6f9f;color:#fff;cursor:pointer">Bei Google anmelden</button></div>';
 document.body.appendChild(ov);
 const msg=t=>{document.getElementById('hom').textContent=t};
 const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';
 sc.onload=()=>{msg('Bitte auf die Schaltfläche klicken. Danach können Sie dieses Fenster schließen.');document.getElementById('hob').disabled=false};
 sc.onerror=()=>msg('Die Google-Bibliothek konnte nicht geladen werden.');
 document.head.appendChild(sc);
 document.getElementById('hob').onclick=()=>{
  try{google.accounts.oauth2.initTokenClient({client_id:cid,scope:'https://www.googleapis.com/auth/drive.file'+(p.get('linuxsheets')==='1'?' https://www.googleapis.com/auth/spreadsheets':'')+(p.get('linuxcal')==='1'?' https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly':''),
   callback:r=>{if(r.error||!r.access_token){msg('Anmeldung fehlgeschlagen: '+(r.error||'kein Token'));return}
    msg('Übergabe an die App ...');
    location.href='http://127.0.0.1:'+port+'/auth/token?state='+encodeURIComponent(st)+'&token='+encodeURIComponent(r.access_token)+'&expires='+encodeURIComponent(r.expires_in||3300)},
   error_callback:e=>msg('Anmeldung abgebrochen oder blockiert: '+(e&&e.type||''))}).requestAccessToken()}catch(e){msg('Fehler: '+e)}}
})();
</script>
