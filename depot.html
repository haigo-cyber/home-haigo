  const el = $('#drivecard'); if (el) el.innerHTML = driveCardInner();
}
function handleErr(e){
  console.warn('Drive', e);
  const msg = e && e.message ? e.message : String(e);
  if (e && (e.code === 'nogis' || e.code === 'timeout' || e.status === 401 || /Anmeldung/.test(msg))) setStatus('auth', msg);
  else if (e instanceof TypeError) setStatus('error', 'Keine Verbindung zu Google (offline?). Änderungen bleiben lokal gespeichert und werden später hochgeladen.');
  else setStatus('error', msg);
}

/* ---------- Token (Google Identity Services) ---------- */
const gisOK = () => !!(window.google && google.accounts && google.accounts.oauth2);
function initTC(){
  if (dd.tc) return true; if (!gisOK()) return false;
  dd.tc = google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:D_SCOPE,
    callback:r => { const t = dd.pending; dd.pending = null; if (!t) return;
      if (r && r.access_token) { dd.token = r.access_token; dd.exp = Date.now() + (+r.expires_in || 3600) * 1000; t.res(r); }
      else t.rej(new Error('Anmeldung fehlgeschlagen' + (r && r.error ? ' (' + r.error + ')' : ''))); },
    error_callback:e => { const t = dd.pending; dd.pending = null; if (t) t.rej(new Error('Anmeldung nicht möglich (' + ((e && e.type) || 'Fehler') + ')')); }
  });
  return true;
}
function requestToken(interactive){
  return new Promise((res, rej) => {
    if (!initTC()) return rej(Object.assign(new Error('Google-Anmeldung nicht geladen (offline?)'), {code:'nogis'}));
    const to = setTimeout(() => { if (dd.pending) { dd.pending = null; rej(Object.assign(new Error('Zeitüberschreitung bei der Anmeldung'), {code:'timeout'})); } }, interactive ? 120000 : 15000);
    dd.pending = {res:v => { clearTimeout(to); res(v); }, rej:e => { clearTimeout(to); rej(e); }};
    try { dd.tc.requestAccessToken({prompt:''}); } catch (e) { clearTimeout(to); dd.pending = null; rej(e); }
  });
}
const tokenValid = () => !!(dd.token && Date.now() < dd.exp - 60000);
async function ensureToken(interactive){ if (!tokenValid()) await requestToken(interactive); }
/* Fuer Knoepfe: das Anmelde-Fenster muss direkt aus dem Klick heraus geoeffnet werden. */
async function gestureToken(){ if (!tokenValid()) await requestToken(true); }

async function dapi(url, opts = {}, interactive = false, retried = false){
  await ensureToken(interactive);
  const h = Object.assign({Authorization:'Bearer ' + dd.token}, opts.headers || {});
  const r = await fetch(url, Object.assign({}, opts, {headers:h}));
  if (r.status === 401 && !retried) { dd.token = null; return dapi(url, opts, interactive, true); }
  if (!r.ok) {
    let m = ''; try { const j = await r.json(); m = (j.error && (j.error.message || j.error)) || ''; } catch (e) {}
    const err = new Error('Drive ' + r.status + (m ? ': ' + String(m).slice(0, 160) : '')); err.status = r.status; throw err;
  }
  return r;
}
const qs = o => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
async function dlist(q, fields = 'files(id,name,version,modifiedTime,size)', extra = {}){
  const r = await dapi(D_API + 'files?' + qs(Object.assign({q, fields, spaces:'drive', pageSize:'100'}, extra)));
  return (await r.json()).files || [];
}
async function dmeta(id){ const r = await dapi(D_API + 'files/' + encodeURIComponent(id) + '?' + qs({fields:'id,name,version,modifiedTime,trashed,parents'})); return r.json(); }
async function ensureFolder(name, parent, knownId, create = true){
  if (knownId) { try { const f = await dmeta(knownId); if (f && !f.trashed) return knownId; } catch (e) { if (e.status !== 404) throw e; } }
  const l = await dlist(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (parent ? ` and '${parent}' in parents` : ''), 'files(id,name)');
  if (l.length) return l[0].id;
  if (!create) return '';
  const body = {name, mimeType:'application/vnd.google-apps.folder'}; if (parent) body.parents = [parent];
  const r = await dapi(D_API + 'files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return (await r.json()).id;
}
async function dfind(folderId){
  const l = await dlist(`'${folderId}' in parents and name='${D_FILE}' and trashed=false`, 'files(id,name,version,modifiedTime)', {orderBy:'modifiedTime desc'});
  return l[0] || null;
}
async function dcreate(folderId, content){
  const b = 'dpb' + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({name:D_FILE, parents:[folderId], mimeType:'application/json', appProperties:{app:'seifferts-depot'}});
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${content}\r\n--${b}--`;
  const r = await dapi(D_UP + 'files?uploadType=multipart&fields=id,version,modifiedTime', {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body});
  return r.json();
}
async function dupdate(id, content){
  const r = await dapi(D_UP + 'files/' + encodeURIComponent(id) + '?uploadType=media&fields=id,version,modifiedTime', {method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body:content});
  return r.json();
}
async function dread(id){ const r = await dapi(D_API + 'files/' + encodeURIComponent(id) + '?alt=media'); return r.text(); }

/* ---------- Inhalt ---------- */
const payload = () => JSON.stringify({app:'seifferts-depot', format:1, saved:new Date().toISOString(), data:state}, null, 1);
function parsePayload(txt){ const o = JSON.parse(txt); return normalizeState(o && o.data ? o.data : o); }
function canon(s){
  const by = (a, b) => a.id < b.id ? -1 : 1;
  return JSON.stringify({
    p:s.positions.slice().sort(by).map(p => [p.id, p.name, p.sym]),
    t:s.txs.slice().sort(by).map(t => [t.id, t.posId, t.type, t.date, t.qty, t.price, t.fee || 0]),
    k:Object.keys(s.prices).sort().map(k => [k, s.prices[k].map(e => [e.date, e.price])]),
    c:(s.cash || []).slice().sort(by).map(c => [c.id, c.date, c.type, c.amount, c.note])
  });
}
function sumState(s){
  let last = ''; Object.values(s.prices).forEach(a => a.forEach(e => { if (e.date > last) last = e.date; }));
  return `${s.positions.length} Positionen, ${s.txs.length} Transaktionen` + (s.cash && s.cash.length ? `, ${s.cash.length} Kontobuchungen` : '') + (last ? `, letzter Kurs ${fd(last)}` : ', noch keine Kurse');
}
/* Vereinigung zweier Staende ueber die IDs. Geloeschte Eintraege koennen dabei zurueckkehren. */
function mergeStates(a, b){
  const s = JSON.parse(JSON.stringify(a)), pm = {}; let addP = 0, addT = 0, addK = 0, diffK = 0, addC = 0;
  b.positions.forEach(p => {
    let m = s.positions.find(x => x.id === p.id) || s.positions.find(x => x.name.toLowerCase() === p.name.toLowerCase());
    if (!m) { m = {id:p.id, name:p.name, sym:p.sym}; s.positions.push(m); addP++; } else if (!m.sym && p.sym) m.sym = p.sym;
    pm[p.id] = m.id;
  });
  const ids = new Set(s.txs.map(t => t.id));
  b.txs.forEach(t => { if (ids.has(t.id) || !pm[t.posId]) return; s.txs.push(Object.assign({}, t, {posId:pm[t.posId]})); ids.add(t.id); addT++; });
  s.cash = s.cash || []; const cids = new Set(s.cash.map(c => c.id));
  (b.cash || []).forEach(c => { if (!cids.has(c.id)) { s.cash.push(Object.assign({}, c)); cids.add(c.id); addC++; } });
  Object.keys(b.prices).forEach(pid => {
    const tid = pm[pid]; if (!tid) return;
    const arr = (s.prices[tid] = s.prices[tid] || []);
    b.prices[pid].forEach(e => { const ex = arr.find(x => x.date === e.date); if (!ex) { arr.push({date:e.date, price:e.price}); addK++; } else if (ex.price !== e.price) diffK++; });
    arr.sort((x, y) => x.date < y.date ? -1 : 1);
  });
  return {state:normalizeState(s), addP, addT, addK, diffK, addC};
}

/* ---------- Sicherungskopien in Drive ---------- */
async function dbackup(tag){
  if (!dm.fileId) return;
  const day = todayISO();
  if (!tag && dm.backupDay === day) return;
  dm.backupId = await ensureFolder(D_BACKUP, dm.folderId, dm.backupId); saveDM();
  const list = await dlist(`'${dm.backupId}' in parents and trashed=false`, 'files(id,name)', {orderBy:'name desc'});
  let name;
  if (tag) { const n = new Date(); name = `depot-sicherung-${day}-${pad2(n.getHours())}${pad2(n.getMinutes())}-${tag}.json`; }
  else { name = `depot-sicherung-${day}.json`; if (list.some(f => f.name === name)) { dm.backupDay = day; saveDM(); await dprune(list.slice(D_KEEP)); return; } }
  await dapi(D_API + 'files/' + encodeURIComponent(dm.fileId) + '/copy?fields=id,name', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, parents:[dm.backupId]})});
  if (!tag) { dm.backupDay = day; saveDM(); }
  await dprune(list.slice(D_KEEP - 1));
}
/* Aeltere Sicherungskopien in den Drive-Papierkorb verschieben (nur die ueber dem Limit). */
async function dprune(old){
  for (const f of old) {
    try { await dapi(D_API + 'files/' + encodeURIComponent(f.id), {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({trashed:true})}); } catch (e) { console.warn('Aufräumen', e); }
  }
}

/* ---------- Abfrage bei Konflikt ---------- */
function choose({title, text, options}){
  return new Promise(resolve => {
    const root = $('#modal-root');
    root.innerHTML = `<div class="overlay"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="max-height:92vh;overflow:auto"><h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="btns col">${options.map(o => `<button type="button" class="${o.primary ? 'primary' : 'btn'}" data-k="${o.key}">${esc(o.label)}${o.sub ? `<span class="sub" style="color:inherit;opacity:.8">${esc(o.sub)}</span>` : ''}</button>`).join('')}</div></div></div>`;
    root.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { root.innerHTML = ''; resolve(b.dataset.k); }));
    const f = root.querySelector('button'); if (f) f.focus();
  });
}
function resolveConflict(rs, remote){
  return choose({
    title:'Unterschiedliche Stände',
    text:`Google Drive: ${sumState(rs)}\n(zuletzt geändert ${fdt(remote.modifiedTime)})\n\nDieser Browser: ${sumState(state)}\n\nNichts geht verloren: Vor jedem Überschreiben in Drive wird eine Sicherungskopie angelegt, und ein ersetzter lokaler Stand bleibt als Notkopie im Browser.`,
    options:[
      {key:'merge', label:'Beide zusammenführen', sub:'Empfohlen. Gelöschte Einträge können zurückkehren.', primary:true},
      {key:'remote', label:'Stand aus Drive übernehmen', sub:'Lokale Änderungen werden ersetzt.'},
      {key:'local', label:'Diesen Browser nach Drive hochladen', sub:'Der Drive-Stand wird ersetzt (vorher kopiert).'},
      {key:'cancel', label:'Später entscheiden'}
    ]});
}

/* ---------- Synchronisation ---------- */
async function driveSync(opts = {}){
  if (!dm.on) return;
  if (dd.hold && !opts.force) return;
  dd.hold = false;
  setStatus('busy');
  try {
    await ensureToken(!!opts.interactive);
    dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId); saveDM();
    let remote = null, lost = false;
    if (dm.fileId) { try { const m = await dmeta(dm.fileId); if (!m.trashed) remote = m; } catch (e) { if (e.status !== 404) throw e; } }
    if (!remote) {
      const f = await dfind(dm.folderId);
      if (f) { remote = f; if (dm.fileId && f.id !== dm.fileId) dm.version = ''; dm.fileId = f.id; saveDM(); }
      else if (dm.fileId) { lost = true; dm.fileId = ''; dm.version = ''; saveDM(); }
    }
    const localHas = hasData(state);
    const upload = async tag => {
      const my = rev, content = payload();
      if (remote) { await dbackup(tag || dd.nextTag || ''); dd.nextTag = ''; const res = await dupdate(remote.id, content); dm.version = res.version; }
      else { const res = await dcreate(dm.folderId, content); dm.fileId = res.id; dm.version = res.version; remote = {id:res.id, version:res.version}; }
      dm.lastSaved = new Date().toISOString();
      if (rev === my) dm.dirty = false;
      saveDM();
    };
    const takeRemote = (rs, msg) => { replaceState(rs, {noSync:true}); dm.version = remote.version; dm.dirty = false; saveDM(); render(); if (msg) toast(msg, 3500); };

    if (!remote) {
      if (localHas) { if (lost) toast('Die Drive-Datei war gelöscht und wird neu angelegt.', 4500); await upload(); }
      else { dm.dirty = false; saveDM(); }
    } else if (remote.version === dm.version) {
      if (dm.dirty || opts.force) await upload();
    } else {
      const rs = parsePayload(await dread(remote.id));
      if (canon(rs) === canon(state)) { dm.version = remote.version; dm.dirty = false; saveDM(); }
      else if (!localHas) takeRemote(rs, 'Stand aus Google Drive geladen');
      else if (dm.version && !dm.dirty) takeRemote(rs, 'Neuerer Stand aus Google Drive geladen (anderes Gerät)');
      else {
        setStatus('conflict');
        const ch = await resolveConflict(rs, remote);
        if (ch === 'remote') takeRemote(rs, 'Stand aus Drive übernommen');
        else if (ch === 'local') { await upload('vor-ueberschreiben'); toast('Lokaler Stand nach Drive hochgeladen'); }
        else if (ch === 'merge') {
          const mg = mergeStates(state, rs);
          replaceState(mg.state, {noSync:true}); dm.dirty = true; rev++;
          await upload('vor-zusammenfuehren'); render();
          toast(`Zusammengeführt: ${mg.addT} Transaktionen, ${mg.addK} Kurse, ${mg.addP} Positionen, ${mg.addC} Kontobuchungen aus Drive ergänzt` + (mg.diffK ? `. ${mg.diffK} abweichende Kurse: lokaler Wert behalten.` : ''), 6000);
        } else {
          if (opts.connecting) { dm.on = false; saveDM(); setStatus('off'); return; }
          dd.hold = true; setStatus('conflict'); return;
        }
      }
    }
    dd.lastCheck = Date.now();
    if (dm.dirty) { setStatus('pending'); clearTimeout(dd.timer); dd.timer = setTimeout(() => dq(() => driveSync({})), D_DEBOUNCE); }
    else setStatus('ok');
  } catch (e) { handleErr(e); }
}
function driveTouch(){
  if (!dm.on) return;
  rev++; dm.dirty = true; saveDM();
  if (dd.state === 'auth' || dd.state === 'conflict' || dd.state === 'unavail') { updatePill(); return; }
  setStatus('pending');
  if (!dm.auto) return;
  clearTimeout(dd.timer); dd.timer = setTimeout(() => dq(() => driveSync({})), D_DEBOUNCE);
}
async function driveConnect(){
  if (location.protocol === 'file:') { setStatus('unavail'); return; }
  try { setStatus('busy'); await requestToken(true); } catch (e) { dm.on ? handleErr(e) : (setStatus('off'), toast(e.message, 4000)); return; }
  dm.on = true; saveDM(); dq(() => driveSync({connecting:true}));
}
async function driveSignIn(){
  try { setStatus('busy'); await requestToken(true); } catch (e) { handleErr(e); return; }
  dq(() => driveSync({}));
}
async function driveStart(){
  if (!dm.on) { updatePill(); return; }
  if (location.protocol === 'file:') { setStatus('unavail'); return; }
  for (let i = 0; i < 160 && !gisOK(); i++) await sleep(50);
  if (!gisOK()) { setStatus('auth', 'Google-Anmeldung nicht geladen (offline?)'); return; }
  dq(() => driveSync({}));
}
function driveSaveNow(){
  gestureToken().then(() => { dd.hold = false; dq(() => driveSync({force:true, interactive:true})); }).catch(handleErr);
}
function driveLoadNow(){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId, false); saveDM();
      const remote = dm.folderId ? await dfind(dm.folderId) : null;
      if (!remote) { toast('In Drive gibt es noch keine Datei.', 3500); setStatus(dm.dirty ? 'pending' : 'ok'); return; }
      const rs = parsePayload(await dread(remote.id));
      setStatus(dm.dirty ? 'pending' : 'ok');
      const ok = await modal({title:'Stand aus Drive laden?', text:`Drive: ${sumState(rs)}\nDieser Browser: ${sumState(state)}\n\nDer lokale Stand wird ersetzt` + (dm.dirty ? ' (noch nicht gesicherte Änderungen gehen dabei verloren)' : '') + '. Er bleibt als Notkopie im Browser erhalten.', ok:'Ersetzen', danger:true});
      if (!ok) return;
      dm.fileId = remote.id; dm.version = remote.version; dm.dirty = false; dd.hold = false;
      replaceState(rs, {noSync:true}); saveDM(); setStatus('ok'); render(); toast('Stand aus Drive geladen');
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
function driveListBackups(){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      dm.folderId = await ensureFolder(D_FOLDER, null, dm.folderId, false);
      dm.backupId = dm.folderId ? await ensureFolder(D_BACKUP, dm.folderId, dm.backupId, false) : ''; saveDM();
      dd.backups = dm.backupId ? await dlist(`'${dm.backupId}' in parents and trashed=false`, 'files(id,name,modifiedTime,size)', {orderBy:'name desc'}) : [];
      setStatus(dm.dirty ? 'pending' : 'ok');
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
function driveRestore(id, name){
  gestureToken().then(() => dq(async () => {
    try {
      setStatus('busy');
      const rs = parsePayload(await dread(id));
      setStatus(dm.dirty ? 'pending' : 'ok');
      const ok = await modal({title:'Sicherung einlesen?', text:`${name}\n${sumState(rs)}\n\nDer aktuelle Stand (${sumState(state)}) wird ersetzt. In Drive wird vorher eine Sicherungskopie des aktuellen Standes angelegt.`, ok:'Einlesen', danger:true});
      if (!ok) return;
      dd.nextTag = 'vor-wiederherstellung'; replaceState(rs); render(); toast('Sicherung eingelesen, wird nach Drive gespeichert', 4000);
    } catch (e) { handleErr(e); }
  })).catch(handleErr);
}
async function driveDisconnect(){
  if (!await modal({title:'Verbindung trennen?', text:'Die Dateien in Google Drive und die Daten in diesem Browser bleiben unverändert erhalten. Es wird nur nicht mehr synchronisiert.', ok:'Trennen'})) return;
  if (dd.token && gisOK()) { try { google.accounts.oauth2.revoke(dd.token, () => {}); } catch (e) {} }
  dd.token = null; dd.exp = 0; dd.backups = null; dd.hold = false; clearTimeout(dd.timer);
  dm = Object.assign(loadDM(), {on:false, fileId:'', folderId:'', backupId:'', version:'', lastSaved:'', dirty:false, backupDay:''}); saveDM();
  setStatus('off'); toast('Verbindung getrennt');
}
function pillClick(){
  const st = dd.state;
  if (st === 'auth') driveSignIn();
  else if (st === 'conflict') driveSaveNow();
  else if (st === 'error') dq(() => driveSync({}));
  else go('daten');
}

function driveCardInner(){
  const [lab, long] = driveLabel();
  if (!dm.on) {
    return `<p class="hint">Dein Depot wird als Datei <code>${D_FILE}</code> im Drive-Ordner „${D_FOLDER}“ gespeichert, mit täglicher Sicherungskopie. So hast du am Handy und am Rechner denselben Stand. Das Tool sieht in Drive nur Dateien, die es selbst angelegt hat.</p>`
      + (location.protocol === 'file:' ? `<p class="note">Die Google-Anmeldung funktioniert nur, wenn das Tool über seine https-Adresse geöffnet wird (GitHub Pages), nicht als lokale Datei.</p>` : '')
      + `<div class="btns"><button class="primary" data-act="driveconnect"${location.protocol === 'file:' ? ' disabled' : ''}>Mit Google Drive verbinden</button></div>${dd.msg ? `<p class="msg">${esc(dd.msg)}</p>` : ''}`;
  }
  const fl = dm.fileId ? `<a href="https://drive.google.com/file/d/${encodeURIComponent(dm.fileId)}/view" target="_blank" rel="noopener">${D_FILE}</a>` : D_FILE + ' (wird beim ersten Speichern angelegt)';
  const fo = dm.folderId ? `<a href="https://drive.google.com/drive/folders/${encodeURIComponent(dm.folderId)}" target="_blank" rel="noopener">${D_FOLDER}</a>` : D_FOLDER;
  let h = `<p><strong>${esc(lab)}</strong><span class="sub">${esc(long)}</span></p>${dd.msg ? `<p class="msg">${esc(dd.msg)}</p>` : ''}
    <p class="hint" style="margin-top:0">Ordner: ${fo}<br>Datei: ${fl}<br>Letzte Speicherung: ${dm.lastSaved ? fdt(dm.lastSaved) : 'noch keine'}<br>Sicherungskopien: täglich im Unterordner „${D_BACKUP}“, die letzten ${D_KEEP} bleiben erhalten.</p>
    <div class="btns"><button class="primary" data-act="drivesave">Jetzt speichern</button><button class="btn" data-act="driveload">Stand aus Drive laden</button><button class="btn" data-act="drivebackups">Sicherungen anzeigen</button><button class="btn" data-act="drivedisconnect">Verbindung trennen</button></div>
    <div class="checkrow" style="margin-top:12px"><input type="checkbox" id="driveAuto"${dm.auto ? ' checked' : ''}><label for="driveAuto" style="margin:0">Änderungen automatisch nach Drive speichern</label></div>`;
  if (dd.backups) {
    h += `<h3>Sicherungen in Drive (${dd.backups.length})</h3>`;
    h += dd.backups.length ? `<div class="histlist">${dd.backups.map(f => `<div><span>${esc(f.name.replace(/^depot-sicherung-/, '').replace(/\.json$/, ''))}</span><button class="btn small" data-act="driverestore" data-id="${esc(f.id)}" data-name="${esc(f.name)}">Einlesen</button></div>`).join('')}</div>` : `<p class="hint">Noch keine Sicherungskopien. Die erste entsteht beim ersten Überschreiben der Datei.</p>`;
  }
  return h;
}

window.addEventListener('online', () => { if (dm.on && dm.dirty && dd.state === 'error') dq(() => driveSync({})); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !dm.on || dd.hold || !tokenValid() || dd.state === 'busy') return;
  if ($('#modal-root').innerHTML) return;
  if (Date.now() - dd.lastCheck > 60000) dq(() => driveSync({}));
});

/* Start */
$('#ver').textContent = 'v' + VERSION;
(function init(){
  const t = location.hash.slice(1); if (TABS.includes(t)) ui.tab = t;
  render(); updateTxSum(); updatePill(); driveStart();
})();
</script>
</body>
