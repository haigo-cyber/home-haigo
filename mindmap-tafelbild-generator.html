    if(/[\r\n]/.test(el.value)){ const p = el.selectionStart; el.value = el.value.replace(/\s*[\r\n]+\s*/g, " "); try{ el.setSelectionRange(p, p); }catch(_){} }
    const r = wsFindNode(doc, el.closest(".ws-node").dataset.nid); if(r) r.node.text = el.value; wsAutosizeEl(el);
  }
  else if(f==="atitle"){ const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.title = el.value; }
  else if(f==="aurl"){
    const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.url = el.value.trim();
    const go = el.closest(".ws-att").querySelector(".ws-lnkgo"), nu = wsNormUrl(el.value);
    if(go){ go.href = nu || "#"; go.style.display = nu ? "" : "none"; }
  }
  else if(f==="atext"){ const a = wsFindAny(doc, el.closest(".ws-att").dataset.aid); if(a) a.text = el.value; if(el.tagName==="TEXTAREA") wsAutosizeEl(el); }
  else if(f==="col"){ const b = wsTableOf(doc, el); if(b) b.cols[+el.dataset.ci] = el.value; }
  else if(f==="cell"){ const b = wsTableOf(doc, el); if(b && b.rows[+el.dataset.ri]) b.rows[+el.dataset.ri][+el.dataset.ci] = el.value; }
  wsTouch(doc);
});
let wsQTimer = null;
main.addEventListener("input", e=>{
  const el = e.target; if(!(el.dataset && el.dataset.wsq)) return;
  clearTimeout(wsQTimer);
  wsQTimer = setTimeout(()=>{ wsF = wsFNorm({...wsF, q:el.value}); wsFSave(); wsFocusSel = "#wsq"; render(); }, 350);
});
main.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.wsf==="title"){
    const docEl = el.closest(".ws-doc"); const chip = document.querySelector('.ws-chip[data-id="'+(docEl?docEl.dataset.doc:"")+'"]');
    const doc = docEl ? wsGet(docEl.dataset.doc) : null;
    if(chip && doc) chip.textContent = doc.title||"Ohne Titel";
  }
});
main.addEventListener("keydown", e=>{
  const el = e.target, f = el.dataset && el.dataset.wsf; if(!f) return;
  const docEl = el.closest(".ws-doc"); if(!docEl) return;
  const doc = wsGet(docEl.dataset.doc); if(!doc) return;
  if(f==="node"){
    const nid = el.closest(".ws-node").dataset.nid;
    if(e.key==="Enter"){
      e.preventDefault();
      const n = wsAddSibling(doc, nid);
      if(n){ wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); }
    }else if(e.key==="Tab"){
      e.preventDefault();
      if(e.shiftKey ? wsOutdent(doc, nid) : wsIndent(doc, nid)){
        wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${nid}"] > .ws-nrow .ws-nin`; wsRerender(doc.id);
      }
    }else if(e.key==="Backspace" && el.value===""){
      const r = wsFindNode(doc, nid);
      if(r && r.node.children.length===0 && !r.node.link){
        e.preventDefault();
        const all = [...docEl.querySelectorAll(".ws-nin")]; const i = all.indexOf(el);
        const prev = i>0 ? all[i-1].closest(".ws-node").dataset.nid : null;
        wsDeleteNode(doc, nid); wsTouch(doc);
        if(prev) wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${prev}"] > .ws-nrow .ws-nin`;
        wsRerender(doc.id);
      }
    }else if((e.key==="ArrowUp" || e.key==="ArrowDown") && !e.shiftKey && !e.altKey && !e.ctrlKey && (e.key==="ArrowUp" ? el.selectionStart===0 : el.selectionStart===el.value.length)){
      const all = [...docEl.querySelectorAll(".ws-nin")]; const i = all.indexOf(el);
      const t = all[i + (e.key==="ArrowUp"?-1:1)];
      if(t){ e.preventDefault(); t.focus(); }
    }
  }else if(f==="cell" && e.key==="Enter"){
    e.preventDefault();
    const b = wsTableOf(doc, el); if(!b) return;
    const ri = +el.dataset.ri, ci = +el.dataset.ci;
    if(ri>=b.rows.length-1){ wsAddRow(b); wsTouch(doc); }
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-${wsIsAtt(b)?"aid":"bid"}="${b.id}"] input[data-wsf="cell"][data-ri="${ri+1}"][data-ci="${ci}"]`;
    wsRerender(doc.id);
  }
});

/* ---- Klicks ---- */
main.addEventListener("click", e=>{
  const bk = e.target.closest("[data-wsback]");
  if(bk){ wsBack = null; if(ws3d.resumeFull){ ws3d.resumeFull = false; ws3d.full = true; } setTab(2); return; }
  const tab = e.target.closest("[data-wstab]");
  if(tab){ wsBack = null; wsTab = tab.dataset.wstab; mmLS.setItem("wsTab", wsTab); render(); return; }
  const a = e.target.closest("[data-wsact]"); if(!a) return;
  const act = a.dataset.wsact;
  const mount = a.closest(".ws-mount");
  const docEl = a.closest(".ws-doc");
  const docId = docEl ? docEl.dataset.doc : (mount ? mount.dataset.doc : null);
  const doc = docId ? wsGet(docId) : null;

  if(act==="today-toggle"){
    wsTodayExpanded = !wsTodayExpanded; mmLS.setItem("wsTodayExp", wsTodayExpanded?"1":"0");
    if(doc) wsRerender(doc.id); return;
  }
  if((act==="fold-all" || act==="unfold-all") && doc){
    wsSetAllFolds(doc, act==="fold-all"); wsTouch(doc); wsRerender(doc.id); return;
  }
  if(act==="f-open"){ wsFOpen = !wsFOpen; try{ mmLS.setItem("wsFOpen", wsFOpen?"1":"0"); }catch(err){} render(); return; }
  if(act==="tag-sel"){ wsF = wsFNorm({...wsF, tag:(wsF.tag===a.dataset.t)?"":a.dataset.t}); wsFSave(); render(); return; }
  if(act==="f-reset"){ wsF = wsFNorm(null); wsFSave(); render(); return; }
  if(act==="f-preset"){
    const p = a.dataset.p, keep = {showHid:wsF.showHid, tag:wsF.tag, manual:wsF.manual};
    if(p==="all") wsF = wsFNorm(keep);
    else if(p==="over") wsF = wsFNorm({...keep, lvl:1, hideDone:true, noAtt:true});
    else if(p==="today") wsF = wsFNorm({...keep, due:"today", hideDone:true});
    else if(p==="week") wsF = wsFNorm({...keep, due:"week", hideDone:true});
    else if(p==="meta") wsF = wsFNorm({...keep, meta:true, hideDone:true});
    wsFSave(); render(); return;
  }
  if(act==="f-set"){
    const k = a.dataset.k, v = a.dataset.v, nf = {...wsF};
    if(k==="lvl") nf.lvl = +v;
    else if(k==="due") nf.due = (nf.due===v)?"":v;
    else if(k==="manual") nf.manual = v==="1";
    else if(k==="notes" || k==="noTab"){ nf[k] = !nf[k]; wsOpenMap.clear(); }
    else nf[k] = !nf[k];
    wsF = wsFNorm(nf); wsFSave(); render(); return;
  }
  if(act==="retry-load"){ setSync("busy"); loadWorkspace().then(()=>{ setSync("on"); render(); }); return; }
  if(act==="open-trash"){ wsOpenTrash(); return; }
  if(act==="new-doc"){
    if(!wsLoaded){ toast("Daten nicht geladen"); return; }
    const d = wsNewDoc("Neues Dokument"); wsDocs.push(d); wsOpenDocId = d.id; mmLS.setItem("wsOpenDoc", d.id);
    wsTouch(d); wsFocusSel = `.ws-doc[data-doc="${d.id}"] .ws-doctitle`; render();
    const t = document.querySelector(".ws-doctitle"); if(t) t.select();
    return;
  }
  if(act==="open-doc"){ wsOpenDocId = a.dataset.id; mmLS.setItem("wsOpenDoc", wsOpenDocId); render(); return; }
  if(!doc) return;

  if(act==="tag-doc"){ wsOpenTagMenu(doc.id, "doc", doc.id); return; }
  if(act==="pin"){
    const was = doc.pinned;
    wsDocs.forEach(d=>{ if(d.pinned){ d.pinned = false; wsTouch(d); } });
    doc.pinned = !was; wsTouch(doc); render(); return;
  }
  if(act==="del-doc"){ wsDeleteDocFlow(doc); return; }
  if(act==="add-block"){
    const b = wsNewBlock(a.dataset.type); if(!b) return;
    wsOpenMap.set(b.id, true);
    doc.blocks.push(b); wsTouch(doc);
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-bid="${b.id}"] .ws-in`; wsRerender(doc.id); return;
  }
  const blockEl = a.closest(".ws-block");
  const block = blockEl ? wsBlock(doc, blockEl.dataset.bid) : null;
  if(act==="fold" && block && !a.closest(".ws-att") && !a.closest(".ws-node")){
    wsOpenMap.set(block.id, !wsFoldOpen(block.id, block.type)); wsRerender(doc.id); return;
  }
  if(act==="hfold" && block && block.type==="heading"){
    const nc = !wsHeadClosed(block);
    if(wsFiltered()) wsColl.set(block.id, nc); else { block.collapsed = nc; wsTouch(doc); }
    wsRerender(doc.id); return;
  }
  if(act==="tag-block" && block){ wsOpenTagMenu(doc.id, "block", block.id); return; }
  if(act==="del-block" && block){
    wsDeleteBlockFlow(doc, block); return;
  }
  if(act==="import-root" && block){ wsOpenImport({docId:doc.id, blockId:block.id}); return; }
  if(act==="add-root-node" && block){
    const n = wsNewNode(""); block.items.push(n); wsTouch(doc);
    wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); return;
  }
  const attEl = a.closest(".ws-att");
  if(attEl){
    const att = wsFindAny(doc, attEl.dataset.aid); if(!att) return;
    if(act==="fold"){ wsOpenMap.set(att.id, !wsFoldOpen(att.id, att.type)); wsRerender(doc.id); return; }
    if(act==="done"){
      att.done = !att.done; wsTouch(doc); wsRerender(doc.id);
      if(att.link) wsLinkRun(()=>wsPushDone(doc, att));
      return;
    }
    if(act==="link-menu"){ wsOpenLinkMenu(doc.id, att.id); return; }
    if(act==="tag-att"){ wsOpenTagMenu(doc.id, "att", att.id); return; }
    if(act==="file-view"){ wsOpenFileView(att); return; }
    if(act==="del-att"){ wsDeleteAttFlow(doc, att); return; }
    if(act==="move-att"){ wsOpenMove(doc.id, att.id); return; }
    if(att.type==="table" && wsTableAct(doc, att, `[data-aid="${att.id}"]`, act, a)) return;
    return;
  }
  const nodeEl = a.closest(".ws-node");
  if(nodeEl){
    const nid = nodeEl.dataset.nid, r = wsFindNode(doc, nid); if(!r) return;
    if(act==="toggle"){
      const all = !!e.shiftKey;
      const setSub = (node, closed)=>{ node.children.forEach(k=>{ if(k.children.length){ k.collapsed = closed; wsColl.set(k.id, closed); } if(k.att.length) k.aopen = !closed; setSub(k, closed); }); };
      if(r.node.children.length){
        let depth = 0, p = nodeEl.parentElement; while(p){ if(p.classList && p.classList.contains("ws-node")) depth++; p = p.parentElement; }
        const nc = !wsEffCollapsed(r.node, depth);
        if(wsFiltered()) wsColl.set(nid, nc); else { r.node.collapsed = nc; }
        if(all){ setSub(r.node, nc); if(r.node.att.length) r.node.aopen = !nc; }
        if(!wsFiltered() || all) wsTouch(doc);
        wsRerender(doc.id);
      }else if(r.node.att.length){
        r.node.aopen = !r.node.aopen; wsTouch(doc); wsRerender(doc.id);
      }
      return;
    }
    if(act==="tag-node"){ wsOpenTagMenu(doc.id, "node", nid); return; }
    if(act==="hide-node"){
      r.node.hid = !r.node.hid; wsTouch(doc); wsRerender(doc.id);
      if(r.node.hid && !wsF.showHid) toast("Ausgeblendet. Unter Ansicht kannst du es wieder einblenden.");
      return;
    }
    if(act==="done"){
      r.node.done = !r.node.done; wsTouch(doc); wsRerender(doc.id);
      if(r.node.link){ const node = r.node; wsLinkRun(()=>wsPushDone(doc, node)); }
      return;
    }
    if(act==="link-menu"){ wsOpenLinkMenu(doc.id, nid); return; }
    if(act==="add-file"){ wsAddFiles(doc, r.node); return; }
    if(act==="att-toggle"){
      const hidden = r.node.children.length>0 && r.node.collapsed;                    // eingeklappter Punkt: Anhänge sind nicht zu sehen
      r.node.aopen = hidden ? true : !r.node.aopen;
      if(hidden) r.node.collapsed = false;                                           // Anhänge zeigen heißt: Punkt aufklappen
      if(hidden || r.node.aopen) wsColl.set(nid, false);
      wsTouch(doc); wsRerender(doc.id); return;
    }
    if(act==="add-att"){
      const at = wsNewAtt(a.dataset.type); if(!at) return;
      wsOpenMap.set(at.id, true);
      r.node.att.push(at); r.node.aopen = true; wsTouch(doc);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-aid="${at.id}"] .ws-abody .ws-in`; wsRerender(doc.id); return;
    }
    if(act==="add-child"){
      const n = wsAddChild(doc, nid); wsTouch(doc); wsColl.set(nid, false);
      wsFocusSel = `.ws-doc[data-doc="${doc.id}"] [data-nid="${n.id}"] > .ws-nrow .ws-nin`; wsRerender(doc.id); return;
    }
    if(act==="del-node"){ wsDeleteNodeFlow(doc, nid); return; }
    if(act==="move-node"){ wsOpenMove(doc.id, nid); return; }
  }
  if(block && block.type==="table"){ if(wsTableAct(doc, block, `[data-bid="${block.id}"]`, act, a)) return; }
});
function wsTableAct(doc, tbl, scope, act, a){
  if(act==="add-row"){ const i = wsAddRow(tbl); wsTouch(doc); wsFocusSel = `.ws-doc[data-doc="${doc.id}"] ${scope} input[data-wsf="cell"][data-ri="${i}"][data-ci="0"]`; wsRerender(doc.id); return true; }
  if(act==="del-row"){
    const ri = +a.dataset.ri;
    if(tbl.rows[ri] && tbl.rows[ri].some(c=>c) && !confirm("Zeile mit Inhalt löschen?")) return true;
    tbl.rows.splice(ri, 1); wsTouch(doc); wsRerender(doc.id); return true;
  }
  if(act==="add-col"){ wsAddCol(tbl); wsTouch(doc); wsRerender(doc.id); return true; }
  if(act==="del-col"){
    const ci = +a.dataset.ci;
    if(tbl.rows.some(r=>r[ci]) && !confirm("Spalte mit Inhalt löschen?")) return true;
    if(wsDelCol(tbl, ci)){ wsTouch(doc); wsRerender(doc.id); } return true;
  }
  return false;
}

/* ---- Ziehen und Ablegen mit der Maus ---- */
function wsClearDropMarks(){
  document.querySelectorAll(".ws-drop-before,.ws-drop-after,.ws-drop-into").forEach(el=>el.classList.remove("ws-drop-before","ws-drop-after","ws-drop-into"));
}
function wsDragEnd(){
  wsClearDropMarks();
  document.querySelectorAll(".ws-dragging").forEach(el=>el.classList.remove("ws-dragging"));
  wsDrag = null; wsDrop = null;
}
function wsDropTarget(e){
  if(!wsDrag || !e.target.closest) return null;
  const docEl = e.target.closest(".ws-doc");
  if(!docEl || docEl.dataset.doc!==wsDrag.docId) return null;
  if(wsDrag.kind==="block"){
    const el = e.target.closest(".ws-block"); if(!el || el.dataset.bid===wsDrag.bid) return null;
    const r = el.getBoundingClientRect();
    return {el, pos:(e.clientY < r.top + r.height/2) ? "before" : "after", bid:el.dataset.bid};
  }
  if(wsDrag.kind==="node"){
    const row = e.target.closest(".ws-nrow"); if(!row) return null;
    const li = row.parentElement; if(!li || li.dataset.nid===wsDrag.nid) return null;
    if(wsDrag.el.contains(li)) return null;                                  // nie in den eigenen Teilbaum
    const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / (r.height||1);
    return {el:row, pos: y<0.3 ? "before" : (y>0.7 ? "after" : "into"), nid:li.dataset.nid};
  }
  if(wsDrag.kind==="row"){
    const tr = e.target.closest("tbody tr"); if(!tr || tr===wsDrag.el) return null;
    if(tr.closest(".ws-block")!==wsDrag.el.closest(".ws-block")) return null;
    const r = tr.getBoundingClientRect();
    return {el:tr, pos:(e.clientY < r.top + r.height/2) ? "before" : "after", ri:+tr.dataset.ri};
  }
  return null;
}
main.addEventListener("dragstart", e=>{
  const h = e.target.closest && e.target.closest("[data-wsdrag]"); if(!h) return;
  const docEl = h.closest(".ws-doc"); if(!docEl) return;
  const kind = h.dataset.wsdrag;
  const src = kind==="block" ? h.closest(".ws-block") : kind==="node" ? h.closest(".ws-node") : h.closest("tr");
  if(!src) return;
  wsDrag = {kind, docId:docEl.dataset.doc, el:src,
    bid: (h.closest(".ws-block")||{dataset:{}}).dataset.bid, nid: kind==="node" ? src.dataset.nid : null, ri: kind==="row" ? +src.dataset.ri : null};
  e.dataTransfer.effectAllowed = "move";
  try{
    e.dataTransfer.setData("text/plain", "ws");
    e.dataTransfer.setDragImage(kind==="node" ? src.querySelector(".ws-nrow") : src, 12, 12);
  }catch(_){}
  setTimeout(()=>{ if(wsDrag) src.classList.add("ws-dragging"); }, 0);
});
main.addEventListener("dragover", e=>{
  if(!wsDrag) return;
  const t = wsDropTarget(e);
  if(!t){ wsClearDropMarks(); wsDrop = null; return; }
  e.preventDefault(); e.dataTransfer.dropEffect = "move";
  wsClearDropMarks(); t.el.classList.add("ws-drop-"+t.pos); wsDrop = t;
});
main.addEventListener("drop", e=>{
  if(!wsDrag) return;
  e.preventDefault();
  const t = wsDropTarget(e) || wsDrop, d = wsDrag;
  const doc = wsGet(d.docId); let ok = false;
  if(doc && t){
    if(d.kind==="block") ok = wsMoveBlock(doc, d.bid, t.bid, t.pos);
    else if(d.kind==="node") ok = wsMoveNode(doc, d.nid, t.nid, t.pos);
    else { const b = wsBlock(doc, d.bid); if(b) ok = wsMoveRow(b, d.ri, t.ri, t.pos); }
  }
  wsDragEnd();
  if(ok){ wsTouch(doc); wsRerender(doc.id); }
});
main.addEventListener("dragend", wsDragEnd);

function wsOpenTagMenu(docId, kind, id){
  const doc = wsGet(docId); if(!doc || document.getElementById("modalBg")) return;
  let obj = null;
  if(kind==="doc") obj = doc;
  else if(kind==="block") obj = wsBlock(doc, id);
  else if(kind==="att") obj = wsFindAny(doc, id);
  else { const r = wsFindNode(doc, id); obj = r ? r.node : null; }
  if(!obj) return;
  const known = []; const seen = new Set();
  wsAllTags(wsDocs).concat(["Privat","Job","Projekt"]).forEach(t=>{ const k = wsTagKey(t); if(!seen.has(k)){ seen.add(k); known.push(t); } });
  const what = kind==="doc" ? "das ganze Dokument" : kind==="att" ? "diesen Anhang" : kind==="block" ? (obj.type==="heading" ? "diese Überschrift und alle Blöcke bis zur nächsten Überschrift" : "diesen Block und alles darin") : "diesen Punkt samt allen Unterpunkten und Anhängen";
  /* Einträge darunter mit eigenen Tags: auf Wunsch zurücksetzen */
  const own = [];
  const grabNodes = nodes=>nodes.forEach(n=>{ if(n!==obj && n.tag) own.push(n); (n.att||[]).forEach(x=>{ if(x!==obj && x.tag) own.push(x); }); });
  const grab = blocks=>blocks.forEach(b=>{ if(b!==obj && b.tag) own.push(b); if(b.type==="outline") grabNodes(wsAllNodes({blocks:[b]})); });
  if(kind==="doc") grab(doc.blocks);
  else if(kind==="block"){
    if(obj.type==="heading"){ const i = doc.blocks.indexOf(obj); const rest = []; for(let k=i+1;k<doc.blocks.length && doc.blocks[k].type!=="heading";k++) rest.push(doc.blocks[k]); grab(rest); }
    else if(obj.type==="outline") grabNodes(wsAllNodes({blocks:[obj]}));
  }
  else if(kind==="node") grabNodes([obj].concat(wsAllNodes({blocks:[{type:"outline", items:obj.children}]})));
  const ownKeys = new Set(wsTagList(obj.tag).map(t=>t.toLowerCase()));
  const effAll = kind==="doc" ? wsNormTag(doc.tag) : kind==="block" ? (wsBlockTags(doc)[obj.id]||"") : kind==="att" ? wsTagUnion((wsAttOwner(doc, obj.id) ? wsEffMap().get(wsAttOwner(doc, obj.id).id) : "")||"", obj.tag) : (wsEffMap().get(obj.id)||"");
  const inh = wsTagList(effAll).filter(t=>!ownKeys.has(t.toLowerCase())).join(", ");
  document.body.insertAdjacentHTML("beforeend",
    `<div class="modal-bg" id="modalBg"><div class="modal">
      <h2>Tags</h2>
      <p class="muted" style="font-size:13px;margin-bottom:10px">Die Tags gelten für ${what}. Mehrere Tags trennst du mit Komma oder tippst sie unten an. Sie kommen zu den geerbten Tags dazu.${inh?` Geerbt: ${esc(inh)}.`:""}</p>
      <input type="text" id="wst_in" maxlength="140" value="${esc(obj.tag||"")}" placeholder="z. B. Job, Projekt" style="width:100%;background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:10px;font-size:16px;font-family:inherit;margin-bottom:10px">
      <div class="ws-frow" style="margin-bottom:12px">${known.map(t=>`<button class="ws-fc" data-v="${esc(t)}">${esc(t)}</button>`).join("")}</div>
      ${own.length?`<div class="toggle-row"><div><div style="font-size:14px">Eigene Tags darunter entfernen</div>
        <div class="muted" style="font-size:12px">${own.length} ${own.length===1?"Eintrag hat":"Einträge haben"} eigene Tags. Aus: sie behalten sie. An: sie werden gelöscht, die Einträge erben nur noch von hier.</div></div>
        <button class="switch" id="wst_over"></button></div>`:""}
      <div class="modal-actions">
        <button class="btn-ghost" id="wst_cancel">Abbrechen</button>
        ${obj.tag?`<button class="btn-ghost" id="wst_clear">Alle entfernen</button>`:""}
        <button class="btn-primary" id="wst_ok">OK</button>
      </div></div></div>`);
  const close = ()=>{ const mb = $("modalBg"); if(mb) mb.remove(); };
  const apply = v=>{
    const over = $("wst_over") && $("wst_over").classList.contains("on");
    obj.tag = wsNormTag(v);
    if(over) own.forEach(o=>{ o.tag = ""; });

/* Baum: Titel = Mitte, jede Überschrift = Hauptast, Gliederungspunkte = Unteräste (ausgeblendete Punkte fehlen, Notizen und Tabellen auch) */
function mmBuildTree(doc, title){
  const root = {text:title, children:[]};
  let cur = root;
  const conv = n=>({text:(n.text||"").trim(), children:n.children.filter(c=>!c.hid && (c.text||"").trim()).map(conv)});
  doc.blocks.forEach(b=>{
    if(b.type==="heading"){ if((b.text||"").trim()){ cur = {text:b.text.trim(), children:[]}; root.children.push(cur); } }
    else if(b.type==="outline") b.items.filter(n=>!n.hid && (n.text||"").trim()).forEach(n=>cur.children.push(conv(n)));
  });
  return root;
}
const MM_COLORS = ["#e8590c","#1c7ed6","#2f9e44","#ae3ec9","#d6336c","#0c8599","#f08c00","#5c940d"];

function mmWrap(txt, font, maxW){
  mmCtx.font = font; const words = String(txt).split(/\s+/), lines = []; let cur = "";
  words.forEach(w=>{ const t = cur ? cur+" "+w : w; if(mmCtx.measureText(t).width<=maxW || !cur) cur = t; else{ lines.push(cur); cur = w; } });

}
function mmRenderMap(){

  if(!doc){ host.innerHTML = `<div class="mm-empty">Noch kein Dokument.</div>`; mmMap.svg = ""; return; }
  const cfg = mmCfg(doc), title = cfg.title.trim() || doc.title || "", fs = cfg.fs;
  const tree = mmBuildTree(doc, title);
  if(!tree.children.length){ host.innerHTML = `<div class="mm-empty">In diesem Dokument gibt es noch keine Überschriften mit Gliederungspunkten.<br>Lege sie im Reiter Dokumente an.</div>`; mmMap.svg = ""; return; }
  const hgap = fs*2.6, vgap = fs*.7;

    n.lines = mmWrap(n.text, n.font, depth===0 ? fs*11 : fs*12);

  const R = [], L = []; let hr = 0, hl = 0;
  tree.children.forEach(c=>{ if(hr<=hl){ R.push(c); hr += c.sh; } else{ L.push(c); hl += c.sh; } });
  const place = (n, dir, cxp, top)=>{
    n.cx = cxp; n.cy = top + n.sh/2;
    let t = top + (n.sh - n.children.reduce((s,c)=>s+c.sh,0))/2;
    n.children.forEach(c=>{ place(c, dir, cxp + dir*(n.w/2 + hgap + c.w/2), t); t += c.sh; });
  };
  const side = (arr, dir)=>{ const total = arr.reduce((s,c)=>s+c.sh,0); let t = -total/2; arr.forEach(c=>{ place(c, dir, dir*(tree.w/2 + hgap + c.w/2), t); t += c.sh; }); };
  tree.cx = 0; tree.cy = 0; side(R, 1); side(L, -1);
  const all = []; const walk = n=>{ all.push(n); n.children.forEach(walk); }; walk(tree);
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  all.forEach(n=>{ x0 = Math.min(x0, n.cx-n.w/2); x1 = Math.max(x1, n.cx+n.w/2); y0 = Math.min(y0, n.cy-n.h/2); y1 = Math.max(y1, n.cy+n.h/2); });
  const M = fs*2, titleH = fs*3.2, W = Math.max(x1-x0, fs*20) + 2*M, H = (y1-y0) + 2*M + titleH;
  const ox = -x0 + M + ((W-2*M) - (x1-x0))/2, oy = -y0 + M + titleH;
  const f1 = v=>v.toFixed(1);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="${W.toFixed(0)}" height="${H.toFixed(0)}" font-family="${MM_FONT.replace(/'/g,"")}">`;
  s += `<rect width="100%" height="100%" fill="#fff"/>`;
  s += `<text x="${f1(W/2)}" y="${f1(M*.5+fs*1.9)}" text-anchor="middle" font-size="${f1(fs*2)}" font-weight="bold" fill="#111">${esc(title)}</text>`;
  s += `<line x1="${f1(W/2-fs*8)}" x2="${f1(W/2+fs*8)}" y1="${f1(M*.5+fs*2.5)}" y2="${f1(M*.5+fs*2.5)}" stroke="#111" stroke-width="3"/>`;
  all.forEach(n=>n.children.forEach(c=>{
    const dir = c.cx>=n.cx ? 1 : -1;
    const ax = n.cx+dir*n.w/2+ox, ay = n.cy+oy, bx = c.cx-dir*c.w/2+ox, by = c.cy+oy+(c.depth>=2 ? c.h/2-1 : 0), mx = (ax+bx)/2;
    const sw = n.depth===0 ? Math.max(5, fs*.36) : Math.max(2, fs*.14);
    s += `<path d="M${f1(ax)} ${f1(ay)} C${f1(mx)} ${f1(ay)} ${f1(mx)} ${f1(by)} ${f1(bx)} ${f1(by)}" fill="none" stroke="${c.color}" stroke-width="${f1(sw)}" stroke-linecap="round"/>`;
  }));
  all.forEach(n=>{
    const X = n.cx+ox, Y = n.cy+oy;
    if(n.depth===0) s += `<rect x="${f1(X-n.w/2)}" y="${f1(Y-n.h/2)}" width="${f1(n.w)}" height="${f1(n.h)}" rx="${f1(n.h/2)}" fill="#fff" stroke="#111" stroke-width="4"/>`;
    else if(n.depth===1) s += `<rect x="${f1(X-n.w/2)}" y="${f1(Y-n.h/2)}" width="${f1(n.w)}" height="${f1(n.h)}" rx="${f1(n.h/2.6)}" fill="${n.color}"/>`;
    else s += `<line x1="${f1(X-n.w/2)}" x2="${f1(X+n.w/2)}" y1="${f1(Y+n.h/2)}" y2="${f1(Y+n.h/2)}" stroke="${n.color}" stroke-width="${f1(Math.max(2, fs*.14))}" stroke-linecap="round"/>`;
    const lh = n.fs*1.22, ty0 = Y-(n.lines.length-1)*lh/2;
    n.lines.forEach((l,k)=>{ s += `<text x="${f1(X)}" y="${f1(ty0+k*lh)}" dy="${f1(n.fs*.35)}" text-anchor="middle" font-size="${f1(n.fs)}" font-weight="${n.depth<2?"bold":"normal"}" fill="${n.depth===1?"#fff":"#111"}">${esc(l)}</text>`; });
  });
  s += "</svg>";
  mmMap.svg = s; mmMap.w = W; mmMap.h = H; host.innerHTML = s; mmApplyZoom();
}
function mmApplyZoom(){
  const svg = document.querySelector("#mapHost svg"), wrap = $("mapWrap"); if(!svg || !wrap) return;
  let k;
  if(mmMap.fit){ k = Math.max(.1, Math.min((wrap.clientWidth-8)/mmMap.w, (wrap.clientHeight-8)/mmMap.h)); mmMap.zoom = Math.round(k*100); }
  else k = mmMap.zoom/100;
  svg.style.width = (mmMap.w*k)+"px"; svg.style.height = (mmMap.h*k)+"px";
  const zv = $("mmZv"); if(zv) zv.textContent = mmMap.zoom+" %";
}
function mmRenderMapTab(){
  const doc = wsCurrentDoc(), cfg = doc ? mmCfg(doc) : {title:"", fs:18};
  $("pane3").innerHTML = `<div class="mm-bar">
    <select id="mmDoc" class="ws-in" title="Dokument">${wsDocs.map(d=>`<option value="${esc(d.id)}"${doc&&d.id===doc.id?" selected":""}>${esc(d.title||"Ohne Titel")}</option>`).join("")}</select>
    <label>Überschrift <input type="text" id="mmTitle" class="ws-in" value="${esc(cfg.title)}" placeholder="${esc(doc?doc.title:"")}"></label>
    <label>Schrift <input type="range" id="mmFs" min="14" max="30" value="${cfg.fs}"></label>
    <span class="ws-fl" style="flex:none">Zoom</span><button class="ws-tb" id="mmZm">−</button><span id="mmZv" class="ws-fhint" style="min-width:42px;text-align:center"></span><button class="ws-tb" id="mmZp">+</button><button class="ws-tb" id="mmZf">Anpassen</button>
    <span style="flex:1"></span>
    <button class="ws-tb" id="mmFull">⛶ Vollbild</button><button class="ws-tb" id="mmDocSave">Dokument speichern</button><button class="ws-tb" id="mmPrint">Drucken</button><button class="ws-tb" id="mmSvg">SVG</button><button class="ws-tb on" id="mmPng">PNG</button>
  </div><div id="mapWrap"><button class="ws-addbtn" id="mapExit">Vollbild beenden</button><div id="mapHost"></div></div>`;
  $("mmDoc").onchange = e=>{ wsOpenDocId = e.target.value; mmLS.setItem("wsOpenDoc", wsOpenDocId); mmRenderMapTab(); };
  $("mmTitle").oninput = e=>{ if(doc){ mmCfgSet(doc, {title:e.target.value}); mmRenderMap(); } };
  $("mmFs").oninput = e=>{ if(doc){ mmCfgSet(doc, {fs:+e.target.value}); mmRenderMap(); } };
  $("mmZp").onclick = ()=>{ mmMap.fit = false; mmMap.zoom = Math.min(300, mmMap.zoom+10); mmApplyZoom(); };
  $("mmZm").onclick = ()=>{ mmMap.fit = false; mmMap.zoom = Math.max(20, mmMap.zoom-10); mmApplyZoom(); };
  $("mmZf").onclick = ()=>{ mmMap.fit = true; mmApplyZoom(); };
  $("mmFull").onclick = ()=>mmMapFull(true);
  $("mapExit").onclick = ()=>mmMapFull(false);
  $("mmPrint").onclick = ()=>window.print();
  $("mmDocSave").onclick = ()=>{ if(doc) mmSaveDocDialog(doc); };
  $("mmSvg").onclick = ()=>{ if(mmMap.svg) mmDownload(mmFileName("svg"), new Blob([mmMap.svg], {type:"image/svg+xml"})); };
  $("mmPng").onclick = mmPng;
  mmRenderMap();
}
function mmFileName(ext){
  const d = wsCurrentDoc(), t = d ? (mmCfg(d).title.trim() || d.title || "mindmap") : "mindmap";
  return t.replace(/[^\wäöüÄÖÜß\- ]+/g,"").trim().replace(/\s+/g,"_")+"."+ext;
}
function mmPng(){
  if(!mmMap.svg) return;
  const img = new Image(), url = URL.createObjectURL(new Blob([mmMap.svg], {type:"image/svg+xml;charset=utf-8"}));
  img.onload = ()=>{
    const sc = Math.min(3, Math.max(1, 4000/mmMap.w)), c = document.createElement("canvas");
    c.width = Math.round(mmMap.w*sc); c.height = Math.round(mmMap.h*sc);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); c.toBlob(b=>mmDownload(mmFileName("png"), b), "image/png");
  };
  img.onerror = ()=>toast("PNG konnte nicht erzeugt werden. Bitte SVG speichern.");
  img.src = url;
}
function mmMapFull(on){
  const w = $("mapWrap"); if(!w) return;
  w.classList.toggle("full", on); document.body.classList.toggle("mapfs", on);
  try{
    if(on && w.requestFullscreen){ w.requestFullscreen().catch(()=>{}); }
    else if(!on && document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(()=>{}); }
  }catch(e){}
  setTimeout(mmApplyZoom, 80);
}
document.addEventListener("fullscreenchange", ()=>{ if(!document.fullscreenElement && document.body.classList.contains("mapfs")) mmMapFull(false); setTimeout(()=>{ if(mmTab===3) mmApplyZoom(); }, 80); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && document.body.classList.contains("mapfs")) mmMapFull(false); });
window.addEventListener("resize", ()=>{ if(mmTab===3 && mmMap.fit) mmApplyZoom(); });
window.addEventListener("beforeprint", ()=>{ if(mmTab!==3) setTab(3); });

/* ============ EINZELDATEIEN: jedes Dokument (Gliederung / Mindmap) als eigene Datei ============ */
function mmDocFile(doc, ext){
  const t = ((doc && doc.title) || "mindmap").replace(/[^\wäöüÄÖÜß\- ]+/g,"").trim().replace(/\s+/g,"_") || "mindmap";
  return t+"."+ext;
}
function mmDocJson(doc){ return wsSerialize([doc], []); }
function mmDocText(doc){
  const tree = mmBuildTree(doc, doc.title||"");
  const out = [tree.text, "=".repeat(Math.max(3, tree.text.length)), ""];
  const rec = (n, d)=>{ out.push("  ".repeat(d)+"- "+n.text); n.children.forEach(c=>rec(c, d+1)); };
  tree.children.forEach(b=>{ out.push("# "+b.text); b.children.forEach(c=>rec(c, 0)); out.push(""); });
  return out.join("\n");
}
main.addEventListener("click", e=>{
  const a = e.target.closest('[data-wsact="save-doc"]'); if(!a) return;
  const docEl = a.closest(".ws-doc"), doc = docEl ? wsGet(docEl.dataset.doc) : null; if(doc) mmSaveDocDialog(doc);
});
function mmSaveDocDialog(doc){
  if($("modalBg")) return;
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal">
    <h2>„${esc(doc.title||"Ohne Titel")}“ als Datei speichern</h2>
    <p class="muted" style="font-size:13px;margin-bottom:12px">Die Datei landet im Download-Ordner deines Browsers.</p>
    <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px">
      <button class="btn-primary" id="sd_json">Gliederung als JSON (wieder importierbar)</button>
      <button class="btn-ghost" id="sd_txt">Als Text-Gliederung (.txt)</button>
      <button class="btn-ghost" id="sd_cancel">Abbrechen</button></div></div></div>`);
  const close = ()=>{ const m = $("modalBg"); if(m) m.remove(); };
  $("sd_json").onclick = ()=>{ mmDownload(mmDocFile(doc,"json"), new Blob([mmDocJson(doc)], {type:"application/json"})); close(); };
  $("sd_txt").onclick = ()=>{ mmDownload(mmDocFile(doc,"txt"), new Blob([mmDocText(doc)], {type:"text/plain;charset=utf-8"})); close(); };
  $("sd_cancel").onclick = close;
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") close(); };
}

/* ============ AUTOMATISCHE SICHERUNG ============ */
/* Ordner-Modus: Der Browser lässt dich einmal einen Ordner wählen (File System Access API, nur Chrome und Edge); danach schreibt die Seite dort eine laufende Sicherung und eine Tagessicherung.
   Download-Modus: für alle Browser; bei Änderungen höchstens alle 15 Minuten eine neue Datei im Download-Ordner. */
const MM_BK = {handle:null, mode:mmLS.getItem("bkMode")||"", timer:null, lastDl:0, last:"", state:""};
const MM_BK_WAIT = 15*60*1000;
const mmIdb = ()=>new Promise((res,rej)=>{ const r = indexedDB.open("mmtg",1); r.onupgradeneeded = ()=>r.result.createObjectStore("kv"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); });
async function mmIdbGet(k){ const db = await mmIdb(); return new Promise((res,rej)=>{ const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); }); }
async function mmIdbSet(k,v){ const db = await mmIdb(); return new Promise((res,rej)=>{ const q = db.transaction("kv","readwrite").objectStore("kv").put(v,k); q.onsuccess = ()=>res(); q.onerror = ()=>rej(q.error); }); }
function mmBkStamp(){ const d = new Date(), p = n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function mmBkBadge(){
  const b = $("mmBackup"); if(!b) return;
  b.textContent = MM_BK.state==="renew" ? "Sicherung: Zugriff erneuern" : MM_BK.mode ? "Sicherung: an" : "Sicherung: aus";
  b.classList.toggle("on", !!MM_BK.mode && MM_BK.state!=="renew");
  b.style.borderColor = MM_BK.state==="renew" ? "var(--red)" : "";
}
async function mmBkWrite(dir, name, text){
  const fh = await dir.getFileHandle(name, {create:true}), w = await fh.createWritable();
  await w.write(text); await w.close();
}
async function mmBkFolderRun(userGesture){
  const h = MM_BK.handle; if(!h || !wsLoaded) return false;
  let perm = await h.queryPermission({mode:"readwrite"});
  if(perm!=="granted" && userGesture) perm = await h.requestPermission({mode:"readwrite"});
  if(perm!=="granted"){ MM_BK.state = "renew"; mmBkBadge(); return false; }
  const text = wsSerialize(wsDocs, wsTrash);
  await mmBkWrite(h, "mindmap-sicherung.json", text);
  await mmBkWrite(h, "mindmap-sicherung-"+mmBkStamp()+".json", text);
  MM_BK.state = "ok"; MM_BK.last = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); mmBkBadge();
  return true;
}
function mmBackupSoon(){
  if(!MM_BK.mode || !wsLoaded) return;
  clearTimeout(MM_BK.timer);
  const wait = MM_BK.mode==="folder" ? 4000 : Math.max(4000, MM_BK.lastDl + MM_BK_WAIT - Date.now());
  MM_BK.timer = setTimeout(mmBackupRun, wait);
}
async function mmBackupRun(){
  try{
    if(MM_BK.mode==="folder") await mmBkFolderRun(false);
    else if(MM_BK.mode==="download"){
      const d = new Date(), p = n=>String(n).padStart(2,"0");
      mmDownload("mindmap-sicherung-"+mmBkStamp()+"_"+p(d.getHours())+p(d.getMinutes())+".json", new Blob([wsSerialize(wsDocs, wsTrash)], {type:"application/json"}));
      MM_BK.lastDl = Date.now(); MM_BK.last = p(d.getHours())+":"+p(d.getMinutes()); MM_BK.state = "ok"; mmBkBadge();
    }
  }catch(e){ MM_BK.state = "err:"+e.message; mmBkBadge(); }
}
async function mmBackupInit(){
  mmBkBadge();
  if(MM_BK.mode==="folder"){
    try{ MM_BK.handle = await mmIdbGet("dir"); }catch(e){ MM_BK.handle = null; }
    if(!MM_BK.handle){ MM_BK.mode = ""; mmLS.removeItem("bkMode"); mmBkBadge(); return; }
    try{ if(!(await mmBkFolderRun(false))) mmBkBadge(); }catch(e){ MM_BK.state = "err:"+e.message; mmBkBadge(); }
  }
}
function mmBackupDialog(){
  if($("modalBg")) return;
  const sup = !!window.showDirectoryPicker;
  const stText = MM_BK.state==="renew" ? "Der Browser braucht für den gewählten Ordner eine neue Freigabe (nach jedem Neustart des Browsers üblich). Drücke „Zugriff erneuern“."
    : MM_BK.state.startsWith("err:") ? "Letzter Versuch fehlgeschlagen: "+esc(MM_BK.state.slice(4))
    : MM_BK.mode ? "Aktiv ("+(MM_BK.mode==="folder"?"Sicherungsordner":"Download alle 15 Minuten bei Änderungen")+")"+(MM_BK.last?", zuletzt gesichert um "+MM_BK.last+" Uhr.":".") : "Aus.";
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal">
    <h2>Automatische Sicherung</h2>
    <p style="font-size:14px;margin-bottom:10px">${stText}</p>
    <p class="muted" style="font-size:12.5px;margin-bottom:12px">Die Dokumente selbst liegen im Browser (localStorage). Die Sicherung legt zusätzlich Dateien auf deinem Rechner ab, damit nichts verloren geht, wenn der Browser seine Daten löscht.</p>
    <div class="modal-actions" style="flex-direction:column;align-items:stretch;gap:8px">
      ${sup ? `<button class="btn-primary" id="bk_folder">Sicherungsordner wählen …</button>` : `<div class="muted" style="font-size:12.5px">Ordner-Sicherung gibt es nur in Chrome und Edge. In diesem Browser steht sie nicht zur Verfügung.</div>`}
      ${sup && MM_BK.mode==="folder" ? `<button class="btn-ghost" id="bk_renew">Zugriff erneuern und jetzt sichern</button>` : ""}
      <button class="btn-ghost" id="bk_dl">Stattdessen als Download sichern (alle 15 Minuten bei Änderungen)</button>
      <button class="btn-ghost" id="bk_now">Jetzt einmal sichern (Download)</button>
      <button class="btn-ghost" id="bk_each">Alle Dokumente einzeln als Dateien speichern</button>
      ${MM_BK.mode ? `<button class="btn-ghost" id="bk_off">Automatische Sicherung ausschalten</button>` : ""}
      <button class="btn-ghost" id="bk_close">Schließen</button></div>
    ${sup ? `<p class="muted" style="font-size:12px;margin-top:10px">Wenn der Browser den Ordner Downloads selbst nicht zulässt, lege darin einen Unterordner an (zum Beispiel „Mindmap-Sicherung“) und wähle diesen.</p>` : ""}
  </div></div>`);
  const close = ()=>{ const m = $("modalBg"); if(m) m.remove(); };
  const set = (mode)=>{ MM_BK.mode = mode; if(mode) mmLS.setItem("bkMode", mode); else mmLS.removeItem("bkMode"); MM_BK.state = ""; mmBkBadge(); };
  $("bk_close").onclick = close;
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") close(); };
  if($("bk_folder")) $("bk_folder").onclick = async ()=>{
    try{
      const h = await window.showDirectoryPicker({id:"mmtg-backup", mode:"readwrite", startIn:"downloads"});
      await mmIdbSet("dir", h); MM_BK.handle = h; set("folder"); close();
      if(await mmBkFolderRun(true)) toast("Sicherung angelegt im Ordner „"+h.name+"“"); 
    }catch(e){ if(e && e.name!=="AbortError") toast("Ordner nicht möglich: "+e.message); }
  };
  if($("bk_renew")) $("bk_renew").onclick = async ()=>{ try{ if(await mmBkFolderRun(true)){ close(); toast("Gesichert"); } }catch(e){ toast("Fehlgeschlagen: "+e.message); } };
  $("bk_dl").onclick = ()=>{ set("download"); MM_BK.lastDl = 0; close(); toast("Automatischer Download an. Der Browser fragt eventuell nach, ob die Seite mehrere Dateien laden darf."); mmBackupSoon(); };
  $("bk_now").onclick = ()=>{ if(!wsLoaded) return; mmDownload("mindmap-sicherung-"+mmBkStamp()+".json", new Blob([wsSerialize(wsDocs, wsTrash)], {type:"application/json"})); close(); };
  $("bk_each").onclick = async ()=>{
    close(); if(!wsLoaded) return;
    const used = new Set();
    for(const d of wsDocs){
      let n = mmDocFile(d,"json"); while(used.has(n)) n = n.replace(/(\.json)$/, "_2$1"); used.add(n);
      if(MM_BK.mode==="folder" && MM_BK.handle){
        try{ if((await MM_BK.handle.queryPermission({mode:"readwrite"}))==="granted"){ await mmBkWrite(MM_BK.handle, n, mmDocJson(d)); continue; } }catch(e){}
      }
      mmDownload(n, new Blob([mmDocJson(d)], {type:"application/json"}));
      await new Promise(r=>setTimeout(r,300));
    }
    toast(wsDocs.length+" Datei(en) gespeichert");
  };
  if($("bk_off")) $("bk_off").onclick = ()=>{ set(""); close(); };
}
$("mmBackup").onclick = mmBackupDialog;

/* ---- Start ---- */
mmLoad();
setTab(1);
mmBackupInit();

</script>
