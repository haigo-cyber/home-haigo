<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Seifferts Depot</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!--
  Seifferts Depot - Aktiendepot-Tracker, eine einzelne HTML-Datei ohne Build, ohne Server, ohne Netzwerkzugriff.
  Daten liegen ausschliesslich im localStorage dieses Browsers (Sicherung ueber den Reiter Daten).
  v1.0  Erste Fassung: Kaeufe/Verkaeufe, manuelle Tageskurse, Uebersicht, Diagramme, JSON/CSV
  v1.1  Google-Drive-Anbindung (drive.file): Datei im Ordner Seifferts Depot, taegliche Sicherungskopien, Konfliktabfrage,
        Notkopie des zuletzt ersetzten lokalen Standes
  v1.2  Kurse per CSV einlesen (Liste oder Tabelle), Zeichensatz-Erkennung, tolerantere Zahlenerkennung
  v1.3  Berechnungsmethoden: gleitender Durchschnitt, FIFO, LIFO, Netto-Einstand (Kaufsummen minus Verkaufserloese), Methodenvergleich
  v1.4  Reiter Konto: Einzahlungen, Auszahlungen, Ertraege; Kaeufe und Verkaeufe buchen automatisch gegen das Konto; Gesamtvermoegen und Gesamtergebnis
-->
<style>
:root{
  color-scheme: light dark;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface2:#f0efec; --line:#d9d7d0; --grid:#e8e7e2;
  --text:#0b0b0b; --text2:#52514e; --muted:#76756e;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --other:#9a9992; --pos:#1c5cab; --neg:#c0302f; --accent:#2a78d6; --warnbg:#fdf3dc; --warnline:#e3b24a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121211; --surface:#1a1a19; --surface2:#252523; --line:#3a3a37; --grid:#2b2b29;
    --text:#f0efec; --text2:#c3c2b7; --muted:#8f8e86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#6f6e68; --pos:#6da7ec; --neg:#ef8584; --accent:#3987e5; --warnbg:#33290f; --warnline:#8a6a1c;
  }
}
a{color:var(--accent)}
.cards-m{display:none}
.sortm{display:none}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.pcard.err{background:var(--warnbg);border-color:var(--warnline)}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ph strong{font-size:1rem}
.pg{text-align:right;font-weight:650;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pg small{display:block;font-weight:500;font-size:.82rem}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px;margin:10px 0 0}
.pgrid div{min-width:0}
.pgrid dt{font-size:.74rem;color:var(--muted)}
.pgrid dd{margin:0;font-size:.92rem;font-variant-numeric:tabular-nums}
.pgrid dd small{color:var(--muted);font-size:.74rem}
@media(max-width:640px){
  .tbl-d{display:none}
  .cards-m{display:block}
  .sortm{display:block}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:0 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top h1{margin:0;padding:10px 0 4px;font-size:1.15rem;font-weight:650}
.ver{font-size:.75rem;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-height:40px;padding:6px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text2);font:inherit;font-size:.95rem;cursor:pointer}
@media(max-width:480px){nav button{padding:6px 8px;font-size:.9rem}}
nav button[aria-selected="true"]{background:var(--surface2);border-color:var(--line);color:var(--text);font-weight:600}
main{padding-top:14px;padding-bottom:60px}
h2{font-size:1.05rem;margin:0 0 8px}
h3{font-size:.95rem;margin:14px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0}
.msg{color:var(--neg);font-size:.92rem;min-height:1.2em;margin:6px 0}
.note{background:var(--warnbg);border:1px solid var(--warnline);border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:.92rem}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:720px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi .v{font-size:1.3rem;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.85rem;color:var(--text2);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;z-index:1}
.sticky1 td:first-child{background:var(--surface)}
thead th{background:var(--surface2);font-weight:600;font-size:.82rem;color:var(--text2)}
th button{all:unset;cursor:pointer;display:inline-block;padding:2px 0}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
tfoot td,.sticky1 tfoot td:first-child{font-weight:650;background:var(--surface2);border-bottom:none}
td small,.sub{display:block;color:var(--muted);font-size:.78rem}
tr.err td{background:var(--warnbg)}
label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:10px}
input,select,textarea{display:block;width:100%;min-height:44px;margin-top:3px;padding:8px 10px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;-moz-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date]{-moz-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{display:inline-block;width:20px;min-height:20px;margin:0 8px 0 0;vertical-align:middle;-moz-appearance:auto;appearance:auto}
.checkrow{display:flex;align-items:center;font-size:.92rem;color:var(--text2);margin:6px 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}.grid3 label:first-child{grid-column:1/3}}
button.btn,button.primary,a.btn{display:inline-block;min-height:44px;padding:8px 16px;font:inherit;font-size:.95rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);cursor:pointer;text-decoration:none;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--neg)}
button.small{min-height:34px;padding:4px 10px;font-size:.85rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
details{margin:8px 0}
summary{cursor:pointer;color:var(--text2);padding:6px 0;min-height:32px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--text2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.dot{border-radius:50%}
.sw.dia{transform:rotate(45deg);width:10px;height:10px;border-radius:1px}
.sw.line{height:3px;width:18px;border-radius:2px}
.sw.dash{height:0;width:18px;border-top:3px dashed}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;max-width:100%;height:auto}
svg .t{fill:var(--text2);font-size:12px}
svg .tm{fill:var(--muted);font-size:11px}
svg .tv{fill:var(--text);font-size:11px;font-variant-numeric:tabular-nums}
svg .tb{fill:var(--text);font-size:12px;font-weight:600}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--line);stroke-width:1}
svg .hit{fill:transparent}
svg .hit:hover{fill:rgba(128,128,128,.14)}
svg [data-tip]{cursor:default}
.donutrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.donutrow ul{list-style:none;padding:0;margin:0;flex:1 1 220px;font-size:.92rem}
.donutrow li{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--grid)}
.donutrow li span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.donutrow li span.p{font-variant-numeric:tabular-nums;color:var(--text2)}
#tip{position:fixed;display:none;z-index:50;max-width:260px;padding:7px 10px;background:var(--text);color:var(--bg);border-radius:8px;font-size:.82rem;line-height:1.35;white-space:pre-line;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;display:none;max-width:92vw}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:420px}
.dlg h2{margin-top:0}
.dlg p{white-space:pre-line}
.hero{text-align:center;padding:30px 14px}
.hero p{max-width:520px;margin:8px auto}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:6px 0}
.pill{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--text2);margin-left:4px}
.pill.warn{border-color:var(--warnline);background:var(--warnbg)}
.histlist{max-height:220px;overflow:auto;border:1px solid var(--grid);border-radius:8px}
.histlist div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;font-size:.9rem}
.kursrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--grid)}
.kursrow input{margin-top:0}

.titlerow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpill{flex:0 1 auto;min-height:32px;margin-top:6px;padding:3px 12px;font:inherit;font-size:.8rem;color:var(--text2);background:var(--surface2);border:1px solid var(--line);border-radius:999px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpill[data-st="ok"]{border-color:var(--s3)}
.dpill[data-st="pending"],.dpill[data-st="busy"]{border-color:var(--s4)}
.dpill[data-st="auth"],.dpill[data-st="conflict"],.dpill[data-st="error"],.dpill[data-st="unavail"]{border-color:var(--warnline);background:var(--warnbg);color:var(--text);font-weight:600}
.btns.col{flex-direction:column}
.btns.col button{text-align:left}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlerow"><h1>Seifferts Depot <span class="ver" id="ver"></span></h1><button id="drivepill" class="dpill" type="button" data-st="off"></button></div>
    <nav id="nav" role="tablist" aria-label="Bereiche">
      <button role="tab" data-tab="uebersicht">Übersicht</button>
      <button role="tab" data-tab="diagramme">Diagramme</button>
      <button role="tab" data-tab="kurse">Kurse</button>
      <button role="tab" data-tab="kaeufe">Käufe</button>
      <button role="tab" data-tab="konto">Konto</button>
      <button role="tab" data-tab="daten">Daten</button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* ======================================================================
   Seifferts Depot v1.0
   ====================================================================== */
const VERSION = '1.4';
const LS_KEY = 'seifferts_depot_v1';
const PALETTE = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _uid = 0;
const uid = () => Date.now().toString(36) + (_uid++).toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- Formate ---------- */
const fEur  = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR'});
const fEurS = new Intl.NumberFormat('de-DE', {style:'currency', currency:'EUR', signDisplay:'exceptZero'});
const fPrice = new Intl.NumberFormat('de-DE', {minimumFractionDigits:2, maximumFractionDigits:4});
const fQty  = new Intl.NumberFormat('de-DE', {maximumFractionDigits:6});
const fPct  = new Intl.NumberFormat('de-DE', {minimumFractionDigits:1, maximumFractionDigits:1, signDisplay:'exceptZero'});
const fPct0 = new Intl.NumberFormat('de-DE', {minimumFractionDigits:1, maximumFractionDigits:1});
const eur  = v => isFinite(v) ? fEur.format(v) : '–';
const eurS = v => isFinite(v) ? fEurS.format(v) : '–';
const price = v => isFinite(v) ? fPrice.format(v) + ' €' : '–';
const qty  = v => isFinite(v) ? fQty.format(v) : '–';
const pctS = r => isFinite(r) ? fPct.format(r * 100) + ' %' : '–';
const pctP = r => isFinite(r) ? fPct0.format(r * 100) + ' %' : '–';
const signCls = v => v > 0.005 ? 'pos' : v < -0.005 ? 'neg' : '';

function pad2(n){ return String(n).padStart(2, '0'); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fd(iso){ if(!iso) return '–'; const [y, m, d] = iso.split('-'); return d + '.' + m + '.' + y; }
function fdShort(iso){ const [y, m, d] = iso.split('-'); return d + '.' + m + '.'; }
function daysBetween(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }

function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/\s/g, '').replace(/€/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc >= 0) s = s.replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  return /^[-+]?\d*\.?\d+(e[-+]?\d+)?$/i.test(s) ? Number(s) : NaN;
}
function parseDate(s){
  s = String(s || '').trim();
  let y, m, d, mm;
  if ((mm = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/))) { d = +mm[1]; m = +mm[2]; y = +mm[3]; if (y < 100) y += 2000; }
  else return null;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
  return y + '-' + pad2(m) + '-' + pad2(d);
}

/* ---------- Zustand ---------- */
function emptyState(){ return {positions:[], txs:[], prices:{}, cash:[], meta:{lastBackup:null}}; }
const hasData = s => !!(s.positions.length || s.txs.length || (s.cash && s.cash.length));
function normalizeState(o){
  const s = emptyState();
  if (!o || typeof o !== 'object') return s;
  const ids = new Set();
  (Array.isArray(o.positions) ? o.positions : []).forEach(p => {
    if (p && p.id && p.name && !ids.has(p.id)) { ids.add(p.id); s.positions.push({id:String(p.id), name:String(p.name), sym:String(p.sym || '')}); }
  });
  (Array.isArray(o.txs) ? o.txs : []).forEach(t => {
    if (!t || !ids.has(t.posId)) return;
    const d = parseDate(t.date), q = Number(t.qty), pr = Number(t.price), fee = Number(t.fee || 0);
    if (!d || !(q > 0) || !(pr >= 0) || !(fee >= 0)) return;
    s.txs.push({id:String(t.id || uid()), posId:t.posId, type:t.type === 'sell' ? 'sell' : 'buy', date:d, qty:q, price:pr, fee:fee});
  });
  if (o.prices && typeof o.prices === 'object') {
    Object.keys(o.prices).forEach(pid => {
      if (!ids.has(pid) || !Array.isArray(o.prices[pid])) return;
      const m = new Map();
      o.prices[pid].forEach(e => { const d = e && parseDate(e.date), pr = e && Number(e.price); if (d && pr > 0) m.set(d, pr); });
      s.prices[pid] = [...m].map(([date, price]) => ({date, price})).sort((a, b) => a.date < b.date ? -1 : 1);
    });
  }
  const cids = new Set();
  (Array.isArray(o.cash) ? o.cash : []).forEach(c => {
    if (!c) return;
    const d = parseDate(c.date), a = Number(c.amount), id = String(c.id || uid());
    if (!d || !(a > 0) || !isFinite(a) || !['in', 'out', 'ertrag'].includes(c.type) || cids.has(id)) return;
    cids.add(id); s.cash.push({id, date:d, type:c.type, amount:a, note:String(c.note || '')});
  });
  if (o.meta && o.meta.lastBackup) s.meta.lastBackup = String(o.meta.lastBackup);
  if (o.meta && ['avg', 'fifo', 'lifo', 'net'].includes(o.meta.method)) s.meta.method = o.meta.method;
  return s;
}
let storageOK = true;
function loadState(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return normalizeState(JSON.parse(raw)); }
  catch (e) { storageOK = false; console.warn('Laden fehlgeschlagen', e); }
  return emptyState();
}
let state = loadState();
let cache = {};
function saveState(opts){
  cache = {};
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch (e) { storageOK = false; toast('Achtung: Speichern im Browser nicht möglich. Bitte Sicherung exportieren.', 5000); }
  if (!(opts && opts.noSync)) driveTouch();
}
/* Ersetzt den kompletten Bestand. Der bisherige Stand bleibt als Notkopie im Browser (Reiter Daten). */
function replaceState(ns, opts){
  opts = opts || {};
  if (opts.keepPrev !== false && hasData(state)) {
    try { localStorage.setItem(LS_KEY + '_prev', JSON.stringify({saved:new Date().toISOString(), state})); } catch (e) {}
  }
  state = ns; saveState({noSync:!!opts.noSync});
}

/* ---------- Berechnung ---------- */
const posById = id => state.positions.find(p => p.id === id);
function txsOf(posId){ return state.txs.filter(t => t.posId === posId); }
function sortTxs(list){
  return list.slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.type === b.type ? 0 : a.type === 'buy' ? -1 : 1));
}
const METHODS = {
  avg:{name:'Gleitender Durchschnitt', kpi:'inkl. Gebühren',
    hint:'Alle Käufe werden zu einem Durchschnittskurs zusammengefasst. Ein Verkauf ändert den Durchschnittskurs der übrigen Stücke nicht. Der Gewinn aus einem Verkauf wird als realisiert ausgewiesen.'},
  fifo:{name:'FIFO (zuerst gekauft, zuerst verkauft)', kpi:'inkl. Gebühren',
    hint:'Beim Verkauf gelten die zuerst gekauften Stücke als zuerst verkauft. Der Einstiegspreis der übrigen Stücke ergibt sich aus den späteren Käufen. Banken nutzen dieses Verfahren meist für die Steuer; vergleiche trotzdem mit deiner Steuerbescheinigung.'},
  lifo:{name:'LIFO (zuletzt gekauft, zuerst verkauft)', kpi:'inkl. Gebühren',
    hint:'Beim Verkauf gelten die zuletzt gekauften Stücke als zuerst verkauft. Die älteren Käufe bleiben als Einstieg der übrigen Stücke erhalten.'},
  net:{name:'Netto-Einstand (Käufe minus Verkaufserlöse)', kpi:'Käufe minus Verkaufserlöse',
    hint:'Einstand = alle Kaufbeträge minus alle Verkaufserlöse, geteilt durch den aktuellen Bestand. Wer einen Teil teuer verkauft und günstiger zurückkauft, senkt so seinen Einstiegspreis. Beispiel: 100 Stück zu 10 €, 50 davon zu 15 € verkauft und 50 zu 12 € zurückgekauft ergibt (1.000 − 750 + 600) / 100 = 8,50 €. Verkaufsgewinne stecken hier im niedrigeren Einstand, ein realisierter Gewinn entsteht erst, wenn die Position ganz verkauft ist. Der Einstiegspreis kann bis auf null oder darunter sinken.'}
};
const curMethod = () => (state.meta && METHODS[state.meta.method]) ? state.meta.method : 'avg';
/* Berechnet Bestand, Einstand, Einstiegspreis und realisiertes Ergebnis einer Position nach der gewaehlten Methode.
   avg: gleitender Durchschnitt. fifo/lifo: Kaufpositionen (Lots) werden verbraucht. net: Kaufsummen minus Verkaufserloese. */
function calcFrom(list, upTo, method){
  method = method || curMethod();
  const errors = [];
  let realized = 0, buyQty = 0, buyVal = 0, soldQty = 0;
  const seq = [];
  for (const t of sortTxs(list)) { if (upTo && t.date > upTo) break; seq.push(t); }
  let q = 0, cost = 0, costNet = 0, avg = NaN;
  if (method === 'net') {
    let inv = 0, invNet = 0, proc = 0, procNet = 0;
    for (const t of seq) {
      const fee = t.fee || 0;
      if (t.type === 'buy') { q += t.qty; invNet += t.qty * t.price; inv += t.qty * t.price + fee; buyQty += t.qty; buyVal += t.qty * t.price; }
      else {
        if (t.qty > q + 1e-9) { errors.push(t.id); continue; }
        q -= t.qty; procNet += t.qty * t.price; proc += t.qty * t.price - fee; soldQty += t.qty;
        if (q < 1e-9) { q = 0; realized += proc - inv; inv = invNet = proc = procNet = 0; }
      }
    }
    cost = inv - proc; costNet = invNet - procNet; avg = q > 0 ? costNet / q : NaN;
  } else if (method === 'fifo' || method === 'lifo') {
    const lots = [];
    for (const t of seq) {
      const fee = t.fee || 0;
      if (t.type === 'buy') { lots.push({q:t.qty, p:t.price, f:fee}); q += t.qty; buyQty += t.qty; buyVal += t.qty * t.price; }
      else {
        if (t.qty > q + 1e-9) { errors.push(t.id); continue; }
        let rem = t.qty, cons = 0;
        while (rem > 1e-12 && lots.length) {
          const lot = method === 'fifo' ? lots[0] : lots[lots.length - 1];
          const take = Math.min(rem, lot.q), frac = take / lot.q;
          cons += take * lot.p + lot.f * frac; lot.f -= lot.f * frac; lot.q -= take; rem -= take;
          if (lot.q < 1e-12) { if (method === 'fifo') lots.shift(); else lots.pop(); }
        }
        realized += t.qty * t.price - fee - cons; q -= t.qty; soldQty += t.qty;
        if (q < 1e-9) { q = 0; lots.length = 0; }
      }
    }
    costNet = lots.reduce((a, l) => a + l.q * l.p, 0); cost = costNet + lots.reduce((a, l) => a + l.f, 0);
    avg = q > 0 ? costNet / q : NaN;
  } else {
    for (const t of seq) {
      const fee = t.fee || 0;
      if (t.type === 'buy') { q += t.qty; costNet += t.qty * t.price; cost += t.qty * t.price + fee; buyQty += t.qty; buyVal += t.qty * t.price; }
      else {
        if (t.qty > q + 1e-9) { errors.push(t.id); continue; }
        const f = t.qty / q;
        realized += t.qty * t.price - fee - cost * f;
        cost -= cost * f; costNet -= costNet * f; q -= t.qty; soldQty += t.qty;
        if (q < 1e-9) { q = 0; cost = 0; costNet = 0; }
      }
    }
    avg = q > 0 ? costNet / q : NaN;
  }
  return {qty:q, cost, costNet, avg, realized, errors, buyQty, buyVal, soldQty};
}
const calcPosition = (posId, upTo, method) => calcFrom(txsOf(posId), upTo, method);
/* ---------- Konto: jeder Kauf und Verkauf bucht automatisch gegen das Konto ---------- */
const cashOn = () => state.cash.length > 0;
const CASH_TYPES = {in:'Einzahlung', out:'Auszahlung', ertrag:'Ertrag (Dividende, Zinsen)'};
/* Alle Kontobewegungen in zeitlicher Reihenfolge. Am selben Tag gilt: erst Einzahlungen und Erträge, dann Verkäufe, dann Käufe, zuletzt Auszahlungen. */
function cashEvents(){
  const ev = [];
  state.cash.forEach((c, i) => ev.push({d:c.date, o:c.type === 'out' ? 3 : 0, n:i, a:c.type === 'out' ? -c.amount : c.amount, kind:c.type, id:c.id, text:(CASH_TYPES[c.type].replace(/ \(.*$/, '')) + (c.note ? ': ' + c.note : '')}));
  state.txs.forEach((t, i) => { const p = posById(t.posId), nm = p ? p.name : '?';
    ev.push(t.type === 'sell'
      ? {d:t.date, o:1, n:i, a:t.qty * t.price - t.fee, kind:'sell', id:t.id, text:`Verkauf ${nm}, ${qty(t.qty)} Stück zu ${price(t.price)}`}
      : {d:t.date, o:2, n:i, a:-(t.qty * t.price + t.fee), kind:'buy', id:t.id, text:`Kauf ${nm}, ${qty(t.qty)} Stück zu ${price(t.price)}`}); });
  ev.sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : x.o - y.o || x.n - y.n);
  let bal = 0; ev.forEach(e => { bal += e.a; e.bal = bal; });
  return ev;
}
function cashInfo(upTo){
  let bal = 0, min = 0, minDate = '';
  for (const e of cashEvents()) { if (upTo && e.d > upTo) break; bal = e.bal; if (bal < min - 1e-9) { min = bal; minDate = e.d; } }
  return {bal, min, minDate, over:min < -0.005};
}
const netPaid = upTo => state.cash.reduce((a, c) => (upTo && c.date > upTo) || c.type === 'ertrag' ? a : a + (c.type === 'in' ? c.amount : -c.amount), 0);
function cashNote(){
  if (!cashOn()) return '';
  const ci = cashInfo();
  return ci.over ? `<div class="note">Das Konto ist ${ci.bal < -0.005 ? 'aktuell' : `seit dem ${fd(ci.minDate)} zeitweise`} um ${eur(-(ci.bal < -0.005 ? ci.bal : ci.min))} überzogen, die Käufe übersteigen also das erfasste Kapital. Prüfe unter <a href="#konto" data-act="goto" data-tab="konto">Konto</a>, ob eine Einzahlung fehlt oder ihr Datum nach dem ersten Kauf liegt.</div>` : '';
}
function cashKpis(tot){
  const ci = cashInfo(), net = netPaid(), total = ci.bal + tot.value, res = total - net;
  return `<div class="kpis">
    <div class="kpi"><div class="l">Verfügbares Kapital</div><div class="v ${ci.bal < -0.005 ? 'neg' : ''}">${eur(ci.bal)}</div><div class="s">nach allen Käufen und Verkäufen</div></div>
    <div class="kpi"><div class="l">Gesamtvermögen</div><div class="v">${eur(total)}</div><div class="s">Depotwert plus Kapital</div></div>
    <div class="kpi"><div class="l">Netto eingezahlt</div><div class="v">${eur(net)}</div><div class="s">Einzahlungen minus Auszahlungen</div></div>
    <div class="kpi"><div class="l">Gesamtergebnis</div><div class="v ${signCls(res)}">${eurS(res)}</div><div class="s ${signCls(res)}">${net > 0 ? pctS(res / net) : '–'}</div></div></div>`;
}
function setMethod(m){ if (!METHODS[m]) return; state.meta.method = m; saveState(); render(); }
/* Auswahl der Berechnungsmethode, in Uebersicht und Diagrammen. */
function methodBar(){
  const m = curMethod();
  return `<div class="card" style="padding:10px 14px"><label style="margin:0">Berechnungsmethode für Einstiegspreis und Ergebnis
    <select id="methodSel">${Object.keys(METHODS).map(k => `<option value="${k}"${k === m ? ' selected' : ''}>${esc(METHODS[k].name.replace(/ \(.*$/, ''))}</option>`).join('')}</select></label>
    <details><summary>Wie wird gerechnet?</summary><p class="hint" style="margin-top:0">${esc(METHODS[m].hint)}</p></details></div>`;
}
/* Gegenueberstellung aller Methoden */
function methodCompare(rows){
  const M = ['avg', 'fifo', 'lifo', 'net'], open = rows.filter(r => r.open);
  if (!open.length) return '';
  let h = `<details style="margin-top:14px"><summary><strong>Methoden im Vergleich</strong></summary>`;
  h += `<h3>Ø Einstiegspreis je Stück (ohne Gebühren)</h3><div class="tablewrap"><table class="sticky1"><thead><tr><th>Position</th>${M.map(m => `<th>${m === 'avg' ? 'Gleitend' : m === 'net' ? 'Netto' : m.toUpperCase()}</th>`).join('')}</tr></thead><tbody>`;
  open.forEach(r => { h += `<tr><td>${esc(r.pos.name)}</td>${M.map(m => `<td>${price(calcPosition(r.pos.id, undefined, m).avg)}</td>`).join('')}</tr>`; });
  h += `</tbody></table></div><h3>Ergebnis des gesamten Depots</h3><div class="tablewrap"><table><thead><tr><th>Methode</th><th>Einstand</th><th>G/V offen</th><th>Realisiert</th><th>Gesamt</th></tr></thead><tbody>`;
  M.forEach(m => {
    let cost = 0, val = 0, real = 0;
    state.positions.forEach(p => { const c = calcPosition(p.id, undefined, m); real += c.realized; const r = rows.find(x => x.pos.id === p.id); if (c.qty > 1e-9 && r && isFinite(r.price)) { cost += c.cost; val += c.qty * r.price; } });
    h += `<tr><td>${esc(METHODS[m].name.replace(/ \(.*$/, ''))}</td><td>${eur(cost)}</td><td class="${signCls(val - cost)}">${eurS(val - cost)}</td><td class="${signCls(real)}">${eurS(real)}</td><td class="${signCls(val - cost + real)}">${eurS(val - cost + real)}</td></tr>`;
  });
  return h + `</tbody></table></div><p class="hint">Das Gesamtergebnis ist bei jeder Methode gleich. Die Methoden unterscheiden sich nur darin, wie es auf offene Position und realisierten Gewinn verteilt wird und welcher Einstiegspreis angezeigt wird.</p></details>`;
}

/* Preisbeobachtungen: manuelle Kurse + Transaktionspreise (Kurs gewinnt am selben Tag). */
function obsFor(posId){
  if (cache['o' + posId]) return cache['o' + posId];
  const o = [];
  txsOf(posId).forEach(t => o.push({date:t.date, price:t.price, src:'trade', w:0}));
  (state.prices[posId] || []).forEach(p => o.push({date:p.date, price:p.price, src:'kurs', w:1}));
  o.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.w - b.w);
  return (cache['o' + posId] = o);
}
function priceAtDate(posId, d){
  const o = obsFor(posId); let best = null;
  for (const e of o) { if (e.date <= d) best = e; else break; }
  return best ? best.price : null;
}

function computeRows(){
  const rows = state.positions.map(p => {
    const c = calcPosition(p.id), o = obsFor(p.id), last = o[o.length - 1] || null;
    const open = c.qty > 1e-9;
    const pr = last ? last.price : NaN;
    const value = open ? (last ? c.qty * pr : NaN) : 0;
    const gv = open && last ? value - c.cost : 0;
    const age = last && last.src === 'kurs' ? daysBetween(last.date, todayISO()) : null;
    return Object.assign({pos:p, open, price:pr, priceDate:last ? last.date : null, priceSrc:last ? last.src : null,
      value, gv, gvPct:open && c.cost > 0 ? gv / c.cost : NaN, stale:age !== null && age > 7}, c);
  });
  const openRows = rows.filter(r => r.open && isFinite(r.value));
  const tot = {
    value:openRows.reduce((a, r) => a + r.value, 0),
    cost:openRows.reduce((a, r) => a + r.cost, 0),
    realized:rows.reduce((a, r) => a + r.realized, 0),
    openCount:rows.filter(r => r.open).length,
    fallback:rows.filter(r => r.open && r.priceSrc === 'trade').length,
    stale:rows.filter(r => r.open && r.stale).length,
    lastKurs:state.positions.reduce((m, p) => { const a = state.prices[p.id]; const d = a && a.length ? a[a.length - 1].date : ''; return d > m ? d : m; }, '')
  };
  tot.gv = tot.value - tot.cost;
  tot.gvPct = tot.cost > 0 ? tot.gv / tot.cost : NaN;
  rows.forEach(r => { r.share = r.open && tot.value > 0 && isFinite(r.value) ? r.value / tot.value : NaN; });
  return {rows, tot};
}

const ui = {tab:'uebersicht', sort:{key:'value', dir:-1}, showClosed:false, txEdit:null, txFilter:'', detailPos:'', lastDate:null, openHist:null};
let toastT;
function toast(msg, ms = 2600){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms);
}
function modal({title, text = '', fields = [], ok = 'OK', cancel = 'Abbrechen', danger = false}){
  return new Promise(resolve => {
    const root = $('#modal-root');
    const prevFocus = document.activeElement;
    root.innerHTML = `<div class="overlay"><form class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}
      ${fields.map((f, i) => `<label>${esc(f.label)}<input data-f="${i}" value="${esc(f.value || '')}" autocomplete="off"></label>`).join('')}
      <div class="btns"><button class="primary${danger ? ' danger' : ''}" type="submit"${danger ? ' style="background:var(--neg);border-color:var(--neg)"' : ''}>${esc(ok)}</button>
      ${cancel ? `<button class="btn" type="button" data-cancel>${esc(cancel)}</button>` : ''}</div></form></div>`;
    const form = root.querySelector('form');
    const close = v => { root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) {} resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.preventDefault(); close(fields.length ? null : false); } };
    document.addEventListener('keydown', onKey, true);
    form.addEventListener('submit', e => {
      e.preventDefault();
      close(fields.length ? fields.map((f, i) => form.querySelector(`[data-f="${i}"]`).value) : true);
    });
    const c = form.querySelector('[data-cancel]'); if (c) c.addEventListener('click', () => close(fields.length ? null : false));
    const first = form.querySelector('input') || form.querySelector('button'); if (first) first.focus();
  });
}
function download(name, text, mime){
  const blob = new Blob([text], {type:mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
}

function saveKurse(){
  const date = parseDate($('#kdate').value), msg = $('#kmsg');

  const inputs = [...document.querySelectorAll('.kinput')];
  const todo = [];
  for (const i of inputs) {
    if (!i.value.trim()) continue;
    const v = parseNum(i.value);
    if (!(v > 0)) { msg.textContent = `Ungültiger Kurs bei „${posById(i.dataset.pos).name}“.`; i.focus(); return; }
    todo.push([i.dataset.pos, v]);
  }

  todo.forEach(([pid, v]) => {
    const arr = (state.prices[pid] = state.prices[pid] || []);
    const ex = arr.find(e => e.date === date);
    if (ex) ex.price = v; else arr.push({date, price:v});
    arr.sort((a, b) => a.date < b.date ? -1 : 1);

  saveState(); render(); toast(`${todo.length} Kurs${todo.length > 1 ? 'e' : ''} für ${fd(date)} gespeichert`);

function updateTxSum(){
  const el = $('#txsum'); if (!el) return;
  const q = parseNum($('#f-qty').value), p = parseNum($('#f-price').value), f = parseNum($('#f-fee').value) || 0;
  const sell = $('#f-type').value === 'sell';
  const amt = q > 0 && p >= 0 ? q * p + (sell ? -f : f) : NaN;
  let txt = isFinite(amt) ? `${sell ? 'Erlös' : 'Kaufbetrag'} inklusive Gebühr: ${eur(amt)}` : '';
  if (isFinite(amt) && cashOn()) {
    const edit = ui.txEdit ? state.txs.find(t => t.id === ui.txEdit) : null;
    const old = edit ? (edit.type === 'sell' ? edit.qty * edit.price - edit.fee : -(edit.qty * edit.price + edit.fee)) : 0;
    const after = cashInfo().bal - old + (sell ? amt : -amt);
    txt += `. Kontostand danach: ${eur(after)}` + (after < -0.005 ? ` (Achtung: das Konto wäre um ${eur(-after)} überzogen)` : '');
  }
  el.textContent = txt;
}
function saveTx(){
  const msg = $('#txmsg'), date = parseDate($('#f-date').value), type = $('#f-type').value;
  const name = $('#f-name').value.trim(), q = parseNum($('#f-qty').value), pr = parseNum($('#f-price').value);
  const feeRaw = $('#f-fee').value.trim(), fee = feeRaw ? parseNum(feeRaw) : 0;
  if (!date) return void (msg.textContent = 'Bitte ein gültiges Datum wählen.');
  if (!name) return void (msg.textContent = 'Bitte eine Position angeben.');
  if (!(q > 0)) return void (msg.textContent = 'Stückzahl muss größer als 0 sein.');
  if (!(pr >= 0)) return void (msg.textContent = 'Bitte einen gültigen Kurs je Stück angeben.');
  if (!(fee >= 0)) return void (msg.textContent = 'Gebühr ungültig (leer lassen oder eine Zahl ≥ 0).');
  let pos = state.positions.find(p => p.name.toLowerCase() === name.toLowerCase());
  const isNew = !pos;
  const posId = pos ? pos.id : '__new__';
  const edit = ui.txEdit ? state.txs.find(t => t.id === ui.txEdit) : null;
  const tx = {id:edit ? edit.id : uid(), posId, type, date, qty:q, price:pr, fee};
  // Plausibilität: Verkauf darf Bestand nicht übersteigen
  const others = state.txs.filter(t => t.posId === posId && (!edit || t.id !== edit.id));
  const before = edit && edit.posId === posId ? calcFrom(txsOf(posId)).errors.length : calcFrom(others).errors.length;
  const after = calcFrom(others.concat([tx])).errors.length;
  if (after > before) return void (msg.textContent = 'Mit dieser Eingabe würde ein Verkauf den vorhandenen Bestand übersteigen. Bitte Datum, Art und Stückzahl prüfen.');
  if (isNew) { pos = {id:uid(), name, sym:''}; state.positions.push(pos); }
  tx.posId = pos.id;
  if (edit) Object.assign(edit, tx); else state.txs.push(tx);
  ui.txEdit = null; ui.lastDate = date;
  saveState(); render(); toast((edit ? 'Änderung gespeichert' : 'Transaktion gespeichert' + (isNew ? ` (neue Position „${name}“)` : '')) + (cashOn() ? `. Konto: ${eur(cashInfo().bal)}` : ''), 3200);
}

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';', '\t', ','].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}
const hnorm = s => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]/g, '');
const HMAP = {datum:'date', date:'date', name:'name', position:'name', wertpapier:'name', bezeichnung:'name', aktie:'name',
  kuerzel:'sym', symbol:'sym', wkn:'sym', isin:'sym', ticker:'sym', art:'type', typ:'type', type:'type', transaktion:'type',
  stueck:'qty', anzahl:'qty', menge:'qty', qty:'qty', kurs:'price', preis:'price', preisjestueck:'price', price:'price', einstiegspreis:'price',
  gebuehr:'fee', gebuehren:'fee', kosten:'fee', fee:'fee',
  schlusskurs:'price', schluss:'price', tageskurs:'price', close:'price', closing:'price', aktuellerkurs:'price', kursineur:'price'};
async function importCSV(file){
  const rows = parseCSV(await readTextFile(file));
  if (rows.length < 2) { toast('Die CSV-Datei enthält keine Datenzeilen.', 4000); return; }
  const col = {}; rows[0].forEach((h, i) => { const k = HMAP[hnorm(h)]; if (k && !(k in col)) col[k] = i; });
  const miss = ['date', 'name', 'type', 'qty', 'price'].filter(k => !(k in col));
  if (miss.length) { await modal({title:'Spalten fehlen', text:'Es fehlen Spalten für: ' + miss.map(k => ({date:'Datum', name:'Name', type:'Art', qty:'Stück', price:'Kurs'})[k]).join(', ') + '.\nErkannte Überschriften: ' + rows[0].join(' | '), ok:'OK', cancel:''}); return; }
  const good = [], bad = [];
  rows.slice(1).forEach((r, i) => {
    const g = k => (k in col ? (r[col[k]] || '').trim() : '');
    const date = parseDate(g('date')), name = g('name'), t = g('type').toLowerCase(), q = parseNum(g('qty')), pr = parseNum(g('price'));
    const fee = g('fee') ? parseNum(g('fee')) : 0;
    const type = /^(k|b)/.test(t) ? 'buy' : /^(v|s)/.test(t) ? 'sell' : null;
    const why = !date ? 'Datum' : !name ? 'Name' : !type ? 'Art' : !(q > 0) ? 'Stück' : !(pr >= 0) ? 'Kurs' : !(fee >= 0) ? 'Gebühr' : null;
    if (why) bad.push(`Zeile ${i + 2}: ${why} ungültig`); else good.push({date, name, sym:g('sym'), type, qty:q, price:pr, fee});
  });
  if (!good.length) { await modal({title:'Nichts importiert', text:bad.slice(0, 8).join('\n'), ok:'OK', cancel:''}); return; }
  const ok = await modal({title:'CSV importieren?', text:`${good.length} Transaktionen werden hinzugefügt.` + (bad.length ? `\n${bad.length} Zeilen sind fehlerhaft und werden übersprungen:\n` + bad.slice(0, 6).join('\n') + (bad.length > 6 ? '\n…' : '') : ''), ok:'Importieren'});
  if (!ok) return;
  good.forEach(g => {
    const lc = g.name.toLowerCase();
    let p = state.positions.find(x => x.name.toLowerCase() === lc || (g.sym && x.sym && x.sym.toLowerCase() === g.sym.toLowerCase()));
    if (!p) { p = {id:uid(), name:g.name, sym:g.sym}; state.positions.push(p); }
    else if (g.sym && !p.sym) p.sym = g.sym;
    state.txs.push({id:uid(), posId:p.id, type:g.type, date:g.date, qty:g.qty, price:g.price, fee:g.fee});
  });
  saveState(); render();
  const errN = state.positions.reduce((a, p) => a + calcPosition(p.id).errors.length, 0);
  toast(`${good.length} Transaktionen importiert` + (errN ? `. ${errN} Verkauf/Verkäufe übersteigen den Bestand (siehe Käufe).` : ''), errN ? 6000 : 3000);
}

/* Excel speichert CSV oft als Windows-1252: erst UTF-8 versuchen, sonst Windows-1252. */
async function readTextFile(file){
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }
}
function matchPos(str){
  str = String(str || '').trim(); if (!str) return null;
  const l = str.toLowerCase(), n = hnorm(str);
  return state.positions.find(p => p.name.toLowerCase() === l)
    || state.positions.find(p => p.sym && p.sym.toLowerCase() === l)
    || state.positions.find(p => hnorm(p.name) === n || (p.sym && hnorm(p.sym) === n)) || null;
}
/* Kurse einlesen. Liste: Datum;Name;Kurs. Tabelle: Datum;Position A;Position B ... Einzelliste: Datum;Kurs (Position wird abgefragt). */
async function importKurseCSV(file){
  const info = (title, text) => modal({title, text, ok:'OK', cancel:''});
  let rows;
  try { rows = parseCSV(await readTextFile(file)); } catch (e) { toast('Die Datei konnte nicht gelesen werden.', 4000); return; }
  if (!state.positions.length) { await info('Keine Positionen', 'Lege zuerst unter Käufe mindestens eine Position an. Kurse werden nur vorhandenen Positionen zugeordnet.'); return; }
  if (rows.length < 2) { await info('Keine Datenzeilen', 'Die CSV-Datei enthält keine Datenzeilen.'); return; }
  const hdr = rows[0], col = {};
  hdr.forEach((h, i) => { const k = HMAP[hnorm(h)]; if (k && !(k in col)) col[k] = i; });
  if (!('date' in col)) { await info('Spalte Datum fehlt', 'Die erste Zeile muss Überschriften enthalten, mindestens eine Spalte „Datum“.\nErkannte Überschriften: ' + hdr.join(' | ')); return; }
  const items = [], bad = [], unmatched = {}, unmatchedCols = [];
  const push = (line, dateStr, pos, priceStr) => {
    const date = parseDate(dateStr), v = parseNum(priceStr);
    if (!date) { bad.push(`Zeile ${line}: Datum ungültig`); return; }
    if (!(v > 0)) { bad.push(`Zeile ${line}: Kurs ungültig`); return; }
    items.push({pos, date, price:v});
  };
  let mode, single = null, wcols = [];
  if ('price' in col && ('name' in col || 'sym' in col)) mode = 'Liste (eine Zeile je Kurs)';
  else {
    hdr.forEach((h, i) => { if (i === col.date || !h.trim()) return; const p = matchPos(h); if (p) wcols.push({i, pos:p}); else unmatchedCols.push(h.trim()); });
    if (wcols.length) mode = 'Tabelle (eine Spalte je Position)';
    else if ('price' in col) {
      mode = 'Kurse einer Position';
      if (state.positions.length > 10) { await info('Position unklar', 'Die Datei enthält keine Spalte mit dem Namen der Position. Ergänze eine Spalte „Name“ oder benenne die Kursspalte nach der Position.'); return; }
      const ch = await choose({title:'Zu welcher Position gehören die Kurse?', text:'In der Datei steht kein Positionsname. Bitte wähle die Position:', options:state.positions.map(p => ({key:p.id, label:p.name, sub:p.sym || ''})).concat([{key:'', label:'Abbrechen'}])});
      if (!ch) return;
      single = posById(ch); unmatchedCols.length = 0;
    } else { await info('Format nicht erkannt', 'Erwartet wird entweder eine Liste mit den Spalten Datum, Name (oder Kürzel) und Kurs, oder eine Tabelle mit Datum und je einer Spalte pro Position (Überschrift = Name oder Kürzel).\nErkannte Überschriften: ' + hdr.join(' | ')); return; }
  }
  rows.slice(1).forEach((r, i) => {
    const line = i + 2, g = k => (k in col ? (r[col[k]] || '').trim() : '');
    if (mode.startsWith('Tabelle')) wcols.forEach(w => { const c = (r[w.i] || '').trim(); if (c) push(line, g('date'), w.pos, c); });
    else if (single) push(line, g('date'), single, g('price'));
    else {
      const key = g('name') || g('sym');
      if (!key) { bad.push(`Zeile ${line}: Name fehlt`); return; }
      const p = matchPos(g('name')) || matchPos(g('sym'));
      if (!p) { unmatched[key] = (unmatched[key] || 0) + 1; return; }
      push(line, g('date'), p, g('price'));
    }
  });
  const m = new Map(); items.forEach(it => m.set(it.pos.id + '|' + it.date, it));
  const list = [...m.values()]; let nNew = 0, nChg = 0, nSame = 0; const chg = [];
  list.forEach(it => {
    const ex = (state.prices[it.pos.id] || []).find(e => e.date === it.date);
    if (!ex) { nNew++; it.k = 'new'; } else if (Math.abs(ex.price - it.price) < 1e-9) { nSame++; it.k = 'same'; } else { nChg++; it.k = 'chg'; it.old = ex.price; chg.push(it); }
  });
  const unN = Object.keys(unmatched);
  const probs = [];
  if (unN.length) probs.push('Keiner Position zugeordnet (übersprungen): ' + unN.slice(0, 5).map(n => `„${n}“ (${unmatched[n]})`).join(', ') + (unN.length > 5 ? ' …' : ''));
  if (unmatchedCols.length) probs.push('Spalten ohne passende Position (übersprungen): ' + unmatchedCols.slice(0, 5).join(', ') + (unmatchedCols.length > 5 ? ' …' : ''));
  if (bad.length) probs.push(`${bad.length} fehlerhafte Zeile${bad.length > 1 ? 'n' : ''} (übersprungen): ` + bad.slice(0, 4).join('; ') + (bad.length > 4 ? ' …' : ''));
  if (nNew + nChg === 0) { await info('Nichts zu importieren', (nSame ? `Alle ${nSame} Kurse sind schon vorhanden.` : 'In der Datei wurde kein passender Kurs gefunden.') + (probs.length ? '\n\n' + probs.join('\n') : '')); return; }
  const dates = list.map(i => i.date).sort(), npos = new Set(list.map(i => i.pos.id)).size;
  let text = `Format: ${mode}\n${list.length} Kurse für ${npos} Position${npos > 1 ? 'en' : ''}, ${fd(dates[0])}${dates[0] !== dates[dates.length - 1] ? ' bis ' + fd(dates[dates.length - 1]) : ''}\n\nNeu: ${nNew}\nErsetzt (anderer Preis am selben Tag): ${nChg}\nUnverändert, wird übersprungen: ${nSame}`;
  if (chg.length) text += '\n\nErsetzt werden zum Beispiel:\n' + chg.slice(0, 4).map(c => `${c.pos.name} ${fd(c.date)}: ${price(c.old)} → ${price(c.price)}`).join('\n') + (chg.length > 4 ? '\n…' : '');
  if (probs.length) text += '\n\n' + probs.join('\n');
  const ok = await modal({title:'Kurse importieren?', text, ok:'Importieren'});
  if (!ok) return;
  list.forEach(it => {
    if (it.k === 'same') return;
    const arr = (state.prices[it.pos.id] = state.prices[it.pos.id] || []);
    const ex = arr.find(e => e.date === it.date);
    if (ex) ex.price = it.price; else arr.push({date:it.date, price:it.price});
    arr.sort((a, b) => a.date < b.date ? -1 : 1);
  });
  saveState(); render();
  toast(`${nNew + nChg} Kurse importiert (${nNew} neu, ${nChg} ersetzt)`, 4500);
}

/* --- Helfer --- */
function niceStep(range, n){ const raw = range / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag; }
function niceRange(lo, hi, n = 4){
  if (hi - lo < 1e-9) { const d = Math.abs(hi) * 0.1 || 1; lo -= d; hi += d; }
  const step = niceStep(hi - lo, n), a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, ticks = [];
  for (let v = a; v <= b + step * 1e-6; v += step) ticks.push(+v.toFixed(10));
  return {lo:a, hi:b, step, ticks};
}
function axisFmt(step){
  const d = Math.abs(step - Math.round(step)) < 1e-9 ? 0 : Math.abs(step * 10 - Math.round(step * 10)) < 1e-9 ? 1 : 2;
  const f = new Intl.NumberFormat('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});
  return v => f.format(v);
}
const trunc = (s, n) => s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s;
const svgWrap = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
const tableHTML = (head, rows) => `<div class="tablewrap"><table><thead><tr>${head.map((h, i) => `<th${i === 0 ? ' style="text-align:left"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function barPath(x, y, w, h, col, tip){
  if (w <= 0) return `<rect class="hit" x="${x}" y="${y - 3}" width="14" height="${h + 6}" data-tip="${esc(tip)}"/>`;

  return `<path d="M${x},${y}h${w - r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 ${-r},${r}h${-(w - r)}z" style="fill:${col}"/><rect class="hit" x="${x}" y="${y - 3}" width="${w + 40}" height="${h + 6}" data-tip="${esc(tip)}"/>`;
}

/* --- Horizontale Balken (1 oder 2 Serien) --- */
function hbarChart(w, items, series, fmt, label){
  const sn = series.length, leftW = Math.round(Math.min(150, Math.max(86, w * 0.3))), rightW = 78;
  const pw = Math.max(60, w - leftW - rightW);
  const maxV = Math.max(0, ...items.flatMap(i => i.vals));
  const sc = niceRange(0, maxV || 1, 4);
  const barH = sn > 1 ? 11 : 14, gap = sn > 1 ? 3 : 0, blockH = sn * barH + (sn - 1) * gap, rowH = blockH + 16;
  const top = 6, axisH = 22, h = top + items.length * rowH + axisH;
  const x = v => leftW + v / sc.hi * pw, af = axisFmt(sc.step);
  let g = '';
  sc.ticks.forEach(t => { g += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${h - axisH}"/><text class="tm" x="${x(t)}" y="${h - 6}" text-anchor="middle">${af(t)}</text>`; });
  g += `<line class="axis" x1="${leftW}" x2="${leftW}" y1="${top}" y2="${h - axisH}"/>`;
  items.forEach((it, i) => {
    const y0 = top + i * rowH + 8;
    g += `<text class="t" x="${leftW - 8}" y="${y0 + blockH / 2 + 4}" text-anchor="end">${esc(trunc(it.label, Math.floor((leftW - 10) / 6.4)))}<title>${esc(it.label)}</title></text>`;
    it.vals.forEach((v, k) => {
      const y = y0 + k * (barH + gap), bw = v / sc.hi * pw;
      g += barPath(leftW, y, bw, barH, series[k].color, it.tips[k]);
      g += `<text class="tv" x="${leftW + bw + 5}" y="${y + barH - (sn > 1 ? 1 : 3)}">${fmt(v)}</text>`;
    });
  });
  return svgWrap(w, h, g, label);
}

/* --- Punktdiagramm: Käufe und Kurs relativ zum Ø-Einstieg --- */
function dotChart(w, rows){
  const excluded = rows.filter(r => r.open && !(isFinite(r.avg) && r.avg > 0)).map(r => r.pos.name);
  const data = rows.filter(r => r.open && isFinite(r.avg) && r.avg > 0).map(r => {
    const buys = sortTxs(txsOf(r.pos.id)).filter(t => t.type === 'buy');
    return {r, buys, cur:isFinite(r.price) ? r.price / r.avg - 1 : null};
  });
  const devs = data.flatMap(d => d.buys.map(b => b.price / d.r.avg - 1).concat(d.cur === null ? [] : [d.cur]));
  const lo0 = Math.min(-0.1, ...devs) * 1.12, hi0 = Math.max(0.1, ...devs) * 1.12;
  const sc = niceRange(lo0 * 100, hi0 * 100, 5);
  const leftW = Math.round(Math.min(150, Math.max(86, w * 0.28))), rightW = 54, pw = Math.max(60, w - leftW - rightW);
  const x = pct => leftW + (pct - sc.lo) / (sc.hi - sc.lo) * pw;
  const rowH = 36, top = 22, axisH = 24, h = top + data.length * rowH + axisH;
  const maxQ = Math.max(1, ...data.flatMap(d => d.buys.map(b => b.qty)));
  const af = axisFmt(sc.step);
  let g = '';
  sc.ticks.forEach(t => { g += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${top - 6}" y2="${h - axisH}"/><text class="tm" x="${x(t)}" y="${h - 7}" text-anchor="middle">${t > 0 ? '+' : ''}${af(t)} %</text>`; });
  g += `<line x1="${x(0)}" x2="${x(0)}" y1="${top - 8}" y2="${h - axisH}" style="stroke:var(--text2);stroke-width:1.5"/><text class="tm" x="${x(0)}" y="${top - 11}" text-anchor="middle">Ø-Einstieg</text>`;
  data.forEach((d, i) => {
    const cy = top + i * rowH + rowH / 2, nm = d.r.pos.name;
    g += `<line class="grid" x1="${leftW}" x2="${leftW + pw}" y1="${cy}" y2="${cy}"/>`;
    g += `<text class="t" x="${leftW - 8}" y="${cy + 4}" text-anchor="end">${esc(trunc(nm, Math.floor((leftW - 10) / 6.4)))}<title>${esc(nm)}</title></text>`;
    d.buys.forEach(b => {
      const dv = (b.price / d.r.avg - 1) * 100, rad = 4 + 6 * Math.sqrt(b.qty / maxQ);
      g += `<circle cx="${x(dv)}" cy="${cy}" r="${rad.toFixed(1)}" style="fill:var(--s1);stroke:var(--surface);stroke-width:2" data-tip="${esc(`${nm}\nKauf ${fd(b.date)}\n${qty(b.qty)} Stück zu ${price(b.price)}\n${pctS(dv / 100)} gegenüber Ø ${price(d.r.avg)}`)}"/>`;
    });
    if (d.cur !== null) {
      const cx = x(d.cur * 100), s = 7;
      g += `<path d="M${cx},${cy - s}L${cx + s},${cy}L${cx},${cy + s}L${cx - s},${cy}Z" style="fill:var(--s2);stroke:var(--surface);stroke-width:2" data-tip="${esc(`${nm}\nAktueller Kurs ${price(d.r.price)}${d.r.priceDate ? ' (' + fd(d.r.priceDate) + ')' : ''}\n${pctS(d.cur)} gegenüber Ø ${price(d.r.avg)}`)}"/>`;
      g += `<text class="tv" x="${w - 2}" y="${cy + 4}" text-anchor="end">${pctS(d.cur)}</text>`;
    }
  });
  g += `<line class="axis" x1="${leftW}" x2="${leftW + pw}" y1="${h - axisH}" y2="${h - axisH}"/>`;
  return {svg:svgWrap(w, h, g, 'Einstiegspreise der Käufe relativ zum Durchschnitt'), data, excluded};
}

/* --- Donut --- */
function donutChart(rows, cashBal){
  const open = rows.filter(r => r.open && isFinite(r.value) && r.value > 0).sort((a, b) => b.value - a.value);
  const withCash = cashBal > 0.005;
  const total = open.reduce((a, r) => a + r.value, 0) + (withCash ? cashBal : 0);
  if (!open.length && !withCash) return null;
  let items = open.slice(0, 7).map((r, i) => ({name:r.pos.name, value:r.value, color:PALETTE[i]}));
  if (open.length > 7) items.push({name:`Sonstige (${open.length - 7})`, value:open.slice(7).reduce((a, r) => a + r.value, 0), color:'var(--other)'});
  if (withCash) items.push({name:'Kapital auf dem Konto', value:cashBal, color:PALETTE[7]});
  const S = 220, c = S / 2, R = 104, r0 = 64;
  const pt = (rad, a) => [c + rad * Math.sin(a), c - rad * Math.cos(a)];
  let a0 = 0, g = '';
  const seg = (a, b, it, frac, tip) => {
    const [x1, y1] = pt(R, a), [x2, y2] = pt(R, b), [x3, y3] = pt(r0, b), [x4, y4] = pt(r0, a), large = b - a > Math.PI ? 1 : 0;
    return `<path d="M${x1},${y1}A${R},${R} 0 ${large} 1 ${x2},${y2}L${x3},${y3}A${r0},${r0} 0 ${large} 0 ${x4},${y4}Z" style="fill:${it.color};stroke:var(--surface);stroke-width:2" data-tip="${esc(tip)}"/>`;
  };
  items.forEach(it => {
    const frac = it.value / total, a1 = a0 + frac * 2 * Math.PI, tip = `${it.name}\n${eur(it.value)} (${pctP(frac)})`;
    if (frac > 0.9999) { g += seg(0, Math.PI, it, 0.5, tip) + seg(Math.PI, 2 * Math.PI - 1e-6, it, 0.5, tip); }
    else g += seg(a0, a1, it, frac, tip);
    a0 = a1;
  });
  g += `<text class="tm" x="${c}" y="${c - 6}" text-anchor="middle">${withCash ? 'Gesamtvermögen' : 'Depotwert'}</text><text class="tb" x="${c}" y="${c + 14}" text-anchor="middle">${eur(total)}</text>`;
  const legend = `<ul>${items.map(it => `<li><i class="sw" style="background:${it.color}"></i><span class="n">${esc(it.name)}</span><span class="p">${pctP(it.value / total)}</span></li>`).join('')}</ul>`;
  return {html:`<div class="donutrow">${svgWrap(S, S, g, 'Gewichtung im Depot')}${legend}</div>`, items, total};
}

/* --- Verlauf einer Position --- */
function avgTimeline(list){
  const out = [];
  for (const t of sortTxs(list)) { const c = calcFrom(list, t.date); out.push({date:t.date, qty:c.qty, avg:c.avg}); }
  return out;
}
function detailChart(w, posId){
  const txs = sortTxs(txsOf(posId)), manual = state.prices[posId] || [];
  if (!txs.length && !manual.length) return null;
  const dates = txs.map(t => t.date).concat(manual.map(m => m.date)).sort();
  let t0 = tm(dates[0]), t1 = tm(dates[dates.length - 1]);
  if (t1 - t0 < 14 * 864e5) { const m = (14 * 864e5 - (t1 - t0)) / 2; t0 -= m; t1 += m; }
  const steps = avgTimeline(txs);
  const allP = manual.map(m => m.price).concat(txs.map(t => t.price), steps.filter(s => s.qty > 0).map(s => s.avg));
  let pmin = Math.min(...allP), pmax = Math.max(...allP); const sp = (pmax - pmin) || pmax * 0.1 || 1;
  const yr = niceRange(pmin - sp * 0.08, pmax + sp * 0.08, 4);
  const maxQ = Math.max(1, ...steps.map(s => s.qty));
  const qr = niceRange(0, maxQ, 2);
  const L = 56, R = 16, T = 10, H1 = 190, GAP = 34, H2 = 80, B = 28, pw = Math.max(80, w - L - R);
  const h = T + H1 + GAP + H2 + B;
  const x = t => L + (t - t0) / (t1 - t0) * pw, y1 = v => T + H1 - (v - yr.lo) / (yr.hi - yr.lo) * H1;
  const y2Top = T + H1 + GAP, y2 = v => y2Top + H2 - (v - qr.lo) / (qr.hi - qr.lo) * H2;
  const af = axisFmt(yr.step), qf = axisFmt(qr.step);
  let g = '';
  timeTicks(t0, t1, w < 420 ? 3 : 5).forEach((t, i, a) => {
    g += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${T + H1}"/><line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${y2Top}" y2="${y2Top + H2}"/>`;
    g += `<text class="tm" x="${x(t)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === a.length - 1 ? 'end' : 'middle'}">${tdate(t)}</text>`;
  });
  yr.ticks.forEach(v => { g += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${y1(v)}" y2="${y1(v)}"/><text class="tm" x="${L - 6}" y="${y1(v) + 4}" text-anchor="end">${af(v)}</text>`; });
  qr.ticks.forEach(v => { g += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${y2(v)}" y2="${y2(v)}"/><text class="tm" x="${L - 6}" y="${y2(v) + 4}" text-anchor="end">${qf(v)}</text>`; });
  g += `<text class="t" x="${L}" y="${y2Top - 12}">Bestand in Stück</text>`;
  // Kurs
  if (manual.length > 1) g += `<path d="${manual.map((m, i) => (i ? 'L' : 'M') + x(tm(m.date)) + ',' + y1(m.price)).join('')}" style="fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round"/>`;
  manual.forEach(m => {
    if (manual.length <= 40 || manual.length === 1) g += `<circle cx="${x(tm(m.date))}" cy="${y1(m.price)}" r="3" style="fill:var(--s1);stroke:var(--surface);stroke-width:2"/>`;
    g += `<circle cx="${x(tm(m.date))}" cy="${y1(m.price)}" r="12" class="hit" data-tip="${esc(`Kurs ${fd(m.date)}\n${price(m.price)}`)}"/>`;
  });
  // Ø-Einstieg
  let d = '', inRun = false;
  steps.forEach((s, i) => {
    const xs = x(tm(s.date)), xn = i + 1 < steps.length ? x(tm(steps[i + 1].date)) : x(t1);
    if (s.qty > 0) { d += inRun ? `V${y1(s.avg)}` : `M${xs},${y1(s.avg)}`; d += `H${xn}`; inRun = true; } else inRun = false;
  });
  if (d) g += `<path d="${d}" style="fill:none;stroke:var(--s2);stroke-width:2;stroke-dasharray:6 4"/>`;
  const lastS = steps[steps.length - 1];
  if (lastS && lastS.qty > 0) g += `<text class="t" x="${L + pw}" y="${y1(lastS.avg) - 6}" text-anchor="end" style="fill:var(--text)">Ø ${price(lastS.avg)}</text>`;
  // Transaktionen
  txs.forEach((t, i) => {
    const cx = x(tm(t.date)), cy = y1(t.price), tip = `${t.type === 'buy' ? 'Kauf' : 'Verkauf'} ${fd(t.date)}\n${qty(t.qty)} Stück zu ${price(t.price)}`;
    if (t.type === 'buy') g += `<circle cx="${cx}" cy="${cy}" r="${(4 + 7 * Math.sqrt(t.qty / maxQ)).toFixed(1)}" style="fill:var(--s2);stroke:var(--surface);stroke-width:2" data-tip="${esc(tip)}"/>`;
    else g += `<path d="M${cx - 7},${cy - 6}L${cx + 7},${cy - 6}L${cx},${cy + 7}Z" style="fill:var(--surface);stroke:var(--s2);stroke-width:2.5;stroke-linejoin:round" data-tip="${esc(tip)}"/>`;
  });
  // Bestand
  if (steps.length) {
    let p = `M${x(tm(steps[0].date))},${y2(0)}V${y2(steps[0].qty)}`;
    steps.forEach((s, i) => { if (i) p += `H${x(tm(s.date))}V${y2(s.qty)}`; });
    p += `H${x(t1)}`;
    g += `<path d="${p}V${y2(0)}Z" style="fill:var(--s1);fill-opacity:.16;stroke:none"/><path d="${p}" style="fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round"/>`;
    steps.forEach(s => { g += `<circle cx="${x(tm(s.date))}" cy="${y2(s.qty)}" r="12" class="hit" data-tip="${esc(`Bestand ab ${fd(s.date)}\n${qty(s.qty)} Stück`)}"/>`; });
  }
  g += `<line class="axis" x1="${L}" x2="${L + pw}" y1="${T + H1}" y2="${T + H1}"/><line class="axis" x1="${L}" x2="${L + pw}" y1="${y2Top + H2}" y2="${y2Top + H2}"/>`;
  return {svg:svgWrap(w, h, g, 'Kursverlauf mit Käufen, Ø-Einstiegspreis und Bestand'), txs, steps, manual};
}

/* --- Depotwert im Zeitverlauf --- */
function depotSeries(K){
  const set = new Set();
  state.txs.forEach(t => set.add(t.date));
  if (K) state.cash.forEach(c => set.add(c.date));
  Object.values(state.prices).forEach(a => a.forEach(e => set.add(e.date)));
  const dates = [...set].sort();
  return dates.map(d => {
    let v = 0, c = 0;
    state.positions.forEach(p => { const st = calcPosition(p.id, d); if (st.qty > 1e-9) { const pr = priceAtDate(p.id, d); if (pr != null) v += st.qty * pr; c += st.cost; } });
    if (K) { v += cashInfo(d).bal; c = netPaid(d); }
    return {d, v, c};
  });
}
function depotChart(w, K){
  const pts = depotSeries(K), L1 = K ? 'Gesamtvermögen' : 'Depotwert', L2 = K ? 'Netto eingezahlt' : 'Eingesetzt', LE = K ? 'Ergebnis' : 'Gewinn/Verlust';
  if (pts.length < 2) return null;
  const t0 = tm(pts[0].d), t1 = tm(pts[pts.length - 1].d);
  const all = pts.flatMap(p => [p.v, p.c]);
  const lo = Math.min(...all), hi = Math.max(...all), sp = (hi - lo) || hi * 0.1 || 1;
  const yr = niceRange(lo < 0 ? lo - sp * 0.1 : Math.max(0, lo - sp * 0.1), hi + sp * 0.1, 4);
  const L = 62, R = 16, T = 16, H = 230, B = 28, pw = Math.max(80, w - L - R), h = T + H + B;
  const x = t => L + (t - t0) / (t1 - t0) * pw, y = v => T + H - (v - yr.lo) / (yr.hi - yr.lo) * H, af = axisFmt(yr.step);
  let g = '';
  timeTicks(t0, t1, w < 420 ? 3 : 5).forEach((t, i, a) => { g += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${T + H}"/><text class="tm" x="${x(t)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === a.length - 1 ? 'end' : 'middle'}">${tdate(t)}</text>`; });
  yr.ticks.forEach(v => { g += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}"/><text class="tm" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${af(v)}</text>`; });
  g += `<line class="axis" x1="${L}" x2="${L + pw}" y1="${T + H}" y2="${T + H}"/>`;
  // Hover-Baender
  pts.forEach((p, i) => {
    const xa = i ? (x(tm(pts[i - 1].d)) + x(tm(p.d))) / 2 : L, xb = i < pts.length - 1 ? (x(tm(p.d)) + x(tm(pts[i + 1].d))) / 2 : L + pw;
    g += `<rect class="hit" x="${xa}" y="${T}" width="${Math.max(2, xb - xa)}" height="${H}" data-tip="${esc(`${fd(p.d)}\n${L1} ${eur(p.v)}\n${L2} ${eur(p.c)}\n${LE} ${eurS(p.v - p.c)}`)}"/>`;
  });
  // Einstand (Treppe)
  g += `<path d="${pts.map((p, i) => i ? `H${x(tm(p.d))}V${y(p.c)}` : `M${x(tm(p.d))},${y(p.c)}`).join('')}" style="fill:none;stroke:var(--s2);stroke-width:2"/>`;
  g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(tm(p.d)) + ',' + y(p.v)).join('')}" style="fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round"/>`;
  if (pts.length <= 40) pts.forEach(p => { g += `<circle cx="${x(tm(p.d))}" cy="${y(p.v)}" r="3" style="fill:var(--s1);stroke:var(--surface);stroke-width:2;pointer-events:none"/>`; });
  const last = pts[pts.length - 1], vAbove = last.v >= last.c;
  g += `<text class="tv" x="${L + pw}" y="${y(last.v) + (vAbove ? -9 : 17)}" text-anchor="end">${K ? 'Vermögen' : 'Wert'} ${eur(last.v)}</text>`;
  g += `<text class="tv" x="${L + pw}" y="${y(last.c) + (vAbove ? 17 : -9)}" text-anchor="end">${K ? 'Eingezahlt' : 'Einstand'} ${eur(last.c)}</text>`;
  return {svg:svgWrap(w, h, g, K ? 'Gesamtvermögen und netto eingezahltes Kapital im Zeitverlauf' : 'Depotwert und eingesetztes Kapital im Zeitverlauf'), pts};
}

/* --- alles zeichnen --- */
function drawCharts(){
  const {rows} = computeRows();
  const open = rows.filter(r => r.open);
  const W = id => Math.max(280, ($('#' + id) || {clientWidth:320}).clientWidth || 320);
  const put = (id, html, tbl) => { const el = $('#' + id); if (el) el.innerHTML = html; const t = $('#' + id + '-t'); if (t) t.innerHTML = tbl || ''; };

  const byName = open.slice().sort((a, b) => a.pos.name.localeCompare(b.pos.name, 'de'));
  put('c-qty', hbarChart(W('c-qty'), byName.map(r => ({label:r.pos.name, vals:[r.qty], tips:[`${r.pos.name}\n${qty(r.qty)} Stück`]})), [{color:'var(--s1)'}], qty, 'Stückzahlen je Position'),
      tableHTML(['Position', 'Stück'], byName.map(r => [esc(r.pos.name), qty(r.qty)])));

  const dc = dotChart(W('c-dots'), byName);
  put('c-dots', dc.svg + (dc.excluded.length ? `<p class="hint">Nicht dargestellt, weil der Einstiegspreis bei dieser Methode null oder negativ ist: ${esc(dc.excluded.join(', '))}</p>` : ''), tableHTML(['Position', 'Ø Einstieg', 'Kurs', 'Abweichung', 'Käufe (Datum: Stück zu Preis)'],
      dc.data.map(d => [esc(d.r.pos.name), price(d.r.avg), price(d.r.price), pctS(d.cur === null ? NaN : d.cur), d.buys.map(b => `${fdShort(b.date)} ${qty(b.qty)} × ${price(b.price)}`).join('<br>')])));

  const withVal = byName.filter(r => isFinite(r.value));
  put('c-val', hbarChart(W('c-val'), withVal.map(r => ({label:r.pos.name, vals:[Math.max(0, r.cost), r.value], tips:[`${r.pos.name}\nEinstand ${eur(r.cost)}`, `${r.pos.name}\nWert ${eur(r.value)}\nG/V ${eurS(r.gv)} (${pctS(r.gvPct)})`]})),
      [{color:'var(--s1)'}, {color:'var(--s2)'}], v => eur(v).replace(/ €/, ' €'), 'Eingesetztes Kapital und aktueller Wert'),
      tableHTML(['Position', 'Einstand', 'Wert', 'G/V'], withVal.map(r => [esc(r.pos.name), eur(r.cost), eur(r.value), eurS(r.gv)])));

  const dn = donutChart(rows, cashOn() ? cashInfo().bal : 0);
  put('c-donut', dn ? dn.html : '<p class="hint">Noch keine Kurse oder Werte.</p>', dn ? tableHTML(['Position', 'Wert', 'Anteil'], dn.items.map(i => [esc(i.name), eur(i.value), pctP(i.value / dn.total)])) : '');

  drawDetail();

  const dp = depotChart(W('c-depot'));
  put('c-depot', dp ? dp.svg : '<p class="hint">Der Verlauf erscheint, sobald Daten von mindestens zwei verschiedenen Tagen vorliegen (Transaktionen oder erfasste Kurse).</p>',
      dp ? tableHTML(['Datum', 'Depotwert', 'Eingesetzt', 'G/V'], dp.pts.slice().reverse().map(p => [fd(p.d), eur(p.v), eur(p.c), eurS(p.v - p.c)])) : '');
  if (cashOn()) {
    const dk = depotChart(W('c-konto'), true);
    put('c-konto', dk ? dk.svg : '<p class="hint">Der Verlauf erscheint, sobald Daten von mindestens zwei verschiedenen Tagen vorliegen.</p>',
        dk ? tableHTML(['Datum', 'Gesamtvermögen', 'Netto eingezahlt', 'Ergebnis'], dk.pts.slice().reverse().map(p => [fd(p.d), eur(p.v), eur(p.c), eurS(p.v - p.c)])) : '');
  }
}
function drawDetail(){
  const el = $('#c-detail'); if (!el) return;
  const w = Math.max(280, el.clientWidth || 320);
  const dt = detailChart(w, ui.detailPos);
  el.innerHTML = dt ? dt.svg : '<p class="hint">Für diese Position liegen noch keine Daten vor.</p>';
  const t = $('#c-detail-t');
  if (t) t.innerHTML = dt ? tableHTML(['Datum', 'Ereignis', 'Stück', 'Kurs'],
    dt.txs.map(x => ({d:x.date, c:[fd(x.date), x.type === 'buy' ? 'Kauf' : 'Verkauf', qty(x.qty), price(x.price)]}))
      .concat(dt.manual.map(m => ({d:m.date, c:[fd(m.date), 'Kurs', '', price(m.price)]})))
      .sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0).map(o => o.c)) : '';
}

   Ereignisse
   ====================================================================== */
const tipEl = $('#tip');
function showTip(el, e){
  tipEl.textContent = el.getAttribute('data-tip'); tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect(); let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 6) x = innerWidth - r.width - 6;
  if (x < 6) x = 6;
  if (y + r.height > innerHeight - 6) y = Math.max(6, e.clientY - r.height - 14);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
const hideTip = () => { tipEl.style.display = 'none'; };

gesichert am ${fdt(pv.saved)}

Der aktuelle Stand (${sumState(state)}) wird ersetzt und bleibt seinerseits als Notkopie erhalten.`, ok:'Wiederherstellen', danger:true})) break;

   Google Drive: Anmeldung, Datei, Sicherungen, Konflikte
   Gleiche Client-ID und gleiche Art der Anmeldung wie in den anderen Tools (Google Identity Services,
   Berechtigung drive.file: die App sieht nur Dateien, die sie selbst angelegt hat).
   ====================================================================== */
const CLIENT_ID = '22658520266-72537b3ef6bi63gmfaavt4r5snnjv0ln.apps.googleusercontent.com';
const D_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const D_FOLDER = 'Seifferts Depot', D_BACKUP = 'Sicherungen', D_FILE = 'depot-daten.json', D_KEEP = 30;
const DK = 'seifferts_depot_drive_v1';
const D_API = 'https://www.googleapis.com/drive/v3/', D_UP = 'https://www.googleapis.com/upload/drive/v3/';
let D_DEBOUNCE = 2500;

function loadDM(){
  const def = {on:false, fileId:'', folderId:'', backupId:'', version:'', lastSaved:'', dirty:false, auto:true, backupDay:''};
  try { const o = JSON.parse(localStorage.getItem(DK) || 'null'); if (o && typeof o === 'object') return Object.assign(def, o); } catch (e) {}
  return def;
}
let dm = loadDM();
const saveDM = () => { try { localStorage.setItem(DK, JSON.stringify(dm)); } catch (e) {} };
const dd = {state:dm.on ? 'auth' : 'off', msg:'', token:null, exp:0, tc:null, pending:null, timer:null, q:Promise.resolve(), hold:false, backups:null, nextTag:'', lastCheck:0};
let rev = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dq = fn => (dd.q = dd.q.then(fn, fn).catch(() => {}));
function fdt(iso){ if (!iso) return '–'; const d = new Date(iso); return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

    ok:['Drive: gesichert' + (hm ? ' ' + hm : ''), 'Alles ist in Google Drive gesichert'],
    pending:['Drive: ungesichert', 'Änderungen sind noch nicht in Google Drive gespeichert'],
    auth:['Drive: anmelden', 'Anmeldung bei Google nötig. Änderungen sind nur lokal gespeichert.'],
    conflict:['Drive: Konflikt', 'Drive und dieser Browser haben unterschiedliche Stände. Bitte klären.'],
    error:['Drive: Fehler', 'Fehler bei Google Drive'],
    unavail:['Drive: nur über https', 'Die Google-Anmeldung funktioniert nicht bei einer lokal geöffneten Datei.']
  })[dd.state];
}
function updatePill(){
  const b = $('#drivepill'); if (!b) return;
