<title>Mind-Map-Tafelbild-Generator</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1f242e; --line:#2a303c;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#6366f1; --accent2:#4f46e5;
    --green:#22c55e; --red:#ef4444; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit}
  .app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

  header{position:sticky;top:0;z-index:5;background:var(--bg);
    display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;flex:1;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--green)} .dot.busy{background:#f59e0b}
  .icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer}

  main{flex:1;padding:14px 16px 90px}
  .muted{color:var(--muted)} .center{text-align:center}

  .signin{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:60px 24px;text-align:center}
  .signin p{color:var(--muted);max-width:320px;line-height:1.5}
  .btn-primary{background:var(--accent2);border:none;color:#fff;border-radius:12px;
    padding:13px 22px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary:active{background:var(--accent)}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:18px 2px 8px}
  .card{background:#ffe0cc;border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .card .body{flex:1;min-width:0}
  .card .title{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;color:#000}
  .card .sub{font-size:12px;color:#000;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card.done .title{text-decoration:line-through;color:var(--muted)}
  .badge{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px}
  .badge.cal{color:#a5b4fc;border-color:#3b3f63}

  .check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);
    flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent}
  .check.on{background:var(--green);border-color:var(--green)}
  .check svg{width:15px;height:15px;display:none} .check.on svg{display:block}

  .row-actions{display:flex;gap:6px}
  .mini{background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 6px}
  .mini:active{color:var(--text)}

  .streak{display:flex;gap:4px;margin-top:6px}
  .streak .d{width:16px;height:16px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
  .streak .d.on{background:var(--green);border-color:var(--green)}

  .fab{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(var(--navh,96px) + 14px);width:54px;height:54px;border-radius:50%;
    background:var(--accent2);color:#fff;border:none;font-size:28px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:6}
  .fab-quick{position:fixed;right:calc(50% - 280px + 16px);bottom:calc(var(--navh,96px) + 78px);width:46px;height:46px;border-radius:50%;
    background:var(--green);color:#fff;border:none;font-size:20px;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:6}
  @media(max-width:592px){.fab{right:16px}.fab-quick{right:20px}}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);
    border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--muted);padding:9px 1px 11px;
    font-size:10.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button.active{color:var(--text)}
  nav .nico{font-size:19px;line-height:1}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;
    align-items:flex-end;justify-content:center}
  .modal{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 14px;font-size:17px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface2);
    border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px}
  textarea{resize:vertical;min-height:54px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:90px;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
  .seg button.sel{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:16px;
    background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .switch{width:46px;height:27px;border-radius:14px;background:var(--line);border:none;position:relative;cursor:pointer;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--green)} .switch.on::after{left:22px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  .modal-actions .btn-primary{flex:1}
  .btn-ghost{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:13px;font-size:15px;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  a{color:#a5b4fc}
  .pie-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0 8px}
  .pie-pct{font-size:30px;font-weight:700;margin-top:8px}
  .pie-sub{color:var(--muted);font-size:13px}
  .legend{display:flex;gap:20px;margin-top:10px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .legend i.green{background:var(--green)} .legend i.red{background:var(--red)}
  .note-detail{margin-top:8px;cursor:pointer}
  .note-detail summary{font-size:13px;color:var(--muted);user-select:none}
  .note-detail[open] summary{color:var(--text)}
  .note-text{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
  .toast{position:fixed;left:50%;bottom:calc(var(--navh,96px) + 16px);transform:translateX(-50%);background:#000;
    border:1px solid var(--line);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}

  /* ================= SCHWARZ / METALLICGRAU THEME + GAMIFICATION ================= */
  :root{
    --bg:#050506; --surface:#0e0f12; --surface2:#17191d; --line:#2c3037;
    --text:#e8eaee; --muted:#8c929d; --accent:#b7bdc8; --accent2:#454b55;
    --green:#34d27b; --red:#ff5a5f; --amber:#ffb020; --steel:#8fa0b8;
    --metal:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
            linear-gradient(145deg,#2d3037 0%,#191b1f 48%,#25282d 100%);
    --metal-hi:linear-gradient(145deg,#555b66 0%,#2c3037 52%,#444a54 100%);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  }
  html{background:#050506}
  body{background:radial-gradient(130% 55% at 50% 0%,#17191d 0%,#050506 62%) no-repeat #050506;min-height:100vh}
  header{background:rgba(5,5,6,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid #2a2d33}
  header h1{letter-spacing:.04em;text-transform:uppercase;font-size:16px}
  main{padding:14px 14px calc(var(--navh,96px) + 16px)}
  a{color:#aab6c8}
  .badge.cal{color:#aab6c8;border-color:#3b4452}
  .icon-btn{background:var(--metal-hi);border-color:#4a505a;color:#fff}

  .section-title{display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.16em;color:var(--muted);margin:22px 2px 10px}
  .section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#3a3f47,transparent)}

  .card{border:1px solid #30343b;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 10px rgba(0,0,0,.55)}
  .card:not([data-projcard]){background:var(--metal)!important}
  .card:not([data-projcard]) .title{color:var(--text)!important}
  .card:not([data-projcard]) .sub{color:var(--muted)}
  .card .note-text,.card .note-detail summary{color:var(--muted)!important}
  .card .note-detail[open] summary{color:var(--text)!important}
  .card .sub[style*="color:#000"],.card .sub[style*="color:#555"],.card [style*="color:#666"]{color:var(--muted)!important}
  .card.done .title{color:#6d737e!important}
  .card[style*="background:#ef4444"]{box-shadow:inset 0 0 0 1px rgba(255,90,95,.45),0 0 16px rgba(255,90,95,.22)}
  .card .body{min-width:0}

  .check{width:30px;height:30px;border-radius:9px;border:2px solid #5b6270;background:rgba(0,0,0,.4)}
  .check.on{background:linear-gradient(145deg,#4be08d,#1fa75c);border-color:#4be08d;box-shadow:0 0 12px rgba(52,210,123,.45)}
  .check:active{transform:scale(.92)}
  .mini{color:var(--accent);background:rgba(255,255,255,.045);border:1px solid #30343b;border-radius:8px;
    padding:7px 9px;min-height:34px;font-size:12.5px}
  .mini:active{background:rgba(255,255,255,.12);color:#fff}
  .streak .d{background:#101216}
  .streak .d.on{background:var(--amber);border-color:var(--amber);box-shadow:0 0 6px rgba(255,176,32,.5)}

  .btn-primary,.seg button.sel{background:var(--metal-hi);border:1px solid #7a818d;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 8px rgba(0,0,0,.5)}
  .btn-primary:active{filter:brightness(1.25);background:var(--metal-hi)}
  .btn-ghost,.seg button{background:#14161a;border-color:#30343b}
  .fab{background:var(--metal-hi);border:1px solid #8a919d;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25)}
  .fab-quick{background:linear-gradient(145deg,#ffd166,#e08a00);color:#1a1000;border:1px solid #ffe0a0;
    box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 14px rgba(255,176,32,.3)}
  .modal{background:linear-gradient(180deg,#1b1d21,#0f1013);border-top:1px solid #3a3f47}
  input[type=text],input[type=date],select,textarea{background:#101216;border-color:#30343b}

  nav{background:linear-gradient(180deg,#1c1e23,#0a0b0d);border-top:1px solid #3a3f47;
    flex-wrap:wrap;justify-content:center;overflow:visible}
  nav button{flex:0 0 calc(100% / 6);min-width:0;max-width:calc(100% / 6);padding:7px 2px 7px;position:relative;
    gap:2px;font-size:10px;white-space:nowrap}
  nav button .nico{font-size:17px}
  nav button.active{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.09),transparent)}
  nav button.active::before{content:"";position:absolute;top:0;left:18%;right:18%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#e8eaee,transparent);box-shadow:0 0 8px rgba(232,234,238,.7)}

  .pie-pct{font-family:var(--mono);font-size:24px;margin-top:4px}
  .toast{background:#1a1c20;border-color:#4a505a}

  /* ---- HUD ---- */
  .lvpill{font:700 11px var(--mono);letter-spacing:.1em;padding:5px 9px;border-radius:999px;border:1px solid #5b6270;
    background:var(--metal-hi);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
  .hud{position:relative;border:1px solid #3d424b;border-radius:18px;padding:16px;margin-bottom:4px;overflow:hidden;
    background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.11),transparent 55%),var(--metal);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 28px rgba(0,0,0,.65)}
  .hud::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;transform:skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);animation:sheen 7s ease-in-out infinite}
  @keyframes sheen{0%,70%{left:-80px}100%{left:120%}}
  .hud-top{display:flex;align-items:center;gap:16px}
  .ring{position:relative;width:98px;height:98px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle.prog{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 4px rgba(220,226,236,.55))}
  .ring .lv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .ring .lv small{font-size:9px;letter-spacing:.22em;color:var(--muted);margin-bottom:3px}
  .ring .lv b{font:800 32px/1 var(--mono);color:#fff;text-shadow:0 0 12px rgba(255,255,255,.35)}
  .hud-info{flex:1;min-width:0}
  .rank{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .rankname{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:2px;
    background:linear-gradient(180deg,#ffffff,#9ea6b3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .xpnum{font:600 13px var(--mono);color:var(--accent);margin-top:3px}
  .bar{height:11px;border-radius:7px;background:#08090b;border:1px solid #2a2e35;overflow:hidden;margin-top:9px;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
  .bar>i{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(180deg,#f6f8fb,#9aa2af 55%,#d3d8e0);box-shadow:0 0 10px rgba(220,226,236,.45)}
  .bar.quest>i{background:linear-gradient(180deg,#ffe08a,#ff9f1c);box-shadow:0 0 10px rgba(255,176,32,.5)}
  .bar.quest.done>i{background:linear-gradient(180deg,#7bf0ad,#1fa75c);box-shadow:0 0 12px rgba(52,210,123,.6)}
  .hud-sub{font-size:11px;color:var(--muted);margin-top:6px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .tile{background:rgba(0,0,0,.38);border:1px solid #2c3037;border-radius:12px;padding:10px 4px 9px;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .tile b{display:block;font:800 21px var(--mono);color:#fff;line-height:1.1}
  .tile b.pos{color:var(--green)} .tile b.neg{color:var(--red)} .tile b.fire{color:var(--amber);text-shadow:0 0 10px rgba(255,176,32,.45)}
  .tile span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .quest{margin-top:14px}
  .quest-head{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .quest-head b{font:700 13px var(--mono);color:#fff;letter-spacing:.04em}
  .quest-done{color:var(--green)!important}

  .trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .troph{background:var(--metal);border:1px solid #30343b;border-radius:12px;padding:12px 6px 10px;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .troph .ic{font-size:28px;line-height:1.1}
  .troph .nm{font-size:11.5px;font-weight:700;margin-top:5px;color:var(--text)}
  .troph .ds{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.25}
  .troph.lock{opacity:.38;filter:grayscale(1)}

  .xpfloat{position:fixed;left:50%;bottom:calc(var(--navh,96px) + 60px);z-index:40;pointer-events:none;font:800 24px var(--mono);color:#fff;
    text-shadow:0 0 14px rgba(255,255,255,.65),0 2px 0 #000;white-space:nowrap;animation:xpup 1.2s ease-out forwards}
  @keyframes xpup{0%{opacity:0;transform:translate(-50%,12px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.12)}
    100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
  .levelup{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;background:rgba(0,0,0,.86);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:fadein .25s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .levelup small{font-size:12px;letter-spacing:.4em;color:var(--muted)}
  .levelup .big{font:800 clamp(56px,22vw,96px)/1 var(--mono);color:#fff;text-shadow:0 0 30px rgba(255,255,255,.5);
    animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .levelup .rk{font-size:22px;font-weight:800;letter-spacing:.08em;background:linear-gradient(180deg,#fff,#9ea6b3);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .levelup .tap{margin-top:22px;font-size:11px;letter-spacing:.2em;color:#6d737e}
  .rankchip{flex:none;min-width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font:800 13px var(--mono)}

  @media(max-width:480px){
    .card:has(.row-actions > :nth-child(3)){flex-wrap:wrap}
    .card .row-actions:has(> :nth-child(3)){flex:1 0 100%;justify-content:flex-end}
    input[type=text],input[type=date],select,textarea{font-size:16px}
    .hud{padding:14px}
    .ring{width:88px;height:88px}
    .ring .lv b{font-size:28px}
    .rankname{font-size:20px}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* ================= LAPTOP / BREITER BILDSCHIRM: Navigation als Seitenleiste links ================= */
  @media(min-width:900px){
    :root{--sbw:232px}
    body:has(#nav[style*="flex"]){padding-left:var(--sbw)}
    .app{max-width:780px}
    main{padding:18px 20px 40px}
    nav{left:0;top:0;bottom:0;right:auto;width:var(--sbw);max-width:none;margin:0;
      flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;gap:2px;overflow-y:auto;
      padding:18px 10px calc(18px + env(safe-area-inset-bottom));
      background:linear-gradient(90deg,#1c1e23,#0a0b0d);border-top:0;border-right:1px solid #3a3f47}
    nav::before{content:"ToDo";display:block;padding:4px 14px 16px;font:800 13px var(--mono);letter-spacing:.3em;color:var(--muted)}
    nav button{flex:none;width:100%;max-width:none;flex-direction:row;justify-content:flex-start;gap:12px;
      padding:11px 14px;font-size:14px;border-radius:10px;text-align:left}
    nav button .nico{font-size:18px;width:24px;text-align:center}
    nav button:hover{background:rgba(255,255,255,.06);color:#fff}
    nav button.active{background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.03));font-weight:600}
    nav button.active::before{top:22%;bottom:22%;left:0;right:auto;width:3px;height:auto;
      background:linear-gradient(180deg,transparent,#e8eaee,transparent)}
    .fab{right:max(20px,calc(50% - 470px));bottom:24px}
    .fab-quick{left:calc(var(--sbw) / 2 - 23px);right:auto;bottom:24px;z-index:8}
    .toast,.xpfloat{left:calc(50% + var(--sbw) / 2)}
    .modal-bg{padding-left:var(--sbw);align-items:center}
    .modal{border-radius:18px;max-width:520px}
  }

  /* ================= ARBEITSBEREICH ================= */
  .ws-card{border:1px solid #3d424b;border-radius:16px;padding:12px;margin-bottom:12px;
    background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.07),transparent 55%),var(--metal);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.55)}
  .ws-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .ws-title{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ws-caret{color:var(--muted);font-size:12px;flex:none}
  .ws-prev{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
  .ws-prev li{padding:6px 0 6px 22px;position:relative;border-top:1px solid rgba(255,255,255,.06)}
  .ws-prev li::before{content:"";position:absolute;left:3px;top:10px;width:9px;height:9px;border-radius:3px;border:2px solid #7b8494}
  .ws-prev li.first{font-weight:600}
  .ws-prev li.first::before{background:var(--amber);border-color:var(--amber)}
  .ws-prev.plain li::before{display:none}
  .ws-prev.plain li{padding-left:2px}
  .ws-meta{font-size:11.5px;color:var(--muted);margin:6px 0 2px}
  .ws-status{color:var(--muted)}
  .ws-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ws-chip{background:#14161a;border:1px solid #30343b;color:var(--text);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ws-chip.sel{background:var(--metal-hi);border-color:#7a818d;color:#fff}
  .ws-chip.new{color:var(--amber);border-style:dashed}
  .ws-toolbar{display:flex;gap:6px;align-items:center;margin-bottom:2px}
  .ws-tb{background:#14161a;border:1px solid #30343b;color:var(--text);border-radius:10px;padding:8px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .ws-tb.on{border-color:var(--amber);color:var(--amber)}
  .ws-in{background:#101216;border:1px solid #30343b;color:var(--text);border-radius:8px;padding:7px 9px;font-size:14px;font-family:inherit;min-width:0}
  .ws-in:focus{outline:none;border-color:#7a818d;background:#15181d}
  .ws-doctitle{flex:1;font-weight:700;font-size:16px}
  .ws-blocks{margin-top:8px}
  .ws-block{display:flex;gap:6px;align-items:flex-start;padding:8px 4px 8px 0;margin-bottom:6px;border-radius:10px;border:1px solid transparent}
  .ws-block:hover{border-color:#2c3037}
  .ws-bbody{flex:1;min-width:0}
  .ws-handle{flex:none;cursor:grab;color:#6d737e;user-select:none;font-size:15px;line-height:1;padding:7px 3px;touch-action:none}
  .ws-handle:active{cursor:grabbing}
  .ws-handle:hover{color:#fff}
  .ws-handle.sm{font-size:14px;padding:6px 2px}
  .ws-x,.ws-mini{background:transparent;border:none;color:#6d737e;cursor:pointer;font-size:13px;padding:5px 6px;border-radius:6px;flex:none}
  .ws-x:hover,.ws-mini:hover{color:#fff;background:rgba(255,255,255,.08)}
  .ws-ta{width:100%;resize:none;overflow:hidden;line-height:1.45;min-height:36px}
  .ws-h{width:100%;font-size:17px;font-weight:700}
  .ws-tree{list-style:none;margin:0;padding:0}
  .ws-sub{margin-left:18px;border-left:1px solid #2c3037;padding-left:6px}
  .ws-nrow{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:2px 0;border-radius:8px}
  .ws-nin{flex:1 1 220px;min-width:0;padding:6px 8px;font-size:14px}
  .ws-nta{resize:none;overflow:hidden;line-height:1.35;min-height:34px;font-family:inherit;overflow-wrap:anywhere;display:block}
  .ws-nright{display:contents}
  .ws-node.hid > .ws-nrow{opacity:.5}
  .ws-eye{opacity:.7}
  .ws-fbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .ws-fhint{font:600 11px var(--mono);color:var(--muted)}
  .ws-fpanel{background:#101216;border:1px solid #2c3037;border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
  .ws-frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ws-fl{flex:0 0 84px;font:600 11px var(--mono);color:var(--muted)}
  .ws-frow .ws-in{flex:1 1 160px;padding:8px;font-size:16px}
  .ws-fc{background:#14161a;border:1px solid #30343b;color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .ws-fc.on{background:var(--metal-hi);border-color:#7a818d;color:#fff}
  .ws-node.done > .ws-nrow .ws-nin{text-decoration:line-through;color:#6d737e}
  .ws-tog{flex:none;width:22px;background:none;border:none;color:#9aa3b2;cursor:pointer;font-size:14px;padding:4px 0}
  .ws-chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #5b6270;background:rgba(0,0,0,.4);color:#04210f;font-size:13px;font-weight:800;cursor:pointer;padding:0;line-height:1}
  .ws-chk.on{background:linear-gradient(145deg,#4be08d,#1fa75c);border-color:#4be08d}
  .ws-cnt,.ws-hcnt{flex:none;font:600 11px var(--mono);color:var(--muted);background:#101216;border:1px solid #2c3037;border-radius:999px;padding:2px 7px}
  .ws-date{flex:none;background:#101216;border:1px solid #3a3f47;color:#c9d0db;border-radius:999px;padding:3px 8px;font:600 11px var(--mono);cursor:pointer;white-space:nowrap}
  .ws-date:hover{border-color:#7a818d;color:#fff}
  .ws-date.over{border-color:var(--red);color:var(--red)}
  .ws-node.done > .ws-nrow .ws-date{opacity:.5}
  .ws-lnk{flex:none;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.45);color:var(--amber);border-radius:8px;padding:2px 6px;font-size:12px;cursor:pointer;white-space:nowrap}
  .ws-lnk:hover{background:rgba(255,176,32,.22)}
  .ws-pd{font:600 11px var(--mono);color:var(--muted);white-space:nowrap}
  .ws-pd.over{color:var(--red)}
  .g-bar.meta{background:#f59e0b;color:#1a1200}
  .g-bar.agg{opacity:.55}
  .g-bar.late{outline:2px solid var(--red);outline-offset:-1px}
  .g-metarow{background:rgba(245,158,11,.07)}
  .g-metarow .g-title{font-weight:700}

<script>
"use strict";
/* Eigener Speicher im Browser: Schlüssel mit Präfix, damit die ToDo-App (gleiche Domain) nicht gestört wird */
const mmLS = {
  getItem(k){ try{ return localStorage.getItem("mm:"+k); }catch(e){ return null; } },
  setItem(k,v){ localStorage.setItem("mm:"+k, v); },
  removeItem(k){ try{ localStorage.removeItem("mm:"+k); }catch(e){} }
};
let view = "notes";                       // "notes" = Reiter 1 ist sichtbar (wird von den Original-Funktionen abgefragt)
let wsTrash = [];
const wsTrashAdd = new Set(), wsTrashGone = new Set();

const $ = (id) => document.getElementById(id);
const main = $("main");
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayKey(){ return dateKey(new Date()); }
function dateKey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDate(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function diffDays(a,b){ return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200); }
/* ============ ARBEITSBEREICH (ehemals Notizen-Reiter) ============ */
/* Dokumente aus Blöcken (Text, Überschrift, Gliederung, Tabelle), Fokus-Notiz in der Heute-Ansicht,
   Gantt-Ansicht direkt aus den Punkten (Start, Laufzeit, Deadline, Meta-Projekt).
   Speicherung: Tabellenblatt "Workspace" in der ToDo-Tabelle, JSON auf mehrere Zellen verteilt (Zellgrenze 50000 Zeichen). */
const WS_TAB = "Workspace";
const WS_CHUNK = 40000;
const WS_MAXROWS = 2000;

/* WS-PURE-START */
let _wsCnt = 0;
function wsId(){ return Date.now().toString(36) + (++_wsCnt).toString(36) + Math.random().toString(36).slice(2,5); }
function wsNewNode(text){ return {id:wsId(), text:text||"", done:false, collapsed:false, date:"", ld:"", dur:0, dl:"", meta:false, hid:false, tag:"", link:null, aopen:false, att:[], children:[]}; }
/* Anhang an einem Punkt: Text (auch als Notiz nutzbar) oder Tabelle; trägt wie ein Punkt Datum, Erledigt-Haken und Verknüpfung */
function wsNewAtt(type){
  const a = {id:wsId(), type:type, title:"", done:false, date:"", link:null, tag:""};
  if(type==="table"){ a.cols = ["Spalte 1","Spalte 2"]; a.rows = [["",""],["",""]]; }
  else if(type==="link") a.url = "";
  else if(type==="file"){ a.fileId = ""; a.name = ""; a.mime = ""; a.size = 0; }
  else a.text = "";
  return a;
}
function wsIsAtt(x){ return !!x && !Array.isArray(x.children) && typeof x.done==="boolean" && (x.type==="text" || x.type==="table" || x.type==="link" || x.type==="file"); }   // Blöcke haben kein done
function wsTitleOf(x){
  if(!x) return "";
  if(!wsIsAtt(x)) return (x.text||"").trim();
  if((x.title||"").trim()) return x.title.trim();
  if(x.type==="link") return (x.url||"").trim().slice(0,80);
  if(x.type==="file") return (x.name||"").trim().slice(0,80);
  return x.type==="text" ? (x.text||"").trim().split("\n")[0].slice(0,80) : "";
}
function wsSetTitle(x, v){ if(wsIsAtt(x)) x.title = v; else x.text = v; }
function wsNormAtt(a){
  if(!a || typeof a!=="object" || (a.type!=="text" && a.type!=="table" && a.type!=="link" && a.type!=="file")) return null;
  const o = {id:a.id||wsId(), type:a.type, title:String(a.title||""), done:!!a.done, date:wsIsDate(a.date)?a.date:"", link:wsNormLink(a.link), tag:wsNormTag(a.tag)};
  if(a.type==="text") o.text = String(a.text||"");
  else if(a.type==="link") o.url = String(a.url||"").trim().slice(0,2000);
  else if(a.type==="file"){ o.fileId = String(a.fileId||"").slice(0,200); o.name = String(a.name||"").slice(0,300); o.mime = String(a.mime||"").slice(0,120); o.size = Math.max(0, Math.floor(+a.size||0)); }
  else{
    o.cols = (Array.isArray(a.cols) && a.cols.length) ? a.cols.map(String) : ["Spalte 1"];
    o.rows = (Array.isArray(a.rows)?a.rows:[]).map(r=>{ const row=(Array.isArray(r)?r:[]).map(String); while(row.length<o.cols.length) row.push(""); return row.slice(0,o.cols.length); });
  }
  return o;
}
function wsAddDays(d, k){
  const t = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)+k);
  return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
}
/* Tag, an dem das verknüpfte ToDo / Tages-Ziel gilt: bei gesetzter Deadline deren Tag (ld), sonst der Start */
function wsLinkDay(x){ return x.ld || x.date || ""; }
function wsSetLinkDay(x, d){ if(x.ld || x.dl) x.ld = d; else x.date = d; }
/* gewünschter Tag der Verknüpfung: neu -> Deadline, sonst Start, sonst heute; bestehend -> folgt einer neuen/geänderten Deadline, ohne Deadline dem Start */
function wsPlanDay(n, date0, newDl, isLinked, today){
  if(!isLinked) return newDl || date0 || today;
  if(newDl) return newDl!==(n.dl||"") ? newDl : wsLinkDay(n);
  return date0;
}
/* Zeitraum eines Punktes: Start + Laufzeit (Kalendertage) ergibt das Ende; ohne Start rückwärts von der Deadline */
function wsSpan(n){
  const s = n.date||"", dl = n.dl||"", dur = n.dur>0 ? Math.floor(n.dur) : 0;
  if(s && dur) return {start:s, end:wsAddDays(s,dur-1), dl};
  if(s) return {start:s, end:(dl && dl>=s) ? dl : s, dl};
  if(dl && dur) return {start:wsAddDays(dl,-(dur-1)), end:dl, dl};
  if(dl) return {start:dl, end:dl, dl};
  return null;
}
function wsAllNodes(doc){
  const out = [];
  const walk = (items)=>items.forEach(n=>{ out.push(n); walk(n.children); });
  doc.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items); });
  return out;
}
/* Punkt oder Anhang anhand der ID */
function wsFindAny(doc, id){
  const r = wsFindNode(doc, id); if(r) return r.node;
  for(const n of wsAllNodes(doc)){ const a = n.att.find(x=>x.id===id); if(a) return a; }
  return null;
}
function wsAttOwner(doc, aid){ return wsAllNodes(doc).find(n=>n.att.some(a=>a.id===aid)) || null; }
function wsIsDate(s){ return typeof s==="string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
/* link: Verknüpfung mit einem ToDo (Sheet-Zeile) oder Tages-Ziel (Google Task); evId/calId: vom Punkt selbst angelegter Kalendertermin (nur Ziele) */
function wsNormLink(l){
  if(!l || typeof l!=="object") return null;
  if((l.kind!=="todo" && l.kind!=="goal") || !l.ref) return null;
  return {kind:l.kind, ref:String(l.ref), cal:!!l.cal, evId:String(l.evId||""), calId:String(l.calId||"")};
}
function wsShortDate(d){
  if(!wsIsDate(d)) return "";
  const dt = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
  return ["So","Mo","Di","Mi","Do","Fr","Sa"][dt.getDay()] + " " + d.slice(8,10) + "." + d.slice(5,7) + ".";
}
function wsCollectLinkedNodes(list, out){
  out = out || [];
  (list||[]).forEach(n=>{ if(n.link) out.push(n); (n.att||[]).forEach(a=>{ if(a.link) out.push(a); }); wsCollectLinkedNodes(n.children, out); });
  return out;
}
function wsDocLinkedNodes(doc){
  const out = [];
  doc.blocks.forEach(b=>{ if(b.type==="outline") wsCollectLinkedNodes(b.items, out); });
  return out;
}
function wsFindByLink(docs, kind, ref){
  for(const doc of docs){
    for(const n of wsDocLinkedNodes(doc)){
      if(n.link.kind===kind && n.link.ref===ref) return {doc, node:n};
    }
  }
  return null;
}
function wsNewDoc(title){
  const now = new Date().toISOString();
  return {id:wsId(), title:title||"Neues Dokument", pinned:false, tag:"", inbox:false, seen:[], createdAt:now, updatedAt:now, blocks:[]};
}
function wsNewBlock(type){
  if(type==="text") return {id:wsId(), type:"text", text:"", tag:""};
  if(type==="heading") return {id:wsId(), type:"heading", text:"", tag:"", collapsed:false};
  if(type==="outline") return {id:wsId(), type:"outline", items:[wsNewNode("")], tag:""};
  if(type==="table") return {id:wsId(), type:"table", cols:["Spalte 1","Spalte 2","Spalte 3"], rows:[["","",""],["","",""]], tag:""};
  return null;
}
function wsNormNodes(a){
  return (Array.isArray(a)?a:[]).filter(n=>n && typeof n==="object").map(n=>({
    id:n.id||wsId(), text:String(n.text||""), done:!!n.done, collapsed:!!n.collapsed,
    date:wsIsDate(n.date)?n.date:"", ld:wsIsDate(n.ld)?n.ld:"", dur:(n.dur>0 && n.dur<=3660)?Math.floor(n.dur):0, dl:wsIsDate(n.dl)?n.dl:"", meta:!!n.meta, hid:!!n.hid, tag:wsNormTag(n.tag),
    link:wsNormLink(n.link), aopen:!!n.aopen, att:(Array.isArray(n.att)?n.att:[]).map(wsNormAtt).filter(Boolean), children:wsNormNodes(n.children)
  }));
}
function wsNormalizeDocs(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(d=>d && typeof d==="object").map(d=>{
    const doc = {id:d.id||wsId(), title:String(d.title||""), pinned:!!d.pinned, tag:wsNormTag(d.tag),
      inbox:!!d.inbox, seen:(Array.isArray(d.seen)?d.seen:[]).filter(k=>typeof k==="string").slice(-3000),
      createdAt:d.createdAt||new Date().toISOString(), updatedAt:d.updatedAt||d.createdAt||new Date().toISOString(), blocks:[]};
    (Array.isArray(d.blocks)?d.blocks:[]).forEach(b=>{
      if(!b || typeof b!=="object") return;
      const id = b.id||wsId();
      if(b.type==="text") doc.blocks.push({id, type:b.type, text:String(b.text||""), tag:wsNormTag(b.tag)});
      else if(b.type==="heading") doc.blocks.push({id, type:b.type, text:String(b.text||""), tag:wsNormTag(b.tag), collapsed:!!b.collapsed});
      else if(b.type==="outline") doc.blocks.push({id, type:"outline", items:wsNormNodes(b.items), tag:wsNormTag(b.tag)});
      else if(b.type==="table"){
        const cols = (Array.isArray(b.cols) && b.cols.length) ? b.cols.map(String) : ["Spalte 1"];
        const rows = (Array.isArray(b.rows)?b.rows:[]).map(r=>{
          const row = (Array.isArray(r)?r:[]).map(String);
          while(row.length<cols.length) row.push("");
          return row.slice(0, cols.length);
        });
        doc.blocks.push({id, type:"table", cols, rows, tag:wsNormTag(b.tag)});
      }
    });
    return doc;
  });
}

/* ---- Speicherformat: JSON in Stücken zu je WS_CHUNK Zeichen ---- */
function wsSerialize(docs, trash){
  const o = {v:1, savedAt:new Date().toISOString(), docs};
  if(trash && trash.length) o.trash = trash;
  return JSON.stringify(o);
}
function wsParse(text){
  if(!text || !text.trim()) return [];
  const data = JSON.parse(text);               // Fehler absichtlich nicht abfangen: kaputte Daten dürfen nie als "leer" gelten
  if(Array.isArray(data)) return wsNormalizeDocs(data);
  if(data && Array.isArray(data.docs)) return wsNormalizeDocs(data.docs);
  throw new Error("Unbekanntes Format im Tabellenblatt Workspace");
}
function wsToChunks(json){
  const out = []; let i = 0;
  while(i < json.length){
    let end = Math.min(i + WS_CHUNK, json.length);
    if(end < json.length){
      // keine Aufteilung mitten in einem Surrogatpaar und nicht neben einem Leerzeichen (Zellen könnten Leerraum am Rand verlieren)
      const c = json.charCodeAt(end-1);
      if(c>=0xD800 && c<=0xDBFF) end--;
      while(end>i+1 && (json[end-1]===" " || json[end]===" ")) end--;
    }
    out.push(json.slice(i, end)); i = end;
  }
  if(!out.length) out.push("[]");
  return out;
}
/* ---- Papierkorb: gelöschte Einträge bleiben 3 Tage erhalten ---- */
const WS_TRASH_MS = 3*24*3600*1000;
function wsTrashItem(kind, doc, obj, where){
  let label = "";
  if(kind==="node") label = obj.text || "(leerer Punkt)";
  else if(kind==="att") label = obj.title || obj.name || obj.url || String(obj.text||"").split("\n")[0] || "Anhang";
  else if(kind==="block") label = obj.type==="heading" ? (obj.text||"(Überschrift)") : obj.type==="outline" ? "Gliederung mit "+obj.items.length+" Punkten" : obj.type==="table" ? "Tabelle" : (String(obj.text||"").split("\n")[0] || "(Notiz)");
  else label = obj.title || "(Dokument)";
  return {id:wsId(), kind, deletedAt:new Date().toISOString(), docId:doc?doc.id:obj.id, docTitle:doc?(doc.title||""):(obj.title||""), label:String(label).slice(0,80), where:where||{}, data:JSON.parse(JSON.stringify(obj))};
}
function wsTrashNorm(arr){
  const out = [];
  (Array.isArray(arr)?arr:[]).forEach(i=>{
    if(!i || typeof i!=="object" || !i.id || !["node","att","block","doc"].includes(i.kind) || !i.data || isNaN(Date.parse(i.deletedAt))) return;
    let data = null;
    if(i.kind==="node") data = wsNormNodes([i.data])[0];
    else if(i.kind==="att") data = wsNormAtt(i.data);
    else if(i.kind==="block"){ const d = wsNormalizeDocs([{blocks:[i.data]}])[0]; data = d && d.blocks[0]; }
    else data = wsNormalizeDocs([i.data])[0];
    if(!data) return;
    const w = i.where && typeof i.where==="object" ? i.where : {};
    out.push({id:String(i.id), kind:i.kind, deletedAt:String(i.deletedAt), docId:String(i.docId||""), docTitle:String(i.docTitle||""), label:String(i.label||"").slice(0,80),
      where:{blockId:String(w.blockId||""), parentId:String(w.parentId||""), ownerId:String(w.ownerId||""), index:Math.max(0, parseInt(w.index,10)||0)}, data});
  });
  return out;
}
function wsParseTrash(text){
  if(!text || !text.trim()) return [];
  const data = JSON.parse(text);
  return (data && !Array.isArray(data) && Array.isArray(data.trash)) ? wsTrashNorm(data.trash) : [];
}
function wsTrashLive(items, now){ return items.filter(i=>Date.parse(i.deletedAt)+WS_TRASH_MS > now); }
/* Abgleich mit dem Serverstand: Server gewinnt; lokal neu Hinzugekommene (adds) bleiben, lokal Entfernte (gone) bleiben weg; Abgelaufenes fällt heraus */
function wsMergeTrash(local, server, adds, gone, now){
  const out = [], seen = new Set();
  server.forEach(i=>{ if(!gone.has(i.id) && !seen.has(i.id)){ out.push(i); seen.add(i.id); } });
  local.forEach(i=>{ if(!seen.has(i.id) && adds.has(i.id)){ out.push(i); seen.add(i.id); } });
  return wsTrashLive(out, now).sort((a,b)=>b.deletedAt.localeCompare(a.deletedAt));
}
function wsStripLinks(n){ n.link = null; (n.att||[]).forEach(a=>{ a.link = null; }); (n.children||[]).forEach(wsStripLinks); }
/* Eintrag zurücklegen. Verknüpfungen mit ToDos/Zielen werden dabei gelöst (sie wurden beim Löschen freigegeben). */
function wsRestore(docs, item){
  const data = JSON.parse(JSON.stringify(item.data)), w = item.where || {};
  if(item.kind==="doc"){
    if(docs.some(d=>d.id===data.id)) return {ok:false, msg:"Ein Dokument mit dieser Kennung gibt es schon."};
    data.blocks.forEach(b=>{ if(b.type==="outline") b.items.forEach(wsStripLinks); });
    docs.push(data); return {ok:true, doc:data, docId:data.id};
  }
  const doc = docs.find(d=>d.id===item.docId);
  if(!doc) return {ok:false, msg:"Das Dokument gibt es nicht mehr. Stelle zuerst das Dokument wieder her."};
  if(item.kind==="block"){
    if(doc.blocks.some(b=>b.id===data.id)) return {ok:false, msg:"Der Block ist schon vorhanden."};
    if(data.type==="outline") data.items.forEach(wsStripLinks);
    doc.blocks.splice(Math.min(w.index||0, doc.blocks.length), 0, data); return {ok:true, doc, docId:doc.id};
  }
  if(item.kind==="att"){
    if(wsFindAny(doc, data.id)) return {ok:false, msg:"Der Anhang ist schon vorhanden."};
    const ow = w.ownerId ? wsFindNode(doc, w.ownerId) : null;
    if(!ow) return {ok:false, msg:"Der Punkt, an dem der Anhang hing, existiert nicht mehr."};
    data.link = null; ow.node.att.splice(Math.min(w.index||0, ow.node.att.length), 0, data); ow.node.aopen = true;
    return {ok:true, doc, docId:doc.id};
  }
  if(wsFindNode(doc, data.id)) return {ok:false, msg:"Der Punkt ist schon vorhanden."};
  wsStripLinks(data);
  const par = w.parentId ? wsFindNode(doc, w.parentId) : null;
  if(par){ par.node.children.splice(Math.min(w.index||0, par.node.children.length), 0, data); par.node.collapsed = false; return {ok:true, doc, docId:doc.id}; }
  let blk = w.blockId ? doc.blocks.find(b=>b.id===w.blockId && b.type==="outline") : null;
  if(!blk) blk = doc.blocks.find(b=>b.type==="outline");
  if(!blk){ blk = {id:wsId(), type:"outline", items:[], tag:""}; doc.blocks.push(blk); }
  blk.items.splice(Math.min(w.index||0, blk.items.length), 0, data);
  return {ok:true, doc, docId:doc.id};
}
function wsFromChunks(rows){ return (rows||[]).map(r=>(r && r[0]!==undefined) ? r[0] : "").join(""); }

/* ---- Abgleich mit dem Serverstand (server-first, nur lokal geänderte Dokumente gewinnen) ---- */
function wsMergeDocs(local, server, dirty, deleted){
  const sMap = new Map(server.map(d=>[d.id, d]));
  const out = []; const seen = new Set();
  local.forEach(d=>{
    if(dirty.has(d.id)){ out.push(d); seen.add(d.id); }
    else if(sMap.has(d.id)){ out.push(sMap.get(d.id)); seen.add(d.id); }
    // weder lokal geändert noch auf dem Server: anderswo gelöscht, also weglassen
  });
  server.forEach(d=>{ if(!seen.has(d.id) && !deleted.has(d.id)) out.push(d); });
  return out;
}
function wsFixPinned(docs){
  const pinned = docs.filter(d=>d.pinned);
  if(pinned.length>1){
    pinned.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
    pinned.slice(1).forEach(d=>{ d.pinned = false; });
  }
  return docs;
}

/* ---- Gliederung ---- */
function wsFindIn(list, nid, block, parent){
  for(let i=0;i<list.length;i++){
    const n = list[i];
    if(n.id===nid) return {block, list, index:i, node:n, parent};
    const r = wsFindIn(n.children, nid, block, n);
    if(r) return r;
  }
  return null;
}
function wsFindNode(doc, nid){
  for(const b of doc.blocks){
    if(b.type!=="outline") continue;
    const r = wsFindIn(b.items, nid, b, null);
    if(r) return r;
  }
  return null;
}
function wsContains(node, nid){ return node.id===nid || node.children.some(c=>wsContains(c, nid)); }
/* pos: "before" | "after" | "into". Der Teilbaum (alle Unterpunkte) wandert immer mit. */
function wsMoveNode(doc, nid, targetId, pos){
  if(nid===targetId) return false;
  const src = wsFindNode(doc, nid); if(!src) return false;
  if(wsContains(src.node, targetId)) return false;       // nie in den eigenen Teilbaum
  if(!wsFindNode(doc, targetId)) return false;
  const [node] = src.list.splice(src.index, 1);
  const tgt = wsFindNode(doc, targetId);
  if(pos==="into"){ tgt.node.children.push(node); tgt.node.collapsed = false; }
  else tgt.list.splice(tgt.index + (pos==="after"?1:0), 0, node);
  return true;
}
/* Abschnitte eines Dokuments: jede Gliederung mit der Überschrift davor; Überschriften ohne Gliederung bieten "neue Gliederung anlegen" */
function wsSections(doc){
  const secs = [{head:null, outs:[]}];
  doc.blocks.forEach(b=>{ if(b.type==="heading") secs.push({head:b, outs:[]}); else if(b.type==="outline") secs[secs.length-1].outs.push(b); });
  const out = [];
  secs.forEach(s=>{
    const hl = s.head ? ((s.head.text||"").trim() || "(Überschrift ohne Text)") : "(vor der ersten Überschrift)";
    if(s.outs.length) s.outs.forEach((b,i)=>out.push({id:b.id, headId:s.head?s.head.id:"", label:hl+" › Gliederung"+(s.outs.length>1?" "+(i+1):"")}));
    else if(s.head || secs.length===1) out.push({id:"", headId:s.head?s.head.id:"", label:hl+" › neue Gliederung anlegen"});
  });
  return out;
}
/* Punkt (samt Unterpunkten) oder Anhang in einen anderen Block, unter eine andere Überschrift oder in ein anderes Dokument verschieben.
   tgt: {block: Gliederungs-ID oder "" (= neue Gliederung hinter der Überschrift headId), mode: "top"|"end"|"child", parent: Punkt-ID} */
function wsMoveTo(srcDoc, dstDoc, id, tgt){
  const src = wsFindNode(srcDoc, id);
  if(!src){
    const ow = wsAttOwner(srcDoc, id); if(!ow) return false;
    const t = tgt.parent ? wsFindNode(dstDoc, tgt.parent) : null;
    if(!t || t.node===ow) return false;
    const i = ow.att.findIndex(a=>a.id===id), [a] = ow.att.splice(i, 1);
    t.node.att.push(a); t.node.aopen = true; return true;
  }
  let blk = tgt.block ? dstDoc.blocks.find(b=>b.id===tgt.block && b.type==="outline") : null;
  if(tgt.mode==="child"){
    if(!tgt.parent || wsContains(src.node, tgt.parent) || !wsFindNode(dstDoc, tgt.parent)) return false;
  }else if(tgt.block && !blk) return false;
  src.list.splice(src.index, 1);
  if(tgt.mode==="child"){ const t = wsFindNode(dstDoc, tgt.parent); t.node.children.push(src.node); t.node.collapsed = false; return true; }
  if(!blk){
    blk = {id:wsId(), type:"outline", items:[], tag:""};
    let at = 0; if(tgt.headId){ const hi = dstDoc.blocks.findIndex(b=>b.id===tgt.headId); at = hi<0 ? dstDoc.blocks.length : hi+1; }
    dstDoc.blocks.splice(at, 0, blk);
  }
  if(tgt.mode==="top") blk.items.unshift(src.node); else blk.items.push(src.node);
  return true;
}
function wsIndent(doc, nid){
  const src = wsFindNode(doc, nid); if(!src || src.index===0) return false;
  const prev = src.list[src.index-1];
  src.list.splice(src.index, 1);
  prev.children.push(src.node); prev.collapsed = false;
  return true;
}
function wsOutdent(doc, nid){
  const src = wsFindNode(doc, nid); if(!src || !src.parent) return false;
  const par = wsFindNode(doc, src.parent.id);
  src.list.splice(src.index, 1);
  par.list.splice(par.index+1, 0, src.node);
  return true;
}
function wsAddSibling(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return null;
  const n = wsNewNode("");
  src.list.splice(src.index+1, 0, n);
  return n;
}
function wsAddChild(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return null;
  const n = wsNewNode("");
  src.node.children.push(n); src.node.collapsed = false;
  return n;
}
function wsDeleteNode(doc, nid){
  const src = wsFindNode(doc, nid); if(!src) return false;
  src.list.splice(src.index, 1); return true;
}
function wsCount(node){
  let done = 0, total = 0;
  node.children.forEach(c=>{ total++; if(c.done) done++; const s = wsCount(c); total += s.total; done += s.done; });
  return {done, total};
}
function wsAllDone(n){ return n.done && n.children.every(wsAllDone); }
/* Nächste offene Schritte: Blätter bzw. Knoten, deren Unterpunkte alle erledigt sind, in Dokumentreihenfolge */
function wsNextOpen(doc, max){ return wsNextOpenItems(doc, max).map(n=>n.text.trim()); }
function wsNextOpenItems(doc, max, vis, sort){
  const out = [];
  const walk = (items)=>{
    for(const n of (sort ? sort(items) : items)){
      if(out.length>=max) return;
      if(n.done) continue;
      if(vis && !vis(n)) continue;
      const open = n.children.filter(c=>!wsAllDone(c));
      if(n.children.length && open.length) walk(n.children);
      else if((n.text||"").trim()) out.push(n);
    }
  };
  doc.blocks.filter(b=>b.type==="outline").forEach(b=>walk(b.items));
  return out;
}
function wsOpenCount(doc){
  let n = 0;
  const walk = (items)=>items.forEach(i=>{ if(!i.done && (i.text||"").trim()) n++; walk(i.children); });
  doc.blocks.filter(b=>b.type==="outline").forEach(b=>walk(b.items));
  return n;
}

/* ---- Gantt-Zeilen aus der Gliederung ---- */
function wsGanttRows(roots, sel, em, sort){
  const rows = [];
  const walk = (n, level)=>{
    if(wsAllDone(n)) return null;
    if(sel && !wsTagShownNode(n, sel, em)) return null;
    const own = wsSpan(n);
    const row = {id:n.id, title:(n.text||"").trim()||"(ohne Titel)", level, meta:!!n.meta, own, start:null, end:null, agg:false, dl:n.dl||"", late:false, tag:em ? (em.get(n.id)||"") : ""};
    rows.push(row);
    let lo = own ? own.start : null, hi = own ? own.end : null;
    (sort ? sort(n.children) : n.children).forEach(c=>{
      const r = walk(c, level+1);
      if(r && r.start){ if(!lo || r.start<lo) lo = r.start; if(!hi || r.end>hi) hi = r.end; }
    });
    if(lo){ row.start = lo; row.end = hi; row.agg = !own || lo!==own.start || hi!==own.end; }
    if(row.dl && row.end && row.end>row.dl) row.late = true;
    if(!row.start && !row.meta){ rows.splice(rows.indexOf(row), 1); return null; }
    return row;
  };
  (sort ? sort(roots) : roots).forEach(n=>walk(n, 0));
  return rows;
}
/* oberste Meta-Projekte (nicht verschachtelt gesammelt) aus allen Dokumenten */
function wsMetaRoots(docs){
  const out = [];
  const walk = (items)=>items.forEach(n=>{ if(n.meta) out.push(n); else walk(n.children); });
  docs.forEach(d=>d.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items); }));
  return out;
}

/* ---- Blöcke und Tabellen ---- */
function wsMoveBlock(doc, bid, targetBid, pos){
  if(bid===targetBid) return false;
  const i = doc.blocks.findIndex(b=>b.id===bid); if(i<0) return false;
  if(doc.blocks.findIndex(b=>b.id===targetBid)<0) return false;
  const [b] = doc.blocks.splice(i, 1);
  const t = doc.blocks.findIndex(x=>x.id===targetBid);
  doc.blocks.splice(t + (pos==="after"?1:0), 0, b);
  return true;
}
function wsMoveRow(block, from, to, pos){
  if(from===to || from<0 || to<0 || from>=block.rows.length || to>=block.rows.length) return false;
  const [r] = block.rows.splice(from, 1);
  const t = from<to ? to-1 : to;
  block.rows.splice(t + (pos==="after"?1:0), 0, r);
  return true;
}
function wsAddCol(block){ block.cols.push("Spalte "+(block.cols.length+1)); block.rows.forEach(r=>r.push("")); }
function wsDelCol(block, ci){
  if(block.cols.length<=1 || ci<0 || ci>=block.cols.length) return false;
  block.cols.splice(ci, 1); block.rows.forEach(r=>r.splice(ci, 1)); return true;
}
function wsAddRow(block, after){
  const row = block.cols.map(()=> "");
  const idx = (after===undefined || after===null) ? block.rows.length : after+1;
  block.rows.splice(idx, 0, row); return idx;
}

/* ---- Ansicht: Ausblenden und Filtern (rein) ---- */
function wsFNorm(f){
  f = (f && typeof f==="object") ? f : {};
  return {lvl:(f.lvl>=1 && f.lvl<=3)?Math.floor(f.lvl):0, hideDone:!!f.hideDone, dated:!!f.dated,
    due:(f.due==="today"||f.due==="week")?f.due:"", meta:!!f.meta, noAtt:!!f.noAtt, q:String(f.q||"").trim().slice(0,80), showHid:!!f.showHid,
    manual:!!f.manual, notes:!!f.notes, noTab:!!f.noTab,
    tag:(f.tag==="!none") ? "!none" : wsTagKey(f.tag).slice(0,40)};
}
function wsHasCrit(f){ return !!(f.dated || f.due || f.meta || f.q || f.tag); }
function wsFActive(f){ return (f.lvl?1:0)+(f.hideDone?1:0)+(f.dated?1:0)+(f.due?1:0)+(f.meta?1:0)+(f.noAtt?1:0)+(f.q?1:0)+(f.showHid?1:0)+(f.manual?1:0)+(f.notes?1:0)+(f.noTab?1:0); }
function wsNodeDue(n){ return n.dl || n.ld || n.date || ""; }
function wsNodeMatch(n, f, today, eff){
  if(f.tag && !wsTagMatch(eff, f.tag)) return false;
  if(f.dated && !(n.date || n.ld || n.dl || n.dur)) return false;
  if(f.meta && !n.meta) return false;
  if(f.due){
    if(n.done) return false;
    const d = wsNodeDue(n); if(!d) return false;
    const lim = f.due==="today" ? today : wsAddDays(today, 7);
    if(d>lim) return false;
  }
  if(f.q){
    const q = f.q.toLowerCase();
    let hay = (n.text||"")+" "+(n.att||[]).map(a=>(a.title||"")+" "+(a.text||"")+" "+(a.url||"")).join(" ");
    if(!hay.toLowerCase().includes(q)) return false;
  }
  return true;
}
function wsNodeShown(n, f, today, inh){
  if(n.hid && !f.showHid) return false;
  if(f.hideDone && wsAllDone(n)) return false;
  if(!wsHasCrit(f)) return true;
  const eff = wsTagUnion(inh, n.tag);
  if(!(n.text||"").trim() && !n.children.length && wsTagMatch(eff, f.tag)) return true;
  if(wsNodeMatch(n, f, today, eff)) return true;
  return n.children.some(c=>wsNodeShown(c, f, today, eff));
}
function wsSubCount(n){ return 1 + n.children.reduce((s,c)=>s+wsSubCount(c), 0); }
function wsHiddenCount(items, f, today, inh){
  let k = 0;
  for(const n of items){ const eff = wsTagUnion(inh, n.tag); if(!wsNodeShown(n, f, today, inh)) k += wsSubCount(n); else k += wsHiddenCount(n.children, f, today, eff); }
  return k;
}

/* ---- Deadlines aus den Punkten des Arbeitsbereichs (rein) ---- */
function wsDayDiff(from, to){
  const p = s=>{ const a = s.split("-").map(Number); return Date.UTC(a[0], a[1]-1, a[2]); };
  return Math.round((p(to)-p(from))/86400000);
}
function wsDeadlineItems(docs, today){
  const out = [];
  docs.forEach(doc=>{
    wsAllNodes(doc).forEach(n=>{
      if(!n.dl || n.done) return;
      out.push({doc, node:n, dl:n.dl, days:wsDayDiff(today, n.dl)});
    });
  });
  out.sort((a,b)=> a.days-b.days || (a.node.text||"").localeCompare(b.node.text||""));
  return out;
}

/* ---- Tags (rein) ---- */
/* Ein Eintrag kann mehrere Tags tragen (Text mit Komma getrennt); Tags darunter kommen zu den geerbten dazu */
function wsTagList(s){
  const seen = new Set(), out = [];
  String(s||"").split(",").forEach(p=>{ const t = p.replace(/\s+/g," ").trim().slice(0,30), k = t.toLowerCase(); if(t && !seen.has(k)){ seen.add(k); out.push(t); } });
  return out;
}
function wsNormTag(s){ return wsTagList(s).slice(0,4).join(", "); }
function wsTagKey(s){ return wsNormTag(s).toLowerCase(); }
function wsTagUnion(a, b){ return wsTagList(String(a||"")+","+String(b||"")).slice(0,8).join(", "); }
function wsTagMatch(eff, sel){ if(!sel) return true; const l = wsTagList(eff).map(t=>t.toLowerCase()); return sel==="!none" ? l.length===0 : l.includes(sel); }
/* Tag eines Blocks: Überschrift gilt für sich und alle folgenden Blöcke bis zur nächsten Überschrift; sonst der Tag des Dokuments */
function wsBlockTags(doc){
  const out = {}; let base = wsNormTag(doc.tag);
  doc.blocks.forEach(b=>{
    if(b.type==="heading"){ base = wsTagUnion(doc.tag, b.tag); out[b.id] = base; }
    else out[b.id] = wsTagUnion(base, b.tag);
  });
  return out;
}
/* Wirksamer Tag jedes Punkts: eigener Tag, sonst der des übergeordneten Punkts, sonst der des Blocks */
function wsEffTags(docs){
  const map = new Map();
  docs.forEach(doc=>{
    const bt = wsBlockTags(doc);
    const walk = (items, inh)=>items.forEach(n=>{ const e = wsTagUnion(inh, n.tag); map.set(n.id, e); walk(n.children, e); });
    doc.blocks.forEach(b=>{ if(b.type==="outline") walk(b.items, bt[b.id]); });
  });
  return map;
}
function wsTagShownNode(n, sel, em){ return wsTagMatch(em.get(n.id), sel) || n.children.some(c=>wsTagShownNode(c, sel, em)); }
function wsAllTags(docs){
  const seen = new Map();
  const add = t=>{ wsTagList(t).forEach(x=>{ const k = x.toLowerCase(); if(!seen.has(k)) seen.set(k, x); }); };
  const walk = items=>items.forEach(n=>{ add(n.tag); (n.att||[]).forEach(a=>add(a.tag)); walk(n.children); });
  docs.forEach(d=>{ add(d.tag); d.blocks.forEach(b=>{ add(b.tag); if(b.type==="outline") walk(b.items); }); });
  return [...seen.values()].sort((a,b)=>a.localeCompare(b, "de"));
}
function wsDocHasTag(doc, sel){
  const bt = wsBlockTags(doc), em = wsEffTags([doc]);
  return doc.blocks.some(b=> b.type==="outline" ? b.items.some(n=>wsTagShownNode(n, sel, em)) : wsTagMatch(bt[b.id], sel));
}

/* ---- Dringlichkeit: Sortierung (rein) ---- */
/* frühester offener Tag im Punkt samt Unterpunkten: Deadline, Termin, Ende der Laufzeit; leer = nichts Terminiertes */
function wsUrgKey(n){
  let best = "";
  const take = d=>{ if(d && (!best || d<best)) best = d; };
  const walk = x=>{
    if(!x.done){
      take(x.dl); take(wsLinkDay(x));
      const sp = wsSpan(x); if(sp) take(sp.end);
      (x.att||[]).forEach(a=>{ if(!a.done) take(a.date); });
    }
    x.children.forEach(walk);
  };
  walk(n);
  return best;
}
/* Dringendstes zuerst; ohne Termin danach, Erledigtes ganz am Ende; bei Gleichstand bleibt die Reihenfolge */
function wsUrgSort(items){
  const rank = n=>{ if(wsAllDone(n)) return 2; return wsUrgKey(n) ? 0 : 1; };
  return items.map((n,i)=>({n, i, r:rank(n), k:wsUrgKey(n)}))
    .sort((a,b)=> a.r-b.r || (a.r===0 ? (a.k<b.k?-1:a.k>b.k?1:0) : 0) || a.i-b.i)
    .map(x=>x.n);
}
function wsDocUrgKey(doc){
  let best = "";
  doc.blocks.forEach(b=>{ if(b.type==="outline") b.items.forEach(n=>{ const k = wsUrgKey(n); if(k && (!best || k<best)) best = k; }); });
  return best;
}

/* ---- Links (rein): nur http, https und mailto werden zu anklickbaren Adressen ---- */
function wsNormUrl(u){
  u = String(u||"").trim();
  if(!u) return "";
  if(/^(https?:\/\/|mailto:)\S+$/i.test(u)) return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return "";                 // andere Schemata (javascript: usw.) nie
  if(/^[^\s\/@]+\.[a-z]{2,}(\/\S*)?$/i.test(u)) return "https://"+u;
  return "";
}

/* ---- Wochenübersicht (rein) ---- */
function wsMonday(d){
  const t = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10));
  return wsAddDays(d, -((t.getDay()+6)%7));
}
function wsKW(d){
  const t = new Date(Date.UTC(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay()+6)%7) + 3);                 // Donnerstag der Woche
  const j4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - j4)/86400000 - 3 + ((j4.getUTCDay()+6)%7)) / 7);
}
/* Aufgaben für die Woche: Blätter und alle terminierten Punkte; Tag = Tag der Verknüpfung (Deadline-Tag) oder Start */
function wsWeekTasks(docs, o){
  const days = []; for(let i=0;i<(o.n||7);i++) days.push(wsAddDays(o.start, i));
  const byDay = {}; days.forEach(d=>{ byDay[d] = []; });
  const pool = [], overdue = [];
  const em = wsEffTags(docs), q = (o.q||"").trim().toLowerCase();
  const showOver = o.start >= (o.overFrom || wsMonday(o.today));
  docs.forEach(doc=>{
    if(o.doc && o.doc!=="all" && doc.id!==o.doc) return;
    wsAllNodes(doc).forEach(n=>{
      if(n.hid || !(n.text||"").trim()) return;
      const day = wsLinkDay(n);
      if(!(n.children.length===0 || day)) return;
      if(!wsTagMatch(em.get(n.id), o.tag||"")) return;
      if(q && !n.text.toLowerCase().includes(q)) return;
      const it = {doc, node:n, day};
      if(n.done){ if(o.showDone && day && byDay[day]) byDay[day].push(it); return; }
      if(!day){ pool.push(it); return; }
      if(byDay[day]) byDay[day].push(it);
      else if(showOver && day<o.today && day<days[0]) overdue.push(it);
    });
  });
  days.forEach(d=>{ byDay[d] = byDay[d].map((x,i)=>({x,i})).sort((a,b)=>(a.x.node.done?1:0)-(b.x.node.done?1:0) || a.i-b.i).map(z=>z.x); });
  overdue.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0);
  const keyed = pool.map((x,i)=>({x,i,k:wsUrgKey(x.node)})).sort((a,b)=>(a.k?0:1)-(b.k?0:1) || (a.k<b.k?-1:a.k>b.k?1:0) || a.i-b.i);
  return {days, byDay, pool:keyed.map(z=>z.x), overdue};
}
/* ToDos und Tages-Ziele der ToDo-App, die in keinem Punkt des Arbeitsbereichs verknüpft sind (rein) */
function wsWeekExternal(todos, goals, o){
  const days = o.days, byDay = {}; days.forEach(d=>{ byDay[d] = []; });
  const overdue = [], q = (o.q||"").trim().toLowerCase();
  if(o.docAll===false) return {byDay, overdue};
  const showOver = o.start >= (o.overFrom || o.today);
  const push = it=>{
    if(o.linked && o.linked.has(it.kind+":"+it.id)) return;
    if(!(it.title||"").trim()) return;
    if(q && !it.title.toLowerCase().includes(q)) return;
    if(!wsTagMatch(it.tag||"", o.tag||"")) return;
    if(it.done){ if(o.showDone && byDay[it.day]) byDay[it.day].push(it); return; }
    if(byDay[it.day]) byDay[it.day].push(it);
    else if(showOver && it.day<o.today && it.day<days[0]) overdue.push(it);
  };
  (todos||[]).forEach(t=>{
    if(!t || t.type!=="todo" || t.archived || t.scheduleType==="weekly" || !wsIsDate(t.startDate)) return;
    push({kind:"todo", id:t.id, title:t.title||"", day:t.startDate, done:!!(o.isDone && o.isDone(t.id)), time:t.startTime||"", tag:t.tag||""});
  });
  (goals||[]).forEach(g=>{
    if(!g || !wsIsDate(g.due)) return;
    push({kind:"goal", id:g.id, title:g.title==="(ohne Titel)"?"":(g.title||""), day:g.due, done:!!g.completed, time:"", tag:""});
  });
  days.forEach(d=>{ byDay[d] = byDay[d].map((x,i)=>({x,i})).sort((a,b)=>(a.x.done?1:0)-(b.x.done?1:0) || ((a.x.time?0:1)-(b.x.time?0:1)) || (a.x.time<b.x.time?-1:a.x.time>b.x.time?1:0) || a.i-b.i).map(z=>z.x); });
  overdue.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:0);
  return {byDay, overdue};
}
/* Kalendertermine auf die Tage verteilen (rein): Ganztägige über alle Tage, Zeitgebundene am Starttag */
function wsWeekEvents(evs, days){
  const byDay = {}; days.forEach(d=>{ byDay[d] = []; });
  (evs||[]).forEach(e=>{
    if(e.allDay){ days.forEach(d=>{ if(e.sd<=d && d<(e.ed || wsAddDays(e.sd, 1))) byDay[d].push(e); }); }
    else if(byDay[e.sd]) byDay[e.sd].push(e);
  });
  days.forEach(d=>{ byDay[d].sort((a,b)=>(a.allDay?0:1)-(b.allDay?0:1) || (a.st<b.st?-1:a.st>b.st?1:0) || (a.title<b.title?-1:a.title>b.title?1:0)); });
  return byDay;
}
/* ---- 3D-Graph (rein): Dokumente, Überschriften/Blöcke, Punkte, Anhänge und Tags als Knoten ---- */
/* Knoten-IDs: d:<Dokument>, b:<Block>, n:<Punkt>, a:<Anhang>, t:<Tag>; Tag-Knoten hängen nur an Elementen mit EIGENEM Tag (Vererbung zeigt die Baumstruktur) */
function wsGraph(docs, o){
  o = o || {};
  const max = o.max || 1000, nodes = [], links = [], idx = new Map();
  let cut = false;
  const em = wsEffTags(docs);
  const add = n=>{ if(nodes.length>=max){ cut = true; return null; } nodes.push(n); idx.set(n.id, n); return n; };
  const link = (a, b, kind)=>{ if(a && b && idx.has(a) && idx.has(b)) links.push({a, b, kind:kind||"tree"}); };
  const ownTag = (id, tag)=>{
    if(o.tags===false) return;
    wsTagList(tag).forEach(t=>{
      const tid = "t:"+t.toLowerCase();
      if(!idx.has(tid)) add({id:tid, kind:"tag", label:"#"+t, doc:"", ref:t, eff:t, done:false});
      link(id, tid, "tag");
    });
  };
  const first = t=>{ const s = String(t||"").trim().split("\n")[0]; return s.length>60 ? s.slice(0,60)+"…" : s; };
  /* o.head: "H:<Überschrift-ID>" oder "S:<Dokument-ID>" (Teil vor der ersten Überschrift) = nur dieser Abschnitt */
  const sectionOf = doc=>{
    if(!o.head) return null;
    const m = /^([HS]):(.*)$/.exec(o.head); if(!m) return null;
    if(m[1]==="S"){ if(doc.id!==m[2]) return false; const set = new Set(); for(const b of doc.blocks){ if(b.type==="heading") break; set.add(b.id); } return set; }
    const i = doc.blocks.findIndex(b=>b.id===m[2]); if(i<0) return false;
    const set = new Set([m[2]]); for(let k=i+1;k<doc.blocks.length && doc.blocks[k].type!=="heading";k++) set.add(doc.blocks[k].id); return set;
  };
  docs.forEach(doc=>{
    if(o.doc && doc.id!==o.doc) return;
    const sect = sectionOf(doc); if(sect===false) return;
    const did = "d:"+doc.id;
    if(!add({id:did, kind:"doc", label:doc.title||"(ohne Titel)", doc:doc.id, ref:doc.id, eff:doc.tag||"", done:false})) return;
    ownTag(did, doc.tag);
    const bt = wsBlockTags(doc);
    let parent = did;
    const walk = (items, par, inhTag)=>items.forEach(n=>{
      if((n.done && !o.showDone) || (n.hid && !o.showHid)) return;
      const id = "n:"+n.id, eff = em.get(n.id)||"";
      if(!add({id, kind:"node", label:first(n.text)||"(leer)", doc:doc.id, ref:n.id, eff, done:!!n.done, meta:!!n.meta, date:n.date||"", dl:n.dl||""})) return;
      link(par, id); ownTag(id, n.tag);
      (n.att||[]).forEach(a=>{
        if(a.done && !o.showDone) return;
        const aid = "a:"+a.id;
        const label = wsTitleOf(a) || (a.type==="table" ? "Tabelle" : a.type==="file" ? "Datei" : a.type==="link" ? "Link" : "Notiz");
        if(!add({id:aid, kind:"att", type:a.type, label:first(label), doc:doc.id, ref:a.id, eff:wsTagUnion(eff, a.tag), done:!!a.done, fileId:a.fileId||"", mime:a.mime||"", url:a.url||""})) return;
        link(id, aid); ownTag(aid, a.tag);
      });
      walk(n.children, id);
    });
    doc.blocks.forEach(b=>{
      if(sect && !sect.has(b.id)){ if(b.type==="heading") parent = did; return; }
      if(b.type==="outline"){ walk(b.items, parent); return; }
      const id = "b:"+b.id;
      const label = b.type==="heading" ? first(b.text) : b.type==="table" ? "Tabelle" : first(b.text);
      if(!add({id, kind:"block", type:b.type, label:label||(b.type==="heading"?"(Überschrift)":"(Text)"), doc:doc.id, ref:b.id, eff:bt[b.id]||"", done:false})) return;
      link(b.type==="heading" ? did : parent, id); ownTag(id, b.tag);
      if(b.type==="heading") parent = id;
    });
  });
  return {nodes, links, cut};
}

function wsVis(n, inh){ return wsNodeShown(n, wsF, todayKey(), inh); }
const wsOpenMap = new Map();   // nur für diese Sitzung: einzeln auf- oder zugeklappte Notizen, Tabellen und Gliederungen
function wsFoldOpen(id, kind){
  if(wsOpenMap.has(id)) return wsOpenMap.get(id);
  if(kind==="text") return !!wsF.notes;      // Notizen standardmäßig zu
  if(kind==="table") return !wsF.noTab;
  return true;
}
/* Überschriften klappen alle Blöcke bis zur nächsten Überschrift ein (gespeichert am Block, also auf allen Geräten gleich) */
function wsHeadClosed(b){
  if(wsFiltered() && wsColl.has(b.id)) return wsColl.get(b.id);
  return !wsFiltered() && !!b.collapsed;
}
function wsHeadOf(doc, bid){
  let h = null;
  for(const b of doc.blocks){ if(b.id===bid) return h; if(b.type==="heading") h = b; }
  return null;
}
function wsSetAllFolds(doc, closed){
  const walk = list=>list.forEach(n=>{
    if(n.children.length){ n.collapsed = closed; wsColl.set(n.id, closed); }
    if(n.att.length) n.aopen = !closed;
    walk(n.children);
  });
  doc.blocks.forEach(b=>{
    if(b.type==="outline") walk(b.items);
    if(b.type==="heading"){ b.collapsed = closed; wsColl.set(b.id, closed); }
  });
}
function wsFoldBtn(open, label){ return `<button class="ws-fh" data-wsact="fold" title="${open?"Einklappen":"Aufklappen"}"><span>${open?"▾":"▸"}</span><span class="ws-fp">${label}</span></button>`; }
function wsFirstLine(t){ const s = String(t||"").trim().split("\n")[0]; return s.length>90 ? s.slice(0,90)+"…" : s; }
function wsSorter(){ return wsF.manual ? null : wsUrgSort; }
function wsFiltered(){ return !!wsF.lvl || wsHasCrit(wsF); }
function wsEffCollapsed(n, depth){
  if(!wsFiltered()) return !!n.collapsed;
  if(wsColl.has(n.id)) return wsColl.get(n.id);
  return !!(wsF.lvl && depth+1>=wsF.lvl);
}
let wsTab = "docs";
let wsOpenDocId = mmLS.getItem("wsOpenDoc") || null;
let wsTodayExpanded = mmLS.getItem("wsTodayExp")==="1";
let wsRev = 0;
const wsDirty = new Map(), wsDeleted = new Map();                     // id -> Version der letzten lokalen Änderung
let wsSaveTimer = null, wsSaveQueue = Promise.resolve(), wsRetryTimer = null;
let wsFocusSel = null;
let wsDrag = null, wsDrop = null;

function wsGet(id){ return wsDocs.find(d=>d.id===id) || null; }
function wsBlock(doc, bid){ return doc.blocks.find(b=>b.id===bid) || null; }
function wsPinned(){ return wsDocs.find(d=>d.pinned) || null; }
function wsCurrentDoc(){
  return wsGet(wsOpenDocId) || wsPinned() || wsDocs[0] || null;
}
function wsTouch(doc){
  doc.updatedAt = new Date().toISOString();
  wsDirty.set(doc.id, ++wsRev);
  wsScheduleSave();
}
function wsSetStatus(txt){ document.querySelectorAll(".ws-status").forEach(el=>{ el.textContent = txt; }); }

function wsTrashTouch(){ wsDirty.set("__trash__", ++wsRev); wsScheduleSave(); wsRefreshChips(); }
function wsTrashPut(item){ wsTrash.unshift(item); wsTrashAdd.add(item.id); wsTrashTouch(); }
function wsTrashDrop(id){ wsTrash = wsTrash.filter(i=>i.id!==id); wsTrashAdd.delete(id); wsTrashGone.add(id); wsTrashTouch(); }
function wsTrashCount(){ return wsTrashLive(wsTrash, Date.now()).length; }
function wsTrashLeft(i){
  const ms = Date.parse(i.deletedAt)+WS_TRASH_MS-Date.now(), h = Math.max(1, Math.ceil(ms/3600000));
  return h>=24 ? "noch "+Math.floor(h/24)+" Tg "+(h%24)+" Std" : "noch "+h+" Std";
}
function wsOpenTrash(){
  if(document.getElementById("modalBg")) return;
  const icon = {node:"☑", att:"📎", block:"▭", doc:"📄"}, kn = {node:"Punkt", att:"Anhang", block:"Block", doc:"Dokument"};
  document.body.insertAdjacentHTML("beforeend", `<div class="modal-bg" id="modalBg"><div class="modal"><h2>🗑 Papierkorb</h2>
    <p class="muted" style="font-size:13px;margin-bottom:8px">Gelöschte Einträge bleiben hier 3 Tage erhalten. Verknüpfungen mit ToDos oder Zielen werden beim Zurücklegen gelöst.</p>
    <div class="ws-implist" id="wst_list"></div>
    <div class="modal-actions"><button class="btn-ghost" id="wst_empty">Papierkorb leeren</button><button class="btn-primary" id="wst_close">Schließen</button></div></div></div>`);
  const draw = ()=>{
    const items = wsTrashLive(wsTrash, Date.now());
    $("wst_list").innerHTML = items.map(i=>`<div class="ws-improw" data-tid="${esc(i.id)}"><span class="ws-wkchip">${icon[i.kind]} ${kn[i.kind]}</span>
      <span class="ws-imptx">${esc(i.label)}<br><span class="muted" style="font-size:12px">${i.kind==="doc"?"":"aus „"+esc(i.docTitle||"(ohne Titel)")+"“ · "}${esc(wsTrashLeft(i))}</span></span>
      <button class="ws-addbtn" data-tact="restore">↩ Zurück</button><button class="ws-mini" data-tact="purge" title="Endgültig löschen">✕</button></div>`).join("") || `<div class="muted center" style="padding:14px">Der Papierkorb ist leer.</div>`;
    $("wst_empty").style.display = items.length ? "" : "none";
  };
  draw();
  $("wst_list").onclick = e=>{
    const b = e.target.closest("[data-tact]"), row = e.target.closest("[data-tid]"); if(!b || !row) return;
    const item = wsTrash.find(i=>i.id===row.dataset.tid); if(!item) return;
    if(b.dataset.tact==="purge"){ if(confirm("Endgültig löschen? Das lässt sich nicht rückgängig machen.")){ wsTrashDrop(item.id); draw(); } return; }
    const r = wsRestore(wsDocs, item);
    if(!r.ok){ toast(r.msg); return; }
    wsDeleted.delete(r.docId); wsTouch(r.doc); wsTrashDrop(item.id); draw();
    toast("Zurückgelegt: "+item.label.slice(0,40)); render();
  };
  $("wst_empty").onclick = ()=>{ if(!confirm("Alle Einträge im Papierkorb endgültig löschen?")) return; wsTrash.slice().forEach(i=>wsTrashDrop(i.id)); draw(); };
  $("wst_close").onclick = ()=>$("modalBg").remove();
  $("modalBg").onclick = e=>{ if(e.target.id==="modalBg") $("modalBg").remove(); };
}
function wsRefreshChips(){
  const box = document.querySelector(".ws-chips"); if(!box || view!=="notes" || wsTab!=="docs") return;
  const cur = wsCurrentDoc();
  box.innerHTML = wsChipsInner(cur);
}

function wsDescCount(n){ let c = 0; n.children.forEach(k=>{ c += 1 + wsDescCount(k); }); return c; }
function wsNodeHtml(n, depth, inh){
  depth = depth||0;
  const eff = wsTagUnion(inh, n.tag);
  const shown = (wsF.manual ? n.children : wsUrgSort(n.children)).filter(c=>wsVis(c, eff));
  const hasKids = shown.length>0;
  const hasAtt = n.att.length>0 && !wsF.noAtt;
  const coll = wsEffCollapsed(n, depth);
  const attOn = (n.aopen && !wsF.noAtt) && !(hasKids && coll);           // eingeklappter Punkt blendet auch seine Anhänge aus
  const ticon = hasKids ? (coll?"▸":"▾") : hasAtt ? (n.aopen?"▾":"▸") : "·";
  const cnt = n.children.length ? wsCount(n) : null;
  const sub = (hasKids && !coll) ? `<ul class="ws-tree ws-sub">${shown.map(c=>wsNodeHtml(c, depth+1, eff)).join("")}</ul>` : "";
  return `<li class="ws-node lv${depth%6}${n.done?" done":""}${n.hid?" hid":""}" data-nid="${n.id}">
    <div class="ws-nrow">
      <span class="ws-handle sm" draggable="true" data-wsdrag="node" title="Ziehen: Punkt samt Unterpunkten verschieben">⠿</span>

      <button class="ws-chk${n.done?" on":""}" data-wsact="done" title="Erledigt">${n.done?"✓":""}</button>
      <textarea class="ws-in ws-nin ws-nta" rows="1" data-wsf="node" data-v="${esc(n.text)}" placeholder="Punkt">${esc(n.text)}</textarea>
      <span class="ws-nright">
      ${wsNodeChips(n)}
      ${cnt?`<span class="ws-cnt" title="erledigte Unterpunkte">${cnt.done}/${cnt.total}</span>`:""}${(hasKids && coll)?`<span class="ws-hcnt" title="ausgeblendete Unterpunkte">▸ ${wsDescCount(n)}</span>`:""}
      ${wsF.noAtt?"":`<button class="ws-attbtn${n.att.length?" has":""}" data-wsact="att-toggle" title="Text, Notiz oder Tabelle an diesen Punkt anhängen">📎 ${n.att.length?n.att.length:"Anhang"}</button>`}
      <button class="ws-mini ws-tagb${n.tag?" on":(eff?" inh":"")}" data-wsact="tag-node" title="${n.tag?"Eigener Tag, gilt auch für alle Unterpunkte und Anhänge":(eff?"Tag geerbt von oben, hier änderbar":"Tag setzen (gilt auch für alle Unterpunkte und Anhänge)")}">🏷${eff?" "+esc(eff):""}</button>

      <button class="ws-mini" data-wsact="add-child" title="Unterpunkt anlegen">+</button>
      <button class="ws-mini" data-wsact="del-node" title="Punkt löschen">✕</button>
      </span>
    </div>${attOn?wsAttsHtml(n, eff):""}${sub}
  </li>`;
}
function wsBlockHtml(b, eff, hidN){
  let body = "";
  if(wsF.tag && b.type!=="outline" && !wsTagMatch(eff, wsF.tag)) return "";
  if(b.type==="text"){
    const open = wsFoldOpen(b.id, "text");
    body = wsFoldBtn(open, open ? "Notiz · erscheint nicht in der Mindmap" : ("Notiz: "+(esc(wsFirstLine(b.text)) || "(leer)")))
      + (open ? `<textarea class="ws-in ws-ta" data-wsf="text" rows="1" placeholder="Text">${esc(b.text)}</textarea>` : "");
  }else if(b.type==="heading"){
    const hc = wsHeadClosed(b);
    body = `<div class="ws-hrow"><button class="ws-tog" data-wsact="hfold" title="${hc?"Aufklappen":"Zuklappen"}: alle Blöcke bis zur nächsten Überschrift">${hc?"▸":"▾"}</button><input type="text" class="ws-in ws-h" data-wsf="text" value="${esc(b.text)}" placeholder="Überschrift">${hc?`<span class="ws-hcnt" title="ausgeblendete Blöcke">▸ ${hidN||0}</span>`:""}</div>`;
  }else if(b.type==="outline"){
    const vis = (wsF.manual ? b.items : wsUrgSort(b.items)).filter(n=>wsVis(n, eff));
    if(wsF.tag && !vis.length) return "";
    const open = wsFoldOpen(b.id, "outline");
    body = wsFoldBtn(open, "Gliederung · "+b.items.length+(b.items.length===1?" Punkt":" Punkte"))
      + (open ? `${(b.items.length && !vis.length)?`<div class="ws-meta">Alle Punkte sind durch die Ansicht ausgeblendet.</div>`:""}<ul class="ws-tree">${vis.map(n=>wsNodeHtml(n, 0, eff)).join("")}</ul>
      <button class="ws-addbtn" data-wsact="add-root-node">+ Punkt</button>` : "");
  }else if(b.type==="table"){
    const open = wsFoldOpen(b.id, "table");
    body = wsFoldBtn(open, "Tabelle · "+b.rows.length+(b.rows.length===1?" Zeile":" Zeilen")+" · erscheint nicht in der Mindmap") + (open ? wsTableBody(b, true) : "");
  }
  return `<div class="ws-block" data-bid="${b.id}" data-kind="${b.type}">
    <span class="ws-handle" draggable="true" data-wsdrag="block" title="Ziehen: Block verschieben">⋮⋮</span>
    <div class="ws-bbody">${body}</div>
    <button class="ws-x ws-tagb${b.tag?" on":(eff?" inh":"")}" data-wsact="tag-block" title="${b.type==="heading"?"Tag setzen (gilt für diese Überschrift und alle Blöcke bis zur nächsten Überschrift)":(b.tag?"Eigener Tag des Blocks":(eff?"Tag geerbt von oben, hier änderbar":"Tag für diesen Block setzen"))}">🏷${eff?" "+esc(eff):""}</button>

  </div>`;
}

      <div class="ws-frow"><span class="ws-fl">Suche</span><input type="search" id="wsq" data-wsq="1" class="ws-in" value="${esc(wsF.q)}" placeholder="Text in Punkten und Anhängen"></div>

function wsEditorHtml(doc, mode){
  let h = `<div class="ws-doc" data-doc="${doc.id}">`;
  if(mode==="tab"){
    h += `<div class="ws-toolbar">
      <input type="text" class="ws-in ws-doctitle" data-wsf="title" value="${esc(doc.title)}" placeholder="Titel des Dokuments">
      <button class="ws-tb${doc.tag?" on":""}" data-wsact="tag-doc" title="Tag für das ganze Dokument">🏷 ${doc.tag?esc(doc.tag):"Tag"}</button>
      <button class="ws-tb" data-wsact="save-doc" title="Dieses Dokument als eigene Datei speichern">💾 Datei</button>
      <button class="ws-tb" data-wsact="del-doc" title="Dokument löschen">🗑</button>
    </div>
    <div class="ws-meta">geändert ${esc(wsDateTime(doc.updatedAt))} · <span class="ws-status"></span></div>`;
  }
  if(mode==="today" || !wsF.tag) h += wsFilterHtml([doc]);
  const bt = wsBlockTags(doc);
  let hidHead = null;
  const parts = doc.blocks.map((b,i)=>{
    if(b.type==="heading"){
      let n = 0; for(let j=i+1;j<doc.blocks.length && doc.blocks[j].type!=="heading";j++) n++;
      hidHead = wsHeadClosed(b) ? b : null;
      return wsBlockHtml(b, bt[b.id], n);
    }
    if(hidHead) return "";
    return wsBlockHtml(b, bt[b.id]);
  }).filter(Boolean);
  h += `<div class="ws-blocks">${parts.length ? parts.join("") : (doc.blocks.length ? `<div class="ws-empty">In diesem Dokument ist nichts für diese Ansicht.</div>` : `<div class="ws-empty">Noch leer. Unten einen Block hinzufügen.</div>`)}</div>
    <div class="ws-add">
      <button class="ws-addbtn" data-wsact="add-block" data-type="heading">+ Überschrift</button><button class="ws-addbtn" data-wsact="add-block" data-type="outline">+ Gliederung</button><span class="ws-addgap"></span><button class="ws-addbtn" data-wsact="add-block" data-type="text">+ Text</button><button class="ws-addbtn" data-wsact="add-block" data-type="table">+ Tabelle</button>
      ${mode==="today"?`<span class="ws-status"></span>`:""}
    </div></div>`;
  return h;
}
function wsTagBarHtml(){

    const v1 = norm(cross(u, Math.abs(u[2])<0.9 ? [0,0,1] : [1,0,0])), v2 = cross(u, v1);
    k.forEach((c,i)=>{
      let p; if(k.length===1 && depth>0) p = [0,0,1];

      place(c, x+d[0]*len, y+d[1]*len, z+d[2]*len, d, depth+1, -0.25);
    });

    const ct = 1-(i+0.5)/roots.length*2, st = Math.sqrt(1-ct*ct), ph = i*2.399963, u = [st*Math.cos(ph), st*Math.sin(ph), ct];

    if(c) set(n.id, sx/c*1.12, sy/c*1.12, sz/c*1.12);
  });

}
function ws3dBuild(){

  g.nodes.forEach(n=>{
    if(ws3d.pos.has(n.id)) return;
    fresh++;
    const p = ws3d.pos.get(parentOf.get(n.id));
    if(p) ws3d.pos.set(n.id, {x:p.x+R()*80, y:p.y+R()*80, z:p.z+R()*80, vx:0, vy:0, vz:0});

function ws3dStep(){

      const d2 = dx*dx+dy*dy+dz*dz+30; if(d2>1000000) continue;

    }

  }
  const idx = new Map(ns.map((x,i)=>[x.id,i]));

function ws3dFit(){

function ws3dThumb(){ return null; }
