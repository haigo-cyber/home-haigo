    media: GED.kidsOf(rec, "OBJE").map(n => ({ node: n, file: GED.kval(n, "FILE") || "", title: GED.unesc(GED.kval(n, "TITL") || ""), prim: /^y/i.test(GED.kval(n, "_PRIM") || ""), del: false, dirty: false }))
  };
  const BEFORE = ["FAMC", "FAMS", "CHAN"];
  ensureMediaIdx(() => { if (d && document.body.contains(d.el)) d.paint(); });
  const d = openDlg({
    title: "Person bearbeiten: " + GED.displayName(rec), wide: true, data: { w, pid: id }, noFocus: false, host,
    after: (dd) => { hydrateMedia(); if (sect && !dd.data._jumped) { dd.data._jumped = true; const s = [...dd.body.querySelectorAll(".sect")].find(x => x.textContent.trim().startsWith(sect)); if (s) setTimeout(() => s.scrollIntoView({ block: "start" }), 30); } },
    onClose: (dd) => { const i = EDITS.indexOf(dd); if (i >= 0) EDITS.splice(i, 1); if (host && typeof splitEditClosed === "function") splitEditClosed(dd); },
    body: (d) => {
      const w = d.data.w;
      return `<div class="jump">Springen zu: ${["Ereignisse", "Eltern", "Ehen und Kinder", "Bilder", "Notizen", "Quellen der Person"].map(x => `<button class="btn sm ghost" data-d="jump" data-to="${x}">${x.replace(" der Person", "")}</button>`).join("")}</div>
        <div class="row3"><label class="fld"><span>Vorname(n)</span><input data-w="given" value="${E(w.given)}"></label>
        <label class="fld"><span>Nachname</span><input data-w="surn" value="${E(w.surn)}"></label>
        <label class="fld"><span>Geschlecht</span><select data-w="sex"><option value="">unbekannt</option><option value="M"${w.sex === "M" ? " selected" : ""}>männlich</option><option value="F"${w.sex === "F" ? " selected" : ""}>weiblich</option></select></label></div>
        <div class="row3"><label class="fld"><span>Titel vor dem Namen</span><input data-w="npfx" value="${E(w.npfx)}"></label>
        <label class="fld"><span>Zusatz nach dem Namen</span><input data-w="nsfx" value="${E(w.nsfx)}"></label>
        <label class="fld"><span>Rufname</span><input data-w="nick" value="${E(w.nick)}"></label></div>
        ${evEditorHtml(w, TYPES_INDI, GED.INDI_EVENTS)}${kinEditorHtml(id)}${mediaEditorHtml(w)}${notesEditorHtml(w)}
        <div class="sect"><span>Quellen der Person</span></div>${srcChips(w.srcs, "p", 0)}`;
    },
    buttons: () => [{ id: "del", label: "Person löschen", cls: "dng" }, { id: "raw", label: "GEDCOM-Text" }, { id: "cancel", label: host ? "Zurücksetzen" : "Abbrechen" }, { id: "save", label: "Speichern", cls: "pri" }],
    onInput: dlgInput,
    on: Object.assign(dlgCommon(), kinHandlers(id), {
      cancel: (d) => d.close(),
      raw: async (d) => { if (d.data.changed && !(await confirmDlg({ title: "Formular verwerfen?", text: "Ungespeicherte Eingaben in diesem Fenster gehen verloren.", ok: "Verwerfen" }))) return; d.close(); rawEdit(id); },
      del: async (d) => { if (await deletePersonFlow(id)) d.close(); },
      save: (d) => {
        const w = d.data.w;
        try {
          GED.run(db, "Person ändern", tx => {
            tx.touch(rec);
            let nn = GED.kid(rec, "NAME");
            if (!nn) { nn = { tag: "NAME", val: "", kids: [] }; const at = rec.kids.findIndex(k => k.tag === "SEX" || k.tag === "FAMC" || k.tag === "FAMS" || k.tag === "CHAN"); if (at < 0) rec.kids.push(nn); else rec.kids.splice(at, 0, nn); }
            const o = p.name;
            const hasSub = !!GED.kid(nn, "NSFX");        // Zusatz als eigene Zeile (Reunion-Stil) oder im Namenswert
            if (w.given !== o.given || w.surn !== o.surn || (!hasSub && w.nsfx !== o.nsfx)) {
              nn.val = GED.buildName(GED.esc(w.given), GED.esc(w.surn), hasSub ? "" : GED.esc(w.nsfx));
              for (const [tag, v] of [["GIVN", w.given], ["SURN", w.surn]]) if (nn.kids.some(k => k.tag === tag)) putKid(nn, tag, GED.esc(v.trim()));
            }
            const setSub = (tag, v, ov) => { if (v === ov) return; const k = nn.kids.find(x => x.tag === tag); const val = GED.esc(v.trim()); if (!val) { if (k) nn.kids.splice(nn.kids.indexOf(k), 1); } else if (k) k.val = val; else nn.kids.unshift({ tag, val, kids: [] }); };
            setSub("NPFX", w.npfx, o.npfx); setSub("NICK", w.nick, o.nick);
            if (hasSub) setSub("NSFX", w.nsfx, o.nsfx);
            const sx = GED.kid(rec, "SEX");
            if (w.sex !== p.sex) {
              if (!w.sex) { if (sx) rec.kids.splice(rec.kids.indexOf(sx), 1); }
              else if (sx) sx.val = w.sex;
              else rec.kids.splice(rec.kids.indexOf(nn) + 1, 0, { tag: "SEX", val: w.sex, kids: [] });
            }
            applyEvents(tx, rec, w.evs, GED.INDI_EVENTS, BEFORE);
            applyNotes(tx, rec, w.notes, BEFORE);
            applyMedia(rec, w.media, BEFORE);
            syncSources(rec, w.srcs);
          });
        } catch (err) { alert("Speichern nicht möglich: " + err.message); return; }
        d.data.changed = false; d.close(); afterEdit("Person gespeichert");
      }
    })
  });
  EDITS.push(d);
  return d;
}

        ${evEditorHtml(w, TYPES_FAM, GED.FAM_EVENTS)}
        <div class="sect"><span>Kinder (Reihenfolge wie angezeigt)</span><button class="btn sm" data-d="kadd">Bestehende Person hinzufügen</button></div>` +
        (w.children.length ? w.children.map((c, i) => `<div class="erow" style="display:flex;gap:6px;align-items:center;justify-content:space-between"><span>${i + 1}. ${E(nameOf(c))} <span class="hint">${E(GED.lifeSpan(db, c))}</span></span><span><button class="btn sm ghost" data-d="kup" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="nach oben">↑</button><button class="btn sm ghost" data-d="kdown" data-i="${i}" ${i === w.children.length - 1 ? "disabled" : ""} aria-label="nach unten">↓</button><button class="btn sm ghost" data-d="kdel" data-i="${i}">Entfernen</button></span></div>`).join("") : `<div class="hint">Keine Kinder.</div>`) +
        notesEditorHtml(w) + `<div class="sect"><span>Quellen der Familie</span></div>${srcChips(w.srcs, "p", 0)}`;
    },
    buttons: () => [{ id: "del", label: "Familie löschen", cls: "dng" }, { id: "raw", label: "GEDCOM-Text" }, { id: "cancel", label: "Abbrechen" }, { id: "save", label: "Speichern", cls: "pri" }],
    onInput: dlgInput,
    on: Object.assign(dlgCommon(), {
      cancel: (d) => d.close(),
      spick: (d, t) => pickPerson({ title: t.dataset.role === "HUSB" ? "Ehemann wählen" : "Ehefrau wählen", onPick: (pid) => { d.data.w[t.dataset.role === "HUSB" ? "husb" : "wife"] = pid; d.data.changed = true; d.paint(); } }),
      sclear: (d, t) => { d.data.w[t.dataset.role === "HUSB" ? "husb" : "wife"] = null; d.data.changed = true; d.paint(); },
      kadd: (d) => pickPerson({ title: "Kind wählen", exclude: d.data.w.children, onPick: (pid) => { d.data.w.children.push(pid); d.data.changed = true; d.paint(); } }),
      kup: (d, t) => { const a = d.data.w.children, i = +t.dataset.i; [a[i - 1], a[i]] = [a[i], a[i - 1]]; d.data.changed = true; d.paint(); },
      kdown: (d, t) => { const a = d.data.w.children, i = +t.dataset.i; [a[i + 1], a[i]] = [a[i], a[i + 1]]; d.data.changed = true; d.paint(); },
      kdel: (d, t) => { d.data.w.children.splice(+t.dataset.i, 1); d.data.changed = true; d.paint(); },
      raw: async (d) => { if (d.data.changed && !(await confirmDlg({ title: "Formular verwerfen?", text: "Ungespeicherte Eingaben in diesem Fenster gehen verloren.", ok: "Verwerfen" }))) return; d.close(); rawEdit(id); },
      del: async (d) => {
        const ok = await confirmDlg({ title: "Familie löschen?", text: "Die Familie wird entfernt. Die Personen bleiben erhalten, verlieren aber die Verknüpfung als Ehepaar und als Kinder dieser Familie.", ok: "Familie löschen", cls: "dng" });
        if (!ok) return;
        GED.run(db, "Familie löschen", tx => GED.deleteRecord(tx, rec));
        d.close(); S.fid = null; if (!GED.personInfo(db, S.pid)) S.pid = GED.startPerson(db); afterEdit("Familie gelöscht");
      },
      save: (d) => {
        const w = d.data.w;
        if (w.husb && w.husb === w.wife) { alert("Ehemann und Ehefrau dürfen nicht dieselbe Person sein."); return; }
        try {
          GED.run(db, "Familie ändern", tx => {
            tx.touch(rec);
            if (w.husb !== f.husb) GED.setSpouse(tx, id, "HUSB", w.husb);
            if (w.wife !== f.wife) GED.setSpouse(tx, id, "WIFE", w.wife);
            const old = f.children;
            if (JSON.stringify(old) !== JSON.stringify(w.children)) {
            old.filter(c => !w.children.includes(c)).forEach(c => GED.removeChild(tx, id, c));
            const nodes = new Map(GED.kidsOf(rec, "CHIL").map(n => [n.val, n]));
            const firstIdx = rec.kids.findIndex(k => k.tag === "CHIL");
            rec.kids = rec.kids.filter(k => k.tag !== "CHIL");
            let at = firstIdx >= 0 ? Math.min(firstIdx, rec.kids.length) : (() => { const i = rec.kids.findIndex(k => ["CHAN"].includes(k.tag)); return i < 0 ? rec.kids.length : i; })();
            w.children.forEach(c => {
              rec.kids.splice(at++, 0, nodes.get(c) || { tag: "CHIL", val: c, kids: [] });
              if (!old.includes(c)) GED.linkPtr(tx, db.get(c), "FAMC", id);
            });
            }
            applyEvents(tx, rec, w.evs, GED.FAM_EVENTS, BEFORE);
            applyNotes(tx, rec, w.notes, BEFORE);
            syncSources(rec, w.srcs);
          });
        } catch (err) { alert("Speichern nicht möglich: " + err.message); return; }
        d.data.changed = false; d.close(); afterEdit("Familie gespeichert");
      }
    })
  });
}

function createPerson(tx, data) {
  const r = GED.addPerson(tx, data);
  if (data.date || data.place) {
    const b = { tag: "BIRT", val: "", kids: [] };
    putKid(b, "DATE", data.date); putKid(b, "PLAC", GED.esc(data.place));
    const at = r.kids.findIndex(k => k.tag === "SEX");
    r.kids.splice(at < 0 ? r.kids.length : at + 1, 0, b);
  }
  return r;
}

/* ---------- Person löschen ---------- */
async function deletePersonFlow(id) {
  const db = S.db, rec = db.get(id), p = GED.personInfo(db, id);
  const ok = await confirmDlg({
    title: "Person löschen?",
    text: GED.displayName(rec) + " wird gelöscht.\n\n" + (p.fams.length ? "Sie ist in " + p.fams.length + " Familie(n) als Ehepartner eingetragen. " : "") + (p.famc.length ? "Die Verknüpfung zu den Eltern wird entfernt. " : "") + "Familien, die dadurch leer werden, werden mit gelöscht. Mit „Rückgängig“ kannst du das zurücknehmen.",
    ok: "Person löschen", cls: "dng"
  });
  if (!ok) return false;
  const nextId = (p.fams[0] && GED.spouseIn(db, p.fams[0], id)) || (GED.parentsOf(db, id) && (GED.parentsOf(db, id).father || GED.parentsOf(db, id).mother)) || null;
  GED.run(db, "Person löschen", tx => GED.deleteRecord(tx, rec));
  S.pid = nextId && db.get(nextId) ? nextId : GED.startPerson(db);
  S.fid = setFamFor(S.pid);
  afterEdit("Person gelöscht");
  return true;
}

/* ---------- Quellen bearbeiten ---------- */
const MULTI = new Set(["TITL", "AUTH", "PUBL", "DETA", "TEXT"]);
function editSrc(id) {
  const db = S.db, rec = db.get(id);
  const w = {};
  SRC_FIELDS.forEach(([tag]) => { w[tag] = GED.unesc(GED.kval(rec, tag)); });
  openDlg({
    title: "Quelle bearbeiten", wide: true, data: { w },
    body: (d) => `<p class="hint" style="margin-top:0">Kennung ${E(id)}. Medien (Bilddateien) und weitere Felder bleiben unverändert erhalten.</p>` + SRC_FIELDS.map(([tag, label]) =>
      `<label class="fld"><span>${E(label)}</span>${MULTI.has(tag) ? `<textarea data-w="${tag}" style="min-height:${tag === "TEXT" ? 120 : 52}px">${E(d.data.w[tag])}</textarea>` : `<input data-w="${tag}" value="${E(d.data.w[tag])}">`}</label>`).join(""),
    buttons: () => [{ id: "raw", label: "GEDCOM-Text" }, { id: "cancel", label: "Abbrechen" }, { id: "save", label: "Speichern", cls: "pri" }],
    onInput: dlgInput,
    on: {
      cancel: (d) => d.close(),
      raw: (d) => { d.close(); rawEdit(id); },
      save: (d) => {
        try {
          GED.run(db, "Quelle ändern", tx => {
            tx.touch(rec);
            for (const [tag] of SRC_FIELDS) {
              const v = d.data.w[tag].replace(/\s+$/, "");
              const k = GED.kid(rec, tag);
              if (!v) { if (k) rec.kids.splice(rec.kids.indexOf(k), 1); }
              else if (k) k.val = GED.esc(v);
              else { const at = rec.kids.findIndex(x => ["OBJE", "NOTE", "CHAN"].includes(x.tag)); const n = { tag, val: GED.esc(v), kids: [] }; if (at < 0) rec.kids.push(n); else rec.kids.splice(at, 0, n); }
            }
          });
        } catch (err) { alert("Speichern nicht möglich: " + err.message); return; }
        d.close(); afterEdit("Quelle gespeichert");
      }
    }
  });
}
ACT.editSrc = (d) => editSrc(d.id);
ACT.newSrc = () => {
  const title = prompt("Titel der neuen Quelle:");

/* ============ FOTOS UND DOKUMENTE (liegen in Drive im Unterordner „Medien“) ============ */
const MEDIA_FOLDER = "Medien";
const M = { idx: null, loading: null, urls: new Map(), failed: new Set(), queue: [], running: 0 };
const IMG_RE = /\.(jpe?g|png|gif|webp|bmp)$/i, DOC_RE = /\.(pdf|txt)$/i;
const nfc = (s) => String(s || "").normalize("NFC");
const pathSegs = (p) => nfc(p).replace(/\\/g, "/").split("/").filter(s => s && s !== "~" && s !== ".");
const baseName = (p) => { const s = pathSegs(p); return s.length ? s[s.length - 1] : ""; };
const isMediaName = (n) => IMG_RE.test(n) || DOC_RE.test(n);

/* Speicherort der Pfadangabe: appProperties dürfen zusammen mit dem Schlüssel höchstens 124 Byte haben */
function relForDrive(segs) {
  const out = [];
  let bytes = 0;
  for (let i = segs.length - 1; i >= 0 && out.length < 4; i--) {
    const b = new TextEncoder().encode(segs[i]).length + (out.length ? 1 : 0);
    if (bytes + b > 110) break;
    out.unshift(segs[i]); bytes += b;
  }
  return out.join("/");
}

async function mediaFolder(create) {
  const main = await driveFolder();
  const q = encodeURIComponent(`name='${MEDIA_FOLDER}' and mimeType='application/vnd.google-apps.folder' and '${main}' in parents and trashed=false`);
  const res = await api(`${DRIVE}/files?q=${q}&spaces=drive&fields=files(id,name)`);
  if (res && res.files && res.files.length) return res.files[0].id;
  if (!create) return "";
  const c = await api(`${DRIVE}/files?fields=id`, { method: "POST", body: JSON.stringify({ name: MEDIA_FOLDER, mimeType: "application/vnd.google-apps.folder", parents: [main] }) });
  return c.id;
}
async function driveMediaList() {
  const folder = await mediaFolder(false);
  const list = [];
  if (folder) {
    let tok = "";
    do {
      const q = encodeURIComponent(`'${folder}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`);
      const res = await api(`${DRIVE}/files?q=${q}&spaces=drive&pageSize=1000&fields=nextPageToken,files(id,name,mimeType,size,appProperties)${tok ? "&pageToken=" + encodeURIComponent(tok) : ""}`);
      for (const f of (res && res.files) || []) list.push({ id: f.id, name: nfc(f.name), rel: pathSegs((f.appProperties && f.appProperties.rel) || f.name), mime: f.mimeType || "", size: +f.size || 0 });
      tok = res && res.nextPageToken || "";
    } while (tok);
  }
  return list;
}
async function loadMediaIdx(force) {
  if (S.viewer) return M.idx;
  if (!accessToken && !LM.list.length) return null;
  if (M.idx && !force) return M.idx;
  if (M.loading) return M.loading;
  M.loading = (async () => {
    let list = LM.list.slice();
    if (accessToken) { try { list = list.concat(await driveMediaList()); } catch (e) { if (!list.length) throw e; } }
    M.idx = list;
    return list;
  })();
  try { return await M.loading; } finally { M.loading = null; }
}

/* Zuordnung: gleicher Dateiname, bei mehreren Treffern gewinnt die längste gemeinsame Pfadendung */
function findMedia(path) {
  if (!M.idx) return null;
  const segs = pathSegs(path).map(s => s.toLowerCase());
  const nm = segs[segs.length - 1];
  if (!nm) return null;
  let best = null, bestScore = -1;
  for (const c of M.idx) {
    if (c.name.toLowerCase() !== nm) continue;
    const cs = c.rel.map(s => s.toLowerCase());
    let k = 0;
    while (k < cs.length && k < segs.length && cs[cs.length - 1 - k] === segs[segs.length - 1 - k]) k++;
    if (k > bestScore) { best = c; bestScore = k; }
  }
  return best;
}

/* Medien einer Person, Hauptbild (_PRIM Y) zuerst */
function mediaObjs(rec) {
  const o = GED.kidsOf(rec, "OBJE").map(x => ({ file: GED.kval(x, "FILE"), title: GED.kval(x, "TITL"), prim: /^y/i.test(GED.kval(x, "_PRIM") || "") }));
  o.sort((a, b) => (b.prim ? 1 : 0) - (a.prim ? 1 : 0));
  return o;
}
function mediaHtml(rec) {
  const objs = mediaObjs(rec);
  if (!objs.length) return "";
  const real = objs.filter(o => isMediaName(baseName(o.file)));
  const other = objs.length - real.length;
  if (!M.idx && (accessToken || LM.list.length) && !M.loading && !M.failed.has("idx")) {
    loadMediaIdx().then(() => { if (S.db) render._same = true, render(); }).catch(() => M.failed.add("idx"));
  }
  const MAX = 12;
  let h = `<div class="media"><div class="mhead">Medien (${objs.length})</div>`;
  const thumbs = [], miss = [];
  for (const o of real.slice(0, MAX)) {
    const hit = findMedia(o.file);
    const label = o.title || baseName(o.file);
    if (hit && IMG_RE.test(hit.name)) thumbs.push(`<button class="mth" data-act="mview" data-mid="${hit.id}" title="${E(label)}"><img data-mid="${hit.id}" alt="${E(label)}"><span>${E(label)}</span></button>`);
    else if (hit) thumbs.push(`<button class="mth doc" data-act="mview" data-mid="${hit.id}" title="${E(label)}"><b>${E(hit.name.split(".").pop().toUpperCase())}</b><span>${E(label)}</span></button>`);
    else miss.push(label);
  }
  if (thumbs.length) h += `<div class="mgrid">${thumbs.join("")}</div>`;
  if (miss.length) h += `<div class="mmiss">${M.idx ? (S.viewer ? "Nicht in der Ansicht enthalten" : "Nicht gefunden") : (accessToken ? "Lade Fotoliste …" : "Fotos erscheinen nach der Anmeldung bei Google Drive oder nach Wahl eines Medienordners")}: ${miss.map(E).join(", ")}</div>`;
  if (real.length > MAX) h += `<div class="mmiss">… und ${real.length - MAX} weitere</div>`;
  if (other) h += `<div class="mmiss">${other} Eintrag${other === 1 ? "" : "e"} ohne Bild- oder Dokumentdatei (z. B. Ordnerverweis)</div>`;
  return h + `</div>`;
}

/* Bilder laden: höchstens drei gleichzeitig, mit Anmeldetoken */
async function mediaBlobUrl(id) {
  if (M.urls.has(id)) return M.urls.get(id);
  if (String(id)[0] === "L") return lmUrl(id);
  if (String(id)[0] === "V") throw new Error("Foto nicht enthalten");
  const get = () => fetch(`${DRIVE}/files/${encodeURIComponent(id)}?alt=media`, { headers: { Authorization: "Bearer " + accessToken } });
  let r = await get();
  if (r.status === 401) { await requestToken(false).catch(() => requestToken(true)); r = await get(); }
  if (!r.ok) throw new Error("Drive " + r.status);
  const url = URL.createObjectURL(await r.blob());
  M.urls.set(id, url);
  return url;
}
function pumpMedia() {
  while (M.running < 3 && M.queue.length) {
    const job = M.queue.shift();
    M.running++;
    mediaThumbUrl(job.id).then(u => { if (document.body.contains(job.img)) job.img.src = u; }, () => { job.img.alt = "Laden fehlgeschlagen"; }).finally(() => { M.running--; pumpMedia(); });
  }
}
function hydrateMedia() {
  document.querySelectorAll("img[data-mid]:not([src])").forEach(img => {
    if (M.urls.has(img.dataset.mid)) img.src = M.urls.get(img.dataset.mid);
    else M.queue.push({ id: img.dataset.mid, img });
  });
  pumpMedia();
}

/* ---- Hochladen ---- */
async function shrinkJpeg(file, maxPx) {
  if (!/\.jpe?g$/i.test(file.name) || typeof createImageBitmap !== "function") return file;
  try {
    const bmp = await createImageBitmap(file);
    const m = Math.max(bmp.width, bmp.height);
    if (m <= maxPx) { bmp.close && bmp.close(); return file; }
    const k = maxPx / m, c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close && bmp.close();
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.88));
    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }
}
async function uploadOne(folder, name, relSegs, blob, mime) {
  const boundary = "stm" + Math.random().toString(36).slice(2);
  const metaJson = JSON.stringify({ name, parents: [folder], appProperties: { rel: relForDrive(relSegs) } });
  const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metaJson}\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`, blob, `\r\n--${boundary}--`]);
  return api(`${UPLOAD}/files?uploadType=multipart&fields=id,name,mimeType,size,appProperties`, { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body });
}
const guessMime = (n) => ({ jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif", webp: "image/webp", bmp: "image/bmp", pdf: "application/pdf", txt: "text/plain" })[n.split(".").pop().toLowerCase()] || "application/octet-stream";

async function uploadMedia(files, opts, onProgress) {
  const idx = await loadMediaIdx();
  const folder = await mediaFolder(true);
  const todo = [];
  let skippedType = 0;
  for (const f of files) {
    const segs = pathSegs(f.webkitRelativePath || f.name);
    const name = nfc(f.name);
    if (!isMediaName(name)) { skippedType++; continue; }
    const rel = relForDrive(segs).toLowerCase();
    const known = idx.some(c => !c.local && c.name.toLowerCase() === name.toLowerCase() && relForDrive(c.rel).toLowerCase() === rel);
    todo.push({ f, name, segs, known });
  }
  const st = { total: todo.length, done: 0, uploaded: 0, existed: 0, failed: [], skippedType };
  const work = todo.filter(t => { if (t.known) { st.done++; st.existed++; return false; } return true; });
  onProgress(st);
  let i = 0;
  async function worker() {
    while (i < work.length) {
      const t = work[i++];
      try {
        const blob = opts.shrink ? await shrinkJpeg(t.f, 2000) : t.f;
        const mime = guessMime(t.name);
        const r = await uploadOne(folder, t.name, t.segs, blob, mime);
        idx.push({ id: r.id, name: t.name, rel: pathSegs(r.appProperties && r.appProperties.rel || t.name), mime, size: +r.size || blob.size });
        st.uploaded++;
      } catch (e) { st.failed.push(t.name + " (" + (e.message || e).toString().slice(0, 80) + ")"); }
      st.done++;
      onProgress(st);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  return st;
}

function pickFiles(folderMode) {
  return new Promise(res => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.multiple = true;
    if (folderMode) inp.webkitdirectory = true;
    else inp.accept = "image/*,.pdf,.txt";
    inp.style.display = "none";
    inp.onchange = () => { res([...inp.files]); inp.remove(); };
    inp.oncancel = () => { res([]); inp.remove(); };
    document.body.appendChild(inp);
    inp.click();
  });
}

function mediaRefStats() {
  if (!S.db || !M.idx) return null;
  let refs = 0, found = 0; const missing = [];
  for (const r of S.db.ofTag("INDI")) {
    for (const o of mediaObjs(r)) {
      if (!isMediaName(baseName(o.file))) continue;
      refs++;
      if (findMedia(o.file)) found++; else missing.push(o.file);
    }
  }
  return { refs, found, missing };
}

      h += `</div>`;

    onChange: (d, e) => { if (e.target.id === "mShrink") { d.data.shrink = e.target.checked; lsSet("st.shrink", d.data.shrink ? "1" : "0"); } },

    }

      d.data.st = st;
    } catch (e) { d.data.err = e.message || String(e); }
    d.data.busy = false;
    if (document.body.contains(d.el)) d.paint();
    if (S.db) { render._same = true; render(); }
  }

    if (!accessToken) return;

  }
  if (accessToken) refresh(d);
  return d;
}

/* ============ ABGLEICH MIT PDF: Textauszug und Anweisung für ein KI-Chatfenster ============ */
const AB = { scope: "anc", gens: 3, task: "compare", hideLiving: true, note: "", pdfName: "" };

function abIsLiving(db, id) {
  const p = GED.personInfo(db, id);
  if (!p) return false;
  if (p.deat || p.buri) return false;
  if (GED.kidsOf(p.rec, "DEAT").length) return false;
  const y = (p.birt && p.birt.date.y) || (p.chr && p.chr.date.y);
  return !!y && y > new Date().getFullYear() - 110;
}
function abPersonIds(db, pid) {
  const out = new Set();
  const add = (id) => { if (id && db.get(id)) out.add(id); };
  add(pid);
  if (AB.scope === "family") {
    const p = GED.personInfo(db, pid);
    const par = GED.parentsOf(db, pid);
    if (par) { add(par.father); add(par.mother); GED.famInfo(db, par.fam).children.forEach(add); }
    for (const f of p.fams) { const fi = GED.famInfo(db, f); add(fi.husb); add(fi.wife); fi.children.forEach(add); }
  } else if (AB.scope === "anc") {
    for (const id of GED.ancestors(db, pid, AB.gens + 1).values()) add(id);
  } else if (AB.scope === "desc") {
    (function walk(id, g) {
      add(id);
      if (g >= AB.gens) return;
      for (const f of GED.personInfo(db, id).fams) {
        const fi = GED.famInfo(db, f);
        add(fi.husb); add(fi.wife);
        fi.children.forEach(c => walk(c, g + 1));
      }
    })(pid, 0);
  }
  return [...out];
}

function abExtract(db, ids) {
  const set = new Set(ids);
  const hide = (id) => AB.hideLiving && abIsLiving(db, id);
  const nm = (id) => hide(id) ? `lebende Person [${id.replace(/@/g, "")}]` : `${GED.displayName(db.get(id))} [${id.replace(/@/g, "")}]`;
  const dt = (e) => GED.formatDate(e.date.raw);
  const evLine = (e) => {
    let s = e.label + ": ";
    const bits = [];
    if (e.val && e.val.trim() && e.val.trim() !== "Y") bits.push(e.val.trim().replace(/\s*\n\s*/g, " "));
    if (dt(e) && dt(e).trim()) bits.push(dt(e).trim());
    if (e.place && e.place.trim()) bits.push("in " + e.place.trim());
    return bits.length ? s + bits.join(", ") : "";
  };
  const lines = [];
  for (const id of ids) {
    const p = GED.personInfo(db, id);
    if (!p) continue;
    if (hide(id)) { lines.push(`[${id.replace(/@/g, "")}] lebende Person, Angaben bewusst ausgelassen`, ""); continue; }
    lines.push(`[${id.replace(/@/g, "")}] ${GED.displayName(p.rec)}${p.sex === "M" ? ", männlich" : p.sex === "F" ? ", weiblich" : ""}`);
    for (const e of p.events) { const l = evLine(e); if (l) lines.push("  " + l); }
    const par = GED.parentsOf(db, id);
    if (par) lines.push("  Eltern: " + [par.father, par.mother].filter(Boolean).map(nm).join(" und "));
    for (const f of p.fams) {
      const fi = GED.famInfo(db, f);
      const sp = GED.spouseIn(db, f, id);
      let s = "  Ehe/Partnerschaft" + (sp ? " mit " + nm(sp) : "");
      const parts = fi.events.map(evLine).filter(Boolean);
      if (parts.length) s += "; " + parts.join("; ");
      if (fi.children.length) s += "; Kinder: " + fi.children.map(c => { const cp = GED.personInfo(db, c); const y = cp.birt && cp.birt.date.y; return nm(c) + (!hide(c) && y ? " (* " + y + ")" : ""); }).join(", ");
      lines.push(s);
    }
    const surn = [p.name.surn, p.name.given];
    for (const n of GED.kidsOf(p.rec, "NOTE")) {
      let t = GED.noteText(db, n).trim().replace(/\s*\n\s*/g, " ");
      if (!t || autoNote(t, surn)) continue;
      lines.push("  Notiz: " + (t.length > 500 ? t.slice(0, 500) + " …" : t));
    }
    const srcs = GED.kidsOf(p.rec, "SOUR").map(n => GED.isPtr(n.val) && db.get(n.val) ? srcTitle(n.val) : "").filter(Boolean);
    if (srcs.length) lines.push("  Quellen im Stammbaum: " + [...new Set(srcs)].slice(0, 8).join("; "));
    lines.push("");
  }
  return lines.join("\n").trim();
}

/* ============ ABGLEICH MIT EINER ZWEITEN GEDCOM-DATEI ============ */
const CMP = { db: null, name: "", pairs: null, onlyA: [], onlyB: [], filter: "diff", limit: 150, sel: null, err: "", busy: false };

const cf = (s) => GED.fold(String(s || ""));
const firstTok = (s) => cf(s).split(/[\s,.-]+/).filter(Boolean)[0] || "";
function cpInfo(db, id) {
  const p = GED.personInfo(db, id);
  const par = GED.parentsOf(db, id);
  const g = (x) => x && GED.personInfo(db, x) ? GED.personInfo(db, x) : null;
  const f = par ? g(par.father) : null, m = par ? g(par.mother) : null;
  const sp = p.fams.map(fi => GED.spouseIn(db, fi, id)).map(g).filter(Boolean);
  return {
    id, p,
    surn: cf(p.name.surn), givenToks: cf(p.name.given).split(/[\s,.-]+/).filter(Boolean),
    sex: p.sex || "",
    by: (p.birt && p.birt.date.y) || null, dy: (p.deat && p.deat.date.y) || null,
    bpl: p.birt ? firstTok(p.birt.place.split(",")[0]) : "",
    fGiven: f ? firstTok(f.name.given) : "", mGiven: m ? firstTok(m.name.given) : "",
    spouses: sp.map(s => firstTok(s.name.given) + "|" + cf(s.name.surn))
  };
}
function cpScore(a, b) {
  if (a.surn !== b.surn) return -1;
  if (a.sex && b.sex && a.sex !== b.sex) return -1;
  let s = 0;
  if (a.givenToks.length && b.givenToks.length) {
    const ov = a.givenToks.some(t => b.givenToks.includes(t));
    const pre = a.givenToks.some(t => b.givenToks.some(u => t.length >= 2 && u.length >= 2 && (t.startsWith(u) || u.startsWith(t))));
    const ini = a.givenToks[0][0] === b.givenToks[0][0];
    if (ov) s += 3; else if (pre) s += 2; else if (ini) s += 1; else return -1;
  }
  if (a.by && b.by) { const d = Math.abs(a.by - b.by); s += d === 0 ? 4 : d <= 1 ? 2 : d <= 2 ? 0 : -4; }
  if (a.dy && b.dy) { const d = Math.abs(a.dy - b.dy); s += d === 0 ? 3 : d <= 1 ? 1 : d <= 2 ? 0 : -3; }
  if (a.bpl && b.bpl && a.bpl === b.bpl) s += 1;
  if (a.fGiven && b.fGiven && a.fGiven === b.fGiven) s += 2;
  if (a.mGiven && b.mGiven && a.mGiven === b.mGiven) s += 2;
  if (a.spouses.some(x => b.spouses.includes(x))) s += 2;
  return s;
}

/* Vergleich einzelner Angaben */
const CP_EVENTS = [["BIRT", "Geburt"], ["CHR", "Taufe"], ["DEAT", "Tod"], ["BURI", "Bestattung"]];
function cpEvNode(p, tag) {
  const alt = tag === "CHR" ? ["CHR", "BAPM"] : tag === "BURI" ? ["BURI", "CREM"] : [tag];
  return p.rec.kids.find(k => alt.includes(k.tag)) || null;
}
const cpDateSig = (raw) => { const d = GED.parseDate(raw); return d.y ? [d.y, d.m || 0, d.d || 0] : null; };
function cpDateState(a, b) {            // gleich / anders / fehlt in A / fehlt in B / genauer in A / genauer in B
  const x = cpDateSig(a), y = cpDateSig(b);
  if (!x && !y) return (a || b) && cf(a) !== cf(b) ? "diff" : "same";
  if (!x) return y ? "missA" : "same";
  if (!y) return "missB";
  if (x[0] !== y[0]) return "diff";
  if (x[1] === y[1] && x[2] === y[2]) return "same";
  if (!x[1] && y[1]) return "moreB";
  if (!y[1] && x[1]) return "moreA";
  if (x[1] === y[1] && !x[2] && y[2]) return "moreB";
  if (x[1] === y[1] && !y[2] && x[2]) return "moreA";
  return "diff";
}
function cpPlaceState(a, b) {
  const x = cf(a.split(",")[0]), y = cf(b.split(",")[0]);
  if (!x && !y) return "same";
  if (!x) return "missA";
  if (!y) return "missB";
  return x === y ? "same" : "diff";
}
function cpFields(aId, bId) {
  const A = GED.personInfo(S.db, aId), B = GED.personInfo(CMP.db, bId), rows = [];
  rows.push({ key: "SEX", label: "Geschlecht", a: A.sex, b: B.sex, st: !A.sex && B.sex ? "missA" : A.sex && !B.sex ? "missB" : A.sex !== B.sex ? "diff" : "same", apply: true });
  for (const [tag, lab] of CP_EVENTS) {
    const an = cpEvNode(A, tag), bn = cpEvNode(B, tag);
    const ad = an ? GED.kval(an, "DATE") : "", bd = bn ? GED.kval(bn, "DATE") : "";
    const ap = an ? GED.unesc(GED.kval(an, "PLAC")) : "", bp = bn ? GED.unesc(GED.kval(bn, "PLAC")) : "";
    if (ad || bd) rows.push({ key: tag + ":DATE", label: lab + ", Datum", a: GED.formatDate(ad), b: GED.formatDate(bd), rawB: bd, st: cpDateState(ad, bd), apply: !!bd });
    if (ap || bp) rows.push({ key: tag + ":PLAC", label: lab + ", Ort", a: ap, b: bp, rawB: GED.kval(bn || { kids: [] }, "PLAC"), st: cpPlaceState(ap, bp), apply: !!bp });
  }
  const pa = GED.parentsOf(S.db, aId), pb = GED.parentsOf(CMP.db, bId);
  const nm = (db, id) => id && db.get(id) ? GED.displayName(db.get(id)) : "";
  for (const [lab, k] of [["Vater", "father"], ["Mutter", "mother"]]) {
    const x = nm(S.db, pa && pa[k]), y = nm(CMP.db, pb && pb[k]);
    if (x || y) rows.push({ key: "par:" + k, label: lab, a: x, b: y, st: !x ? "missA" : !y ? "missB" : cf(x) === cf(y) ? "same" : "diff", apply: false });
  }
  return rows;
}
const CP_ST = { same: "gleich", diff: "unterschiedlich", missA: "fehlt hier", missB: "fehlt in der Abgleichdatei", moreA: "hier genauer", moreB: "in der Abgleichdatei genauer" };

function cpMatch() {
  const ai = S.db.ofTag("INDI").map(r => cpInfo(S.db, r.xref));
  const bi = CMP.db.ofTag("INDI").map(r => cpInfo(CMP.db, r.xref));
  const bySurn = new Map();
  const cnt = (arr, withBy) => { const m = new Map(); for (const x of arr) { const k = x.surn + "|" + (x.givenToks[0] || "") + (withBy ? "|" + (x.by || "") : ""); m.set(k, (m.get(k) || 0) + 1); } return m; };
  const kk = (x, withBy) => x.surn + "|" + (x.givenToks[0] || "") + (withBy ? "|" + (x.by || "") : "");
  const nA = cnt(ai, false), nB = cnt(bi, false), yA = cnt(ai, true), yB = cnt(bi, true);
  const byId = new Map(); ai.forEach(x => byId.set("A" + x.id, x)); bi.forEach(x => byId.set("B" + x.id, x));
  for (const b of bi) { (bySurn.get(b.surn) || bySurn.set(b.surn, []).get(b.surn)).push(b); }
  const cand = [];
  for (const a of ai) {
    for (const b of bySurn.get(a.surn) || []) {
      const sc = cpScore(a, b);
      const uniqName = nA.get(kk(a, false)) === 1 && nB.get(kk(b, false)) === 1 && a.givenToks.length && b.givenToks.length && a.givenToks[0] === b.givenToks[0];
      if (sc >= 5 || (sc >= 3 && uniqName)) cand.push({ a: a.id, b: b.id, sc, uniqYear: a.by && yA.get(kk(a, true)) === 1 && yB.get(kk(b, true)) === 1 });
    }
  }
  cand.sort((x, y) => y.sc - x.sc);
  const usedA = new Set(), usedB = new Set(), pairs = [];
  for (const c of cand) {
    if (usedA.has(c.a) || usedB.has(c.b)) continue;
    usedA.add(c.a); usedB.add(c.b); pairs.push(c);
  }
  for (const p of pairs) {
    p.level = p.sc >= 9 || (p.sc >= 7 && p.uniqYear) ? "sure" : "prob";
    p.ndiff = cpFields(p.a, p.b).filter(r => r.st !== "same").length;
  }
  CMP.pairs = pairs;
  CMP.onlyA = ai.filter(x => !usedA.has(x.id)).map(x => x.id);
  CMP.onlyB = bi.filter(x => !usedB.has(x.id)).map(x => x.id);
}

async function cpLoad(buf, name) {
  const dec = GED.decode(buf);
  const db = GED.parseGedcom(dec.text, { bom: dec.bom });
  if (!db.ofTag("INDI").length) throw new Error("In der Abgleichdatei wurden keine Personen gefunden.");
  CMP.db = db; CMP.name = name; CMP.sel = null; CMP.limit = 150; CMP.filter = "diff";
  cpMatch();
}

      let h = `<div class="hint" style="margin:0 0 8px">Abgleichdatei: <b>${E(CMP.name)}</b> (${CMP.db.ofTag("INDI").length} Personen). ${sure} sichere und ${prob} wahrscheinliche Zuordnungen, ${CMP.onlyA.length} Personen nur hier, ${CMP.onlyB.length} nur in der Abgleichdatei. „Wahrscheinlich“ heißt: bitte selbst prüfen, ob es dieselbe Person ist.</div>

      if (list.total > CMP.limit) h += `<button class="btn" data-d="more">Mehr anzeigen</button>`;

    },
    buttons: () => CMP.db ? (CMP.sel ? [{ id: "back", label: "Zurück zur Liste" }, { id: "close", label: "Schließen" }] : [{ id: "other", label: "Andere Datei wählen" }, { id: "close", label: "Schließen" }]) : [{ id: "close", label: "Schließen" }],
    onChange: (dd, e) => { if (e.target.id === "cp_filter") { CMP.filter = e.target.value; CMP.limit = 150; dd.paint(); } },
    on: {
      pickLocal: async (dd) => {

        if (!f) return;
        await run(dd, () => f.arrayBuffer(), f.name);
      },
      pickDrive: async (dd) => { try { dd.data.files = await driveList(); } catch (e) { CMP.err = e.message; } dd.paint(); },
      loadDrive: async (dd, t) => {
        await run(dd, async () => {

          if (!r.ok) throw new Error("Drive " + r.status);
          return r.arrayBuffer();
        }, t.dataset.name);
      },
      other: (dd) => { CMP.db = null; CMP.pairs = null; CMP.sel = null; dd.paint(); },
      back: (dd) => { CMP.sel = null; dd.paint(); },
      more: (dd) => { CMP.limit += 150; dd.paint(); },
      open: (dd, t) => { CMP.sel = { a: t.dataset.a || null, b: t.dataset.b || null }; dd.paint(); },
      jump: (dd, t) => { dd.close(); go(t.dataset.a); },
      apply: (dd, t) => { cpApply(t.dataset.key, CMP.sel.a, CMP.sel.b); dd.paint(); }

  });
  async function run(dd, getBuf, name) {
    CMP.busy = true; CMP.err = ""; dd.paint();
    try { await cpLoad(await getBuf(), name); } catch (e) { CMP.err = e.message || String(e); CMP.db = null; }

  }

}

function cpFieldsOnly(b) {
  const B = GED.personInfo(CMP.db, b);
  const li = [];
  for (const e of B.events) { const bits = [GED.formatDate(e.date.raw), e.place, e.val && e.val !== "Y" ? e.val : ""].filter(Boolean); if (bits.length) li.push(`<li>${E(e.label)}: ${E(bits.join(", "))}</li>`); }
  return `<ul class="cites">${li.join("")}</ul>`;
}

function cpApply(key, aId, bId) {
  const rec = S.db.get(aId), B = GED.personInfo(CMP.db, bId);
  const label = "Abgleich: " + key;
  if (key === "SEX") {
    GED.run(S.db, label, tx => { tx.touch(rec); putKid(rec, "SEX", B.sex); });
  } else {
    const [tag, part] = key.split(":");
    const bn = cpEvNode(B, tag);
    if (!bn) return;
    const raw = GED.kval(bn, part);
    GED.run(S.db, label, tx => {
      tx.touch(rec);
      let ev = cpEvNode(GED.personInfo(S.db, aId), tag);
      if (!ev) {
        ev = { tag: bn.tag, val: "", kids: [] };
        const at = rec.kids.findIndex(k => ["FAMC", "FAMS", "NOTE", "SOUR", "OBJE", "CHAN"].includes(k.tag));
        if (at < 0) rec.kids.push(ev); else rec.kids.splice(at, 0, ev);
      }
      putKid(ev, part, raw);
    });
  }
  afterEdit("Übernommen: " + key.replace(":", " "));
}

/* ---- Pfad, der beim Anlegen in die .ged geschrieben wird (damit Reunion das Bild findet) ---- */
function guessMediaBase(tag) {
  const cnt = new Map();
  for (const r of S.db.ofTag(tag || "INDI")) for (const o of GED.kidsOf(r, "OBJE")) {
    const f = GED.kval(o, "FILE").replace(/\\/g, "/");
    const i = f.indexOf("/Reunion-Bilder/");
    const base = i >= 0 ? f.slice(0, i + "/Reunion-Bilder".length) : f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "";
    if (base) cnt.set(base, (cnt.get(base) || 0) + 1);
  }
  let best = "", n = 0;
  for (const [k, v] of cnt) if (v > n) { best = k; n = v; }
  return best;
}
function newFilePath(base, hit) {
  const segs = hit.rel.slice();
  const last = pathSegs(base).pop();
  if (last && segs.length > 1 && cf(segs[0]) === cf(last)) segs.shift();
  return (base ? base.replace(/\/+$/, "") + "/" : "") + segs.join("/");
}

          if (at < 0) at = rec.kids.length;
          rec.kids.splice(at, 0, ...out);
        });
        dd.close();
        afterEdit(isSrc ? "Dateien der Quelle geändert" : "Bilder geändert");
      }
    }
  });

}

/* ---- Orte mit Bildern: Zusatzdatei orte-bilder.json im Drive-Ordner ---- */
const PLACE_FILE = "orte-bilder.json";
const PL = { id: null, data: null, err: "" };
async function plLoad() {
  await ensureDrive();
  const main = await driveFolder();
  const q = encodeURIComponent(`name='${PLACE_FILE}' and '${main}' in parents and trashed=false`);
  const res = await api(`${DRIVE}/files?q=${q}&spaces=drive&fields=files(id)`);
  const f = res && res.files && res.files[0];
  PL.id = f ? f.id : null;
  PL.data = { v: 1, places: {} };
  if (f) {
    const r = await fetch(`${DRIVE}/files/${encodeURIComponent(f.id)}?alt=media`, { headers: { Authorization: "Bearer " + accessToken } });
    if (!r.ok) throw new Error("Drive " + r.status);
    try { const j = await r.json(); if (j && j.places) PL.data = j; } catch (e) { throw new Error("Die Datei " + PLACE_FILE + " in Drive ist nicht lesbar."); }
  }
}
async function plSave() {
  const body = JSON.stringify(PL.data);
  if (PL.id) {
    await api(`${UPLOAD}/files/${encodeURIComponent(PL.id)}?uploadType=media&fields=id`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
  } else {
    const main = await driveFolder();
    const boundary = "stp" + Math.random().toString(36).slice(2);
    const b = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: PLACE_FILE, parents: [main] })}\r\n--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`, body, `\r\n--${boundary}--`]);
    const r = await api(`${UPLOAD}/files?uploadType=multipart&fields=id`, { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body: b });
    PL.id = r.id;
  }
}
function plAggregate(db) {
  const m = new Map();
  const bump = (pl) => { pl = GED.unesc(pl).trim(); if (pl) m.set(pl, (m.get(pl) || 0) + 1); };
  for (const r of db.records) {
    if (r.tag !== "INDI" && r.tag !== "FAM") continue;
    for (const k of r.kids) { const p = GED.kid(k, "PLAC"); if (p) bump(p.val); }
  }
  return m;
}
function plGeo(db, name) {
  const r = db.records.find(x => x.tag === "_PLAC" && GED.unesc(x.val).trim() === name);
  if (!r) return null;
  const map = GED.kid(r, "MAP");
  return { lat: map && GED.kval(map, "LATI"), lon: map && GED.kval(map, "LONG"), note: GED.kidsOf(r, "NOTE").map(n => GED.noteText(db, n).trim()).filter(Boolean) };
}

const fmtT = (t) => t ? new Date(t).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const fmtClock = (t) => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

function recLabel(rec) {
  const id = rec.xref ? " [" + rec.xref.replace(/@/g, "") + "]" : "";
  try {
    if (rec.tag === "INDI") return "Person " + GED.displayName(rec) + id;
    if (rec.tag === "FAM") {
      const f = GED.famInfo(S.db, rec.xref), n = (x) => x ? GED.displayName(S.db.get(x)) : "?";
      return "Familie " + n(f.husb) + " und " + n(f.wife) + id;
    }
    if (rec.tag === "SOUR") return "Quelle " + srcTitle(rec.xref) + id;
  } catch (e) {}
  return rec.tag + id;
}
function snapshotOrig(db, name, bytes) {
  S.orig = { xrefs: new Set(db.records.filter(r => r.xref).map(r => r.xref)), indi: db.ofTag("INDI").length, fam: db.ofTag("FAM").length, sour: db.ofTag("SOUR").length, at: Date.now(), bytes, name };
  S.lastSave = null;
}
function changeSummary() {
  const o = S.orig || { xrefs: new Set(), indi: 0, fam: 0, sour: 0 };
  const cur = new Set(S.db.records.filter(r => r.xref).map(r => r.xref));
  const changed = [], added = [];
  for (const r of S.db.records) {
    if (!r.xref || !r.dirty) continue;
    (o.xrefs.has(r.xref) ? changed : added).push(r);
  }
  const deleted = [...o.xrefs].filter(x => !cur.has(x));
  return { changed, added, deleted, indi: S.db.ofTag("INDI").length, fam: S.db.ofTag("FAM").length, sour: S.db.ofTag("SOUR").length, o };
}

async function driveRead(id) {
  const get = () => fetch(`${DRIVE}/files/${encodeURIComponent(id)}?alt=media`, { headers: { Authorization: "Bearer " + accessToken } });

  if (r.status === 401) { await requestToken(false).catch(() => requestToken(true)); r = await get(); }

}

/* ============ BERICHTE ALS LATEX ============ */
const RP = { type: "fam", scope: "family", gens: 4, hideLiving: true, notes: true, sources: true, onlyCited: false, engine: "lua", title: "" };
const MONTHS_DE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const RP_TYPES = [
  ["fam", "Familienblätter (je Person ein Blatt mit Ereignissen, Eltern, Ehen, Kindern, Quellen)", true],
  ["bio", "Personenberichte (fortlaufender Text je Person)", true],
  ["anc", "Ahnentafel (Vorfahren mit Kekulé-Nummern)", false],
  ["desc", "Nachkommenliste (nummeriert nach d'Aboville)", false],
  ["idx", "Personenregister (alphabetisch)", true],
  ["pla", "Ortsregister (Orte mit Häufigkeit)", false],
  ["src", "Quellenverzeichnis (mit verknüpften Dateien)", false]
];

/* ---- Textaufbereitung ---- */
let RP_SAFE = false;   // pdfLaTeX: Zeichen außerhalb des unterstützten Bereichs vereinfachen
function safeChars(s) {
  if (!RP_SAFE) return s;
  let o = "";
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (c <= 0x17F || (c >= 0x2010 && c <= 0x2026) || c === 0x20AC) { o += ch; continue; }
    const b = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    o += /^[\x20-\x7e]+$/.test(b) ? b : "?";
  }
  return o;
}
function tx(s) {
  s = String(s == null ? "" : s).replace(/[\u{1D400}-\u{1D7FF}]/gu, (c) => c.normalize("NFKC")).replace(/[\u2080-\u2089]/g, (c) => String(c.charCodeAt(0) - 0x2080)).replace(/[\u00a0\u202f]/g, " ").replace(/\r/g, "");
  s = safeChars(s.normalize("NFC"));
  const map = { "\\": "\\textbackslash{}", "{": "\\{", "}": "\\}", "$": "\\$", "&": "\\&", "#": "\\#", "^": "\\^{}", "_": "\\_", "~": "\\~{}", "%": "\\%" };
  return s.replace(/[\\{}$&#^_~%]/g, (c) => map[c]).replace(/\n{2,}/g, "\n\n").replace(/\n/g, " ");
}
const txPar = (s) => String(s == null ? "" : s).split(/\n\s*\n/).map(p => tx(p.trim())).filter(Boolean).join("\n\n");
function longDate(raw) {
  raw = (raw || "").trim();
  if (!raw) return "";
  const m = /^(ABT|BEF|AFT|EST|CAL)\s+(.+)$/i.exec(raw);
  const pre = m ? { ABT: "um ", EST: "etwa ", CAL: "etwa ", BEF: "vor ", AFT: "nach " }[m[1].toUpperCase()] : "";
  const d = GED.parseDate(m ? m[2] : raw);
  if (d.y && !(m ? m[2] : raw).includes(" TO ") && /^(\d{1,2} )?([A-Z]{3} )?\d{1,4}$/i.test((m ? m[2] : raw).trim())) {
    return pre + (d.d ? d.d + ". " : "") + (d.m ? MONTHS_DE[d.m - 1] + " " : "") + d.y;
  }
  return GED.formatDate(raw);
}
const placeTxt = (p) => String(p || "").replace(/\s*,\s*/g, ", ").trim();

/* ---- Personenmenge ---- */
function rpIds(db, pid) {
  const out = new Set();
  const add = (id) => { if (id && db.get(id) && db.get(id).tag === "INDI") out.add(id); };
  const sc = RP.scope;
  if (sc === "all") db.ofTag("INDI").forEach(r => out.add(r.xref));
  else {
    add(pid);
    if (sc === "family") {
      const p = GED.personInfo(db, pid), par = GED.parentsOf(db, pid);
      if (par) { add(par.father); add(par.mother); GED.famInfo(db, par.fam).children.forEach(add); }
      for (const f of p.fams) { const fi = GED.famInfo(db, f); add(fi.husb); add(fi.wife); fi.children.forEach(add); }
    } else if (sc === "anc") {
      const m = GED.ancestors(db, pid, RP.gens);
      [...m.entries()].sort((a, b) => a[0] - b[0]).forEach(([, id]) => add(id));
    } else if (sc === "desc") {
      (function walk(id, g) {
        add(id);
        if (g >= RP.gens) return;
        for (const f of GED.personInfo(db, id).fams) { const fi = GED.famInfo(db, f); add(fi.husb); add(fi.wife); fi.children.forEach(c => walk(c, g + 1)); }
      })(pid, 1);
    }
  }
  return [...out];
}

/* ---- gemeinsame Bausteine ---- */
const R = {};
function living(id) { return RP.hideLiving && abIsLiving(S.db, id); }
function nm(id) { return living(id) ? "lebende Person" : GED.displayName(S.db.get(id)); }
function nmList(id) { return living(id) ? "lebende Person" : GED.displayName(S.db.get(id), "list"); }
const lifeTxt = (id) => living(id) ? "" : GED.lifeSpan(S.db, id).replace("–", "--");
function sortKey(id) { const p = GED.personInfo(S.db, id); return GED.fold((p.name.surn || "\uffff") + "|" + (p.name.given || "")); }
function evPhrase(e) {
  const bits = [];
  if (e.val && e.val.trim() && e.val.trim() !== "Y") bits.push(tx(e.val.trim().replace(/\s*\n\s*/g, " ")));
  const d = longDate(e.date.raw); if (d) bits.push(tx(d));
  if (e.place && e.place.trim()) bits.push("in " + tx(placeTxt(e.place)));
  return bits.join(", ");
}
function mkCtx() { return { n: 0, map: new Map() }; }
function cite(ctx, nodes) {
  if (!RP.sources) return "";
  const out = [];
  for (const n of nodes || []) {
    if (!GED.isPtr(n.val) || !S.db.get(n.val)) continue;
    let k = ctx.map.get(n.val);
    if (!k) { k = ++ctx.n; ctx.map.set(n.val, k); }
    out.push(k);
  }
  return out.length ? "\\textsuperscript{" + [...new Set(out)].join(",") + "}" : "";
}
function srcBlock(ctx) {
  if (!ctx.map.size) return "";
  const items = [...ctx.map.entries()].map(([id, k]) => {
    const r = S.db.get(id), a = GED.unesc(GED.kval(r, "AUTH")), t = srcTitle(id), ty = GED.unesc(GED.kval(r, "TYPE"));
    return `\\textsuperscript{${k}}~${tx(t)}${a ? ", " + tx(a) : ""}${ty ? " (" + tx(ty) + ")" : ""}`;
  });
  return `\n{\\small\\textbf{Quellen:} ${items.join("; ")}}\n`;
}
function evNotes(p, e) {
  if (!RP.notes) return "";
  const surn = [p.name.surn, p.name.given];
  const ts = e.notes.map(n => GED.noteText(S.db, n).trim()).filter(t => t && !autoNote(t, surn) && !/^[A-ZÄÖÜ][\wäöüß-]*(?: [\wäöüß-]+)? von /.test(t) && t.length < 400);
  return ts.length ? " \\emph{" + ts.map(t => tx(t)).join(" ") + "}" : "";
}
function lifeLine(p) {
  const b = p.birt, d = p.deat;
  const parts = [];
  if (b && (b.date.raw || b.place)) parts.push("\\textasteriskcentered{} " + [tx(longDate(b.date.raw)), b.place ? "in " + tx(placeTxt(b.place)) : ""].filter(Boolean).join(" "));
  if (d && (d.date.raw || d.place)) parts.push("\\textdagger{} " + [tx(longDate(d.date.raw)), d.place ? "in " + tx(placeTxt(d.place)) : ""].filter(Boolean).join(" "));
  return parts.join(", ");
}

/* ---- Familienblatt ---- */
R.fam = (ids, title) => {
  const db = S.db;
  const blocks = ids.slice().sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1).map(id => {
    const p = GED.personInfo(db, id), ctx = mkCtx();
    if (living(id)) return `\\section*{lebende Person}\n\\addcontentsline{toc}{section}{lebende Person [${tx(id.replace(/@/g, ""))}]}\nAngaben zu lebenden Personen sind bewusst ausgelassen.\n`;
    const head = `${tx(nm(id))}${lifeTxt(id) ? " (" + lifeTxt(id) + ")" : ""}`;
    let h = `\\section*{${head}}\n\\addcontentsline{toc}{section}{${head}}\n\\nopagebreak\n`;
    const rows = [];
    for (const e of sortedEvents(p.events)) {
      const ph = evPhrase(e);
      if (!ph && !(e.notes && e.notes.length && RP.notes)) continue;
      rows.push(`${tx(e.label)} & ${ph}${cite(ctx, e.sources)}${evNotes(p, e)} \\\\`);
    }
    if (rows.length) h += `\\begin{longtable}{@{}>{\\raggedright}p{3.2cm}p{11.8cm}@{}}\n${rows.join("\n")}\n\\end{longtable}\n`;
    const par = GED.parentsOf(db, id);
    if (par && (par.father || par.mother)) h += `\\textbf{Eltern:} ${[par.father, par.mother].filter(Boolean).map(x => tx(nm(x)) + (lifeTxt(x) ? " (" + lifeTxt(x) + ")" : "")).join(" und ")}\n\n`;
    for (const f of p.fams) {
      const fi = GED.famInfo(db, f), sp = GED.spouseIn(db, f, id);
      let line = `\\textbf{Ehe${sp ? " mit " + tx(nm(sp)) : ""}}${sp && lifeTxt(sp) ? " (" + lifeTxt(sp) + ")" : ""}`;
      const ev = fi.events.map(e => { const ph = evPhrase(e); return ph ? tx(e.label) + ": " + ph + cite(ctx, e.sources) : ""; }).filter(Boolean);
      if (ev.length) line += ". " + ev.join("; ");
      h += line + "\n";
      if (fi.children.length) {
        h += `\\begin{itemize}[noitemsep,topsep=2pt,leftmargin=1.4em]\n` + fi.children.map(c => { const cp = GED.personInfo(db, c), y = cp.birt && cp.birt.date.y; return `\\item ${tx(nm(c))}${!living(c) && y ? " (\\textasteriskcentered{} " + y + ")" : ""}`; }).join("\n") + `\n\\end{itemize}\n`;
      } else h += "\n";
    }
    if (RP.notes) {
      const surn = [p.name.surn, p.name.given];
      const ns = GED.kidsOf(p.rec, "NOTE").map(n => GED.noteText(db, n).trim()).filter(t => t && !autoNote(t, surn));
      if (ns.length) h += `\\textbf{Notizen:} {\\small ${ns.map(txPar).join("\n\n")}}\n\n`;
      const ds = GED.kidsOf(p.rec, "SOUR");
      h += "";
    }
    const pc = cite(ctx, GED.kidsOf(p.rec, "SOUR"));
    if (pc) h += `Quellen zur Person: ${pc}\n`;
    return h + srcBlock(ctx);
  });
  return blocks.join("\n\\bigskip\n");
};

/* ---- Personenbericht (Fließtext) ---- */
R.bio = (ids) => {
  const db = S.db;
  return ids.slice().sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1).map(id => {
    if (living(id)) return "";
    const p = GED.personInfo(db, id), ctx = mkCtx(), name = nm(id);
    const he = p.sex === "F" ? "sie" : p.sex === "M" ? "er" : name, He = he[0].toUpperCase() + he.slice(1);
    const poss = p.sex === "F" ? "Ihre" : p.sex === "M" ? "Seine" : "Die";
    const S_ = [];
    const ev = (tag) => p.events.find(e => tag.includes(e.tag));
    const when = (e) => { const d = longDate(e.date.raw); return d ? (/^(um|vor|nach|etwa) /.test(d) ? d + " " : "am " + d + " ") : ""; };
    const sentence = (e, verb) => {
      const d = e.date.raw ? longDate(e.date.raw) : "", pl = e.place ? placeTxt(e.place) : "";
      if (!d && !pl) return "";
      const dp = d ? (/^(um|vor|nach|etwa) /.test(d) ? tx(d) : /^\d{4}$/.test(d) ? "im Jahr " + tx(d) : /^[A-ZÄÖÜ][a-zä]+ \d{4}$/.test(d) ? "im " + tx(d) : "am " + tx(d)) : "";
      return [dp, pl ? "in " + tx(pl) : ""].filter(Boolean).join(" ") + cite(ctx, e.sources);
    };
    const b = ev(["BIRT"]);
    if (b) { const s = sentence(b); if (s) S_.push(`${tx(name)} wurde ${s} geboren.`); }
    const par = GED.parentsOf(db, id);
    if (par && (par.father || par.mother)) {
      const pf = par.father ? tx(nm(par.father)) : "", pm = par.mother ? tx(nm(par.mother)) : "";
      S_.push(pf && pm ? `${poss} Eltern waren ${pf} und ${pm}.` : pf ? `${poss} Vater war ${pf}.` : `${poss} Mutter war ${pm}.`);
    }
    const c = ev(["CHR", "BAPM"]);
    if (c) { const s = sentence(c); if (s) S_.push(`Getauft wurde ${he} ${s}.`); }
    for (const e of p.events.filter(e => ["OCCU", "BERUF"].includes(e.tag))) { const v = (e.val || "").trim().replace(/\s*\n\s*/g, " "); if (v && v !== "Y") S_.push(`Als Beruf ist ${tx(v)}${e.date.raw ? " (" + tx(longDate(e.date.raw)) + ")" : ""} angegeben${cite(ctx, e.sources)}.`); }
    const res = p.events.filter(e => e.tag === "RESI" && (e.place || "").trim());
    if (res.length) S_.push(`Als Wohnorte sind überliefert: ${res.map(e => tx(placeTxt(e.place)) + (e.date.raw ? " (" + tx(longDate(e.date.raw)) + ")" : "") + cite(ctx, e.sources)).join("; ")}.`);
    for (const e of p.events.filter(e => e.tag === "RELI" && (e.val || "").trim())) S_.push(`Religion: ${tx(e.val.trim())}.`);
    for (const f of p.fams) {
      const fi = GED.famInfo(db, f), sp = GED.spouseIn(db, f, id), m = fi.marr;
      const who = sp ? ` ${tx(nm(sp))}${!living(sp) && lifeTxt(sp) ? " (" + lifeTxt(sp) + ")" : ""}` : "";
      const ms = m ? sentence(m) : "";
      if (sp || ms) S_.push(`${He} heiratete${ms ? " " + ms : ""}${who ? " " + who.trim() : ""}.`.replace("heiratete  ", "heiratete "));
      if (fi.children.length) {
        const kids = fi.children.map(k => { const cp = GED.personInfo(db, k), y = cp.birt && cp.birt.date.y; return tx(nm(k)) + (!living(k) && y ? " (\\textasteriskcentered{} " + y + ")" : ""); });
        S_.push(`Aus ${fi.children.length === 1 && !sp ? "dieser Verbindung" : "dieser Ehe"} ${fi.children.length === 1 ? "ging ein Kind" : "gingen " + fi.children.length + " Kinder"} hervor: ${kids.join(", ")}.`);
      }
    }
    const d = ev(["DEAT"]);
    if (d) { const s = sentence(d); if (s) S_.push(`${He} starb ${s}.`); else if (d.val === "Y") S_.push(`${He} ist verstorben.`); }
    const bu = ev(["BURI", "CREM"]);
    if (bu) { const s = sentence(bu); if (s) S_.push(`${bu.tag === "CREM" ? "Die Einäscherung" : "Die Bestattung"} fand ${s} statt.`); }
    if (RP.notes) {
      const surn = [p.name.surn, p.name.given];
      const ns = GED.kidsOf(p.rec, "NOTE").map(n => GED.noteText(db, n).trim()).filter(t => t && !autoNote(t, surn));
      ns.forEach(t => S_.push("\n\n" + txPar(t) + "\n\n"));
    }
    const head = `${tx(name)}${lifeTxt(id) ? " (" + lifeTxt(id) + ")" : ""}`;
    return `\\section*{${head}}\n\\addcontentsline{toc}{section}{${head}}\n${S_.join(" ").replace(/ \n\n/g, "\n\n").replace(/\n\n /g, "\n\n")}${srcBlock(ctx)}\n`;
  }).filter(Boolean).join("\n\\bigskip\n");
};

/* ---- Ahnentafel ---- */
R.anc = (ids, title, pid) => {
  const db = S.db, m = GED.ancestors(db, pid, RP.gens);
  const rows = [...m.entries()].sort((a, b) => a[0] - b[0]);
  let h = "", curG = 0, open = false;
  for (const [k, id] of rows) {
    const g = Math.floor(Math.log2(k)) + 1;
    if (g !== curG) {
      if (open) h += "\\end{longtable}\n";
      curG = g;
      const lab = g === 1 ? "Generation 1: Probandin oder Proband" : `Generation ${g}: ${g === 2 ? "Eltern" : g === 3 ? "Großeltern" : g === 4 ? "Urgroßeltern" : g === 5 ? "Ururgroßeltern" : "Vorfahren"}`;
      h += `\\subsection*{${lab}}\n\\begin{longtable}{@{}r>{\\raggedright}p{5.2cm}>{\\raggedright}p{4.2cm}>{\\raggedright}p{4.2cm}@{}}\n\\textbf{Nr.} & \\textbf{Name} & \\textbf{Geboren} & \\textbf{Gestorben} \\tabularnewline \\hline\n\\endhead\n`;
      open = true;
    }
    const p = GED.personInfo(db, id);
    const bd = (e) => living(id) || !e ? "" : [tx(longDate(e.date.raw)), e.place ? tx(placeTxt(e.place)) : ""].filter(Boolean).join(", ");
    h += `${k} & ${tx(nm(id))} & ${bd(p.birt)} & ${bd(p.deat)} \\tabularnewline\n`;
  }
  if (open) h += "\\end{longtable}\n";
  return h || "Keine Vorfahren erfasst.\n";
};

/* ---- Nachkommenliste ---- */
R.desc = (ids, title, pid) => {
  const db = S.db, lines = [];
  (function walk(id, num, g) {
    const p = GED.personInfo(db, id);
    const sps = p.fams.map(f => { const sp = GED.spouseIn(db, f, id); return sp ? tx(nm(sp)) : ""; }).filter(Boolean);
    lines.push(`\\par\\noindent\\hspace*{${Math.min(g, 10) * 0.9}em}\\hangindent=${(Math.min(g, 10) * 0.9 + 1.8).toFixed(1)}em\\hangafter=1 \\textbf{${num}}~${tx(nm(id))}${lifeTxt(id) ? " (" + lifeTxt(id) + ")" : ""}${sps.length ? "\\ \\ \\ensuremath{\\infty}~" + sps.join("; ") : ""}`);
    if (g >= RP.gens) return;
    let i = 0;
    for (const f of p.fams) for (const c of GED.famInfo(db, f).children) walk(c, num + "." + (++i), g + 1);
  })(pid, "1", 0);
  return `\\begingroup\\setlength{\\parskip}{0.15em}\\small\n${lines.join("\n")}\n\\endgroup\n`;
};

/* ---- Personenregister ---- */
R.idx = (ids) => {
  const sorted = ids.slice().filter(id => !living(id)).sort((a, b) => sortKey(a) < sortKey(b) ? -1 : 1);
  const lv = ids.length - sorted.length;
  return `\\begin{multicols}{2}\\raggedright\\small\n${sorted.map(id => `\\textbf{${tx(nmList(id).split(",")[0])}}${nmList(id).includes(",") ? "," + tx(nmList(id).slice(nmList(id).indexOf(",") + 1)) : ""}${lifeTxt(id) ? " (" + lifeTxt(id) + ")" : ""}\\par`).join("\n")}\n\\end{multicols}\n${lv ? `\n{\\small ${lv} lebende Personen sind nicht aufgeführt.}\n` : ""}`;
};

/* ---- Ortsregister ---- */
R.pla = () => {
  const m = plAggregate(S.db);
  const rows = [...m.entries()].sort((a, b) => GED.fold(a[0]) < GED.fold(b[0]) ? -1 : 1);
  return `\\begin{multicols}{2}\\raggedright\\small\n${rows.map(([n, c]) => `${tx(placeTxt(n))} \\dotfill ${c}\\par`).join("\n")}\n\\end{multicols}\n`;
};

/* ---- Quellenverzeichnis ---- */
R.src = () => {
  const db = S.db, ci = GED.citationIndex(db);
  let list = sourceList().slice();
  if (RP.onlyCited) list = list.filter(s => (ci.get(s.id) || []).length);
  list.sort((a, b) => GED.fold(GED.kval(db.get(a.id), "AUTH") + " " + a.t) < GED.fold(GED.kval(db.get(b.id), "AUTH") + " " + b.t) ? -1 : 1);
  return list.map(s => {
    const r = db.get(s.id), g = (t) => GED.unesc(GED.kval(r, t)).replace(/\s*\n\s*/g, " ").trim();
    const bits = [];
    if (g("AUTH")) bits.push(tx(g("AUTH")));
    if (g("TYPE")) bits.push("Art: " + tx(g("TYPE")));
    const pd = [g("PLAC"), g("DATE")].filter(Boolean).join(", "); if (pd) bits.push(tx(pd));
    if (g("PUBL")) bits.push(tx(g("PUBL")));
    if (g("REGI")) bits.push("Register: " + tx(g("REGI")));
    const repo = g("REPO") || g("_REPO"); if (repo) bits.push("Archiv: " + tx(repo));
    if (g("FILN")) bits.push("Signatur: " + tx(g("FILN")));
    if (g("DETA") && g("DETA") !== g("TITL")) bits.push(tx(g("DETA")));
    const files = GED.kidsOf(r, "OBJE").map(o => GED.kval(o, "FILE").split("/").pop()).filter(Boolean);
    const n = (ci.get(s.id) || []).length;
    let h = `\\noindent\\textbf{${tx(s.t)}}\\par\n`;
    if (bits.length) h += bits.join(". ") + ".\\par\n";
    if (files.length) h += `Dateien: ${files.map(f => "\\texttt{" + tx(f) + "}").join(", ")}\\par\n`;
    h += `{\\footnotesize Zitiert von ${n} Stellen\\ \\ [${tx(s.id.replace(/@/g, ""))}]}\\par\n`;
    if (RP.notes && g("TEXT")) h += `{\\small\\emph{${tx(g("TEXT").slice(0, 1500))}${g("TEXT").length > 1500 ? " …" : ""}}}\\par\n`;
    return h;
  }).join("\\medskip\n");
};

function texDocument(bodyTitle, body, pid) {
  const t = (RP.title || bodyTitle);
  return `% Erzeugt aus ${tx(S.fileName)} am ${fmtT(Date.now())}
% Übersetzen mit LuaLaTeX, XeLaTeX oder pdfLaTeX (zweimal, wegen des Inhaltsverzeichnisses)
\\documentclass[11pt,a4paper]{article}
\\usepackage{iftex}
\\ifPDFTeX
  \\usepackage[utf8]{inputenc}
  \\usepackage[T1]{fontenc}
  \\IfFileExists{lmodern.sty}{\\usepackage{lmodern}}{}
\\else
  \\usepackage{fontspec}
\\fi
\\usepackage[ngerman]{babel}
\\usepackage[a4paper,margin=2.2cm]{geometry}
\\usepackage{longtable,array,multicol,enumitem,textcomp}
\\usepackage[hidelinks]{hyperref}
\\setlength{\\parindent}{0pt}
\\setlength{\\parskip}{0.5em}
\\renewcommand{\\arraystretch}{1.15}
\\title{${tx(t)}}
\\author{Quelle: ${tx(S.fileName)}}
\\date{\\today}
\\begin{document}
\\maketitle
${/^(fam|bio)$/.test(RP.type) ? "\\tableofcontents\n\\newpage\n" : ""}${body}
\\end{document}
`;
}

function rpBuild() {
  RP_SAFE = RP.engine === "pdf";
  const pid = S.pid, type = RP.type;
  const ids = RP_TYPES.find(x => x[0] === type)[2] ? rpIds(S.db, pid) : [];
  const names = { fam: "Familienblätter", bio: "Personenberichte", anc: "Ahnentafel von " + nm(pid), desc: "Nachkommen von " + nm(pid), idx: "Personenregister", pla: "Ortsregister", src: "Quellenverzeichnis" };
  const body = R[type](ids, names[type], pid);
  return { tex: texDocument(names[type], body, pid), n: ids.length };
}

function openReports() {
  if (!needDb()) return;
  const pid = S.pid;
  const d = openDlg({
    title: "Berichte als LaTeX", wide: true, noFocus: true, data: {},
    body: (dd) => {
      let r;
      try { r = rpBuild(); } catch (e) { r = { tex: "% Fehler beim Erzeugen: " + e.message, n: 0 }; }
      dd.data.last = r;
      const persons = RP_TYPES.find(x => x[0] === RP.type)[2];
      const sel = (v, c) => v === c ? " selected" : "";
      const chk = (id, v, t) => `<label class="fld"><span><input type="checkbox" id="${id}" ${v ? "checked" : ""} style="width:auto"> ${t}</span></label>`;
      return `<p style="margin-top:0">Der Bericht entsteht als fertige .tex-Datei, die du mit LuaLaTeX, XeLaTeX oder pdfLaTeX übersetzen kannst. Ausgangsperson für Ahnentafel, Nachkommen und Bereiche: <b>${E(nameOf(pid))}</b>.</p>
      <div class="frow"><label class="fld"><span>Bericht</span><select id="rp_type">${RP_TYPES.map(([v, t]) => `<option value="${v}"${sel(v, RP.type)}>${E(t)}</option>`).join("")}</select></label>
      ${persons ? `<label class="fld"><span>Welche Personen</span><select id="rp_scope"><option value="one"${sel("one", RP.scope)}>Nur die Ausgangsperson</option><option value="family"${sel("family", RP.scope)}>Kernfamilie</option><option value="anc"${sel("anc", RP.scope)}>Vorfahren</option><option value="desc"${sel("desc", RP.scope)}>Nachkommen</option><option value="all"${sel("all", RP.scope)}>Alle Personen der Datei</option></select></label>` : ""}
      ${(RP.type === "anc" || RP.type === "desc" || (persons && (RP.scope === "anc" || RP.scope === "desc"))) ? `<label class="fld"><span>Generationen</span><select id="rp_gens">${[2, 3, 4, 5, 6, 7, 8, 10].map(g => `<option${g === RP.gens ? " selected" : ""}>${g}</option>`).join("")}</select></label>` : ""}</div>
      <label class="fld"><span>Titel (optional)</span><input id="rp_title" value="${E(RP.title)}"></label>
      ${chk("rp_hide", RP.hideLiving, "Lebende Personen nicht ausgeben (Personen ohne Sterbedatum, geboren in den letzten 110 Jahren)")}
      ${/^(fam|bio)$/.test(RP.type) ? chk("rp_src", RP.sources, "Quellenangaben als hochgestellte Nummern mit Quellenliste") : ""}
      ${/^(fam|bio|src)$/.test(RP.type) ? chk("rp_notes", RP.notes, "Notizen und Quellentexte einbeziehen") : ""}
      ${RP.type === "src" ? chk("rp_cited", RP.onlyCited, "Nur Quellen, die irgendwo zitiert werden") : ""}
      <label class="fld"><span>Übersetzer</span><select id="rp_eng"><option value="lua"${sel("lua", RP.engine)}>LuaLaTeX oder XeLaTeX (empfohlen, alle Zeichen)</option><option value="pdf"${sel("pdf", RP.engine)}>pdfLaTeX (seltene Zeichen werden vereinfacht)</option></select></label>
      <div class="hint">${r.n ? r.n + " Personen. " : ""}${r.tex.length.toLocaleString("de-DE")} Zeichen, ${r.tex.split("\n").length.toLocaleString("de-DE")} Zeilen.${r.n > 400 ? " Das ergibt einen langen Bericht; die Vorschau unten ist trotzdem vollständig." : ""}</div>
      <label class="fld"><span>LaTeX-Code</span><textarea id="rp_out" rows="12" readonly style="font:12px/1.4 ui-monospace,monospace" wrap="off">${E(r.tex)}</textarea></label>`;
    },
    buttons: () => [{ id: "copy", label: "Code kopieren", cls: "pri" }, { id: "save", label: ".tex-Datei herunterladen" }, { id: "close", label: "Schließen" }],
    onChange: (dd, e) => {
      const id = e.target.id;
      if (id === "rp_type") RP.type = e.target.value;
      else if (id === "rp_scope") RP.scope = e.target.value;
      else if (id === "rp_gens") RP.gens = +e.target.value;
      else if (id === "rp_hide") RP.hideLiving = e.target.checked;
      else if (id === "rp_src") RP.sources = e.target.checked;
      else if (id === "rp_notes") RP.notes = e.target.checked;
      else if (id === "rp_cited") RP.onlyCited = e.target.checked;
      else if (id === "rp_eng") RP.engine = e.target.value;
      else return;
      dd.paint();
    },
    onInput: (dd, e) => { if (e.target.id === "rp_title") { RP.title = e.target.value; const r = rpBuild(); dd.data.last = r; dd.q("#rp_out").value = r.tex; } },
    on: {
      copy: async (dd) => {
        const t = dd.data.last.tex;
        try { await navigator.clipboard.writeText(t); toast("LaTeX-Code kopiert"); }
        catch (e) { const ta = dd.q("#rp_out"); ta.removeAttribute("readonly"); ta.select(); const ok = document.execCommand && document.execCommand("copy"); ta.setAttribute("readonly", ""); toast(ok ? "Kopiert" : "Kopieren nicht möglich, bitte selbst markieren"); }
      },
      save: (dd) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([dd.data.last.tex], { type: "application/x-tex;charset=utf-8" }));
        a.download = "bericht-" + RP.type + "-" + S.fileName.replace(/\.ged$/i, "") + "-" + stamp() + ".tex";
        document.body.appendChild(a); a.click(); a.remove();
      }
    }
  });
  return d;
}

/* ============ LOKALE HAUPTDATEI, MEDIENORDNER, DRIVE-SICHERUNG, VIEWER ============ */
const IDB = {
  p: null,
  open() {
    if (!this.p) this.p = new Promise((res, rej) => {
      try {
        const r = indexedDB.open("stammbaum", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return this.p;
  },
  async get(k) {
    try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; }
  },
  async set(k, v) {
    try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; }
  }
};
const FS = { ok: typeof window.showOpenFilePicker === "function", dirOk: typeof window.showDirectoryPicker === "function" };
const GED_TYPES = [{ description: "GEDCOM-Datei", accept: { "text/plain": [".ged", ".gedcom", ".txt"] } }];
async function fsPerm(h, write) {
  const o = { mode: write ? "readwrite" : "read" };
  if ((await h.queryPermission(o)) === "granted") return true;
  return (await h.requestPermission(o)) === "granted";
}
const fmtAgo = (t) => {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return "gerade eben";
  if (m < 90) return "vor " + m + " Minuten";
  const h = Math.round(m / 60);
  if (h < 36) return "vor " + h + " Stunden";
  const d = Math.round(h / 24);
  return "vor " + d + " Tagen";
};

const LM = { dir: null, dirs: [], pending: [], list: [], byId: new Map(), at: 0, busy: false };
const lmSync = () => { LM.dir = LM.dirs[0] || null; };
const lmSave = () => IDB.set("mdirs", LM.dirs.concat(LM.pending));
M.thumbs = new Map();
async function lmScan() {
  if (!LM.dirs.length) { LM.list = []; LM.byId = new Map(); M.idx = null; return; }
  LM.busy = true;
  try {
    const out = []; let n = 0;
    const walk = async (dir, segs) => {
      for await (const [name, h] of dir.entries()) {
        if (name.startsWith(".")) continue;
        if (h.kind === "directory") await walk(h, segs.concat(nfc(name)));
        else if (isMediaName(name)) out.push({ id: "L" + (n++), name: nfc(name), rel: segs.concat(nfc(name)), mime: guessMime(name), size: 0, handle: h, local: true });
      }
    };
    for (const dr of LM.dirs) await walk(dr, [nfc(dr.name)]);
    for (const [id, u] of M.urls) if (id[0] === "L") { URL.revokeObjectURL(u); M.urls.delete(id); }
    for (const [id, u] of M.thumbs) { URL.revokeObjectURL(u); }
    M.thumbs.clear();
    LM.list = out; LM.byId = new Map(out.map(e => [e.id, e])); LM.at = Date.now(); M.idx = null;
    await zusFromDir();
  } finally { LM.busy = false; }
}

}

async function lmAllow() {

async function lmUrl(id) {
  if (M.urls.has(id)) return M.urls.get(id);
  const e = LM.byId.get(id);
  if (!e) throw new Error("Die Datei liegt nicht mehr im Medienordner");
  const f = await e.handle.getFile();
  const u = URL.createObjectURL(f);
  M.urls.set(id, u);
  return u;
}
async function mediaThumbUrl(id) {
  if (String(id)[0] !== "L") return mediaBlobUrl(id);
  if (M.thumbs.has(id)) return M.thumbs.get(id);
  const e = LM.byId.get(id);
  if (!e || !IMG_RE.test(e.name)) return mediaBlobUrl(id);
  const f = await e.handle.getFile();
  let u;
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 360 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close && bmp.close();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
    u = URL.createObjectURL(blob || f);
  } catch (err) { u = URL.createObjectURL(f); }
  M.thumbs.set(id, u);
  return u;
}

async function driveUpsertJson(name, text) {
  const main = await driveFolder();
  const q = encodeURIComponent(`name='${name}' and '${main}' in parents and trashed=false`);
  const res = await api(`${DRIVE}/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const f = res && res.files && res.files.find(x => x.name === name && /\.json$/i.test(x.name));
  if (f) { await api(`${UPLOAD}/files/${encodeURIComponent(f.id)}?uploadType=media&fields=id`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: text }); return; }
  const boundary = "stz" + Math.random().toString(36).slice(2);
  const b = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name, parents: [main] })}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`, text, `\r\n--${boundary}--`]);
  await api(`${UPLOAD}/files?uploadType=multipart&fields=id`, { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body: b });
}
/* Alben und Koordinaten: ein neuerer oder inhaltsreicherer Stand in Drive wird nie durch einen leeren oder älteren lokalen Stand ersetzt */
async function zusBackup() {
  const main = await driveFolder();
  const q = encodeURIComponent(`name='stammbaum-zusatz.json' and '${main}' in parents and trashed=false`);
  const r = await api(`${DRIVE}/files?q=${q}&spaces=drive&fields=files(id,name)`);
  const f = r && r.files && r.files.find(x => x.name === "stammbaum-zusatz.json");
  if (f) {
    let j = null;
    try { j = JSON.parse(new TextDecoder().decode(await driveRead(f.id))); } catch (e) {}
    if (j) {
      const n = (x) => (x.albums || []).length + Object.keys(x.geo || {}).length;
      if ((j.at || 0) > (ZUS.data.at || 0) || (n(j) > 0 && n(ZUS.data) === 0)) return false;
    }
  }
  await driveUpsertJson("stammbaum-zusatz.json", JSON.stringify(ZUS.data));
  return true;
}
/* Lesefassung für die Ansicht: eine JSON-Datei im Drive-Ordner, die bei jeder Sicherung ersetzt wird (nie eine .ged-Datei) */
const VIEW_FILE = "stammbaum-ansicht.json";

async function syncMedia(onProg) {
  const folder = await mediaFolder(true);
  const remote = await driveMediaList();
  const key = (name, segs) => name.toLowerCase() + "|" + relForDrive(segs).toLowerCase();
  const rmap = new Map(remote.map(r => [key(r.name, r.rel), r]));
  const st = { total: LM.list.length, done: 0, uploaded: 0, updated: 0, same: 0, failed: [] };
  let i = 0;
  async function worker() {
    while (i < LM.list.length) {
      const e = LM.list[i++];
      try {
        const f = await e.handle.getFile();
        const k = key(e.name, e.rel), r = rmap.get(k);
        if (r && r.size === f.size) st.same++;
        else if (r) {
          await api(`${UPLOAD}/files/${encodeURIComponent(r.id)}?uploadType=media&fields=id,size`, { method: "PATCH", headers: { "Content-Type": e.mime }, body: f });
          r.size = f.size; st.updated++;
        } else {
          const up = await uploadOne(folder, e.name, e.rel, f, e.mime);
          rmap.set(k, { id: up.id, size: f.size }); st.uploaded++;
        }
      } catch (err) { st.failed.push(e.rel.join("/") + " (" + String(err.message || err).slice(0, 80) + ")"); }
      st.done++;
      if (onProg && (st.done % 4 === 0 || st.done === st.total)) onProg(Object.assign({}, st));
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  M.idx = null;
  return st;
}
async function runBackup(onProg) {
  if (BK.busy || !S.db) return null;
  BK.busy = true; BK.msg = "";
  const say = (m) => { BK.msg = m; renderStatus(); onProg && onProg(m); };
  const res = { at: Date.now(), ged: null, media: null, err: null, trashed: 0, withMedia: false };
  renderStatus();
  try {
    await ensureDrive();
    const cfg = bkCfg();
    const bytes = await currentFileBytes();
    const base = S.fileName.replace(/\.(ged|gedcom|txt)$/i, "");
    const name = `${base}-sicherung-${stamp()}.ged`;
    say("Datei wird übertragen");
    const r = await driveUploadNew(name, bytes);
    if (r.size != null && +r.size !== bytes.length) throw new Error(`Drive meldet ${r.size} Bytes, gesendet wurden ${bytes.length}.`);
    res.ged = { name: r.name, size: bytes.length };
    if (cfg.keep > 0) {
      const all = (await driveList()).filter(f => isBackup(f.name) && f.name.startsWith(base + "-sicherung-")).sort((a, b) => a.name < b.name ? 1 : -1);
      for (const f of all.slice(cfg.keep)) { await api(`${DRIVE}/files/${encodeURIComponent(f.id)}?fields=id`, { method: "PATCH", body: JSON.stringify({ trashed: true }) }); res.trashed++; }
    }
    try { res.zusSkip = !(await zusBackup()); } catch (e) {}
    if (cfg.view) {
      say("Ansicht wird abgelegt");
      try { res.view = await viewBackup(bytes, cfg); } catch (e) { res.viewErr = (e && e.message) || String(e); }
    }
    lsSet("st.bk.last", String(Date.now()));
    if (cfg.media && LM.list.length) {
      res.withMedia = true;
      say("Medien werden abgeglichen");
      res.media = await syncMedia((s) => say(`Medien ${s.done} von ${s.total}`));
    }
  } catch (e) { res.err = (e && e.message) || String(e); }
  finally { BK.busy = false; BK.msg = ""; lsSet("st.bk.info", JSON.stringify(res)); renderStatus(); }
  return res;
}

const toB64 = (u8) => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.slice(r.result.indexOf(",") + 1)); r.readAsDataURL(new Blob([u8])); });

async function pwKey(pw, salt, it, usage) {

async function decryptPayload(o, pw) {

}
async function shrinkToDataUrl(blob, maxPx, q) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));

}
async function collectViewerPhotos(mode, onProg) {
  const out = [], seen = new Set();

  const maxPx = mode === "main" ? 360 : 640;
  const jobs = [];
  for (const r of S.db.ofTag("INDI")) {
    const objs = mediaObjs(r).filter(o => IMG_RE.test(baseName(o.file)));
    for (const o of (mode === "main" ? objs.slice(0, 1) : objs)) {
      const hit = findMedia(o.file);
      if (hit && !seen.has(hit.id)) { seen.add(hit.id); jobs.push(hit); }

  let n = 0;
  for (const hit of jobs) {
    onProg && onProg(`Fotos ${++n} von ${jobs.length}`);
    try {
      const url = await shrinkToDataUrl(await mediaBlobFor(hit), maxPx, 0.72);
      if (chars + url.length > CAP) { skipped++; continue; }
      chars += url.length;

        const f = GED.famInfo(S.db, fid);

}
function colChart(obj, label) {

  if (!keys.length) return "";
  const all = []; for (let k = keys[0]; k <= keys[keys.length - 1]; k += label.step) all.push(k);
  const max = Math.max(...all.map(k => obj[k] || 0), 1);
  return `<div class="cols">${all.map(k => `<div class="col" title="${label.fmt(k)}: ${obj[k] || 0}"><i style="height:${((obj[k] || 0) / max * 100).toFixed(1)}%"></i><span>${label.short(k)}</span></div>`).join("")}</div>`;
}
